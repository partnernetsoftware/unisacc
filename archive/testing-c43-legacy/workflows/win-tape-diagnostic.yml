name: Windows U0 all-input Tape diagnostic r2
'on':
  workflow_dispatch:
    inputs:
      source_sha:
        required: true
        type: string
        description: Full approved 40-hex current source SHA
permissions:
  contents: read
jobs:
  linux-reference:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    strategy:
      fail-fast: false
      matrix:
        include: &id001
        - target: win/x86_64
          tag: win-x86_64
          runner: windows-latest
        - target: win/arm64
          tag: win-arm64
          runner: windows-11-arm
    defaults:
      run:
        shell: bash
    env:
      SOURCE_SHA: ${{ inputs.source_sha }}
      DIAG_TARGET: ${{ matrix.target }}
      DIAG_OUT: ${{ github.workspace }}-diag-${{ matrix.tag }}
      PYTHONDONTWRITEBYTECODE: '1'
      CFLAGS: -O2
      UNISACC_TIME_SCALE: '1'
      DIAG_MODE: linux
    steps:
    - run: git config --global core.autocrlf false
    - &id002
      uses: actions/checkout@v4
      with:
        ref: ${{ inputs.source_sha }}
        persist-credentials: false
    - name: Pin source
      run: 'python3 - <<''PY''

        import os,re,subprocess,pathlib

        sha=os.environ[''SOURCE_SHA''];assert re.fullmatch(''[0-9a-fA-F]{40}'',sha)

        assert subprocess.check_output([''git'',''rev-parse'',''HEAD'']).decode().strip().lower()==sha.lower()

        assert not subprocess.check_output([''git'',''status'',''--porcelain''])

        pathlib.Path(os.environ[''DIAG_OUT'']).mkdir(parents=True,exist_ok=True)

        PY'
    - name: Prepare Linux reference UA (not a test)
      run: 'python3 tests/bound.py 55 sh tests/build_ref.sh diag-ref.c diag-ua

        mkdir -p reference

        python3 tests/bound.py 10 sh tests/export_ref.sh reference/SELF.c'
    - name: 'All fixed inputs: -E, Tape -S, image; preserve compiler failures'
      run: "python3 - <<'PY'\nimport pathlib,subprocess,sys,os,time,json,hashlib,difflib,shutil\nout=pathlib.Path(os.environ['DIAG_OUT']);out.mkdir(parents=True,exist_ok=True)\n\
        mode=os.environ['DIAG_MODE'];target=os.environ['DIAG_TARGET'];ref=pathlib.Path('reference')/target.replace('/','-')\n\
        files=['examples/hello.c','tests/c/b_bitand.c','tests/c/a_arr3v.c','tests/c/a_struct2.c','tests/c/b_funcptr.c','tests/c/b_compound_result.c','reference/SELF.c']\n\
        stages=[('preprocess',['-E']),('tape',['-S']),('image',[])]\nrows=[];first_tape=None\nif mode=='windows':\n\
        \ ready=[json.loads(x) for x in (out/'prepare.stdout').read_text().splitlines() if x.startswith('{')];ua=pathlib.Path(ready[-1]['U0'])\n\
        else:ua=pathlib.Path('diag-ua').resolve()\ncompiler_sha=hashlib.sha256(ua.read_bytes()).hexdigest()\nreferences=json.loads((ref/'records.json').read_text())\
        \ if mode=='windows' else []\nfor i,name in enumerate(files):\n src=pathlib.Path(name);source_sha=hashlib.sha256(src.read_bytes()).hexdigest()\n\
        \ for stage,flags in stages:\n  prefix=f'{i:02}-{stage}';argv=[sys.executable,'tests/bound.py','10',str(ua),name,'-O2','-b',target,*flags];start=time.monotonic()\n\
        \  with (out/(prefix+'.out')).open('wb') as f,(out/(prefix+'.err')).open('wb') as e:rc=subprocess.run(argv,stdout=f,stderr=e).returncode\n\
        \  data=(out/(prefix+'.out')).read_bytes();row={'input':name,'source_sha256':source_sha,'compiler_sha256':compiler_sha,'stage':stage,'argv':argv,'rc':rc,'seconds_monotonic':time.monotonic()-start,'stdout_sha256':hashlib.sha256(data).hexdigest(),'stderr_sha256':hashlib.sha256((out/(prefix+'.err')).read_bytes()).hexdigest()}\n\
        \  if stage=='tape':row['unexpected_image_magic']=data.startswith((b'MZ',b'\\x7fELF'))\n  if mode=='windows':\n\
        \   expected=next(x for x in references if x['input']==name and x['stage']==stage);rd=(ref/(prefix+'.out')).read_bytes();assert\
        \ source_sha==expected['source_sha256'],'INPUT_IDENTITY_MISMATCH'\n   row['reference_rc']=expected['rc'];row['same_bytes']=data==rd;row['same_success']=rc==expected['rc']==0\
        \ and data==rd\n   if not row['same_success']:\n    row['first_byte_offset']=next((n for n,(a,b) in enumerate(zip(data,rd))\
        \ if a!=b),min(len(data),len(rd)));row['actual_bytes']=len(data);row['reference_bytes']=len(rd)\n    if\
        \ stage=='tape' and first_tape is None:\n     first_tape=row.copy();shutil.copyfile(ref/(prefix+'.out'),out/'first-tape-reference.txt');shutil.copyfile(out/(prefix+'.out'),out/'first-tape-windows.txt')\n\
        \     diff=list(difflib.unified_diff(rd.decode('utf-8',errors='replace').splitlines(True),data.decode('utf-8',errors='replace').splitlines(True),fromfile='Linux-reference.Tape',tofile='Windows-U0.Tape'))\n\
        \     (out/'first-tape-diff.txt').write_text(''.join(diff));(out/'first-tape-diff-first40.txt').write_text(''.join(diff[:40]))\n\
        \  rows.append(row);(out/'records.json').write_text(json.dumps(rows,indent=2)+'\\n')\nsummary={stage:{'total':len([x\
        \ for x in rows if x['stage']==stage]),'nonzero':[x['input'] for x in rows if x['stage']==stage and x['rc']!=0],'different':[x['input']\
        \ for x in rows if x['stage']==stage and x.get('same_success') is False]} for stage,_ in stages}\n(out/'STAGE-SUMMARY.json').write_text(json.dumps({'scope':'DIAGNOSTIC_ONLY_NOT_CELL_PASS','summary':summary,'first_tape_difference':first_tape},indent=2)+'\\\
        n')\n# Compiler failure/difference is data: continue all cases. Only identity/tool/harness failures stop.\n\
        \nPY"
    - name: Index raw evidence
      if: always()
      run: 'python3 - <<''PY''

        import os,pathlib,json,hashlib

        p=pathlib.Path(os.environ[''DIAG_OUT'']);p.mkdir(parents=True,exist_ok=True)

        files={x.relative_to(p).as_posix():{''bytes'':x.stat().st_size,''sha256'':hashlib.sha256(x.read_bytes()).hexdigest()}
        for x in p.rglob(''*'') if x.is_file() and x.name!=''EVIDENCE.json''}

        (p/''EVIDENCE.json'').write_text(json.dumps(files,indent=2)+''\n'')

        PY'
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: linux-reference-${{ matrix.tag }}
        path: ${{ env.DIAG_OUT }}/
        if-no-files-found: error
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: shared-self-${{ matrix.tag }}
        path: reference/SELF.c
        if-no-files-found: error
  windows-diagnostic:
    needs: linux-reference
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 6
    strategy:
      fail-fast: false
      matrix:
        include: *id001
    defaults:
      run:
        shell: bash
    env:
      SOURCE_SHA: ${{ inputs.source_sha }}
      DIAG_TARGET: ${{ matrix.target }}
      DIAG_OUT: ${{ github.workspace }}-diag-${{ matrix.tag }}
      PYTHONDONTWRITEBYTECODE: '1'
      CFLAGS: -O2
      UNISACC_TIME_SCALE: '1'
      DIAG_MODE: windows
      UNISACC_MODEL_CACHE: ${{ github.workspace }}-diag-cache-${{ matrix.tag }}
      TMPDIR: ${{ github.workspace }}-diag-tmp-${{ matrix.tag }}
    steps:
    - run: git config --global core.autocrlf false
    - *id002
    - name: Pin source
      run: 'python3 - <<''PY''

        import os,re,subprocess,pathlib

        sha=os.environ[''SOURCE_SHA''];assert re.fullmatch(''[0-9a-fA-F]{40}'',sha)

        assert subprocess.check_output([''git'',''rev-parse'',''HEAD'']).decode().strip().lower()==sha.lower()

        assert not subprocess.check_output([''git'',''status'',''--porcelain''])

        pathlib.Path(os.environ[''DIAG_OUT'']).mkdir(parents=True,exist_ok=True)

        PY'
    - uses: actions/download-artifact@v4
      with:
        name: linux-reference-${{ matrix.tag }}
        path: reference/${{ matrix.tag }}
    - uses: actions/download-artifact@v4
      with:
        name: shared-self-${{ matrix.tag }}
        path: reference
    - name: Create private preparation directories
      run: python3 -c "import os,pathlib;[pathlib.Path(os.environ[k]).mkdir(parents=True,exist_ok=True) for k in
        ('TMPDIR','UNISACC_MODEL_CACHE')]"
    - name: Fresh formal Windows U0 prepare only
      run: 'python3 - <<''PY''

        import os,pathlib,subprocess,sys,time,json

        p=pathlib.Path(os.environ[''DIAG_OUT'']);a=[sys.executable,''tests/bound.py'',''55'',''sh'',''tests/nativeboot.sh'',''--host-triple-prepare''];t=time.monotonic()

        with (p/''prepare.stdout'').open(''wb'') as o,(p/''prepare.stderr'').open(''wb'') as e:r=subprocess.run(a,stdout=o,stderr=e).returncode

        (p/''prepare.json'').write_text(json.dumps({''argv'':a,''rc'':r,''seconds_monotonic'':time.monotonic()-t})+''\n'')

        sys.exit(r)

        PY'
    - name: 'All fixed inputs: -E, Tape -S, image; preserve compiler failures'
      run: "python3 - <<'PY'\nimport pathlib,subprocess,sys,os,time,json,hashlib,difflib,shutil\nout=pathlib.Path(os.environ['DIAG_OUT']);out.mkdir(parents=True,exist_ok=True)\n\
        mode=os.environ['DIAG_MODE'];target=os.environ['DIAG_TARGET'];ref=pathlib.Path('reference')/target.replace('/','-')\n\
        files=['examples/hello.c','tests/c/b_bitand.c','tests/c/a_arr3v.c','tests/c/a_struct2.c','tests/c/b_funcptr.c','tests/c/b_compound_result.c','reference/SELF.c']\n\
        stages=[('preprocess',['-E']),('tape',['-S']),('image',[])]\nrows=[];first_tape=None\nif mode=='windows':\n\
        \ ready=[json.loads(x) for x in (out/'prepare.stdout').read_text().splitlines() if x.startswith('{')];ua=pathlib.Path(ready[-1]['U0'])\n\
        else:ua=pathlib.Path('diag-ua').resolve()\ncompiler_sha=hashlib.sha256(ua.read_bytes()).hexdigest()\nreferences=json.loads((ref/'records.json').read_text())\
        \ if mode=='windows' else []\nfor i,name in enumerate(files):\n src=pathlib.Path(name);source_sha=hashlib.sha256(src.read_bytes()).hexdigest()\n\
        \ for stage,flags in stages:\n  prefix=f'{i:02}-{stage}';argv=[sys.executable,'tests/bound.py','10',str(ua),name,'-O2','-b',target,*flags];start=time.monotonic()\n\
        \  with (out/(prefix+'.out')).open('wb') as f,(out/(prefix+'.err')).open('wb') as e:rc=subprocess.run(argv,stdout=f,stderr=e).returncode\n\
        \  data=(out/(prefix+'.out')).read_bytes();row={'input':name,'source_sha256':source_sha,'compiler_sha256':compiler_sha,'stage':stage,'argv':argv,'rc':rc,'seconds_monotonic':time.monotonic()-start,'stdout_sha256':hashlib.sha256(data).hexdigest(),'stderr_sha256':hashlib.sha256((out/(prefix+'.err')).read_bytes()).hexdigest()}\n\
        \  if stage=='tape':row['unexpected_image_magic']=data.startswith((b'MZ',b'\\x7fELF'))\n  if mode=='windows':\n\
        \   expected=next(x for x in references if x['input']==name and x['stage']==stage);rd=(ref/(prefix+'.out')).read_bytes();assert\
        \ source_sha==expected['source_sha256'],'INPUT_IDENTITY_MISMATCH'\n   row['reference_rc']=expected['rc'];row['same_bytes']=data==rd;row['same_success']=rc==expected['rc']==0\
        \ and data==rd\n   if not row['same_success']:\n    row['first_byte_offset']=next((n for n,(a,b) in enumerate(zip(data,rd))\
        \ if a!=b),min(len(data),len(rd)));row['actual_bytes']=len(data);row['reference_bytes']=len(rd)\n    if\
        \ stage=='tape' and first_tape is None:\n     first_tape=row.copy();shutil.copyfile(ref/(prefix+'.out'),out/'first-tape-reference.txt');shutil.copyfile(out/(prefix+'.out'),out/'first-tape-windows.txt')\n\
        \     diff=list(difflib.unified_diff(rd.decode('utf-8',errors='replace').splitlines(True),data.decode('utf-8',errors='replace').splitlines(True),fromfile='Linux-reference.Tape',tofile='Windows-U0.Tape'))\n\
        \     (out/'first-tape-diff.txt').write_text(''.join(diff));(out/'first-tape-diff-first40.txt').write_text(''.join(diff[:40]))\n\
        \  rows.append(row);(out/'records.json').write_text(json.dumps(rows,indent=2)+'\\n')\nsummary={stage:{'total':len([x\
        \ for x in rows if x['stage']==stage]),'nonzero':[x['input'] for x in rows if x['stage']==stage and x['rc']!=0],'different':[x['input']\
        \ for x in rows if x['stage']==stage and x.get('same_success') is False]} for stage,_ in stages}\n(out/'STAGE-SUMMARY.json').write_text(json.dumps({'scope':'DIAGNOSTIC_ONLY_NOT_CELL_PASS','summary':summary,'first_tape_difference':first_tape},indent=2)+'\\\
        n')\n# Compiler failure/difference is data: continue all cases. Only identity/tool/harness failures stop.\n\
        \nPY"
    - name: Index all raw artifacts even on first stop
      if: always()
      run: 'python3 - <<''PY''

        import os,pathlib,json,hashlib

        p=pathlib.Path(os.environ[''DIAG_OUT'']);p.mkdir(parents=True,exist_ok=True)

        files={x.relative_to(p).as_posix():{''bytes'':x.stat().st_size,''sha256'':hashlib.sha256(x.read_bytes()).hexdigest()}
        for x in p.rglob(''*'') if x.is_file() and x.name!=''EVIDENCE.json''}

        (p/''EVIDENCE.json'').write_text(json.dumps(files,indent=2)+''\n'')

        PY'
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: windows-tape-diagnostic-${{ matrix.tag }}-${{ github.run_id }}
        path: ${{ env.DIAG_OUT }}/
        if-no-files-found: error
