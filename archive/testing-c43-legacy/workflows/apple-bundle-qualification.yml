name: Apple bundle qualification (no signing)
on:
  workflow_dispatch:
permissions:
  contents: read
  packages: read
jobs:
  bundle:
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        include:
          - {runner: macos-15, arch: arm64, oras_arch: arm64}
          - {runner: macos-15-intel, arch: x86_64, oras_arch: amd64}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
        timeout-minutes: 1
      - name: Bootstrap existing native watchdog (no Python)
        timeout-minutes: 1
        run: |
          set -euo pipefail
          # This single infrastructure compile has the platform's exact60s
          # step ceiling. It does not build a product compiler.
          /usr/bin/cc -std=c99 -O2 -Wall -Wextra tests/bound.c -o "$RUNNER_TEMP/bound"
      - name: Verify native architecture and reject Rosetta
        timeout-minutes: 1
        run: |
          "$RUNNER_TEMP/bound" 50 /bin/bash -euo pipefail <<'SH'
          "$RUNNER_TEMP/bound" 8 /usr/bin/uname -m > "$RUNNER_TEMP/native-arch"
          test "$(cat "$RUNNER_TEMP/native-arch")" = '${{ matrix.arch }}'
          translated=$("$RUNNER_TEMP/bound" 8 /usr/sbin/sysctl -n sysctl.proc_translated 2>/dev/null || echo 0)
          test "$translated" = 0
          SH
      - name: Install fixed ORAS version
        timeout-minutes: 1
        run: |
          "$RUNNER_TEMP/bound" 50 /bin/bash -euo pipefail <<'SH'
          b() { "$RUNNER_TEMP/bound" 40 "$@"; }
          b /usr/bin/curl -fsSL --connect-timeout 10 --max-time 35 "https://github.com/oras-project/oras/releases/download/v1.2.0/oras_1.2.0_darwin_${{ matrix.oras_arch }}.tar.gz" -o "$RUNNER_TEMP/oras.tar.gz"
          "$RUNNER_TEMP/bound" 8 /usr/bin/tar -xzf "$RUNNER_TEMP/oras.tar.gz" -C "$RUNNER_TEMP" oras
          "$RUNNER_TEMP/bound" 8 /bin/chmod +x "$RUNNER_TEMP/oras"
          SH
      - name: Authenticate read-only package pull
        timeout-minutes: 1
        env:
          GHCR_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          printf '%s' "$GHCR_TOKEN" | "$RUNNER_TEMP/bound" 20 "$RUNNER_TEMP/oras" login ghcr.io -u '${{ github.actor }}' --password-stdin
      - name: Pull immutable three-member candidate
        timeout-minutes: 1
        run: |
          "$RUNNER_TEMP/bound" 50 /bin/bash -euo pipefail <<'SH'
          ref=$("$RUNNER_TEMP/bound" 8 jq -er .ref release/candidate.json)
          [[ "$ref" =~ ^ghcr\.io/partnernetsoftware/unisacc-candidate@sha256:[0-9a-f]{64}$ ]]
          "$RUNNER_TEMP/bound" 40 "$RUNNER_TEMP/oras" pull "$ref" --output "$RUNNER_TEMP/candidate"
          SH
      - name: Verify bytes, paired sidecar, version and install bootstrap
        timeout-minutes: 1
        run: |
          "$RUNNER_TEMP/bound" 50 /bin/bash -euo pipefail <<'SH'
          b() { "$RUNNER_TEMP/bound" 8 "$@"; }
          sha=2974978e6deec45abf38bfac2ac24e3031969b1c65009798270491d8b1e6dd1f
          src=c90f0002f02366d510e4c8c22d4757f934edf8c0719852e706b575a7137b47df
          b jq -e --arg sha "$sha" --arg src "$src" '.version=="0.0.43" and .bytes==2670411 and .unisacc_com_sha256==$sha and .sources_sha256==$src' release/candidate.json
          for name in unisacc.com unisacc.com.build.json models.json; do
            p="$RUNNER_TEMP/candidate/$name"; test -f "$p" && test -s "$p" && test ! -L "$p"
          done
          got=$(b /usr/bin/openssl dgst -sha256 "$RUNNER_TEMP/candidate/unisacc.com"); test "${got##* }" = "$sha"
          b jq -e --arg sha "$sha" --arg src "$src" '.schema==1 and .artifact_sha256==$sha and .sources_sha256==$src and .bytes==2670411' "$RUNNER_TEMP/candidate/unisacc.com.build.json"
          b jq -e 'type=="object"' "$RUNNER_TEMP/candidate/models.json"
          size=$(b /usr/bin/wc -c < "$RUNNER_TEMP/candidate/unisacc.com"); test "${size//[[:space:]]/}" = 2670411
          test ! -e unisacc.com && test ! -L unisacc.com
          test ! -e unisacc.com.build.json && test ! -L unisacc.com.build.json
          b /bin/cp "$RUNNER_TEMP/candidate/unisacc.com" unisacc.com
          b /bin/cp "$RUNNER_TEMP/candidate/unisacc.com.build.json" unisacc.com.build.json
          b /bin/chmod +x unisacc.com
          test "$(b /bin/sh ./unisacc.com --version)" = 'unisacc 0.0.43'
          SH
      - name: Verify root product closure with native ident default-run
        timeout-minutes: 1
        run: |
          "$RUNNER_TEMP/bound" 50 /bin/sh ./unisacc.com -Iseed seed/ident.c -- . check unisacc.com
      - name: Stage only service-owned builder inputs
        timeout-minutes: 1
        run: |
          "$RUNNER_TEMP/bound" 50 /bin/bash -euo pipefail <<'SH'
          b() { "$RUNNER_TEMP/bound" 8 "$@"; }
          service="$RUNNER_TEMP/service"
          b /bin/mkdir -m 700 "$service"
          b /bin/mkdir -m 700 "$service/cxlib" "$service/vendor" "$service/vendor/release" "$service/vendor/src" "$RUNNER_TEMP/qualification"
          b /bin/cp tests/macosbundle.cx "$service/bundle-build.cx"
          b /bin/cp tests/cxlib/pyjson.cx "$service/cxlib/pyjson.cx"
          b /bin/cp release/macos-launcher.c "$service/vendor/release/macos-launcher.c"
          b /bin/cp src/version.h "$service/vendor/src/version.h"
          b /usr/bin/cmp "$service/bundle-build.cx" tests/macosbundle.cx
          b /usr/bin/cmp "$service/cxlib/pyjson.cx" tests/cxlib/pyjson.cx
          b /usr/bin/cmp "$service/vendor/release/macos-launcher.c" release/macos-launcher.c
          b /usr/bin/cmp "$service/vendor/src/version.h" src/version.h
          b /usr/bin/git rev-parse HEAD > "$RUNNER_TEMP/qualification/source-head"
          b /bin/cp release/candidate.json "$RUNNER_TEMP/qualification/candidate.json"
          SH
      - name: Prepare original native suite plan without provider prerequisites
        timeout-minutes: 1
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/bound" 50 /usr/bin/env GATE_BOUND=1 TERM_SH_INSIDE=1 /bin/sh tests/gate.sh --plan > "$RUNNER_TEMP/qualification/bound-plan.nul"
      - name: Import complete plan through existing native catalog
        timeout-minutes: 1
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/bound" 50 /bin/sh ./unisacc.com tests/suite/catalog.cx -- "$RUNNER_TEMP/qualification/bound-plan.nul" "$RUNNER_TEMP/qualification/bound-catalog.tsv"
      - name: Check original watchdog and Terminal ownership assertions
        timeout-minutes: 1
        run: |
          set -euo pipefail
          # Import the existing bound unit verbatim; all original Darwin assertions remain.
          "$RUNNER_TEMP/bound" 8 /usr/bin/shasum -a 256 tests/boundcheck.py tests/bound.py tests/bound.c tests/term.sh tests/cxbin tests/safedel.cx tests/gate.sh tests/suite/catalog.cx tests/suite/run.cx > "$RUNNER_TEMP/qualification/bound-inputs.sha256"
          out="$RUNNER_TEMP/qualification/bound-run"
          runner_rc=0
          "$RUNNER_TEMP/bound" 55 /bin/sh ./unisacc.com tests/suite/run.cx -- "$RUNNER_TEMP/qualification/bound-plan.nul" "$RUNNER_TEMP/qualification/bound-catalog.tsv" "$out" --unit bound --independent --limit 55 --parent-container-unset > "$RUNNER_TEMP/qualification/bound-runner.log" 2>&1 || runner_rc=$?
          printf '%s\n' "$runner_rc" > "$RUNNER_TEMP/qualification/bound-runner.status"
          printf '%s\n' "$runner_rc" > "$RUNNER_TEMP/qualification/bound.status"
          : > "$RUNNER_TEMP/qualification/bound.log"
          for stream in stdout stderr; do
            set -- "$out"/*."$stream"
            if test "$#" = 1 && test -f "$1"; then
              cat "$1" >> "$RUNNER_TEMP/qualification/bound.log"
            else
              printf 'original bound %s unavailable; runner did not complete capture\n' "$stream" >> "$RUNNER_TEMP/qualification/bound.log"
            fi
          done
          set -- "$out"/*.rc
          test "$#" = 1 && test -f "$1"
          read -r oracle_rc < "$1"
          [[ "$oracle_rc" =~ ^[0-9]+$ ]] && test "$oracle_rc" -le 255
          printf '%s\n' "$oracle_rc" > "$RUNNER_TEMP/qualification/bound.status"
          test "$runner_rc" = 0
          test "$oracle_rc" = 0
      - name: Build actual universal CLI bundle (prepare only)
        timeout-minutes: 1
        run: |
          # Trust only the runner-owned temp root for existing cleanup guards.
          TMPDIR="$RUNNER_TEMP" "$RUNNER_TEMP/bound" 50 /bin/bash -euo pipefail <<'SH'
          source=$("$RUNNER_TEMP/bound" 8 /usr/bin/git rev-parse HEAD)
          "$RUNNER_TEMP/bound" 45 /bin/sh ./unisacc.com "$RUNNER_TEMP/service/bundle-build.cx" -- "$RUNNER_TEMP/app" "$PWD/unisacc.com" 2974978e6deec45abf38bfac2ac24e3031969b1c65009798270491d8b1e6dd1f "$source" 0.0.43 "$RUNNER_TEMP/service" > "$RUNNER_TEMP/qualification/build.log" 2>&1
          SH
      - name: Exercise bundle CLI and own default-run marker
        timeout-minutes: 1
        run: |
          "$RUNNER_TEMP/bound" 50 /bin/bash -euo pipefail <<'SH'
          b() { "$RUNNER_TEMP/bound" 8 "$@"; }
          entry="$RUNNER_TEMP/app/Unisacc.app/Contents/MacOS/unisacc"
          b /usr/bin/plutil -lint "$RUNNER_TEMP/app/Unisacc.app/Contents/Info.plist"
          test "$(b "$entry" --version)" = 'unisacc 0.0.43'
          printf 'int main(void){puts("APPLE_BUNDLE_DEFAULT_RUN_OK");return 0;}\n' > "$RUNNER_TEMP/marker.cx"
          b "$entry" "$RUNNER_TEMP/marker.cx" > "$RUNNER_TEMP/qualification/default-run.log"
          test "$(cat "$RUNNER_TEMP/qualification/default-run.log")" = APPLE_BUNDLE_DEFAULT_RUN_OK
          b /usr/bin/lipo -info "$entry" > "$RUNNER_TEMP/qualification/lipo.log"
          b jq -e '.schema==1 and .release_eligible==false and .inner_ape_apple_signature==false and (.build|length)==3' "$RUNNER_TEMP/app/qualification.json"
          b /bin/cp "$RUNNER_TEMP/app/qualification.json" "$RUNNER_TEMP/qualification/qualification.json"
          SH
      - name: ZIP and replay only a self-created xattr marker
        timeout-minutes: 1
        run: |
          "$RUNNER_TEMP/bound" 50 /bin/bash -euo pipefail <<'SH'
          b() { "$RUNNER_TEMP/bound" 10 "$@"; }
          app="$RUNNER_TEMP/app/Unisacc.app"
          b /usr/bin/xattr -w com.partnernetsoftware.unisacc.qualification own-marker-only "$app"
          b /usr/bin/xattr -w com.partnernetsoftware.unisacc.qualification nested-marker-only "$app/Contents"
          b /usr/bin/xattr -w com.partnernetsoftware.unisacc.qualification file-marker-only "$app/Contents/Resources/payload.sha256"
          b /usr/bin/xattr -lr "$app" > "$RUNNER_TEMP/qualification/source-xattrs.log"
          b /bin/mkdir -m 700 "$RUNNER_TEMP/transport-parent"
          test ! -e "$RUNNER_TEMP/transport-parent/Unisacc.app" && test ! -L "$RUNNER_TEMP/transport-parent/Unisacc.app"
          b /usr/bin/env -u COPYFILE_DISABLE -u DITTONORSRC /usr/bin/ditto --rsrc --extattr "$app" "$RUNNER_TEMP/transport-parent/Unisacc.app"
          b /usr/bin/xattr -lr "$RUNNER_TEMP/transport-parent/Unisacc.app" > "$RUNNER_TEMP/qualification/staged-xattrs.log"
          test "$(b /usr/bin/xattr -p com.partnernetsoftware.unisacc.qualification "$RUNNER_TEMP/transport-parent/Unisacc.app")" = own-marker-only
          test "$(b /usr/bin/xattr -p com.partnernetsoftware.unisacc.qualification "$RUNNER_TEMP/transport-parent/Unisacc.app/Contents")" = nested-marker-only
          test "$(b /usr/bin/xattr -p com.partnernetsoftware.unisacc.qualification "$RUNNER_TEMP/transport-parent/Unisacc.app/Contents/Resources/payload.sha256")" = file-marker-only
          b /usr/bin/env -u COPYFILE_DISABLE -u DITTONORSRC /usr/bin/ditto --rsrc --extattr -c -k "$RUNNER_TEMP/transport-parent" "$RUNNER_TEMP/bundle-qualification.zip"
          b /usr/bin/unzip -Z1 "$RUNNER_TEMP/bundle-qualification.zip" > "$RUNNER_TEMP/qualification/zip-members.log"
          b /usr/bin/unzip -Zv "$RUNNER_TEMP/bundle-qualification.zip" > "$RUNNER_TEMP/qualification/zip-headers.log"
          b /bin/mkdir -m 700 "$RUNNER_TEMP/replay"
          b /usr/bin/env -u COPYFILE_DISABLE -u DITTONORSRC /usr/bin/ditto --rsrc --extattr -x -k "$RUNNER_TEMP/bundle-qualification.zip" "$RUNNER_TEMP/replay"
          b /usr/bin/xattr -lr "$RUNNER_TEMP/replay/Unisacc.app" > "$RUNNER_TEMP/qualification/replay-xattrs.log"
          # Direct-root control isolates archive traversal context; never repair replay attributes.
          b /usr/bin/env -u COPYFILE_DISABLE -u DITTONORSRC /usr/bin/ditto --rsrc --extattr -c -k --keepParent "$app" "$RUNNER_TEMP/direct-control.zip"
          b /usr/bin/unzip -Z1 "$RUNNER_TEMP/direct-control.zip" > "$RUNNER_TEMP/qualification/direct-members.log"
          b /bin/mkdir -m 700 "$RUNNER_TEMP/direct-replay"
          b /usr/bin/env -u COPYFILE_DISABLE -u DITTONORSRC /usr/bin/ditto --rsrc --extattr -x -k "$RUNNER_TEMP/direct-control.zip" "$RUNNER_TEMP/direct-replay"
          b /usr/bin/xattr -lr "$RUNNER_TEMP/direct-replay/Unisacc.app" > "$RUNNER_TEMP/qualification/direct-xattrs.log"
          if b /usr/bin/xattr -p com.partnernetsoftware.unisacc.qualification "$RUNNER_TEMP/direct-replay/Unisacc.app" > "$RUNNER_TEMP/qualification/direct-marker.log" 2> "$RUNNER_TEMP/qualification/direct-marker.stderr"; then
            direct_rc=0
          else
            direct_rc=$?
          fi
          printf '%s\n' "$direct_rc" > "$RUNNER_TEMP/qualification/direct-marker.status"
          b /usr/bin/unzip -Zv "$RUNNER_TEMP/direct-control.zip" > "$RUNNER_TEMP/qualification/direct-headers.log"
          # Historical sequestered layout control, also recorded without repairing attributes.
          b /usr/bin/env -u COPYFILE_DISABLE -u DITTONORSRC /usr/bin/ditto --rsrc --extattr -c -k --sequesterRsrc --keepParent "$app" "$RUNNER_TEMP/sequestered-control.zip"
          b /usr/bin/unzip -Z1 "$RUNNER_TEMP/sequestered-control.zip" > "$RUNNER_TEMP/qualification/sequestered-members.log"
          b /bin/mkdir -m 700 "$RUNNER_TEMP/sequestered-replay"
          b /usr/bin/env -u COPYFILE_DISABLE -u DITTONORSRC /usr/bin/ditto --rsrc --extattr -x -k "$RUNNER_TEMP/sequestered-control.zip" "$RUNNER_TEMP/sequestered-replay"
          b /usr/bin/xattr -lr "$RUNNER_TEMP/sequestered-replay/Unisacc.app" > "$RUNNER_TEMP/qualification/sequestered-xattrs.log"
          if b /usr/bin/xattr -p com.partnernetsoftware.unisacc.qualification "$RUNNER_TEMP/sequestered-replay/Unisacc.app" > "$RUNNER_TEMP/qualification/sequestered-marker.log" 2> "$RUNNER_TEMP/qualification/sequestered-marker.stderr"; then
            control_rc=0
          else
            control_rc=$?
          fi
          printf '%s\n' "$control_rc" > "$RUNNER_TEMP/qualification/sequestered-marker.status"
          b /usr/bin/unzip -Zv "$RUNNER_TEMP/sequestered-control.zip" > "$RUNNER_TEMP/qualification/sequestered-headers.log"
          for layout in direct sequestered; do
            for scope in nested file; do
              target="$RUNNER_TEMP/$layout-replay/Unisacc.app/Contents"
              if test "$scope" = file; then target="$target/Resources/payload.sha256"; fi
              if b /usr/bin/xattr -p com.partnernetsoftware.unisacc.qualification "$target" > "$RUNNER_TEMP/qualification/$layout-$scope-marker.log" 2> "$RUNNER_TEMP/qualification/$layout-$scope-marker.stderr"; then
                marker_rc=0
              else
                marker_rc=$?
              fi
              printf '%s\n' "$marker_rc" > "$RUNNER_TEMP/qualification/$layout-$scope-marker.status"
            done
          done
          test "$(b /usr/bin/xattr -p com.partnernetsoftware.unisacc.qualification "$RUNNER_TEMP/replay/Unisacc.app")" = own-marker-only
          test "$(b /usr/bin/xattr -p com.partnernetsoftware.unisacc.qualification "$RUNNER_TEMP/replay/Unisacc.app/Contents")" = nested-marker-only
          test "$(b /usr/bin/xattr -p com.partnernetsoftware.unisacc.qualification "$RUNNER_TEMP/replay/Unisacc.app/Contents/Resources/payload.sha256")" = file-marker-only
          b /usr/bin/cmp "$app/Contents/Resources/unisacc.com" "$RUNNER_TEMP/replay/Unisacc.app/Contents/Resources/unisacc.com"
          b /usr/bin/cmp "$app/Contents/Resources/payload.sha256" "$RUNNER_TEMP/replay/Unisacc.app/Contents/Resources/payload.sha256"
          test "$(b "$RUNNER_TEMP/replay/Unisacc.app/Contents/MacOS/unisacc" --version)" = 'unisacc 0.0.43'
          printf '%s\n' 'Own xattr marker survived ditto ZIP/replay; NOT a signature, staple, notarization or quarantine proof. release_eligible=false' > "$RUNNER_TEMP/qualification/transport.log"
          SH
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        timeout-minutes: 1
        with:
          name: apple-bundle-qualification-${{ matrix.arch }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/qualification/
            ${{ runner.temp }}/app/command-failure.json
            ${{ runner.temp }}/app/capture-*.stdout
            ${{ runner.temp }}/app/capture-*.stderr
          if-no-files-found: warn
          retention-days: 14
# No environment, signing credentials, provider call, compiler build/upload,
# notarization, release upload or publication. Inspect each actual run's evidence.
# Watchdog bootstrap and checkout/upload use platform60s step ceilings;
# subsequent shell payloads have native bounds<=50s. No claim of55s action caps.
