<!DOCTYPE html>
<html lang="zh"><head>
<meta charset="utf-8"/><title>gpu-tri</title>
<style>
html,body{margin:0;height:100%;background:#1a334d;color:#eee;font:13px sans-serif}
#hud{position:fixed;left:8px;top:8px;z-index:2;background:rgba(0,0,0,.5);padding:6px 8px}
canvas{display:block;width:256px;height:256px}
</style></head>
<body>
<div id="hud">gpu-tri</div>
<canvas id="view" width="256" height="256"></canvas>
<script src="../host1-runtime.js"></script>
<script src="tri-b64.js"></script>
<script src="tri-oracle.js"></script>
<script type="module">
import { createBrowserHost } from "../../host-browser.js";
const AUTO=/(?:\?|&)auto=1(?:&|$)/.test(location.search);
const ORACLE_FNV=window.GPU_TRI_FNV;
function fnv1a(buf){
  const u=new Uint8Array(buf);
  let h=2166136261;
  for(let i=0;i<u.length;i++){ h^=u[i]; h=Math.imul(h,16777619)>>>0; }
  return h;
}
function near(a,b,tol){ return Math.abs(a-b)<=tol; }
(async()=>{
  const canvas=document.getElementById("view");
  const hud=document.getElementById("hud");
  let gpu_fnv=0, packet_ok=0, pixel="UNMEASURED", err=null, pkt=null;
  window.onHostGpuSubmit=function(ab){ pkt=ab; gpu_fnv=fnv1a(ab); };
  try{
    const rt=await host1Boot(window.GPU_TRI_WASM);
    rt.goldI64();
    packet_ok=(gpu_fnv===ORACLE_FNV)?1:0;
  }catch(e){ err=String(e&&e.message||e); }
  try{
    if(pkt){
      const host=await createBrowserHost(canvas,{prefer:"webgl"});
      host.host_gpu_submit(pkt);
      host.host_frame_present();
      await new Promise(r=>requestAnimationFrame(()=>requestAnimationFrame(r)));
      const gl=canvas.getContext("webgl")||canvas.getContext("webgl2");
      if(gl){
        const c=new Uint8Array(4), m=new Uint8Array(4);
        gl.readPixels(2,2,1,1,gl.RGBA,gl.UNSIGNED_BYTE,c);
        gl.readPixels(128,128,1,1,gl.RGBA,gl.UNSIGNED_BYTE,m);
        const clear=near(c[0],26,8)&&near(c[1],51,8)&&near(c[2],77,8);
        const mid=!near(m[0],c[0],4)||!near(m[1],c[1],4)||!near(m[2],c[2],4);
        pixel=(clear&&mid)?"ok":"fail";
        window.__UXE_PX__={c:[c[0],c[1],c[2],c[3]],m:[m[0],m[1],m[2],m[3]]};
      }
    }
  }catch(e){ if(!err) err=String(e&&e.message||e); }
  window.__UXE__={gpu_fnv,packet_ok,pixel,oracle:ORACLE_FNV,err,auto:AUTO?1:0,px:window.__UXE_PX__||null};
  let title="GPU_TRI_FAIL";
  if(packet_ok&&pixel==="ok") title="GPU_TRI_OK";
  else if(packet_ok&&pixel==="UNMEASURED") title="GPU_TRI_UNMEASURED";
  else if(packet_ok) title="GPU_TRI_PKT";
  document.title=title;
  hud.textContent=title+" fnv="+gpu_fnv+" pixel="+pixel+(err?" "+err:"");
})();
</script></body></html>
