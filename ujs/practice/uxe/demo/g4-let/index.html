<!DOCTYPE html>
<html lang="zh"><head>
<meta charset="utf-8"/><title>g4-let</title>
<!-- let-b64.js persist g4-let-yaw.ujs; red-b64.js 红夹具 g4-let-red.ujs; ?red=1 只用红 -->
</head><body>
<div id="hud">g4-let</div>
<script src="../host1-runtime.js"></script>
<script src="let-b64.js"></script>
<script src="red-b64.js"></script>
<script>
(async function(){
  var hud=document.getElementById("hud");
  var useRed=/(?:^|[?&])red=1(?:&|$)/.test(location.search);
  var wasm=useRed?window.G4_LET_RED_WASM:window.G4_LET_WASM;
  var s="", red=1, ok=1, i, v;
  try{
    var rt=await host1Boot(wasm);
    for(i=1;i<=8;i++){
      v=rt.goldI64();
      if(i>1) s+=",";
      s+=String(v);
      if(v!==1) red=0;
      if(v!==i) ok=0;
    }
  }catch(e){
    document.title="G4_LET_FAIL";
    hud.textContent=String(e&&e.message||e);
    return;
  }
  document.title=ok?"G4_LET_OK":(red?"G4_LET_RED":"G4_LET_FAIL");
  hud.textContent=document.title+" "+s;
})();
</script>
</body></html>
