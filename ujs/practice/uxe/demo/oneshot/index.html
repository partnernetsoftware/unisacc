<!DOCTYPE html>
<html lang="zh"><head>
<meta charset="utf-8"/><title>oneshot-host1</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#101018;color:#ddd;font:13px sans-serif}
#hud{position:fixed;left:10px;top:10px;z-index:2}
canvas{display:block;width:100%;height:100%}
</style></head>
<body>
<div id="hud">drag · UXE GL · no three</div>
<canvas id="view"></canvas>
<script src="../host1-runtime.js"></script>
<script src="oneshot-b64.js"></script>
<script type="module">
import { createWebGLRenderer } from "../../renderer-webgl.js";
import { Scene, PerspectiveCamera } from "../../scene.js";
import { MESH_BOX, MESH_OCTA } from "../../meshes.js";
const AUTO=/(?:\?|&)auto=1(?:&|$)/.test(location.search);
let ang=0, drag=0, lx=0, ok=0, box=[];
window.addEventListener("mousedown",e=>{ drag=1; lx=e.clientX; });
window.addEventListener("mouseup",()=>{ drag=0; });
window.addEventListener("mousemove",e=>{ if(drag){ ang+=(e.clientX-lx)*0.4; lx=e.clientX; }});
const renderer=createWebGLRenderer(document.getElementById("view"));
const scene=new Scene();
scene.ink=0.35;
const cloud=scene.instances("b", 6, [0.75,0.28,0.32]);
cloud.meshId=MESH_BOX;
const lamp=scene.instances("l", 1, [1,0.7,0.3]);
lamp.meshId=MESH_OCTA; lamp.billboard=1; lamp.emissive=[1.2,0.7,0.2];
lamp.set(0, 0, 2, 0, 0.8);
const camera=new PerspectiveCamera();
function place(){
  let i, n=Math.min(6, (box.length/3)|0);
  cloud.count=Math.max(1,n);
  for(i=0;i<cloud.count;i++){
    const o=i*3;
    cloud.set(i, (box[o]||0)*0.08, (box[o+1]||0)*0.08, (box[o+2]||10)*0.05, 1.1, i*0.4);
  }
}
function tick(){
  if(!AUTO && !drag) ang+=0.4;
  const r=ang*0.017;
  camera.setEye(Math.sin(r)*16, 8, Math.cos(r)*16);
  camera.setTarget(0,0,0);
  renderer.render(scene, camera);
  requestAnimationFrame(tick);
}
(async function(){
  try{
    const rt=await host1Boot(window.ONESHOT_WASM);
    box=rt.readI64List(rt.mainHandle());
    ok=box.length===18;
    place();
  }catch(e){ ok=0; place(); }
  document.title=ok?"ONESHOT_OK":"ONESHOT_FAIL";
  if(AUTO) document.getElementById("hud").textContent=(ok?"ONESHOT_OK":"ONESHOT_FAIL")+" n="+box.length;
  renderer.resize(); tick();
})();
</script></body></html>
