<!DOCTYPE html>
<html lang="zh"><head>
<meta charset="utf-8"/><title>oneshot-host1</title>
<style>
html,body{margin:0;height:100%;background:#111;color:#ddd;font:13px sans-serif;overflow:hidden}
#hud{position:fixed;left:10px;top:10px;z-index:2}
canvas{display:block;width:100%;height:100%}
</style></head>
<body>
<div id="hud">loading wasm list...</div>
<canvas id="c"></canvas>
<script src="../host1-runtime.js"></script>
<script src="oneshot-b64.js"></script>
<script>
var AUTO=/(?:\?|&)auto=1(?:&|$)/.test(location.search);
var angs=[], ai=0, drag=0, lx=0, ang=0;
var c=document.getElementById("c");
var gl=c.getContext("webgl");
var g2=gl?null:c.getContext("2d");
function resize(){ c.width=innerWidth; c.height=innerHeight; if(gl) gl.viewport(0,0,c.width,c.height); }
window.addEventListener("resize", resize); resize();
window.addEventListener("mousedown", function(e){ drag=1; lx=e.clientX; });
window.addEventListener("mouseup", function(){ drag=0; });
window.addEventListener("mousemove", function(e){
  if(drag){ ang=ang+(e.clientX-lx)*0.2; lx=e.clientX; }
});
function draw(){
  var w=c.width,h=c.height, rad, t;
  if(angs.length && !drag && !AUTO){ ang=angs[ai%angs.length]; ai++; }
  rad=ang*0.017;
  if(g2){
    g2.fillStyle="#111"; g2.fillRect(0,0,w,h);
    g2.save(); g2.translate(w/2,h/2); g2.rotate(rad);
    g2.fillStyle="#c45"; g2.fillRect(-40,-40,80,80);
    g2.fillStyle="#8ab"; g2.fillRect(-18,-18,36,36);
    g2.restore();
  } else if(gl){
    t=(Math.sin(rad)+1)*0.5;
    gl.clearColor(0.08,0.08,0.12,1); gl.clear(gl.COLOR_BUFFER_BIT);
    gl.enable(gl.SCISSOR_TEST);
    gl.scissor((w/2-40)|0,(h/2-40)|0,80,80);
    gl.clearColor(0.8,0.25,0.3,1); gl.clear(gl.COLOR_BUFFER_BIT);
    gl.scissor((w/2-18+(t*20-10))|0,(h/2-18)|0,36,36);
    gl.clearColor(0.5,0.7,0.8,1); gl.clear(gl.COLOR_BUFFER_BIT);
    gl.disable(gl.SCISSOR_TEST);
  }
  requestAnimationFrame(draw);
}
draw();
(async function(){
  var rt=await host1Boot(window.ONESHOT_WASM);
  var d=rt.readI64List(rt.mainHandle());
  var ok=d.length===12 && d[11]===60;
  angs=d; if(d.length) ang=d[0];
  document.title=ok?"ONESHOT_OK":"ONESHOT_FAIL";
  if(AUTO) document.getElementById("hud").textContent=(ok?"ONESHOT_OK":"ONESHOT_FAIL")+" n="+d.length+" last="+d[11];
  else document.getElementById("hud").textContent="oneshot from wasm n="+d.length+" drag to orbit · no three";
})();
</script>
</body></html>
