<!DOCTYPE html>
<html lang="zh"><head>
<meta charset="utf-8"/><title>oneshot-host1</title>
<style>
html,body{margin:0;height:100%;background:#101018;color:#ddd;font:13px sans-serif;overflow:hidden}
#hud{position:fixed;left:10px;top:10px;z-index:2}
canvas{display:block;width:100%;height:100%}
</style></head>
<body>
<div id="hud">drag · boxes from wasm</div>
<canvas id="c"></canvas>
<script src="../host1-runtime.js"></script>
<script src="oneshot-b64.js"></script>
<script>
var AUTO=/(?:\?|&)auto=1(?:&|$)/.test(location.search);
var box=[], ang=0, drag=0, lx=0, ok=0;
var c=document.getElementById("c"), g=c.getContext("2d");
function resize(){ c.width=innerWidth; c.height=innerHeight; }
window.addEventListener("resize", resize); resize();
window.addEventListener("mousedown",function(e){ drag=1; lx=e.clientX; });
window.addEventListener("mouseup",function(){ drag=0; });
window.addEventListener("mousemove",function(e){ if(drag){ ang+=(e.clientX-lx)*0.3; lx=e.clientX; }});
function draw(){
  var w=c.width,h=c.height,i,rad,x,y,s,px,py;
  if(!box.length){ requestAnimationFrame(draw); return; }
  if(!AUTO && !drag) ang+=0.4;
  g.fillStyle="#101018"; g.fillRect(0,0,w,h);
  rad=ang*0.017;
  for(i=0;i<box.length;i+=3){
    x=box[i]; y=box[i+1]; s=box[i+2];
    px=w/2+(x*Math.cos(rad)-y*Math.sin(rad))*4;
    py=h/2+(x*Math.sin(rad)+y*Math.cos(rad))*3;
    g.fillStyle=i%2?"#c45":"#8ab";
    g.fillRect(px-s, py-s, s*2, s*2);
  }
  requestAnimationFrame(draw);
}
draw();
(async function(){
  var rt=await host1Boot(window.ONESHOT_WASM);
  box=rt.readI64List(rt.mainHandle());
  ok=box.length===18;
  document.title=ok?"ONESHOT_OK":"ONESHOT_FAIL";
  if(AUTO) document.getElementById("hud").textContent=(ok?"ONESHOT_OK":"ONESHOT_FAIL")+" n="+box.length;
})();
</script></body></html>
