<!DOCTYPE html>
<html lang="zh"><head>
<meta charset="utf-8"/><title>oneshot-host1</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#101018;color:#ddd;font:13px sans-serif}
#hud{position:fixed;left:10px;top:10px;z-index:2}
canvas{display:block;width:100%;height:100%}
</style></head>
<body>
<div id="hud">drag · UXE GL · no three</div>
<canvas id="view"></canvas>
<script src="../host1-runtime.js"></script>
<script src="oneshot-b64.js"></script>
<script type="module">
import { createWebGLRenderer } from "../../renderer-webgl.js";
import { Scene, PerspectiveCamera } from "../../scene.js";
import { MESH_BOX, MESH_OCTA } from "../../meshes.js";
import { createBrowserHost } from "../../host-browser.js";
import { encodeRenderPacket } from "../../packet.js";
const AUTO=/(?:\?|&)auto=1(?:&|$)/.test(location.search);
let ang=0, turn=0, drag=0, lx=0, ok=0, box=[], rt=null;
window.addEventListener("mousedown",e=>{ drag=1; lx=e.clientX; });
window.addEventListener("mouseup",()=>{ drag=0; turn=0; });
window.addEventListener("mousemove",e=>{ if(drag){ turn=(e.clientX-lx)*0.4; lx=e.clientX; }});
const canvas=document.getElementById("view");
const xyz=new Float32Array(18), sc=new Float32Array(6);
function fillCloud(){
  let i, n=Math.min(6, (box.length/3)|0);
  n=Math.max(1,n);
  for(i=0;i<n;i++){
    const o=i*3;
    xyz[o]=(box[o]||0)*0.08;
    xyz[o+1]=(box[o+1]||0)*0.08;
    xyz[o+2]=(box[o+2]||10)*0.05;
    sc[i]=1.1;
  }
  return n;
}
function packCam(eye){
  return { fovy:Math.PI/3, near:0.1, far:300, eye, target:[0,0,0] };
}
function stepAng(dt){
  let used=0, t=turn;
  if(AUTO) t=0.4;
  if(rt&&typeof rt.step==="function"){
    try{
      const r=rt.step({ang:ang,turn:t,dt:dt});
      if(r&&r.ang!=null){ ang=Number(r.ang); used=1; }
      if(r&&r.box&&r.box.length) box=r.box;
    }catch(e){ used=0; }
  }
  if(!used) ang+=t;
}
function submitGpu(host){
  stepAng(0.4);
  const r=ang*0.017;
  const n=fillCloud();
  host.host_gpu_submit(encodeRenderPacket({
    clear:[0.063,0.063,0.094,1],
    camera:packCam([Math.sin(r)*16,8,Math.cos(r)*16]),
    clouds:[{ color:[0.75,0.28,0.32], count:n, xyz, scale:sc, meshId:MESH_BOX }],
  }));
  host.host_frame_present();
}
(async function(){
  try{
    rt=await host1Boot(window.ONESHOT_WASM);
    try{
      const r=rt.step({ang:0,turn:0,dt:0});
      if(r&&r.box) box=r.box;
      if(r&&r.ang!=null) ang=Number(r.ang);
    }catch(e){}
    if(!box||!box.length) box=rt.readI64List(rt.mainHandle());
    ok=box.length===18;
  }catch(e){ ok=0; }
  document.title=ok?"ONESHOT_OK":"ONESHOT_FAIL";
  if(AUTO||!ok) document.getElementById("hud").textContent=(ok?"ONESHOT_OK":"ONESHOT_FAIL")+" n="+box.length;
  let host=null, gpu=0;
  try{
    host=await createBrowserHost(canvas,{ prefer:"webgl", baseURL:new URL("../../", import.meta.url) });
    submitGpu(host);
    gpu=1;
  }catch(e){ host=null; gpu=0; }
  if(gpu){
    function tick(){ try{ submitGpu(host); requestAnimationFrame(tick); }catch(e){} }
    requestAnimationFrame(tick);
    return;
  }
  const renderer=createWebGLRenderer(canvas);
  const scene=new Scene();
  scene.ink=0.35;
  const cloud=scene.instances("b", 6, [0.75,0.28,0.32]);
  cloud.meshId=MESH_BOX;
  const lamp=scene.instances("l", 0, [1,0.7,0.3]);
  lamp.meshId=MESH_OCTA; lamp.billboard=1; lamp.emissive=[1.2,0.7,0.2];
  lamp.count=0;
  const camera=new PerspectiveCamera();
  function place(){
    let i, n=Math.min(6, (box.length/3)|0);
    cloud.count=Math.max(1,n);
    for(i=0;i<cloud.count;i++){
      const o=i*3;
      cloud.set(i, (box[o]||0)*0.08, (box[o+1]||0)*0.08, (box[o+2]||10)*0.05, 1.1);
    }
  }
  function tick(){
    stepAng(0.4);
    const r=ang*0.017;
    camera.setEye(Math.sin(r)*16, 8, Math.cos(r)*16);
    camera.setTarget(0,0,0);
    renderer.render(scene, camera);
    requestAnimationFrame(tick);
  }
  place();
  renderer.resize(); tick();
})();
</script></body></html>
