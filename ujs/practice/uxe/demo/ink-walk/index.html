<!DOCTYPE html>
<html lang="zh"><head>
<meta charset="utf-8"/><title>ink-walk-host1</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#d8c8a8;font:13px sans-serif}
#hud{position:fixed;left:10px;top:10px;z-index:2;background:rgba(255,255,255,.7);padding:6px 8px}
canvas{display:block;width:100%;height:100%}
</style></head>
<body>
<div id="hud">WASD · NPR rim · no three</div>
<canvas id="view"></canvas>
<script src="../host1-runtime.js"></script>
<script src="ink-b64.js"></script>
<script type="module">
import { createWebGLRenderer } from "../../renderer-webgl.js";
import { Scene, PerspectiveCamera } from "../../scene.js";
import { MESH_OCTA, MESH_BOX, MESH_PLANE } from "../../meshes.js";
const AUTO=/(?:\?|&)auto=1(?:&|$)/.test(location.search);
const keys={};
window.addEventListener("keydown",e=>keys[e.code]=1);
window.addEventListener("keyup",e=>keys[e.code]=0);
const renderer=createWebGLRenderer(document.getElementById("view"));
const scene=new Scene();
scene.ink=1.0; scene.wave=0;
scene.clearColor=[0.85,0.78,0.66,1];
scene.fog={density:0.008,color:[0.82,0.76,0.64]};
scene.ambient={color:[0.7,0.65,0.55],intensity:0.7};
const ground=scene.instances("g",1,[0.62,0.55,0.42]);
ground.meshId=MESH_PLANE; ground.set(0,0,0,-40,80);
const trees=scene.instances("t",32,[0.22,0.32,0.18]);
trees.meshId=MESH_OCTA; trees.billboard=1;
const bridge=scene.instances("b",14,[0.45,0.4,0.35]);
bridge.meshId=MESH_BOX;
const far=scene.instances("f",5,[0.38,0.34,0.28]);
far.meshId=MESH_BOX;
const mid=scene.instances("m",5,[0.42,0.38,0.32]);
mid.meshId=MESH_BOX;
const near=scene.instances("n",6,[0.46,0.42,0.36]);
near.meshId=MESH_BOX;
let i, cam=0, ok=0;
for(i=0;i<32;i++) trees.set(i,(i%8)*6-20, 2.2, -((i/8)|0)*12-8, 2+(i%3));
for(i=0;i<14;i++) bridge.set(i, i*3-20, 0.6, -18, 1.2);
const camera=new PerspectiveCamera();
function tick(){
  if(!AUTO){
    if(keys.KeyD||keys.ArrowRight) cam+=0.25;
    if(keys.KeyA||keys.ArrowLeft) cam-=0.25;
  }else cam+=0.08;
  camera.setEye(cam, 5, 12);
  camera.setTarget(cam, 1, -20);
  renderer.render(scene, camera);
  requestAnimationFrame(tick);
}
(async function(){
  try{
    const rt=await host1Boot(window.INK_WASM);
    const d=rt.readI64List(rt.mainHandle());
    ok=d.length>=12;
    if(d.length>=38){
      function xz(i){ return [(Number(d[i])-50)*0.4, (Number(d[i+1])-50)*0.4]; }
      for(i=0;i<6;i++){
        const p=xz(i*2);
        trees.set(i, p[0], 3.6, p[1]-28, 2.8);
      }
      for(i=0;i<6;i++){
        const p=xz(12+i*2);
        trees.set(6+i, p[0], 2.2, p[1]-12, 2.2);
      }
      for(i=0;i<7;i++){
        const p=xz(24+i*2);
        bridge.set(i, p[0]*0.2, 0.6, p[1]*0.15-18, 1.2);
      }
      bridge.count=7;
      for(i=0;i<5;i++){
        const a=xz(i*2), b=xz(i*2+2);
        far.set(i,(a[0]+b[0])*0.5,3.4,(a[1]+b[1])*0.5-28,0.55);
      }
      for(i=0;i<5;i++){
        const a=xz(12+i*2), b=xz(12+i*2+2);
        mid.set(i,(a[0]+b[0])*0.5,2.8,(a[1]+b[1])*0.5-20,0.5);
      }
      for(i=0;i<6;i++){
        const a=xz(24+i*2), b=xz(24+i*2+2);
        near.set(i,(a[0]+b[0])*0.5,1.8,(a[1]+b[1])*0.5-12,0.45);
      }
      trees.count=12;
    }
  }catch(e){ ok=0; }
  document.title=ok?"INK_OK":"INK_FAIL";
  if(AUTO) document.getElementById("hud").textContent=(ok?"INK_OK":"INK_FAIL");
  renderer.resize(); tick();
})();
</script></body></html>
