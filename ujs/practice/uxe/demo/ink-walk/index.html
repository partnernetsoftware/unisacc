<!DOCTYPE html>
<html lang="zh"><head>
<meta charset="utf-8"/><title>ink-walk-host1</title>
<style>
html,body{margin:0;height:100%;background:#e4d4bc;overflow:hidden;font:13px sans-serif}
#hud{position:fixed;left:10px;top:10px;background:rgba(255,255,255,.75);padding:6px 8px;border:1px solid #864}
canvas{display:block;width:100%;height:100%}
</style></head>
<body>
<div id="hud">WASD · layers from wasm</div>
<canvas id="c"></canvas>
<script src="../host1-runtime.js"></script>
<script src="ink-b64.js"></script>
<script>
var AUTO=/(?:\?|&)auto=1(?:&|$)/.test(location.search);
var d=[], cam=0, keys={}, ok=0;
window.addEventListener("keydown",function(e){ keys[e.code]=1; });
window.addEventListener("keyup",function(e){ keys[e.code]=0; });
var c=document.getElementById("c"), g=c.getContext("2d");
function resize(){ c.width=innerWidth; c.height=innerHeight; }
window.addEventListener("resize", resize); resize();
function poly(off,n,col,ox){
  var k,sx=c.width/100,sy=c.height/100;
  g.beginPath();
  g.moveTo((d[off]-ox)*sx, d[off+1]*sy);
  for(k=1;k<n;k++) g.lineTo((d[off+k*2]-ox)*sx, d[off+k*2+1]*sy);
  g.strokeStyle=col; g.lineWidth=3; g.stroke();
  g.globalAlpha=0.25; g.lineTo(c.width,c.height); g.lineTo(0,c.height); g.closePath();
  g.fillStyle=col; g.fill(); g.globalAlpha=1;
}
function draw(){
  if(!d.length){ requestAnimationFrame(draw); return; }
  if(!AUTO){
    if(keys.KeyD||keys.ArrowRight) cam+=0.8;
    if(keys.KeyA||keys.ArrowLeft) cam-=0.8;
  }
  g.fillStyle="#d8c8a8"; g.fillRect(0,0,c.width,c.height);
  poly(0,6,"#8aa0b0", cam*0.3);
  poly(12,6,"#3d5a38", cam*0.6);
  poly(24,7,"#5a4030", cam);
  requestAnimationFrame(draw);
}
draw();
(async function(){
  var rt=await host1Boot(window.INK_WASM);
  d=rt.readI64List(rt.mainHandle());
  ok=d.length===38;
  document.title=ok?"INK_OK":"INK_FAIL";
  if(AUTO) document.getElementById("hud").textContent=(ok?"INK_OK":"INK_FAIL")+" n="+d.length;
})();
</script></body></html>
