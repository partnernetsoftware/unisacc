<!DOCTYPE html>
<html lang="zh"><head>
<meta charset="utf-8"/><title>ink-walk-host1</title>
<style>
html,body{margin:0;height:100%;background:#e8dcc8;overflow:hidden;font:13px sans-serif}
#hud{position:fixed;left:10px;top:10px;background:rgba(255,255,255,.7);padding:6px 8px;border:1px solid #864}
canvas{display:block;width:100%;height:100%}
</style></head>
<body>
<div id="hud">WASD pan · pencil wash · no three</div>
<canvas id="c"></canvas>
<script src="../host1-runtime.js"></script>
<script src="ink-b64.js"></script>
<script>
function sim8(){ var cam=0,i=0; while(i<8){ cam=cam+2; if(cam>20) cam=20; i=i+1;} return cam; }
var AUTO=/(?:\?|&)auto=1(?:&|$)/.test(location.search);
var cam=0, keys={};
window.addEventListener("keydown", function(e){ keys[e.code]=1; });
window.addEventListener("keyup", function(e){ keys[e.code]=0; });
var c=document.getElementById("c"), g=c.getContext("2d");
function resize(){ c.width=innerWidth; c.height=innerHeight; }
window.addEventListener("resize", resize); resize();
function blob(x,y,s,col){
  var k; g.fillStyle=col;
  for(k=0;k<5;k++){ g.beginPath(); g.ellipse(x,y-k*2,s-k,s*0.5-k*0.2,0,0,6.28); g.fill(); }
}
function draw(){
  var w=c.width,h=c.height,i;
  if(!AUTO){
    if(keys.KeyD||keys.ArrowRight) cam=cam+1;
    if(keys.KeyA||keys.ArrowLeft) cam=cam-1;
    if(cam<0) cam=0; if(cam>40) cam=40;
  }
  g.fillStyle="#d7c4a8"; g.fillRect(0,0,w,h);
  g.fillStyle="#c5d0c0"; g.fillRect(0,0,w,h*0.45);
  for(i=0;i<8;i++){
    blob(((i*160-cam*12)% (w+200))-40, h*0.55+(i%3)*20, 50+i*4, i%2?"#3a5a40":"#2a4030");
  }
  blob(w*0.5, h*0.62, 30, "#6a5a48");
  requestAnimationFrame(draw);
}
draw();
(async function(){
  var rt=await host1Boot(window.INK_WASM);
  var d=rt.readI64List(rt.mainHandle());
  var ok=d.length===8 && d[7]===16;
  document.title=ok?"INK_OK":"INK_FAIL";
  if(AUTO) document.getElementById("hud").textContent=(ok?"INK_OK":"INK_FAIL")+" n="+d.length+" last="+d[7];
  if(d.length) cam=d[d.length-1];
})();
</script>
</body></html>
