<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8"/>
<title>water-keeps-host1</title>
<style>
html,body{margin:0;height:100%;background:#05060c;color:#dce6f0;font:13px sans-serif;overflow:hidden}
#hud{position:fixed;left:12px;top:12px;z-index:2;background:rgba(5,6,12,.75);padding:8px 10px;border:1px solid #456}
canvas{display:block;width:100%;height:100%}
</style>
</head>
<body>
<div id="hud">loading wasm list...</div>
<canvas id="c"></canvas>
<script src="../host1-runtime.js"></script>
<script src="water-b64.js"></script>
<script>
function hex(n){ var s=n.toString(16); while(s.length<6) s="0"+s; return "#"+s; }
var AUTO=/(?:\?|&)auto=1(?:&|$)/.test(location.search);
var pal=[], pose=[], tick=0, goldOk=0;
var c=document.getElementById("c"), g=c.getContext("2d");
function resize(){ c.width=innerWidth; c.height=innerHeight; }
window.addEventListener("resize", resize); resize();
function draw(){
  var w=c.width,h=c.height, i, p, packed, realm, x, col;
  if(!pal.length){ requestAnimationFrame(draw); return; }
  packed = pose[tick%pose.length];
  realm = (packed/100)|0; x = packed%100;
  if(realm>7) realm=7;
  col = pal[realm];
  g.fillStyle=hex(col);
  g.fillRect(0,0,w,h);
  g.fillStyle="#000"; g.globalAlpha=0.35; g.fillRect(0,h*0.52,w,h); g.globalAlpha=1;
  g.fillStyle="#c4a070";
  for(i=0;i<12;i++){
    g.fillRect(((i*90+x*20)%(w+60))-30, h*0.58+(i%4)*10, 40, 2);
  }
  g.fillStyle="#6a4a28";
  g.beginPath();
  g.moveTo(w*0.5, h*0.62); g.lineTo(w*0.5-22,h*0.70); g.lineTo(w*0.5+22,h*0.70); g.fill();
  g.fillStyle="#ffb45e";
  g.beginPath(); g.arc(w*0.5, h*0.60, 6, 0, 6.28); g.fill();
  if(!AUTO) document.getElementById("hud").textContent=
    (goldOk?"WATER_OK":"water")+" realm="+realm+" x="+x+" n="+pose.length+" from wasm list · no three";
  if(!AUTO) tick++;
  requestAnimationFrame(draw);
}
draw();
(async function(){
  var rt=await host1Boot(window.WATER_WASM);
  var h=rt.mainHandle();
  var tag=rt.tag(h);
  var d=rt.readI64List(h);
  pal=d.slice(0,8); pose=d.slice(8);
  goldOk=(tag===5 && d.length===24 && d[23]===404);
  document.title=goldOk?"WATER_OK":"WATER_FAIL";
  if(AUTO) document.getElementById("hud").textContent=
    (goldOk?"WATER_OK":"WATER_FAIL")+" tag="+tag+" n="+d.length+" last="+d[23];
})();
</script>
</body>
</html>
