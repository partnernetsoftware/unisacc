<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8"/>
<title>water-keeps-host1</title>
<style>
html,body{margin:0;height:100%;background:#05060c;color:#e8e0d4;font:13px sans-serif;overflow:hidden}
#hud{position:fixed;left:12px;top:12px;z-index:2;background:rgba(5,6,12,.8);padding:8px 10px;border:1px solid #456;max-width:560px}
canvas{display:block;width:100%;height:100%}
</style>
</head>
<body>
<div id="hud">W/S thrust · A/D helm · 8 shores in wasm</div>
<canvas id="c"></canvas>
<script src="../host1-runtime.js"></script>
<script src="water-b64.js"></script>
<script>
function hex(n){ var s=n.toString(16); while(s.length<6)s="0"+s; return "#"+s; }
var AUTO=/(?:\?|&)auto=1(?:&|$)/.test(location.search);
var map=[], pal=[], ok=0;
var boat={x:15,y:42,h:0,v:0.6};
var keys={};
window.addEventListener("keydown",function(e){ keys[e.code]=1; if(e.code.slice(0,3)==="Key"||e.code.slice(0,5)==="Arrow") e.preventDefault(); });
window.addEventListener("keyup",function(e){ keys[e.code]=0; });
var c=document.getElementById("c"), g=c.getContext("2d");
function resize(){ c.width=innerWidth; c.height=innerHeight; }
window.addEventListener("resize", resize); resize();
function realmAt(x){ var r=(x/100)|0; if(r<0)r=0; if(r>7)r=7; return r; }
function step(){
  if(keys.KeyA||keys.ArrowLeft) boat.h-=0.045;
  if(keys.KeyD||keys.ArrowRight) boat.h+=0.045;
  if(keys.KeyW||keys.ArrowUp) boat.v+=0.12;
  if(keys.KeyS||keys.ArrowDown) boat.v-=0.1;
  boat.v+=0.03;
  if(boat.v>2.4) boat.v=2.4;
  if(boat.v<0.25) boat.v=0.25;
  boat.x+=Math.cos(boat.h)*boat.v;
  boat.y+=Math.sin(boat.h)*boat.v*0.4;
  if(boat.y<30) boat.y=30;
  if(boat.y>70) boat.y=70;
  if(boat.x<0) boat.x=0;
  if(boat.x>799) boat.x=799;
}
function shore(ri, sx, sy, ox){
  var o=ri*16, k;
  g.beginPath();
  g.moveTo((map[o]+ox)*sx, map[o+1]*sy);
  for(k=1;k<8;k++) g.lineTo((map[o+k*2]+ox)*sx, map[o+k*2+1]*sy);
  g.closePath();
}
function draw(){
  var w=c.width,h=c.height, ri, i, sx, sy, p, ox;
  if(!map.length){ requestAnimationFrame(draw); return; }
  if(!AUTO) step();
  ri=realmAt(boat.x);
  p=pal[ri];
  g.fillStyle=hex(p); g.fillRect(0,0,w,h);
  g.fillStyle="rgba(8,12,20,0.4)"; g.fillRect(0,h*0.48,w,h);
  sx=w/100; sy=h/100;
  for(i=0;i<8;i++){
    ox=i*100-boat.x;
    shore(i,sx,sy,ox);
    g.fillStyle=i===ri?"#4a5a40":"#2a382c";
    g.fill();
    g.strokeStyle="#1c2418"; g.lineWidth=2; g.stroke();
  }
  g.save();
  g.translate(w*0.5, boat.y*sy);
  g.rotate(boat.h);
  g.fillStyle="#6a4a28";
  g.beginPath(); g.moveTo(20,0); g.lineTo(-16,9); g.lineTo(-16,-9); g.fill();
  g.fillStyle="#ffb45e";
  g.beginPath(); g.arc(10,-3,5,0,6.28); g.fill();
  g.restore();
  if(!AUTO) document.getElementById("hud").textContent=
    (ok?"WATER_OK ":"")+"realm "+(ri+1)+"/8 x="+boat.x.toFixed(0)+" 8-vert shores in wasm · WASD";
  requestAnimationFrame(draw);
}
draw();
(async function(){
  var rt=await host1Boot(window.WATER_WASM);
  var d=rt.readI64List(rt.mainHandle());
  ok=d.length===136;
  map=d.slice(0,128); pal=d.slice(128,136);
  document.title=ok?"WATER_OK":"WATER_FAIL";
  if(AUTO) document.getElementById("hud").textContent=(ok?"WATER_OK":"WATER_FAIL")+" n="+d.length;
})();
</script>
</body>
</html>
