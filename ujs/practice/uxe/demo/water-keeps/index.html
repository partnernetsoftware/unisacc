<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8"/>
<title>water-keeps-host1</title>
<style>
html,body{margin:0;height:100%;background:#05060c;color:#e8e0d4;font:13px sans-serif;overflow:hidden}
#hud{position:fixed;left:12px;top:12px;z-index:2;background:rgba(5,6,12,.8);padding:8px 10px;border:1px solid #456;max-width:560px}
canvas{display:block;width:100%;height:100%}
</style>
</head>
<body>
<div id="hud">W/S thrust · A/D helm · 8 realms from wasm map</div>
<canvas id="c"></canvas>
<script src="../host1-runtime.js"></script>
<script src="water-b64.js"></script>
<script>
function hex(n){ var s=n.toString(16); while(s.length<6)s="0"+s; return "#"+s; }
var AUTO=/(?:\?|&)auto=1(?:&|$)/.test(location.search);
var map=[], pal=[], ok=0;
var boat={x:20,y:40,h:0,v:0};
var keys={};
window.addEventListener("keydown",function(e){ keys[e.code]=1; e.preventDefault(); });
window.addEventListener("keyup",function(e){ keys[e.code]=0; });
var c=document.getElementById("c"), g=c.getContext("2d");
function resize(){ c.width=innerWidth; c.height=innerHeight; }
window.addEventListener("resize", resize); resize();
function realmAt(x){
  var r=(x/100)|0; if(r<0)r=0; if(r>7)r=7; return r;
}
function tri(ri){
  var o=ri*6;
  return [map[o],map[o+1],map[o+2],map[o+3],map[o+4],map[o+5]];
}
function step(){
  if(keys.KeyA||keys.ArrowLeft) boat.h-=0.04;
  if(keys.KeyD||keys.ArrowRight) boat.h+=0.04;
  if(keys.KeyW||keys.ArrowUp) boat.v+=0.15;
  if(keys.KeyS||keys.ArrowDown) boat.v-=0.08;
  boat.v+=0.04;
  if(boat.v>2.2) boat.v=2.2;
  if(boat.v<0.2) boat.v=0.2;
  boat.x+=Math.cos(boat.h)*boat.v;
  boat.y+=Math.sin(boat.h)*boat.v*0.35;
  if(boat.y<28) boat.y=28;
  if(boat.y>72) boat.y=72;
  if(boat.x<0) boat.x=0;
  if(boat.x>799) boat.x=799;
}
function draw(){
  var w=c.width,h=c.height, ri, t, i, sx, sy, p;
  if(!map.length){ requestAnimationFrame(draw); return; }
  if(!AUTO) step();
  ri=realmAt(boat.x);
  p=pal[ri];
  g.fillStyle=hex(p);
  g.fillRect(0,0,w,h);
  g.fillStyle="rgba(0,0,0,0.35)";
  g.fillRect(0,h*0.50,w,h);
  sx=w/100; sy=h/100;
  for(i=0;i<8;i++){
    t=tri(i);
    g.beginPath();
    g.moveTo((t[0]+(i*100)-boat.x)*sx, t[1]*sy);
    g.lineTo((t[2]+(i*100)-boat.x)*sx, t[3]*sy);
    g.lineTo((t[4]+(i*100)-boat.x)*sx, t[5]*sy);
    g.closePath();
    g.fillStyle=i===ri?"#3a4a38":"#243028";
    g.fill();
    g.strokeStyle="#1a2018"; g.stroke();
  }
  g.save();
  g.translate(w*0.5, boat.y*sy);
  g.rotate(boat.h);
  g.fillStyle="#6a4a28";
  g.beginPath(); g.moveTo(18,0); g.lineTo(-14,8); g.lineTo(-14,-8); g.fill();
  g.fillStyle="#ffb45e";
  g.beginPath(); g.arc(8,-2,4,0,6.28); g.fill();
  g.restore();
  if(!AUTO) document.getElementById("hud").textContent=
    (ok?"WATER_OK ":"")+"realm "+(ri+1)+"/8 x="+boat.x.toFixed(0)+" from wasm triangles · WASD · no three";
  requestAnimationFrame(draw);
}
draw();
(async function(){
  var rt=await host1Boot(window.WATER_WASM);
  var d=rt.readI64List(rt.mainHandle());
  ok=d.length===56;
  map=d.slice(0,48); pal=d.slice(48,56);
  document.title=ok?"WATER_OK":"WATER_FAIL";
  if(AUTO) document.getElementById("hud").textContent=(ok?"WATER_OK":"WATER_FAIL")+" n="+d.length+" pal0="+d[48];
})();
</script>
</body>
</html>
