<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8"/>
<title>water-keeps-host1</title>
<style>
  html,body{margin:0;height:100%;background:#05060c;color:#dce6f0;font:13px sans-serif;overflow:hidden}
  #hud{position:fixed;left:12px;top:12px;z-index:2;background:rgba(5,6,12,.75);padding:8px 10px;border:1px solid #456;max-width:520px}
  canvas{display:block;width:100%;height:100%}
</style>
</head>
<body>
<div id="hud">A/D steer · current carries · 8 realms · no three</div>
<canvas id="c"></canvas>
<script src="../host1-runtime.js"></script>
<script src="water-b64.js"></script>
<script>
function sim16() {
  var realm = 0, x = 0, i = 0;
  while (i < 16) {
    x = x + 3;
    if (x > 10) { x = x - 11; realm = realm + 1; }
    if (realm > 7) realm = 7;
    i = i + 1;
  }
  return realm + 100 * x;
}
var PAL = [
  ["#0a1628","#1a3a48","#c4a070"],
  ["#1a1020","#4a2038","#e8c090"],
  ["#081818","#145040","#b0d090"],
  ["#180808","#602018","#f0a060"],
  ["#101018","#283060","#a0b8e0"],
  ["#14100c","#5a4030","#d8c8a0"],
  ["#0c1014","#203848","#90c0c8"],
  ["#0a0a12","#2a1840","#d0a0e0"]
];
var AUTO = /(?:\?|&)auto=1(?:&|$)/.test(location.search);
var st = { realm: 0, x: 0, y: 0, steer: 0 };
var keys = {};
var gold = 0, play = 0;
window.addEventListener("keydown", function (e) {
  keys[e.code] = 1;
  if (e.code === "KeyA" || e.code === "ArrowLeft") st.steer = -1;
  if (e.code === "KeyD" || e.code === "ArrowRight") st.steer = 1;
});
window.addEventListener("keyup", function (e) {
  keys[e.code] = 0;
  if (!keys.KeyA && !keys.ArrowLeft && !keys.KeyD && !keys.ArrowRight) st.steer = 0;
});
function stepLive() {
  st.x = st.x + 3;
  st.y = st.y + st.steer;
  if (st.y > 8) st.y = 8;
  if (st.y < -8) st.y = -8;
  if (st.x > 10) { st.x = st.x - 11; st.realm = st.realm + 1; }
  if (st.realm > 7) st.realm = 7;
}
var c = document.getElementById("c");
var g = c.getContext("2d");
function resize() { c.width = innerWidth; c.height = innerHeight; }
window.addEventListener("resize", resize);
resize();
function draw() {
  var w = c.width, h = c.height, p = PAL[st.realm], i, wx, wy;
  if (!AUTO) stepLive();
  g.fillStyle = p[0];
  g.fillRect(0, 0, w, h);
  g.fillStyle = p[1];
  g.fillRect(0, h * 0.55, w, h);
  g.globalAlpha = 0.15;
  g.fillStyle = "#fff";
  for (i = 0; i < 40; i++) {
    wx = ((i * 73 + st.x * 18) % (w + 40)) - 20;
    wy = h * 0.58 + (i % 7) * 12;
    g.fillRect(wx, wy, 28, 2);
  }
  g.globalAlpha = 1;
  g.fillStyle = p[2];
  g.beginPath();
  g.moveTo(w * 0.5 + st.y * 8, h * 0.62);
  g.lineTo(w * 0.5 + st.y * 8 - 18, h * 0.68);
  g.lineTo(w * 0.5 + st.y * 8 + 18, h * 0.68);
  g.fill();
  g.fillStyle = "#ffb45e";
  g.beginPath();
  g.arc(w * 0.5 + st.y * 8, h * 0.60, 5, 0, 6.28);
  g.fill();
  var hud = document.getElementById("hud");
  if (!AUTO) {
    hud.textContent = (play ? "WATER_OK" : "water-keeps") +
      " wasm=" + gold + " realm=" + st.realm + " x=" + st.x +
      " no-three · A/D";
  }
  requestAnimationFrame(draw);
}
(async function () {
  try {
    var rt = await host1Boot(window.WATER_WASM);
    gold = rt.goldI64();
  } catch (e) { gold = -1; }
  play = (gold === 404 && sim16() === 404) ? 1 : 0;
  document.title = play ? "WATER_OK" : "WATER_FAIL";
  if (AUTO) {
    document.getElementById("hud").textContent =
      (play ? "WATER_OK" : "WATER_FAIL") + " wasm=" + gold + " js16=" + sim16();
  }
})();
draw();
</script>
</body>
</html>
