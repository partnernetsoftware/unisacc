<!DOCTYPE html>
<html lang="zh"><head>
<meta charset="utf-8"/><title>fly-host1</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#081018;color:#cfe;font:13px sans-serif}
#hud{position:fixed;left:10px;top:10px;z-index:2;background:rgba(0,0,0,.55);padding:6px 8px}
canvas{display:block;width:100%;height:100%}
</style></head>
<body>
<div id="hud">WASD thrust/turn · Space climb · click roll · chase · no three</div>
<canvas id="view"></canvas>
<script src="../host1-runtime.js"></script>
<script src="fly-b64.js"></script>
<script type="module">
import { createWebGLRenderer } from "../../renderer-webgl.js";
import { Scene, PerspectiveCamera } from "../../scene.js";
import { MESH_SHIP, MESH_OCTA, MESH_PLANE } from "../../meshes.js";
import { createBrowserHost } from "../../host-browser.js";
import { encodeRenderPacket } from "../../packet.js";
const AUTO=/(?:\?|&)auto=1(?:&|$)/.test(location.search);
const keys={};
window.addEventListener("keydown",e=>{ keys[e.code]=1; if(e.code==="Space") e.preventDefault(); });
window.addEventListener("keyup",e=>keys[e.code]=0);
let rollClick=0;
window.addEventListener("mousedown",()=>{ rollClick=1; });
const canvas=document.getElementById("view");
const scene=new Scene();
scene.wave=0.4; scene.ink=0.2;
scene.clearColor=[0.03,0.06,0.1,1];
scene.fog={density:0.012,color:[0.05,0.09,0.14]};
const water=scene.instances("w",1,[0.07,0.18,0.26]);
water.meshId=MESH_PLANE; water.set(0,0,-0.4,-40,120);
const isles=scene.instances("i",0,[0.35,0.42,0.28]);
isles.meshId=MESH_OCTA;
isles.billboard=1;
const mist=scene.instances("m",0,[0.72,0.78,0.86]);
mist.meshId=MESH_OCTA;
mist.billboard=1;
const ship=scene.instances("s",1,[0.85,0.35,0.2]);
ship.meshId=MESH_SHIP; ship.emissive=[0.15,0.04,0];
const camera=new PerspectiveCamera(Math.PI/3,0.2,500);
let x=0,y=3,z=8, yaw=0, turn=0, spd=0, roll=0, pitch=0, gold=0, ok=0, n=0;
function packCloud(c){
  return {
    color:c.color, count:c.count, xyz:c.xyz, scale:c.scale,
    meshId:c.meshId, emissive:c.emissive,
    metalness:c.metalness, roughness:c.roughness,
  };
}
function submitGpu(host){
  const clouds=[];
  scene.clouds.forEach(c=>clouds.push(packCloud(c)));
  host.host_gpu_submit(encodeRenderPacket({
    clear:scene.clearColor,
    camera:{ fovy:camera.fovy, near:camera.near, far:camera.far, eye:camera.eye, target:camera.target },
    fog:scene.fog,
    ambient:scene.ambient,
    lights:scene.lights,
    clouds,
  }));
  host.host_frame_present();
}
function stepSim(){
  n++;
  turn=0;
  if(!AUTO){
    if(keys.KeyA||keys.ArrowLeft) turn=0.04;
    if(keys.KeyD||keys.ArrowRight) turn=-0.04;
    if(keys.KeyW||keys.ArrowUp) spd=Math.min(1.6, spd+0.04);
    else if(keys.KeyS||keys.ArrowDown) spd=Math.max(-0.6, spd-0.05);
    else spd*=0.96;
    if(keys.Space) { y+=0.12; pitch=Math.min(0.45, pitch+0.04); }
    else { y+=(3-y)*0.02; pitch*=0.9; }
    if(rollClick){ roll+=0.55; rollClick=0; }
  } else {
    turn=0.01; spd=0.8; y=4+Math.sin(n*0.02); pitch=0.15*Math.sin(n*0.03); roll=0.4*Math.sin(n*0.05);
  }
  yaw+=turn;
  roll*=0.92;
  x+=Math.sin(yaw)*spd;
  z-=Math.cos(yaw)*spd;
  const bank=((keys.KeyA||keys.ArrowLeft)?0.35:0)-((keys.KeyD||keys.ArrowRight)?0.35:0);
  ship.set(0,x,y,z,2.2, yaw, pitch, roll+bank);
  const bx=x-Math.sin(yaw)*14, bz=z+Math.cos(yaw)*14;
  camera.setEye(bx, y+5, bz);
  camera.setTarget(x, y+0.4, z);
}
(async function(){
  let rt=null;
  try{
    rt=await host1Boot(window.FLY_WASM);
    gold=Number(rt.goldI64());
    ok=gold===3868;
  }catch(e){ ok=0; }
  document.title=ok?"FLY_OK":"FLY_GL_OK";
  if(AUTO||!ok) document.getElementById("hud").textContent=(ok?"FLY_OK":"FLY_GL_OK")+" gold="+gold;
  let host=null, gpu=0;
  try{
    host=await createBrowserHost(canvas,{ prefer:"webgl", baseURL:new URL("../../", import.meta.url) });
    stepSim();
    submitGpu(host);
    gpu=1;
  }catch(e){ host=null; gpu=0; }
  if(gpu){
    function tick(){ try{ stepSim(); submitGpu(host); try{ rt.step({yaw:yaw,turn:turn,dt:0.016}); }catch(e){} requestAnimationFrame(tick); }catch(e){} }
    requestAnimationFrame(tick);
    return;
  }
  const renderer=createWebGLRenderer(canvas);
  function tick(){
    stepSim();
    renderer.render(scene, camera);
    requestAnimationFrame(tick);
  }
  renderer.resize(); tick();
})();
</script></body></html>
