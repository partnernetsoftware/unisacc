<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8"/>
<title>fly-host1</title>
<style>
  html,body { margin:0; height:100%; background:#081018; color:#dce7f0; font:13px sans-serif; overflow:hidden; }
  #hud { position:fixed; left:12px; top:12px; z-index:2; background:rgba(8,16,24,.75); padding:8px 10px; border:1px solid #3a6; }
  canvas { display:block; width:100%; height:100%; }
</style>
</head>
<body>
<div id="hud">hold Space thrust · click roll · A/D bank</div>
<canvas id="c"></canvas>
<script src="fly-b64.js"></script>
<script>
function u8fromB64(b64) {
  var bin = atob(b64), u = new Uint8Array(bin.length), i;
  for (i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i);
  return u.buffer;
}
async function goldFromWasm() {
  var buf = u8fromB64(window.FLY_WASM);
  var inst = await WebAssembly.instantiate(buf);
  var e = inst.instance.exports;
  var h = e.main_export();
  return Number(e.i64_of_export(h));
}

var st = { x: 0, alt: 5, spd: 2, bank: 0, roll: 0, thrust: 0 };
var keys = {};
window.addEventListener("keydown", function (e) { keys[e.code] = 1; if (e.code === "Space") e.preventDefault(); });
window.addEventListener("keyup", function (e) { keys[e.code] = 0; });
window.addEventListener("mousedown", function () { st.roll = st.roll ? 0 : 1; });

function step(live) {
  var thrust = live ? (keys.Space ? 1 : 0) : 1;
  if (live) {
    if (keys.KeyA || keys.ArrowLeft) st.bank = st.bank - 1;
    if (keys.KeyD || keys.ArrowRight) st.bank = st.bank + 1;
    if (st.bank > 8) st.bank = 8;
    if (st.bank < -8) st.bank = -8;
  }
  if (thrust) { st.spd = st.spd + 1; st.alt = st.alt + 2; }
  else { if (st.spd > 1) st.spd = st.spd - 1; if (st.alt > 2) st.alt = st.alt - 1; }
  if (st.alt > 40) st.alt = 40;
  if (st.alt < 2) st.alt = 2;
  st.x = st.x + st.spd + (st.roll ? 2 : 0);
}

var c = document.getElementById("c");
var g = c.getContext("2d");
function resize() {
  c.width = innerWidth;
  c.height = innerHeight;
}
window.addEventListener("resize", resize);
resize();

function island(gx, gy, s) {
  var k;
  g.fillStyle = "#1a3a28";
  for (k = 0; k < 6; k++) {
    g.beginPath();
    g.ellipse(gx, gy - k * 3, s - k, s * 0.45 - k * 0.3, 0, 0, 6.28);
    g.fill();
  }
  g.fillStyle = "#2e5a38";
  g.beginPath();
  g.ellipse(gx, gy - 18, s * 0.4, s * 0.2, 0, 0, 6.28);
  g.fill();
}

function jet(cx, cy, bank, roll) {
  var layer, ox;
  ox = bank * 2 + (roll ? 10 : 0);
  for (layer = 0; layer < 8; layer++) {
    g.fillStyle = layer < 3 ? "#8ab" : (layer < 6 ? "#c45" : "#eee");
    g.fillRect(cx + ox - 18 + layer, cy - layer * 2, 36 - layer, 8);
    g.fillRect(cx + ox - 28 + layer, cy - layer * 2 + 3, 12, 4);
    g.fillRect(cx + ox + 16 - layer, cy - layer * 2 + 3, 12, 4);
  }
}

var gold = 0, ok = 0, frames = 0;
(async function () {
  try {
    gold = await goldFromWasm();
    ok = gold === 3868 ? 1 : 0;
  } catch (e) { ok = 0; gold = -1; }
  document.title = ok ? "FLY_HOST1_OK" : "FLY_HOST1_FAIL";
})();

function draw() {
  var w = c.width, h = c.height, i, gx;
  var sky = st.alt / 40;
  g.fillStyle = "rgb(" + (20 + sky * 40) + "," + (40 + sky * 80) + "," + (70 + sky * 100) + ")";
  g.fillRect(0, 0, w, h);
  g.fillStyle = "#0a2030";
  g.fillRect(0, h * 0.62, w, h);
  for (i = 0; i < 7; i++) {
    gx = ((i * 180 - (st.x * 3)) % (w + 200)) - 80;
    island(gx, h * 0.62, 40 + (i % 3) * 10);
  }
  jet(w * 0.5, h * 0.45 - st.alt * 2, st.bank, st.roll);
  step(1);
  frames++;
  var hud = document.getElementById("hud");
  hud.textContent = (ok ? "FLY_HOST1_OK" : "FLY_HOST1_FAIL") +
    " wasm=" + gold + " alt=" + st.alt + " spd=" + st.spd +
    " x=" + st.x + " no-three host1-wasm · Space/click/AD";
  requestAnimationFrame(draw);
}
draw();
</script>
</body>
</html>
