<!doctype html>
<meta charset="utf-8">
<title>D4 行走城镇骨架</title>
<style>html,body{margin:0;background:#7bafca}canvas{display:block}output{display:none}</style>
<canvas width="1280" height="720"></canvas><output id="pixels"></output>
<script type="module">
import { createWebGLRenderer } from "../renderer-webgl.js";
import { Scene, PerspectiveCamera } from "../scene.js";
import { BOX_MESH, MESH_BOX, MESH_PLANE, allMeshes } from "../meshes.js";
import { leafMesh } from "./d3-foliage.js";
import { gaitPose, readGaitPixels } from "./d4-gait.js";
import { buildTown, townLayout } from "./d4-town.js";
import { barrelMesh, closeCamera } from "./d4-framing.js";
import { archMeshes } from "./d3-arch.js";

const params=new URLSearchParams(location.search), mode=params.get("mode");
const walkProbe=["walk","sliding-feet","frozen-body"].includes(mode);
const scene=new Scene(), extraMeshes=[], boxes=new Map(), groups=new Map();
const bodies=[];
const paint={
  chassis:[61,74,92], witness:[185,63,49], joint:[187,139,62], link:[119,123,126],
  foot:[119,74,49], white:[232,226,197], orange:[181,84,46], wood:[92,60,46],
  red:[174,50,42], glass:[85,133,149], smoke:[236,239,234], grass:[130,164,91],
  darkgrass:[83,131,74], farhill:[95,143,118], grove:[48,104,77],
  gearGold:[218,161,59], clockFace:[180,207,182], lift:[152,78,96],
  groundMark:[194,92,45]
};
function mesh(positions,normals,uvs) {
  const id=allMeshes().length+extraMeshes.length;
  extraMeshes.push({positions,normals,uvs,vCount:positions.length/3});
  return id;
}
function box(w,h,d) {
  const key=[w,h,d].join(",");
  if (!boxes.has(key)) {
    const size=[w,h,d];
    const normals=allMeshes()[MESH_BOX].normals;
    const positions=BOX_MESH.map((v,i)=>v*size[i%3]), uv=[];
    for(let i=0;i<positions.length;i+=3) {
      const [x,y,z]=positions.subarray(i,i+3);
      const u=normals[i] ? z : x, v=normals[i+1] ? z : y;
      uv.push((u+.32)/1.28,(v+.23)/1.28);
    }
    boxes.set(key,mesh(positions,normals,new Float32Array(uv)));
  }
  return boxes.get(key);
}
function add(color,id,x,y,z,size=1,yaw=0,pitch=0,roll=0) {
  const key=color+"/"+id;
  if(!groups.has(key)) groups.set(key,{color,id,items:[]});
  const item=[x,y,z,size,yaw,pitch,roll];
  groups.get(key).items.push(item);
  if (!["joint","link","foot","darkgrass","farhill","grove","groundMark"].includes(color) && id!==MESH_PLANE) bodies.push(item);
  return item;
}
function block(color,x,y,z,w,h,d,roll=0) { return add(color,box(w,h,d),x,y,z,1,0,0,roll); }
function linkTransform(a,b,scale=1) {
  const [x,y,z]=b.map((v,i)=>v-a[i]);
  const length=Math.hypot(x,y,z);
  return [(a[0]+b[0])/2,(a[1]+b[1])/2,(a[2]+b[2])/2,length/scale,0,Math.asin(z/length),Math.atan2(-x,y)];
}
function strut(a,b,width) {
  const length=Math.hypot(...b.map((v,i)=>v-a[i]));
  const {positions,normals,uvs}=barrelMesh(width,length);
  return [add("link",mesh(positions,normals,uvs),...linkTransform(a,b,length)),length];
}
const ball=leafMesh(1);
const round=mesh(ball.positions,ball.normals);
const spec=await fetch(new URL("d4-legs.tsv",import.meta.url));
if(!spec.ok) throw new Error("腿规格读取失败");
const legs=(await spec.text()).trim().split("\n").slice(1).map(line=>{
  const values=line.split("\t").slice(1).map(s=>Number(s)/1000);
  if(values.length!==9 || !values.every(Number.isFinite)) throw new Error("腿规格格式错误");
  return [values.slice(0,3),values.slice(3,6),values.slice(6,9)];
});
if(legs.length!==4) throw new Error("需要四条支撑腿");
const legItems=legs.map(([hip,knee,foot],i)=>{
  if(mode==="short-leg" && i===2) {
    knee[1]+=.92;
    foot[1]+=1.24;
  }
  return {
    thigh:strut(hip,knee,1.73), shin:strut(knee,foot,1.47),
    hip:add("joint",round,...hip,.77), knee:add("joint",round,...knee,1.03),
    foot:block("foot",...foot,1.42,.64,1.24)
  };
});

if(mode!=="no-deck") block("chassis",0,5.4,0,10.6,1.55,6.4);
block("witness",-.56,4.87,1.92,.64,.42,.65);
block("wood",0,6.23,0,11,.28,6.7);
for(let x=-4.5;x<=4.5;x+=1.5) bodies.push(add("joint",round,x,5.45,3.28,.21));

buildTown(await townLayout(),{block,add,round},mode);
const arcade=archMeshes([0,.28,.28,.10,-.10,.45,.73,0,10],"");
for(const part of arcade) {
  const segment=mesh(part.positions,part.normals,part.uvs);
  for(let i=0;i<8;i++) add("white",segment,-4.2+i*.99,6.37,3.20);
}
for(let i=0;i<8;i++) block(i%2?"white":"red",3.62,6.58+i*.43,.02,1.02,.43,1.02);
block("glass",3.62,10.12,.02,1.05,.46,1.05);
block("red",3.62,10.49,.02,1.27,.29,1.27);
block("wood",-3.35,9.65,2.13,.29,1.5,.36);
for(const angle of [.51,.51+Math.PI/2]) block("white",-3.35,9.62,2.37,.24,2.7,.12,angle);
bodies.push(add("joint",round,-3.35,9.62,2.47,.23));
add("grass",MESH_PLANE,0,-.035,0,130);
if(walkProbe || params.has("animate")) {
  for(let x=-12;x<=60;x+=3) block("darkgrass",x,-.007,8,.11,.05,1.1);
  block("groundMark",0,.12,9,.18,.24,.18);
}
const hill=leafMesh(.29);
const ridge=mesh(hill.positions,hill.normals);
for(let i=0;i<12;i++) {
  add("farhill",ridge,-64+i*12,-1,-69-i%3*4,12+i%4, i*.37);
  add("darkgrass",ridge,-48+i*9,-1.5,-45-i%3,8+i%4,i*.23);
  for(let j=0;j<12;j++) {
    const spread=Math.sin(i*13+j*7);
    add("grove",round,-49+i*9+j*.7,.35+(j%4)*.18,-39+(i%2)*4+spread*3,.64+(j%3)*.25);
  }
}

const bindings=new Map();
for(const [key,{color,id,items}] of groups) {
  const cloud=scene.instances(key,items.length,paint[color].map(c=>c/255));
  cloud.meshId=id; cloud.metalness=0; cloud.roughness=.65; cloud.toonLevels=3;
  cloud.outlineExcluded=["grass","darkgrass","farhill","grove","smoke"].includes(color);
  if(mode!=="no-texture" && ["white","wood","link"].includes(color)) {
    cloud.mapId=7;
    cloud.surfaceMap=color==="white"?"masonry":color==="wood"?"wood-grain":"metal-stain";
  }
  items.forEach((values,i)=>{
    cloud.set(i,...values);
    bindings.set(values,[cloud,i]);
  });
}
scene.clearColor=[.48,.69,.79,1];
scene.fog.density=0;
scene.ambient={color:[1,1,1],intensity:.84};
scene.lights=[{dir:[-.45,.79,.44],color:[1,1,1],intensity:.25}];
scene.outlineWidth=1;
const view=(!mode || ["framing","finish","no-texture","single-smoke"].includes(mode))?await closeCamera():null;
const camera=new PerspectiveCamera(view?.fovy ?? 2*Math.atan(.625),.1,150);
camera.setEye(...(view?.eye ?? [14.4,12,19.2]));
camera.setTarget(...(view?.target ?? [0,5,0]));
const canvas=document.querySelector("canvas");
const renderer=createWebGLRenderer(canvas,{antialias:false,extraMeshes});
const atlas=await fetch(new URL("d3-masonry.rgba", import.meta.url));
if(!atlas.ok) throw new Error("材质纹理读取失败");
const rgba=new Uint8Array(await atlas.arrayBuffer());
if(rgba.length!==64*64*4) throw new Error("材质纹理长度错误");
const textures=[{id:7,w:64,h:64,rgba,filter:1}];
function set(item,values) {
  const [cloud,i]=bindings.get(item);
  cloud.set(i,...values);
}
function renderPose(phase, gaitMode=mode) {
  const pose=gaitPose(legs,phase,gaitMode);
  const eye=view?.eye ?? [14.4,12,19.2], target=view?.target ?? [0,5,0];
  camera.setEye(eye[0]+pose.travel,eye[1],eye[2]);
  camera.setTarget(target[0]+pose.travel,target[1],target[2]);
  for(const item of bodies) set(item,item.map((value,axis)=>axis<3?value+pose.offset[axis]:value));
  pose.legs.forEach(([hip,knee,foot],i)=>{
    const parts=legItems[i];
    set(parts.hip,[...hip,...parts.hip.slice(3)]);
    set(parts.knee,[...knee,...parts.knee.slice(3)]);
    set(parts.foot,[...foot,...parts.foot.slice(3)]);
    for(const [name,a,b] of [["thigh",hip,knee],["shin",knee,foot]]) {
      const [item,length]=parts[name];
      set(item,linkTransform(a,b,length));
    }
  });
  renderer.render(scene,camera,textures);
}
if(!walkProbe && params.has("animate")) {
  const start=performance.now();
  const frame=time=>{
    renderPose((time-start)/670,mode || "walk");
    requestAnimationFrame(frame);
  };
  requestAnimationFrame(frame);
} else if(params.has("phase")) renderPose(Number(params.get("phase")));
else if(!walkProbe) renderer.render(scene,camera,textures);
const gl=canvas.getContext("webgl");
const density=["density","small-town","no-gear","framing","wide-camera"].includes(mode);
const finish=["finish","no-texture","single-smoke"].includes(mode);
function densityPixels() {
  const pixels=new Uint8Array(1280*720*4), result=[];
  gl.readPixels(0,0,1280,720,gl.RGBA,gl.UNSIGNED_BYTE,pixels);
  for(let y=5;y<720;y+=10) for(let x=5;x<1280;x+=10) {
    const at=4*((719-y)*1280+x);
    result.push(pixels.subarray(at,at+3).join(","));
  }
  if(finish) for(const region of (params.get("patches")||"").split(";").filter(Boolean)) {
    const [x,y,w,h]=region.split(",").map(Number);
    if(![x,y,w,h].every(Number.isInteger) || x<0 || y<0 || w<1 || h<1 ||
        w>64 || h>64 || x+w>1280 || y+h>720) throw new Error("纹理采样区非法");
    for(let yy=y;yy<y+h;yy++) for(let xx=x;xx<x+w;xx++) {
      const at=4*((719-yy)*1280+xx);
      result.push(pixels.subarray(at,at+3).join(","));
    }
  }
  return result.join(";");
}
function walkPixels() {
  const samples=(params.get("pixels")||"").split(";").filter(Boolean).map(pair=>{
    const [x,y]=pair.split(",").map(Number);
    return [x,y];
  });
  const pixels=new Uint8Array(4);
  const ground=samples.map(([x,y],i)=>{
    renderPose(i);
    gl.readPixels(x,719-y,1,1,gl.RGBA,gl.UNSIGNED_BYTE,pixels);
    return pixels.slice(0,3).join(",");
  });
  return [readGaitPixels(legs,mode,97),...ground].join(";");
}
document.querySelector("output").textContent=walkProbe ? walkPixels() :
  density || finish ? densityPixels() : ["gait","three-air","long-leg"].includes(mode)
  ? readGaitPixels(legs,mode)
  : (params.get("pixels")||"").split(";").filter(Boolean).map(pair=>{
  const [x,y]=pair.split(",").map(Number);
  const rgba=new Uint8Array(4);
  gl.readPixels(x,719-y,1,1,gl.RGBA,gl.UNSIGNED_BYTE,rgba);
  return rgba.slice(0,3).join(",");
}).join(";");
</script>
