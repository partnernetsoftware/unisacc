<!doctype html>
<meta charset="utf-8">
<pre id="r160">pending</pre>
<script type="module">
import { DataTexture, NearestFilter, REVISION } from "../../web/game/three.module.js";
if (REVISION !== "160") throw new Error("three.js revision mismatch");
const image = new Uint8Array([3,0,0,255,5,0,0,255,13,0,0,255,29,0,0,255]);
const source = new DataTexture(image,2,2), copy = source.clone();
const at = (x,y)=>copy.image.data[4*(y*copy.image.width+x)];
document.querySelector("#r160").textContent = JSON.stringify([
  at(1,1),at(0,1),copy.minFilter === NearestFilter && copy.magFilter === NearestFilter ? 0 : 1,
  Number(source.source === copy.source),-1,-1,
]);
</script>
