<!doctype html>
<meta charset="utf-8">
<pre id="r160">pending</pre>
<script type="module">
import { AnimationLoader, QuaternionKeyframeTrack, REVISION } from "../../web/game/three.module.js";
if (REVISION !== "160") throw new Error("three.js revision mismatch");
const clips = new AnimationLoader().parse([
  { name: "walk", fps: 2, tracks: [
    { name: ".position[x]", type: "number", times: [0,4], values: [2,10], interpolation: 2300 },
    { name: ".scale", type: "vector", times: [0,8], values: [1,2,3,2,3,4] },
    { name: ".quaternion", type: "quaternion", times: [0,6], values: [0,0,0,1,0,1,0,0] },
  ] },
  { name: "glow", duration: 9, blendMode: 2501, tracks: [
    { name: ".material.color", type: "color", times: [0,5], values: [1,0,0,0,1,0] },
  ] },
  { name: "empty", tracks: [] },
]);
const [walk, glow, empty] = clips;
document.querySelector("#r160").textContent = JSON.stringify([
  clips.length,walk.duration,walk.tracks.length,walk.tracks[0].getInterpolation(),walk.tracks[1].times[1],
  walk.tracks[1].values[5],walk.tracks[2] instanceof QuaternionKeyframeTrack ? 4 : 0,glow.blendMode,glow.duration,
  empty.duration,-1,-3,99,-1,
]);
</script>
