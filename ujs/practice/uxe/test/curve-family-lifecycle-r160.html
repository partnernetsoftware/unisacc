<!doctype html>
<meta charset="utf-8">
<pre id="r160">pending</pre>
<script type="module">
import { REVISION, Vector2, Vector3, LineCurve, QuadraticBezierCurve, QuadraticBezierCurve3,
  CubicBezierCurve, CubicBezierCurve3 } from "../../web/game/three.module.js";
const result = document.querySelector("#r160");
try {
  if (REVISION !== "160") throw new Error("revision mismatch");
  const classes = [[LineCurve, Vector2, 2], [QuadraticBezierCurve, Vector2, 3],
    [QuadraticBezierCurve3, Vector3, 3], [CubicBezierCurve, Vector2, 4],
    [CubicBezierCurve3, Vector3, 4]];
  const hash = text => [...text].reduce((value, ch) => (value * 131 + ch.charCodeAt(0)) % 16777213, 0);
  result.textContent = JSON.stringify(classes.flatMap(([Class, Vector, count]) => {
    const source = new Class(new Vector(1, 2, 3), new Vector(4, 5, 6),
      ...Array.from({ length: count - 2 }, (_, i) => new Vector(7 + 3 * i, 8 + 3 * i, 9 + 3 * i)));
    source.arcLengthDivisions = 17;
    const first = count === 2 ? "v1" : "v0";
    const target = new Vector(91, 92, 93);
    const receiver = new Class(target);
    const copy = receiver.copy(source) === receiver && receiver[first] === target &&
      target.x === 1 && target.y === 2 && receiver.arcLengthDivisions === 17;
    const clone = source.clone();
    clone[first].x = 99;
    const independent = clone !== source && clone[first] !== source[first] &&
      source[first].x === 1 && clone.arcLengthDivisions === 17;
    const json = source.toJSON();
    const restoreTarget = new Vector();
    const restored = new Class(restoreTarget);
    const restore = restored.fromJSON(json) === restored && restored[first] === restoreTarget &&
      restoreTarget.x === 1 && restoreTarget.y === 2 && restored.arcLengthDivisions === 17 &&
      restored.getPoint(1).x === 1 + 3 * (count - 1);
    return [Number(copy), Number(independent), hash(JSON.stringify(json)), Number(restore)];
  }));
} catch (error) { result.textContent = String(error); }
</script>
