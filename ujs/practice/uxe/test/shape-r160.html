<!doctype html>
<meta charset="utf-8">
<pre id="r160">pending</pre>
<script type="module">
import { Shape, Path, REVISION } from "../../web/game/three.module.js";
if (REVISION !== "160") throw new Error("three.js revision mismatch");
const shape = new Shape();
shape.moveTo(0, 0); shape.lineTo(0, 4); shape.lineTo(4, 0); shape.closePath();
const hole = new Path();
hole.moveTo(1, 1); hole.lineTo(2, 1); hole.lineTo(1, 2); hole.closePath();
shape.holes.push(hole);
const { shape: outer, holes } = shape.extractPoints(3);
document.querySelector("#r160").textContent = JSON.stringify([outer.length, holes.length,
  holes[0].length, outer[1].y, holes[0][1].x, holes[0][2].y]);
</script>
