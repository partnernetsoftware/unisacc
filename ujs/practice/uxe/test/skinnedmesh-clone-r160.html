<!doctype html>
<meta charset="utf-8">
<pre id="r160">pending</pre>
<script type="module">
import { BufferGeometry, DetachedBindMode, Matrix4, MeshBasicMaterial, REVISION, Skeleton, SkinnedMesh }
  from "../../web/game/three.module.js";
if (REVISION !== "160") throw new Error("three.js revision mismatch");
const source = new SkinnedMesh(new BufferGeometry(),new MeshBasicMaterial());
const skeleton = new Skeleton();
source.bind(skeleton,new Matrix4().makeScale(2,1,1));
source.bindMode = DetachedBindMode;
source.updateMatrixWorld();
const copy = source.clone();
const matrix = copy.bindMatrix.elements[0], inverse = copy.bindMatrixInverse.elements[0];
copy.bindMatrix.elements[0] = 7;
document.querySelector("#r160").textContent = JSON.stringify([
  Number(copy.geometry === source.geometry && copy.material === source.material),
  Number(copy.skeleton === source.skeleton),matrix,inverse,
  copy.bindMode === DetachedBindMode ? 2 : 1,source.bindMatrix.elements[0],
]);
</script>
