<!doctype html>
<meta charset="utf-8">
<pre id="r160">pending</pre>
<script type="module">
import {NumberKeyframeTrack,VectorKeyframeTrack,ColorKeyframeTrack,QuaternionKeyframeTrack,REVISION}
  from "../../web/game/three.module.js";
if(REVISION!=="160") throw new Error("three.js revision mismatch");
const track=new NumberKeyframeTrack(".n",[0,1,2],[0,4,1]);
const buffer=new Float32Array(1);
const prior=track.createInterpolant(buffer);
const x=prior.evaluate(.5);
const linear=x[0], identity=Number(x===buffer);
track.setInterpolation(2300);
const discrete=track.createInterpolant().evaluate(.5)[0];
const old=prior.evaluate(.5)[0];
track.setInterpolation(9999);
const kept=track.getInterpolation();
track.setInterpolation(2302);
const cubic=track.createInterpolant().evaluate(.5)[0];
const vector=new VectorKeyframeTrack(".v",[0,1,2],[2,10,6,14,8,16]).createInterpolant().evaluate(.5)[1];
const color=new ColorKeyframeTrack(".c",[0,1,2],[0,1,0,1,0,1,0,0,0]).createInterpolant().evaluate(.5)[2];
const quat=new QuaternionKeyframeTrack(".q",[0,2],[0,0,0,1,0,0,1,0],2302);
const qDefault=quat.getInterpolation(), qLinear=quat.createInterpolant().evaluate(1)[2];
quat.setInterpolation(2300).setInterpolation(2302);
const qDiscrete=quat.createInterpolant().evaluate(1)[2];
class WideTrack extends NumberKeyframeTrack {}
WideTrack.prototype.TimeBufferType=Float64Array;
WideTrack.prototype.ValueBufferType=Array;
const wide=new WideTrack(".n",[16777216,16777217],[0,1+2**-30]);
const wideValue=(wide.createInterpolant().evaluate(16777216.5)[0]-.5)*2**31;
const wideBuffer=new Float64Array(1);
const wideIdentity=Number(wide.createInterpolant(wideBuffer).evaluate(16777216.5)===wideBuffer);
const fallback=new NumberKeyframeTrack(".n",[0,1],[0,1],9999).getInterpolation();
document.querySelector("#r160").textContent=JSON.stringify([
  linear,identity,discrete,old,kept,cubic,vector,color,qDefault,qLinear,qDiscrete,wideValue,wideIdentity,fallback
]);
</script>
