<!doctype html>
<meta charset="utf-8">
<pre id="r160">pending</pre>
<script type="module">
import { ImageUtils, REVISION } from "../../web/game/three.module.js";
const output=document.querySelector("#r160");
try {
  if(REVISION!=="160") throw new Error("three.js revision mismatch");
  const canvas=document.createElement("canvas");
  canvas.width=3;
  canvas.height=1;
  const source=new Uint8ClampedArray([255,128,0,128,25,125,250,32,255,0,0,1]);
  canvas.getContext("2d").putImageData(new ImageData(source,3,1),0,0);
  const paint=img=>ImageUtils.sRGBToLinear(img).getContext("2d").getImageData(0,0,3,1).data;
  const blob=await new Promise(resolve=>canvas.toBlob(resolve));
  const url=URL.createObjectURL(blob);
  const img=new Image();
  img.src=url;
  await img.decode();
  const bitmap=await createImageBitmap(blob);
  const pixels=paint(img);
  const others=paint(bitmap);
  bitmap.close();
  URL.revokeObjectURL(url);
  if(pixels.some((value,i)=>value!==others[i])) throw new Error("source families disagree");
  output.textContent=JSON.stringify([pixels.length,pixels[0],pixels[1],pixels[3],pixels[4],
    pixels[5],pixels[6],pixels[7],pixels[8]+256*pixels[9]+65536*pixels[10]+16777216*pixels[11],-1]);
} catch(error) { output.textContent=`error:${error.message}`; }
</script>
