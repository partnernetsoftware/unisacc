<!DOCTYPE html>
<html lang="zh"><head>
<meta charset="utf-8"/><title>uxe-points-alpha</title>
</head><body>
<canvas id="c" width="64" height="64"></canvas>
<pre id="hud"></pre>
<script type="module">
import { createWebGLRenderer } from "../renderer-webgl.js";
import { Scene, PerspectiveCamera } from "../scene.js";
import { MESH_POINTS } from "../meshes.js";
(async()=>{
  const hud=document.getElementById("hud");
  try{
    const canvas=document.getElementById("c");
    const r=createWebGLRenderer(canvas,{antialias:false});
    const scene=new Scene();
    scene.clearColor=[80/255,120/255,60/255,1];
    scene.fog={density:0,color:[0,0,0]};
    scene.ambient={color:[0,0,0],intensity:0};
    scene.lights=[];

    const cloud=scene.instances("p",1,[1,0,0]);
    cloud.meshId=MESH_POINTS;
    cloud.count=1;
    cloud.billboard=1;
    cloud.alphaMode=1;
    cloud.emissive=[0,0,0];
    cloud.instColor=new Uint8Array([220,10,30,255]);


    cloud.set(0,0,0,0,1.6);
    const cam=new PerspectiveCamera(1.0,0.05,40);
    cam.setEye(0,0,8); cam.setTarget(0,0,0);
    r.render(scene,cam,[]);
    const gl=canvas.getContext("webgl");
    const px=new Uint8Array(4);
    const d=8.0, half=0.5463024898437905, W=64.0, H=64.0;
    const cx=(0.5)*W|0, cy=(0.5)*H|0;
    const rPix=((0.8/d)/half)*0.5*W;
    const ds=[0, 0.5, 0.9, 1.2];
    const samples=[];
    for(const t of ds){
      const sx=(cx+t*rPix)|0, sy=cy;
      gl.readPixels(sx,H-1-sy,1,1,gl.RGBA,gl.UNSIGNED_BYTE,px);
      samples.push([sx,sy,px[0],px[1],px[2],px[3]]);
    }
    hud.textContent=JSON.stringify({mode:"alpha",rPix:rPix,samples:samples});
    document.title="POINTS_ALPHA";
  }catch(e){
    document.title="POINTS_ERR";
    hud.textContent=String(e&&e.message||e);
  }
})();
</script>
</body></html>
