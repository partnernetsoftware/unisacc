<!DOCTYPE html>
<html lang="zh"><head>
<meta charset="utf-8"/><title>uxep-v4</title>
</head><body>
<div id="hud">uxep-v4</div>
<script type="module">
import { encodeRenderPacket, decodeRenderPacket } from "../packet.js";
function fnv1a(buf){
  const u=new Uint8Array(buf);
  let h=2166136261;
  for(let i=0;i<u.length;i++){ h^=u[i]; h=Math.imul(h,16777619)>>>0; }
  return h;
}
function hx(c){
  if(c>=48&&c<=57) return c-48;
  if(c>=97&&c<=102) return c-87;
  if(c>=65&&c<=70) return c-55;
  return -1;
}
const wantFnv=(/(?:\?|&)fnv=(\d+)/.exec(location.search)||[])[1];
const hud=document.getElementById("hud");
(async()=>{
  let a=0,b=0,c=0,d=0,e=0,err="";
  try{
    const url=new URL("../../../tests/uxep-tri-oracle.hex", import.meta.url);
    const txt=await (await fetch(url)).text();
    const bytes=[];
    for(const line of txt.split("\n")){
      if(!line||line[0]==="#") continue;
      for(let i=0;i+1<line.length;){
        while(line[i]===" ") i++;
        if(i+1>=line.length||line[i]==="\n") break;
        const hi=hx(line.charCodeAt(i++)), lo=hx(line.charCodeAt(i++));
        if(hi<0||lo<0) break;
        bytes.push((hi<<4)|lo);
      }
    }
    const ab=new Uint8Array(bytes).buffer;
    const dec=decodeRenderPacket(ab);
    const enc=encodeRenderPacket(dec);
    a=(String(fnv1a(enc))===String(wantFnv))?1:0;
    if(!a) err+="fnv;";
  }catch(ex){ err+="a;"; }
  const cam={fovy:1,near:0.1,far:100,eye:[0,1,2],target:[0,0,0]};
  const cloud0={color:[1,1,1],count:0,xyz:new Float32Array(0),scale:new Float32Array(0),mapId:1};
  try{
    decodeRenderPacket(encodeRenderPacket({clear:[0,0,0,1],camera:cam,clouds:[cloud0]}));
    err+="dangle-no-throw;";
  }catch(ex){
    b=/dangling mapId/.test(String(ex&&ex.message||ex))?1:0;
    if(!b) err+="dangle-msg;";
  }
  try{
    decodeRenderPacket(encodeRenderPacket({clear:[0,0,0,1],camera:cam,clouds:[cloud0]}), {1:1});
    d=1;
  }catch(ex){ err+="cache-frame2;"; }
  try{
    const w=1024,h=257;
    decodeRenderPacket(encodeRenderPacket({
      clear:[0,0,0,1],camera:cam,
      clouds:[cloud0],
      textures:[{id:1,w,h,rgba:new Uint8Array(w*h*4)}]
    }));
    err+="oversize-no-throw;";
  }catch(ex){
    c=/tex too large/.test(String(ex&&ex.message||ex))?1:0;
    if(!c) err+="oversize-msg;";
  }
  try{
    const p=encodeRenderPacket({clear:[0,0,0,1],camera:cam,clouds:[{color:[1,1,1],count:1,xyz:new Float32Array([0,0,0]),scale:new Float32Array([1]),mapId:1,alphaMode:1}],textures:[{id:1,w:1,h:1,rgba:new Uint8Array([1,2,3,4])}]});
    const d2=decodeRenderPacket(p);
    if((d2.clouds[0].alphaMode|0)!==1) err+="alphaMode-roundtrip;";
  }catch(ex){ err+="alphaMode-ex;"; }
  try{
    const p3=encodeRenderPacket({clear:[0,0,0,1],camera:cam,clouds:[{color:[1,1,1],count:1,xyz:new Float32Array([0,0,0]),scale:new Float32Array([1])}]});
    const d3=decodeRenderPacket(p3);
    if((d3.version|0)!==3) err+="v3-ver;";
    if((d3.clouds[0].alphaMode|0)!==0 || (d3.clouds[0].uvOrigin|0)!==0) err+="v3-flags;";
  }catch(ex){ err+="v3-ex;"; }
  try{
    const ic=new Uint8Array([9,8,7,6,5,4,3,2]);
    const p=encodeRenderPacket({clear:[0,0,0,1],camera:cam,clouds:[{color:[1,1,1],count:2,xyz:new Float32Array([0,0,0,1,0,0]),scale:new Float32Array([1,1]),instColor:ic}]});
    const d=decodeRenderPacket(p);
    if(!d.clouds[0].instColor||d.clouds[0].instColor.length!==8||d.clouds[0].instColor[0]!==9||d.clouds[0].instColor[7]!==2) err+="instColor-roundtrip;";
  }catch(ex){ err+="instColor-ex;"; }
  e=err.length===0?1:0;

  const ok=a&&b&&c&&d&&e;
  document.title=ok?"UXEP_V4_OK":"UXEP_V4_FAIL";
  hud.textContent=document.title+" "+err;

})();
</script>
</body></html>
