<!DOCTYPE html>
<html lang="zh"><head>
<meta charset="utf-8"/><title>uxep-v4</title>
</head><body>
<div id="hud">uxep-v4</div>
<script type="module">
import { encodeRenderPacket, decodeRenderPacket } from "../packet.js";
function fnv1a(buf){
  const u=new Uint8Array(buf);
  let h=2166136261;
  for(let i=0;i<u.length;i++){ h^=u[i]; h=Math.imul(h,16777619)>>>0; }
  return h;
}
function hx(c){
  if(c>=48&&c<=57) return c-48;
  if(c>=97&&c<=102) return c-87;
  if(c>=65&&c<=70) return c-55;
  return -1;
}
const wantFnv=(/(?:\?|&)fnv=(\d+)/.exec(location.search)||[])[1];
const hud=document.getElementById("hud");
(async()=>{
  let a=0,b=0,err="";
  try{
    const url=new URL("../../../tests/uxep-tri-oracle.hex", import.meta.url);
    const txt=await (await fetch(url)).text();
    const bytes=[];
    for(const line of txt.split("\n")){
      if(!line||line[0]==="#") continue;
      for(let i=0;i+1<line.length;){
        while(line[i]===" ") i++;
        if(i+1>=line.length||line[i]==="\n") break;
        const hi=hx(line.charCodeAt(i++)), lo=hx(line.charCodeAt(i++));
        if(hi<0||lo<0) break;
        bytes.push((hi<<4)|lo);
      }
    }
    const ab=new Uint8Array(bytes).buffer;
    const dec=decodeRenderPacket(ab);
    const enc=encodeRenderPacket(dec);
    const h=fnv1a(enc);
    a=(String(h)===String(wantFnv))?1:0;
    if(!a) err+="fnv "+h+" want "+wantFnv+";";
  }catch(e){ err+="a:"+e+";"; }
  try{
    const pkt=encodeRenderPacket({
      clear:[0,0,0,1],
      camera:{fovy:1,near:0.1,far:100,eye:[0,1,2],target:[0,0,0]},
      clouds:[{color:[1,1,1],count:0,xyz:new Float32Array(0),scale:new Float32Array(0),mapId:1}]
    });
    decodeRenderPacket(pkt);
    err+="dangle-no-throw;";
  }catch(e){
    const m=String(e&&e.message||e);
    b=/dangling|mapId|map_id/i.test(m)?1:0;
    if(!b) err+="dangle-msg:"+m+";";
  }
  try{
    const w=1024,h=257;
    const pkt=encodeRenderPacket({
      clear:[0,0,0,1],
      camera:{fovy:1,near:0.1,far:100,eye:[0,1,2],target:[0,0,0]},
      clouds:[{color:[1,1,1],count:0,xyz:new Float32Array(0),scale:new Float32Array(0),mapId:1}],
      textures:[{id:1,w,h,rgba:new Uint8Array(w*h*4)}]
    });
    decodeRenderPacket(pkt);
    err+="oversize-no-throw;";
  }catch(e){
    const m=String(e&&e.message||e);
    if(/too large|1MiB|limit|bound/i.test(m)) b=b;
    else err+="oversize-msg:"+m+";";
  }
  const ok=a&&b&&err.indexOf("no-throw")<0;
  document.title=ok?"UXEP_V4_OK":"UXEP_V4_FAIL";
  hud.textContent=document.title+" "+err;
})();
</script>
</body></html>
