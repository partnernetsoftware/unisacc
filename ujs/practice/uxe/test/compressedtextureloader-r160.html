<!doctype html>
<meta charset="utf-8">
<pre id="r160">pending</pre>
<script type="module">
import { CompressedTextureLoader, RGBA_S3TC_DXT5_Format, REVISION } from "../../web/game/three.module.js";
if (REVISION !== "160") throw new Error("three.js revision mismatch");
class FixtureLoader extends CompressedTextureLoader {
  parse(buffer) {
    return { isCubemap: false, mipmaps: [{ data: new Uint8Array(buffer), width: 5, height: 5 }],
      mipmapCount: 1, width: 5, height: 5, format: RGBA_S3TC_DXT5_Format };
  }
}
const texture = await new FixtureLoader().loadAsync("data:application/octet-stream;base64," + btoa("\0".repeat(64)));
document.querySelector("#r160").textContent = JSON.stringify([
  texture.mipmaps[0].data.length, texture.format, texture.image.width, -3, -2, -1,
]);
texture.dispose();
</script>
