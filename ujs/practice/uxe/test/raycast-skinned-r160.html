<!doctype html>
<meta charset="utf-8">
<pre id="r160">pending</pre>
<script type="module">
import { Bone, BufferGeometry, DetachedBindMode, Float32BufferAttribute, Matrix4, Mesh, MeshBasicMaterial, Raycaster,
  REVISION, Skeleton, SkinnedMesh, Uint16BufferAttribute, Vector3 } from "../../web/game/three.module.js";
if(REVISION!=="160") throw new Error("three.js revision mismatch");
const geometry=new BufferGeometry();
geometry.setAttribute("position",new Float32BufferAttribute([2,-1,0,4,-1,0,3,1,0],3));
geometry.setAttribute("skinIndex",new Uint16BufferAttribute(new Uint16Array(12),4));
geometry.setAttribute("skinWeight",new Float32BufferAttribute([1,0,0,0,1,0,0,0,1,0,0,0],4));
const material=new MeshBasicMaterial();
const bone=new Bone();
bone.position.x=-3;
bone.updateMatrixWorld();
const skin=new SkinnedMesh(geometry,material);
skin.bindMode=DetachedBindMode;
skin.bind(new Skeleton([bone],[new Matrix4()]),new Matrix4());
skin.position.z=-4;
skin.updateMatrixWorld();
const plain=new Mesh(geometry,material);
plain.position.z=-4;
plain.updateMatrixWorld();
const ray=new Raycaster(new Vector3(),new Vector3(0,0,-1));
const hits=ray.intersectObject(skin);
const original=ray.intersectObject(plain);
ray.far=3;
const clipped=ray.intersectObject(skin);
document.querySelector("#r160").textContent=JSON.stringify([
  hits.length,hits[0].distance,hits[0].faceIndex,original.length,clipped.length,-2,77,-1,
]);
</script>
