<!doctype html>
<meta charset="utf-8">
<pre id="r160">pending</pre>
<script type="module">
import { BatchedMesh, BufferGeometry, Float32BufferAttribute, Matrix4, MeshBasicMaterial, Raycaster, REVISION, Vector3 }
  from "../../web/game/three.module.js";
if(REVISION!=="160") throw new Error("three.js revision mismatch");
const geometry=new BufferGeometry();
geometry.setAttribute("position",new Float32BufferAttribute([-1,-1,0,1,-1,0,0,1,0],3));
const batch=new BatchedMesh(3,9,0,new MeshBasicMaterial());
batch.addGeometry(geometry);
batch.addGeometry(geometry);
batch.addGeometry(geometry);
batch.setMatrixAt(0,new Matrix4().makeTranslation(0,0,-4));
batch.setMatrixAt(1,new Matrix4().makeTranslation(0,0,-2));
batch.setMatrixAt(2,new Matrix4().makeTranslation(3,0,-1));
batch.position.z=-1;
batch.updateMatrixWorld();
const ray=new Raycaster(new Vector3(),new Vector3(0,0,-1));
const hits=ray.intersectObject(batch);
batch.setVisibleAt(1,false);
const hidden=ray.intersectObject(batch);
batch.setVisibleAt(1,true);
batch.deleteGeometry(0);
const deleted=ray.intersectObject(batch);
batch.layers.set(1);
const masked=ray.intersectObject(batch);
document.querySelector("#r160").textContent=JSON.stringify([
  hits.length,hits[0].batchId,hits[0].distance,hits[0].faceIndex,hidden[0].batchId,
  deleted.length,masked.length,77,-1,-1,
]);
</script>
