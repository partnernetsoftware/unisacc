<!doctype html>
<meta charset="utf-8">
<pre id="r160">pending</pre>
<script type="module">
import { Plane, PlaneHelper, REVISION, Vector3 } from "../../web/game/three.module.js";
if(REVISION!=="160") throw new Error("three.js revision mismatch");
const plane=new Plane(new Vector3(0.6,0,0.8),3);
const helper=new PlaneHelper(plane,4);
helper.updateMatrixWorld();
const outline=helper.geometry.attributes.position;
const fill=helper.children[0].geometry.attributes.position;
const matrix=helper.matrixWorld.elements;
const values=[outline.count,fill.count,outline.array[3],fill.array[16],helper.material.color.getHex(),
  matrix[0],matrix[2],matrix[5],matrix[12],matrix[14]];
plane.set(new Vector3(0,1,0),2);
helper.updateMatrixWorld();
values.push(matrix[10]);
plane.set(new Vector3(0,0,0),2);
helper.updateMatrixWorld();
values.push(matrix[14]);
let released=0;
for(const owner of [helper,helper.children[0]]) {
  owner.geometry.addEventListener("dispose",()=>released++);
  owner.material.addEventListener("dispose",()=>released++);
}
helper.dispose();
document.querySelector("#r160").textContent=JSON.stringify([...values,released===4?0:1,-1,-1]);
</script>
