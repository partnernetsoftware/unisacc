<!doctype html>
<meta charset="utf-8">
<pre id="r160">pending</pre>
<script type="module">
import { BufferGeometry, Float32BufferAttribute, InstancedMesh, Matrix4, MeshBasicMaterial, Raycaster, REVISION, Vector3 }
  from "../../web/game/three.module.js";
if(REVISION!=="160") throw new Error("three.js revision mismatch");
const geometry=new BufferGeometry();
geometry.setAttribute("position",new Float32BufferAttribute([-1,-1,0,1,-1,0,0,1,0],3));
const mesh=new InstancedMesh(geometry,new MeshBasicMaterial(),3);
mesh.position.z=-1;
mesh.setMatrixAt(0,new Matrix4().makeTranslation(0,0,-4));
mesh.setMatrixAt(1,new Matrix4().makeTranslation(0,0,-2));
mesh.setMatrixAt(2,new Matrix4().makeTranslation(3,0,-1));
mesh.updateMatrixWorld();
const ray=new Raycaster(new Vector3(),new Vector3(0,0,-1));
const hits=ray.intersectObject(mesh);
mesh.setMatrixAt(0,new Matrix4().makeTranslation(0,0,-2));
const equal=ray.intersectObject(mesh);
mesh.setMatrixAt(0,new Matrix4().makeTranslation(0,0,-4));
ray.far=4;
const clipped=ray.intersectObject(mesh);
mesh.layers.set(1);
const masked=ray.intersectObject(mesh);
document.querySelector("#r160").textContent=JSON.stringify([
  hits.length,hits[0].instanceId,hits[0].distance,hits[1].distance,equal[0].instanceId,clipped.length,masked.length,-1,77,-1,
]);
</script>
