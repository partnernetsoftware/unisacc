<!doctype html>
<meta charset="utf-8">
<pre id="wasm-cases">pending</pre>
<script type="module">
const status = document.querySelector("#wasm-cases");
try {
  const load = async name => WebAssembly.compile(await (await fetch(name)).arrayBuffer());
  const [library,probe] = await Promise.all([load("base.wasm"),load("probe.wasm")]);
  const params = new URLSearchParams(location.search);
   const values = [];
  for (let i = 0; i < 6; i++) {
    const base = await WebAssembly.instantiate(library);
    const product = await WebAssembly.instantiate(probe,{uxe_mesh_object_v1:base.exports});
    if (base.exports.uxe_abi_version() !== 1 || product.exports.uxe_abi_version() !== 1 ||
        base.exports.memory === product.exports.memory) throw new Error("mesh ABI mismatch");
    values.push(product.exports.uxe_evaluate_case(BigInt(i === 3 && params.has("mutate") ? 6 : i)));
  }
  status.textContent = JSON.stringify(values);
} catch (error) {
  status.textContent = "error:" + error.message;
}
</script>
