<!doctype html>
<meta charset="utf-8">
<pre id="r160">pending</pre>
<script type="importmap">{"imports":{"three":"../../web/game/three.module.js"}}</script>
<script type="module">
import { REVISION } from "three";
const root=new URLSearchParams(location.search).get("package");
const {FontLoader}=await import(`file://${root}/examples/jsm/loaders/FontLoader.js`);
if(REVISION!=="160") throw Error("three.js revision mismatch");
const font=new FontLoader().parse({
  familyName:"UXE layout fixture",resolution:1000,boundingBox:{yMax:1000,yMin:-100},underlineThickness:100,
  glyphs:{
    " ":{ha:300},
    "?":{ha:500,o:"m 0 0 l 0 100 l 200 0 l 0 0"},
    A:{ha:700,o:"m 0 0 l 0 100 l 300 0 l 0 0"},
    B:{ha:900,o:"m 0 0 l 0 100 l 400 0 l 0 0"},
  },
});
const shapes=font.generateShapes("A B\nΩA",10);
const cases=[shapes.length];
for(const shape of shapes) {
  const p=shape.getPoints();
  const minX=Math.min(...p.map(v=>v.x)),maxX=Math.max(...p.map(v=>v.x));
  const minY=Math.min(...p.map(v=>v.y));
  cases.push(minX,minY,[0,0,63,65,66][Math.round(maxX-minX)]);
}
document.querySelector("#r160").textContent=JSON.stringify([...cases,-3,77,-2]);
</script>
