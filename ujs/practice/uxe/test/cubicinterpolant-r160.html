<!doctype html>
<meta charset="utf-8">
<pre id="r160">pending</pre>
<script type="module">
import { CubicInterpolant, ZeroCurvatureEnding, ZeroSlopeEnding, WrapAroundEnding, REVISION } from "../../web/game/three.module.js";
if (REVISION !== "160") throw new Error("three.js revision mismatch");
const natural = ZeroCurvatureEnding;
const evaluate = (time, endingStart, endingEnd) => {
  const f = new CubicInterpolant(new Float32Array([0, 2, 4]), new Float32Array([0, 4, 0]), 1);
  f.settings = { endingStart, endingEnd };
  return f.evaluate(time)[0];
};
const modes = [natural, ZeroSlopeEnding, WrapAroundEnding];
document.querySelector("#r160").textContent = JSON.stringify([
  ...modes.map(mode => evaluate(1, mode, natural)), ...modes.map(mode => evaluate(3, natural, mode)),
  evaluate(5, natural, natural), -1
]);
</script>
