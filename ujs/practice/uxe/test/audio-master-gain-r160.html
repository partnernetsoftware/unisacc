<!doctype html>
<meta charset="utf-8">
<pre id="r160">pending</pre>
<script type="module">
import { Audio, AudioContext, AudioListener, REVISION } from "../../web/game/three.module.js";
const output=document.querySelector("#r160");
try {
  if(REVISION!=="160") throw new Error("three.js revision mismatch");
  async function render(retarget) {
    const context=new OfflineAudioContext(1,256,48000);
    AudioContext.setContext(context);
    const listener=new AudioListener();
    listener.setMasterVolume(0.25);
    const source=context.createBuffer(1,256,48000);
    source.getChannelData(0).fill(1);
    new Audio(listener).setBuffer(source).play();
    const suspended=retarget?context.suspend(128/48000):null;
    const rendered=context.startRendering();
    if(suspended) {
      await suspended;
      listener.setMasterVolume(0.75);
      await context.resume();
    }
    return (await rendered).getChannelData(0);
  }
  const ordinary=await render(false);
  const retargeted=await render(true);
  output.textContent=JSON.stringify([...([0,64,128,255].map(i=>Math.round(ordinary[i]*1e6))),
    Math.round(retargeted[128]*1e6),-1]);
} catch(error) { output.textContent=`error:${error.message}`; }
</script>
