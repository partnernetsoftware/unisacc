<!doctype html>
<meta charset="utf-8">
<pre id="r160">pending</pre>
<script type="module">
import { REVISION, ShapePath } from "../../web/game/three.module.js";
if (REVISION !== "160") throw new Error("three.js revision mismatch");
const path = new ShapePath();
const empty = path.toShapes().length;
path.moveTo(0,0);
const point = path.toShapes().length;
path.lineTo(3,0);
const owner = path.toShapes()[0].curves === path.currentPath.curves;
document.querySelector("#r160").textContent = JSON.stringify([empty, point, Number(owner), -1]);
</script>
