<!doctype html>
<meta charset="utf-8">
<pre id="r160">pending</pre>
<script type="module">
import { CompressedTexture, RGBA_S3TC_DXT3_Format, REVISION } from "../../web/game/three.module.js";
if (REVISION !== "160") throw Error("three.js revision mismatch");
const mip = { width: 4, height: 2, data: Uint8Array.of(16,248,171,247,0,0,0,0,31,0,0,248,228,228,0,0) };
const texture = new CompressedTexture([mip], 4, 2, RGBA_S3TC_DXT3_Format);
if (texture.mipmaps[0] !== mip || texture.flipY || texture.generateMipmaps) throw Error("r160 mip descriptor mismatch");
// DXT3 uses four interpolated RGB565 colors independently of endpoint order.
const expected = [[0,0,255,0],[255,0,0,17],[85,0,170,136],[170,0,85,255],[0,0,255,187]];
const rgba = bytes => bytes.reduce((value, byte, i) => value + byte * 256 ** i, 0);
document.querySelector("#r160").textContent = JSON.stringify([32,...expected.map(rgba),-1,-1,-3,-2]);
texture.dispose();
</script>
