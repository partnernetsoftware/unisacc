<!doctype html>
<meta charset="utf-8">
<pre id="r160">pending</pre>
<script type="module">
import { Color, GridHelper, REVISION } from "../../web/game/three.module.js";
if(REVISION!=="160") throw new Error("three.js revision mismatch");
const center=new Color().setRGB(0.25,0,0);
const line=new Color().setRGB(0.5,0,0);
const even=new GridHelper(8,2,center,line);
const odd=new GridHelper(8,3,center,line);
const pos=even.geometry.attributes.position;
const color=even.geometry.attributes.color;
let released=0;
even.geometry.addEventListener("dispose",()=>released++);
even.material.addEventListener("dispose",()=>released++);
even.dispose();
document.querySelector("#r160").textContent=JSON.stringify([
  pos.count,pos.array[6],pos.array[11],pos.array[14],color.array[12],
  odd.geometry.attributes.color.array[24],released===2?0:1,-1,-1,
]);
</script>
