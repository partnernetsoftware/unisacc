<!doctype html>
<meta charset="utf-8">
<pre id="r160">pending</pre>
<script type="importmap">{"imports":{"three":"../../web/game/three.module.js"}}</script>
<script type="module">
import { REVISION } from "three";
const root=new URLSearchParams(location.search).get("package");
const { GLTFLoader }=await import(`file://${root}/examples/jsm/loaders/GLTFLoader.js`);
if(REVISION!=="160") throw new Error("three.js revision mismatch");
const input={
  asset:{version:"2.0"},scene:1,scenes:[{nodes:[1]},{nodes:[2,0]},{}],
  nodes:[{name:"n0"},{name:"n1",children:[2,0]},{name:"n2"}],
};
// Use separate documents so that the same node is never a child in one
// scene and a root in another concurrently created scene.
const children={...input,scene:0,scenes:[{nodes:[1]}]};
const roots={...input,nodes:input.nodes.map(node=>({name:node.name}))};
const [parsed,withChildren]=await Promise.all([
  new GLTFLoader().parseAsync(JSON.stringify(roots),""),
  new GLTFLoader().parseAsync(JSON.stringify(children),""),
]);
const index=node=>Number(node.name.slice(1));
const childList=withChildren.scene.children[0].children;
document.querySelector("#r160").textContent=JSON.stringify([
  parsed.scene.children.length,...parsed.scene.children.map(index),
  index(parsed.scenes[0].children[0]),parsed.scenes[2].children.length,-2,1,-3,
  childList.length,...childList.map(index),childList[0].children.length,-2,
]);
</script>
