<!doctype html>
<meta charset="utf-8">
<pre id="r160">pending</pre>
<script type="importmap">{"imports":{"three":"../../web/game/three.module.js"}}</script>
<script type="module">
import { REVISION } from "three";
const root=new URLSearchParams(location.search).get("package");
const { GLTFLoader }=await import(`file://${root}/examples/jsm/loaders/GLTFLoader.js`);
if(REVISION!=="160") throw new Error("three.js revision mismatch");
const input={
  asset:{version:"2.0"},scene:1,scenes:[{nodes:[1]},{nodes:[2,0]},{}],
  nodes:[{name:"n0"},{name:"n1"},{name:"n2"}],
};
const parsed=await new GLTFLoader().parseAsync(JSON.stringify(input),"");
const index=node=>Number(node.name.slice(1));
document.querySelector("#r160").textContent=JSON.stringify([
  parsed.scene.children.length,...parsed.scene.children.map(index),
  index(parsed.scenes[0].children[0]),parsed.scenes[2].children.length,-2,1,-3,
]);
</script>
