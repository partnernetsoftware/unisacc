<!doctype html>
<meta charset="utf-8">
<pre id="r160">pending</pre>
<script type="module">
import { ImageUtils, REVISION } from "../../web/game/three.module.js";
const output = document.querySelector("#r160");
try {
  if (REVISION !== "160") throw new Error("three.js revision mismatch");
  const canvas = document.createElement("canvas");
  canvas.width=1;
  canvas.height=2;
  canvas.getContext("2d").putImageData(new ImageData(new Uint8ClampedArray([10,128,255,255,204,68,0,255]),1,2),0,0);
  const blob = await new Promise(resolve => canvas.toBlob(resolve));
  const url = URL.createObjectURL(blob);
  const html = new Image();
  html.src=url;
  await html.decode();
  const bitmap=await createImageBitmap(blob);
  const linear = source => ImageUtils.sRGBToLinear(source).getContext("2d").getImageData(0,0,1,2).data;
  const pixels=linear(html);
  const other=linear(bitmap);
  bitmap.close();
  URL.revokeObjectURL(url);
  if (pixels.some((value,i)=>value!==other[i])) throw new Error("source families disagree");
  output.textContent=JSON.stringify([pixels.length,pixels[0],pixels[1],pixels[4],pixels[5],pixels[7],305419896,-1,77,-1]);
} catch (error) { output.textContent=`error:${error.message}`; }
</script>
