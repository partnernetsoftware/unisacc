<!doctype html>
<meta charset="utf-8">
<pre id="r160">pending</pre>
<script type="module">
import { PerspectiveCamera, Sprite, SpriteMaterial, Vector2, Vector3, REVISION } from "../../web/game/three.module.js";
if (REVISION !== "160") throw new Error("three.js revision mismatch");
const sprite = new Sprite(new SpriteMaterial({rotation: Math.PI / 2}));
const defaultX = sprite.center.x;
sprite.center.set(0.25, 0.75);
sprite.position.set(3, 1, -5);
sprite.scale.set(2, 4, 1);
sprite.updateMatrixWorld();
const camera = new PerspectiveCamera();
camera.position.x = 1;
camera.updateMatrixWorld();
const view = new Vector3().setFromMatrixPosition(sprite.matrixWorld).applyMatrix4(camera.matrixWorldInverse);
const scale = new Vector3().setFromMatrixScale(sprite.matrixWorld);
const corner = (x, y) => {
  const size = sprite.material.sizeAttenuation ? 1 : -view.z;
  const aligned = new Vector2((x - sprite.center.x) * scale.x * size, (y - sprite.center.y) * scale.y * size);
  aligned.rotateAround(new Vector2(), sprite.material.rotation);
  return [aligned.x + view.x, aligned.y + view.y, view.z];
};
const a = corner(0, 0), b = corner(1, 0);
sprite.material.sizeAttenuation = false;
const c = corner(0, 0);
document.querySelector("#r160").textContent = JSON.stringify([
  defaultX,sprite.geometry.index.count,...a,b[1],c[0],c[1]
]);
</script>
