<!doctype html>
<meta charset="utf-8">
<pre id="r160">pending</pre>
<script type="module">
import { BufferGeometry, Float32BufferAttribute, Points, PointsMaterial, Vector3, REVISION } from "../../web/game/three.module.js";
if (REVISION !== "160") throw new Error("three.js revision mismatch");
const geometry = new BufferGeometry();
const positions = new Float32BufferAttribute([1,2,3, 4,5,6, 7,8,9], 3);
geometry.setAttribute("position",positions).setIndex([2,0,1]);
geometry.setDrawRange(1,2);
const points = new Points(geometry, new PointsMaterial());
points.position.x = 10;
points.updateMatrixWorld();
const index = i => i >= geometry.drawRange.count ? -1 :
  geometry.index ? geometry.index.getX(geometry.drawRange.start + i) : geometry.drawRange.start + i;
const read = i => new Vector3().fromBufferAttribute(positions,index(i)).applyMatrix4(points.matrixWorld);
const values = [index(0),index(1),read(0).x,read(1).z,index(2)];
geometry.setIndex(null);
values.push(index(0));
document.querySelector("#r160").textContent = JSON.stringify(values);
</script>
