<!doctype html>
<meta charset="utf-8">
<pre id="r160">pending</pre>
<script type="module">
import { ClampToEdgeWrapping, LinearMipmapLinearFilter, TextureLoader, REVISION } from "../../web/game/three.module.js";
if (REVISION !== "160") throw new Error("three.js revision mismatch");
const canvas = document.createElement("canvas");
canvas.width = canvas.height = 1;
const texture = await new TextureLoader().loadAsync(canvas.toDataURL("image/png"));
document.querySelector("#r160").textContent = JSON.stringify([
  texture.image.naturalWidth, texture.minFilter === LinearMipmapLinearFilter ? 2 : -1,
  texture.wrapS === ClampToEdgeWrapping ? 0 : -1, Number(texture.source.data === texture.image), -1, -1,
]);
texture.dispose();
</script>
