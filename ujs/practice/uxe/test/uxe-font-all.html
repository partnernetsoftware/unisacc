<!DOCTYPE html>
<html lang="zh"><head>
<meta charset="utf-8"/><title>FONT_PENDING</title>
</head><body>
<canvas id="c" width="282" height="90"></canvas>
<pre id="hud"></pre>
<script type="module">
import { createWebGLRenderer } from "../renderer-webgl.js";
import { Scene, PerspectiveCamera } from "../scene.js";
import { applyTestScene } from "./test-init.js";
import { FONT_W, FONT_H } from "../font5x7.js";
(async()=>{
  const hud=document.getElementById("hud");
  try{
    const s=4, pad=1, gap=2, per=14;
    const str="0123456789 ABCDEFGHIJKLMNOPQRSTUVWXYZ.:-/%";
    const rows=Math.ceil(str.length/per);
    const tw=per*FONT_W, th=FONT_H;
    const W=tw*s+pad*2, H=rows*th*s+(rows-1)*gap+pad*2;
    const canvas=document.getElementById("c");
    canvas.width=W; canvas.height=H;
    const r=createWebGLRenderer(canvas,{antialias:false});
    const scene=new Scene();
    applyTestScene(scene,[0,0,0,1]);
    for(let r0=0;r0<rows;r0++){
      const sub=str.slice(r0*per,(r0+1)*per);
      scene.text(sub, pad, pad+r0*(th*s+gap), s, [1,1,1]);
    }
    const cam=new PerspectiveCamera(1.0,0.05,40);
    r.render(scene,cam,[]);
    const gl=canvas.getContext("webgl");
    const pix=new Uint8Array(4);
    const bits=[];
    for(let y=0;y<H;y++) for(let x=0;x<W;x++){
      gl.readPixels(x,H-1-y,1,1,gl.RGBA,gl.UNSIGNED_BYTE,pix);
      bits.push(pix[0]>127?1:0);
    }
    hud.textContent=JSON.stringify({W:W,H:H,s:s,pad:pad,gap:gap,per:per,str:str,bits:bits});
    document.title="FONT_PENDING";
  }catch(e){
    document.title="FONT_ERR";
    hud.textContent=String(e&&e.message||e);
  }
})();
</script>
</body></html>
