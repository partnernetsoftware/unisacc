<!doctype html>
<meta charset="utf-8">
<pre id="r160">pending</pre>
<script type="importmap">{"imports":{"three":"../../web/game/three.module.js"}}</script>
<script type="module">
import { MOUSE, PerspectiveCamera, REVISION, TOUCH } from "three";
const root=new URLSearchParams(location.search).get("package");
const { OrbitControls }=await import(`file://${root}/examples/jsm/controls/OrbitControls.js`);
const { MapControls }=await import(`file://${root}/examples/jsm/controls/MapControls.js`);
if(REVISION!=="160") throw new Error("three.js revision mismatch");
const orbit=new OrbitControls(new PerspectiveCamera(),document.createElement("div"));
const map=new MapControls(new PerspectiveCamera(),document.createElement("div"));
function modified(button) {
  if(button===MOUSE.ROTATE) return MOUSE.PAN;
  if(button===MOUSE.PAN) return MOUSE.ROTATE;
  return button;
}
if(orbit.touches.ONE!==TOUCH.ROTATE || map.touches.TWO!==TOUCH.DOLLY_ROTATE) throw new Error("touch defaults");
document.querySelector("#r160").textContent=JSON.stringify([
  orbit.mouseButtons.LEFT,orbit.mouseButtons.MIDDLE,orbit.mouseButtons.RIGHT,
  map.mouseButtons.LEFT,map.mouseButtons.MIDDLE,map.mouseButtons.RIGHT,
  modified(map.mouseButtons.LEFT),modified(map.mouseButtons.RIGHT),
  orbit.touches.ONE,orbit.touches.TWO,map.touches.ONE,map.touches.TWO,-1,
]);
</script>
