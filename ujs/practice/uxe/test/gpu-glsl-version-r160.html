<!doctype html>
<meta charset="utf-8">
<pre id="r160">pending</pre>
<script type="module">
import { BufferAttribute, BufferGeometry, Camera, GLSL1, GLSL3, Mesh, RawShaderMaterial, REVISION,
  Scene, WebGLRenderer } from "../../web/game/three.module.js";
import { createGpuSubmit } from "../base/gpu-host-abi.js";

const output = document.querySelector("#r160");
const query = new URLSearchParams(location.search);
const options = { alpha: false, antialias: false, preserveDrawingBuffer: true };
const positions = [-1, -1, 0, 3, -1, 0, -1, 3, 0];
const colors = [0.25, 0.5, 0.75, 1];
const cases = [
  { token: GLSL1, vertex: "attribute vec3 a_position; attribute vec4 a_color; varying vec4 signal;\n" +
    "void main(){signal=a_color;gl_Position=vec4(a_position,1.0);}\n",
    fragment: "precision highp float; varying vec4 signal;\nvoid main(){gl_FragColor=signal;}\n" },
  { token: GLSL3, vertex: "in vec3 a_position; in vec4 a_color; out vec4 signal;\n" +
    "void main(){signal=a_color;gl_Position=vec4(a_position,1.0);}\n",
    fragment: "precision highp float; in vec4 signal; out vec4 result;\nvoid main(){result=signal.bgra;}\n" },
];

function context() {
  const canvas = document.createElement("canvas");
  canvas.width = canvas.height = 1;
  const gl = canvas.getContext("webgl2", options);
  if (!gl) throw Error("WebGL2 unavailable");
  return { canvas, gl };
}

function pixel(gl) {
  const data = new Uint8Array(4);
  gl.readPixels(0, 0, 1, 1, gl.RGBA, gl.UNSIGNED_BYTE, data);
  return [...data];
}

function reference() {
  const { canvas, gl } = context();
  const firstLines = [];
  const original = gl.shaderSource.bind(gl);
  gl.shaderSource = (shader, source) => { firstLines.push(source.split("\n", 1)[0]); original(shader, source); };
  const renderer = new WebGLRenderer({ ...options, canvas, context: gl });
  renderer.setSize(1, 1, false);
  renderer.setClearColor(0, 1);
  let failures = 0;
  renderer.debug.onShaderError = (context, program, vertex, fragment) => {
    if (!context.getShaderParameter(vertex, context.COMPILE_STATUS) ||
        !context.getShaderParameter(fragment, context.COMPILE_STATUS)) failures++;
  };
  const geometry = new BufferGeometry();
  const position = new BufferAttribute(Float32Array.from(positions), 3);
  geometry.setAttribute("position", position);
  geometry.setAttribute("a_position", position);
  geometry.setAttribute("a_color", new BufferAttribute(Float32Array.from([...colors, ...colors, ...colors]), 4));
  const camera = new Camera();
  function draw(entry, version) {
    firstLines.length = 0;
    failures = 0;
    const shader = new RawShaderMaterial({ glslVersion: version, vertexShader: entry.vertex, fragmentShader: entry.fragment });
    const mesh = new Mesh(geometry, shader);
    mesh.frustumCulled = false;
    const scene = new Scene();
    scene.add(mesh);
    try { renderer.render(scene, camera); }
    finally { shader.dispose(); }
    return { first: firstLines.length === 2 && firstLines.every(line => line === "#version " + version),
      rejected: failures > 0, pixel: pixel(gl) };
  }
  try {
    const valid = cases.map(entry => draw(entry, entry.token));
    const swapped = cases.map((entry, i) => draw(entry, cases[1 - i].token));
    return [...valid.flatMap(result => result.pixel), ...valid.map(result => Number(result.first && !result.rejected)),
      ...swapped.map(result => Number(result.first && result.rejected))];
  } finally { geometry.dispose(); renderer.dispose(); }
}

async function product() {
  const { gl } = context();
  let exports;
  const submit = createGpuSubmit(gl, () => exports.memory, () => 1);
  const response = await fetch("file://" + query.get("dir") + "/probe.wasm");
  ({ instance: { exports } } = await WebAssembly.instantiate(await response.arrayBuffer(), { uxe_gpu_v1: { host_gpu_submit: submit } }));
  if (exports.uxe_abi_version() !== 1) throw Error("Wasm ABI");
  const run = (op, a = 0, b = 0) => Number(exports.uxe_glsl_version(BigInt(op), BigInt(a), BigInt(b)));
  const memory = new Uint8Array(exports.memory.buffer, run(0), 8192);
  const view = new DataView(memory.buffer, memory.byteOffset, memory.byteLength);
  const encoder = new TextEncoder(), decoder = new TextDecoder();
  const versions = [run(4), run(5)];
  if (versions.join() !== "1,3") throw Error("version IDs");
  const stage = (offset, data) => {
    const bytes = encoder.encode(data);
    memory.set(bytes, offset);
    return bytes.length;
  };
  const load = entry => [512, stage(512, entry.vertex), 1024, stage(1024, entry.fragment)].forEach((value, i) => view.setUint32(128 + i * 4, value, true));
  const attributes = change => {
    for (let i = 0; i < 3; i++) {
      const shade = change ? [0.25, 0.5, 0.125, 1] : colors;
      [...positions.slice(i * 3, i * 3 + 3), ...shade].forEach((value, j) => view.setFloat32(1536 + 28 * i + 4 * j, value, true));
    }
  };
  const tokens = versions.map((version, i) => Number(decoder.decode(memory.slice(64, 64 + run(1, version))) === cases[i].token));
  load(cases[0]);
  const area = memory.subarray(6144, 6208);
  const descriptor = memory.subarray(160, 176);
  area.fill(91); descriptor.fill(91);
  const capacity = run(2, versions[0], 12) === -2 && area.every(byte => byte === 91) && descriptor.every(byte => byte === 91);
  const invalid = run(2, 2, 1024) === -1 && run(1, 2) === -1 && area.every(byte => byte === 91) && descriptor.every(byte => byte === 91);
  const statuses = [], prefix = [], pixels = [];
  for (let i = 0; i < cases.length; i++) {
    const entry = cases[i];
    load(entry);
    attributes(i === 1 && query.get("pixel") === "1");
    const selected = i === 1 && query.get("mutate") === "1" ? versions[0] : versions[i];
    statuses.push(run(3, selected));
    pixels.push(...pixel(gl));
    prefix.push(Number([entry.vertex, entry.fragment].every((body, index) => {
      const at = view.getUint32(160 + index * 8, true), n = view.getUint32(164 + index * 8, true);
      return decoder.decode(memory.slice(at, at + n)) === "#version " + entry.token + "\n" + body;
    })));
  }
  const before = pixel(gl);
  const swapped = cases.map((entry, i) => {
    load(entry); attributes(false);
    return run(3, versions[1 - i]);
  });
  const preserved = pixel(gl).join() === before.join();
  return [...statuses, ...pixels, ...prefix, ...tokens, ...swapped, Number(capacity), Number(invalid), Number(preserved)];
}

try {
  if (REVISION !== "160") throw Error("three.js revision mismatch");
  output.textContent = JSON.stringify([...reference(), ...await product()]);
} catch (error) { output.textContent = "error:" + error.message; }
</script>
