<!doctype html>
<meta charset="utf-8">
<div id="viewport" style="width:200px;height:100px"></div>
<pre id="r160">pending</pre>
<script type="importmap">{"imports":{"three":"../../web/game/three.module.js"}}</script>
<script type="module">
import { REVISION, PerspectiveCamera } from "three";
const root=new URLSearchParams(location.search).get("package");
const { OrbitControls }=await import(`file://${root}/examples/jsm/controls/OrbitControls.js`);
const { MapControls }=await import(`file://${root}/examples/jsm/controls/MapControls.js`);
if(REVISION!=="160") throw new Error("three.js revision mismatch");
const viewport=document.querySelector("#viewport");
viewport.setPointerCapture=()=>{};
viewport.releasePointerCapture=()=>{};
const send=(type,id,x,y)=>viewport.dispatchEvent(new PointerEvent(type,{
  pointerId:id,pointerType:"touch",clientX:x,clientY:y,bubbles:true,
}));
function motion(Controls,pair,id,x,y,cancel=false) {
  const camera=new PerspectiveCamera(90,2,0.1,100);
  camera.position.z=10;
  const controls=new Controls(camera,viewport);
  send("pointerdown",7,20,20);
  if(pair) send("pointerdown",8,40,20);
  send("pointermove",id,x,y);
  if(cancel) {
    send("pointercancel",8,60,20);
    send("pointermove",7,5,5);
  }
  const result={eye:camera.position.x,target:controls.target.toArray(),radius:controls.getDistance()};
  controls.dispose();
  return result;
}
const rotate=motion(OrbitControls,false,7,30,20);
const pan=motion(MapControls,false,7,30,40);
const orbit=motion(OrbitControls,true,8,60,20);
const map=motion(MapControls,true,8,60,20);
const cancel=motion(OrbitControls,true,8,60,20,true);
const reverse=motion(OrbitControls,true,7,0,20);
document.querySelector("#r160").textContent=JSON.stringify([
  rotate.eye,pan.target[0],pan.target[2],orbit.target[0],orbit.radius,map.eye,map.radius,
  cancel.target[0],10,reverse.target[0],
]);
</script>
