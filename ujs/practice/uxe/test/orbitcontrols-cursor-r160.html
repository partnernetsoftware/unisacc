<!doctype html>
<meta charset="utf-8">
<div id="viewport" style="width:200px;height:100px"></div>
<pre id="r160">pending</pre>
<script type="importmap">{"imports":{"three":"../../web/game/three.module.js"}}</script>
<script type="module">
import { PerspectiveCamera, REVISION } from "three";
const root = new URLSearchParams(location.search).get("package");
const { OrbitControls } = await import(`file://${root}/examples/jsm/controls/OrbitControls.js`);
if (REVISION !== "160") throw Error("three.js revision mismatch");
const viewport = document.querySelector("#viewport");
const {left,top} = viewport.getBoundingClientRect();
function wheel(px,py,delta,screen=true,min=0) {
  const camera = new PerspectiveCamera(90,2,1,100);
  camera.position.z = 10;
  const controls = new OrbitControls(camera,viewport);
  controls.zoomToCursor = true;
  controls.screenSpacePanning = screen;
  controls.minDistance = min;
  viewport.dispatchEvent(new WheelEvent("wheel", {clientX:left+px,clientY:top+py,
    deltaY:delta*devicePixelRatio,cancelable:true}));
  const result = [camera.position.x,camera.position.y,camera.position.z,
    controls.target.x,controls.target.y,controls.target.z,controls.getDistance()];
  controls.dispose();
  return result;
}
const shifted = wheel(150,25,-100);
document.querySelector("#r160").textContent = JSON.stringify([
  ...shifted, wheel(50,75,-100)[0], wheel(100,50,-100)[2],
  wheel(150,25,100)[0], wheel(150,25,-100,true,9.75)[0],
  wheel(150,25,-100,false)[4], -1, 0.95, 1
]);
</script>
