<!doctype html>
<meta charset="utf-8">
<pre id="wasm-cases">pending</pre>
<script type="module">
const status = document.querySelector("#wasm-cases");
try {
  const query = new URLSearchParams(location.search);
  const count = Number(query.get("count"));
  const mutation = Number(query.get("mutation"));
  const compile = async path => WebAssembly.compile(await (await fetch(path)).arrayBuffer());
  const [baseModule, probeModule] = await Promise.all([compile("base.wasm"), compile("probe.wasm")]);
  const results = [];
  for (let index = 0; index < count; index++) {
    const { exports: base } = await WebAssembly.instantiate(baseModule);
    const { exports: probe } = await WebAssembly.instantiate(probeModule, {
      uxe_gltf_scene_v1: { uxe_gltf_scene_case: base.uxe_gltf_scene_case }
    });
    if (base.uxe_abi_version() !== 1 || probe.uxe_abi_version() !== 1 || base.memory === probe.memory) {
      throw new Error("glTF linked ABI mismatch");
    }
    results.push(probe.uxe_evaluate_case(BigInt(index === mutation ? count : index)));
  }
  status.textContent = JSON.stringify(results);
} catch (error) {
  status.textContent = `error:${error.message}`;
}
</script>
