<!doctype html>
<meta charset="utf-8">
<pre id="r160">pending</pre>
<script type="importmap">{"imports":{"three":"../../web/game/three.module.js"}}</script>
<script type="module">
import { PerspectiveCamera, REVISION, Vector3 } from "three";
const status=document.querySelector("#r160");
try{
  if(REVISION!=="160") throw new Error("three.js revision mismatch");
  const root=new URLSearchParams(location.search).get("package");
  const {PointerLockControls}=await import(`file://${root}/examples/jsm/controls/PointerLockControls.js`);
  const camera=new PerspectiveCamera();
  camera.position.y=4;
  const area=document.createElement("div");
  document.body.append(area);
  const controls=new PointerLockControls(camera,area);
  let locks=0,unlocks=0,changes=0;
  controls.addEventListener("lock",()=>locks++);
  controls.addEventListener("unlock",()=>unlocks++);
  controls.addEventListener("change",()=>changes++);
  function lock(element){
    Object.defineProperty(document,"pointerLockElement",{value:element,configurable:true});
    document.dispatchEvent(new Event("pointerlockchange"));
  }
  function motion(x,y){
    const event=new MouseEvent("mousemove",{movementX:x,movementY:y});
    document.dispatchEvent(event);
  }
  motion(100,-50);
  const idleYaw=camera.rotation.y;
  lock(area);
  motion(100,-50);
  const direction=controls.getDirection(new Vector3());
  camera.updateMatrix();
  controls.moveForward(2);
  controls.moveRight(1);
  const moved=camera.position.clone();
  lock(null);
  motion(100,-50);
  const motionCount=changes;
  const locked=locks,unlocked=unlocks;
  controls.maxPolarAngle=Math.PI/2+0.1;
  lock(area);
  motion(0,1000);
  const clipped=controls.getDirection(new Vector3()).y;
  controls.dispose();
  status.textContent=JSON.stringify([
    idleYaw,locked,direction.x,direction.y,direction.z,moved.x,moved.z,moved.y,clipped,motionCount,unlocked,-1,
  ]);
}catch(error){status.textContent=`error:${error.message}`;}
</script>
