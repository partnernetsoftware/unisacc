<!doctype html>
<meta charset="utf-8">
<div id="viewport" style="width:200px;height:100px"></div>
<pre id="r160">pending</pre>
<script type="importmap">{"imports":{"three":"../../web/game/three.module.js"}}</script>
<script type="module">
import { REVISION, PerspectiveCamera, OrthographicCamera } from "three";
const root=new URLSearchParams(location.search).get("package");
const { OrbitControls }=await import(`file://${root}/examples/jsm/controls/OrbitControls.js`);
if(REVISION!=="160") throw new Error("three.js revision mismatch");
const viewport=document.querySelector("#viewport");
viewport.setPointerCapture=()=>{};
viewport.releasePointerCapture=()=>{};
function pan(camera,screen,damp=0) {
  camera.position.z=10;
  const c=new OrbitControls(camera,viewport);
  c.screenSpacePanning=screen;
  c.enableDamping=damp>0;
  c.dampingFactor=damp;
  const send=(type,x,y)=>viewport.dispatchEvent(new PointerEvent(type,{
    pointerId:7,pointerType:"mouse",button:2,clientX:x,clientY:y,bubbles:true,
  }));
  send("pointerdown",0,0);
  send("pointermove",10,20);
  send("pointerup",10,20);
  const first=c.target.toArray();
  const eye=camera.position.x;
  c.update();
  const second=c.target.y;
  c.dispose();
  return {first,eye,second};
}
const screen=pan(new PerspectiveCamera(90,2,0.1,100),true);
const plane=pan(new PerspectiveCamera(90,2,0.1,100),false);
const ortho=pan(new OrthographicCamera(-10,10,4,-4,0.1,100),true);
const damp=pan(new PerspectiveCamera(90,2,0.1,100),true,0.25);
document.querySelector("#r160").textContent=JSON.stringify([
  screen.first[0],screen.first[1],screen.eye,plane.first[2],ortho.first[0],ortho.first[1],
  damp.first[1],damp.second,-1,
]);
</script>
