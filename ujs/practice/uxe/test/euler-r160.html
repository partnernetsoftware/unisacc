<!doctype html>
<meta charset="utf-8">
<pre id="r160">pending</pre>
<script type="module">
import { Euler, Matrix4, Quaternion, REVISION, Vector3 } from "../../web/game/three.module.js";
if (REVISION !== "160") throw new Error("three.js revision mismatch");
const orders=["XYZ","YXZ","ZXY","ZYX","YZX","XZY"];
const raw=new Euler(0.25,0.5,0.75);
const results=[];
for(const order of orders) {
  const matrix=new Matrix4().makeRotationFromEuler(new Euler(0.25,0.5,0.75,order));
  const {x,y,z}=new Euler().setFromRotationMatrix(matrix,order);
  results.push(x+2*y+3*z);
}
const singular=new Matrix4().makeRotationFromEuler(new Euler(0.25,Math.PI/2,0));
const locked=new Euler().setFromRotationMatrix(singular);
const zAxis=new Vector3(0,0,1);
const q=new Quaternion().setFromAxisAngle(zAxis,0.75);
results.push(locked.x,locked.y,locked.z,new Euler().setFromQuaternion(q,"ZYX").z,
  new Euler(0,0,0.75).reorder("ZYX").z,new Euler().copy(raw).y,
  raw.clone().x,Number(raw.equals(raw.clone())),
  Number(raw.equals(new Euler(0.25,0.5,0.75,"ZYX"))),
  new Euler().setFromVector3(new Vector3(1,2,3),"ZXY").y,
  new Euler().fromArray(raw.toArray()).z,raw.toArray()[1],orders.indexOf([...raw][3]));
document.querySelector("#r160").textContent=JSON.stringify(results);
</script>
