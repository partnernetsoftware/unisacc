<!doctype html>
<meta charset="utf-8">
<pre id="r160">pending</pre>
<script type="module">
import { PerspectiveCamera, REVISION, WebGPUCoordinateSystem } from "../../web/game/three.module.js";
if (REVISION !== "160") throw new Error("three.js revision mismatch");
const camera = new PerspectiveCamera(90, 2, 1, 11);
const projection = camera.projectionMatrix.elements;
const values = [projection[0], projection[5], projection[10], projection[14],
  camera.getFilmWidth(), camera.getFilmHeight(), camera.getFocalLength()];
camera.setViewOffset(800, 400, 0, 0, 400, 200);
values.push(projection[0], projection[5], projection[8], projection[9]);
camera.clearViewOffset();
camera.filmOffset = 3.5;
camera.updateProjectionMatrix();
values.push(projection[8]);
camera.coordinateSystem = WebGPUCoordinateSystem;
camera.updateProjectionMatrix();
values.push(projection[10], camera.projectionMatrixInverse.elements[11]);
document.querySelector("#r160").textContent = JSON.stringify(values);
</script>
