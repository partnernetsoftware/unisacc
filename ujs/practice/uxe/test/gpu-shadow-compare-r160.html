<!doctype html>
<meta charset="utf-8">
<pre id="r160">pending</pre>
<script type="module">
import { AlwaysCompare, DepthFormat, DepthTexture, EqualCompare, FloatType, GLSL3, GreaterCompare,
  GreaterEqualCompare, LessCompare, LessEqualCompare, Mesh, NeverCompare, NotEqualCompare,
  OrthographicCamera, PlaneGeometry, RawShaderMaterial, REVISION, Scene, WebGLRenderer, WebGLRenderTarget
} from "../../web/game/three.module.js";
if(REVISION!=="160") throw new Error("three.js revision mismatch");
const canvas=document.createElement("canvas");
const gl=canvas.getContext("webgl2");
if(!gl) throw new Error("WebGL2 unavailable");
const renderer=new WebGLRenderer({canvas,context:gl});
const target=new WebGLRenderTarget(1,1);
const geometry=new PlaneGeometry(2,2);
const material=new RawShaderMaterial({
  glslVersion:GLSL3,
  uniforms:{depthImage:{value:null},depthReference:{value:0}},
  vertexShader:"in vec3 position;void main(){gl_Position=vec4(position,1.0);}",
  fragmentShader:`precision highp float;
    uniform highp sampler2DShadow depthImage;
    uniform float depthReference;
    out vec4 pixel;
    void main(){pixel=vec4(texture(depthImage,vec3(0.5,0.5,depthReference)),0.0,0.0,1.0);}`,
});
const scene=new Scene();
scene.add(new Mesh(geometry,material));
const camera=new OrthographicCamera(-1,1,1,-1,0,10);
camera.position.z=1;
const pixels=new Uint8Array(4);
const values=[];
for(const compareFunction of [NeverCompare,LessCompare,EqualCompare,LessEqualCompare,
  GreaterCompare,NotEqualCompare,GreaterEqualCompare,AlwaysCompare]) {
  const depth=new DepthTexture(1,1,FloatType);
  depth.format=DepthFormat;
  depth.compareFunction=compareFunction;
  const source=new WebGLRenderTarget(1,1,{depthTexture:depth});
  renderer.setRenderTarget(source);
  gl.clearDepth(0.5);
  gl.clear(gl.DEPTH_BUFFER_BIT);
  renderer.setRenderTarget(target);
  material.uniforms.depthImage.value=depth;
  let mask=0;
  for(const [bit,reference] of [0.25,0.5,0.75].entries()) {
    material.uniforms.depthReference.value=reference;
    renderer.render(scene,camera);
    renderer.readRenderTargetPixels(target,0,0,1,1,pixels);
    mask|=(pixels[0]===255?1:0)<<bit;
  }
  values.push(mask);
  source.dispose();
}
document.querySelector("#r160").textContent=JSON.stringify(values);
material.dispose();
geometry.dispose();
target.dispose();
renderer.dispose();
</script>
