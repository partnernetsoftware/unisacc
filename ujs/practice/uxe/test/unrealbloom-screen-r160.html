<!doctype html>
<meta charset="utf-8">
<pre id="r160">pending</pre>
<script type="importmap">{"imports":{"three":"../../web/game/three.module.js"}}</script>
<script type="module">
import {
  DataTexture, LinearFilter, LinearSRGBColorSpace, NoBlending, REVISION, Vector2,
  WebGLRenderer, WebGLRenderTarget
} from "three";
import { createGpuSubmit } from "../base/gpu-host-abi.js";
import { createGpuNativeSample } from "../base/gpu-native-sample-abi.js";

const output = document.querySelector("#r160");
try {
  if (REVISION !== "160") throw new Error("three.js revision mismatch");
  const query = new URLSearchParams(location.search);
  const addon = path => import("file://" + query.get("package") + "/examples/jsm/" + path + ".js");
  const [{ UnrealBloomPass }, { ShaderPass }, { CopyShader }] = await Promise.all([
    addon("postprocessing/UnrealBloomPass"), addon("postprocessing/ShaderPass"), addon("shaders/CopyShader"),
  ]);
  function context() {
    const canvas = document.createElement("canvas");
    canvas.width = 4;
    canvas.height = 2;
    const gl = canvas.getContext("webgl2", { alpha: true, premultipliedAlpha: false, preserveDrawingBuffer: true });
    if (!gl) throw new Error("WebGL2 required");
    return { canvas, gl };
  }
  const { gl } = context();
  const [binary, ...resources] = await Promise.all([
    fetch("file://" + query.get("wasm")),
    fetch("../base/gpu-native-copy.vert"), fetch("../base/gpu-native-bloom-original.frag"),
    fetch("../base/gpu-native-bloom-screen.vert"), fetch("../base/gpu-native-bloom-screen.frag"),
  ]);
  let actual;
  const native = createGpuNativeSample(gl, () => 1, () => actual.memory);
  const submit = createGpuSubmit(gl, () => actual.memory, () => 1, native.targets);
  let reads = 0, uploads = 0, draws = 0;
  function track(key, observe) {
    const prior = gl[key];
    gl[key] = function (...args) {
      observe();
      return prior.apply(gl, args);
    };
  }
  track("readPixels", () => reads++);
  track("texImage2D", () => uploads++);
  track("drawArrays", () => draws++);
  function state() {
    const parameters = [
      gl.READ_FRAMEBUFFER_BINDING, gl.DRAW_FRAMEBUFFER_BINDING, gl.CURRENT_PROGRAM,
      gl.ACTIVE_TEXTURE, gl.TEXTURE_BINDING_2D, gl.SAMPLER_BINDING,
      gl.VIEWPORT, gl.SCISSOR_BOX, gl.COLOR_WRITEMASK, gl.DEPTH_WRITEMASK,
      gl.BLEND_EQUATION_RGB, gl.BLEND_EQUATION_ALPHA, gl.BLEND_SRC_RGB,
      gl.BLEND_DST_RGB, gl.BLEND_SRC_ALPHA, gl.BLEND_DST_ALPHA,
    ];
    const values = parameters.flatMap(key => {
      const value = gl.getParameter(key);
      return ArrayBuffer.isView(value) || Array.isArray(value) ? [...value] : [value];
    });
    for (const key of [gl.BLEND, gl.DEPTH_TEST, gl.CULL_FACE, gl.SCISSOR_TEST, gl.DITHER]) {
      values.push(gl.isEnabled(key));
    }
    return values;
  }
  function checked(operation) {
    return (...args) => {
      const before = state(), beforeReads = reads, beforeUploads = uploads;
      const status = operation(...args);
      const after = state();
      if (before.some((value, i) => value !== after[i])) throw new Error("native screen draw changed caller GPU state");
      if (beforeReads !== reads || beforeUploads !== uploads) throw new Error("native screen draw moved pixels through CPU");
      return status;
    };
  }
  actual = (await WebAssembly.instantiate(await binary.arrayBuffer(), {
    uxe_gpu_v1: { host_gpu_submit: submit },
    uxe_gpu_target_v1: {
      host_gpu_native_copy: checked(native.copy), host_gpu_native_add: checked(native.add),
    },
  })).instance.exports;
  const lengths = [];
  for (const [i, response] of resources.entries()) {
    const data = new Uint8Array(await response.arrayBuffer());
    if (!response.ok || !data.length || data.length > 4096) throw new Error("invalid base shader source");
    new Uint8Array(actual.memory.buffer, 2097152 + 10000 + 4500 * i, data.length).set(data);
    lengths.push(BigInt(data.length));
  }
  const status = actual.uxe_bloom_screen(BigInt(query.get("mode")), ...lengths);
  if (status !== 0n) throw new Error("Bloom screen probe failed " + status);
  function words(bytes) {
    const view = new DataView(bytes.buffer, bytes.byteOffset, bytes.byteLength);
    return Array.from({ length: 8 }, (_, i) => view.getUint32(i * 4, true));
  }
  function screen(gl) {
    const rgba = new Uint8Array(32);
    gl.readPixels(0, 0, 4, 2, gl.RGBA, gl.UNSIGNED_BYTE, rgba);
    return words(rgba);
  }
  const actualScreen = screen(gl);
  const actualRead = words(new Uint8Array(actual.memory.buffer, 2097152 + 7000, 32));
  const actualSpare = words(new Uint8Array(actual.memory.buffer, 2097152 + 7200, 32));

  const ref = context();
  const renderer = new WebGLRenderer({ canvas: ref.canvas, context: ref.gl });
  renderer.setSize(4, 2, false);
  renderer.outputColorSpace = LinearSRGBColorSpace;
  renderer.autoClear = false;
  const bloom = new UnrealBloomPass(new Vector2(4, 2), 1, 0, 0);
  const read = new WebGLRenderTarget(4, 2), spare = new WebGLRenderTarget(4, 2);
  const originalPixels = [];
  for (let i = 0; i < 4; i++) originalPixels.push(40,80,120,64);
  for (let i = 0; i < 4; i++) originalPixels.push(220,225,230,245);
  const seed = new ShaderPass(CopyShader);
  seed.material.blending = NoBlending;
  const original = new DataTexture(Uint8Array.from(originalPixels), 4, 2);
  original.needsUpdate = true;
  renderer.setRenderTarget(spare);
  renderer.setClearColor(0x0000ff, 1);
  renderer.clear();
  seed.render(renderer, read, { texture: original });
  renderer.setRenderTarget(null);
  renderer.setClearColor(0x000000, 0);
  renderer.clear();
  bloom.basic.map = read.texture;
  bloom.fsQuad.material = bloom.basic;
  bloom.fsQuad.render(renderer);
  const overlay = new DataTexture(Uint8Array.from([124,40,20,0,164,80,36,128]), 2, 1);
  overlay.minFilter = overlay.magFilter = LinearFilter;
  overlay.needsUpdate = true;
  bloom.copyUniforms.tDiffuse.value = overlay;
  bloom.fsQuad.material = bloom.blendMaterial;
  bloom.fsQuad.render(renderer);
  const refScreen = screen(ref.gl);
  function pixels(target) {
    const rgba = new Uint8Array(32);
    renderer.readRenderTargetPixels(target, 0, 0, 4, 2, rgba);
    return words(rgba);
  }
  const refRead = pixels(read), refSpare = pixels(spare);
  seed.dispose();
  original.dispose();
  overlay.dispose();
  read.dispose();
  spare.dispose();
  bloom.materialHighPassFilter.dispose();
  bloom.dispose();
  renderer.dispose();
  output.textContent = JSON.stringify([
    ...actualScreen, ...actualRead, ...actualSpare, ...refScreen, ...refRead, ...refSpare, draws,
  ]);
} catch (error) {
  output.textContent = "error:" + error.message;
}
</script>
