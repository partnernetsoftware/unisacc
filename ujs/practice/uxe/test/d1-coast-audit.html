<!doctype html>
<html lang="zh">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>D1 像素机体开发预览</title>
<style>
  html,body{margin:0;width:100%;height:100%;background:#225675;overflow:hidden}
  canvas{position:fixed;inset:0;width:100dvw;height:100dvh;object-fit:cover;image-rendering:pixelated}
  output{display:none}
  aside{position:absolute;top:12px;right:14px;padding:5px 8px;background:#18344dd9;
    color:#e5f4f1;font:13px system-ui}
  section{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);min-width:12rem;
    padding:20px;background:#182a40f5;border:1px solid #e2529f;color:#f4f1df;
    text-align:center;font:14px system-ui}
  section h1{margin:0;font-size:22px}
  section button{padding:.5rem 1rem;background:#f4f1df;color:#182a40;border:0;font:inherit}
</style>
<canvas width="426" height="240" aria-label="D1 飞行。指针或方向键转向，空格开炮，M 发射导弹"></canvas>
<aside>开发预览</aside>
<section hidden aria-labelledby="flight-lost">
  <h1 id="flight-lost">本轮结束</h1>
  <p></p>
  <button type="button">重新起飞</button>
</section>
<output></output>
<script src="../demo/host1-runtime.js"></script>
<script>
function reportFlightError(message) {
  document.title="D1_FLY_NEXT_ERROR";
  document.querySelector("output").textContent=String(message);
}
addEventListener("error",event=>reportFlightError(event.message||"资源读取失败"));
addEventListener("unhandledrejection",event=>reportFlightError(event.reason));
</script>
<script type="module">
import { drawAircraft } from "./d1-pixel-aircraft.js";
import { pixelWorld } from "./d1-coast-audit.js";
import { combatModel } from "./d1-pixel-combat.js";
import { audioModel } from "./d1-audio.js";

const low=document.createElement("canvas");
low.width=426;
low.height=240;
const buffer=low.getContext("2d");
const display=document.querySelector("canvas").getContext("2d");
display.imageSmoothingEnabled=false;
const result=document.querySelector("output");
const loss=document.querySelector("section"), restartButton=loss.querySelector("button");
const query=new URLSearchParams(location.search);
const audio=audioModel(query);
if(query.has("short-canvas")) display.canvas.style.height="calc(100dvh - 87px)";
const auto=query.get("auto")==="1";
const inputTest=query.get("input-test")==="1";
const frameInterval=1000/30;
const world=pixelWorld(buffer,query);
let combat=combatModel(buffer,query,audio.trigger);

const wasm=await fetch(new URL("d1-flight.wasm",import.meta.url));
if(!wasm.ok) throw new Error("D1 飞行核读取失败");
const flightProgram=await wasm.arrayBuffer();
const boot=await window.host1Boot(flightProgram);
let core=boot.exports;
const {meta}=boot;
const inputs=["input_turn","input_climb","input_boost"].map(name=>meta.globals.indexOf(name));
if(inputs.some(index=>index<0)) throw new Error("D1 飞行输入槽缺失");
let flight,tick=0,firstFrame=0,minGap=1000,previousFrame=0,ended=false,restartTask;
let displayed=0;
let cameraBank=0;
const tail=[];
let chaseMeasure=[];
window.onHostGpuSubmit=bytes=>{
  const view=new DataView(bytes);
  if(view.byteLength!==11 || view.getUint8(0)!==3) throw new Error("D1 飞行提交格式错误");
  flight={
    heading:view.getUint16(1,true), bank:view.getUint8(3)-24,
    x:(view.getUint16(4,true)-2048)/8,z:(view.getUint16(6,true)-2048)/8,
    altitude:view.getUint8(8),pitch:view.getUint8(10)-18,speed:view.getUint8(9)
  };
};
function frame(axis,climb,boost,gun=false,missile=false,stamp=0,paintWorld=true,battleView=null,present=true) {
  if(ended) return;
  flight=null;
  core.host_reset();
  [axis,climb,boost].forEach((value,i)=>core.host_set_global(inputs[i],core.host_mk_i64(BigInt(value))));
  core.run_step();
  if(!flight) throw new Error("D1 飞行核没有提交本帧");
  tick++;
  audio.engine(flight.speed);
  const attitude={
    y:158-Math.round(flight.pitch*(query.has("flat-pitch")?.18:.55)),
    roll:flight.bank*(query.has("shallow-roll")?24:52)*Math.PI/(24*180)
  };
  cameraBank=query.has("fixed-chase")?0:(3*cameraBank+flight.bank)/4;
  const rise=Math.abs(cameraBank)*.34,side=-cameraBank*.43,tilt=-cameraBank*.29;
  const trailLimit=query.has("short-w1-trail")?18:30;
  tail.unshift(flight.bank);
  if(tail.length>trailLimit) tail.pop();
  if(paintWorld && present) {
    const heading=query.has("still") && query.has("coast-heading")?Number(query.get("coast-heading")):flight.heading;
    const radians=heading*Math.PI/180;
    world.paint({...flight,heading,x:flight.x+Math.cos(radians)*side,
      z:flight.z+Math.sin(radians)*side,altitude:flight.altitude+rise,horizonTilt:tilt},tick);
  }
  else if(present) buffer.clearRect(0,0,426,240);
  combat.update(battleView??flight,tick,gun,missile,attitude);
  const c=Math.cos(attitude.roll),s=Math.sin(attitude.roll);
  let bend=0;
  for(let i=0;i<tail.length;i++) {
    bend+=tail[i]*(i+1)*.007;
    if(i<5 || !present) continue;
    for(const wing of [-1,1]) {
      const tip=wing*38;
      buffer.fillStyle=i<13?"#e9f3e8":i<24?"#c9e8e6":"#95bfc8";
      buffer.fillRect(Math.round(213+tip*c-5*s+wing*i*.72-bend),
        Math.round(attitude.y+tip*s+5*c+i*1.39),i<16?2:1,2);
    }
  }
  chaseMeasure=[flight.bank,Math.round(rise*1000),Math.round(side*1000),Math.round(tilt*1000),
    tail.length,Math.round(bend*1000)];
  if(present) drawAircraft(buffer,213,attitude.y,flight.pitch,attitude.roll,flight.speed,tick);
  const hud=combat.hud();
  if(present || hud.lost) {
    display.drawImage(low,0,0);
    displayed++;
  }
  if(hud.lost) {
    ended=true;
    loss.querySelector("p").textContent="击落 "+hud.kills+" 架";
    loss.hidden=false;
    restartButton.focus();
  }
  if(inputTest && stamp) {
    if(!firstFrame) firstFrame=stamp;
    if(previousFrame) minGap=Math.min(minGap,stamp-previousFrame);
    previousFrame=stamp;
    result.textContent=[flight.heading,hud.ammo,hud.missiles,Number(hud.locked),displayed,
      Math.round(stamp-firstFrame),Math.round(minGap*1000)].join(",");
    result.dataset.audio=audio.counts().join(",");
  }
}
async function restartFlight() {
  restartButton.disabled=true;
  try {
    core=(await window.host1Boot(flightProgram)).exports;
    combat=combatModel(buffer,query,audio.trigger);
    cameraBank=0;
    tail.length=0;
    tick=displayed=firstFrame=previousFrame=0;
    minGap=1000;
    ended=false;
    loss.hidden=true;
    frame(0,0,0);
  } finally {
    restartButton.disabled=false;
  }
}
restartButton.addEventListener("click",()=>{
  if(ended && !restartButton.disabled && !query.has("no-restart")) {
    restartTask=restartFlight();
    restartTask.catch(reportFlightError);
  }
});
function replayCombat(target) {
  while(!ended && tick<target) frame(0,0,0,false,tick===3,0,tick+1===target);
}
function replayWave(target) {
  for(let n=tick+1;n<=target && !ended;n++) {
    const x=n<18?4:n<36?-49:53;
    const view={x,z:-1.5,heading:0,altitude:25,pitch:0,bank:0};
    frame(0,0,0,n>=36 && n<=51 && (n-36)%5===0,n===4 || n===22 || n===40,0,n===target,view);
  }
}
frame(0,0,0);
if(query.get("still")==="boost") for(let i=0;i<9;i++) frame(0,0,1);
if(query.get("still")==="impact") for(let i=1;i<18;i++) frame(0,0,0,false,i===3);
if(query.get("still")==="bank") for(let i=0;i<6;i++) frame(1,1,0);
if(query.get("still")==="chase") for(let i=0;i<33;i++) frame(i<31?1:0,0,0);
if(query.get("still")==="skirmish") replayCombat(55);
if(query.get("still")==="loss") replayCombat(142);
if(query.get("still")==="wave") replayWave(89);
if(query.has("w1-check")) {
  const trace=[];
  for(let i=0;i<54;i++) {
    frame(i<19?1:i<33?-1:0,0,0,false,false,0,i%8===7);
    trace.push(chaseMeasure.join(","));
  }
  result.id="pixels";
  result.textContent=trace.join(";");
} else if(query.has("coast-audit")) {
  const views=[world.coastMap()];
  for(const heading of [-18,0,18]) {
    world.paint({...flight,heading},1);
    views.push(world.coastView());
  }
  result.textContent=views.join("|");
} else if(query.has("audio")) {
  for(let i=1;i<18;i++) frame(0,0,1,i===1,i===3);
  const samples=await audio.sample(query.get("audio").split(",").map(Number));
  result.id="pixels";
  result.textContent=samples.join(",");
} else if(query.has("waves")) {
  const sampled=[];
  const probes=query.get("waves").split(";").map(probe=>probe.split(",").map(Number));
  for(const [target,x,y] of probes) {
    replayWave(target);
    const pixel=buffer.getImageData(x,y,1,1).data;
    sampled.push(pixel[0],pixel[1],pixel[2]);
  }
  result.id="pixels";
  result.textContent=sampled.join(",");
} else if(query.has("skirmish")) {
  const sampled=[];
  const probes=query.get("skirmish").split(";").map(probe=>probe.split(",").map(Number));
  for(const [target,x,y] of probes) {
    if(target===0) {
      restartButton.click();
      await restartTask;
    } else replayCombat(target);
    const pixel=buffer.getImageData(x,y,1,1).data;
    sampled.push(pixel[0],pixel[1],pixel[2]);
  }
  result.id="pixels";
  result.textContent=sampled.join(",");
} else if(query.has("detail")) {
  const dots=query.get("detail").split(";").map(pair=>pair.split(",").map(Number));
  const sampled=[];
  for(const phase of [1,12]) {
    world.paint(flight,phase);
    const raster=buffer.getImageData(0,0,426,240).data;
    for(let y=139;y<240;y+=4) for(let x=1;x<426;x+=4) {
      const at=4*(y*426+x);
      sampled.push(raster[at],raster[at+1],raster[at+2]);
    }
  }
  world.reliefSwatches(buffer,dots);
  const labels=buffer.getImageData(0,0,dots.length,1).data;
  for(let i=0;i<dots.length;i++) sampled.push(labels[4*i]);
  result.id="pixels";
  result.textContent=sampled.join(",");
} else if(query.has("terrain")) {
  const dots=query.get("terrain").split(";").map(pair=>pair.split(",").map(Number));
  const grid=buffer.getImageData(0,0,426,240).data, raw=[];
  for(let y=123;y<240;y+=4) for(let x=1;x<426;x+=4) {
    const at=4*(y*426+x);
    raw.push(grid[at],grid[at+1],grid[at+2]);
  }
  const swatch=document.createElement("canvas");
  swatch.width=dots.length; swatch.height=1;
  const ink=swatch.getContext("2d");
  world.swatches(ink,dots);
  const colors=ink.getImageData(0,0,dots.length,1).data, sampled=[];
  for(let i=0;i<dots.length;i++) sampled.push(colors[4*i],colors[4*i+1],colors[4*i+2]);
  result.id="pixels";
  result.textContent=sampled.join(",")+"|"+raw.join(",");
} else if(query.has("effects") || query.has("attitude")) {
  const frames=(query.get("effects")??query.get("attitude")).split(";")
    .map(probe=>probe.split(",").map(Number));
  const sampled=[];
  for(const [targetTick,x,y] of frames) {
    while(tick<targetTick) frame(0,0,0,tick===1,tick===3);
    const pixel=buffer.getImageData(x,y,1,1).data;
    sampled.push(pixel[0],pixel[1],pixel[2]);
  }
  result.id="pixels";
  result.textContent=sampled.join(",");
} else if(query.has("combat")) {
  const sample=(pairs)=>{
    const data=buffer.getImageData(0,0,426,240).data, pixels=[];
    for(const pair of pairs.split(";")) {
      const [x,y]=pair.split(",").map(Number),at=4*(y*426+x);
      pixels.push(data[at],data[at+1],data[at+2]);
    }
    return pixels.join(",");
  };
  const regions=query.get("combat").split("|");
  const initial=sample(regions[0]);
  for(let i=1;i<18;i++) frame(0,0,0,i===1,i===3);
  result.id="pixels";
  result.textContent=initial+"|"+sample(regions[1]);
} else if(query.has("still") || auto) {
  result.textContent=String(flight.heading);
  if(auto) document.title="D1_FLY_NEXT_READY";
} else {
  const keys=new Set();
  const controls=["KeyA","KeyD","KeyW","KeyS","ArrowLeft","ArrowRight","ArrowUp","ArrowDown","ShiftLeft","ShiftRight","Space","KeyF","KeyM"];
  const canvas=document.querySelector("canvas");
  let pointer=null,buttons=0;
  addEventListener("keydown",event=>{
    if(event.code==="KeyN") {
      if(!event.repeat) {
        audio.unlock();
        const muted=audio.toggle();
        document.querySelector("aside").textContent=muted?"开发预览 · 静音":"开发预览";
      }
      return;
    }
    if(ended) {
      if(event.code==="KeyR") restartButton.click();
      return;
    }
    if(!controls.includes(event.code)) return;
    audio.unlock();
    if(inputTest && query.has("wrong-key") && event.code==="KeyD") return;
    event.preventDefault();
    keys.add(event.code);
  });
  addEventListener("keyup",event=>keys.delete(event.code));
  canvas.addEventListener("pointermove",event=>{
    const rect=canvas.getBoundingClientRect();
    pointer={x:2*(event.clientX-rect.left)/rect.width-1,y:2*(event.clientY-rect.top)/rect.height-1};
    buttons=event.buttons;
  });
  canvas.addEventListener("pointerdown",event=>{ audio.unlock(); buttons=event.buttons; });
  addEventListener("pointerup",event=>buttons=event.buttons);
  canvas.addEventListener("pointerleave",()=>{ pointer=null; buttons=0; });
  canvas.addEventListener("contextmenu",event=>event.preventDefault());
  addEventListener("blur",()=>{ keys.clear(); pointer=null; buttons=0; });
  let previous=performance.now(),last=previous,pending=0;
  let prior=[0,0,0,false,false];
  function loop(now) {
    pending+=Math.min(200,now-previous);
    previous=now;
    if(now-last+.25>=frameInterval && pending+.25>=frameInterval) {
      last=now;
      const keyAxis=Number(keys.has("KeyD")||keys.has("ArrowRight"))-Number(keys.has("KeyA")||keys.has("ArrowLeft"));
      const keyClimb=Number(keys.has("KeyW")||keys.has("ArrowUp"))-Number(keys.has("KeyS")||keys.has("ArrowDown"));
      const axis=keyAxis||(pointer&&Math.abs(pointer.x)>.2?Math.sign(pointer.x):0);
      const climb=keyClimb||(pointer&&Math.abs(pointer.y)>.3?-Math.sign(pointer.y):0);
      const boost=Number(keys.has("ShiftLeft")||keys.has("ShiftRight"));
      const gun=(buttons&1)||keys.has("Space")||keys.has("KeyF"),missile=(buttons&2)||keys.has("KeyM");
      const steps=Math.floor((pending+.25)/frameInterval);
      pending-=steps*frameInterval;
      for(let i=1;i<steps;i++) frame(...prior,0,false,null,false);
      frame(axis,climb,boost,gun,missile,now);
      prior=[axis,climb,boost,gun,missile];
    }
    requestAnimationFrame(loop);
  }
  if(inputTest) document.title="D1_FLY_NEXT_READY";
  requestAnimationFrame(loop);
}
</script>
</html>
