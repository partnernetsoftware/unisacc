<!doctype html>
<meta charset="utf-8">
<title>UXE 描边检查</title>
<canvas width="96" height="96"></canvas>
<pre id="pixels"></pre>
<script type="module">
import { createWebGLRenderer } from "../renderer-webgl.js";
import { MESH_BOX } from "../meshes.js";
import { Scene, PerspectiveCamera } from "../scene.js";

const canvas = document.querySelector("canvas");
const renderer = createWebGLRenderer(canvas, {antialias: false});
const gl = canvas.getContext("webgl");
const scene = new Scene();
scene.clearColor = [0, 0, 0, 1];
scene.ambient = {color: [1, 1, 1], intensity: 1};
scene.fog.density = 0;
scene.lights = [];
const box = scene.instances("cube", 1, [1, 1, 1]);
box.meshId = MESH_BOX;
box.metalness = 0;
box.set(0, 0, 0, 0, 1);
const camera = new PerspectiveCamera(2 * Math.atan(0.5));
camera.setEye(3, 0, 4);
camera.setTarget(0, 0, 0);
const rows = [];
for (const width of [1, location.search === "?mutate" ? 0 : 3]) {
  scene.outlineWidth = width;
  renderer.render(scene, camera);
  const row = new Uint8Array(96 * 4);
  gl.readPixels(0, 48, 96, 1, gl.RGBA, gl.UNSIGNED_BYTE, row);
  rows.push(row.filter((_, i) => i % 4 === 0).join(","));
}
document.querySelector("#pixels").textContent = rows.join(",");
</script>
