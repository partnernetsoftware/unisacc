<!doctype html>
<meta charset="utf-8">
<pre id="r160">pending</pre>
<script type="module">
import { BufferGeometryLoader, REVISION } from "../../web/game/three.module.js";
if (REVISION !== "160") throw new Error("three.js revision mismatch");
const geometry = new BufferGeometryLoader().parse({
  data: {
    groups: [{ materialIndex: 2, count: 8, start: 4 }],
    boundingSphere: { radius: 4, center: [1, 2, 3] },
    index: { array: [0], type: "Uint16Array" },
    attributes: {
      position: { usage: 35048, normalized: false, array: [1.25, -2, 0], type: "Float32Array", itemSize: 3 },
    },
  },
  type: "BufferGeometry",
  uuid: "geometry-1",
});
const position = geometry.getAttribute("position");
geometry.uuid = "position";
const bytes = new TextEncoder().encode(JSON.stringify(geometry.toJSON()));
let hash = 0;
for (const byte of bytes) hash = (hash * 131 + byte) % 16777213;
document.querySelector("#r160").textContent = JSON.stringify([
  Object.keys(geometry.attributes).length, position.getX(0), position.getY(0),
  position.usage, geometry.index.array instanceof Uint16Array ? 4 : 0,
  geometry.groups[0].materialIndex, geometry.boundingSphere.center.z + geometry.boundingSphere.radius, 2, -1, hash,
]);
</script>
