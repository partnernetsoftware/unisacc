<!doctype html>
<meta charset="utf-8">
<pre id="r160">pending</pre>
<script type="module">
import { Audio, AudioAnalyser, AudioContext, AudioListener, REVISION } from "../../web/game/three.module.js";
const output=document.querySelector("#r160");
try {
  if(REVISION!=="160") throw new Error("reference revision");
  const context=new OfflineAudioContext(2,256,48000);
  AudioContext.setContext(context);
  const audio=new Audio(new AudioListener());
  const analyser=new AudioAnalyser(audio,32).analyser;
  const buffer=context.createBuffer(2,128,48000);
  const left=[1,.5,-.5,.25],right=[-1,0,0,.75];
  for(let i=0;i<128;i++) {
    buffer.getChannelData(0)[i]=left[i%4];
    buffer.getChannelData(1)[i]=right[i%4];
  }
  audio.setBuffer(buffer).play();
  const suspended=context.suspend(128/48000);
  const rendered=context.startRendering();
  await suspended;
  const samples=new Uint8Array(32);
  analyser.getByteTimeDomainData(samples);
  await context.resume();
  await rendered;
  output.textContent=JSON.stringify([128,...samples.slice(0,4),1]);
} catch(error) { output.textContent="error:"+error.message; }
</script>
