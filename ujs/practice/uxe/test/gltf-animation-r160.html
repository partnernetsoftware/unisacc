<!doctype html>
<meta charset="utf-8">
<pre id="r160">pending</pre>
<script type="module">
import { Object3D, REVISION, VectorKeyframeTrack } from "../../web/game/three.module.js";
if (REVISION !== "160") throw new Error("three.js revision mismatch");
const root = new Object3D();
const target = new Object3D();
target.name = "animated";
root.add(target);
const nodes = [root, target];
const track = new VectorKeyframeTrack("animated.position", [0, 2], [0, 0, 0, 4.5, 2, 0]);
document.querySelector("#r160").textContent = JSON.stringify([
  nodes.indexOf(root.getObjectByName(track.name.split(".")[0])), track.getInterpolation(),
  track.times[1], track.values[3], -3, -5, -5,
]);
</script>
