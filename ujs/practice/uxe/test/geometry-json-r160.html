<!doctype html>
<meta charset="utf-8">
<pre id="r160">pending</pre>
<script type="module">
import { BufferGeometry, BufferAttribute, Sphere, Vector3, REVISION } from "../../web/game/three.module.js";
if (REVISION !== "160") throw new Error("three.js revision mismatch");
const geometry = new BufferGeometry();
geometry.uuid = "geometry-1";
geometry.name = "deck";
geometry.setAttribute("position", new BufferAttribute(new Float32Array([1.25, -2, 0]), 3).setUsage(35048));
geometry.setIndex(new BufferAttribute(new Uint16Array([0]), 1));
geometry.addGroup(4, 8, 2);
geometry.boundingSphere = new Sphere(new Vector3(1, 2, 3), 4);
const bytes = new TextEncoder().encode(JSON.stringify(geometry.toJSON()));
let hash = 0;
for (const byte of bytes) hash = (hash * 131 + byte) % 16777213;
document.querySelector("#r160").textContent = JSON.stringify([hash, bytes.length, -1, -2]);
</script>
