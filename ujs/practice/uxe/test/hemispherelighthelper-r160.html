<!doctype html>
<meta charset="utf-8">
<pre id="r160">pending</pre>
<script type="module">
import { Color, HemisphereLight, HemisphereLightHelper, REVISION, Vector3 } from "../../web/game/three.module.js";
if(REVISION!=="160") throw new Error("three.js revision mismatch");
const light=new HemisphereLight(new Color().setRGB(0.25,0,0),new Color().setRGB(0.75,0,0));
light.position.set(3,0,4);
const helper=new HemisphereLightHelper(light,2);
const mesh=helper.children[0];
const position=mesh.geometry.attributes.position;
const color=mesh.geometry.attributes.color;
const forward=mesh.getWorldDirection(new Vector3());
const values=[position.count,position.getY(0),position.getX(1),position.getZ(2),
  color.getX(11),color.getX(12),forward.x,forward.z,Number(mesh.material.vertexColors),color.version];
light.groundColor.r=0.5;
helper.update();
values.push(color.getX(12),color.version);
const override=new Color().setRGB(0,0.125,0);
const second=new HemisphereLightHelper(light,2);
second.color=override;
second.update();
values.push(second.material.color.g,second.children[0].geometry.attributes.color.version);
const solid=new HemisphereLightHelper(light,2,override);
values.push(Number(solid.material.vertexColors),solid.children[0].geometry.attributes.color.getX(12));
let released=0;
mesh.geometry.addEventListener("dispose",()=>released++);
mesh.material.addEventListener("dispose",()=>released++);
helper.dispose();
second.dispose();
solid.dispose();
document.querySelector("#r160").textContent=JSON.stringify([...values,released===2?0:1,-1,-1]);
</script>
