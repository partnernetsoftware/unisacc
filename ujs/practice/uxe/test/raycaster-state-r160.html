<!doctype html>
<meta charset="utf-8">
<pre id="r160">pending</pre>
<script type="module">
import { Raycaster, REVISION, Vector3 } from "../../web/game/three.module.js";
if (REVISION !== "160") throw new Error("three.js revision mismatch");
const o = new Vector3(1,2,3), d = new Vector3(0,1,0);
const plain = new Raycaster();
const custom = new Raycaster(o,d,2,13);
custom.set(new Vector3(0,1,0),new Vector3(1,2,3));
document.querySelector("#r160").textContent = JSON.stringify([
  plain.ray.direction.z, plain.near, Number(plain.far === Infinity), custom.ray.origin.y, custom.ray.direction.z,
  custom.near, custom.far, custom.layers.mask, custom.params.Points.threshold + custom.params.Line.threshold, 2,
]);
</script>
