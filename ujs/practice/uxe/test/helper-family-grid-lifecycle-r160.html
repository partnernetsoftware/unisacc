<!doctype html>
<meta charset="utf-8">
<pre id="r160">pending</pre>
<script type="module">
import { GridHelper, PolarGridHelper, REVISION } from "../../web/game/three.module.js";

if (REVISION !== "160") throw new Error("three.js revision mismatch");
const grid = new GridHelper(8, 2);
const polar = new PolarGridHelper(4, 4, 2, 4);
const gridClone = grid.clone();
const polarClone = polar.clone();
const gridCopy = new GridHelper().copy(grid);
const polarCopy = new PolarGridHelper().copy(polar);
grid.geometry.attributes.position.setX(0, 42);
polar.geometry.attributes.color.setX(0, 0.25);
const sourceDistinct = Number(grid !== gridClone && polar !== polarClone &&
  grid.geometry === gridClone.geometry && polar.geometry === polarClone.geometry);
document.querySelector("#r160").textContent = JSON.stringify([
  gridClone.geometry.attributes.position.count,
  polarClone.geometry.attributes.position.count,
  gridCopy.geometry.attributes.position.getX(0),
  polarCopy.geometry.attributes.color.getX(0),
  sourceDistinct
]);
</script>
