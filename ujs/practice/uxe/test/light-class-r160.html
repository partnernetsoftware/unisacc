<!doctype html>
<meta charset="utf-8">
<pre id="r160">pending</pre>
<script type="module">
import { AmbientLight, DirectionalLight, HemisphereLight, Light, LightProbe, Object3D,
  PointLight, RectAreaLight, REVISION, SpotLight } from "../../web/game/three.module.js";
if (REVISION !== "160") throw new Error("three.js revision mismatch");
const base = new Light();
const ambient = new AmbientLight(0xff0000, 1.5);
const hemi = new HemisphereLight(0x00ff00, 0x0000ff, 2);
const directional = new DirectionalLight(0xffffff, 3);
const point = new PointLight(0xffffff, 2);
const spot = new SpotLight(0xffffff, 4, 42);
const rect = new RectAreaLight(0xffffff, 5);
const probe = new LightProbe(undefined, 6);
probe.sh.coefficients[8].set(1, 2, 3);
spot.target.position.y = 7;
spot.shadow.bias = 0.125;
spot.shadow.normalBias = 0.25;
const cloned = spot.clone();
const previous = cloned.target.position.y;
cloned.target.position.y = 9;
const copied = new SpotLight().copy(spot).toJSON().object;
const asPoint = point.toJSON().object;
rect.power = 200 * Math.PI;
const asRect = rect.toJSON().object;
const copyProbe = probe.clone();
probe.sh.coefficients[8].set(9, 9, 9);
const asProbe = copyProbe.toJSON().object;
const disposed = [];
spot.shadow.map = { dispose() { disposed.push(7); } };
spot.shadow.mapPass = { dispose() { disposed.push(9); } };
spot.dispose();
directional.add(new Object3D());
const directionCopy = new DirectionalLight().copy(directional, false);
const values = [ambient.toJSON().object.color + base.intensity,
  hemi.toJSON().object.groundColor + hemi.matrix.elements[13],
  previous * 10 + spot.target.position.y,
  copied.distance + copied.shadow.bias + (copied.shadow.normalBias ?? 0),
  Number("shadow" in directional.toJSON().object) + directional.position.y,
  point.power + asPoint.decay + asPoint.shadow.camera.fov,
  asRect.width + asRect.height + asRect.intensity,
  Number(asProbe.type === "Light") * 10 + asProbe.sh[26],
  disposed[0] * 10 + disposed[1], -11, directionCopy.children.length,
  spot.distance + spot.shadow.normalBias + Number(spot.target.isObject3D)];
document.querySelector("#r160").textContent = JSON.stringify(values);
</script>
