<!doctype html>
<meta charset="utf-8">
<pre id="r160">pending</pre>
<script type="module">
import { BufferAttribute, Matrix3, REVISION, Vector2 } from "../../web/game/three.module.js";
if (REVISION !== "160") throw new Error("three.js revision mismatch");
const a = new Vector2(3, -4), b = new Vector2(-2, 5);
const matrix = new Matrix3().set(2, 3, 7, -1, 4, -8, 0, 0, 1);
const limits = [new Vector2(-1, -3), new Vector2(2, 2)];
const fractions = new Vector2(1.5, -2.25);
const samples = [0.125, 0.625];
const originalRandom = Math.random;
Math.random = () => samples.shift();
const random = new Vector2().random();
Math.random = originalRandom;
document.querySelector("#r160").textContent = JSON.stringify([
  a.clone().set(-2, 5).x, a.clone().add(b).y, a.clone().sub(b).x,
  a.clone().multiply(b).y, a.clone().divide(b).x, a.dot(b), a.cross(b),
  a.lengthSq(), a.length(), a.clone().normalize().y, a.distanceToSquared(b),
  a.distanceTo(b), a.clone().applyMatrix3(matrix).x, a.clone().applyMatrix3(matrix).y,
  a.clone().copy(b).y, a.getComponent(1), a.clone().setComponent(0, 7.5).x,
  a.clone().setScalar(-7.25).y, a.clone().addScalar(2.5).x,
  a.clone().multiplyScalar(-2).y, a.clone().setLength(10).x,
  a.clone().lerp(b, 0.25).y, a.clone().clamp(...limits).y,
  a.angle(), a.angleTo(new Vector2(4, 3)), a.clone().rotateAround(b, Math.PI / 2).x,
  a.manhattanLength(), a.manhattanDistanceTo(b), Number(a.equals(a.clone())),
  fractions.clone().floor().y, fractions.clone().ceil().x,
  fractions.clone().round().x, fractions.clone().roundToZero().y,
  a.clone().fromArray([8, 2, -3], 1).y, a.toArray([11, 12], 1)[2],
  new Vector2().fromBufferAttribute(new BufferAttribute(new Float32Array([5, 6, 0.1, 0.2]), 2), 1).x,
  new Vector2().addVectors(a, b).x, new Vector2().subVectors(a, b).y,
  a.clone().addScaledVector(b, 0.5).y, a.clone().subScalar(5).y,
  a.clone().divideScalar(2).x, a.clone().negate().x,
  new Vector2().lerpVectors(a, b, 0.25).x, a.clone().clampScalar(-1, 2).x,
  a.clone().clampLength(0, 2.5).y, a.clone().setX(8).x, a.clone().setY(-9).y,
  a.clone().min(b).x, a.clone().max(b).y, random.y,
  Number([...a][0] === a.width && [...a][1] === a.height),
  Number(Object.is(new Vector2(-0.125, -0).ceil().x, -0)),
  Number(Object.is(new Vector2(0, 1).min(new Vector2(-0, -1)).x, -0)),
  new Vector2().normalize().length(),
  new Vector2().angleTo(a)
]);
</script>
