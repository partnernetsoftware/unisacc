<!doctype html>
<meta charset="utf-8">
<pre id="r160">pending</pre>
<script type="module">
import { ImageLoader, REVISION } from "../../web/game/three.module.js";
if (REVISION !== "160") throw new Error("three.js revision mismatch");
const bytes = Uint8Array.from([
  255, 216, 255, 219, 0, 67, 0, ...Array(64).fill(8),
  255, 194, 0, 11, 8, 0, 1, 0, 1, 1, 1, 17, 0,
  255, 196, 0, 38, 0, 1, ...Array(15).fill(0), 6, 16, 1, ...Array(15).fill(0), 0,
  255, 218, 0, 8, 1, 1, 0, 0, 0, 1, 65,
  255, 218, 0, 8, 1, 1, 0, 1, 63, 0, 127,
  255, 218, 0, 8, 1, 1, 0, 0, 0, 16, 255, 0,
  255, 217,
]);
const acBytes = Uint8Array.from([
  255, 216, 255, 219, 0, 67, 0, 8, 64, ...Array(62).fill(8),
  255, 194, 0, 11, 8, 0, 1, 0, 1, 1, 1, 17, 0,
  255, 196, 0, 39, 0, 1, ...Array(15).fill(0), 0, 16, 1, 1, ...Array(14).fill(0), 1, 0,
  255, 218, 0, 8, 1, 1, 0, 0, 0, 0, 127,
  255, 218, 0, 8, 1, 1, 0, 1, 63, 1, 111,
  255, 218, 0, 8, 1, 1, 0, 1, 63, 16, 191,
  255, 217,
]);
async function red(picture) {
  const url = URL.createObjectURL(new Blob([picture], { type: "image/jpeg" }));
  const image = await new ImageLoader().loadAsync(url);
  URL.revokeObjectURL(url);
  const canvas = document.createElement("canvas");
  canvas.width = image.naturalWidth;
  canvas.height = image.naturalHeight;
  const context = canvas.getContext("2d");
  context.drawImage(image, 0, 0);
  return context.getImageData(0, 0, 1, 1).data[0];
}
// Other rows describe entropy units and rejection codes, which ImageLoader does not expose.
document.querySelector("#r160").textContent = JSON.stringify([64, 32, await red(bytes), -63, -6, 4, -6, 5, -4,
  await red(acBytes), 1, -3, 2, -6, 0, -6]);
</script>
