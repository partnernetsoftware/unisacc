<!doctype html>
<meta charset="utf-8">
<pre id="r160">pending</pre>
<script type="module">
const pack = channels => channels.reduce((value, channel, index) => value + channel * 256 ** index, 0);
function composite(destination, source) {
  const a = source[3] / 255;
  const b = destination[3] / 255;
  const opacity = a + b * (1 - a);
  const rgb = source.slice(0,3).map((value, index) =>
    Math.round((a * value + b * (1 - a) * destination[index]) / opacity));
  return pack([...rgb, Math.round(opacity * 255)]);
}
const blue = [0,0,255,255];
const red = [255,0,0,128];
document.querySelector("#r160").textContent = JSON.stringify([
  composite(blue,red), composite([0,0,255,128],red),
  composite([255,0,0,255],[0,255,0,0]), composite([0,0,255,0],red),
  composite([255,0,0,255],[0,255,0,255]),-1,-1,
]);
</script>
