<!doctype html>
<meta charset="utf-8">
<pre id="r160">pending</pre>
<script type="module">
import { BufferGeometry, Float32BufferAttribute, Group, Mesh, MeshBasicMaterial,
  MeshPhysicalMaterial, OrthographicCamera, REVISION, Scene, WebGLRenderer } from "../../web/game/three.module.js";
const output = document.querySelector("#r160");
try {
  if (REVISION !== "160") throw new Error("three.js revision mismatch");
  const renderer = new WebGLRenderer();
  renderer.setSize(8, 8);
  const camera = new OrthographicCamera(-1, 1, 1, -1, 0, 10);
  camera.position.z = 1;
  const scene = new Scene();
  const group = new Group();
  group.renderOrder = 1;
  scene.add(group);
  const geometry = new BufferGeometry();
  geometry.setAttribute("position", new Float32BufferAttribute([-0.5,-0.5,0,0.5,-0.5,0,0,0.5,0], 3));
  const opaque = [new MeshBasicMaterial(), new MeshBasicMaterial()];
  const transparent = [new MeshBasicMaterial({ transparent: true }), new MeshBasicMaterial({ transparent: true })];
  const transmission = new MeshPhysicalMaterial({ transmission: 1 });
  const rows = [[0.6,0,0,0],[0.2,0,0,0],[0.1,0,1,0],[0,-4,0,0],
    [0.2,0,1,2],[0.7,0,0,2],[0.1,-1,0,2],[0.3,0,0,1]];
  rows.forEach(([z, order, material, pass], index) => {
    const mesh = new Mesh(geometry, pass === 0 ? opaque[material] : pass === 1 ? transmission : transparent[material]);
    mesh.position.z = -z;
    mesh.renderOrder = order;
    mesh.userData.index = index;
    (index === 3 ? group : scene).add(mesh);
  });
  renderer.render(scene, camera);
  const list = renderer.renderLists.get(scene, 0);
  output.textContent = JSON.stringify([...list.opaque, ...list.transmissive, ...list.transparent]
    .map(item => item.object.userData.index).concat(-1, -2, 0));
  renderer.dispose();
} catch (error) {
  output.textContent = String(error);
}
</script>
