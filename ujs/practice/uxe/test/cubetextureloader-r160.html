<!doctype html>
<meta charset="utf-8">
<pre id="r160">pending</pre>
<script type="module">
import { CubeTextureLoader, REVISION } from "../../web/game/three.module.js";
if (REVISION !== "160") throw new Error("three.js revision mismatch");
const canvas = document.createElement("canvas");
canvas.width = canvas.height = 1;
const context = canvas.getContext("2d");
const urls = Array.from({ length: 6 }, (_, face) => {
  context.fillStyle = `rgb(${40 + face}, 0, 0)`;
  context.fillRect(0, 0, 1, 1);
  return canvas.toDataURL("image/png");
});
const texture = await new CubeTextureLoader().loadAsync(urls);
const red = face => { context.drawImage(texture.images[face], 0, 0); return context.getImageData(0, 0, 1, 1).data[0]; };
const ordered = texture.images.reduce((packed, _, face) => packed * 64 + red(face), 0);
document.querySelector("#r160").textContent = JSON.stringify([texture.images[0].naturalWidth, red(0), ordered, -2, 97, -2]);
texture.dispose();
</script>
