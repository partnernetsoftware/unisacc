<!doctype html>
<meta charset="utf-8">
<pre id="r160">pending</pre>
<script type="module">
import { ArrowHelper, REVISION, Vector3 } from "../../web/game/three.module.js";

if (REVISION !== "160") throw new Error("three.js revision mismatch");
const source = new ArrowHelper(new Vector3(1, 0, 0), new Vector3(), 5);
const clone = source.clone();
const copied = new ArrowHelper().copy(source);
const resources = arrow => [arrow.line.geometry, arrow.line.material, arrow.cone.geometry, arrow.cone.material];
const references = resources(source);
const shared = resourceList => resourceList.every((resource, i) => resource === references[i]);

source.setLength(8);
const copyPose = [clone.quaternion.z, clone.line.scale.y, copied.cone.position.y];
const sharing = Number(shared(resources(clone)) && shared(resources(copied)));
const releaseOrder = [];
references.forEach((resource, i) => resource.addEventListener("dispose", () => releaseOrder.push(i)));
clone.dispose();

const released = Number(releaseOrder.join(",") === "0,1,2,3");
const sourceRemains = Number(source.line.scale.y === 6.4 && source.cone.position.y === 8);
const copiesRemain = Number(clone !== source && copied !== source && clone !== copied);
document.querySelector("#r160").textContent =
  JSON.stringify([...copyPose, sharing, released, sourceRemains, copiesRemain]);
</script>
