<!doctype html>
<meta charset="utf-8">
<pre id="r160">pending</pre>
<script type="module">
import { ShapePath, REVISION } from "../../web/game/three.module.js";
if (REVISION !== "160") throw new Error("three.js revision mismatch");
const path = new ShapePath();
path.moveTo(0, 0); path.lineTo(0, 6); path.lineTo(6, 0); path.currentPath.closePath();
path.moveTo(1, 1); path.lineTo(2, 1); path.lineTo(1, 2); path.currentPath.closePath();
path.moveTo(10, 0); path.lineTo(10, 6); path.lineTo(16, 0); path.currentPath.closePath();
const [one, two] = path.toShapes();
const ids = x => x === 0 ? 1 : x === 1 ? 2 : x === 10 ? 3 : 0;
const draw = new ShapePath();
let noPath = 0;
try { draw.lineTo(1, 1); } catch { noPath = -1; }
draw.moveTo(4, 5).lineTo(6, 7).quadraticCurveTo(7, 6, 8, 9).bezierCurveTo(9, 10, 10, 11, 11, 12);
draw.moveTo(13, 14);
const curves = draw.subPaths[0].curves;
document.querySelector("#r160").textContent = JSON.stringify([Number(!!one) + Number(!!two),
  ids(one.getPoint(0).x), one.holes.length, ids(one.holes[0].getPoint(0).x),
  ids(two.getPoint(0).x), two.holes.length, draw.subPaths.length, curves.length,
  curves[0].getPoint(0).y, curves[1].getPoint(1).x, curves[2].getPoint(1).y, draw.currentPath.currentPoint.x,
  noPath, -1]);
</script>
