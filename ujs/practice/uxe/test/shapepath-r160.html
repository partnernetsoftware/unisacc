<!doctype html>
<meta charset="utf-8">
<pre id="r160">pending</pre>
<script type="module">
import { ShapePath, REVISION } from "../../web/game/three.module.js";
if (REVISION !== "160") throw new Error("three.js revision mismatch");
const path = new ShapePath();
path.moveTo(0, 0); path.lineTo(0, 6); path.lineTo(6, 0); path.currentPath.closePath();
path.moveTo(1, 1); path.lineTo(2, 1); path.lineTo(1, 2); path.currentPath.closePath();
path.moveTo(10, 0); path.lineTo(10, 6); path.lineTo(16, 0); path.currentPath.closePath();
const [one, two] = path.toShapes();
const ids = x => x === 0 ? 1 : x === 1 ? 2 : x === 10 ? 3 : 0;
document.querySelector("#r160").textContent = JSON.stringify([Number(!!one) + Number(!!two),
  ids(one.getPoint(0).x), one.holes.length, ids(one.holes[0].getPoint(0).x),
  ids(two.getPoint(0).x), two.holes.length]);
</script>
