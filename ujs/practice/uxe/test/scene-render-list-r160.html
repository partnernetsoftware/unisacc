<!doctype html>
<meta charset="utf-8">
<pre id="r160">pending</pre>
<script type="module">
import { BoxGeometry, Mesh, MeshBasicMaterial, OrthographicCamera, REVISION, Scene, WebGLRenderer }
  from "../../web/game/three.module.js";
const output=document.querySelector("#r160");
try {
  if(REVISION!=="160") throw new Error("three.js revision mismatch");
  const canvas=document.createElement("canvas");
  const context=canvas.getContext("webgl2");
  const renderer=new WebGLRenderer({canvas,context});
  renderer.setSize(16,16);
  const scene=new Scene();
  const camera=new OrthographicCamera(-10,10,10,-10,0,20);
  for(let i=0;i<5;i++) {
    const geometry=new BoxGeometry();
    if(i===3) geometry.translate(0,0,-6);
    const mesh=new Mesh(geometry,new MeshBasicMaterial({transparent:i>=2}));
    mesh.userData.handle=101+i;
    mesh.position.z=-2;
    if(i===0) mesh.renderOrder=1;
    if(i===4) mesh.layers.set(1);
    scene.add(mesh);
  }
  renderer.render(scene,camera);
  const list=renderer.renderLists.get(scene,0);
  const order=[...list.opaque,...list.transparent].map(item=>item.object.userData.handle);
  renderer.dispose();
  output.textContent=JSON.stringify([order.length,...order,order[2]+100,1024+(order[2]-101)*128,1,-3,1]);
} catch(error) { output.textContent=`error:${error.message}`; }
</script>
