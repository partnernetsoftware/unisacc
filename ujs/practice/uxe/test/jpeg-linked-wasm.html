<!doctype html>
<meta charset="utf-8">
<pre id="wasm-cases">pending</pre>
<script type="module">
const status = document.querySelector("#wasm-cases");
try {
  const read = async name => new Uint8Array(await (await fetch(name)).arrayBuffer());
  const [baseBytes, probeBytes, input, layout] = await Promise.all([
    read("base.wasm"), read("probe.wasm"), read("input.bin"), read("layout.bin")
  ]);
  if (input.length !== 512 || layout.length !== 12) throw new Error("invalid fixture");
  const config = new DataView(layout.buffer);
  const mode = config.getUint32(8, true);
  const [baseModule, probeModule] = await Promise.all([
    WebAssembly.compile(baseBytes), WebAssembly.compile(probeBytes)
  ]);
  const actual = [];
  for (let index=0; index<14; index++) {
    const base = await WebAssembly.instantiate(baseModule);
    const dispatch = base.exports.uxe_jpeg_dispatch;
    if (dispatch(0n,0n,0n) !== 1n || dispatch(0n,1n,0n) !== 512n ||
        dispatch(0n,5n,0n) !== 11n || dispatch(0n,6n,0n) !== 3n) throw new Error("JPEG ABI mismatch");
    const probe = await WebAssembly.instantiate(probeModule,{
      uxe_jpeg_v1: {uxe_jpeg_dispatch: dispatch}
    });
    if (base.exports.memory === probe.exports.memory) throw new Error("shared Wasm memory");
    for (let offset=0; offset<input.length; offset++) {
      if (dispatch(1n,BigInt(offset),BigInt(input[offset])) < 0n) throw new Error("fixture write failed");
    }
    if (dispatch(2n,BigInt(config.getUint32(0,true)),BigInt(config.getUint32(4,true))) < 0n) {
      throw new Error("fixture layout failed");
    }
    const selector = mode===1 && index===7 ? index+32 : mode===2 && index===11 ? index+64 : index;
    actual.push(probe.exports.uxe_evaluate_case(BigInt(selector)));
  }
  status.textContent = JSON.stringify(actual);
} catch (error) {
  status.textContent = "error:" + error.message;
}
</script>
