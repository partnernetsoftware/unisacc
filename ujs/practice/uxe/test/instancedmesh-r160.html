<!doctype html>
<meta charset="utf-8">
<pre id="r160">pending</pre>
<script type="module">
import { BoxGeometry, Color, InstancedMesh, Matrix4, MeshBasicMaterial, REVISION } from "../../web/game/three.module.js";
if (REVISION !== "160") throw new Error("three.js revision mismatch");
const batch = new InstancedMesh(new BoxGeometry(2, 2, 2), new MeshBasicMaterial(), 3);
const matrix = new Matrix4();
batch.getMatrixAt(0, matrix);
const identity = matrix.elements[0];
batch.setMatrixAt(1, matrix.makeTranslation(2.5, 4, -1));
batch.setMatrixAt(2, matrix.makeTranslation(-3, 1, 2));
batch.getMatrixAt(1, matrix);
const x = matrix.elements[12];
batch.getMatrixAt(2, matrix);
const z = matrix.elements[14];
batch.setColorAt(1, new Color(0.1, 0.5, 0.75));
const empty = new Color(), tint = new Color();
batch.getColorAt(0, empty);
batch.getColorAt(1, tint);
batch.computeBoundingBox();
const {min, max} = batch.boundingBox.clone();
batch.count = 2;
batch.computeBoundingBox();
document.querySelector("#r160").textContent = JSON.stringify([
  identity,x,z,empty.r,tint.r,tint.b,min.x,max.y,batch.boundingBox.min.x,-1
]);
</script>
