<!doctype html>
<meta charset="utf-8">
<pre id="r160">pending</pre>
<script type="module">
import { ImageLoader, ImageUtils, REVISION } from "../../web/game/three.module.js";
if (REVISION !== "160") throw new Error("three.js revision mismatch");
const values = [];
const dimensions = [[2048,1],[2049,1],[1,2049],[2,1],[17,9],[2049,1]];
for (const [i, [width,height]] of dimensions.entries()) {
  const canvas = document.createElement("canvas");
  canvas.width = width;
  canvas.height = height;
  const ctx = canvas.getContext("2d");
  ctx.fillStyle = "rgb(204,68,119)";
  ctx.fillRect(0, 0, width, height);
  const uri = i === 4 ? canvas.toDataURL("image/jpeg", 0.8) : ImageUtils.getDataURL(canvas);
  const mime = i === 0 || i === 3 ? "png" : "jpeg";
  if (!uri.startsWith(`data:image/${mime};base64,`)) { values.push(0); continue; }
  const image = await new ImageLoader().loadAsync(uri);
  ctx.drawImage(image, 0, 0);
  const rgba = ctx.getImageData(0, 0, 1, 1).data;
  if (i < 3) values.push(i === 2 ? image.naturalHeight : image.naturalWidth);
  if (i === 3) values.push(rgba[0]);
  if (i === 4) values.push(Number(Math.abs(rgba[0] - 204) <= 3));
  if (i === 5) values.push(Number(Math.abs(rgba[1] - 68) <= 5));
}
document.querySelector("#r160").textContent = JSON.stringify([...values, -2, 99, -1, -1]);
</script>
