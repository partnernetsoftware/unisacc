<!DOCTYPE html>
<html lang="zh"><head>
<meta charset="utf-8"/><title>uxe-tex3</title>
</head><body>
<canvas id="c" width="8" height="8"></canvas>
<pre id="hud"></pre>
<script>
(function(){
  const hud=document.getElementById("hud");
  try{
    const c=document.getElementById("c");
    const gl=c.getContext("webgl",{premultipliedAlpha:false,alpha:true,preserveDrawingBuffer:true});
    const vs=gl.createShader(gl.VERTEX_SHADER);
    gl.shaderSource(vs,"attribute vec2 p;void main(){gl_Position=vec4(p,0,1);}");
    gl.compileShader(vs);
    const fs=gl.createShader(gl.FRAGMENT_SHADER);
    gl.shaderSource(fs,"precision mediump float;uniform vec4 c;void main(){gl_FragColor=c;}");
    gl.compileShader(fs);
    const prog=gl.createProgram();
    gl.attachShader(prog,vs); gl.attachShader(prog,fs); gl.linkProgram(prog);
    gl.useProgram(prog);
    const buf=gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER,buf);
    gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,1,-1,-1,1,1,1]),gl.STATIC_DRAW);
    const loc=gl.getAttribLocation(prog,"p");
    gl.enableVertexAttribArray(loc);
    gl.vertexAttribPointer(loc,2,gl.FLOAT,false,0,0);
    const uc=gl.getUniformLocation(prog,"c");
    const tex=gl.createTexture();
    gl.bindTexture(gl.TEXTURE_2D,tex);
    gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,8,8,0,gl.RGBA,gl.UNSIGNED_BYTE,null);
    const fb=gl.createFramebuffer();
    gl.bindFramebuffer(gl.FRAMEBUFFER,fb);
    gl.framebufferTexture2D(gl.FRAMEBUFFER,gl.COLOR_ATTACHMENT0,gl.TEXTURE_2D,tex,0);
    gl.viewport(0,0,8,8);
    gl.disable(gl.DEPTH_TEST);
    gl.enable(gl.BLEND);
    gl.blendFuncSeparate(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA, gl.ONE, gl.ONE_MINUS_SRC_ALPHA);

    gl.clearColor(0,0,0,1);
    gl.clear(gl.COLOR_BUFFER_BIT);
    gl.uniform4f(uc,1,0,0,1);
    gl.drawArrays(gl.TRIANGLE_STRIP,0,4);
    gl.uniform4f(uc,0,1,0,128/255);
    gl.drawArrays(gl.TRIANGLE_STRIP,0,4);
    const px=new Uint8Array(4);
    gl.readPixels(4,4,1,1,gl.RGBA,gl.UNSIGNED_BYTE,px);
    const want=[128,128,0,255];
    let ok=1;
    for(let i=0;i<4;i++) if(Math.abs(px[i]-want[i])>1) ok=0;
    hud.textContent=JSON.stringify({px:[px[0],px[1],px[2],px[3]],want:want});
    document.title=ok?"BLEND_OK":"BLEND_FAIL";
  }catch(e){
    document.title="BLEND_ERR";
    hud.textContent=String(e&&e.message||e);
  }
})();
</script>
</body></html>
