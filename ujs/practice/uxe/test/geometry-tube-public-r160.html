<!doctype html>
<meta charset="utf-8">
<pre id="r160">pending</pre>
<script type="module">
import { LineCurve3, ObjectLoader, QuadraticBezierCurve3, REVISION, TubeGeometry, Vector3 }
  from "../../web/game/three.module.js";

const result = document.querySelector("#r160");
const encoder = new TextEncoder(), decoder = new TextDecoder();
const maxError = (a, b) => a.length === b.length
  ? a.reduce((error, value, i) => Math.max(error, Math.abs(value - b[i])), 0)
  : 1000 + Math.abs(a.length - b.length);
const attrs = geo => ["position","normal","uv"].map(name => geo.attributes[name].array).concat([geo.index.array]);

function check(module, closed, mutate) {
  const start = closed ? new Vector3(0, 0, 0) : new Vector3(1, 2, 3);
  const finish = closed ? new Vector3(0, 0, 2) : new Vector3(3, 5, 7);
  const line = new LineCurve3(start, finish);
  line.arcLengthDivisions = 16;
  const stock = new TubeGeometry(line, closed ? 2 : 3, closed ? .5 : 1.25, closed ? 4 : 6, closed);
  stock.uuid = "tube-1";
  stock.name = 'tube "A"';
  const input = stock.toJSON();
  const run = (mode, json) => {
    const api = new WebAssembly.Instance(module).exports;
    const base = Number(api.uxe_tube_public(0n, 0n));
    const memory = new Uint8Array(api.memory.buffer, base, 60000);
    memory.set(encoder.encode("tube-1"), 6000);
    memory.set(encoder.encode('tube "A"'), 6016);
    const bytes = encoder.encode(JSON.stringify(json));
    memory.set(bytes, 48000);
    const status = Number(api.uxe_tube_public(BigInt(mode), BigInt(bytes.length)));
    if (mode > 1) return status;
    if (status <= 0) throw new Error("native JSON status " + status + " closed=" + closed);
    const desc = new Uint32Array(api.memory.buffer, base + 7000, 6);
    const arrays = [3,3,2].map((size,i) => new Float32Array(api.memory.buffer, base + desc[i], size * desc[4]).slice());
    arrays.push(new Uint16Array(api.memory.buffer, base + desc[3], desc[5]).slice());
    return { json: JSON.parse(decoder.decode(memory.subarray(4096, 4096 + status))), arrays };
  };
  const restored = run(1, mutate ? {...input, radius: input.radius + .5} : input);
  const loader = new ObjectLoader();
  const fresh = loader.parseGeometries([restored.json])["tube-1"];
  const lens = attrs(stock);
  const restoredArrays = attrs(fresh);
  const path = restored.json.path;
  const zero = {...input, path: new LineCurve3(start, start).toJSON()};
  const unrelated = {...input, path: new QuadraticBezierCurve3(start, new Vector3(1,0,1), finish).toJSON()};
  const points = restored.arrays[0];
  const last = (fresh.attributes.position.count - fresh.parameters.radialSegments - 1) * 3;
  const delta = Math.hypot(points[last] - points[0], points[last+1] - points[1], points[last+2] - points[2]);
  return [
    Number(fresh instanceof TubeGeometry && fresh.parameters.path instanceof LineCurve3),
    Number(restored.json.uuid === input.uuid && restored.json.name === input.name && restored.json.type === input.type),
    Number(path.type === input.path.type && maxError(path.v1, input.path.v1) === 0 &&
      maxError(path.v2, input.path.v2) === 0 && path.arcLengthDivisions === input.path.arcLengthDivisions),
    fresh.parameters.tubularSegments, fresh.parameters.radius, fresh.parameters.radialSegments,
    Number(fresh.parameters.closed), fresh.attributes.position.count, fresh.index.count,
    ...restored.arrays.map((array, i) => maxError(array, lens[i])),
    ...restoredArrays.map((array, i) => maxError(array, lens[i])),
    delta, run(2, unrelated), run(2, zero), run(2, {...input, tubularSegments: 2.5}), run(3, input),
  ];
}

try {
  if (REVISION !== "160") throw new Error("three.js revision mismatch");
  const query = new URLSearchParams(location.search);
  const binary = await (await fetch("file://" + query.get("wasm"))).arrayBuffer();
  const module = await WebAssembly.compile(binary);
  const mutate = Boolean(Number(query.get("mutate")));
  result.textContent = JSON.stringify([false,true].flatMap(closed => check(module, closed, mutate)));
} catch (error) {
  result.textContent = "error:" + error.message;
}
</script>
