<!doctype html>
<meta charset="utf-8">
<pre id="r160">pending</pre>
<script type="module">
import { BooleanKeyframeTrack, InterpolateLinear, REVISION } from "../../web/game/three.module.js";
if (REVISION !== "160") throw new Error("three.js revision mismatch");
const track = new BooleanKeyframeTrack("x", [0, 2, 4], [false, true, false]);
const mode = track.getInterpolation();
track.setInterpolation(InterpolateLinear);
const f = track.createInterpolant();
document.querySelector("#r160").textContent = JSON.stringify([
  mode, track.getInterpolation(), Number(f.evaluate(1.99)[0]), Number(f.evaluate(2)[0]), -2, -1
]);
</script>
