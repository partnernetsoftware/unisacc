<!doctype html>
<meta charset="utf-8">
<pre id="r160">pending</pre>
<script type="module">
import { FramebufferTexture, REVISION } from "../../web/game/three.module.js";
if (REVISION !== "160") throw Error("three.js revision mismatch");
const texture = new FramebufferTexture(2, 3);
const json = texture.toJSON();
document.querySelector("#r160").textContent = JSON.stringify([
  texture.image.width, texture.image.height, json.format, json.type, -1, -1
]);
texture.dispose();
</script>
