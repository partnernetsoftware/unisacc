<!doctype html>
<meta charset="utf-8">
<pre id="r160">pending</pre>
<script type="module">
import { Camera, Object3D, ObjectLoader, REVISION } from "../../web/game/three.module.js";
if(REVISION!=="160") throw Error("revision");
const parent=new Object3D();
const camera=new Camera();
camera.uuid="c";
camera.position.x=2;
camera.visible=false;
camera.layers.set(31);
parent.position.x=5;
parent.add(camera);
camera.updateWorldMatrix(true,false);
const source=camera.toJSON();
if(source.object.type!=="Camera") throw Error("class tag");
const copy=new ObjectLoader().parse(source);
document.querySelector("#r160").textContent=JSON.stringify([
  camera.matrixWorldInverse.elements[12],copy.matrix.elements[12],Number(copy.visible),copy.layers.mask>>>0,-2,
]);
</script>
