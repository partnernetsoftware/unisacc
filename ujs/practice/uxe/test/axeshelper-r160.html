<!doctype html>
<meta charset="utf-8">
<pre id="r160">pending</pre>
<script type="module">
import { AxesHelper, Color, REVISION } from "../../web/game/three.module.js";
if(REVISION!=="160") throw new Error("three.js revision mismatch");
const helper=new AxesHelper(2);
const pos=helper.geometry.attributes.position;
const color=helper.geometry.attributes.color;
const initial=color.array[4];
helper.setColors(new Color().setRGB(0.25,0,0),new Color().setRGB(0,0.5,0),new Color().setRGB(0,0,0.75));
let released=0;
helper.geometry.addEventListener("dispose",()=>released++);
helper.material.addEventListener("dispose",()=>released++);
helper.dispose();
document.querySelector("#r160").textContent=JSON.stringify([
  pos.count,pos.array[3],pos.array[10],pos.array[17],initial,color.array[3],color.array[16],
  color.version,released===2?0:1,-1,-1,
]);
</script>
