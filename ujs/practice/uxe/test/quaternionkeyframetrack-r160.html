<!doctype html>
<meta charset="utf-8">
<pre id="r160">pending</pre>
<script type="module">
import { QuaternionKeyframeTrack, InterpolateDiscrete, InterpolateSmooth, REVISION } from "../../web/game/three.module.js";
if (REVISION !== "160") throw new Error("three.js revision mismatch");
const track = new QuaternionKeyframeTrack("x", [0, 2], [0, 0, 0, 1, 0, 0, -1, 0]);
const middle = track.createInterpolant().evaluate(1)[2];
const mode = track.setInterpolation(InterpolateSmooth).getInterpolation();
const f = track.setInterpolation(InterpolateDiscrete).createInterpolant();
document.querySelector("#r160").textContent = JSON.stringify([middle, mode, f.evaluate(1)[2], f.evaluate(2)[2], -1]);
</script>
