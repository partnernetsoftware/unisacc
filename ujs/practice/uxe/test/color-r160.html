<!doctype html>
<meta charset="utf-8">
<pre id="r160">pending</pre>
<script type="module">
import { Color, REVISION } from "../../web/game/three.module.js";
if (REVISION !== "160") throw new Error("three.js revision mismatch");
const a=new Color().setRGB(0.25,0.5,0.75);
const b=new Color().setRGB(0.75,0.25,0.5);
const hsl=a.getHSL({});
document.querySelector("#r160").textContent=JSON.stringify([
  a.clone().add(b).g,a.clone().sub(b).r,a.clone().multiply(b).b,
  a.clone().lerp(b,0.25).r,a.clone().setHSL(1/3,1,0.5).g,hsl.l,
  new Color(0x808080).r,new Color(0xabcdef).getHex(),
  Number(new Color(0xabcdef).getHexString()==="abcdef"),
  a.clone().offsetHSL(0,0,0.125).g,
  a.clone().lerpHSL(b,0.5).r
]);
</script>
