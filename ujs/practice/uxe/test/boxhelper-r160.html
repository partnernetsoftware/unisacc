<!doctype html>
<meta charset="utf-8">
<pre id="r160">pending</pre>
<script type="module">
import { BoxGeometry, BoxHelper, Group, Mesh, REVISION } from "../../web/game/three.module.js";
if(REVISION!=="160") throw new Error("three.js revision mismatch");
const mesh=new Mesh(new BoxGeometry(8,6,2));
mesh.position.set(2,5,2);
const root=new Group();
root.add(mesh);
const helper=new BoxHelper(root);
const pos=helper.geometry.attributes.position;
const sphere=helper.geometry.boundingSphere;
const values=[pos.getX(0),pos.getX(1),pos.getZ(4),helper.geometry.index.getX(23),
  sphere.center.x,sphere.center.y,sphere.radius,helper.material.color.getHex(),pos.version];
mesh.scale.x=11/8;
mesh.position.x=3.5;
helper.update();
values.push(pos.getX(0));
mesh.scale.x=1;
mesh.position.x=2;
const empty=new BoxHelper(root);
root.remove(mesh);
empty.update();
values.push(empty.geometry.attributes.position.getX(0),empty.geometry.attributes.position.version);
let released=0;
helper.geometry.addEventListener("dispose",()=>released++);
helper.material.addEventListener("dispose",()=>released++);
helper.dispose();
empty.dispose();
mesh.geometry.dispose();
mesh.material.dispose();
document.querySelector("#r160").textContent=JSON.stringify([...values,released===2?0:1,-1,-1]);
</script>
