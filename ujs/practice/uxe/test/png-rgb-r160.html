<!doctype html>
<meta charset="utf-8">
<pre id="r160">pending</pre>
<script type="module">
import { ImageLoader, REVISION } from "../../web/game/three.module.js";
if (REVISION !== "160") throw new Error("three.js revision mismatch");
const canvas = document.createElement("canvas");
canvas.width = 2;
canvas.height = 1;
const ctx = canvas.getContext("2d");
ctx.putImageData(new ImageData(Uint8ClampedArray.of(11,22,33,255,44,55,66,255), 2, 1), 0, 0);
const image = await new ImageLoader().loadAsync(canvas.toDataURL("image/png"));
ctx.clearRect(0, 0, 2, 1);
ctx.drawImage(image, 0, 0);
const pixels = ctx.getImageData(0, 0, 2, 1).data;
document.querySelector("#r160").textContent = JSON.stringify([pixels.length, pixels[2], pixels[4], pixels[7], 99, -4]);
</script>
