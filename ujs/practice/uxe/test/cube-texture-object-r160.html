<!doctype html>
<meta charset="utf-8">
<pre id="r160">pending</pre>
<script type="module">
import { CubeTexture, REVISION } from "../../web/game/three.module.js";
if (REVISION !== "160") throw new Error("three.js revision mismatch");
const images = Array.from({length:6},(_,face)=>({width:1,height:1,data:new Uint8Array([10+face,0,0,255])}));
const source = new CubeTexture(images), clone = source.clone();
document.querySelector("#r160").textContent = JSON.stringify([
  clone.images[0].data[0],clone.images[5].data[0],Number(source.source === clone.source),-1,-1,
]);
</script>
