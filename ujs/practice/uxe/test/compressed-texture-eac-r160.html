<!doctype html>
<meta charset="utf-8">
<pre id="r160">pending</pre>
<script type="module">
import { CompressedTexture, REVISION } from "../../web/game/three.module.js";
if (REVISION !== "160") throw Error("r160 revision");
// WebGL ETC extension enums. r160 stores these raw values in the descriptor.
const formats=[0x9270,0x9271,0x9272,0x9273];
for(let i=0;i<formats.length;i++) {
  const mip={data:new Uint8Array(i<2?8:16),width:3,height:3};
  const texture=new CompressedTexture([mip],3,3,formats[i]);
  if(texture.format!==formats[i] || texture.mipmaps[0]!==mip || texture.generateMipmaps) throw Error("EAC mip");
  texture.dispose();
}
const sample=(base,scale,delta,signed)=>{
  const value=base*8+(signed?0:4)+delta*(scale?scale*8:1);
  return Math.max(signed?-1023:0,Math.min(signed?1023:2047,value)) & 65535;
};
document.querySelector("#r160").textContent=JSON.stringify([
  3*3*2,sample(103,2,-1,false),sample(103,2,-10,false),sample(103,2,-1,false),
  sample(103,0,-10,false),sample(0,2,-10,false),sample(255,2,9,false),
  sample(-127,2,-1,true),sample(-127,0,-1,true),sample(0,2,0,true),
  sample(20,0,0,false),sample(-1,0,0,true),-1,-1,-2,-3,
]);
</script>
