<!doctype html>
<meta charset="utf-8">
<pre id="r160">pending</pre>
<script type="module">
import { Color, REVISION, SpotLight, SpotLightHelper, Vector3 } from "../../web/game/three.module.js";
if(REVISION!=="160") throw new Error("three.js revision mismatch");
const light=new SpotLight(new Color().setRGB(0.25,0,0),1,8,Math.PI/4);
light.position.set(1,0,0);
light.target.position.set(4,0,4);
const helper=new SpotLightHelper(light);
const position=helper.cone.geometry.attributes.position;
const forward=helper.cone.getWorldDirection(new Vector3());
const values=[position.count,position.array[9],position.array[28],position.array[30],position.array[34],
  position.array[220],forward.x,forward.z,helper.cone.scale.x,helper.cone.material.color.r];
light.distance=0;
light.angle=0;
helper.color=new Color().setRGB(0,0.75,0);
helper.update();
values.push(helper.cone.scale.z,helper.cone.scale.x,helper.cone.material.color.g);
let released=0;
helper.cone.geometry.addEventListener("dispose",()=>released++);
helper.cone.material.addEventListener("dispose",()=>released++);
helper.dispose();
document.querySelector("#r160").textContent=JSON.stringify([...values,released===2?0:1,-1,-1]);
</script>
