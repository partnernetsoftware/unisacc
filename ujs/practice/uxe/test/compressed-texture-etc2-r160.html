<!doctype html>
<meta charset="utf-8">
<pre id="r160">pending</pre>
<script type="module">
import { CompressedTexture, RGB_ETC2_Format, RGBA_ETC2_EAC_Format, REVISION } from "../../web/game/three.module.js";
if(REVISION!=="160" || RGB_ETC2_Format!==37492 || RGBA_ETC2_EAC_Format!==37496) throw Error("ETC2 enums");
for(const [format,bytes] of [[RGB_ETC2_Format,8],[RGBA_ETC2_EAC_Format,16]]) {
  const mip={data:new Uint8Array(bytes),width:4,height:4};
  const texture=new CompressedTexture([mip],4,4,format);
  if(texture.format!==format || texture.mipmaps[0]!==mip) throw Error("ETC2 descriptor");
  texture.dispose();
}
// Decoded texels from Khronos section 22, including the T, H and planar examples.
const pixels=[[19,36,53,255],[150,150,249,255],[221,17,136,255],[100,236,253,255],
  [253,49,168,255],[189,0,104,255],[48,129,251,255],[250,112,124,255],
  [0,0,0,0],[148,148,247,255],[0,0,0,0],[19,36,53,83],[19,36,53,103]];
const packed=pixels.map(([r,g,b,a])=>r+256*g+65536*b+16777216*a);
document.querySelector("#r160").textContent=JSON.stringify([...packed,-1,-3]);
</script>
