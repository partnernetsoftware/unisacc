<!doctype html>
<meta charset="utf-8">
<pre id="r160">pending</pre>
<script type="module">
import { BufferGeometry, Float32BufferAttribute, Points, Raycaster, REVISION, Vector3 } from "../../web/game/three.module.js";
if (REVISION !== "160") throw new Error("three.js revision mismatch");
const geometry = new BufferGeometry();
geometry.setAttribute("position",new Float32BufferAttribute([0.125,0,-5,0.25,0,-2,0.75,0,-3,-0.25,0,-2],3));
geometry.setIndex([3,1,0,2]);
const points = new Points(geometry);
points.scale.set(2,1,1);
points.position.x = 1;
points.updateMatrixWorld();
const ray = new Raycaster(new Vector3(1,0,0),new Vector3(0,0,-1),0,10);
ray.params.Points.threshold = 0.4;
const hits = ray.intersectObject(points);
geometry.setDrawRange(2,4);
const draw = ray.intersectObject(points);
geometry.setDrawRange(0,4);
points.layers.set(1);
const hidden = ray.intersectObject(points);
points.layers.set(0);
ray.near = 3;
const far = ray.intersectObject(points);
ray.near = 0;
geometry.setIndex(null);
const linear = ray.intersectObject(points);
document.querySelector("#r160").textContent = JSON.stringify([
  hits.length,hits[0].index,hits[1].index,hits[0].distanceToRay,hits[0].point.x,hits[2].distance,
  draw.length,hidden.length,far.length,linear[0].index,77,-2,-1,
]);
</script>
