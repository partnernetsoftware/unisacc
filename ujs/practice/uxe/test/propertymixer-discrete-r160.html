<!doctype html>
<meta charset="utf-8">
<pre id="r160">pending</pre>
<script type="module">
import { PropertyMixer, REVISION } from "../../web/game/three.module.js";
if (REVISION !== "160") throw new Error("three.js revision mismatch");
const names = ["original", "first", "second"];
function result(type, samples, secondFrame=false) {
  const values = type === "bool" ? [false,true] : names;
  let value = values[0];
  const binding = {
    getValue(buffer, offset) { buffer[offset] = value; },
    setValue(buffer, offset) { value = buffer[offset]; },
  };
  const mixer = new PropertyMixer(binding, type, 1);
  mixer.saveOriginalState();
  for (const [index,weight,additive] of samples) {
    mixer.buffer[0] = values[index];
    if (additive) mixer.accumulateAdditive(weight);
    else mixer.accumulate(0,weight);
  }
  mixer.apply(0);
  if (secondFrame) mixer.apply(1);
  return values.indexOf(value);
}
document.querySelector("#r160").textContent = JSON.stringify([
  result("bool",[[1,.5]]), result("bool",[[1,.51]]), result("string",[[1,.5],[2,.5]]),
  result("string",[[1,1],[2,.49,true]]), result("string",[[2,.5,true]]), result("bool",[[1,1]],true), -2,
]);
</script>
