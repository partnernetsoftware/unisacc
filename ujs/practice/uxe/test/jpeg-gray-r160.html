<!doctype html>
<meta charset="utf-8">
<pre id="r160">pending</pre>
<script type="module">
import { ImageLoader, REVISION } from "../../web/game/three.module.js";
if (REVISION !== "160") throw new Error("three.js revision mismatch");
const file = Uint8Array.from([
  255, 216, 255, 219, 0, 67, 0, ...Array(64).fill(1),
  255, 192, 0, 11, 8, 0, 3, 0, 5, 1, 1, 17, 0,
  255, 196, 0, 39, 0, 1, ...Array(15).fill(0), 7, 16, 1, 1, ...Array(14).fill(0), 6, 0,
  255, 218, 0, 8, 1, 1, 0, 0, 63, 0, 64, 65, 127, 255, 217,
]);
const url = URL.createObjectURL(new Blob([file], { type: "image/jpeg" }));
const image = await new ImageLoader().loadAsync(url);
URL.revokeObjectURL(url);
const canvas = document.createElement("canvas");
canvas.width = image.naturalWidth;
canvas.height = image.naturalHeight;
const context = canvas.getContext("2d");
context.drawImage(image, 0, 0);
const rgba = context.getImageData(0, 0, 5, 3).data;
document.querySelector("#r160").textContent = JSON.stringify([rgba.length, rgba[0], rgba[56], rgba[59], -6, -6, 79, -1]);
</script>
