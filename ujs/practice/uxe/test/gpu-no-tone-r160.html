<!doctype html>
<meta charset="utf-8">
<pre id="r160">pending</pre>
<script type="module">
import {Mesh, MeshBasicMaterial, LinearSRGBColorSpace, NoToneMapping, OrthographicCamera,
  PlaneGeometry, Scene, WebGLRenderTarget, WebGLRenderer, FloatType, REVISION} from "../../web/game/three.module.js";
if(REVISION!=="160"||NoToneMapping!==0) throw new Error("three.js revision mismatch");
const canvas=document.createElement("canvas");
const gl=canvas.getContext("webgl2",{antialias:false});
if(!gl) throw new Error("WebGL2 unavailable");
const renderer=new WebGLRenderer({canvas,context:gl});
const target=new WebGLRenderTarget(1,1);
renderer.setSize(1,1);
renderer.setRenderTarget(target);
renderer.outputColorSpace=LinearSRGBColorSpace;
renderer.toneMapping=NoToneMapping;
const camera=new OrthographicCamera(-1,1,1,-1,0.1,10);
camera.position.z=1;
const scene=new Scene();
const material=new MeshBasicMaterial();
material.color.setRGB(0.25,0.5,0.125);
scene.add(new Mesh(new PlaneGeometry(2,2),material));
const pixel=(exposure,channel)=>{
  renderer.toneMappingExposure=exposure;
  renderer.render(scene,camera);
  const value=new Uint8Array(4);
  renderer.readRenderTargetPixels(target,0,0,1,1,value);
  return value[channel];
};
material.color.r=0.25;
const channels=[pixel(2,0),pixel(0,1)];
if(!gl.getExtension("EXT_color_buffer_float")) throw new Error("floating color target unavailable");
const hdr=new WebGLRenderTarget(1,1,{type:FloatType});
renderer.setRenderTarget(hdr);
material.color.r=2;
renderer.render(scene,camera);
const value=new Float32Array(4);
renderer.readRenderTargetPixels(hdr,0,0,1,1,value);
channels.push(value[0]);
document.querySelector("#r160").textContent=JSON.stringify(channels);
</script>
