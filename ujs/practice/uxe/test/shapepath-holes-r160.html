<!doctype html>
<meta charset="utf-8">
<pre id="r160">pending</pre>
<script type="module">
import { Path, REVISION, ShapePath, Vector2 } from "../../web/game/three.module.js";
if (REVISION !== "160") throw new Error("three.js revision mismatch");
const make = pairs => new Path(pairs.map(([x,y]) => new Vector2(x,y))).closePath();
const left = make([[0,0],[0,6],[6,0]]);
const right = make([[10,0],[10,6],[16,0]]);
const hole = make([[1,1],[2,1],[1,2]]);
const next = make([[11,1],[12,1],[11,2]]);
const group = paths => {
  const shape = new ShapePath();
  shape.subPaths = paths;
  return shape.toShapes(false);
};
const solidFirst = group([left,right,hole,next]);
const holesFirst = group([hole,left,next,right]);
const ambiguous = group([left,left,hole,next]);
document.querySelector("#r160").textContent = JSON.stringify([
  solidFirst.length, solidFirst[0].holes.length, Number(solidFirst[1].holes[0] === next),
  Number(holesFirst[1].holes[0] === next), ambiguous[1].holes.length,
]);
</script>
