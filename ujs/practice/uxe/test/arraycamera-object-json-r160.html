<!doctype html>
<meta charset="utf-8">
<pre id="r160">pending</pre>
<script type="module">
import { ArrayCamera, ObjectLoader, PerspectiveCamera, REVISION } from "../../web/game/three.module.js";
if(REVISION!=="160") throw Error("revision");
const registry=[new PerspectiveCamera(),new PerspectiveCamera()];
const source=new ArrayCamera([registry[1],registry[0]]);
const saved=source.toJSON();
if(saved.object.type!=="PerspectiveCamera" || "cameras" in saved.object) throw Error("r160 inherited JSON");
const restored=new ObjectLoader().parse(saved);
document.querySelector("#r160").textContent=JSON.stringify([
  source.cameras.length,...source.cameras.map(camera=>401+registry.indexOf(camera)),restored.fov,-2,
]);
</script>
