<!doctype html>
<meta charset="utf-8">
<pre id="r160">pending</pre>
<script type="module">
import { Color, ColorManagement, NoColorSpace, LinearTransfer, SRGBTransfer,
  Rec709Primaries, P3Primaries, LinearDisplayP3ColorSpace, LinearSRGBColorSpace,
  SRGBColorSpace, REVISION } from "../../web/game/three.module.js";
if(REVISION!=="160") throw new Error("three.js revision mismatch");
const transfer=new Map([[LinearTransfer,LinearSRGBColorSpace],[SRGBTransfer,SRGBColorSpace]]);
const primaries=new Map([[Rec709Primaries,LinearSRGBColorSpace],[P3Primaries,LinearDisplayP3ColorSpace]]);
const decode=(tag)=>{
  const source=transfer.get(tag);
  if(ColorManagement.getTransfer(source)!==tag) throw new Error("transfer mismatch");
  return ColorManagement.convert(new Color().setRGB(0.02,0,0),source,LinearSRGBColorSpace).r;
};
const convert=(source,dest)=>{
  if(!primaries.has(source)||!primaries.has(dest)) return -2;
  if(ColorManagement.getPrimaries(primaries.get(source))!==source) throw new Error("primaries mismatch");
  return ColorManagement.convert(new Color().setRGB(0.2,0.4,0.8),primaries.get(source),primaries.get(dest)).r;
};
document.querySelector("#r160").textContent=JSON.stringify([
  ColorManagement.convert(new Color().setRGB(0.2,0.4,0.8),NoColorSpace,LinearDisplayP3ColorSpace).r,
  decode(LinearTransfer),decode(SRGBTransfer),convert(Rec709Primaries,P3Primaries),
  convert(P3Primaries,Rec709Primaries),convert(SRGBTransfer,Rec709Primaries)
]);
</script>
