<!DOCTYPE html>
<html><head><meta charset="utf-8"/><title>T1B</title></head>
<body>
<canvas id="c" width="64" height="64"></canvas>
<pre id="hud"></pre>
<script type="module">
import { createWebGLRenderer } from "../renderer-webgl.js";
import { Scene, PerspectiveCamera } from "../scene.js";
import { applyTestScene } from "./test-init.js";
import { MESH_POINTS } from "../meshes.js";
(async()=>{
  const rgba=new Uint8ClampedArray(4*4*4);
  for(let j=0;j<4;j++) for(let i=0;i<4;i++){
    const o=(j*4+i)*4, on=((i+j)&1)?255:0;
    rgba[o]=on; rgba[o+1]=0; rgba[o+2]=0; rgba[o+3]=255;
  }
  const canvas=document.getElementById("c");
  const r=createWebGLRenderer(canvas,{antialias:false});
  const scene=new Scene();
  applyTestScene(scene,[0,0,0,1]);
  scene.fog.density=0;
  const cloud=scene.instances("q",1,[1,1,1]);
  cloud.meshId=MESH_POINTS; cloud.count=1; cloud.screenSpace=1; cloud.flags=8; cloud.alphaMode=1;
  cloud.mapId=1; cloud.xyz=new Float32Array([32,32,0]);
  cloud.scale=new Float32Array([64]); cloud.scaleY=new Float32Array([64]);
  const cam=new PerspectiveCamera(1,0.05,40);
  const p=new Uint8Array(4);
  const gl=()=>canvas.getContext("webgl");
  r.render(scene,cam,[{id:1,w:4,h:4,rgba,filter:0}]);
  gl().readPixels(16,64-1-16,1,1,gl().RGBA,gl().UNSIGNED_BYTE,p);
  const n=[p[0],p[1],p[2]];
  r.render(scene,cam,[{id:1,w:4,h:4,rgba,filter:1}]);
  gl().readPixels(16,64-1-16,1,1,gl().RGBA,gl().UNSIGNED_BYTE,p);
  const lin=[p[0],p[1],p[2]];
  document.getElementById("hud").textContent=JSON.stringify({n,lin});
  document.title="T1B_PENDING";
})().catch(e=>{document.title="T1B_ERR";});
</script>
</body></html>
