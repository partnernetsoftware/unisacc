<!doctype html>
<meta charset="utf-8">
<pre id="r160">pending</pre>
<script type="module">
import { ArrayCamera, PerspectiveCamera, REVISION } from "../../web/game/three.module.js";
if (REVISION !== "160") throw new Error("three.js revision mismatch");
const left = new PerspectiveCamera(), right = new PerspectiveCamera();
left.userData.probe = 19;
right.userData.probe = 31;
const inputs = [left, right];
const camera = new ArrayCamera(inputs);
const values = [camera.cameras.length, camera.cameras[0].userData.probe,
  camera.cameras[1].userData.probe, camera.cameras[2]?.userData.probe ?? -1];
inputs[0] = right;
values.push(camera.cameras[0].userData.probe, new ArrayCamera().cameras.length);
document.querySelector("#r160").textContent = JSON.stringify(values);
</script>
