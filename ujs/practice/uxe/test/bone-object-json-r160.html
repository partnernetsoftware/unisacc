<!doctype html>
<meta charset="utf-8">
<pre id="r160">pending</pre>
<script type="module">
import { Bone, ObjectLoader, REVISION, Scene } from "../../web/game/three.module.js";
if (REVISION !== "160") throw new Error("three.js revision mismatch");
const source = new Bone();
source.position.x = 3;
source.visible = false;
source.layers.set(3);
source.updateMatrixWorld();
const loaded = new ObjectLoader().parse(source.toJSON());
const child = new Bone();
source.add(child);
const clone = source.clone();
const scene = new Scene();
scene.add(source,clone);
clone.removeFromParent();
document.querySelector("#r160").textContent = JSON.stringify([
  loaded.position.x,Number(loaded.visible),loaded.layers.mask,
  Number(clone !== source && clone.isBone && clone.children[0] !== child && clone.children[0].isBone),
  Number(clone.parent === null && source.parent === scene),-2,
]);
</script>
