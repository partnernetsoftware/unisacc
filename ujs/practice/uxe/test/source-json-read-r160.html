<!doctype html>
<meta charset="utf-8">
<pre id="r160">pending</pre>
<script type="module">
import { DataTexture, Source, REVISION } from "../../web/game/three.module.js";
if (REVISION !== "160") throw Error("r160 revision mismatch");
const texture = new DataTexture(new Uint8Array([7,255]), 2, 1);
const source = new Source(texture.image);
source.uuid = "asset";
const serialized = source.toJSON();
const typed = serialized.url;
let digest = 0;
for (const byte of new TextEncoder().encode(JSON.stringify(serialized))) digest = (digest * 131 + byte) % 16777213;
const image = new Image();
image.src = "data:,x";
const uri = new Source(image).toJSON().url;
const empty = new Source(null).toJSON().url;
document.querySelector("#r160").textContent = JSON.stringify([typed.width,typed.data[1],uri.length,uri.charCodeAt(6),empty.length,-67,digest]);
</script>
