<!doctype html>
<meta charset="utf-8">
<pre id="r160">pending</pre>
<script type="module">
import { BasicDepthPacking, RGBADepthPacking, REVISION, WebGLRenderer, WebGLRenderTarget,
  PlaneGeometry, Mesh, MeshDepthMaterial, Scene, OrthographicCamera } from "../../web/game/three.module.js";
if (REVISION !== "160") throw new Error("three.js revision mismatch");
const canvas=document.createElement("canvas");
const context=canvas.getContext("webgl2");
if(!context) throw new Error("WebGL2 unavailable");
const renderer=new WebGLRenderer({canvas,context});
const target=new WebGLRenderTarget(1,1);
renderer.setRenderTarget(target);
const camera=new OrthographicCamera(-1,1,1,-1,0,1);
camera.position.z=1;
const scene=new Scene();
const geometry=new PlaneGeometry(2,2);
function sample(depthPacking,depth,opacity) {
  const material=new MeshDepthMaterial({depthPacking,opacity});
  const mesh=new Mesh(geometry,material);
  mesh.position.z=1-depth;
  scene.add(mesh);
  renderer.render(scene,camera);
  const pixel=new Uint8Array(4);
  renderer.readRenderTargetPixels(target,0,0,1,1,pixel);
  scene.remove(mesh);
  material.dispose();
  return pixel.reduceRight((word,byte)=>word*256+byte,0);
}
document.querySelector("#r160").textContent=JSON.stringify([
  sample(BasicDepthPacking,0.25,0.25),
  sample(RGBADepthPacking,0.25,0.25),
  sample(RGBADepthPacking,0.312744140625,1),
  sample(BasicDepthPacking,0.75,1),
]);
geometry.dispose();
target.dispose();
renderer.dispose();
</script>
