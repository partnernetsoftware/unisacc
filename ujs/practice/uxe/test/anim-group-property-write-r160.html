<!doctype html>
<meta charset="utf-8">
<pre id="r160">pending</pre>
<script type="module">
import { AnimationObjectGroup, Object3D, PropertyBinding, REVISION } from "../../web/game/three.module.js";
const status=document.querySelector("#r160");
try {
  if(REVISION!=="160") throw new Error("Three.js revision");
  function scene() {
    const a=new Object3D(), b=new Object3D(), c=new Object3D();
    a.position.set(1,1,0);
    b.position.y=2;
    c.position.y=3;
    const group=new AnimationObjectGroup(a,b,c);
    group.remove(b);
    const y=PropertyBinding.create(group,".position[y]");
    const scale=PropertyBinding.create(group,".scale");
    return {a,b,c,group,y,scale};
  }
  const first=scene();
  first.y.setValue([7],0);
  const resumed=scene();
  resumed.group.add(resumed.b);
  resumed.y.setValue([7],0);
  const uncached=scene();
  uncached.group.uncache(uncached.c);
  uncached.y.setValue([7],0);
  const vector=scene();
  vector.scale.setValue([2,3,4],0);
  const empty=scene();
  empty.group.remove(empty.a,empty.c);
  empty.y.setValue([7],0);
  status.textContent=JSON.stringify([
    first.group.stats.objects.inUse,first.a.position.y,first.b.position.y,first.c.position.y,first.a.position.x,
    Number(first.a.matrixWorldNeedsUpdate),Number(first.b.matrixWorldNeedsUpdate),
    resumed.group.stats.objects.inUse,resumed.b.position.y,uncached.group.stats.objects.inUse,uncached.c.position.y,
    vector.c.scale.z,vector.b.scale.z,-1,1,1,2,1,-1,-1,-1,empty.group.stats.objects.inUse,-1,
  ]);
} catch(error) {
  status.textContent=`error:${error.message}`;
}
</script>
