<!doctype html>
<meta charset="utf-8">
<pre id="r160">pending</pre>
<script type="module">
import { Color, PolarGridHelper, REVISION } from "../../web/game/three.module.js";
if(REVISION!=="160") throw new Error("three.js revision mismatch");
const first=new Color().setRGB(0.25,0,0);
const second=new Color().setRGB(0.75,0,0);
const helper=new PolarGridHelper(4,4,2,4,first,second);
const pos=helper.geometry.attributes.position;
const colors=helper.geometry.attributes.color;
const noSectors=new PolarGridHelper(4,1,1,4);
const noRings=new PolarGridHelper(4,4,1,0);
let released=0;
helper.geometry.addEventListener("dispose",()=>released++);
helper.material.addEventListener("dispose",()=>released++);
helper.dispose();
document.querySelector("#r160").textContent=JSON.stringify([
  pos.count,pos.getZ(1),pos.getX(3),pos.getZ(5),pos.getX(7),colors.getX(0),colors.getX(3),
  pos.getZ(8),pos.getZ(9),pos.getZ(16),colors.getX(16),
  noSectors.geometry.attributes.position.count,noRings.geometry.attributes.position.count,
  released===2?0:1,-1,-1,
]);
</script>
