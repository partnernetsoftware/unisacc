<!doctype html>
<meta charset="utf-8">
<pre id="r160">pending</pre>
<script type="module">
import { ShapeUtils, Vector2, REVISION } from "../../web/game/three.module.js";
if (REVISION !== "160") throw new Error("three.js revision mismatch");
const contour = [[0, 0], [2, 0], [2, 2], [1, 1], [0, 2]].map(p => new Vector2(...p));
const triangles = ShapeUtils.triangulateShape(contour, []).flat();
document.querySelector("#r160").textContent = JSON.stringify([
  ShapeUtils.area(contour), Number(ShapeUtils.isClockWise(contour)), triangles.length, ...triangles
]);
</script>
