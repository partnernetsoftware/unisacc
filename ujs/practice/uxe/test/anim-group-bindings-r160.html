<!doctype html>
<meta charset="utf-8">
<pre id="r160">pending</pre>
<script type="module">
import { AnimationObjectGroup, Object3D, PropertyBinding, REVISION } from "../../web/game/three.module.js";

const output = document.querySelector("#r160");
try {
  if (REVISION !== "160") throw new Error("three.js revision mismatch");
  const query = new URLSearchParams(location.search);
  const bytes = await (await fetch("file://" + query.get("wasm"))).arrayBuffer();
  const actual = (await WebAssembly.instantiate(bytes)).instance.exports;
  const status = actual.uxe_anim_subscriptions(BigInt(query.get("mode")));
  if (status !== 0n) throw new Error("subscription probe failed " + status);
  const samples = new Uint32Array(actual.memory.buffer, 2097152 + 1024, 24);

  const [a,b,c,d,e] = Array.from({ length: 5 }, () => new Object3D());
  const group = new AnimationObjectGroup(a,b,c);
  const subscribe = path => group.subscribe_(path, PropertyBinding.parseTrackName(path));
  const binding = (view, node) => view?.[group._objects.indexOf(node)];
  const active = node => Number(group._objects.indexOf(node) >= group.nCachedObjects_);
  const values = [];
  group.remove(b);
  const position = subscribe(".position"), scale = subscribe(".scale");
  const same = subscribe(".position") === position;
  const initialA = binding(position, a), initialC = binding(position, c);
  values.push(Number(same), Number(initialA?.rootNode === a), Number(!!binding(position, b)),
    Number(initialC?.rootNode === c), Number(position !== scale), group.stats.bindingsPerObject);
  group.add(b);
  values.push(active(b), Number(binding(position, b)?.rootNode === b));
  group.remove(a);
  values.push(active(a), Number(binding(position, a) === initialA));
  group.add(a);
  values.push(Number(binding(position, a) === initialA));
  group.uncache(b);
  values.push(Number(!binding(position, b)), position.length, Number(binding(position, c) === initialC));
  group.add(d);
  values.push(Number(binding(position, d)?.rootNode === d));
  group.unsubscribe_(".scale");
  values.push(group.stats.bindingsPerObject);
  group.add(e);
  values.push(scale.length, position.length, Number(!scale.some(item => item?.rootNode === e)),
    Number(binding(position, e)?.rootNode === e), Number(subscribe(".position") === position));
  const again = subscribe(".scale");
  values.push(Number(!!again && again !== scale), scale.length, Number(binding(again, e)?.rootNode === e));
  output.textContent = JSON.stringify([...samples, ...values]);
} catch (error) {
  output.textContent = "error:" + error.message;
}
</script>
