<!doctype html>
<meta charset="utf-8">
<pre id="r160">pending</pre>
<script type="module">
import { ImageLoader, REVISION } from "../../web/game/three.module.js";
if (REVISION !== "160") throw new Error("three.js revision mismatch");
const canvas = document.createElement("canvas");
canvas.width = 17;
canvas.height = 9;
const context = canvas.getContext("2d");
context.fillStyle = "rgb(204,68,119)";
context.fillRect(0, 0, canvas.width, canvas.height);
const url = canvas.toDataURL("image/jpeg", 0.8);
const image = await new ImageLoader().loadAsync(url);
context.drawImage(image, 0, 0);
const rgba = context.getImageData(0, 0, canvas.width, canvas.height).data;
const near = (actual, expected) => Number(Math.abs(actual - expected) <= 3);
document.querySelector("#r160").textContent = JSON.stringify([
  Number(url.startsWith("data:image/jpeg;base64,")), image.naturalWidth, image.naturalHeight, rgba.length,
  near(rgba[0], 204), near(rgba[609], 68), near(rgba[610], 119), -1, 99, -1, -1, rgba[611],
]);
</script>
