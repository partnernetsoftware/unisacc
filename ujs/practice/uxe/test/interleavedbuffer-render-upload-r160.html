<!doctype html>
<meta charset="utf-8">
<pre id="r160">pending</pre>
<script type="module">
import { BufferGeometry, Camera, InterleavedBuffer, InterleavedBufferAttribute, Mesh,
  MeshBasicMaterial, REVISION, Scene, WebGLRenderer } from "../../web/game/three.module.js";
const status=document.querySelector("#r160");
try {
  if(REVISION!=="160") throw new Error("Three.js revision");
  const query=new URLSearchParams(location.search);
  const initial=[-.5,-.5,0,.5,-.5,0,0,.5,0];
  const source=new InterleavedBuffer(new Float32Array(initial),3);
  const material=new MeshBasicMaterial();
  const ref=[], actual=[];
  let rendered;
  const reference=[1,2].map(id=>{
    const renderer=new WebGLRenderer({antialias:false});
    renderer.setSize(16,16);
    const gl=renderer.getContext();
    const state={ id, count:0, renderer, gl, scene:new Scene(), camera:new Camera() };
    for(const name of ["bufferData","bufferSubData"]) {
      const transfer=gl[name].bind(gl);
      gl[name]=(...args)=>{
        transfer(...args);
        if(args.includes(source.array)) state.count++;
      };
    }
    return state;
  });
  function makeGeometry(state) {
    const geometry=new BufferGeometry();
    geometry.setAttribute("position",new InterleavedBufferAttribute(source,3,0));
    geometry.setAttribute("normal",new InterleavedBufferAttribute(source,3,0));
    state.scene.clear();
    state.scene.add(new Mesh(geometry,material));
    state.geometry=geometry;
  }
  function draw(state) {
    rendered=state;
    state.renderer.render(state.scene,state.camera);
  }
  const record=token=>function() {
    ref.push(rendered.id,token,rendered.count,Number(this===source));
  };
  const [a,b]=reference;
  makeGeometry(a);
  makeGeometry(b);
  draw(a);
  draw(a);
  source.onUpload(record(91));
  draw(b);
  draw(a);
  source.onUpload(record(92));
  draw(b);
  source.array[0]=-.25;
  source.needsUpdate=true;
  draw(a);
  draw(b);
  draw(a);
  a.geometry.dispose();
  makeGeometry(a);
  draw(a);
  draw(b);

  const bytes=await (await fetch("file://"+query.get("wasm"))).arrayBuffer();
  const contexts=[1,2].map(id=>{
    const gl=document.createElement("canvas").getContext("webgl2");
    if(!gl) throw new Error("WebGL2 unavailable");
    return { id, gl, generation:0, count:0, buffer:null };
  });
  let wasm, active, fail=false, rejected=0;
  const imports={
    host_ib_transfer(key,generation,ptr,length,usage,allocate) {
      const state=contexts[Number(key)-1];
      const {gl}=state;
      const epoch=Number(generation);
      if(allocate===1n && !state.buffer && epoch>state.generation) {
        state.buffer=gl.createBuffer();
        state.generation=epoch;
      }
      if(!state.buffer || state.generation!==epoch) throw new Error("resource generation");
      const data=new Uint8Array(wasm.memory.buffer,Number(ptr),Number(length));
      gl.bindBuffer(gl.ARRAY_BUFFER,state.buffer);
      if(fail) {
        fail=false;
        gl.bufferSubData(gl.ARRAY_BUFFER,Number(length),data);
        if(gl.getError()!==gl.INVALID_VALUE) throw new Error("expected GL_INVALID_VALUE");
        rejected++;
        return 0n;
      }
      if(allocate===1n) gl.bufferData(gl.ARRAY_BUFFER,data,Number(usage));
      else gl.bufferSubData(gl.ARRAY_BUFFER,0,data);
      if(gl.getError()!==gl.NO_ERROR) throw new Error("WebGL2 transfer");
      active=state;
      state.count++;
      return 1n;
    },
    host_ib_callback(token,buffer) {
      actual.push(active.id,Number(token),active.count,Number(buffer===32n));
      return 1n;
    },
    host_ib_delete(key,generation) {
      const state=contexts[Number(key)-1];
      if(!state.buffer || state.generation!==Number(generation)) return 0n;
      state.gl.deleteBuffer(state.buffer);
      state.buffer=null;
      return 1n;
    }
  };
  wasm=new WebAssembly.Instance(new WebAssembly.Module(bytes),{uxe_ib_v1:imports}).exports;
  const run=(op,x=0)=>Number(wasm.uxe_ib_probe(BigInt(op),BigInt(x),query.has("mutate")?1n:0n));
  const lifecycle=[];
  if(run(0)!==1) throw new Error("initialization");
  lifecycle.push(run(1,1),run(1,1),run(2,91),run(1,2),run(1,1),run(2,92),run(1,2));
  lifecycle.push(run(3));
  fail=true;
  lifecycle.push(run(1,1),run(1,1),run(1,2),run(1,1),run(4,1),run(1,1),run(5,2),run(1,1),run(1,2));
  if(actual.length!==ref.length) throw new Error("callback count actual="+actual.length/4+" r160="+ref.length/4);
  for(let i=0;i<ref.length;i++) {
    if(actual[i]!==ref[i]) throw new Error("callback trace case="+i+" actual="+actual[i]+" r160="+ref[i]);
  }
  const samples=contexts.map(({gl,buffer})=>{
    const out=new Float32Array(1);
    gl.bindBuffer(gl.ARRAY_BUFFER,buffer);
    gl.getBufferSubData(gl.ARRAY_BUFFER,0,out);
    if(gl.getError()!==gl.NO_ERROR) throw new Error("WebGL2 readback");
    return out[0];
  });
  lifecycle.push(rejected,...samples);
  for(const state of reference) {
    state.geometry.dispose();
    state.renderer.dispose();
  }
  material.dispose();
  lifecycle.push(run(4,1),run(4,2));
  status.textContent=JSON.stringify([...actual,...lifecycle]);
} catch(error) {
  status.textContent="error:"+error.message;
}
</script>
