<!doctype html>
<meta charset="utf-8">
<pre id="r160">pending</pre>
<script type="module">
import { Group, ObjectLoader, REVISION, Scene } from "../../web/game/three.module.js";
if (REVISION !== "160") throw new Error("three.js revision mismatch");
const original = new Scene();
original.position.x = 5;
original.scale.set(2,3,4);
const model = new Group();
model.matrixAutoUpdate = false;
model.matrix.makeTranslation(4,0,0);
original.add(model);
original.updateMatrixWorld(true);
const root = new ObjectLoader().parse(original.toJSON());
const child = root.children[0];
root.updateMatrixWorld(true);
document.querySelector("#r160").textContent = JSON.stringify([
  root.position.x,root.scale.y,child.position.x,child.matrix.elements[12],child.matrixWorld.elements[12],
  child.matrixWorld.elements[10],root.matrixWorld.elements[12],-2,
]);
</script>
