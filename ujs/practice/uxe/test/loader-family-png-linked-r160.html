<!doctype html>
<meta charset="utf-8">
<pre id="r160">pending</pre>
<script type="module">
import { ImageLoader, REVISION } from "../../web/game/three.module.js";

const output=document.querySelector("#r160");
const query=new URLSearchParams(location.search);
const dir="file://"+query.get("dir")+"/";
const binary=async url=>(await fetch(url)).arrayBuffer();

async function reference() {
  const loader=new ImageLoader().setPath(dir);
  const image=await loader.loadAsync("image.png");
  const canvas=document.createElement("canvas");
  canvas.width=image.width;
  canvas.height=image.height;
  const context=canvas.getContext("2d");
  context.drawImage(image,0,0);
  const pixel=context.getImageData(0,0,1,1).data;
  const rejected=await loader.loadAsync("bad.png").then(()=>0,()=>1);
  return [image.width,image.height,...pixel,rejected];
}

async function product() {
  const [baseModule,probeModule]=await Promise.all([
    WebAssembly.compile(await binary(dir+"base.wasm")),
    WebAssembly.compile(await binary(dir+"probe.wasm")),
  ]);
  const imports=WebAssembly.Module.imports(probeModule);
  if(imports.length!==1 || imports[0].module!=="uxe_png_loader_v1" ||
    imports[0].name!=="uxe_png_dispatch" || imports[0].kind!=="function") throw new Error("probe import");
  const base=await WebAssembly.instantiate(baseModule);
  const dispatch=base.exports.uxe_png_dispatch;
  const probe=await WebAssembly.instantiate(probeModule,{
    uxe_png_loader_v1:{uxe_png_dispatch:dispatch},
  });
  const call=(op,a=0,b=0,c=0)=>Number(probe.exports.uxe_png_probe(BigInt(op),BigInt(a),BigInt(b),BigInt(c)));
  if(base.exports.uxe_abi_version()!==1 || probe.exports.uxe_abi_version()!==1 ||
    base.exports.memory===probe.exports.memory || call(0)!==128) throw new Error("linked loader ABI");
  const memory=new Uint8Array(base.exports.memory.buffer,Number(dispatch(0n,1n,0n,0n)),16384);
  const view=new DataView(memory.buffer,memory.byteOffset,memory.byteLength);
  const encoder=new TextEncoder(),decoder=new TextDecoder();
  const path=encoder.encode(dir);
  memory.set(path,256);

  function begin(filename) {
    const name=encoder.encode(filename);
    memory.set(name,512);
    const id=call(1,path.length,name.length);
    const at=view.getUint32(1152,true);
    const size=view.getUint32(1156,true);
    const url=decoder.decode(memory.subarray(at,at+size));
    if(url!==dir+filename) throw new Error("loader path");
    return {
      id,
      async receive() {
        const response=await fetch(url);
        const bytes=new Uint8Array(await response.arrayBuffer());
        if(bytes.length>2048) throw new Error("fixture exceeds probe capacity");
        memory.set(bytes,4096);
        return call(2,id,response.status,bytes.length);
      },
    };
  }

  const first=begin("image.png"), early=call(3,first.id);
  const received=await first.receive();
  const alias=call(3,first.id,1), decoded=call(3,first.id);
  const invalidRelease=call(5,first.id);
  const mutate=Number(query.get("mutate")==="1");
  const pixels=[];
  for(let field=0;field<7;field++) pixels.push(call(4,field,mutate));
  const bad=begin("bad.png");
  const stale=call(2,first.id,200,73);
  await bad.receive();
  const failed=call(3,bad.id);
  const retained=[call(4,0),call(4,3)];
  const again=begin("image.png");
  await again.receive();
  return [first.id,early,received,alias,decoded,...pixels,invalidRelease,bad.id,stale,
    failed,...retained,again.id,call(3,again.id)];
}

try {
  if(REVISION!=="160") throw new Error("three.js revision mismatch");
  output.textContent=JSON.stringify([...await reference(),...await product()]);
} catch(error) {
  output.textContent="error:"+error.message;
}
</script>
