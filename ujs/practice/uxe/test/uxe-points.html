<!DOCTYPE html>
<html lang="zh"><head>
<meta charset="utf-8"/><title>uxe-points</title>
</head><body>
<canvas id="c" width="64" height="64"></canvas>
<pre id="hud"></pre>
<script type="module">
import { createWebGLRenderer } from "../renderer-webgl.js";
import { Scene, PerspectiveCamera } from "../scene.js";
import { MESH_POINTS } from "../meshes.js";
import { applyTestScene } from "./test-init.js";
(async()=>{
  const hud=document.getElementById("hud");
  try{
    const canvas=document.getElementById("c");
    const r=createWebGLRenderer(canvas);
    const scene=new Scene();
    applyTestScene(scene,[0,0,0,1]);
    const n=16;
    const cloud=scene.instances("p",n,[1,0,0]);

    cloud.meshId=MESH_POINTS;
    cloud.count=n;
    cloud.billboard=1;
    cloud.alphaMode=1;
    cloud.emissive=[0,0,0];
    cloud.instColor=new Uint8Array(n*4);
    for(let i=0;i<n;i++){
      const x=(i%4-1.5)*1.6, y=(1.5-((i/4)|0))*1.6;
      cloud.set(i,x,y,0,0.8);
      if(i&1){ cloud.instColor[i*4]=0; cloud.instColor[i*4+1]=220; cloud.instColor[i*4+2]=40; cloud.instColor[i*4+3]=255; }
      else { cloud.instColor[i*4]=220; cloud.instColor[i*4+1]=10; cloud.instColor[i*4+2]=30; cloud.instColor[i*4+3]=255; }
    }

    const cam=new PerspectiveCamera(1.0,0.05,40);
    cam.setEye(0,0,8); cam.setTarget(0,0,0);
    r.render(scene,cam,[]);
    const gl=canvas.getContext("webgl");
    const px=new Uint8Array(4);
    const probes=[];
    const d=8.0, half=0.5463024898437905, W=64.0, H=64.0;
    for(let i=0;i<n;i++){
      const x=(i%4-1.5)*1.6, y=(1.5-((i/4)|0))*1.6;
      const x_ndc=(x/d)/half, y_ndc=(y/d)/half;
      const sx=(x_ndc*0.5+0.5)*W|0;
      const sy=(1-(y_ndc*0.5+0.5))*H|0;
      gl.readPixels(sx,H-1-sy,1,1,gl.RGBA,gl.UNSIGNED_BYTE,px);
      probes.push([sx,sy,px[0],px[1],px[2],px[3]]);
    }
    hud.textContent=JSON.stringify({n:n,probes:probes});
    document.title="POINTS_FAIL";
  }catch(e){
    document.title="POINTS_ERR";
    hud.textContent=String(e&&e.message||e);
  }
})();
</script>
</body></html>
