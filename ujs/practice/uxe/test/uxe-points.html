<!DOCTYPE html>
<html lang="zh"><head>
<meta charset="utf-8"/><title>uxe-points</title>
</head><body>
<canvas id="c" width="64" height="64"></canvas>
<pre id="hud"></pre>
<script type="module">
import { createWebGLRenderer } from "../renderer-webgl.js";
import { Scene, PerspectiveCamera } from "../scene.js";
import { MESH_POINTS } from "../meshes.js";
(async()=>{
  const hud=document.getElementById("hud");
  try{
    const canvas=document.getElementById("c");
    const r=createWebGLRenderer(canvas);
    const scene=new Scene();
    scene.clearColor=[0,0,0,1];
    scene.fog={density:0,color:[0,0,0]};
    scene.ambient={color:[0,0,0],intensity:0};
    scene.lights=[];
    const n=16;
    const cloud=scene.instances("p",n,[1,0,0]);
    cloud.meshId=MESH_POINTS;
    cloud.count=n;
    cloud.billboard=1;
    cloud.alphaMode=1;
    cloud.emissive=[1,0,0];

    cloud.billboard=1;
    cloud.alphaMode=1;
    for(let i=0;i<n;i++){
      const x=(i%4-1.5)*1.2, z=(((i/4)|0)-1.5)*1.2;
      cloud.set(i,x,0,z,0.4);
    }
    const cam=new PerspectiveCamera(1.0,0.05,40);
    cam.setEye(0,2,6); cam.setTarget(0,0,0);
    r.render(scene,cam,[]);
    const gl=canvas.getContext("webgl");
    const px=new Uint8Array(4);
    const probes=[];
    for(let i=0;i<n;i++){
      const sx=8+((i%4)*16), sy=8+(((i/4)|0)*16);
      gl.readPixels(sx,64-1-sy,1,1,gl.RGBA,gl.UNSIGNED_BYTE,px);
      probes.push([px[0],px[1],px[2],px[3]]);
    }
    hud.textContent=JSON.stringify({n:n,probes:probes});
    document.title="POINTS_FAIL";
  }catch(e){
    document.title="POINTS_ERR";
    hud.textContent=String(e&&e.message||e);
  }
})();
</script>
</body></html>
