<!doctype html>
<meta charset="utf-8">
<pre id="r160">pending</pre>
<script type="importmap">{"imports":{"three":"../../web/game/three.module.js"}}</script>
<script type="module">
import {DataTexture,Mesh,OrthographicCamera,PerspectiveCamera,PlaneGeometry,REVISION,Scene,Vector2,WebGLRenderer,WebGLRenderTarget} from "three";
const output=document.querySelector("#r160");
try {
  if (REVISION !== "160") throw new Error("three.js revision mismatch");
  const root=new URLSearchParams(location.search).get("package");
  const {OutlinePass}=await import(`file://${root}/examples/jsm/postprocessing/OutlinePass.js`);
  const canvas=document.createElement("canvas");
  const context=canvas.getContext("webgl2");
  if (!context) throw new Error("WebGL2 required");
  const renderer=new WebGLRenderer({canvas,context});
  const target=new WebGLRenderTarget(1,1);
  const data=new Uint8Array(4);
  const texture=new DataTexture(data,1,1);
  const geometry=new PlaneGeometry(4,4);
  const results=[];
  for (const [kind, distances] of [[0,[2,4,4.5,6,6.5,8]],[1,[1.2,1.5,1.7,2.1,2.9,3.5]]]) {
    const camera=kind?new PerspectiveCamera(40,1,1,9):new OrthographicCamera(-1,1,1,-1,1,9);
    camera.updateMatrixWorld();
    const scene=new Scene();
    const pass=new OutlinePass(new Vector2(1,1),scene,camera,[]);
    pass.updateTextureMatrix();
    const material=pass.prepareMaskMaterial;
    material.uniforms.cameraNearFar.value.set(1,9);
    material.uniforms.depthTexture.value=texture;
    material.uniforms.textureMatrix.value=pass.textureMatrix;
    const plane=new Mesh(geometry,material);
    scene.add(plane);
    renderer.setRenderTarget(target);
    for (let i=0;i<distances.length;i++) {
      data.set([0,0,0,64*(1+Math.floor(i/2))]);
      texture.needsUpdate=true;
      plane.position.z=-distances[i];
      renderer.render(scene,camera);
      const rgba=new Uint8Array(4);
      renderer.readRenderTargetPixels(target,0,0,1,1,rgba);
      results.push(new DataView(rgba.buffer).getUint32(0,true));
    }
    pass.dispose();
  }
  renderer.setRenderTarget(null);
  geometry.dispose();
  texture.dispose();
  target.dispose();
  renderer.dispose();
  output.textContent=JSON.stringify([...results,-1,-1,-1,-1]);
} catch(error) {
  output.textContent=`error:${error.message}`;
}
</script>
