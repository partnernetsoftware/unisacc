<!doctype html>
<meta charset="utf-8">
<pre id="r160">pending</pre>
<script type="module">
import { Group, Mesh, Scene, REVISION } from "../../web/game/three.module.js";
if (REVISION !== "160") throw new Error("three.js revision mismatch");
const root = new Scene(), group = new Group();
const first = new Mesh(), hidden = new Mesh(), last = new Mesh();
for (const [mesh, record] of [[first, 2600], [hidden, 2640], [last, 2680]]) mesh.userData.record = record;
root.add(last, group, first);
group.add(hidden);
const collect = () => {
  const rows = [];
  root.traverseVisible(node => { if (node.isMesh && node.userData.record) rows.push(node.userData.record); });
  return rows;
};
group.visible = false;
const before = collect();
group.visible = true;
const revealed = collect();
group.visible = false;
delete last.userData.record;
document.querySelector("#r160").textContent = JSON.stringify([before.length, ...before, revealed[1], collect().length, -1]);
</script>
