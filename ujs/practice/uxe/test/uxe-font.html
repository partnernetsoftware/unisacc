<!DOCTYPE html>
<html lang="zh"><head>
<meta charset="utf-8"/><title>FONT_PENDING</title>
</head><body>
<canvas id="c" width="80" height="28"></canvas>
<pre id="hud"></pre>
<script type="module">
import { createWebGLRenderer } from "../renderer-webgl.js";
import { Scene, PerspectiveCamera } from "../scene.js";
import { MESH_POINTS } from "../meshes.js";

import { applyTestScene } from "./test-init.js";
import { FONT, FONT_W, FONT_H } from "../font5x7.js";
(async()=>{
  const hud=document.getElementById("hud");
  try{
    const s=4, str="A1I0", n=str.length, tw=FONT_W*n, th=FONT_H;
    const W=tw*s, H=th*s;
    const canvas=document.getElementById("c");
    canvas.width=W; canvas.height=H;
    const r=createWebGLRenderer(canvas,{antialias:false});
    const xs=[], ys=[], sc=[];
    for(let gi=0;gi<n;gi++){
      const cols=FONT[str[gi]];
      if(!cols) continue;
      for(let x=0;x<FONT_W;x++){
        const bits=cols[x]|0;
        for(let y=0;y<FONT_H;y++){
          if(!((bits>>y)&1)) continue;
          xs.push(gi*FONT_W*s + x*s + s/2);
          ys.push(y*s + s/2);
          sc.push(s);
        }
      }
    }
    const cnt=xs.length;
    const scene=new Scene();
    applyTestScene(scene,[0,0,0,1]);
    const cloud=scene.instances("g",cnt,[1,1,1]);
    cloud.meshId=MESH_POINTS;

    cloud.count=cnt;
    cloud.screenSpace=1;
    cloud.flags=8;
    cloud.xyz=new Float32Array(cnt*3);
    cloud.scale=new Float32Array(sc);
    for(let i=0;i<cnt;i++){ cloud.xyz[i*3]=xs[i]; cloud.xyz[i*3+1]=ys[i]; cloud.xyz[i*3+2]=0; }
    const cam=new PerspectiveCamera(1.0,0.05,40);
    r.render(scene,cam,[]);
    const gl=canvas.getContext("webgl");
    const pix=new Uint8Array(4);
    const bits=[];
    let on=0;
    for(let y=0;y<th;y++) for(let x=0;x<tw;x++){
      const sx=x*s+s/2|0, sy=y*s+s/2|0;
      gl.readPixels(sx,H-1-sy,1,1,gl.RGBA,gl.UNSIGNED_BYTE,pix);
      const b=pix[0]>127?1:0;
      bits.push(b); on+=b;
    }
    hud.textContent=JSON.stringify({w:tw,h:th,s:s,str:str,on:on,nInst:cnt,bits:bits});
    document.title="FONT_PENDING";
  }catch(e){
    document.title="FONT_ERR";
    hud.textContent=String(e&&e.message||e);
  }
})();
</script>
</body></html>
