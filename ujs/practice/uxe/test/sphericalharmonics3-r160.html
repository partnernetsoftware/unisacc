<!doctype html>
<meta charset="utf-8">
<pre id="r160">pending</pre>
<script type="module">
import { SphericalHarmonics3 as SH, Vector3, REVISION } from "../../web/game/three.module.js";
if (REVISION !== "160") throw new Error("three.js revision mismatch");
const a=new SH(), b=new SH(), z=new Vector3(0,0,1), out=()=>new Vector3();
a.coefficients[0].x=2;
a.coefficients[2].x=3;
a.coefficients[6].x=5;
b.coefficients[0].x=6;
const basis=[];
SH.getBasisAt(z,basis);
document.querySelector("#r160").textContent=JSON.stringify([
  new SH().set(a.coefficients).coefficients[6].x,a.clone().zero().coefficients[6].x,
  a.getAt(z,out()).x,a.getIrradianceAt(z,out()).x,
  a.clone().add(b).coefficients[0].x,a.clone().addScaledSH(b,0.5).coefficients[0].x,
  a.clone().scale(2).coefficients[0].x,a.clone().lerp(b,0.25).coefficients[0].x,
  Number(a.equals(a.clone())),Number(a.equals(b)),
  new SH().copy(a).coefficients[2].x,a.clone().coefficients[2].x,
  new SH().fromArray([0,...a.toArray()],1).coefficients[0].x,a.toArray([],2)[20],basis[6]
]);
</script>
