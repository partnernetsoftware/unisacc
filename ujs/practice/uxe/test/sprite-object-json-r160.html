<!doctype html>
<meta charset="utf-8">
<pre id="r160">pending</pre>
<script type="module">
import {ObjectLoader, REVISION, Scene, Sprite, SpriteMaterial}
  from "../../web/game/three.module.js";
if (REVISION !== "160") throw new Error("three.js revision mismatch");
const material = new SpriteMaterial();
material.uuid = "m";
const source = new Sprite(material);
source.position.x = 2;
source.visible = false;
source.center.set(0.25,0.75);
source.updateMatrixWorld();
const json = source.toJSON();
const loaded = new ObjectLoader().parse(json);
const cloned = source.clone();
const scene = new Scene();
scene.add(source,cloned);
source.removeFromParent();
document.querySelector("#r160").textContent = JSON.stringify([
  loaded.position.x, Number(loaded.visible),
  Number(!("geometry" in json.object) && loaded.center.x === 0.5 && loaded.center.y === 0.5),
  loaded.material.uuid === "m" ? 19 : 0, -2,
  Number(source.parent === null && cloned.parent === scene && cloned.material === material &&
    cloned.center !== source.center && cloned.center.x === 0.25 && cloned.center.y === 0.75),
]);
</script>
