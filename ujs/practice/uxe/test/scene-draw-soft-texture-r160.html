<!doctype html>
<meta charset="utf-8">
<pre id="r160">pending</pre>
<script type="module">
import * as THREE from "../../web/game/three.module.js";
if (THREE.REVISION !== "160") throw new Error("three.js revision mismatch");
const canvas = document.createElement("canvas");
const renderer = new THREE.WebGLRenderer({canvas, alpha:true, premultipliedAlpha:false, preserveDrawingBuffer:true});
renderer.setSize(4,4,false);
renderer.setClearColor(0xff0000,1);
const scene = new THREE.Scene();
const geometry = new THREE.BufferGeometry();
geometry.setAttribute("position",new THREE.Float32BufferAttribute([-1,1,1, .25,.25,.25, -1,-1,1],3));
geometry.setAttribute("uv",new THREE.Float32BufferAttribute([0,0, 1,0, 0,0],2));
const texture = new THREE.DataTexture(new Uint8Array([255,0,0,255, 0,0,255,128]),2,1);
texture.needsUpdate = true;
const material = new THREE.RawShaderMaterial({
  uniforms:{ map:{value:texture} },
  vertexShader:"attribute vec3 position; attribute vec2 uv; varying vec2 coord; void main(){coord=uv; gl_Position=vec4(position.xy,0.,position.z);}",
  fragmentShader:"precision highp float; uniform sampler2D map; varying vec2 coord; void main(){gl_FragColor=texture2D(map,coord);}",
  side:THREE.DoubleSide, transparent:true, depthWrite:false
});
const mesh = new THREE.Mesh(geometry,material);
mesh.frustumCulled = false;
scene.add(mesh);
const camera = new THREE.Camera();
renderer.render(scene,camera);
function pixel(x) {
  const gl=renderer.getContext(), values=new Uint8Array(4);
  gl.readPixels(x,3,1,1,gl.RGBA,gl.UNSIGNED_BYTE,values);
  return values;
}
const left=pixel(0), middle=pixel(1);
material.transparent=false;
material.depthWrite=true;
material.needsUpdate=true;
renderer.render(scene,camera);
const opaque=pixel(1);
document.querySelector("#r160").textContent = JSON.stringify([
  +(left[0]===255 && left[2]===0), +(middle[0]===127 && middle[2]===128), 0.75,
  +(opaque[0]===0 && opaque[2]===255 && opaque[3]===128), 1, 1
]);
</script>
