<!doctype html>
<meta charset="utf-8">
<pre id="r160">pending</pre>
<script type="module">
import { Color, Fog, REVISION } from "../../web/game/three.module.js";
if (REVISION !== "160") throw new Error("three.js revision mismatch");
const source = new Color(0x804008);
const defaults = new Fog(source);
const fog = new Fog(source, 2, 10);
fog.name = "ridge";
const clone = fog.clone();
source.setHex(0);
fog.color.setHex(0xff0000);
const json = fog.toJSON();
const values = [
  defaults.near, defaults.far, clone.name.length, clone.color.getHex(), clone.near, clone.far,
  Number(json.type === "Fog"), json.name.length, ...Array.from(json.name, c => c.charCodeAt(0)), json.color, json.near, json.far,
];
document.querySelector("#r160").textContent = JSON.stringify(values);
</script>
