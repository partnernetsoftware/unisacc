<!doctype html>
<meta charset="utf-8">
<pre id="wasm-cases">pending</pre>
<script>
const status = document.querySelector("#wasm-cases");
let selected = -1;
try {
  const parameters = new URLSearchParams(location.search);
  const count = Number(parameters.get("count"));
  const mutate = parameters.get("mutate") === "1";
  const request = new XMLHttpRequest();
  request.open("GET","probe.wasm",false);
  request.overrideMimeType("text/plain; charset=x-user-defined");
  request.send();
  const bytes = Uint8Array.from(request.responseText, character => character.charCodeAt(0) & 255);
  const module = new WebAssembly.Module(bytes);
  const results = [];
  for (let index=0; index<count; index++) {
    selected = index;
    const { exports: wasm } = new WebAssembly.Instance(module);
    results.push(wasm.uxe_evaluate_case(BigInt(mutate && index === 12 ? 64 : index)));
  }
  status.textContent = JSON.stringify(results);
} catch (error) {
  status.textContent = `error:case ${selected}: ${error.message}`;
}
</script>
