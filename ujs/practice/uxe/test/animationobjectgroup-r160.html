<!doctype html>
<meta charset="utf-8">
<pre id="r160">pending</pre>
<script type="module">
import { AnimationObjectGroup, Object3D, REVISION } from "../../web/game/three.module.js";
if (REVISION !== "160") throw new Error("three.js revision mismatch");
const a = new Object3D(), b = new Object3D();
const group = new AnimationObjectGroup(a, b);
group.add(a);
const total = group.stats.objects.total;
group.remove(a);
const after = [group.stats.objects.inUse, group.stats.objects.total];
group.add(a);
const again = group.stats.objects.inUse;
group.uncache(a);
document.querySelector("#r160").textContent = JSON.stringify([total, ...after, again, group.stats.objects.total, -2]);
</script>
