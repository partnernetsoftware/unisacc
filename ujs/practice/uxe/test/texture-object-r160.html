<!doctype html>
<meta charset="utf-8">
<pre id="r160">pending</pre>
<script type="module">
import { REVISION, Texture } from "../../web/game/three.module.js";
if (REVISION !== "160") throw new Error("three.js revision mismatch");
const source = new Texture({width:1,height:1});
const clone = source.clone();
const previous = clone.version;
clone.needsUpdate = true;
let release = 0;
clone.addEventListener("dispose",()=>{ release++; });
clone.dispose();
document.querySelector("#r160").textContent = JSON.stringify([
  Number(source !== clone && source.source === clone.source),
  clone.version - previous,source.version,release,-2,-1,
]);
</script>
