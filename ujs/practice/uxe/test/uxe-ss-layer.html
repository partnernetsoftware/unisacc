<!DOCTYPE html>
<html><head><meta charset="utf-8"/><title>SSL</title></head>
<body>
<canvas id="c" width="256" height="256"></canvas>
<pre id="hud"></pre>
<script type="module">
import { createWebGLRenderer } from "../renderer-webgl.js";
import { Scene, PerspectiveCamera } from "../scene.js";
import { applyTestScene } from "./test-init.js";
import { MESH_POINTS } from "../meshes.js";
function tex(r,g,b,a){
  const rgba=new Uint8ClampedArray(8*8*4);
  for(let i=0;i<64;i++){ rgba[i*4]=r; rgba[i*4+1]=g; rgba[i*4+2]=b; rgba[i*4+3]=a; }
  return rgba;
}
function quad(scene,name,id,layer,rgb){
  const c=scene.instances(name,1,[1,1,1]);
  c.meshId=MESH_POINTS; c.count=1; c.screenSpace=1; c.flags=8; c.alphaMode=1;
  c.mapId=id; c.layer=layer;
  c.xyz=new Float32Array([128,128,0]);
  c.scale=new Float32Array([80]);
  c.scaleY=new Float32Array([80]);
  return c;
}
(async()=>{
  const canvas=document.getElementById("c");
  const r=createWebGLRenderer(canvas,{antialias:false});
  const scene=new Scene();
  applyTestScene(scene,[0,0,0,1]);
  scene.fog.density=0;
  quad(scene,"a",1,0); quad(scene,"b",2,1); quad(scene,"c",3,2);
  const texs=[
    {id:1,w:8,h:8,rgba:tex(255,0,0,128)},
    {id:2,w:8,h:8,rgba:tex(0,255,0,128)},
    {id:3,w:8,h:8,rgba:tex(0,0,255,128)}
  ];
  const cam=new PerspectiveCamera(1,0.05,40);
  r.render(scene,cam,texs);
  const gl=canvas.getContext("webgl");
  const p=new Uint8Array(4);
  gl.readPixels(128,256-1-128,1,1,gl.RGBA,gl.UNSIGNED_BYTE,p);
  const o1=[p[0],p[1],p[2]];
  scene.get("a").layer=2; scene.get("c").layer=0;
  r.render(scene,cam,texs);
  gl.readPixels(128,256-1-128,1,1,gl.RGBA,gl.UNSIGNED_BYTE,p);
  const o2=[p[0],p[1],p[2]];
  document.getElementById("hud").textContent=JSON.stringify({o1,o2});
  document.title="SSL_OK";
})().catch(e=>{document.title="SSL_ERR"; document.getElementById("hud").textContent=String(e);});
</script>
</body></html>
