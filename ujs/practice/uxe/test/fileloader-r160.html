<!doctype html>
<meta charset="utf-8">
<pre id="r160">pending</pre>
<script type="module">
import { FileLoader, LoadingManager, REVISION } from "../../web/game/three.module.js";
if (REVISION !== "160") throw new Error("three.js revision mismatch");
const data = new Uint8Array(await new FileLoader().setResponseType("arraybuffer").loadAsync("data:application/octet-stream;base64,QUJD"));
const events = [];
const manager = new LoadingManager(() => events.push(4), () => events.push(2), () => events.push(3));
const invalid = URL.createObjectURL(new Blob([data]));
URL.revokeObjectURL(invalid);
try { await new FileLoader(manager).loadAsync(invalid); throw new Error("expected rejection"); } catch (error) {
  if (error.message === "expected rejection") throw error;
}
await new Promise(resolve => setTimeout(resolve, 0));
document.querySelector("#r160").textContent = JSON.stringify([data[0], data.length, events[0], events[2], -1, -1, 0]);
</script>
