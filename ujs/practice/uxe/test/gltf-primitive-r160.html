<meta charset="utf-8">
<pre id="r160">pending</pre>
<script type="module">
import { BufferGeometry, Float32BufferAttribute, REVISION } from "../../web/game/three.module.js";
if (REVISION !== "160") throw new Error("three.js revision mismatch");
const geometry = new BufferGeometry();
geometry.setAttribute("position", new Float32BufferAttribute([0, 0, 0, 1.25, 0, 0, 0, 2.5, 0], 3));
geometry.setIndex([0, 2, 1]);
geometry.addGroup(0, 3, 2);
const position = geometry.getAttribute("position");
const indices = geometry.getIndex();
document.querySelector("#r160").textContent = JSON.stringify([
  position.count, indices.count, geometry.groups[0].materialIndex, indices.getX(1), position.getY(2), -5, 777, -2,
]);
</script>
