<!doctype html>
<meta charset="utf-8">
<pre id="r160">pending</pre>
<script type="module">
import { LineCurve3, Vector3, REVISION } from "../../web/game/three.module.js";
if (REVISION !== "160") throw new Error("three.js revision mismatch");
const curve = new LineCurve3(new Vector3(1, 2, 3), new Vector3(3, 5, 9));
const point = curve.getPoint(0.25), end = curve.getPointAt(1), tangent = curve.getTangent(0.5);
const points = curve.getPoints(4), spaced = curve.getSpacedPoints(4), lengths = curve.getLengths(4);
document.querySelector("#r160").textContent = JSON.stringify([
  point.x, point.y, end.x, curve.getLength(), tangent.x, tangent.y,
  points.length, points[2].z, spaced[1].z, lengths[3], curve.getTangentAt(0.5).z, -1
]);
</script>
