<!doctype html>
<meta charset="utf-8">
<pre id="r160">pending</pre>
<script type="module">
import { BufferGeometry, Float32BufferAttribute, Mesh, MeshBasicMaterial, Camera, REVISION, Scene, WebGLRenderer }
  from "../../web/game/three.module.js";
const output=document.querySelector("#r160");
try {
  if(REVISION!=="160") throw new Error("three.js revision mismatch");
  const renderer=new WebGLRenderer({preserveDrawingBuffer:true});
  renderer.setSize(16,16);
  const scene=new Scene();
  const camera=new Camera();
  const geometry=new BufferGeometry().setAttribute("position",new Float32BufferAttribute([
    -0.25,-0.5,0,0.25,-0.5,0,0,0.5,0,
  ],3));
  const mesh=new Mesh(geometry,new MeshBasicMaterial({color:0x00ff00}));
  mesh.position.x=0.55;
  scene.add(mesh);
  const context=renderer.getContext();
  const sample=x=>{
    const value=new Uint8Array(4);
    context.readPixels(x,7,1,1,context.RGBA,context.UNSIGNED_BYTE,value);
    return new DataView(value.buffer).getUint32(0,true);
  };
  renderer.render(scene,camera);
  const left=sample(3);
  const right=sample(12);
  const back=new Mesh(geometry,new MeshBasicMaterial({color:0xff0000}));
  back.position.set(0.55,0,0.5);
  scene.add(back);
  renderer.render(scene,camera);
  output.textContent=JSON.stringify([left,right,0.5,1,sample(12),1]);
  geometry.dispose();
  mesh.material.dispose();
  back.material.dispose();
  renderer.dispose();
} catch(error) { output.textContent=`error:${error.message}`; }
</script>
