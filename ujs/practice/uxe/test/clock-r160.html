<!doctype html>
<meta charset="utf-8">
<pre id="r160">pending</pre>
<script type="module">
import { Clock, REVISION } from "../../web/game/three.module.js";
if (REVISION !== "160") throw new Error("three.js revision mismatch");
let time=10000;
Object.defineProperty(performance,"now",{ value:()=>time });
const clock=new Clock();
const values=[Number(clock.running),clock.getDelta(),clock.startTime/1000];
time=10500;values.push(clock.getDelta());
time=11250;values.push(clock.getElapsedTime());
time=11500;clock.stop();values.push(clock.elapsedTime,Number(clock.running),Number(clock.autoStart));
time=12000;values.push(clock.getDelta());
clock.start();values.push(clock.elapsedTime,clock.oldTime/1000);
time=12500;values.push(clock.getElapsedTime(),new Clock(false).getDelta());
document.querySelector("#r160").textContent=JSON.stringify(values);
</script>
