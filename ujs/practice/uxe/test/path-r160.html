<!doctype html>
<meta charset="utf-8">
<pre id="r160">pending</pre>
<script type="module">
import { Path, REVISION } from "../../web/game/three.module.js";
if (REVISION !== "160") throw new Error("three.js revision mismatch");
const path = new Path();
path.moveTo(0, 0); path.lineTo(2, 0); path.quadraticCurveTo(3, 2, 4, 0);
path.bezierCurveTo(4, 2, 6, 2, 6, 0); path.closePath();
const p = path.getPoints(2);
document.querySelector("#r160").textContent = JSON.stringify([p.length, p[1].x,
  p[2].x, p[2].y, p[4].x, p[4].y, p[6].x]);
</script>
