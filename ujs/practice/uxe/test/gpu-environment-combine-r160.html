<!doctype html>
<meta charset="utf-8">
<pre id="r160">pending</pre>
<script type="module">
import { AddOperation, CubeTexture, DataTexture, Mesh, MeshBasicMaterial, MixOperation,
  MultiplyOperation, OrthographicCamera, PlaneGeometry, REVISION, Scene, WebGLRenderer, WebGLRenderTarget
} from "../../web/game/three.module.js";
if(REVISION!=="160") throw new Error("three.js revision mismatch");
const canvas=document.createElement("canvas");
const context=canvas.getContext("webgl2");
const renderer=new WebGLRenderer({canvas,context});
const target=new WebGLRenderTarget(1,1);
renderer.setRenderTarget(target);
const faces=Array.from({length:6},()=>new DataTexture(new Uint8Array([128,64,192,255]),1,1));
const environment=new CubeTexture(faces);
environment.needsUpdate=true;
const material=new MeshBasicMaterial({envMap:environment,reflectivity:0.5,toneMapped:false});
material.color.setRGB(0.25,0.5,0.625);
const geometry=new PlaneGeometry(2,2);
const scene=new Scene();
scene.add(new Mesh(geometry,material));
const camera=new OrthographicCamera(-1,1,1,-1,0,10);
camera.position.z=1;
const pixel=new Uint8Array(4);
const values=[];
for(const combine of [MultiplyOperation,MixOperation,AddOperation]) {
  material.combine=combine;
  material.needsUpdate=true;
  renderer.render(scene,camera);
  renderer.readRenderTargetPixels(target,0,0,1,1,pixel);
  values.push(pixel[0]+256*pixel[1]+65536*pixel[2]);
}
document.querySelector("#r160").textContent=JSON.stringify(values);
environment.dispose();
for(const face of faces) face.dispose();
material.dispose();
geometry.dispose();
target.dispose();
renderer.dispose();
</script>
