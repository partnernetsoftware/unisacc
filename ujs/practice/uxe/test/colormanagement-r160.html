<!doctype html>
<meta charset="utf-8">
<pre id="r160">pending</pre>
<script type="module">
import { Color, ColorManagement as cm, DisplayP3ColorSpace as p3, LinearDisplayP3ColorSpace as lp3,
  LinearSRGBColorSpace as linear, SRGBColorSpace as srgb, NoColorSpace as none, REVISION } from "../../web/game/three.module.js";
if (REVISION !== "160") throw new Error("three.js revision mismatch");
const red=()=>new Color().setRGB(1,0,0);
const gray=()=>new Color().setRGB(0.5,0.5,0.5);
const values=[Number(cm.enabled),Number(cm.workingColorSpace===linear),
  cm.convert(red(),linear,lp3).b,cm.convert(red(),lp3,linear).g,
  cm.convert(gray(),srgb,linear).r,cm.convert(gray(),linear,srgb).r,
  cm.convert(red(),p3,p3).r,cm.convert(red(),none,p3).r,
  Number(cm.getPrimaries(p3)!==cm.getPrimaries(srgb)),
  Number(cm.getTransfer(none)===cm.getTransfer(linear))];
cm.workingColorSpace=lp3;
values.push(cm.fromWorkingColorSpace(red(),linear).r,cm.toWorkingColorSpace(red(),linear).r);
try { cm.workingColorSpace=srgb; values.push(0); } catch { values.push(-1); }
cm.enabled=false;
values.push(cm.convert(red(),lp3,linear).r);
document.querySelector("#r160").textContent=JSON.stringify(values);
</script>
