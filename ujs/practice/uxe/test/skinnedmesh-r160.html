<!doctype html>
<meta charset="utf-8">
<pre id="r160">pending</pre>
<script type="module">
import { Bone, BufferGeometry, Float32BufferAttribute, Matrix4, Skeleton, SkinnedMesh, Uint16BufferAttribute, Vector3, REVISION } from "../../web/game/three.module.js";
if (REVISION !== "160") throw new Error("three.js revision mismatch");
const a = new Bone(), b = new Bone();
const skeleton = new Skeleton([a,b]);
a.matrixWorld.makeTranslation(4,0,0);
b.matrixWorld.makeTranslation(0,8,0);
skeleton.update();
const geometry = new BufferGeometry();
geometry.setAttribute("skinIndex", new Uint16BufferAttribute([0,1,0,0],4));
geometry.setAttribute("skinWeight", new Float32BufferAttribute([0.25,0.75,0,0],4));
const mesh = new SkinnedMesh(geometry);
mesh.bind(skeleton,new Matrix4().makeScale(2,1,1));
const point = mesh.applyBoneTransform(0,new Vector3(1,2,3));
document.querySelector("#r160").textContent = JSON.stringify([
  point.x,point.y,point.z,mesh.bindMatrixInverse.elements[0],-1
]);
</script>
