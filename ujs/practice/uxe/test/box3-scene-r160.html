<!doctype html>
<meta charset="utf-8">
<pre id="r160">pending</pre>
<script type="module">
import { Box3, BufferGeometry, Float32BufferAttribute, Group, Mesh, Vector3, REVISION } from "../../web/game/three.module.js";
if (REVISION !== "160") throw new Error("three.js revision mismatch");
const g=new Group();
const triangle=new BufferGeometry();
triangle.setAttribute("position",new Float32BufferAttribute([0,0,0,2,0,0,0,2,0],3));
const a=new Mesh(triangle);
a.rotation.z=Math.PI/4;
g.add(a);
const points=new BufferGeometry();
points.setAttribute("position",new Float32BufferAttribute([0,0,0,1,1,1],3));
points.computeBoundingBox();
const b=new Mesh(points);
b.position.x=5;
g.add(b);
const coarse=new Box3().setFromObject(g);
const precise=new Box3().setFromObject(g,true);
const empty=new Box3().setFromObject(new Group());
const initial=new Box3(new Vector3(-10,-10,-10),new Vector3(0,0,0));
initial.expandByObject(g,true);
document.querySelector("#r160").textContent=JSON.stringify([
  coarse.max.y,precise.max.y,coarse.max.x,precise.min.x,initial.min.x,
  Number(empty.isEmpty()),Number(precise.containsBox(empty))
]);
</script>
