<!doctype html>
<meta charset="utf-8">
<pre id="r160">pending</pre>
<script type="importmap">{"imports":{"three":"../../web/game/three.module.js"}}</script>
<script type="module">
import { DataTexture, NearestFilter, NoBlending, REVISION, WebGLRenderer, WebGLRenderTarget } from "three";
import { createGpuSubmit } from "../base/gpu-host-abi.js";
import { createGpuNativeSample } from "../base/gpu-native-sample-abi.js";

const output = document.querySelector("#r160");
try {
  if (REVISION !== "160") throw new Error("three.js revision mismatch");
  const query = new URLSearchParams(location.search);
  const root = query.get("package");
  const addon = path => import("file://" + root + "/examples/jsm/" + path + ".js");
  const [{ EffectComposer }, { ShaderPass }, { CopyShader }, { ColorCorrectionShader }] = await Promise.all([
    addon("postprocessing/EffectComposer"), addon("postprocessing/ShaderPass"),
    addon("shaders/CopyShader"), addon("shaders/ColorCorrectionShader"),
  ]);
  const width = 3, height = 2, bytes = width * height * 4;
  function context() {
    const canvas = document.createElement("canvas");
    canvas.width = width;
    canvas.height = height;
    const gl = canvas.getContext("webgl2", { alpha: true, premultipliedAlpha: false, preserveDrawingBuffer: true });
    if (!gl) throw new Error("WebGL2 required");
    return { canvas, gl };
  }
  function sample(rgba) {
    const view = new DataView(rgba.buffer, rgba.byteOffset, rgba.byteLength);
    return [view.getUint32(0, true), view.getUint32(12, true)];
  }
  function screen(gl) {
    const rgba = new Uint8Array(bytes);
    gl.readPixels(0, 0, width, height, gl.RGBA, gl.UNSIGNED_BYTE, rgba);
    return sample(rgba);
  }
  const { gl } = context();
  const [binary, ...resources] = await Promise.all([
    fetch("file://" + query.get("wasm")),
    fetch("../base/gpu-native-copy.vert"),
    fetch("../base/gpu-native-color-correction.frag"),
    fetch("../base/gpu-native-copy.frag"),
  ]);
  let actual;
  let reads = 0, uploads = 0, draws = 0;
  function track(key, observe) {
    const prior = gl[key];
    gl[key] = function (...args) {
      observe();
      return prior.apply(gl, args);
    };
  }
  track("readPixels", () => reads++);
  track("texImage2D", () => uploads++);
  track("drawArrays", () => draws++);
  const native = createGpuNativeSample(gl, () => 1, () => actual.memory);
  const copy = (...args) => {
    const beforeRead = reads, beforeUpload = uploads;
    const status = native.copy(...args);
    if (beforeRead !== reads || beforeUpload !== uploads) throw new Error("native route transferred pixels through CPU");
    return status;
  };
  const submit = createGpuSubmit(gl, () => actual.memory, () => 1, native.targets);
  actual = (await WebAssembly.instantiate(await binary.arrayBuffer(), {
    uxe_gpu_v1: { host_gpu_submit: submit },
    uxe_gpu_target_v1: { host_gpu_native_copy: copy },
  })).instance.exports;
  const lengths = [];
  for (const [i, response] of resources.entries()) {
    const data = new Uint8Array(await response.arrayBuffer());
    if (!response.ok || !data.length || data.length > 4096) throw new Error("invalid shader resource");
    new Uint8Array(actual.memory.buffer, 2097152 + 10000 + 4500 * i, data.length).set(data);
    lengths.push(BigInt(data.length));
  }
  const wasmPixels = at => new Uint8Array(actual.memory.buffer, 2097152 + at, bytes);
  const ref = context();
  const renderer = new WebGLRenderer({ canvas: ref.canvas, context: ref.gl });
  renderer.setSize(width, height, false);
  function reference(toScreen) {
    const target = new WebGLRenderTarget(width, height, { minFilter: NearestFilter, magFilter: NearestFilter });
    const composer = new EffectComposer(renderer, target);
    composer.renderToScreen = toScreen;
    const original = composer.readBuffer;
    const pixels = new Uint8Array(bytes);
    for (let i = 0; i < 6; i++) pixels.set(i < 3 ? [64,128,255,37] : [0,1,16,41], i * 4);
    const texture = new DataTexture(pixels, width, height);
    texture.needsUpdate = true;
    const seed = new ShaderPass(CopyShader);
    const color = new ShaderPass(ColorCorrectionShader);
    const present = new ShaderPass(CopyShader);
    for (const pass of [seed,color,present]) pass.material.blending = NoBlending;
    seed.render(renderer, original, { texture });
    composer.addPass(color);
    composer.addPass(present);
    composer.render(0);
    renderer.setRenderTarget(null);
    const screenPixels = toScreen ? screen(ref.gl) : [];
    function read(target) {
      const data = new Uint8Array(bytes);
      renderer.readRenderTargetPixels(target, 0, 0, width, height, data);
      return sample(data);
    }
    const result = [...read(target), ...read(original), ...screenPixels];
    composer.dispose();
    for (const pass of [seed,color,present]) pass.dispose();
    texture.dispose();
    return result;
  }
  const cases = [];
  for (const mode of [0,1]) {
    const status = actual.uxe_native_composer(BigInt(mode), BigInt(query.get("mode")), ...lengths);
    if (status !== 0n) throw new Error("composer native route failed " + status);
    cases.push(...sample(wasmPixels(7000)), ...sample(wasmPixels(7200)));
    if (mode) cases.push(...screen(gl));
    cases.push(...reference(mode === 1));
  }
  renderer.dispose();
  output.textContent = JSON.stringify([...cases, draws]);
} catch (error) {
  output.textContent = "error:" + error.message;
}
</script>
