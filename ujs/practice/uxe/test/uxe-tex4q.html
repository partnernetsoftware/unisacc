<!DOCTYPE html>
<html lang="zh"><head>
<meta charset="utf-8"/><title>uxe-tex4q</title>
</head><body>
<canvas id="c" width="64" height="64"></canvas>
<script type="module">
import { createWebGLRenderer } from "../renderer-webgl.js";
import { Scene, PerspectiveCamera } from "../scene.js";
import { MESH_PLANE } from "../meshes.js";
const rgba=new Uint8Array([
  255,0,0,255, 0,255,0,255, 0,0,255,255, 255,255,0,255,
  255,0,255,255, 0,255,255,255, 128,0,0,255, 0,128,0,255,
  0,0,128,255, 128,128,0,255, 128,0,128,255, 0,128,128,255,
  64,64,64,255, 192,192,192,255, 255,128,0,255, 0,255,128,255
]);
function texel(x,y){
  const o=(y*4+x)*4;
  return [rgba[o],rgba[o+1],rgba[o+2]];
}
(async()=>{
  try{
    const canvas=document.getElementById("c");
    const r=createWebGLRenderer(canvas);
    canvas.width=64; canvas.height=64;
    const scene=new Scene();
    scene.clearColor=[0,0,0,1];
    scene.fog={density:0,color:[0,0,0]};
    scene.ambient={color:[1,1,1],intensity:0};
    scene.lights=[];
    const cloud=scene.instances("p",1,[1,1,1]);
    cloud.meshId=MESH_PLANE;
    cloud.mapId=1;
    cloud.set(0,0,0,0,2);
    const cam=new PerspectiveCamera(Math.PI/2,0.1,20);
    cam.setEye(0,2,0); cam.setTarget(0,0,0);
    r.render(scene, cam, [{id:1,w:4,h:4,rgba}]);
    const gl=canvas.getContext("webgl");
    const px=new Uint8Array(4);
    function at(x,y){ gl.readPixels(x,y,1,1,gl.RGBA,gl.UNSIGNED_BYTE,px); return [px[0],px[1],px[2]]; }
    const q=[at(16,48),at(48,48),at(16,16),at(48,16)];
    const want=[texel(1,1),texel(2,1),texel(1,2),texel(2,2)];
    let ok=1;
    for(let i=0;i<4;i++) if(Math.abs(q[i][0]-want[i][0])>2||Math.abs(q[i][1]-want[i][1])>2||Math.abs(q[i][2]-want[i][2])>2) ok=0;
    document.title=ok?"TEX4Q_OK":"TEX4Q_FAIL";
    document.body.appendChild(document.createTextNode(document.title+" "+JSON.stringify(q)));
  }catch(e){
    document.title="TEX4Q_ERR";
    document.body.appendChild(document.createTextNode(String(e&&e.message||e)));
  }
})();
</script>
</body></html>
