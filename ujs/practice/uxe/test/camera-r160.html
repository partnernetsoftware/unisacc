<!doctype html>
<meta charset="utf-8">
<pre id="r160">pending</pre>
<script type="module">
import { Camera, Vector3, REVISION } from "../../web/game/three.module.js";
if (REVISION !== "160") throw new Error("three.js revision mismatch");

const camera = new Camera();
camera.position.set(3, 5, -7);
camera.rotation.y = Math.PI / 2;
camera.updateMatrixWorld();
const direction = camera.getWorldDirection(new Vector3());
const inverse = camera.matrixWorldInverse.elements;
const clone = camera.clone();
document.querySelector("#r160").textContent = JSON.stringify([
  camera.projectionMatrix.elements[0], camera.projectionMatrixInverse.elements[15],
  direction.x, direction.y, direction.z, inverse[12], inverse[13], inverse[14],
  camera.coordinateSystem * 10000 + clone.coordinateSystem, clone.matrixWorldInverse.elements[12],
  3 * Uint32Array.BYTES_PER_ELEMENT, 4 * Uint32Array.BYTES_PER_ELEMENT, -1, -1
]);
</script>
