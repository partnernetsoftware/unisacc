<script type="module">
import { REVISION } from "three";
const root=new URLSearchParams(location.search).get("package");
const { GLTFLoader }=await import("file://"+root+"/examples/jsm/loaders/GLTFLoader.js");
if(REVISION!=="160") throw new Error("three.js revision mismatch");
const positions=[0,0,0,1,0,0,0,1,0,1,1,0];
const uv=[0,0,1,0,0,1,1,1];
const bytes=new Uint8Array(new Float32Array([...positions,...uv]).buffer);
const uri="data:application/octet-stream;base64,"+btoa(String.fromCharCode(...bytes));
const scene={
  asset:{version:"2.0"},scenes:[{nodes:[0]}],nodes:[{mesh:0}],
  meshes:[{primitives:[{mode:5,attributes:{POSITION:0,TEXCOORD_0:1}}]}],
  buffers:[{byteLength:80,uri}],
  bufferViews:[{buffer:0,byteLength:48},{buffer:0,byteOffset:48,byteLength:32}],
  accessors:[
    {bufferView:0,componentType:5126,count:4,type:"VEC3",min:[0,0,0],max:[1,1,0]},
    {bufferView:1,componentType:5126,count:4,type:"VEC2"},
  ],
};
const graph=await new GLTFLoader().parseAsync(JSON.stringify(scene),"");
const result=graph.scene.children[0].geometry;
document.querySelector("#r160").textContent=JSON.stringify([
  result.attributes.position.count,result.index.count,result.index.array[3],result.index.array[5],
  Number(result.attributes.uv.count===result.attributes.position.count),1,1,
]);
</script>
