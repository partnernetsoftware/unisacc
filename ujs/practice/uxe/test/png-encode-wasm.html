<!doctype html>
<meta charset="utf-8">
<pre id="value">pending</pre>
<script>
const request = new XMLHttpRequest();
request.open("GET", "probe.wasm", false);
request.overrideMimeType("text/plain; charset=x-user-defined");
request.send();
const bytes = Uint8Array.from(request.responseText, ch => ch.charCodeAt(0) & 255);
const { exports: wasm } = new WebAssembly.Instance(new WebAssembly.Module(bytes));
const result = Number(wasm.i64_of_export(wasm.main_export()));
document.querySelector("#value").textContent = JSON.stringify([result]);
</script>
