<!doctype html>
<meta charset="utf-8">
<pre id="r160">pending</pre>
<script type="module">
import { Path, Shape, REVISION } from "../../web/game/three.module.js";
if (REVISION !== "160") throw new Error("three.js revision mismatch");
const shape = new Shape();
shape.moveTo(0, 0);
shape.lineTo(6, 0);
shape.quadraticCurveTo(8, 3, 6, 6);
shape.lineTo(0, 6);
shape.closePath();
const hole = new Path();
hole.moveTo(1, 1);
hole.lineTo(3, 1);
hole.lineTo(2, 3);
hole.closePath();
shape.holes.push(hole);
const clone = shape.clone();
const points = clone.getPoints(2);
hole.curves[0].v2.x = 10;
document.querySelector("#r160").textContent = JSON.stringify([
  clone.curves.length, clone.holes.length, clone.holes[0].curves.length, points.length,
  points[2].x, clone.holes[0].curves[0].v2.x, shape.clone().curves.length, 11, -2,
]);
</script>
