<!doctype html>
<meta charset="utf-8">
<pre id="r160">pending</pre>
<script type="module">
import { ImageLoader, REVISION } from "../../web/game/three.module.js";
if (REVISION !== "160") throw new Error("three.js revision mismatch");
const canvas = document.createElement("canvas");
canvas.width = 3;
canvas.height = 2;
const url = canvas.toDataURL("image/jpeg");
const image = await new ImageLoader().loadAsync(url);
const bytes = Uint8Array.from(atob(url.split(",")[1]), value => value.charCodeAt(0));
let frame;
for (let i = 2; i < bytes.length;) {
  const marker = bytes[i + 1];
  if (marker === 192 || marker === 194) { frame = [bytes[i + 9], marker]; break; }
  i += 2 + 256 * bytes[i + 2] + bytes[i + 3];
}
document.querySelector("#r160").textContent = JSON.stringify([image.naturalWidth, image.naturalHeight, ...frame, -2, -4, -4, -1]);
</script>
