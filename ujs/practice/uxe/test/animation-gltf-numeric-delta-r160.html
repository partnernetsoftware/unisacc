<!doctype html>
<meta charset="utf-8">
<pre id="r160">pending</pre>
<script type="module">
import { AnimationClip, AnimationUtils, CubicBezierCurve, NumberKeyframeTrack, REVISION, Vector2 } from "../../web/game/three.module.js";
if (REVISION !== "160") throw new Error("three.js revision mismatch");
const curve = new CubicBezierCurve(
  new Vector2(2,0), new Vector2(2+8/3,0), new Vector2(10+4/3,0), new Vector2(10,0),
);
function cubic() {
  const interpolant = { resultBuffer: new Float32Array(3) };
  interpolant.evaluate = t => {
    interpolant.resultBuffer[1] = curve.getPoint((t-1)/2).x;
    return interpolant.resultBuffer;
  };
  return interpolant;
}
cubic.isInterpolantFactoryMethodGLTFCubicSpline = true;
const target = new NumberKeyframeTrack("x",[1,3],[11,8,13,17,12,19]);
const reference = new NumberKeyframeTrack("x",[1,3],[99,2,4,-2,10,99]);
target.createInterpolant = cubic;
reference.createInterpolant = cubic;
const clip = new AnimationClip("target",3,[target]);
AnimationUtils.makeClipAdditive(clip,60,new AnimationClip("reference",3,[reference]),30);
const cases = clip.tracks[0].values;
document.querySelector("#r160").textContent = JSON.stringify([
  cases.byteLength, cases[1], cases[4], cases[0], cases[5], 777, -1,
]);
</script>
