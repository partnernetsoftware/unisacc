<!doctype html>
<meta charset="utf-8">
<pre id="r160">pending</pre>
<script type="module">
import { CubeReflectionMapping, CubeRefractionMapping, CubeTexture, DataTexture, Mesh,
  MeshBasicMaterial, MixOperation, NearestFilter, OrthographicCamera, PlaneGeometry, REVISION, Scene,
  WebGLRenderer, WebGLRenderTarget } from "../../web/game/three.module.js";
if(REVISION!=="160") throw new Error("three.js revision mismatch");
const canvas=document.createElement("canvas");
const context=canvas.getContext("webgl2");
const renderer=new WebGLRenderer({canvas,context});
const target=new WebGLRenderTarget(1,1);
renderer.setRenderTarget(target);
const faces=Array.from({length:6},(_,i)=>new DataTexture(new Uint8Array([10+20*i,0,0,255]),1,1));
const cube=new CubeTexture(faces);
cube.minFilter=NearestFilter;
cube.magFilter=NearestFilter;
cube.generateMipmaps=false;
cube.needsUpdate=true;
const geometry=new PlaneGeometry(2,2);
const normals=geometry.getAttribute("normal");
for(let i=0;i<normals.count;i++) normals.setXYZ(i,0.6,0,0.8);
const material=new MeshBasicMaterial({envMap:cube,combine:MixOperation,refractionRatio:0.5,toneMapped:false});
const scene=new Scene();
scene.add(new Mesh(geometry,material));
const camera=new OrthographicCamera(-1,1,1,-1,0,10);
camera.position.z=1;
const pixel=new Uint8Array(4);
const result=[];
for(const mapping of [CubeReflectionMapping,CubeRefractionMapping]) {
  cube.mapping=mapping;
  material.needsUpdate=true;
  renderer.render(scene,camera);
  renderer.readRenderTargetPixels(target,0,0,1,1,pixel);
  result.push((pixel[0]-10)/20);
}
document.querySelector("#r160").textContent=JSON.stringify(result);
material.dispose();
geometry.dispose();
cube.dispose();
for(const face of faces) face.dispose();
target.dispose();
renderer.dispose();
</script>
