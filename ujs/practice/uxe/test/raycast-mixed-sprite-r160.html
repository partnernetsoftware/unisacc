<!doctype html>
<meta charset="utf-8">
<pre id="r160">pending</pre>
<script type="module">
import { BufferGeometry, Float32BufferAttribute, Group, Mesh, MeshBasicMaterial, Points, PointsMaterial,
  PerspectiveCamera, Raycaster, REVISION, Sprite, SpriteMaterial, Vector3 } from "../../web/game/three.module.js";
const status=document.querySelector("#r160");
try {
  if(REVISION!=="160") throw new Error("Three.js revision");
  const geometry=vertices=>new BufferGeometry().setAttribute("position",new Float32BufferAttribute(vertices,3));
  const group=new Group();
  const mesh=new Mesh(geometry([-1,-1,-3,1,-1,-3,0,1,-3]),new MeshBasicMaterial());
  const sprite=new Sprite(new SpriteMaterial());
  sprite.position.z=-3;
  const points=new Points(geometry([0.5,0,-3,0,0,-1]),new PointsMaterial());
  const ids=new Map([[mesh,11],[sprite,12],[points,13]]);
  group.add(mesh,sprite,points);
  group.updateMatrixWorld(true);
  const ray=new Raycaster(new Vector3(0.25,0,0),new Vector3(0,0,-1));
  ray.camera=new PerspectiveCamera();
  ray.camera.updateMatrixWorld(true);
  const hits=ray.intersectObject(group,true);
  sprite.layers.set(1);
  const masked=ray.intersectObject(group,true);
  const id=hit=>ids.get(hit.object);
  status.textContent=JSON.stringify([
    hits.length,id(hits[0]),id(hits[1]),id(hits[2]),id(hits[3]),hits[2].distance,hits[2].uv.x,hits[2].uv.y,
    hits[2].object.isSprite?3:0,hits[2].index===undefined?4294967295:hits[2].index,masked.length,-1,-1,
  ]);
} catch(error) {
  status.textContent=`error:${error.message}`;
}
</script>
