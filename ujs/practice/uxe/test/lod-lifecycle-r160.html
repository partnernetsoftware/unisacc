<!doctype html>
<meta charset="utf-8">
<pre id="r160">pending</pre>
<script type="module">
import { LOD, Object3D, REVISION, Scene } from "../../web/game/three.module.js";
if (REVISION !== "160") throw new Error("three.js revision mismatch");
const source = new LOD();
const near = new Object3D(), far = new Object3D();
source.add(new Object3D());
far.add(new Object3D());
source.addLevel(far,10,0.25).addLevel(near,0,0);
source.autoUpdate = false;
const copy = source.clone();
const scene = new Scene();
scene.add(source,copy);
copy.removeFromParent();
const level = copy.levels[1];
document.querySelector("#r160").textContent = JSON.stringify([
  copy.levels.length,level.distance,level.hysteresis,Number(copy.autoUpdate),
  Number(copy !== source && level.object !== far && level.object.parent === copy &&
    level.object.children.length === 1 && level.object.children[0] !== far.children[0]),
  Number(copy.parent === null && source.parent === scene),
]);
</script>
