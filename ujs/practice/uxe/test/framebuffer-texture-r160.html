<!doctype html>
<meta charset="utf-8">
<pre id="r160">pending</pre>
<script type="module">
import { Color, FramebufferTexture, Mesh, MeshBasicMaterial, OrthographicCamera, PlaneGeometry,
  REVISION, Scene, Vector2, WebGLRenderer, WebGLRenderTarget } from "../../web/game/three.module.js";
if (REVISION !== "160") throw new Error("three.js revision mismatch");
const canvas=document.createElement("canvas");
const context=canvas.getContext("webgl2");
const renderer=new WebGLRenderer({canvas,context});
const source=new WebGLRenderTarget(3,3);
renderer.setRenderTarget(source);
renderer.setScissorTest(true);
const color=new Color();
for(let y=0;y<3;y++) {
  for(let x=0;x<3;x++) {
    renderer.setScissor(x,y,1,1);
    renderer.setClearColor(color.setRGB(10*(1+x+3*y)/255,0,0),1);
    renderer.clear();
  }
}
renderer.setScissorTest(false);
const captured=new FramebufferTexture(2,2);
renderer.copyFramebufferToTexture(new Vector2(1,1),captured);
const target=new WebGLRenderTarget(2,2);
renderer.setRenderTarget(target);
const camera=new OrthographicCamera(-1,1,1,-1,0,10);
camera.position.z=1;
const scene=new Scene();
const geometry=new PlaneGeometry(2,2);
const material=new MeshBasicMaterial({map:captured,toneMapped:false});
scene.add(new Mesh(geometry,material));
renderer.render(scene,camera);
const pixels=new Uint8Array(16);
renderer.readRenderTargetPixels(target,0,0,2,2,pixels);
const words=[];
for(let i=0;i<16;i+=4) words.push(pixels.slice(i,i+4).reduceRight((word,byte)=>word*256+byte,0));
document.querySelector("#r160").textContent=JSON.stringify(words);
material.dispose();
geometry.dispose();
captured.dispose();
target.dispose();
source.dispose();
renderer.dispose();
</script>
