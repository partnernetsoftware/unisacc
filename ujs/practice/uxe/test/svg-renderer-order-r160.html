<!doctype html>
<meta charset="utf-8">
<pre id="r160">pending</pre>
<script type="importmap">{"imports":{"three":"../../web/game/three.module.js"}}</script>
<script type="module">
import { BufferGeometry, DoubleSide, Float32BufferAttribute, Mesh, MeshBasicMaterial,
  OrthographicCamera, REVISION, Scene } from "three";
const root=new URLSearchParams(location.search).get("package");
const {SVGRenderer}=await import(`file://${root}/examples/jsm/renderers/SVGRenderer.js`);
if(REVISION!=="160") throw Error("three.js revision mismatch");
const geometry=new BufferGeometry();
geometry.setAttribute("position",new Float32BufferAttribute([-0.25,-0.25,0,0.25,-0.25,0,0,0.25,0],3));
const colors=[0xff0000,0x00ff00,0x0000ff,0x00ffff,0xff00ff,0xffff00];
const meshes=colors.map((color,i)=>{
  const mesh=new Mesh(geometry,new MeshBasicMaterial({color,side:DoubleSide}));
  mesh.position.z=[-3,-7,-2,-7,-8,-1][i];
  mesh.renderOrder=[0,0,-1,0,2,0][i];
  return mesh;
});
const scene=new Scene();
for(const i of [4,3,1,0,5,2]) scene.add(meshes[i]);
const camera=new OrthographicCamera(-1,1,1,-1,0.1,10);
const renderer=new SVGRenderer();
renderer.setSize(32,32);
renderer.overdraw=0;
renderer.render(scene,camera);
const map=["255,0,0","0,255,0","0,0,255","0,255,255","255,0,255","255,255,0"];
const keys=[...renderer.domElement.querySelectorAll("path")].map(path=>{
  const color=path.style.fill.replace(/\s+/g,"").slice(4,-1);
  return map.indexOf(color);
});
document.querySelector("#r160").textContent=JSON.stringify([...keys,-1,77]);
for(const mesh of meshes) mesh.material.dispose();
geometry.dispose();
</script>
