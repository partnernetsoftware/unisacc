<!doctype html>
<meta charset="utf-8">
<pre id="r160">pending</pre>
<script type="module">
import { BufferAttribute, BufferGeometry, Camera, Color, DataTexture, LinearSRGBColorSpace, Mesh,
  MeshBasicMaterial, Points, PointsMaterial, REVISION, Scene, ShaderLib, UniformsLib,
  WebGLRenderer } from "../../web/game/three.module.js";
import { createGpuSubmit } from "../base/gpu-host-abi.js";

const output = document.querySelector("#r160");
const query = new URLSearchParams(location.search);
const options = { alpha: false, antialias: false, preserveDrawingBuffer: true };
const encoder = new TextEncoder();
const decoder = new TextDecoder();
const vertices = [-1, -1, 0, 3, -1, 0, -1, 3, 0];
const rgba = [32, 96, 160, 255];
const point = [0.25, 0.5, 0.75];
const cases = [
  { name: "basic", files: ["gpu-texture.vert", "gpu-texture.frag"], groups: ["common", "specularmap", "envmap", "aomap", "lightmap", "fog"],
    mode: [0, 1, 0], count: 81 },
  { name: "points", files: ["gpu-flat.vert", "gpu-flat.frag"], groups: ["points", "fog"], mode: [1, 0, 3], count: 9 }
];

function context() {
  const canvas = document.createElement("canvas");
  canvas.width = canvas.height = 9;
  const gl = canvas.getContext("webgl", options);
  if (!gl) throw Error("WebGL unavailable");
  return { canvas, gl };
}

function sample(gl) {
  const pixels = new Uint8Array(9 * 9 * 4);
  gl.readPixels(0, 0, 9, 9, gl.RGBA, gl.UNSIGNED_BYTE, pixels);
  let coverage = 0;
  for (let i = 0; i < pixels.length; i += 4) if (pixels[i] !== 0) coverage++;
  return [...pixels.slice(160, 164), coverage];
}

function reference() {
  const { canvas, gl } = context();
  const renderer = new WebGLRenderer({ ...options, canvas, context: gl });
  renderer.outputColorSpace = LinearSRGBColorSpace;
  renderer.setSize(9, 9, false);
  renderer.setClearColor(0, 1);
  const texture = new DataTexture(Uint8Array.from(rgba), 1, 1);
  texture.needsUpdate = true;
  const tri = new BufferGeometry();
  tri.setAttribute("position", new BufferAttribute(Float32Array.from(vertices), 3));
  tri.setAttribute("uv", new BufferAttribute(Float32Array.from([0.5, 0.5, 0.5, 0.5, 0.5, 0.5]), 2));
  const spots = new BufferGeometry();
  spots.setAttribute("position", new BufferAttribute(Float32Array.from([0, 0, 0]), 3));
  const basic = new MeshBasicMaterial({ map: texture });
  const points = new PointsMaterial({ size: 3, sizeAttenuation: false, color: new Color().setRGB(...point) });
  const camera = new Camera();
  try {
    return [new Mesh(tri, basic), new Points(spots, points)].flatMap(item => {
      item.frustumCulled = false;
      const scene = new Scene();
      scene.add(item);
      renderer.render(scene, camera);
      return sample(gl);
    });
  } finally {
    basic.dispose(); points.dispose(); tri.dispose(); spots.dispose(); texture.dispose(); renderer.dispose();
  }
}

function defaults(entry) {
  const v = entry.value;
  if (v === null) return [0, []];
  if (typeof v === "number") return [1, [v]];
  if (v.isColor) return [2, v.toArray()];
  if (v.isMatrix3) return [3, v.toArray()];
  if (v.isVector2) return [4, v.toArray()];
  throw Error("unknown uniform default");
}

async function product() {
  const { gl } = context();
  let exports;
  const submit = createGpuSubmit(gl, () => exports.memory, () => 1);
  const response = await fetch("file://" + query.get("dir") + "/probe.wasm");
  ({ instance: { exports } } = await WebAssembly.instantiate(await response.arrayBuffer(), { uxe_gpu_v1: { host_gpu_submit: submit } }));
  if (exports.uxe_abi_version() !== 1) throw Error("Wasm ABI");
  const run = (op, a = 0, b = 0, c = 0) => Number(exports.uxe_shader_lib(BigInt(op), BigInt(a), BigInt(b), BigInt(c)));
  const memory = new Uint8Array(exports.memory.buffer, run(0), 12288);
  const view = new DataView(memory.buffer, memory.byteOffset, memory.byteLength);
  const get = offset => view.getUint32(offset, true);
  const lookup = name => { const bytes = encoder.encode(name); memory.set(bytes, 64); return run(1, bytes.length); };
  const outName = size => decoder.decode(memory.slice(64, 64 + size));
  const refused = lookup("unlisted") === -1 && lookup("Points") === -1;
  const pixels = [];
  let matched = 0;
  for (const entry of cases) {
    const id = lookup(entry.name);
    if (id < 0 || run(2, id) !== 128) throw Error("lookup " + entry.name);
    const mode = [get(128), get(132), get(136)];
    if (mode.join() !== entry.mode.join() || get(140) !== entry.groups.length) throw Error("program capabilities");
    const keys = new Set();
    for (let g = 0; g < entry.groups.length; g++) {
      const group = outName(run(3, id, g));
      if (group !== entry.groups[g]) throw Error("wrong template group " + group);
      const ref = Object.keys(UniformsLib[group]);
      if (run(4, id, g) !== ref.length) throw Error("template count " + group);
      for (let row = 0; row < ref.length; row++) {
        const key = outName(run(5, id, g, row));
        if (key !== ref[row] || run(6, id, g, row) !== 256) throw Error("template key/default " + key);
        keys.add(key);
        const [kind, values] = defaults(UniformsLib[group][key]);
        if (get(256) !== kind || values.some((value, i) => {
          const actual = view.getFloat64(264 + i * 8, true);
          return !Number.isFinite(actual) || Math.abs(value - actual) > 1e-12;
        })) {
          throw Error("template value " + key);
        }
      }
    }
    if ([...keys].join() !== Object.keys(ShaderLib[entry.name].uniforms).join()) throw Error("r160 template projection");
    if (run(7, id, 1024) <= 0) throw Error("shader source");
    for (let stage = 0; stage < 2; stage++) {
      const pointer = get(160 + stage * 8), bytes = get(164 + stage * 8);
      const source = await (await fetch("../base/" + entry.files[stage])).text();
      if (decoder.decode(memory.slice(pointer, pointer + bytes)) !== source) throw Error("repository shader asset");
    }
    matched++;
    const asset = memory.subarray(6144, 6160);
    asset.fill(91);
    if (run(7, id, 12) !== -1 || !asset.every(byte => byte === 91)) throw Error("shader room refusal");
    const put = (at, n) => view.setUint32(at, n, true);
    if (mode[1]) {
      [1, 1, 0, 0, 0, 576].forEach((value, i) => put(512 + i * 4, value));
      memory.set(rgba, 576);
      for (let i = 0; i < 3; i++) {
        [...vertices.slice(i * 3, i * 3 + 3), 0.5, 0.5, 0, 1].forEach((v, j) => view.setFloat32(1024 + 28 * i + 4 * j, v, true));
      }
    } else {
      [0, 0, 0, ...point, 1].forEach((v, j) => view.setFloat32(1024 + 4 * j, v, true));
    }
    if (run(8, id, Number(query.get("mutate") === "1")) < 0) throw Error("packet drawing " + entry.name);
    pixels.push(...sample(gl));
  }
  const programs = [
    ["basic", "gpu-texture.vert", "gpu-texture.frag"],
    ["lambert", "gpu-lit.vert", "gpu-lambert.frag"],
    ["phong", "gpu-phong.vert", "gpu-phong.frag"],
  ];
  const checks = [];
  let stage = "lookup";
  try {
  for (const [name, vertexAsset, fragmentAsset] of programs) {
    stage = name + " lookup and source";
    const id = lookup(name);
    if (id < 0 || run(2, id) !== 128 || run(7, id, 6000) <= 0) throw Error("program " + name);
    const expectedKeys = Object.keys(ShaderLib[name].uniforms);
    const keys = new Set();
    for (let group = 0; group < get(140); group++) {
      for (let row = 0; row < run(4, id, group); row++) keys.add(outName(run(5, id, group, row)));
    }
    for (let index = 0; index < 64; index++) {
      const size = run(9, id, index);
      if (size < 0) break;
      keys.add(outName(size));
    }
    stage = name + " source compare";
    const names = [...keys];
    if (query.get("mutateKeys") === "1") names[0] += "Mutated";
    checks.push(Number(names.join() === expectedKeys.join()));
    const sources = [];
    for (const [stage, asset] of [vertexAsset, fragmentAsset].entries()) {
      const offset = get(160 + stage * 8);
      const bytes = get(164 + stage * 8);
      const source = decoder.decode(memory.subarray(offset, offset + bytes));
      const tracked = await (await fetch("../base/" + asset)).text();
      const expected = stage === 0 ? ShaderLib[name].vertexShader : ShaderLib[name].fragmentShader;
      const marker = stage === 0 ? "#include <project_vertex>" : "#include <opaque_fragment>";
      if (source !== tracked || !expected.includes(marker)) throw Error("source " + name + ":" + stage);
      sources.push(source);
    }
    const shaders = sources.map((source, index) => {
      const shader = gl.createShader(index === 0 ? gl.VERTEX_SHADER : gl.FRAGMENT_SHADER);
      gl.shaderSource(shader, source);
      gl.compileShader(shader);
      if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) throw Error(gl.getShaderInfoLog(shader));
      return shader;
    });
    const linked = gl.createProgram();
    shaders.forEach(shader => gl.attachShader(linked, shader));
    gl.linkProgram(linked);
    checks.push(Number(gl.getProgramParameter(linked, gl.LINK_STATUS)));
    gl.deleteProgram(linked);
    shaders.forEach(shader => gl.deleteShader(shader));
  }
  } catch (error) {
    throw Error(stage + ": " + error.message);
  }
  return [...pixels, matched, Number(refused), ...checks];
}

try {
  if (REVISION !== "160") throw Error("three.js revision mismatch");
  output.textContent = JSON.stringify([...reference(), ...await product()]);
} catch (error) { output.textContent = "error:" + error.message; }
</script>
