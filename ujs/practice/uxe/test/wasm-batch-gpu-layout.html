<!doctype html>
<meta charset="utf-8">
<pre id="wasm-cases">pending</pre>
<script type="module">
const result=document.querySelector("#wasm-cases");
try {
  const count=Number(new URLSearchParams(location.search).get("count"));
  const bytes=await(await fetch("probe.wasm")).arrayBuffer();
  const module=await WebAssembly.compile(bytes);
  const imports={env:{host_gpu_submit() { throw new Error("layout probe must not submit a GPU packet"); }}};
  const cases=[];
  for(let index=0;index<count;index++) {
    const instance=await WebAssembly.instantiate(module,imports);
    cases.push(instance.exports.uxe_evaluate_case(BigInt(index)));
  }
  result.textContent=JSON.stringify(cases);
} catch(error) { result.textContent="error:"+error.message; }
</script>
