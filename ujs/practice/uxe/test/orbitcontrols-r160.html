<!doctype html>
<meta charset="utf-8">
<pre id="r160">pending</pre>
<script type="importmap">{"imports":{"three":"../../web/game/three.module.js"}}</script>
<script type="module">
import { PerspectiveCamera, REVISION } from "three";
const status=document.querySelector("#r160");
try {
  if(REVISION!=="160") throw new Error("three.js revision mismatch");
  const root=new URLSearchParams(location.search).get("package");
  const {OrbitControls}=await import(`file://${root}/examples/jsm/controls/OrbitControls.js`);
  function setup() {
    const camera=new PerspectiveCamera();
    camera.position.z=10;
    const area=document.createElement("div");
    area.style.cssText="width:100px;height:100px";
    area.setPointerCapture=()=>{};
    area.releasePointerCapture=()=>{};
    document.body.append(area);
    return [camera,area,new OrbitControls(camera,area)];
  }
  function pointer(area,type,x=0) {
    area.dispatchEvent(new PointerEvent(type,{pointerId:7,pointerType:"mouse",button:0,clientX:x,clientY:0,bubbles:true}));
  }
  function wheel(area) {
    area.dispatchEvent(new WheelEvent("wheel",{deltaY:-100*(window.devicePixelRatio|0),cancelable:true}));
  }
  let [camera,area,controls]=setup();
  pointer(area,"pointerdown");
  pointer(area,"pointermove",25);
  const rotated=[camera.position.x,camera.position.z];
  controls.dispose();
  [camera,area,controls]=setup();
  wheel(area);
  const zoom=camera.position.length();
  controls.dispose();
  [camera,area,controls]=setup();
  pointer(area,"pointerdown");
  wheel(area);
  const ignored=camera.position.length();
  pointer(area,"pointerup");
  wheel(area);
  const after=camera.position.length();
  controls.dispose();
  [camera,area,controls]=setup();
  controls.enableDamping=true;
  controls.dampingFactor=0.2;
  pointer(area,"pointerdown");
  pointer(area,"pointermove",25);
  const first=camera.position.x;
  controls.update();
  const second=camera.position.x;
  controls.dispose();
  [camera,area,controls]=setup();
  controls.minDistance=9.8;
  wheel(area);
  const clamped=camera.position.length();
  controls.dispose();
  status.textContent=JSON.stringify([...rotated,zoom,0,ignored,first,second,clamped,-1,-1,after]);
} catch(error) {status.textContent=`error:${error.message}`;}
</script>
