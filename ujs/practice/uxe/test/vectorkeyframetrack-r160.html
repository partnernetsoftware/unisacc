<!doctype html>
<meta charset="utf-8">
<pre id="r160">pending</pre>
<script type="module">
import { VectorKeyframeTrack, InterpolateDiscrete, InterpolateLinear, InterpolateSmooth, REVISION } from "../../web/game/three.module.js";
if (REVISION !== "160") throw new Error("three.js revision mismatch");
const track = new VectorKeyframeTrack("x", [0, 2, 4], [0, 4, 8, 12, 0, 4]);
const at = (mode, lane) => track.setInterpolation(mode).createInterpolant().evaluate(1)[lane];
document.querySelector("#r160").textContent = JSON.stringify([
  at(InterpolateLinear, 0), at(InterpolateLinear, 1), at(InterpolateDiscrete, 1), at(InterpolateSmooth, 0), -1
]);
</script>
