<!DOCTYPE html>
<html lang="zh"><head>
<meta charset="utf-8"/><title>uxe-blend</title>
</head><body>
<canvas id="c" width="64" height="64"></canvas>
<pre id="hud"></pre>
<script type="module">
import { createWebGLRenderer } from "../renderer-webgl.js";
import { Scene, PerspectiveCamera } from "../scene.js";
import { MESH_PLANE } from "../meshes.js";
(async()=>{
  const hud=document.getElementById("hud");
  try{
    const canvas=document.getElementById("c");
    const r=createWebGLRenderer(canvas);
    const scene=new Scene();
    scene.clearColor=[0,0,0,1];
    scene.fog={density:0,color:[0,0,0]};
    scene.ambient={color:[0,0,0],intensity:0};
    scene.lights=[];
    const bg=scene.instances("bg",1,[1,1,1]);
    bg.meshId=MESH_PLANE; bg.mapId=1;
    bg.set(0,0,0,-0.2,8,0,-Math.PI/2);
    const fg=scene.instances("fg",1,[1,1,1]);
    fg.meshId=MESH_PLANE; fg.mapId=2; fg.billboard=0;
    fg.set(0,0,0,0,8,0,-Math.PI/2);
    const cam=new PerspectiveCamera(1.0,0.05,40);
    cam.setEye(0,0,8); cam.setTarget(0,0,0);
    const rgba1=new Uint8Array(64); for(let i=0;i<16;i++){rgba1[i*4]=200;rgba1[i*4+1]=10;rgba1[i*4+2]=30;rgba1[i*4+3]=255;}
    const rgba2=new Uint8Array(64); for(let i=0;i<16;i++){rgba2[i*4]=5;rgba2[i*4+1]=220;rgba2[i*4+2]=40;rgba2[i*4+3]=128;}
    r.render(scene,cam,[{id:1,w:4,h:4,rgba:rgba1},{id:2,w:4,h:4,rgba:rgba2}]);
    const gl=canvas.getContext("webgl");
    const px=new Uint8Array(4);
    gl.readPixels(32,32,1,1,gl.RGBA,gl.UNSIGNED_BYTE,px);
    const a=128, sr=5,sg=220,sb=40, dr=200,dg=10,db=30;
    const er=((sr*a+dr*(255-a)+127)/255)|0;
    const eg=((sg*a+dg*(255-a)+127)/255)|0;
    const eb=((sb*a+db*(255-a)+127)/255)|0;
    let ok=1;
    if(Math.abs(px[0]-er)>1||Math.abs(px[1]-eg)>1||Math.abs(px[2]-eb)>1) ok=0;
    hud.textContent=JSON.stringify({px:[px[0],px[1],px[2],px[3]],want:[er,eg,eb,255]});
    document.title=ok?"BLEND_OK":"BLEND_FAIL";
  }catch(e){
    document.title="BLEND_ERR";
    hud.textContent=String(e&&e.message||e);
  }
})();
</script>
</body></html>
