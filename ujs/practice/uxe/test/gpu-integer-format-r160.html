<!doctype html>
<meta charset="utf-8">
<pre id="r160">pending</pre>
<script type="module">
import { DataTexture, GLSL3, Mesh, OrthographicCamera, PlaneGeometry, RawShaderMaterial,
  RedIntegerFormat, RGIntegerFormat, RGBAIntegerFormat, REVISION, Scene, UnsignedShortType,
  WebGLRenderer, WebGLRenderTarget } from "../../web/game/three.module.js";
if (REVISION !== "160") throw new Error("three.js revision mismatch");
const canvas=document.createElement("canvas");
const context=canvas.getContext("webgl2");
if(!context) throw new Error("WebGL2 unavailable");
const renderer=new WebGLRenderer({canvas,context});
const target=new WebGLRenderTarget(1,1);
renderer.setRenderTarget(target);
const camera=new OrthographicCamera(-1,1,1,-1,0,10);
camera.position.z=1;
const geometry=new PlaneGeometry(2,2);
const material=new RawShaderMaterial({
  glslVersion:GLSL3,
  uniforms:{image:{value:null},component:{value:0}},
  vertexShader:"in vec3 position;void main(){gl_Position=vec4(position,1.0);}",
  fragmentShader:`precision highp float;
    precision highp int;
    uniform highp usampler2D image;
    uniform int component;
    out vec4 pixel;
    void main(){
      uint word=texelFetch(image,ivec2(1,0),0)[component];
      pixel=vec4(float(word & 255u),float(word >> 8u),0.0,255.0)/255.0;
    }`,
});
const scene=new Scene();
scene.add(new Mesh(geometry,material));
const result=[];
for(const [format,channels,components] of [[RedIntegerFormat,1,[0,3]],
  [RGIntegerFormat,2,[1,2]],[RGBAIntegerFormat,4,[0,3]]]) {
  const data=Uint16Array.from({length:2*channels},(_,i)=>1000+100*i);
  const texture=new DataTexture(data,2,1,format,UnsignedShortType);
  texture.internalFormat=channels===1?'R16UI':channels===2?'RG16UI':'RGBA16UI';
  texture.needsUpdate=true;
  material.uniforms.image.value=texture;
  for(const component of components) {
    material.uniforms.component.value=component;
    renderer.render(scene,camera);
    const bytes=new Uint8Array(4);
    renderer.readRenderTargetPixels(target,0,0,1,1,bytes);
    result.push(bytes[0]+256*bytes[1]);
  }
  texture.dispose();
}
document.querySelector("#r160").textContent=JSON.stringify(result);
geometry.dispose();
material.dispose();
target.dispose();
renderer.dispose();
</script>
