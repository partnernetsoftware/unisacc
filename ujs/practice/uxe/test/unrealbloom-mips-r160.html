<!doctype html>
<meta charset="utf-8">
<pre id="r160">pending</pre>
<script type="importmap">{"imports":{"three":"../../web/game/three.module.js"}}</script>
<script type="module">
import { REVISION, Vector2 } from "three";
const root=new URLSearchParams(location.search).get("package");
const { UnrealBloomPass }=await import(`file://${root}/examples/jsm/postprocessing/UnrealBloomPass.js`);
if(REVISION!=="160") throw Error("three.js revision mismatch");
const bloom=new UnrealBloomPass(new Vector2(31,17),1,0,0);
function read() {
  return bloom.renderTargetsHorizontal.flatMap((target,i)=>{
    const vertical=bloom.renderTargetsVertical[i];
    const blur=bloom.separableBlurMaterials[i];
    if(target.width!==vertical.width || target.height!==vertical.height ||
       blur.uniforms.invSize.value.x!==1/target.width ||
       blur.uniforms.invSize.value.y!==1/target.height) throw Error("paired blur targets");
    return [target.width,target.height,blur.defines.KERNEL_RADIUS];
  });
}
const before=read();
bloom.setSize(1,63);
document.querySelector("#r160").textContent=JSON.stringify([...before,...read(),-1,77,5]);
bloom.dispose();
</script>
