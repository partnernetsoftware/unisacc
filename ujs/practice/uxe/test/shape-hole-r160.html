<!doctype html>
<meta charset="utf-8">
<pre id="r160">pending</pre>
<script type="module">
import { ShapeUtils, Vector2, REVISION } from "../../web/game/three.module.js";
if (REVISION !== "160") throw new Error("three.js revision mismatch");
const outer = [[0, 0], [4, 0], [4, 4], [0, 4]].map(e => new Vector2(...e));
const hole = [[1, 1], [1, 3], [3, 3], [3, 1]].map(e => new Vector2(...e));
const points = [...outer, ...hole];
const triangles = ShapeUtils.triangulateShape(outer, [hole]);
let area = 0, bad = 0, inside = 0;
for (const triple of triangles) {
  const p = triple.map(i => points[i]);
  const triangleArea = ShapeUtils.area(p);
  area += triangleArea;
  bad += Number(triangleArea <= 0);
  const [x, y] = p.reduce(([x, y], q) => [x + q.x / 3, y + q.y / 3], [0, 0]);
  inside += Number(x > 1 && x < 3 && y > 1 && y < 3);
}
document.querySelector("#r160").textContent = JSON.stringify([triangles.length, area, bad, inside]);
</script>
