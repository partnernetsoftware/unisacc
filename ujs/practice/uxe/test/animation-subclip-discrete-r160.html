<!doctype html>
<meta charset="utf-8">
<pre id="r160">pending</pre>
<script type="module">
import { AnimationClip, AnimationUtils, BooleanKeyframeTrack, REVISION, StringKeyframeTrack } from "../../web/game/three.module.js";
if (REVISION !== "160") throw new Error("three.js revision mismatch");
const source = new AnimationClip("a",1,[
  new BooleanKeyframeTrack("flag",[0,1],[false,true]),
  new StringKeyframeTrack("label",[0,1],["a","b"]),
]);
const trimmed = AnimationUtils.subclip(source,"t",30,60,30);
const [flag, label] = trimmed.tracks;
const first = label.createInterpolant().evaluate(0)[0];
source.tracks[1].values[1] = "a";
document.querySelector("#r160").textContent = JSON.stringify([
  trimmed.tracks.length, Number(flag.createInterpolant().evaluate(0)[0]), first.charCodeAt(0),
  first.length, label.values[0].charCodeAt(0), label.getInterpolation(),
]);
</script>
