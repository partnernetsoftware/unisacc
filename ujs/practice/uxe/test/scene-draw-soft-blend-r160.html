<!doctype html>
<meta charset="utf-8">
<pre id="r160">pending</pre>
<script type="module">
import { BufferGeometry, Camera, Float32BufferAttribute, Mesh, MeshBasicMaterial, REVISION, Scene, WebGLRenderer } from "../../web/game/three.module.js";
const out=document.querySelector("#r160");
try {
  if(REVISION!=="160") throw new Error("reference revision");
  const renderer=new WebGLRenderer({alpha:false,preserveDrawingBuffer:true});
  renderer.setSize(4,4);
  renderer.setClearColor(0xff0000,1);
  const scene=new Scene();
  const camera=new Camera();
  const geometry=new BufferGeometry().setAttribute("position",new Float32BufferAttribute([
    -.5,.5,0,.5,.5,0,.5,-.5,0,-.5,.5,0,.5,-.5,0,-.5,-.5,0,
  ],3));
  const material=new MeshBasicMaterial({color:0x0000ff,opacity:.5,transparent:true,depthWrite:false,side:2});
  scene.add(new Mesh(geometry,material));
  renderer.render(scene,camera);
  const gl=renderer.getContext();
  const pixels=new Uint8Array(64);
  gl.readPixels(0,0,4,4,gl.RGBA,gl.UNSIGNED_BYTE,pixels);
  let hits=0;
  for(let i=0;i<64;i+=4) if(pixels[i+2]>0) hits++;
  out.textContent=JSON.stringify([hits,Number(pixels[36]===128&&pixels[38]===127),.75,1,1]);
  renderer.dispose();
  geometry.dispose();
  material.dispose();
} catch(error) { out.textContent="error:"+error.message; }
</script>
