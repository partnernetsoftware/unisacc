<!doctype html>
<meta charset="utf-8">
<pre id="r160">pending</pre>
<script type="module">
import { Box2, Vector2, REVISION } from "../../web/game/three.module.js";
if (REVISION !== "160") throw new Error("three.js revision mismatch");
const v=(x,y)=>new Vector2(x,y);
const a=new Box2(v(-2,-1),v(4,3));
const b=new Box2(v(2,-4),v(7,1));
const p=v(7,7), center=v(1,1), size=v(6,4);
document.querySelector("#r160").textContent=JSON.stringify([
  new Box2().set(a.min,a.max).min.x,
  new Box2().setFromPoints([center,p,v(-2,3)]).max.y,
  new Box2().setFromCenterAndSize(center,size).min.y,
  a.clone().max.x,new Box2().copy(a).max.y,
  Number(a.clone().makeEmpty().isEmpty()), Number(a.isEmpty()),
  a.getCenter(v()).x,a.getSize(v()).x,
  a.clone().expandByPoint(p).max.y,a.clone().expandByVector(center).min.y,
  a.clone().expandByScalar(2).max.x,
  Number(a.containsPoint(center)),Number(a.containsBox(b)),
  a.getParameter(center,v()).y,Number(a.intersectsBox(b)),
  a.clampPoint(p,v()).x,a.distanceToPoint(p),
  a.clone().intersect(b).max.y,a.clone().union(b).min.y,
  a.clone().translate(center).min.x,Number(a.equals(a.clone())),
  Number(a.clone().intersect(new Box2(v(5,6),v(7,8))).isEmpty()),
  a.clone().makeEmpty().getCenter(v()).y
]);
</script>
