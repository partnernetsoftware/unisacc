<!doctype html>
<meta charset="utf-8">
<pre id="r160">pending</pre>
<script type="module">
import { BatchedMesh, BufferGeometry, Float32BufferAttribute, Matrix4, MeshBasicMaterial, REVISION } from "../../web/game/three.module.js";
if (REVISION !== "160") throw new Error("revision mismatch");
const geometry = new BufferGeometry();
geometry.setAttribute("position", new Float32BufferAttribute([0,0,0,1,0,0,0,1,0], 3));
geometry.setIndex([0,1,2]);
const batch = new BatchedMesh(3, 32, 48, new MeshBasicMaterial());
const near = batch.addGeometry(geometry);
const far = batch.addGeometry(geometry);
batch.setMatrixAt(near, new Matrix4().makeTranslation(5, 0, 0));
batch.setMatrixAt(far, new Matrix4().makeTranslation(11, 0, 0));
const matrix = new Matrix4();
const translation = id => {
  batch.getMatrixAt(id, matrix);
  return matrix.elements[12];
};
// The last three cases are UXE bounds and lifetime checks.
document.querySelector("#r160").textContent = JSON.stringify([translation(near), translation(far), -1, -1, -1]);
</script>
