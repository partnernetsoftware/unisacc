<!doctype html>
<meta charset="utf-8">
<pre id="r160">pending</pre>
<script type="importmap">{"imports":{"three":"../../web/game/three.module.js"}}</script>
<script type="module">
import {DataTexture,OrthographicCamera,REVISION,Scene,Vector2,WebGLRenderer,WebGLRenderTarget} from "three";
const output = document.querySelector("#r160");
try {
  if (REVISION !== "160") throw new Error("three.js revision mismatch");
  const root = new URLSearchParams(location.search).get("package");
  const {OutlinePass} = await import(`file://${root}/examples/jsm/postprocessing/OutlinePass.js`);
  const canvas = document.createElement("canvas");
  const context = canvas.getContext("webgl2");
  if (!context) throw new Error("WebGL2 required");
  const renderer = new WebGLRenderer({canvas,context});
  const pass = new OutlinePass(new Vector2(4,1),new Scene(),new OrthographicCamera(),[]);
  const target = new WebGLRenderTarget(4,1);
  const material = pass.overlayMaterial;
  const mask = new DataTexture(Uint8Array.from(Array(4).fill([255,255,0,255]).flat()),4,1);
  const edge = new DataTexture(Uint8Array.of(
    30,60,90,0, 30,60,90,85, 30,60,90,170, 255,192,36,255),4,1);
  mask.needsUpdate = edge.needsUpdate = true;
  material.uniforms.maskTexture.value = mask;
  material.uniforms.edgeTexture1.value = edge;
  material.uniforms.edgeTexture2.value = edge;
  material.uniforms.edgeGlow.value = 0;
  material.uniforms.edgeStrength.value = 1;
  material.uniforms.usePatternTexture.value = false;
  pass.fsQuad.material = material;
  renderer.setRenderTarget(target);
  renderer.autoClear = false;
  context.clearColor(60/255,90/255,120/255,30/255);
  context.clear(context.COLOR_BUFFER_BIT | context.DEPTH_BUFFER_BIT);
  pass.fsQuad.render(renderer);
  const bytes = new Uint8Array(16);
  renderer.readRenderTargetPixels(target,0,0,4,1,bytes);
  const view = new DataView(bytes.buffer);
  output.textContent = JSON.stringify([...Array.from({length:4},(_,i)=>view.getUint32(4*i,true)),-1,-1]);
  renderer.setRenderTarget(null);
  edge.dispose();
  mask.dispose();
  target.dispose();
  pass.dispose();
  renderer.dispose();
} catch(error) {
  output.textContent = `error:${error.message}`;
}
</script>
