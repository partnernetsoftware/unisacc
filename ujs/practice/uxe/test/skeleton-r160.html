<!doctype html>
<meta charset="utf-8">
<pre id="r160">pending</pre>
<script type="module">
import { Bone, Skeleton, REVISION } from "../../web/game/three.module.js";
if (REVISION !== "160") throw new Error("three.js revision mismatch");
const a = new Bone(), b = new Bone();
a.matrixWorld.makeTranslation(2,0,0);
b.matrixWorld.makeTranslation(0,5,0);
const skeleton = new Skeleton([a,b]);
a.matrixWorld.makeTranslation(3,0,0);
b.matrixWorld.makeTranslation(0,8,0);
skeleton.update();
document.querySelector("#r160").textContent = JSON.stringify([
  skeleton.boneInverses[0].elements[12], skeleton.boneInverses[1].elements[13],
  skeleton.boneMatrices[12], skeleton.boneMatrices[29], -1, -1
]);
</script>
