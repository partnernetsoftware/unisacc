<!doctype html>
<meta charset="utf-8">
<pre id="r160">pending</pre>
<script type="module">
import { CatmullRomCurve3, REVISION, Vector3 } from "../../web/game/three.module.js";
if (REVISION !== "160") throw Error("r160 revision mismatch");
const modes = ["catmullrom", "centripetal", "chordal"];
const values = modes.map((mode) => {
  const source = new CatmullRomCurve3([0, 1, 5].map(x => new Vector3(x, 0, 0)), false, mode, 0.5);
  const curve = new CatmullRomCurve3().fromJSON(JSON.parse(JSON.stringify(source.toJSON())));
  return curve.getPoint(0.5).x + curve.getLength() + 10 * modes.indexOf(curve.curveType);
});
document.querySelector("#r160").textContent = JSON.stringify(values);
</script>
