<!doctype html>
<meta charset="utf-8">
<pre id="r160">pending</pre>
<script type="module">
import { Bone, Matrix4, ObjectLoader, REVISION, Skeleton, SkinnedMesh } from "../../web/game/three.module.js";
if (REVISION !== "160") throw Error("r160 revision mismatch");
const mesh = new SkinnedMesh();
const bone = new Bone();
mesh.add(bone);
mesh.bindMode = "detached";
const skeleton = new Skeleton([bone]);
skeleton.uuid = "s";
mesh.bind(skeleton,new Matrix4().makeScale(2,1,1));
const data = mesh.toJSON();
const result = new ObjectLoader().parse(data);
document.querySelector("#r160").textContent = JSON.stringify([
  result.bindMode === "detached" ? 2 : 1,
  result.bindMatrix.elements[0],
  result.bindMatrixInverse.elements[0],
  Number(result.skeleton.uuid === data.object.skeleton),
  -9
]);
</script>
