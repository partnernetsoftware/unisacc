<!doctype html>
<meta charset="utf-8">
<pre id="r160">pending</pre>
<script type="module">
import { REVISION, ShapePath } from "../../web/game/three.module.js";
if (REVISION !== "160") throw new Error("three.js revision mismatch");
const path = new ShapePath();
for (const x of [0,8]) {
  path.moveTo(x,0).lineTo(x+4,0).lineTo(x,4);
  path.currentPath.closePath();
}
const shapes = path.toShapes(false);
document.querySelector("#r160").textContent = JSON.stringify([
  shapes.length, Number(shapes[1].curves === path.subPaths[1].curves), shapes[0].holes.length,
  path.toShapes(true).length, -1,
]);
</script>
