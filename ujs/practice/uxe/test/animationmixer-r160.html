<!doctype html>
<meta charset="utf-8">
<pre id="r160">pending</pre>
<script type="module">
import { AnimationClip, AnimationMixer, NumberKeyframeTrack, Object3D, REVISION } from "../../web/game/three.module.js";
if (REVISION !== "160") throw new Error("three.js revision mismatch");
const root = new Object3D();
root.position.y = 10;
const mixer = new AnimationMixer(root);
const clip = end => new AnimationClip("x", 1, [new NumberKeyframeTrack(".position[y]", [0, 1], [0, end])]);
mixer.clipAction(clip(20)).setEffectiveWeight(0.25).play();
mixer.clipAction(clip(40)).setEffectiveWeight(0.5).play();
mixer.update(0.5);
const before = [mixer.time, root.position.y];
mixer.update(0.25);
const animated = [root.position.y, root.position.x];
mixer.stopAllAction();
const stopped = root.position.y;
mixer.update(0.25);
document.querySelector("#r160").textContent = JSON.stringify([...before, ...animated, -1, before[1], stopped, root.position.y]);
</script>
