<!doctype html>
<meta charset="utf-8">
<pre id="r160">pending</pre>
<script type="module">
import { REVISION, Vector2, Vector3, LineCurve, QuadraticBezierCurve, QuadraticBezierCurve3,
  CubicBezierCurve, CubicBezierCurve3 } from "../../web/game/three.module.js";
const result = document.querySelector("#r160");
try {
  if (REVISION !== "160") throw new Error("revision mismatch");
  const fixtures = [[LineCurve, Vector2, 1], [QuadraticBezierCurve, Vector2, 2],
    [QuadraticBezierCurve3, Vector3, 2], [CubicBezierCurve, Vector2, 3],
    [CubicBezierCurve3, Vector3, 3]];
  result.textContent = JSON.stringify(fixtures.flatMap(([Class, Vector, degree]) => {
    const controls = Array.from({ length: degree + 1 }, (_, i) => new Vector(i === degree ? 8 : 0, 0));
    const curve = new Class(...controls);
    const defaults = new Class();
    const refs = degree === 1 ? ["v1", "v2"] : ["v0", "v1", "v2", "v3"];
    const construct = curve.arcLengthDivisions === 200 && curve[refs[0]] === controls[0] &&
      defaults[refs[0]] !== defaults[refs[1]];
    curve.arcLengthDivisions = 4;
    const u = 0.5 ** degree;
    const mapping = curve.getPointAt(u).x === 8 * u && curve.getUtoTmapping(u) === 0.5 &&
      curve.getUtoTmapping(0, 8 * u) === 0.5 && curve.getLength() === 8;
    const points = curve.getPoints(4)[2].x === 8 * u && curve.getSpacedPoints(1 / u)[1].x === 8 * u;
    const tangent = Math.abs(curve.getTangent(0.5).x - 1) < 1e-12 && Math.abs(curve.getTangentAt(u).x - 1) < 1e-12;
    const { tangents, normals, binormals } = curve.computeFrenetFrames(2, false);
    const frames = Vector === Vector3
      ? Math.abs(tangents[1].x - 1) < 1e-12 && Math.abs(normals[1].z + 1) < 1e-12 &&
        Math.abs(binormals[1].y - 1) < 1e-12
      : tangents[1].x > 0 && Number.isNaN(tangents[1].z) &&
        [...normals[1].toArray(), ...binormals[1].toArray()].every(Number.isNaN);
    const old = curve.getLengths();
    controls.at(-1).x = 16;
    const stale = curve.getPoint(1).x === 16 && old === curve.getLengths() && curve.getLength() === 8;
    curve.updateArcLengths();
    const cache = stale && curve.getLength() === 16;
    return [construct, mapping, points, tangent, frames, cache].map(pass => Number(!pass));
  }));
} catch (error) { result.textContent = String(error); }
</script>
