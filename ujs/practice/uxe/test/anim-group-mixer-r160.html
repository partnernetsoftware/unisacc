<!doctype html>
<meta charset="utf-8">
<pre id="r160">pending</pre>
<script type="module">
import { AnimationClip, AnimationMixer, AnimationObjectGroup, NumberKeyframeTrack, Object3D, REVISION }
  from "../../web/game/three.module.js";
const status=document.querySelector("#r160");
try {
  if(REVISION!=="160") throw new Error("Three.js revision");
  function scene() {
    const a=new Object3D(), b=new Object3D(), c=new Object3D();
    a.position.y=10;
    b.position.y=2;
    c.position.y=30;
    const group=new AnimationObjectGroup(a,b,c);
    group.remove(b);
    const mixer=new AnimationMixer(group);
    const clip=new AnimationClip("move",1,[new NumberKeyframeTrack(".position[y]",[0,1],[0,40])]);
    mixer.clipAction(clip).play();
    return {a,b,c,group,mixer};
  }
  const half=scene(); half.mixer.update(0.5);
  const still=scene(); still.mixer.update(0.25);
  const later=scene(); later.mixer.update(0.5).update(0.25);
  const moved=scene();
  moved.mixer.update(0.5);
  moved.group.remove(moved.c);
  moved.group.add(moved.b);
  moved.mixer.update(0.25);
  const beforeStop=[moved.b.position.y,moved.c.position.y];
  moved.mixer.stopAllAction();
  const stopped=scene(); stopped.mixer.update(0.5).update(0.25).stopAllAction();
  const after=scene();
  after.mixer.update(0.5).stopAllAction();
  after.c.position.y=99;
  after.mixer.update(0.25);
  status.textContent=JSON.stringify([
    half.a.position.y,half.b.position.y,half.c.position.y,half.mixer.time,
    still.c.position.y,later.c.position.y,...beforeStop,stopped.a.position.y,stopped.b.position.y,stopped.c.position.y,
    moved.b.position.y,moved.c.position.y,after.c.position.y,-1,0,10,-1,20,1,10,
  ]);
} catch(error) {
  status.textContent=`error:${error.message}`;
}
</script>
