<!doctype html>
<meta charset="utf-8">
<pre id="r160">pending</pre>
<script type="module">
import { BufferGeometry, Float32BufferAttribute, Group, Mesh, MeshBasicMaterial, ObjectLoader, REVISION, Scene }
  from "../../web/game/three.module.js";
if(REVISION!=="160") throw new Error("three.js revision mismatch");
const geometry=new BufferGeometry();
geometry.setAttribute("position",new Float32BufferAttribute([0,0,0,1,0,0,0,1,0],3));
geometry.uuid="geo-a";
const material=new MeshBasicMaterial();
material.uuid="mat-a";
const scene=new Scene(),group=new Group(),first=new Mesh(geometry,material),second=new Mesh(geometry,material);
scene.position.x=1;
group.position.x=2;
first.position.x=3;
second.position.x=8;
scene.add(group,second);
group.add(first);
scene.updateMatrixWorld();
const loaded=new ObjectLoader().parse(scene.toJSON());
loaded.updateMatrixWorld();
const meshes=[];
loaded.traverse(node=>{if(node.isMesh) meshes.push(node);});
const [a,b]=meshes;
document.querySelector("#r160").textContent=JSON.stringify([
  meshes.length,a.geometry.uuid==="geo-a"?11:0,a.material.uuid==="mat-a"?19:0,
  Number(a.geometry===b.geometry&&a.material===b.material),a.matrixWorld.elements[12],b.matrixWorld.elements[12],-5,0,-1,-3,
]);
</script>
