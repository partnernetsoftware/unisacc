<!doctype html>
<meta charset="utf-8">
<title>D1 场景投影探针</title>
<pre id="result">准备中</pre>
<script type="module">
import { linkUxeModules } from "./host-abi.js";

function load(name) {
  const request = new XMLHttpRequest();
  request.open("GET", name + ".wasm", false);
  request.overrideMimeType("text/plain; charset=x-user-defined");
  request.send();
  return new WebAssembly.Module(Uint8Array.from(request.responseText, c => c.charCodeAt(0) & 255));
}

const result = document.querySelector("#result");
try {
  const modules = linkUxeModules([
    ["uxe_d1_scene_v1", load("base")],
    ["uxe_d1_scene_probe_v1", load("product")]
  ], {});
  const read = modules.get("uxe_d1_scene_probe_v1").uxe_d1_scene_probe;
  const values = [];
  for (let frame = 0n; frame < 4n; frame++) {
    for (let component = 0n; component < 5n; component++) {
      values.push(read(frame, component));
    }
  }
  result.textContent = JSON.stringify(values);
} catch (error) {
  result.textContent = String(error);
}
</script>
