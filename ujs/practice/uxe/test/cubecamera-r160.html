<!doctype html>
<meta charset="utf-8">
<pre id="r160">pending</pre>
<script type="module">
import { CubeCamera, WebGLCubeRenderTarget, Vector3, REVISION } from "../../web/game/three.module.js";
if (REVISION !== "160") throw new Error("three.js revision mismatch");
const cube = new CubeCamera(0.5, 21, new WebGLCubeRenderTarget(4));
const direction = new Vector3();
const values = [];
for (const coordinateSystem of [2000, 2001]) {
  cube.coordinateSystem = coordinateSystem;
  cube.updateCoordinateSystem();
  cube.updateMatrixWorld();
  const [px, nx, py, ny, pz, nz] = cube.children;
  if (coordinateSystem === 2000) {
    values.push(px.getWorldDirection(direction).x, nx.getWorldDirection(direction).x,
      py.getWorldDirection(direction).y, py.up.z, ny.getWorldDirection(direction).y,
      ny.up.z, pz.getWorldDirection(direction).z, nz.getWorldDirection(direction).z);
  } else {
    values.push(px.getWorldDirection(direction).x, px.up.y, py.up.z, ny.up.z,
      pz.getWorldDirection(direction).z, pz.up.y, nz.getWorldDirection(direction).z);
  }
}
document.querySelector("#r160").textContent = JSON.stringify(values);
</script>
