<!doctype html>
<meta charset="utf-8">
<pre id="r160">pending</pre>
<script type="module">
import { PerspectiveCamera, REVISION, StereoCamera } from "../../web/game/three.module.js";
if (REVISION !== "160") throw new Error("three.js revision mismatch");
const camera = new PerspectiveCamera(90, 2, 1, 11);
camera.position.set(3, 4, 5);
camera.focus = 10;
camera.updateMatrixWorld();
const stereo = new StereoCamera();
stereo.update(camera);
const { cameraL: left, cameraR: right } = stereo;
const rightView = right.matrixWorld.clone().invert();
document.querySelector("#r160").textContent = JSON.stringify([
  left.layers.mask, right.layers.mask, left.fov, left.matrixWorld.elements[12], rightView.elements[12],
  left.projectionMatrix.elements[8], -1, -1,
]);
</script>
