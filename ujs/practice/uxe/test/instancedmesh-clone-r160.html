<!doctype html>
<meta charset="utf-8">
<pre id="r160">pending</pre>
<script type="module">
import { BufferGeometry, Color, InstancedMesh, Matrix4, MeshBasicMaterial, REVISION }
  from "../../web/game/three.module.js";
if (REVISION !== "160") throw new Error("three.js revision mismatch");
const source = new InstancedMesh(new BufferGeometry(),new MeshBasicMaterial(),2);
source.setMatrixAt(1,new Matrix4().makeTranslation(3,0,0));
source.setColorAt(1,new Color(0.5,0.25,0.75));
source.count = 1;
const clone = source.clone();
const count = clone.count, matrix = new Matrix4(), color = new Color();
clone.count = 2;
clone.getColorAt(1,color);
clone.getMatrixAt(1,matrix);
const position = matrix.elements[12];
clone.instanceMatrix.array[28] = 9;
document.querySelector("#r160").textContent = JSON.stringify([
  Number(clone.geometry === source.geometry && clone.material === source.material),
  count,position,color.r,source.instanceMatrix.array[28],-2,
]);
</script>
