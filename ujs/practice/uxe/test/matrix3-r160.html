<!doctype html>
<meta charset="utf-8">
<pre id="r160">pending</pre>
<script type="module">
import { Matrix3, Matrix4, REVISION, Vector3 } from "../../web/game/three.module.js";
if (REVISION !== "160") throw new Error("three.js revision mismatch");
const a = new Matrix3().set(2,1,3, 0,4,5, 1,0,6);
const b = new Matrix3().set(1,2,0, 0,1,0, 0,0,2);
const scale = new Matrix4().makeScale(2, 3, 4).setPosition(9, 8, 7);
const basis = [new Vector3(), new Vector3(), new Vector3()];
const rowMajor = [];
a.extractBasis(...basis);
a.transposeIntoArray(rowMajor);
document.querySelector("#r160").textContent = JSON.stringify([
  a.elements[6], a.clone().identity().elements[4], a.clone().copy(b).elements[3],
  a.clone().elements[2], basis[2].y, new Matrix3().setFromMatrix4(scale).elements[8],
  a.clone().multiply(b).elements[3], a.clone().premultiply(b).elements[3],
  new Matrix3().multiplyMatrices(a, b).elements[3], a.clone().multiplyScalar(2).elements[7],
  a.determinant(), a.clone().invert().elements[6],
  new Matrix3().set(1,2,3, 2,4,6, 4,8,12).invert().elements[0],
  a.clone().transpose().elements[1], new Matrix3().getNormalMatrix(scale).elements[4],
  rowMajor[1], new Matrix3().setUvTransform(2,3,4,5,0,0.5,0.25).elements[6],
  a.clone().scale(2,3).elements[4], new Matrix3().rotate(Math.PI/2).elements[1],
  a.clone().translate(2,3).elements[6], new Matrix3().makeTranslation(-2,3).elements[6],
  new Matrix3().makeRotation(Math.PI/2).elements[1], new Matrix3().makeScale(2,3).elements[4],
  Number(a.equals(a.clone())), Number(a.equals(b)),
  new Matrix3().fromArray([0,...a.elements],1).elements[7], a.toArray([],1)[9],
  a.clone().multiplyMatrices(a, a).elements[0]
]);
</script>
