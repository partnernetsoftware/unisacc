<!doctype html>
<meta charset="utf-8">
<pre id="r160">pending</pre>
<script type="module">
import { StringKeyframeTrack, InterpolateSmooth, REVISION } from "../../web/game/three.module.js";
if (REVISION !== "160") throw new Error("three.js revision mismatch");
const track = new StringKeyframeTrack("x", [0, 2, 4], ["A", "桥", ""]);
track.setInterpolation(InterpolateSmooth);
const f = track.createInterpolant();
const bytes = t => new TextEncoder().encode(f.evaluate(t)[0]);
document.querySelector("#r160").textContent = JSON.stringify([
  track.getInterpolation(), bytes(1.99)[0], bytes(2)[0], bytes(2).length, bytes(4).length, -2
]);
</script>
