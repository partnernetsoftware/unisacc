<!doctype html>
<meta charset="utf-8">
<pre id="r160">pending</pre>
<script type="module">
import { AmbientLight, DirectionalLight, HemisphereLight, LightProbe, ObjectLoader, PointLight,
  RectAreaLight, REVISION, SpotLight } from "../../web/game/three.module.js";
if (REVISION !== "160") throw new Error("three.js revision mismatch");
const ambient = new AmbientLight(0xff0000, 1.5);
ambient.visible = false;
ambient.layers.disableAll();
ambient.layers.enable(31);
const directional = new DirectionalLight(0xffffff, 3);
directional.shadow.bias = 0.125;
directional.shadow.normalBias = 0.25;
directional.shadow.mapSize.set(128, 256);
const spot = new SpotLight(0xffffff, 4, 42, 0.5, 0.25);
spot.shadow.radius = 2;
const probe = new LightProbe(undefined, 6);
probe.sh.coefficients[8].set(1, 2, 3);
const sources = [ambient, new HemisphereLight(0x00ff00, 0x0000ff, 2), directional,
  new PointLight(0xffffff, 2, 20, 1), spot, new RectAreaLight(0xffffff, 2, 4, 5), probe];

function project(camera) {
  const out = {type: camera.type};
  if (camera.type === "OrthographicCamera") {
    for (const key of ["left", "right", "top", "bottom"]) out[key] = camera[key];
  } else {
    for (const key of ["fov", "aspect"]) out[key] = camera[key];
  }
  for (const key of ["near", "far", "zoom"]) out[key] = camera[key];
  return out;
}

function canonical(source) {
  const wire = JSON.parse(JSON.stringify(source.toJSON()));
  const restored = source.isLightProbe ? new LightProbe().fromJSON(wire.object) : new ObjectLoader().parse(wire);
  const json = restored.toJSON().object;
  const out = {type: json.type, color: json.color, intensity: json.intensity};
  for (const key of ["groundColor", "distance", "angle", "penumbra", "decay", "width", "height", "sh"]) {
    if (Object.hasOwn(json, key)) out[key] = json[key];
  }
  if (json.shadow) {
    out.shadow = {camera: project(json.shadow.camera)};
    for (const key of ["bias", "normalBias", "radius", "mapSize"]) {
      if (Object.hasOwn(json.shadow, key)) out.shadow[key] = json.shadow[key];
    }
  }
  if (Object.hasOwn(json, "visible")) out.visible = json.visible;
  out.layers = json.layers;
  return JSON.stringify({object: out});
}

function hash(text) {
  let value = 0;
  for (const byte of new TextEncoder().encode(text)) value = (value * 131 + byte) % 16777213;
  return value;
}

document.querySelector("#r160").textContent = JSON.stringify([...sources.map(source => hash(canonical(source))), -1, -1]);
</script>
