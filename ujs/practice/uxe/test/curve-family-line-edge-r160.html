<!doctype html>
<meta charset="utf-8">
<pre id="r160">pending</pre>
<script type="module">
import { REVISION, LineCurve, Vector2 } from "../../web/game/three.module.js";
const result = document.querySelector("#r160");
try {
  if (REVISION !== "160") throw new Error("revision mismatch");
  const start = new Vector2(1, 2), end = new Vector2(4, 6);
  const line = new LineCurve(start, end);
  line.arcLengthDivisions = 5;
  const outside = line.getPointAt(-1);
  const distanceT = line.getUtoTmapping(0, 3);
  const closest = line.getTangentAt(0.25);
  const frames = line.computeFrenetFrames(2, false);
  const closed = line.computeFrenetFrames(2, true);
  const framesOK = value => value.tangents.length === 3 &&
    value.tangents.every(t => t.x === 3 && t.y === 4 && Number.isNaN(t.z)) &&
    [...value.normals, ...value.binormals].every(v => v.toArray().every(Number.isNaN));
  const zero = line.getPoints(0);
  const zeroSpaced = line.getSpacedPoints(0);
  const allNaN = values => values.length === 1 && values[0].toArray().every(Number.isNaN);
  const flat = new LineCurve(start, start);
  flat.arcLengthDivisions = 5;
  const aliases = new LineCurve(end, start);
  aliases.copy(line);
  const zeroTangent = flat.getTangent(0).length();
  result.textContent = JSON.stringify([
    outside.x, closest.y, distanceT, Number(framesOK(frames)),
    Number(framesOK(closed)), Number(allNaN(zero)), Number(allNaN(zeroSpaced)),
    flat.getUtoTmapping(0.9), zeroTangent, Number(aliases.v1 === end && aliases.v2 === start), start.x, end.x,
  ]);
} catch (error) { result.textContent = String(error); }
</script>
