<!doctype html>
<meta charset="utf-8">
<pre id="r160">pending</pre>
<script type="module">
import { PropertyMixer, Quaternion, REVISION, Vector3 } from "../../web/game/three.module.js";
if (REVISION !== "160") throw new Error("three.js revision mismatch");
const x = new Quaternion().setFromAxisAngle(new Vector3(1,0,0), Math.PI/2).toArray();
const z = new Quaternion().setFromAxisAngle(new Vector3(0,0,1), Math.PI/2).toArray();
const opposite = x.map(component => -component);
function result(samples, secondFrame=false) {
  let value = [0,0,0,1];
  const binding = {
    getValue(buffer, offset) { buffer.set(value, offset); },
    setValue(buffer, offset) { value = Array.from(buffer.slice(offset, offset+4)); },
  };
  const mixer = new PropertyMixer(binding, "quaternion", 4);
  mixer.saveOriginalState();
  for (const [sample, weight, additive] of samples) {
    mixer.buffer.set(sample, 0);
    if (additive) mixer.accumulateAdditive(weight);
    else mixer.accumulate(0, weight);
  }
  mixer.apply(0);
  if (secondFrame) mixer.apply(1);
  return value;
}
document.querySelector("#r160").textContent = JSON.stringify([
  result([[x,.5]])[0], result([[x,.5,true]])[0], result([[x,1],[z,1,true]])[1],
  result([[x,.5],[opposite,.5]])[0], result([[x,1]],true)[3], -1, -1,
]);
</script>
