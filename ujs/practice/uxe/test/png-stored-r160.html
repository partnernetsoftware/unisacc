<!doctype html>
<meta charset="utf-8">
<pre id="r160">pending</pre>
<script type="module">
import { ImageLoader, REVISION } from "../../web/game/three.module.js";
if (REVISION !== "160") throw new Error("three.js revision mismatch");
const canvas = document.createElement("canvas");
canvas.width = canvas.height = 1;
const context = canvas.getContext("2d");
context.putImageData(new ImageData(Uint8ClampedArray.of(255, 0, 128, 255), 1, 1), 0, 0);
const image = await new ImageLoader().loadAsync(canvas.toDataURL("image/png"));
context.clearRect(0, 0, 1, 1);
context.drawImage(image, 0, 0);
const rgba = context.getImageData(0, 0, 1, 1).data;
document.querySelector("#r160").textContent = JSON.stringify([rgba.length, rgba[0], rgba[2], rgba[3], -5, -3, -6, 77, -1, 35, 45, 59, 69, 20]);
</script>
