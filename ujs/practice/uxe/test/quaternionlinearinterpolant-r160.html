<!doctype html>
<meta charset="utf-8">
<pre id="r160">pending</pre>
<script type="module">
import { QuaternionLinearInterpolant, REVISION } from "../../web/game/three.module.js";
if (REVISION !== "160") throw new Error("three.js revision mismatch");
const times = new Float32Array([0, 2]);
const make = (z, w) => new QuaternionLinearInterpolant(times, new Float32Array([0, 0, 0, 1, 0, 0, z, w]), 4);
const f = make(-1, 0), opposite = make(0, -1);
document.querySelector("#r160").textContent = JSON.stringify([
  f.evaluate(-1)[3], f.evaluate(1)[2], f.evaluate(1)[3], f.evaluate(2)[2], opposite.evaluate(1)[3], -1
]);
</script>
