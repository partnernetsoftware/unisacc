<!doctype html>
<meta charset="utf-8">
<pre id="r160">pending</pre>
<script type="importmap">{"imports":{"three":"../../web/game/three.module.js"}}</script>
<script type="module">
import { REVISION } from "three";
const status=document.querySelector("#r160");
try{
  if(REVISION!=="160") throw new Error("three.js revision mismatch");
  const root=new URLSearchParams(location.search).get("package");
  const {EffectComposer}=await import(`file://${root}/examples/jsm/postprocessing/EffectComposer.js`);
  const renderer={getSize:target=>target.set(40,20),getPixelRatio:()=>1,getRenderTarget:()=>null,setRenderTarget:()=>{}};
  function build(){
    const composer=new EffectComposer(renderer);
    const ids=new Map([[composer.renderTarget1,7],[composer.renderTarget2,13]]);
    const calls=[];
    for(const [id,flags] of [[10,1],[20,2],[30,3],[40,5]]){
      composer.addPass({enabled:Boolean(flags&1),needsSwap:Boolean(flags&2),clear:Boolean(flags&4),
        setSize(){},render(renderer,write,read){
          calls.push([id,ids.get(read),ids.get(write),Number(this.renderToScreen),flags]);
        }});
    }
    return [composer,calls,ids];
  }
  const [composer,calls,ids]=build();
  composer.render(1/60);
  const [off,offCalls]=build();
  off.renderToScreen=false;
  off.render(1/60);
  composer.setSize(80,50);
  const width=composer.renderTarget1.width;
  status.textContent=JSON.stringify([
    calls.length,calls[1][0],calls[0][1],calls[2][1],calls[2][3],calls[2][4],ids.get(composer.readBuffer),
    -1,-1,offCalls[2][3],77,width,
  ]);
  composer.dispose();
  off.dispose();
}catch(error){status.textContent=`error:${error.message}`;}
</script>
