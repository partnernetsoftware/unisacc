<!doctype html>
<meta charset="utf-8">
<pre id="r160">pending</pre>
<script type="module">
import { Color, FogExp2, REVISION } from "../../web/game/three.module.js";
if (REVISION !== "160") throw new Error("three.js revision mismatch");
const source = new Color(0x804008);
const defaults = new FogExp2(source);
const fog = new FogExp2(source, 0.04);
fog.name = "mist";
const clone = fog.clone();
source.setHex(0);
fog.color.setHex(0x0000ff);
const json = fog.toJSON();
const values = [
  defaults.density, clone.name.length, clone.color.getHex(), clone.density,
  json.type === "FogExp2" ? 2 : 0, json.name.length, ...Array.from(json.name, c => c.charCodeAt(0)), json.color, json.density,
];
document.querySelector("#r160").textContent = JSON.stringify(values);
</script>
