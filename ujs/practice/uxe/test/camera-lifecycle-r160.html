<!doctype html>
<meta charset="utf-8">
<pre id="r160">pending</pre>
<script type="module">
import { ArrayCamera, OrthographicCamera, PerspectiveCamera, REVISION } from "../../web/game/three.module.js";
if (REVISION !== "160") throw new Error("three.js revision mismatch");
const camera = new PerspectiveCamera(60, 2, 1, 150);
const ortho = new OrthographicCamera(-3, 3, 2, -2, 0.5, 10);
ortho.zoom = 2;
for (const item of [camera, ortho]) item.setViewOffset(800, 400, 200, 100, 400, 200);
camera.filmOffset = 0.75;
camera.updateProjectionMatrix();
const copy = camera.clone();
const orthoClone = ortho.clone();
const orthoCopy = new OrthographicCamera().copy(ortho);
const arr = new ArrayCamera([camera, camera.clone()]);
const values = [copy.filmOffset, copy.view.offsetX, copy.projectionMatrix.elements[8] - camera.projectionMatrix.elements[8]];
copy.view.offsetX = 25;
values.push(camera.view.offsetX, orthoClone.zoom, orthoClone.projectionMatrix.elements[5] - ortho.projectionMatrix.elements[5],
  orthoCopy.view.height, arr.clone().cameras.length + 10 * arr.cameras.length, -1);
document.querySelector("#r160").textContent = JSON.stringify(values);
</script>
