<!doctype html>
<meta charset="utf-8">
<pre id="r160">pending</pre>
<script type="module">
import { Object3D, PropertyBinding, REVISION } from "../../web/game/three.module.js";
if (REVISION !== "160") throw new Error("three.js revision mismatch");
const root = new Object3D();
root.position.set(1, 2, 3);
const binding = new PropertyBinding(root, ".position[y]");
const out = [0];
binding.getValue(out, 0);
binding.setValue([7], 0);
root.updateMatrixWorld();
document.querySelector("#r160").textContent = JSON.stringify([out[0], root.position.y, root.position.x, root.matrixWorld.elements[13], -1, -1]);
</script>
