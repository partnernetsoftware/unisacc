<!doctype html>
<meta charset="utf-8">
<pre id="r160">pending</pre>
<script type="module">
import { AnimationClip, KeyframeTrack, NumberKeyframeTrack, VectorKeyframeTrack, ColorKeyframeTrack,
  QuaternionKeyframeTrack, BooleanKeyframeTrack, StringKeyframeTrack, InterpolateDiscrete, REVISION } from "../../web/game/three.module.js";
if(REVISION!=="160") throw Error("revision");
const times=[0,1];
const tracks=[new NumberKeyframeTrack(".x",times,[2,4],InterpolateDiscrete),
  new VectorKeyframeTrack(".v",times,[1,2,3,4]),new ColorKeyframeTrack(".c",times,[0,1,0,1,0,1]),
  new QuaternionKeyframeTrack(".q",times,[0,0,0,1,0,1,0,0]),new BooleanKeyframeTrack(".b",times,[true,false]),
  new StringKeyframeTrack(".s",times,["",'a"b'])];
const labels=["number","vector","color","quaternion","bool","string"];
const cases=tracks.map((track,i)=>{
  const json=KeyframeTrack.toJSON(track);
  const parsed=AnimationClip.parse({name:"roundtrip",duration:1,tracks:[JSON.parse(JSON.stringify(json))]}).tracks[0];
  if(json.type!==labels[i] || JSON.stringify(KeyframeTrack.toJSON(parsed))!==JSON.stringify(json)) throw Error("track round trip");
  return 1+i;
});
// UXE refuses nonintegral per-key stride before publishing the track.
document.querySelector("#r160").textContent=JSON.stringify([...cases,-2]);
</script>
