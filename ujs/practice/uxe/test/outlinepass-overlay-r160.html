<!doctype html>
<meta charset="utf-8">
<pre id="r160">pending</pre>
<script type="importmap">{"imports":{"three":"../../web/game/three.module.js"}}</script>
<script type="module">
import {
  DataTexture, NoBlending, RepeatWrapping, OrthographicCamera, REVISION, Scene, Vector2,
  WebGLRenderer, WebGLRenderTarget
} from "three";

const output = document.querySelector("#r160");
try {
  if (REVISION !== "160") throw new Error("three.js revision mismatch");
  const root = new URLSearchParams(location.search).get("package");
  const { OutlinePass } = await import(`file://${root}/examples/jsm/postprocessing/OutlinePass.js`);
  const canvas = document.createElement("canvas");
  const context = canvas.getContext("webgl2");
  if (!context) throw new Error("WebGL2 required");
  const renderer = new WebGLRenderer({ canvas, context });
  const pass = new OutlinePass(new Vector2(7, 1), new Scene(), new OrthographicCamera(), []);
  const target = new WebGLRenderTarget(7, 1);
  const overlay = pass.overlayMaterial;
  const textures = [];
  function upload(pixels) {
    const texture = new DataTexture(Uint8Array.from(pixels.flat()), pixels.length, 1);
    texture.needsUpdate = true;
    textures.push(texture);
    return texture;
  }
  overlay.uniforms.maskTexture.value = upload([
    [255,255,0,0], [255,0,0,0], [0,255,0,0], [127,255,0,0],
    [0,255,0,0], [0,254,0,0], [0,255,0,0],
  ]);
  overlay.uniforms.edgeTexture1.value = upload(Array(7).fill([18,38,62,82]));
  overlay.uniforms.edgeTexture2.value = upload(Array(7).fill([20,40,60,80]));
  // Under repeat wrapping, 6 * vUv maps the seven pixel centers to this permutation.
  const pattern = Array(14).fill([0,0,0,255]);
  [0,0,1,255,255,127,129].forEach((red, i) => {
    const index = 2 * ((10 - i) % 7);
    pattern[index] = pattern[(index + 13) % 14] = [red,0,0,255];
  });
  const patternTexture = upload(pattern);
  patternTexture.wrapS = RepeatWrapping;
  overlay.uniforms.patternTexture.value = patternTexture;
  overlay.blending = NoBlending;
  pass.fsQuad.material = overlay;
  renderer.setRenderTarget(target);
  function render(strength, glow, patternEnabled) {
    overlay.uniforms.edgeStrength.value = strength;
    overlay.uniforms.edgeGlow.value = glow;
    overlay.uniforms.usePatternTexture.value = patternEnabled;
    renderer.clear();
    pass.fsQuad.render(renderer);
    const bytes = new Uint8Array(28);
    renderer.readRenderTargetPixels(target, 0, 0, 7, 1, bytes);
    const view = new DataView(bytes.buffer);
    return Array.from({ length: 7 }, (_, i) => view.getUint32(i * 4, true));
  }
  const full = render(2, 0.5, true);
  const glowOff = render(2, 0, false);
  const saturated = render(16, 1, false);
  renderer.setRenderTarget(null);
  target.dispose();
  pass.dispose();
  textures.forEach(texture => texture.dispose());
  renderer.dispose();
  // Local refusal values belong to the independent cx guard checks.
  output.textContent = JSON.stringify([
    ...full, full.length, glowOff[0], saturated[0], -519,-1,-1,-1,-1,-1,-1,-1,-1,-1,
  ]);
} catch (error) {
  output.textContent = `error:${error.message}`;
}
</script>
