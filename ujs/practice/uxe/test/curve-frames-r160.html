<!doctype html>
<meta charset="utf-8">
<pre id="r160">pending</pre>
<script type="module">
import { LineCurve3, Vector3, REVISION } from "../../web/game/three.module.js";
if (REVISION !== "160") throw new Error("three.js revision mismatch");
const line = new LineCurve3(new Vector3(), new Vector3(0, 0, 2));
const f = line.computeFrenetFrames(2, false);
document.querySelector("#r160").textContent = JSON.stringify([
  Number(f.normals.length === 3), ...line.getSpacedPoints(2).map(v => v.z),
  f.normals[0].y, f.binormals[0].x, f.normals[2].y, f.binormals[2].x
]);
</script>
