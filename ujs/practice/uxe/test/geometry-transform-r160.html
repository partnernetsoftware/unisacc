<!doctype html>
<meta charset="utf-8">
<pre id="r160">pending</pre>
<script type="module">
import { BufferGeometry, BufferAttribute, REVISION } from "../../web/game/three.module.js";
if (REVISION !== "160") throw new Error("three.js revision mismatch");
function setup() {
  const g = new BufferGeometry();
  g.setAttribute("position", new BufferAttribute(new Float64Array([1, 2, 0, -1, -2, 1]), 3));
  g.setAttribute("normal", new BufferAttribute(new Float64Array([1, 1, 0, 0, 0, 0]), 3));
  g.setAttribute("tangent", new BufferAttribute(new Float64Array([1, 1, 0, -1, 0, 0, 0, 0]), 4));
  g.computeBoundingBox();
  g.computeBoundingSphere();
  return g;
}
const s = setup().scale(2, 1, 3), t = setup().translate(1, -1, 2);
const x = setup().rotateX(Math.PI / 2), y = setup().rotateY(Math.PI / 2), z = setup().rotateZ(Math.PI / 2);
document.querySelector("#r160").textContent = JSON.stringify([
  s.attributes.position.getZ(1), s.attributes.normal.getX(0), s.attributes.tangent.getX(0),
  s.attributes.tangent.getW(0), t.boundingBox.max.x, t.boundingSphere.center.z,
  s.boundingSphere.radius, x.attributes.position.getZ(0), y.attributes.position.getZ(0),
  z.attributes.position.getY(0), z.attributes.position.version
]);
</script>
