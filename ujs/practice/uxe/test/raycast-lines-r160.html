<!doctype html>
<meta charset="utf-8">
<pre id="r160">pending</pre>
<script type="module">
import { BufferGeometry, Float32BufferAttribute, Line, LineLoop, LineSegments, Raycaster, REVISION, Vector3 }
  from "../../web/game/three.module.js";
if (REVISION !== "160") throw new Error("three.js revision mismatch");
const geometry = new BufferGeometry();
geometry.setAttribute("position",new Float32BufferAttribute([-1,0.125,-4,1,0.125,-4,1,0.125,-2,-1,0.125,-2],3));
const line = new Line(geometry);
const segments = new LineSegments(geometry);
const ray = new Raycaster(new Vector3(),new Vector3(0,0,-1));
ray.params.Line.threshold = 0.2;
const hits = ray.intersectObject(line);
const pairs = ray.intersectObject(segments);
geometry.setDrawRange(1,4);
const partial = ray.intersectObject(segments);
geometry.setDrawRange(0,4);
geometry.setIndex([2,3,0,1]);
const indexed = ray.intersectObject(segments);
geometry.setIndex(null);
ray.far = 3;
const clipped = ray.intersectObject(line);
ray.far = Infinity;
ray.params.Line.threshold = 0.125;
const exact = ray.intersectObject(line);
const open = new BufferGeometry();
open.setAttribute("position",new Float32BufferAttribute([-1,0.125,-4,-1,2,-4,1,2,-2,1,0.125,-2],3));
ray.params.Line.threshold = 0.2;
const loop = ray.intersectObject(new LineLoop(open));
document.querySelector("#r160").textContent=JSON.stringify([
  hits.length,hits[0].index,hits[0].distance,hits[0].point.y,pairs.length,partial.length,
  indexed[0].index,clipped.length,-2,loop.length,exact.length,
]);
</script>
