<!doctype html>
<meta charset="utf-8">
<title>D1 projection probe</title>
<canvas></canvas>
<pre id="ux-link-result">pending</pre>
<script type="module">
import { createBrowserHost, linkUxe } from "./host-abi.js";

function bytes(name) {
  const request = new XMLHttpRequest();
  request.open("GET", name, false);
  request.overrideMimeType("text/plain; charset=x-user-defined");
  request.send();
  return Uint8Array.from(request.responseText, char => char.charCodeAt(0) & 255);
}

const result = document.querySelector("#ux-link-result");
try {
  const canvas = document.querySelector("canvas");
  const host = createBrowserHost(canvas,
    ["KeyA", "KeyD", "KeyW", "KeyS", "ShiftLeft", "ShiftRight", "ArrowLeft",
      "ArrowRight", "ArrowUp", "ArrowDown", "Space", "KeyM", "KeyR"], bytes("d1-sprites.rgba"));
  const audioMode = location.hash.startsWith("#projection-audio");
  const pcm = [];
  let frameAudio = "";
  if (audioMode) host.host_audio_write = (pointer, count) => {
    const samples = new Float32Array(linked.base.memory.buffer, Number(pointer), Number(count));
    frameAudio = count + "," + Math.round(samples[100] * 32768);
    return count;
  };
  const linked = linkUxe(new WebAssembly.Module(bytes("base.wasm")),
    new WebAssembly.Module(bytes("product.wasm")), host);
  host.attachMemory(linked.base.memory);
  const run = linked.product.uxe_frame;
  const capture = () => {
    const image = canvas.getContext("2d").getImageData(0, 0, 426, 240);
    const pixels = [];
    for (const y of [0, 80, 109, 118, 134, 159, 191, 239]) {
      for (const x of [0, 40, 80, 120, 160, 213, 265, 315, 385, 425]) {
        const at = 4 * (y * 426 + x);
        const [r, g, b, a] = image.data.subarray(at, at + 4);
        pixels.push(r + 256 * (g + 256 * (b + 256 * a)));
      }
    }
    return pixels;
  };
  run(0n);
  if (audioMode) {
    const key = (type, code) => dispatchEvent(new KeyboardEvent(type, { code, cancelable: true }));
    for (let tick = 1; tick <= 16; tick++) {
      if (tick === 2) key("keydown", "Space");
      if (tick === 3) { key("keyup", "Space"); key("keydown", "KeyM"); }
      if (tick === 4) key("keyup", "KeyM");
      frameAudio = "none";
      run(BigInt(tick) * 33334n);
      if (tick <= 3 || tick === 16) pcm.push(frameAudio);
    }
    result.textContent = pcm.join(" ");
  } else if (location.hash.startsWith("#projection-cloud")) {
    const pixel = (x, y) => Array.from(canvas.getContext("2d").getImageData(x, y, 1, 1).data).join(",");
    run(33334n);
    result.textContent = [pixel(114, 38), pixel(114, 26), pixel(114, 99)].join(" ");
  } else if (location.hash.startsWith("#projection-hud")) {
    const pixel = (x, y) => Array.from(canvas.getContext("2d").getImageData(x, y, 1, 1).data).join(",");
    run(33334n);
    const before = [pixel(8, 213), pixel(11, 216), pixel(35, 227)].join(" ");
    dispatchEvent(new KeyboardEvent("keydown", { code: "Space", cancelable: true }));
    run(66668n);
    const fired = pixel(35, 227);
    dispatchEvent(new KeyboardEvent("keyup", { code: "Space" }));
    dispatchEvent(new KeyboardEvent("keydown", { code: "KeyM", cancelable: true }));
    run(100002n);
    dispatchEvent(new KeyboardEvent("keyup", { code: "KeyM" }));
    for (let tick = 4; tick <= 16; tick++) run(BigInt(tick) * 33334n);
    const kill = pixel(408, 227);
    const health = pixel(352, 227);
    const packet = new Uint8Array(linked.product.memory.buffer, 2097152, 112);
    for (let tick = 17; tick <= 21; tick++) {
      packet.set([1, 0, 0, 18], 88);
      run(BigInt(tick) * 33334n);
    }
    const empty = pixel(352, 227);
    const prompt = pixel(193, 94);
    dispatchEvent(new KeyboardEvent("keydown", { code: "KeyR", cancelable: true }));
    run(22n * 33334n);
    result.textContent = [before, fired, kill, health, empty, prompt, pixel(408, 227), pixel(352, 227)].join(" ");
  } else if (location.hash.startsWith("#projection-art")) {
    run(33334n);
    const pixel = (x, y) => Array.from(canvas.getContext("2d").getImageData(x, y, 1, 1).data).join(",");
    result.textContent = [pixel(210, 143), pixel(213, 145), pixel(205, 162)].join(" ");
  } else {
    const straight = run(33334n);
    const first = capture();
    dispatchEvent(new KeyboardEvent("keydown", { code: "KeyD" }));
    dispatchEvent(new KeyboardEvent("keydown", { code: "KeyW" }));
    const banked = run(66668n);
    result.textContent = [canvas.width, canvas.height, straight, banked, ...first, ...capture()].join(" ");
  }
  host.destroy();
} catch (error) {
  result.textContent = error.name + " " + error.message;
}
</script>
