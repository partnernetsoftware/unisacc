<!doctype html>
<meta charset="utf-8">
<pre id="r160">pending</pre>
<script type="module">
import { Group, Object3D, REVISION } from "../../web/game/three.module.js";
if (REVISION !== "160") throw new Error("three.js revision mismatch");
const g=new Group(), child=new Object3D();
g.add(child);
const order=[];
g.traverse(x=>order.push(x===g?1:2));
const attached=Number(child.parent===g);
g.remove(child);
document.querySelector("#r160").textContent=JSON.stringify([
  Number(g.isGroup),Number(child.isGroup===true),order.length,order[1],attached,g.children.length
]);
</script>
