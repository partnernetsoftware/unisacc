<!doctype html>
<meta charset="utf-8">
<pre id="r160">pending</pre>
<script type="module">
import { MaterialLoader, REVISION } from "../../web/game/three.module.js";
if (REVISION !== "160") throw new Error("three.js revision mismatch");
const m = new MaterialLoader().parse({ type: "MeshStandardMaterial", color: 4227200, opacity: 0.5,
  roughness: 0.25, metalness: 0.75, transparent: true });
document.querySelector("#r160").textContent = JSON.stringify([
  m.isMeshStandardMaterial ? 2 : 0, m.color.getHex(), m.opacity, m.roughness, m.metalness, Number(m.transparent), -2, -3,
]);
 m.dispose();
</script>
