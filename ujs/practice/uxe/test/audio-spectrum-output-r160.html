<!doctype html>
<meta charset="utf-8">
<pre id="r160">pending</pre>
<script type="module">
import { Audio, AudioAnalyser, AudioContext, AudioListener, REVISION } from "../../web/game/three.module.js";
const output=document.querySelector("#r160");
try {
  if(REVISION!=="160") throw new Error("three.js revision mismatch");
  async function bytes(value) {
    const context=new OfflineAudioContext(1,256,48000);
    AudioContext.setContext(context);
    const audio=new Audio(new AudioListener());
    const analyser=new AudioAnalyser(audio,32);
    analyser.analyser.smoothingTimeConstant=0;
    const input=context.createBuffer(1,256,48000);
    input.getChannelData(0).fill(value);
    audio.setBuffer(input).play();
    const suspended=context.suspend(128/48000);
    const rendered=context.startRendering();
    await suspended;
    const bins=analyser.getFrequencyData();
    await context.resume();
    await rendered;
    return bins;
  }
  const bins=await bytes(0.001);
  const loud=await bytes(1);
  output.textContent=JSON.stringify([bins.length,bins[0],bins[1],bins[2],bins[15],77,loud[0],-1,1]);
} catch(error) { output.textContent=`error:${error.message}`; }
</script>
