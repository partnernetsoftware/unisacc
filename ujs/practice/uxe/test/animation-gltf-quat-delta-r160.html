<!doctype html>
<meta charset="utf-8">
<pre id="r160">pending</pre>
<script type="module">
import { AnimationClip, AnimationUtils, Quaternion, QuaternionKeyframeTrack, REVISION, Vector3 } from "../../web/game/three.module.js";
if (REVISION !== "160") throw new Error("three.js revision mismatch");
const x = new Quaternion().setFromAxisAngle(new Vector3(1,0,0),Math.PI/2).toArray();
const z = new Quaternion().setFromAxisAngle(new Vector3(0,0,1),Math.PI/2).toArray();
function cubic() {
  const interpolant = {resultBuffer: Float32Array.of(0,0,0,0,...x,0,0,0,0)};
  interpolant.evaluate = () => interpolant.resultBuffer;
  return interpolant;
}
cubic.isInterpolantFactoryMethodGLTFCubicSpline = true;
const target = new QuaternionKeyframeTrack("x",[1],[11,0,0,0,...z,0,0,0,19]);
const ref = new QuaternionKeyframeTrack("x",[1,3],[0,0,0,0,...x,0,0,0,0,0,0,0,0,...x,0,0,0,0]);
target.createInterpolant = cubic;
ref.createInterpolant = cubic;
const clip = new AnimationClip("target",1,[target]);
AnimationUtils.makeClipAdditive(clip,60,new AnimationClip("ref",3,[ref]),30);
const values = target.values;
document.querySelector("#r160").textContent = JSON.stringify([
  values.byteLength, values[5], values[4], values[0], values[11], -2, -1,
]);
</script>
