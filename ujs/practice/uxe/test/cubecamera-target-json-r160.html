<!doctype html>
<meta charset="utf-8">
<pre id="r160">pending</pre>
<script type="module">
import { CubeCamera, WebGLCubeRenderTarget, REVISION } from "../../web/game/three.module.js";
if (REVISION !== "160") throw Error("three.js revision mismatch");
const target = new WebGLCubeRenderTarget(4);
const camera = new CubeCamera(0.1, 100, target);
const json = camera.toJSON().object;
if (json.renderTarget !== undefined || json.children.length !== 6 ||
    target.width !== target.height || target.texture.images.length !== 6) throw Error("r160 cube descriptor");
document.querySelector("#r160").textContent = JSON.stringify([
  camera.renderTarget.width, camera.renderTarget.texture.images.length, -1, -1
]);
target.dispose();
</script>
