<!doctype html>
<meta charset="utf-8">
<pre id="r160">pending</pre>
<script type="module">
import { BufferGeometryLoader, REVISION } from "../../web/game/three.module.js";
if (REVISION !== "160") throw new Error("three.js revision mismatch");
const geometry = new BufferGeometryLoader().parse({ type: "BufferGeometry", data: { attributes: {
  position: { itemSize: 3, array: [1.25, 2, 3], type: "Float32Array", normalized: false },
} } });
document.querySelector("#r160").textContent = JSON.stringify([
  -1, geometry.getAttribute("position").getX(0), Object.keys(geometry.attributes).length, -1, 0,
  -1, -1, -1, -1, "{".charCodeAt(0), -1,
]);
</script>
