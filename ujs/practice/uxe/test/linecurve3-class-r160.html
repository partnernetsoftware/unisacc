<!doctype html>
<meta charset="utf-8">
<pre id="r160">pending</pre>
<script type="module">
import { LineCurve3, Vector3, REVISION } from "../../web/game/three.module.js";
if(REVISION!=="160") throw new Error("three.js revision mismatch");
const first=new Vector3(), last=new Vector3(0,0,8);
const line=new LineCurve3(first,last);
const defaults=new LineCurve3();
const partial=new LineCurve3(first);
const same=new LineCurve3(first,first);
const result=[
  line.arcLengthDivisions, Number(line.v1===first), Number(line.v2===last),
  Number(defaults.v1!==defaults.v2), defaults.getPoint(0.75).length(),
  Number(partial.v1===first && partial.v2!==first), Number(same.v1===same.v2),
  line.getUtoTmapping(0.25), line.getUtoTmapping(0.25,6),
  line.getUtoTmapping(0.25,0), line.getUtoTmapping(0.25,NaN),
  Number.isNaN(line.getUtoTmapping(0.25,9)), defaults.getUtoTmapping(0.75),
];
defaults.arcLengthDivisions=3;
result.push(defaults.getUtoTmapping(0.75));
last.z=16;
result.push(line.getPoint(0.5).z,line.getUtoTmapping(0.25,4));
line.updateArcLengths();
result.push(line.getUtoTmapping(0.25,4));
const frames=line.computeFrenetFrames(2,false);
result.push(frames.tangents.length,...frames.tangents[0].toArray(),
  ...frames.normals[1].toArray(),...frames.binormals[2].toArray());
const diag=new LineCurve3(new Vector3(1,2,3),new Vector3(3,5,9));
const diagonal=diag.computeFrenetFrames(2,false);
result.push(...diagonal.tangents[2].toArray(),diagonal.normals[2].x,diagonal.binormals[2].y);
const closed=line.computeFrenetFrames(2,true);
result.push(closed.normals[2].y,closed.binormals[2].x);
const singular=defaults.computeFrenetFrames(2,true);
result.push(singular.tangents[1].length(),singular.normals[2].length(),singular.binormals[2].length());
const one=line.computeFrenetFrames(0,false);
result.push(one.tangents.length,one.tangents[0].z,one.normals[0].y);
document.querySelector("#r160").textContent=JSON.stringify(result.map(Number));
</script>
