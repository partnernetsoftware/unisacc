<!doctype html>
<meta charset="utf-8">
<pre id="r160">pending</pre>
<script type="module">
import { BackSide, BufferGeometry, DoubleSide, Float32BufferAttribute, FrontSide, Mesh, MeshBasicMaterial,
  Raycaster, REVISION, Vector3 } from "../../web/game/three.module.js";
if (REVISION !== "160") throw new Error("three.js revision mismatch");
const geometry = new BufferGeometry().setAttribute("position", new Float32BufferAttribute([-1,-1,0, 1,-1,0, 0,1,0], 3));
const mesh = new Mesh(geometry, new MeshBasicMaterial());
mesh.position.z = -4;
const query = (side, far, sx = 2) => {
  mesh.material.side = side;
  mesh.scale.x = sx;
  mesh.updateMatrixWorld();
  return new Raycaster(new Vector3(.25,0,0), new Vector3(0,0,-1), 0, far).intersectObject(mesh)[0];
};
const hit = query(FrontSide, 5);
document.querySelector("#r160").textContent = JSON.stringify([
  hit.distance, hit.point.z, query(DoubleSide, 5).point.x, hit.faceIndex,
  query(BackSide, 5)?.distance ?? -2, query(FrontSide, 3)?.distance ?? -2, query(FrontSide, 5, -2).distance, -1,
]);
</script>
