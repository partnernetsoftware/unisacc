<!doctype html>
<meta charset="utf-8">
<pre id="r160">pending</pre>
<script type="module">
import {
  Vector2, Vector3, LineCurve, LineCurve3, QuadraticBezierCurve, QuadraticBezierCurve3,
  CubicBezierCurve, CubicBezierCurve3, REVISION,
} from "../../web/game/three.module.js";
if (REVISION !== "160") throw new Error("three.js revision mismatch");
const classes = [LineCurve, LineCurve3, QuadraticBezierCurve, QuadraticBezierCurve3, CubicBezierCurve, CubicBezierCurve3];
const curves = classes.map((Curve, kind) => {
  const dimension = 2 + kind % 2;
  const Vector = dimension === 2 ? Vector2 : Vector3;
  const points = Array.from({ length: 2 + Math.floor(kind / 2) }, (_, index) =>
    new Vector(...Array.from({ length: dimension }, (_, axis) => 1 + index * dimension + axis)));
  const curve = new Curve(...points);
  curve.arcLengthDivisions = 17;
  return curve;
});
const line = curves[0];
const exact = new TextEncoder().encode(JSON.stringify(line.toJSON()));
let hash = 0;
for (const byte of exact) hash = (hash * 131 + byte) % 16777213;
line.clone().v1.x = 9;
const read = new LineCurve().fromJSON(line.toJSON());
const samples = curves.slice(1).map((curve, index) => {
  const copied = new classes[index + 1]().fromJSON(curve.toJSON());
  const point = copied.getPoint(0.5);
  return index % 2 === 0 ? point.z : point.y;
});
document.querySelector("#r160").textContent = JSON.stringify([hash, line.v1.x, read.arcLengthDivisions, ...samples, -1]);
</script>
