<!doctype html>
<meta charset="utf-8">
<pre id="r160">pending</pre>
<script type="module">
import { REVISION, ShapePath, Vector2 } from "../../web/game/three.module.js";
if (REVISION !== "160") throw new Error("three.js revision mismatch");
const path = new ShapePath();
path.moveTo(0,0).splineThru([new Vector2(1,1),new Vector2(2,0),new Vector2(3,1),new Vector2(4,0)]).lineTo(5,1);
const points = path.currentPath.getPoints(1);
const clone = path.currentPath.clone();
path.currentPath.curves[0].points[1].x = 100;
document.querySelector("#r160").textContent = JSON.stringify([
  points.length, points[1].x, points[1].y, points[5].x, points[6].x, clone.getPoints(1)[1].x, -1,
]);
</script>
