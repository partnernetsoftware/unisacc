<!doctype html>
<meta charset="utf-8">
<pre id="r160">pending</pre>
<script type="module">
import { BufferAttribute, Euler, Matrix4, Quaternion, REVISION, Vector3 } from "../../web/game/three.module.js";
if (REVISION !== "160") throw new Error("three.js revision mismatch");
const half = Math.PI / 2;
const z = new Vector3(0,0,1), x = new Vector3(1,0,0);
const qx = new Quaternion().setFromAxisAngle(x,half), qz = new Quaternion().setFromAxisAngle(z,half);
const identity = new Quaternion(), raw = new Quaternion(1,-2,3,4);
const flat=[], flatMix=[];
Quaternion.multiplyQuaternionsFlat(flat,1,[0,...qx.toArray()],1,[0,...qz.toArray()],1);
Quaternion.slerpFlat(flatMix,1,[0,...identity.toArray()],1,[0,...qz.toArray()],1,0.5);
const samples=[0.25,0.25,0.0], saved=Math.random;
Math.random=()=> samples.shift();
const random=new Quaternion().random();
Math.random=saved;
document.querySelector("#r160").textContent=JSON.stringify([
  raw.clone().set(7,8,9,10).w, identity.clone().copy(raw).z, raw.clone().y, qz.clone().identity().w,
  raw.clone().conjugate().z, raw.clone().invert().y, raw.dot(identity), raw.lengthSq(), raw.length(),
  new Quaternion(0,0,0,0).normalize().w, raw.clone().normalize().w,
  new Quaternion().multiplyQuaternions(qx,qz).y, qx.clone().multiply(qz).y, qx.clone().premultiply(qz).y,
  new Quaternion().setFromEuler(new Euler(half,0,half)).y,
  new Quaternion().setFromAxisAngle(z,half).z,
  new Quaternion().setFromRotationMatrix(new Matrix4().makeRotationZ(half)).z,
  new Quaternion().setFromUnitVectors(x,z).y,
  new Quaternion().setFromUnitVectors(x,new Vector3(-1,0,0)).y,
  identity.angleTo(qz), identity.clone().rotateTowards(qz,Math.PI/4).z,
  identity.clone().slerp(qz,0.5).z, new Quaternion().slerpQuaternions(identity,qz,0.5).w,
  flat[2], flatMix[3], Number(raw.equals(raw.clone())),
  new Quaternion().fromArray([0,...raw.toArray()],1).w, raw.toArray([],1)[4], raw.toJSON()[2],
  new Quaternion().fromBufferAttribute(new BufferAttribute(new Float32Array([1,2,3,4,0.1,0.2,0.3,0.4]),4),1).w,
  random.z, [...raw][3]
]);
</script>
