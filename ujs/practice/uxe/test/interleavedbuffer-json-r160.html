<!doctype html>
<meta charset="utf-8">
<pre id="r160">pending</pre>
<script type="module">
import { InterleavedBuffer, REVISION } from "../../web/game/three.module.js";
const status=document.querySelector("#r160");
try {
  if(REVISION!=="160") throw new Error("Three.js revision");
  const values=new Float32Array([1,-2,3,4]);
  const first=new InterleavedBuffer(values,1);
  const second=new InterleavedBuffer(new Float32Array(values.buffer,8,2),2);
  const other=new InterleavedBuffer(new Float32Array(values),2);
  const data={};
  const a=first.toJSON(data);
  const b=second.toJSON(data);
  const shared=Object.keys(data.arrayBuffers).length;
  const words=data.arrayBuffers[a.buffer];
  values[0]=7;
  second.toJSON(data);
  const cached=data.arrayBuffers[a.buffer][0];
  const distinct=other.toJSON(data);
  status.textContent=JSON.stringify([
    Number(a.buffer===b.buffer),shared,b.stride,b.type==="Float32Array"?9:0,Number(b.uuid===second.uuid),
    words[0],words[1],words[3],cached,1+Number(a.buffer!==distinct.buffer),Object.keys(data.arrayBuffers).length,
    -1,-2,-1,77,
  ]);
} catch(error) {
  status.textContent=`error:${error.message}`;
}
</script>
