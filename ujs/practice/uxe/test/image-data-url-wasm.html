<!doctype html>
<meta charset="utf-8">
<pre id="wasm-cases">pending</pre>
<script type="module">
const result = document.querySelector("#wasm-cases");
try {
  const count = Number(new URL(location.href).searchParams.get("count"));
  const module = await WebAssembly.compile(await (await fetch("probe.wasm")).arrayBuffer());
  const cases = [];
  for (let i = 0; i < count; i++) {
    result.textContent = `case ${i}`;
    const { exports: wasm } = await WebAssembly.instantiate(module);
    const size = wasm.uxe_evaluate_case(BigInt(i));
    if (i > 5 || size < 0) { cases.push(size); continue; }
    const uri = new TextDecoder().decode(new Uint8Array(wasm.memory.buffer, 2097152 + 65536, size));
    const mime = i === 0 || i === 3 ? "png" : "jpeg";
    if (!uri.startsWith(`data:image/${mime};base64,`)) { cases.push(0); continue; }
    const image = new Image();
    image.src = uri;
    await image.decode();
    if (i < 3) { cases.push(i === 2 ? image.naturalHeight : image.naturalWidth); continue; }
    const canvas = document.createElement("canvas");
    const context = canvas.getContext("2d");
    context.drawImage(image, 0, 0);
    const rgba = context.getImageData(0, 0, 1, 1).data;
    if (i === 3) cases.push(rgba[0]);
    if (i === 4) cases.push(Number(Math.abs(rgba[0] - 204) <= 3));
    if (i === 5) cases.push(Number(Math.abs(rgba[1] - 68) <= 5));
  }
  result.textContent = JSON.stringify(cases);
} catch (error) {
  result.textContent = `error: ${result.textContent} ${error.stack.split("\n").slice(0, 3).join(" ")}`;
}
</script>
