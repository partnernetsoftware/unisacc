<!doctype html>
<meta charset="utf-8">
<pre id="r160">pending</pre>
<script type="module">
import { Bone, Object3D, REVISION } from "../../web/game/three.module.js";
if (REVISION !== "160") throw new Error("three.js revision mismatch");
const root = new Bone(), joint = new Bone(), tip = new Bone(), plain = new Object3D();
root.position.x = 3;
joint.position.y = 2;
joint.rotation.z = Math.PI / 2;
tip.position.x = 2;
root.add(joint);
joint.add(tip);
root.updateMatrixWorld();
document.querySelector("#r160").textContent = JSON.stringify([
  Number(!!root.isBone),Number(!!plain.isBone),Number(tip.parent===joint),
  tip.matrixWorld.elements[12],tip.matrixWorld.elements[13]
]);
</script>
