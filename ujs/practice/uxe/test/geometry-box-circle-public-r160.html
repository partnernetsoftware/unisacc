<!doctype html>
<meta charset="utf-8">
<pre id="r160">pending</pre>
<script type="module">
import { BoxGeometry, CircleGeometry, REVISION } from "../../web/game/three.module.js";

const output=document.querySelector("#r160");
const query=new URLSearchParams(location.search);
const dir="file://"+query.get("dir")+"/";
const bytes=async url=>(await fetch(url)).arrayBuffer();
const hash=raw=>raw.reduce((sum,byte)=>(sum*131+byte)%16777213,0);
const encoder=new TextEncoder(),decoder=new TextDecoder();
const uuid="mesh-1",name='deck "A"';

function reference(kind) {
  const Class=kind===1?BoxGeometry:CircleGeometry;
  const source=kind===1?new Class(6.25,4,3,2.5,1.5,3.25):new Class(3.5,2.5,0,1.5);
  const target=new Class();
  const primary=kind===1?"width":"radius";
  const segments=kind===1?"widthSegments":"segments";
  source.name=name;
  source.setDrawRange(1,5);
  const trace=[];
  let valid=true;
  function listener(object,token,remove) {
    return function(event) {
      valid&&=this===object && event.target===object;
      trace.push(token);
      if(remove) object.removeEventListener("dispose",remove);
    };
  }
  const second=listener(source,82);
  source.addEventListener("dispose",listener(source,41,second));
  source.addEventListener("dispose",second);
  source.addEventListener("ignore",listener(source,99));
  target.addEventListener("dispose",listener(target,61));
  const copied=target.copy(source)===target;
  const clone=source.clone();
  const independent=clone instanceof Class && clone!==source && clone.uuid!==source.uuid &&
    clone.parameters!==source.parameters && clone.index.array!==source.index.array &&
    clone.getAttribute("position").array!==source.getAttribute("position").array;
  source.parameters[primary]=12;
  source.getAttribute("position").setX(0,9);
  source.index.setX(0,2);
  valid&&=typeof source.dispose()==="undefined";
  const first=trace.splice(0); source.dispose();
  const next=trace.splice(0); target.dispose();
  const other=trace.splice(0); clone.dispose();
  clone.uuid=uuid;
  const serialized=clone.toJSON(),round=Class.fromJSON(serialized);
  return [Number(copied && independent),target.parameters[primary],clone.parameters[segments],
    target.getAttribute("position").getX(0),clone.index.getX(0),clone.getAttribute("position").getX(1),
    clone.getAttribute("position").count,clone.index.count,clone.drawRange.start,clone.drawRange.count,clone.groups.length,
    first[0]*100+first[1],next[0],other[0],trace.length,Number(valid && source.getAttribute("position").getX(0)===9),
    hash(encoder.encode(JSON.stringify(serialized))),round.getAttribute("position").count,round.index.count,
    round.parameters[primary],round.groups.length,
    ...clone.groups.flatMap(group=>[group.start,group.count,group.materialIndex])];
}

async function product(kind,baseModule,probeModule) {
  const base=await WebAssembly.instantiate(baseModule);
  const probe=await WebAssembly.instantiate(probeModule,{
    uxe_box_circle_v1:{uxe_box_circle_dispatch:base.exports.uxe_box_circle_dispatch},
  });
  if(base.exports.uxe_abi_version()!==1 || probe.exports.uxe_abi_version()!==1 ||
    base.exports.memory===probe.exports.memory) throw new Error("Box or Circle ABI");
  const run=(op,which=0,value=0,mutate=0)=>probe.exports.uxe_box_circle_probe(
    BigInt(op),BigInt(kind),BigInt(which),BigInt(value),BigInt(mutate));
  const memory=new Uint8Array(base.exports.memory.buffer,run(0),36864);
  const view=new DataView(memory.buffer,memory.byteOffset,memory.byteLength);
  memory.set(encoder.encode(uuid),30720);
  memory.set(encoder.encode(name),30800);
  if(run(1)!==1) throw new Error("shape construction "+kind);
  const copy=run(2,0),clone=run(2,1),capacity=run(2,2),occupied=run(2,3),wrongKind=run(2,4);
  run(4);
  view.setUint32(2176,77,true);
  const narrow=run(5,0,1),unwritten=view.getUint32(2176,true);
  const mutate=Number(query.get("mutate"));
  let rightTarget=true;
  function dispose(which) {
    const count=run(5,which,3,mutate);
    if(count<0 || count!==view.getUint32(2180,true)) throw new Error("shape event snapshot");
    rightTarget&&=view.getUint32(2176,true)===128+128*which;
    const collected=[];
    for(let i=0;i<count;i++) {
      const listener=view.getUint32(2184+4*i,true);
      collected.push(listener);
      if(listener===41) run(6,which,82);
    }
    return collected;
  }
  const first=dispose(0),next=dispose(0),other=dispose(1),empty=dispose(2);
  const shortJson=run(7,2,8);
  const length=run(7,2,1024,mutate);
  if(length<0) throw new Error("shape parameter JSON");
  const raw=memory.subarray(28672,28672+length);
  const parsed=JSON.parse(decoder.decode(raw));
  if(parsed.type!==(kind===1?"BoxGeometry":"CircleGeometry") || "data" in parsed ||
      parsed.uuid!==uuid || parsed.name!==name) throw new Error("shape JSON object");
  const unsupported=run(9), malformed=run(8,0,length-1);
  if(run(8,0,length)!==512) throw new Error("shape parameter round trip");
  const groups=Array.from({length:3*run(3,2,9)},(_,i)=>run(3,2,16+i));
  return [Number(copy===256 && clone===384),run(3,1,0),run(3,2,1),run(3,1,2),run(3,2,3),run(3,2,4),
    run(3,2,5),run(3,2,6),run(3,2,7),run(3,2,8),run(3,2,9),first[0]*100+first[1],next[0],other[0],
    empty.length,Number(rightTarget && run(3,0,2)===9),hash(raw),run(3,3,5),run(3,3,6),run(3,3,0),run(3,3,9),
    ...groups,capacity,occupied,wrongKind,narrow,unwritten,shortJson,unsupported,malformed];
}

try {
  if(REVISION!=="160") throw new Error("three.js revision mismatch");
  const [base,probe]=await Promise.all([
    WebAssembly.compile(await bytes(dir+"base.wasm")),WebAssembly.compile(await bytes(dir+"probe.wasm")),
  ]);
  const imported=WebAssembly.Module.imports(probe);
  if(imported.length!==1 || imported[0].module!=="uxe_box_circle_v1" ||
      imported[0].name!=="uxe_box_circle_dispatch") throw new Error("shape probe import");
  output.textContent=JSON.stringify([...reference(1),...await product(1,base,probe),
    ...reference(2),...await product(2,base,probe)]);
} catch(error) {
  output.textContent="error:"+error.message;
}
</script>
