<pre id="r160">pending</pre>
<script type="module">
import { ObjectLoader, REVISION } from "../../web/game/three.module.js";
if (REVISION !== "160") throw new Error("three.js revision mismatch");
const root = new ObjectLoader().parse({ object: { type: "Scene", position: [1, 0, 0],
  children: [{ type: "Group", position: [2, 0, 0], visible: false }] } });

</script>
