<!doctype html>
<meta charset="utf-8">
<pre id="r160">pending</pre>
<script type="importmap">{"imports":{"three":"../../web/game/three.module.js"}}</script>
<script type="module">
import { REVISION, LinearSRGBColorSpace } from "three";
const root=new URLSearchParams(location.search).get("package");
const { DRACOLoader }=await import(`file://${root}/examples/jsm/loaders/DRACOLoader.js`);
if(REVISION!=="160") throw Error("three.js revision mismatch");
const bytes=new Uint8Array(76);
bytes.set([68,82,65,67,79,2,2,1,0,0,0,2,4,1,0,1,2,0,2,3,1,1,0,9,3,0,0,0]);
const view=new DataView(bytes.buffer);
[0,0,0, 2,0,0, 2,3,0, 0,3,0].forEach((x,i)=>view.setFloat32(28+i*4,x,true));
const loader=new DRACOLoader().setDecoderPath(`file://${root}/examples/jsm/libs/draco/`);
const geometry=await new Promise((resolve,reject)=>
  loader.decodeDracoFile(bytes.buffer,resolve,{position:0},{position:"Float32Array"},LinearSRGBColorSpace,reject));
const position=geometry.getAttribute("position");
const indices=geometry.getIndex();
document.querySelector("#r160").textContent=JSON.stringify([
  indices.count/3,position.count,...indices.array,...position.array,-2,-3,-2,-1,77
]);
geometry.dispose();
loader.dispose();
</script>
