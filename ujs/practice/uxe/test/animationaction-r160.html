<!doctype html>
<meta charset="utf-8">
<pre id="r160">pending</pre>
<script type="module">
import { AnimationClip, AnimationMixer, LoopOnce, LoopPingPong, LoopRepeat, Object3D, VectorKeyframeTrack, REVISION } from "../../web/game/three.module.js";
if (REVISION !== "160") throw new Error("three.js revision mismatch");
const track = new VectorKeyframeTrack(".position", [0, 1], [0, 0, 0, 1, 0, 0]);
const clip = new AnimationClip("x", 1, [track]);
function sample(loop, delta, clamp = true, scale = 1) {
  const root = new Object3D(), mixer = new AnimationMixer(root);
  const action = mixer.clipAction(clip).setLoop(loop, 4).setEffectiveTimeScale(scale);
  action.clampWhenFinished = clamp;
  let event = 0;
  mixer.addEventListener("loop", e => { event = e.loopDelta; });
  mixer.addEventListener("finished", e => { event = e.direction; });
  action.play();
  mixer.update(delta);
  return { x: root.position.x, event, paused: Number(action.paused), enabled: Number(action.enabled) };
}
const repeated = sample(LoopRepeat, 2.25), once = sample(LoopOnce, 1.25);
document.querySelector("#r160").textContent = JSON.stringify([
  repeated.x, repeated.event, sample(LoopRepeat, -0.25).event, sample(LoopPingPong, 1.25).x,
  once.x, once.paused, sample(LoopOnce, -0.25, false).event, sample(LoopOnce, 1.25, false).enabled,
  sample(LoopRepeat, 1, true, 0.5).x
]);
</script>
