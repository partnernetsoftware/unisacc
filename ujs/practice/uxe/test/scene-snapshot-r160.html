<!doctype html>
<meta charset="utf-8">
<pre id="r160">pending</pre>
<script type="module">
import { Object3D, REVISION } from "../../web/game/three.module.js";
if(REVISION!=="160") throw new Error("three.js revision mismatch");
const [root,hidden,leaf,sibling]=[1,2,4,8].map(x=>{const o=new Object3D();o.position.x=x;return o;});
hidden.visible=false;
leaf.layers.set(3);
root.add(hidden,sibling);
hidden.add(leaf);
root.updateMatrixWorld();
const all=[],visible=[];
root.traverse(node=>all.push(node));
root.traverseVisible(node=>visible.push(node));
document.querySelector("#r160").textContent=JSON.stringify([
  all.length,Number(all[2].parent===hidden),all[2].matrixWorld.elements[12],all[2].layers.mask,
  visible.length,Number(visible[1]===sibling),1,77,-1,
]);
</script>
