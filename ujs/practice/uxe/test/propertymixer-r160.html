<!doctype html>
<meta charset="utf-8">
<pre id="r160">pending</pre>
<script type="module">
import { PropertyMixer, REVISION } from "../../web/game/three.module.js";
if (REVISION !== "160") throw new Error("three.js revision mismatch");
function run(action) {
  let result = 10;
  const binding = { getValue: (out, start) => { out[start] = result; }, setValue: (out, start) => { result = out[start]; } };
  const mixer = new PropertyMixer(binding, "number", 1);
  mixer.saveOriginalState();
  const put = (sample, weight, additive = false) => {
    mixer.buffer[0] = sample;
    if (additive) mixer.accumulateAdditive(weight);
    else mixer.accumulate(0, weight);
  };
  action(mixer, put);
  return result;
}
document.querySelector("#r160").textContent = JSON.stringify([
  run((m, put) => { put(20, 0.25); m.apply(0); }),
  run((m, put) => { put(20, 0.25); put(30, 0.5); m.apply(0); }),
  run((m, put) => { put(20, 0.25); put(4, 0.5, true); m.apply(0); }),
  run((m, put) => { put(20, 1); m.apply(0); m.apply(1); }),
  run((m, put) => { put(20, 1); m.apply(0); m.restoreOriginalState(); }), -1
]);
</script>
