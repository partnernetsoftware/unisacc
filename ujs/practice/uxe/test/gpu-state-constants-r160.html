<!doctype html>
<meta charset="utf-8">
<pre id="r160">pending</pre>
<script type="module">
import * as Three from "../../web/game/three.module.js";
import { applyRenderState, readRenderState } from "../base/gpu-state-abi.js";
const output = document.querySelector("#r160");
try {
  if (Three.REVISION !== "160") throw new Error("three.js revision mismatch");
  const canvas = document.createElement("canvas");
  const gl = canvas.getContext("webgl", { stencil: true });
  if (!gl) throw new Error("WebGL unavailable");
  const request = new XMLHttpRequest();
  request.open("GET", "../base/gpu-state-constants.tsv", false);
  request.send();
  const slots = { depth: 0, blend: 2, equation: 3, factor: 5, stencil: 10, compare: 10, op: 14, face: 17 };
  const results = request.responseText.trim().split("\n").slice(1).map(line => {
    const [family, name] = line.split("\t");
    const value = Three[name];
    if (!Number.isInteger(value) || slots[family] === undefined) throw new Error(name);
    const words = [2,1,5,100,100,204,205,201,205,0,519,0,255,255,7680,7680,7680,1,0,0,0,0,15];
    words[slots[family]] = value;
    const packet = new DataView(new ArrayBuffer(100));
    words.forEach((word, index) => packet.setUint32(8 + index * 4, word, true));
    const state = readRenderState(gl, packet, 0, 100);
    if (typeof state === "bigint") return value * 32 + Number(state);
    applyRenderState(gl, state);
    return value * 32 - Number(gl.getError() !== gl.NO_ERROR) * 31;
  });
  output.textContent = JSON.stringify(results);
} catch (error) {
  output.textContent = String(error);
}
</script>
