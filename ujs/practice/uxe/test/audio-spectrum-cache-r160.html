<!doctype html>
<meta charset="utf-8">
<pre id="r160">pending</pre>
<script type="module">
import { Audio, AudioAnalyser, AudioContext, AudioListener, REVISION } from "../../web/game/three.module.js";
const output=document.querySelector("#r160");
try {
  if(REVISION!=="160") throw new Error("three.js revision mismatch");
  async function source(value,smoothing,read) {
    const context=new OfflineAudioContext(1,384,48000);
    AudioContext.setContext(context);
    const audio=new Audio(new AudioListener());
    const analysis=new AudioAnalyser(audio,32);
    analysis.analyser.smoothingTimeConstant=smoothing;
    const input=context.createBuffer(1,384,48000);
    input.getChannelData(0).fill(value);
    audio.setBuffer(input).play();
    const first=context.suspend(128/48000);
    const second=context.suspend(256/48000);
    const rendered=context.startRendering();
    await first;
    const a=read(analysis);
    const b=read(analysis);
    await context.resume();
    await second;
    const c=read(analysis);
    await context.resume();
    await rendered;
    return [a,b,c];
  }
  const dbRead=analysis=>{
    const bins=new Float32Array(16);
    analysis.analyser.getFloatFrequencyData(bins);
    return Math.round(1e6*10**(bins[1]/20));
  };
  const [a,b,c]=await source(0.5,0.5,dbRead);
  const [average]=await source(0.001,0,analysis=>analysis.getAverageFrequency());
  output.textContent=JSON.stringify([a,b,c,0,-2,1,average,-1]);
} catch(error) { output.textContent=`error:${error.message}`; }
</script>
