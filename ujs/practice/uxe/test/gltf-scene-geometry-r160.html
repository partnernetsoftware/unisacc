<!doctype html>
<meta charset="utf-8">
<pre id="r160">pending</pre>
<script>
const frame = document.createElement("iframe");
frame.addEventListener("load", () => {
  const target = document.querySelector("#r160");
  const source = frame.contentDocument.querySelector("#r160");
  const copy = () => { target.textContent = source.textContent; };
  new MutationObserver(copy).observe(source, {childList: true, characterData: true, subtree: true});
  copy();
});
frame.src = "gltf-scene-r160.html" + location.search + "#geometry";
document.body.append(frame);
</script>
