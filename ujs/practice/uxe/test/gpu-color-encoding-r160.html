<!doctype html>
<meta charset="utf-8">
<pre id="r160">pending</pre>
<script type="module">
import {Texture, Color, ColorManagement, LinearEncoding, sRGBEncoding, LinearSRGBColorSpace,
  SRGBColorSpace, REVISION} from "../../web/game/three.module.js";
if (REVISION !== "160") throw new Error("three.js revision mismatch");
const texture=new Texture();
const sample=(enumValue,dest)=>{
  texture.encoding=enumValue;
  return ColorManagement.convert(new Color().setRGB(0.02,0.03,0.04),texture.colorSpace,dest);
};
document.querySelector("#r160").textContent=JSON.stringify([
  sample(LinearEncoding,LinearSRGBColorSpace).r,sample(sRGBEncoding,LinearSRGBColorSpace).r,
  sample(sRGBEncoding,LinearSRGBColorSpace).b,sample(sRGBEncoding,SRGBColorSpace).g,-2
]);
</script>
