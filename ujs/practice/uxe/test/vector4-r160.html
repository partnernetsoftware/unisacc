<!doctype html>
<meta charset="utf-8">
<pre id="r160">pending</pre>
<script type="module">
import { BufferAttribute, Matrix4, Quaternion, REVISION, Vector3, Vector4 } from "../../web/game/three.module.js";
if (REVISION !== "160") throw new Error("three.js revision mismatch");
const a = new Vector4(2, -3, 6, 2), b = new Vector4(5, 4, -2, 3);
const f = new Vector4(1.5, -2.25, 3.75, -0.125);
const axis = new Vector3(0, 0, 1);
const half = Math.PI / 2;
const matrix = new Matrix4().makeScale(2, 3, 4).setPosition(10, -8, 7);
const samples = [0.125, 0.625, 0.25, 0.75];
const originalRandom = Math.random;
Math.random = () => samples.shift();
const random = new Vector4().random();
Math.random = originalRandom;
document.querySelector("#r160").textContent = JSON.stringify([
  a.clone().set(4, 5, 6, 7).w, a.clone().copy(b).w, a.clone().add(b).z,
  new Vector4().addVectors(a, b).w, a.clone().sub(b).y, new Vector4().subVectors(a, b).z,
  a.clone().multiply(b).w, a.dot(b), a.lengthSq(), a.length(),
  a.clone().addScalar(2.5).w, a.clone().subScalar(5).z, a.clone().multiplyScalar(-2).w,
  a.clone().divideScalar(2).z, a.clone().negate().w, a.clone().addScaledVector(b, 0.5).z,
  a.clone().normalize().w, a.clone().setLength(5).z, a.manhattanLength(),
  a.clone().setScalar(-6).w, a.clone().setX(8).x, a.clone().setY(-9).y,
  a.clone().setZ(11).z, a.clone().setW(-8).w, a.clone().setComponent(3, 12).w, a.getComponent(3),
  Number(a.equals(a.clone())), new Vector4().lerpVectors(a, b, 0.25).x, a.clone().lerp(b, 0.25).z,
  a.clone().applyMatrix4(matrix).y, a.clone().applyMatrix4(matrix).w,
  new Vector4().setAxisAngleFromQuaternion(new Quaternion().setFromAxisAngle(axis, half)).w,
  new Vector4().setAxisAngleFromRotationMatrix(new Matrix4().makeRotationZ(half)).z,
  new Vector4().setAxisAngleFromRotationMatrix(new Matrix4().makeRotationZ(Math.PI)).w,
  new Vector4().setAxisAngleFromRotationMatrix(new Matrix4()).x,
  a.clone().min(b).x, a.clone().max(b).w,
  a.clone().clamp(new Vector4(-1, -2, -3, -4), new Vector4(1, 2, 3, 4)).z,
  a.clone().clampScalar(-2, 2).y, a.clone().clampLength(0, 5).z,
  f.clone().floor().y, f.clone().ceil().x, f.clone().round().z, f.clone().roundToZero().z,
  new Vector4().fromArray([9, 2, -3, 6, 2], 1).z, a.toArray([8, 9], 1)[4],
  new Vector4().fromBufferAttribute(new BufferAttribute(new Float32Array([1,2,3,4,0.1,0.2,0.3,0.4]), 4), 1).w,
  random.w, Number([...a][2] === a.width && [...a][3] === a.height),
  new Vector4().setAxisAngleFromRotationMatrix(new Matrix4().makeRotationZ(0.002)).w,
  new Vector4().setAxisAngleFromRotationMatrix(new Matrix4().makeRotationZ(Math.PI - 0.002)).w
]);
</script>
