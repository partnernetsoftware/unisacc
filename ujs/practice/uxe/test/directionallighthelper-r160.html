<!doctype html>
<meta charset="utf-8">
<pre id="r160">pending</pre>
<script type="module">
import { Color, DirectionalLight, DirectionalLightHelper, REVISION, Vector3 } from "../../web/game/three.module.js";
if(REVISION!=="160") throw new Error("three.js revision mismatch");
const light=new DirectionalLight(new Color().setRGB(0.25,0,0));
light.position.set(1,0,0);
light.target.position.set(4,0,4);
const helper=new DirectionalLightHelper(light,2);
const plane=helper.lightPlane.geometry.attributes.position;
const line=helper.targetLine.geometry.attributes.position;
const forward=helper.lightPlane.getWorldDirection(new Vector3());
const values=[plane.getX(0),plane.getY(2),plane.getY(4),line.getZ(1),
  forward.x,forward.z,helper.targetLine.scale.z];
const originalRed=helper.lightPlane.material.color.r;
light.target.position.x=1;
helper.color=new Color().setRGB(0,0.75,0);
helper.update();
values.push(helper.targetLine.scale.z,originalRed,helper.targetLine.material.color.g);
light.position.x=2.5;
helper.update();
values.push(helper.matrix.elements[12]);
let released=0;
helper.lightPlane.geometry.addEventListener("dispose",()=>released++);
helper.targetLine.geometry.addEventListener("dispose",()=>released++);
helper.lightPlane.material.addEventListener("dispose",()=>released++);
helper.dispose();
document.querySelector("#r160").textContent=JSON.stringify([...values,released===4?0:1,-1,-1]);
</script>
