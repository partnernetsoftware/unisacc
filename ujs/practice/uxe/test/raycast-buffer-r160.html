<!doctype html>
<meta charset="utf-8">
<pre id="r160">pending</pre>
<script type="module">
import { BufferGeometry, Float32BufferAttribute, Mesh, MeshBasicMaterial, Raycaster, REVISION } from "../../web/game/three.module.js";
if (REVISION !== "160") throw new Error("three.js revision mismatch");
const geometry = new BufferGeometry();
geometry.setAttribute("position",new Float32BufferAttribute([
  -1,-1,-8,1,-1,-8,0,1,-8,-1,-1,-4,1,-1,-4,0,1,-4,
],3));
geometry.setIndex([0,1,2,3,4,5,3,4,5]);
const mesh = new Mesh(geometry,new MeshBasicMaterial());
const ray = new Raycaster();
const hits = ray.intersectObject(mesh);
ray.far = 5;
const short = ray.intersectObject(mesh).length;
mesh.layers.set(1);
document.querySelector("#r160").textContent = JSON.stringify([
  hits.length,hits[0].distance,hits[0].faceIndex,hits[1].faceIndex,hits[2].distance,short,ray.intersectObject(mesh).length,-2,777,
]);
</script>
