<!doctype html>
<meta charset="utf-8">
<div id="viewport" style="width:256px;height:256px"></div>
<pre id="r160">pending</pre>
<script type="importmap">{"imports":{"three":"../../web/game/three.module.js"}}</script>
<script type="module">
import { Group, OrthographicCamera, REVISION, Vector3 } from "three";
const status=document.querySelector("#r160");
try {
  if(REVISION!=="160") throw new Error("Three.js revision");
  const root=new URLSearchParams(location.search).get("package");
  const { TransformControls }=await import(`file://${root}/examples/jsm/controls/TransformControls.js`);
  const viewport=document.querySelector("#viewport");
  function drag(axis,snap) {
    const parent=new Group();
    parent.rotation.z=Math.PI/2;
    parent.scale.setScalar(2);
    const object=new Group();
    object.position.set(1.25,-1.25,3.25);
    object.rotation.z=Math.PI/2;
    parent.add(object);
    parent.updateMatrixWorld();
    const origin=object.getWorldPosition(new Vector3());
    const camera=new OrthographicCamera(-8,8,8,-8,0.1,100);
    camera.position.copy(origin).add(new Vector3(0,0,10));
    camera.updateMatrixWorld();
    const controls=new TransformControls(camera,viewport);
    controls.attach(object);
    controls.setSpace("local");
    controls.setTranslationSnap(snap);
    controls.axis=axis;
    controls.updateMatrixWorld();
    const press=origin.clone().project(camera);
    const end=origin.clone().add(new Vector3(0.75,0.375,0)).project(camera);
    controls.pointerDown({x:press.x,y:press.y,button:0});
    controls.pointerMove({x:end.x,y:end.y,button:-1});
    if(!controls.dragging) throw new Error("transform drag did not start");
    controls.pointerUp({button:0});
    controls.dispose();
    return object.position.toArray();
  }
  const x=drag("X",null);
  const xSnap=drag("X",1);
  const y=drag("Y",null);
  const xy=drag("XY",1);
  status.textContent=JSON.stringify([x[0],x[1],xSnap[1],y[0],xy[0],xy[1],xy[2],xSnap[1],-1,47]);
} catch(error) {
  status.textContent=`error:${error.message}`;
}
</script>
