<!doctype html>
<meta charset="utf-8">
<div id="viewport" style="width:200px;height:100px"></div>
<pre id="r160">pending</pre>
<script type="importmap">{"imports":{"three":"../../web/game/three.module.js"}}</script>
<script type="module">
import { REVISION, OrthographicCamera } from "three";
const root=new URLSearchParams(location.search).get("package");
const { OrbitControls }=await import(`file://${root}/examples/jsm/controls/OrbitControls.js`);
if(REVISION!=="160") throw new Error("three.js revision mismatch");
const viewport=document.querySelector("#viewport");
function wheel(delta,min=0.99,max=1.02) {
  const camera=new OrthographicCamera(-4,4,2,-2,1,11);
  camera.position.z=10;
  const controls=new OrbitControls(camera,viewport);
  controls.minZoom=min;
  controls.maxZoom=max;
  viewport.dispatchEvent(new WheelEvent("wheel",{deltaY:delta*(devicePixelRatio|0),cancelable:true}));
  controls.update();
  controls.dispose();
  return camera;
}
const near=wheel(-100);
document.querySelector("#r160").textContent=JSON.stringify([
  near.zoom,near.projectionMatrix.elements[0],near.projectionMatrixInverse.elements[0],near.position.z,
  wheel(100).zoom,wheel(-100,0,2).zoom,1/wheel(-100,0,2).zoom,
]);
</script>
