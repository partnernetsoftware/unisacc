<!doctype html>
<meta charset="utf-8">
<pre id="r160">pending</pre>
<script type="module">
import { CameraHelper, Color, OrthographicCamera, PerspectiveCamera, REVISION } from "../../web/game/three.module.js";
if(REVISION!=="160") throw new Error("three.js revision mismatch");
const camera=new OrthographicCamera(-2,6,4,-2,1,9);
const helper=new CameraHelper(camera);
const pos=helper.geometry.attributes.position;
const color=helper.geometry.attributes.color;
const values=[pos.count,pos.getX(0),pos.getY(0),pos.getZ(0),pos.getZ(8),pos.getZ(24),
  pos.getX(32),pos.getY(35),pos.getZ(39),color.getZ(32),color.getX(40)];
const perspective=new PerspectiveCamera(90,1,1,9);
camera.projectionMatrixInverse.copy(perspective.projectionMatrixInverse);
helper.update();
values.push(pos.getX(8),pos.version);
const black=new Color().setRGB(0,0,0);
helper.setColors(black,black,new Color().setRGB(0,0.25,0),black,black);
values.push(color.getY(32),color.version);
camera.position.x=3;
camera.updateMatrixWorld();
values.push(helper.matrix.elements[12]);
let released=0;
helper.geometry.addEventListener("dispose",()=>released++);
helper.material.addEventListener("dispose",()=>released++);
helper.dispose();
document.querySelector("#r160").textContent=JSON.stringify([...values,released===2?0:1,-1,-1]);
</script>
