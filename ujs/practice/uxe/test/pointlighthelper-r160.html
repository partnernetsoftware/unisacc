<!doctype html>
<meta charset="utf-8">
<pre id="r160">pending</pre>
<script type="module">
import { Color, PointLight, PointLightHelper, REVISION } from "../../web/game/three.module.js";
if(REVISION!=="160") throw new Error("three.js revision mismatch");
const light=new PointLight(new Color().setRGB(0.25,0.5,0.75));
const helper=new PointLightHelper(light,2);
const position=helper.geometry.attributes.position;
const index=helper.geometry.index;
const values=[position.count,index.count,position.getY(0),position.getX(5),index.getX(2),helper.material.color.r];
light.position.x=3.5;
helper.update();
values.push(helper.matrix.elements[12]);
light.color.g=0.375;
helper.update();
values.push(helper.material.color.g);
helper.color=new Color().setRGB(0,0,0.125);
helper.update();
values.push(helper.material.color.b);
let released=0;
helper.geometry.addEventListener("dispose",()=>released++);
helper.material.addEventListener("dispose",()=>released++);
helper.dispose();
document.querySelector("#r160").textContent=JSON.stringify([...values,released===2?0:1,-1,-1]);
</script>
