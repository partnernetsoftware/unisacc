<!doctype html>
<meta charset="utf-8">
<pre id="r160">pending</pre>
<script type="module">
import { AxesHelper, Box3, Box3Helper, BoxGeometry, BoxHelper, Color, Mesh, REVISION, Vector3 }
  from "../../web/game/three.module.js";

if (REVISION !== "160") throw new Error("three.js revision mismatch");
const axes = new AxesHelper(2);
const axesCopy = new AxesHelper().copy(axes);
const axesClone = axesCopy.clone();
axesClone.setColors(new Color().setRGB(0.25, 0, 0), new Color(0), new Color(0));
const color = axes.geometry.attributes.color;
const first = [color.getX(0), color.version];
axes.dispose();
axesClone.setColors(new Color().setRGB(0.25, 0, 0), new Color(0), new Color(0));
first.push(axesCopy.geometry.attributes.color.version);

const sourceBox = new Box3(new Vector3(), new Vector3(2, 0, 0));
const destinationBox = new Box3(new Vector3(4, 0, 0), new Vector3(8, 0, 0));
const source = new Box3Helper(sourceBox);
const copied = new Box3Helper(destinationBox).copy(source);
const clone = source.clone();
copied.updateMatrixWorld();
let unbound = 0;
try {
  clone.updateMatrixWorld();
} catch (error) {
  if (error instanceof TypeError) unbound = -1;
}
clone.box = sourceBox;
clone.updateMatrixWorld();
const shared = Number(clone.geometry === source.geometry && copied.geometry === source.geometry);
const independent = Number(axesClone !== axes && clone !== source);
const mesh = new Mesh(new BoxGeometry(2, 2, 2));
mesh.position.x = 1;
const helper = new BoxHelper(mesh);
const boxCopy = new BoxHelper(new Mesh(new BoxGeometry(2, 2, 2)), 0x0000ff).copy(helper);
const boxClone = helper.clone();
const sameObject = Number(boxCopy.object === mesh && boxClone.object === mesh);
const position = helper.geometry.attributes.position;
const version = position.version;
mesh.position.x = 2.5;
mesh.scale.x = 2.5;
boxClone.update();
helper.material.color.setHex(0x00ff00);
document.querySelector("#r160").textContent = JSON.stringify([
  ...first, copied.position.x, unbound, clone.position.x, shared, independent,
  sameObject, boxCopy.geometry.attributes.position.getX(0),
  boxCopy.geometry.attributes.position.version - version, boxCopy.geometry.boundingSphere.center.x,
  boxClone.material.color.getHex()
]);
</script>
