<!doctype html>
<meta charset="utf-8">
<pre id="r160">pending</pre>
<script type="module">
import { Object3D, Vector3, REVISION } from "../../web/game/three.module.js";
if (REVISION !== "160") throw new Error("three.js revision mismatch");
const root=new Object3D(), a=new Object3D(), b=new Object3D(), c=new Object3D();
const nodes=[root,a,b,c];
root.position.set(10,0,0);
root.rotation.z=Math.PI/2;
a.position.set(2,0,0);
b.position.set(0,3,0);
c.position.set(4,0,0);
b.visible=false;
root.add(a,b);
b.add(c);
root.updateMatrixWorld();
const values=[];
for(const node of nodes) values.push(node.matrixWorld.elements[12],node.matrixWorld.elements[13],Number(node.visible));
const matrices=nodes.flatMap(node=>node.matrixWorld.elements);
const all=[], visible=[];
root.traverse(node=>all.push(nodes.indexOf(node)+1));
root.traverseVisible(node=>visible.push(nodes.indexOf(node)+1));
values.push(all.length,...all,visible.length,...visible);
root.position.x=11;
values.push(c.getWorldPosition(new Vector3()).x);
a.attach(c);
values.push(c.getWorldPosition(new Vector3()).x,c.getWorldPosition(new Vector3()).y,Number(c.parent===a));
a.remove(c);
values.push(Number(c.parent===null));
root.clear();
values.push(root.children.length);
document.querySelector("#r160").textContent=JSON.stringify([...values,...matrices]);
</script>
