<!doctype html>
<meta charset="utf-8">
<pre id="r160">pending</pre>
<script type="module">
import { Object3D, Quaternion, Vector3, REVISION } from "../../web/game/three.module.js";
if (REVISION !== "160") throw new Error("three.js revision mismatch");
const root=new Object3D(), a=new Object3D(), b=new Object3D(), c=new Object3D();
const nodes=[root,a,b,c];
root.position.set(10,0,0);
root.rotation.z=Math.PI/2;
a.position.set(2,0,0);
b.position.set(0,3,0);
c.position.set(4,0,0);
b.visible=false;
root.add(a,b);
b.add(c);
root.updateMatrixWorld();
const values=[];
for(const node of nodes) values.push(node.matrixWorld.elements[12],node.matrixWorld.elements[13],Number(node.visible));
const matrices=nodes.flatMap(node=>node.matrixWorld.elements);
const queries=[a.getWorldQuaternion(new Quaternion()).w,b.getWorldScale(new Vector3()).x,c.getWorldDirection(new Vector3()).z];
root.position.x=12;
queries.push(c.getWorldPosition(new Vector3()).x);
root.position.x=10;
root.scale.setScalar(2);
queries.push(c.getWorldPosition(new Vector3()).y);
root.scale.setScalar(1);
root.quaternion.identity();
queries.push(c.getWorldPosition(new Vector3()).x);
root.rotation.z=Math.PI/2;
let callbackOrder=0,ancestorOrder=0;
root.traverse(node=>callbackOrder=callbackOrder*10+nodes.indexOf(node)+1);
c.traverseAncestors(node=>ancestorOrder=ancestorOrder*10+nodes.indexOf(node)+1);
queries.push(callbackOrder,ancestorOrder);
const all=[], visible=[];
root.traverse(node=>all.push(nodes.indexOf(node)+1));
root.traverseVisible(node=>visible.push(nodes.indexOf(node)+1));
values.push(all.length,...all,visible.length,...visible);
root.position.x=11;
values.push(c.getWorldPosition(new Vector3()).x);
a.attach(c);
values.push(c.getWorldPosition(new Vector3()).x,c.getWorldPosition(new Vector3()).y,Number(c.parent===a));
a.remove(c);
values.push(Number(c.parent===null));
root.clear();
values.push(root.children.length);
document.querySelector("#r160").textContent=JSON.stringify([...values,...matrices,...queries]);
</script>
