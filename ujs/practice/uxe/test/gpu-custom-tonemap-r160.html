<!doctype html>
<meta charset="utf-8">
<pre id="r160">pending</pre>
<script type="module">
import {
  Camera, CustomToneMapping, DataTexture, LinearSRGBColorSpace, Mesh, NoBlending, PlaneGeometry,
  REVISION, Scene, ShaderChunk, ShaderMaterial, WebGLRenderer,
} from "../../web/game/three.module.js";
import { createGpuSubmit } from "../base/gpu-host-abi.js";
import { createGpuNativeSample } from "../base/gpu-native-sample-abi.js";

const output = document.querySelector("#r160");
try {
  if (REVISION !== "160") throw new Error("three.js revision mismatch");
  const query = new URLSearchParams(location.search);
  function context() {
    const canvas = document.createElement("canvas");
    canvas.width = 4;
    canvas.height = 2;
    const gl = canvas.getContext("webgl2", { alpha: true, premultipliedAlpha: false, preserveDrawingBuffer: true });
    if (!gl) throw new Error("WebGL2 required");
    return { canvas, gl };
  }
  function screen(gl) {
    const rgba = new Uint8Array(32);
    gl.readPixels(0, 0, 4, 2, gl.RGBA, gl.UNSIGNED_BYTE, rgba);
    return rgba;
  }
  function words(rgba) {
    const data = new DataView(rgba.buffer, rgba.byteOffset, rgba.byteLength);
    return [0,1,6,7].map(i => data.getUint32(i * 4, true));
  }
  const { gl } = context();
  const [binary, ...sources] = await Promise.all([
    fetch("file://" + query.get("wasm")),
    fetch("../base/gpu-native-copy.vert"),
    fetch("../base/gpu-custom-tonemap.frag"),
    fetch("./gpu-custom-tonemap-gradient.glsl"),
  ]);
  let actual;
  let reads = 0, uploads = 0, draws = 0;
  function track(key, observe) {
    const prior = gl[key];
    gl[key] = function (...args) {
      observe();
      return prior.apply(gl, args);
    };
  }
  track("readPixels", () => reads++);
  track("texImage2D", () => uploads++);
  track("drawArrays", () => draws++);
  const native = createGpuNativeSample(gl, () => 1, () => actual.memory);
  const submit = createGpuSubmit(gl, () => actual.memory, () => 1, native.targets);
  const copy = (...args) => {
    const beforeRead = reads, beforeUpload = uploads;
    const status = native.copy(...args);
    if (beforeRead !== reads || beforeUpload !== uploads) throw new Error("native tone mapping moved texels through CPU");
    return status;
  };
  actual = (await WebAssembly.instantiate(await binary.arrayBuffer(), {
    uxe_gpu_v1: { host_gpu_submit: submit },
    uxe_gpu_target_v1: { host_gpu_native_copy: copy },
  })).instance.exports;
  const lengths = [];
  let hook;
  for (const [i, response] of sources.entries()) {
    const data = new Uint8Array(await response.arrayBuffer());
    if (!response.ok || !data.length || data.length > 4096) throw new Error("invalid shader resource");
    new Uint8Array(actual.memory.buffer, 2097152 + 10000 + 4500 * i, data.length).set(data);
    lengths.push(BigInt(data.length));
    if (i === 2) hook = new TextDecoder().decode(data);
  }
  const identity = "vec3 CustomToneMapping( vec3 color ) { return color; }";
  const originalChunk = ShaderChunk.tonemapping_pars_fragment;
  if (!originalChunk.includes(identity)) throw new Error("r160 custom tone mapping hook missing");
  ShaderChunk.tonemapping_pars_fragment = originalChunk.replace(identity, hook +
    "vec3 CustomToneMapping( vec3 color ) { return uxeToneMapping(color, toneMappingExposure); }");

  const ref = context();
  const renderer = new WebGLRenderer({ canvas: ref.canvas, context: ref.gl });
  renderer.setSize(4, 2, false);
  renderer.outputColorSpace = LinearSRGBColorSpace;
  renderer.toneMapping = CustomToneMapping;
  const colors = [];
  for (let y = 0; y < 2; y++) {
    for (let x = 0; x < 4; x++) colors.push(32+40*x+12*y,24+20*x+48*y,17+46*x+7*y,31+32*x+64*y);
  }
  const input = new DataTexture(Uint8Array.from(colors), 4, 2);
  input.needsUpdate = true;
  const material = new ShaderMaterial({
    toneMapped: true,
    blending: NoBlending,
    uniforms: { source: { value: input } },
    vertexShader: "varying vec2 vUv; void main() { vUv = uv; gl_Position = vec4(position, 1.0); }",
    fragmentShader: "varying vec2 vUv; uniform sampler2D source; void main() {\n" +
      "gl_FragColor = texture2D(source, vUv);\n#include <tonemapping_fragment>\n#include <colorspace_fragment>\n}",
  });
  const geometry = new PlaneGeometry(2, 2);
  const mesh = new Mesh(geometry, material);
  mesh.frustumCulled = false;
  const scene = new Scene();
  scene.add(mesh);
  const camera = new Camera();
  const values = [];
  try {
    for (const [mode, exposure] of [0,0.7,2].entries()) {
      const status = actual.uxe_custom_tone(BigInt(mode), BigInt(query.get("mode")), ...lengths);
      if (status !== 0n) throw new Error("custom tone mapping probe failed " + status);
      const rendered = screen(gl);
      renderer.toneMappingExposure = exposure;
      renderer.render(scene, camera);
      const reference = screen(ref.gl);
      const difference = rendered.reduce((count, byte, i) => count + Number(byte !== reference[i]), 0);
      values.push(...words(rendered), ...words(reference), difference);
    }
  } finally {
    ShaderChunk.tonemapping_pars_fragment = originalChunk;
    geometry.dispose();
    material.dispose();
    input.dispose();
    renderer.dispose();
  }
  output.textContent = JSON.stringify([...values, draws]);
} catch (error) {
  output.textContent = "error:" + error.message;
}
</script>
