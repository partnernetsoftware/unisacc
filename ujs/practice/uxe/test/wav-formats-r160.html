<!doctype html>
<meta charset="utf-8">
<pre id="r160">pending</pre>
<script type="module">
import { AudioContext as ThreeAudioContext, AudioLoader, REVISION } from "../../web/game/three.module.js";
if (REVISION !== "160") throw new Error("three.js revision mismatch");
ThreeAudioContext.setContext(new OfflineAudioContext(2, 3, 8000));
async function wav(data, bits, channels = 1, format = 1) {
  const payload = format === 1 ? 44 : 58;
  const bytes = new Uint8Array(payload + data.length + data.length % 2);
  const view = new DataView(bytes.buffer);
  const put = (at, text) => bytes.set(new TextEncoder().encode(text), at);
  const word = (at, value) => view.setUint16(at, value, true);
  const dword = (at, value) => view.setUint32(at, value, true);
  const stride = bits / 8 * channels;
  put(0,"RIFF"); dword(4,bytes.length-8); put(8,"WAVEfmt "); dword(16,format === 1 ? 16 : 18);
  word(20,format); word(22,channels); dword(24,8000); dword(28,8000*stride);
  word(32,stride); word(34,bits);
  if (format !== 1) { put(38,"fact"); dword(42,4); dword(46,data.length / stride); }
  put(payload - 8,"data"); dword(payload - 4,data.length); bytes.set(data,payload);
  const url = URL.createObjectURL(new Blob([bytes], { type: "audio/wav" }));
  try { return await new AudioLoader().loadAsync(url); }
  catch (error) { throw new Error(`${bits} bit, format ${format}: ${error?.message ?? error}`); }
  finally { URL.revokeObjectURL(url); }
}
const panel = document.querySelector("#r160");
Promise.all([
  wav([0,192,255],8), wav([0,0,128,0,0,64,255,255,127,0,0,0],24,2),
  wav([0,0,0,128,0,0,0,64],32), wav([0,0,128,190,0,0,160,63],32,1,3),
  wav([0,0,0,0,0,0,192,191],64,1,3).then(audio => audio.getChannelData(0)[0], () => -3),
]).then(([u8, pcm24, pcm32, f32, f64]) => {
  const octets = u8.getChannelData(0);
  const floats = f32.getChannelData(0);
  panel.textContent = JSON.stringify([
    u8.length,octets[0],octets[1],octets[2],pcm24.numberOfChannels,pcm24.getChannelData(1)[0],pcm24.getChannelData(0)[1],
    pcm32.getChannelData(0)[1],floats[0],floats[1],f64,-3,.75,-1,
  ]);
}).catch(error => { panel.textContent = `error: ${error.message}`; });
</script>
