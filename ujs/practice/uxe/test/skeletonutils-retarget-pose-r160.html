<!doctype html>
<meta charset="utf-8">
<pre id="r160">pending</pre>
<script>
const packageURL = "file://" + new URLSearchParams(location.search).get("package");
const imports = document.createElement("script");
imports.type = "importmap";
imports.textContent = JSON.stringify({imports:{three:packageURL + "/build/three.module.js"}});
document.head.append(imports);
</script>
<script type="module">
const result = document.querySelector("#r160");
try {
  const {Bone, REVISION, Skeleton} = await import("three");
  const {retarget} = await import(packageURL + "/examples/jsm/utils/SkeletonUtils.js");
  if (REVISION !== "160") throw Error("revision mismatch");

  function rig() {
    const hip = new Bone();
    const child = new Bone();
    hip.name = "hip";
    child.name = "child";
    hip.add(child);
    child.position.x = 2;
    hip.updateMatrixWorld(true);
    return {hip, child, skeleton: new Skeleton([hip, child])};
  }
  const source = rig();
  source.hip.position.set(4,5,6);
  source.hip.quaternion.set(0,0,Math.SQRT1_2,Math.SQRT1_2);
  source.hip.scale.setScalar(2);
  source.child.position.x = 3;
  source.child.quaternion.set(0,0,-Math.SQRT1_2,Math.SQRT1_2);
  const values = [];
  for (const [preservePosition,preserveHipPosition] of [[false,false],[true,false],[false,true]]) {
    const target = rig();
    target.hip.position.set(9,8,7);
    retarget(target.skeleton,source.skeleton,{preservePosition,preserveHipPosition});
    values.push(...target.hip.position, ...target.child.position,
      target.hip.quaternion.z, target.child.quaternion.z, target.child.scale.x,
      source.child.position.x);
  }
  result.textContent = JSON.stringify(values);
} catch (error) {
  result.textContent = "error:" + error.message;
}
</script>
