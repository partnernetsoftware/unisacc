<!doctype html>
<meta charset="utf-8">
<pre id="r160">pending</pre>
<script type="module">
import { REVISION, Object3D } from "../../web/game/three.module.js";
const status = document.querySelector("#r160");
try {
  if (REVISION !== "160") throw new Error("revision mismatch");
  const root = new Object3D();
  root.uuid = "root";
  root.name = 'parent "A"';
  root.castShadow = true;
  root.receiveShadow = true;
  root.visible = false;
  root.layers.enable(4);
  root.position.set(2, 3, 4);
  root.up.set(0, 0, 1);
  root.updateMatrix();
  const child = new Object3D();
  child.uuid = "child";
  root.add(child);
  const expected = JSON.stringify(root.toJSON().object);
  const options = new URLSearchParams(location.search);
  const response = await fetch("file://" + options.get("wasm"));
  const { instance } = await WebAssembly.instantiate(await response.arrayBuffer());
  const base = Number(instance.exports.uxe_object_json(0n, 0n));
  const memory = new Uint8Array(instance.exports.memory.buffer, base, 12288);
  const input = new TextEncoder().encode(expected);
  memory.set(input, 0);
  const end = Number(instance.exports.uxe_object_json(BigInt(input.length), BigInt(options.get("mutate"))));
  if (end < 8192 || end > 12288) throw new Error("Object3D JSON refused");
  const result = new TextDecoder().decode(memory.subarray(8192, end));
  const hash = text => [...text].reduce((value, ch) => (value * 131 + ch.charCodeAt(0)) % 16777213, 0);
  status.textContent = JSON.stringify([hash(expected), hash(result)]);
} catch (error) {
  status.textContent = "error:" + error.message;
}
</script>
