<!doctype html>
<meta charset="utf-8">
<pre id="r160">pending</pre>
<script type="module">
import { Audio, AudioContext, AudioListener, REVISION } from "../../web/game/three.module.js";
const output=document.querySelector("#r160");
try {
  if(REVISION!=="160") throw new Error("three.js revision mismatch");
  async function render(loop,stop=false) {
    const rate=48000;
    const context=new OfflineAudioContext(2,8,rate);
    AudioContext.setContext(context);
    const listener=new AudioListener();
    const audio=new Audio(listener);
    const buffer=context.createBuffer(2,4,rate);
    buffer.copyToChannel(new Float32Array([0.25,0.5,0.75,1]),0);
    buffer.copyToChannel(new Float32Array([-0.25,-0.5,-0.75,-1]),1);
    audio.setBuffer(buffer);
    // The Wasm record starts at a settled gain, not an automation ramp.
    audio.gain.gain.value=0.5;
    audio.setVolume(0.5);
    if(loop) audio.setLoop(true).setLoopStart(1/rate).setLoopEnd(3/rate);
    audio.play();
    if(stop) audio.stop();
    const rendered=await context.startRendering();
    return [rendered.getChannelData(0),rendered.getChannelData(1),Number(audio.isPlaying)];
  }
  const [dry,right,active]=await render(false);
  const [loop]=await render(true);
  const [stop]=await render(false,true);
  output.textContent=JSON.stringify([dry[0],right[1],dry[3],dry[4],active,loop[3],loop[4],loop[3],stop[0],-1,-1]);
} catch(error) { output.textContent=`error:${error.message}`; }
</script>
