<!doctype html>
<meta charset="utf-8">
<pre id="r160">pending</pre>
<script type="module">
import { Curve, Vector2, REVISION } from "../../web/game/three.module.js";
if (REVISION !== "160") throw new Error("three.js revision mismatch");
class Quadratic extends Curve {
  getPoint(t, target = new Vector2()) { return target.set(t * t, 0); }
}
const curve = new Quadratic();
curve.arcLengthDivisions = 4;
const points = curve.getPoints(4), lengths = curve.getLengths(4);
class Bent extends Curve {
  getPoint(t, target = new Vector2()) {
    return t < 0.5 ? target.set(t * 2, 0) : target.set(1, (t - 0.5) * 6);
  }
}
const bent = new Bent();
bent.arcLengthDivisions = 4;
document.querySelector("#r160").textContent = JSON.stringify([
  points[1].x, points[4].x, lengths[3], curve.getLength(),
  curve.getUtoTmapping(0.40625), curve.getPointAt(0.40625).x, curve.getTangent(0.5).x,
  curve.getSpacedPoints(2)[1].x,-1,bent.getTangentAt(0.4).y
]);
</script>
