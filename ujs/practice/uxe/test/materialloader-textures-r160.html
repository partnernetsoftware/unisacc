<!doctype html>
<meta charset="utf-8">
<pre id="r160">pending</pre>
<script type="module">
import { MaterialLoader, REVISION, Texture } from "../../web/game/three.module.js";
if (REVISION !== "160") throw new Error("three.js revision mismatch");
const red = new Texture();
const blue = new Texture();
const ids = new Map([[red,17],[blue,42],[null,0]]);
const json = { type: "MeshStandardMaterial", map: "red", alphaMap: "blue", roughnessMap: "red", opacity: 0.5 };
const material = new MaterialLoader().setTextures({red,blue}).parse(json);
const missing = new MaterialLoader().setTextures({red}).parse(json);
let unknown = 0;
try { new MaterialLoader().parse({...json,type:"Unknown"}); } catch { unknown = -3; }
document.querySelector("#r160").textContent = JSON.stringify([
  512,ids.get(material.map),ids.get(material.alphaMap),ids.get(material.roughnessMap),
  ids.get(material.metalnessMap),material.opacity,missing.alphaMap === undefined ? -3 : 0,998,-3,-1,unknown,
]);
</script>
