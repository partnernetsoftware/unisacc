<!doctype html>
<meta charset="utf-8">
<pre id="r160">pending</pre>
<script type="module">
import { AnimationLoader, REVISION } from "../../web/game/three.module.js";
if (REVISION !== "160") throw new Error("three.js revision mismatch");
const clips = new AnimationLoader().parse([
  { name: "\u7ec4", tracks: [
    { name: ".visible", type: "boolean", times: [0,1], values: [true,false], interpolation: 2301 },
    { name: "\u540d", type: "string", times: [0,2], values: ["\u706f\u821f","A\nB"] },
    { name: ".weight", type: "number", times: [0,1], values: [0.25,0.75] },
  ] },
  { name: "next", tracks: [] },
]);
const [clip] = clips;
const [boolean, str, number] = clip.tracks;
const utf8 = new TextEncoder();
const first = utf8.encode(str.values[0]);
const second = utf8.encode(str.values[1]);
document.querySelector("#r160").textContent = JSON.stringify([
  clips.length,utf8.encode(clip.name).length,boolean.getInterpolation(),Number(boolean.values[0]),Number(boolean.values[1]),
  str.getValueSize(),first.length,first[0],second[1],utf8.encode(str.name).length,number.values[1],-3,-3,99,
]);
</script>
