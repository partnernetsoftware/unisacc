<!doctype html>
<meta charset="utf-8">
<pre id="r160">pending</pre>
<script type="module">
import { InterleavedBuffer, REVISION } from "../../web/game/three.module.js";
const status=document.querySelector("#r160");
try {
  if(REVISION!=="160") throw new Error("Three.js revision");
  const create=()=>new InterleavedBuffer(new Float32Array([1,2,3,4,5,6]),3);
  const source=new InterleavedBuffer(new Float32Array([7,8,9,10,11,12]),2);
  const copied=create().copyAt(1,source,1);
  const overlap=create();
  overlap.set(overlap.array.subarray(0,5),1);
  const clamped=new InterleavedBuffer(new Uint8ClampedArray(6),3);
  clamped.set(new Float64Array([0.5,1.5,300,-1]));
  const memory=new Float32Array([1.5,2.5]);
  const bytes=new InterleavedBuffer(new Uint8Array(memory.buffer),4);
  bytes.set(memory,4);
  const ranges=create();
  const legacy=ranges.updateRange.count;
  ranges.addUpdateRange(1,3);
  ranges.addUpdateRange(2,2);
  const list=[ranges.updateRanges.length,ranges.updateRanges[1].start,ranges.updateRanges[0].count];
  ranges.clearUpdateRanges();
  ranges.updateRange.offset=2;
  ranges.updateRange.count=3;
  let tooLong=0;
  try { create().set(new Float32Array([1,2]),5); } catch(error) { tooLong=error instanceof RangeError?-1:0; }
  status.textContent=JSON.stringify([
    copied.array[3],copied.array[5],overlap.array[5],overlap.array[1],...clamped.array.subarray(0,4),
    bytes.array[4],bytes.array[5],...list,ranges.updateRanges.length,legacy,ranges.updateRange.offset,copied.version,
    tooLong,-2,77,
  ]);
} catch(error) {
  status.textContent=`error:${error.message}`;
}
</script>
