<!doctype html>
<meta charset="utf-8">
<pre id="r160">pending</pre>
<script type="module">
import { OrthographicCamera, PerspectiveCamera, Raycaster, REVISION, Vector2 } from "../../web/game/three.module.js";
if (REVISION !== "160") throw new Error("three.js revision mismatch");
const cameras = [new PerspectiveCamera(90, 2, 1, 11), new OrthographicCamera(-4, 4, 2, -2, 1, 11)];
const rays = cameras.map(camera => {
  camera.position.set(3, 4, 5);
  camera.updateMatrixWorld();
  const query = new Raycaster();
  query.setFromCamera(new Vector2(.5, -.5), camera);
  return query.ray;
});
document.querySelector("#r160").textContent = JSON.stringify([
  rays[0].origin.z, rays[0].direction.x, rays[0].direction.y,
  ...rays[1].origin.toArray(), rays[1].direction.z, -1, -1,
]);
</script>
