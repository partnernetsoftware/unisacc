<!doctype html>
<meta charset="utf-8">
<pre id="r160">pending</pre>
<script type="module">
import { CineonToneMapping, LinearToneMapping, NoToneMapping, ReinhardToneMapping, REVISION } from "../../web/game/three.module.js";
if (REVISION !== "160" || NoToneMapping !== 0 || LinearToneMapping !== 1 ||
    ReinhardToneMapping !== 2 || CineonToneMapping !== 3) {
  throw new Error("r160 tone mapping ABI mismatch");
}
const inputs = [[0.25, 2], [2, 2], [2, 0]];
const linear = inputs.map(([value, exposure]) => Math.min(1, value * exposure));
const reinhard = inputs.map(([value, exposure]) => {
  const exposed = value * exposure;
  return exposed / (1 + exposed);
});
const half = (0.004 + (0.7 + Math.sqrt(1.978)) / 12.4) * 0.5;
const cineon = value => {
  const x = Math.max(0, value * 2 - 0.004);
  return (x * (6.2 * x + 0.5) / (x * (6.2 * x + 1.7) + 0.06)) ** 2.2;
};
document.querySelector("#r160").textContent = JSON.stringify([...linear, ...reinhard, cineon(half), cineon(0.002), 2, -1]);
</script>
