<!doctype html>
<meta charset="utf-8">
<pre id="r160">pending</pre>
<script type="module">
import { LinearToneMapping, ReinhardToneMapping, REVISION } from "../../web/game/three.module.js";
if (REVISION !== "160" || LinearToneMapping !== 1 || ReinhardToneMapping !== 2) {
  throw new Error("r160 tone mapping ABI mismatch");
}
const inputs = [[0.25, 2], [2, 2], [2, 0]];
const linear = inputs.map(([value, exposure]) => Math.min(1, value * exposure));
const reinhard = inputs.map(([value, exposure]) => {
  const exposed = value * exposure;
  return exposed / (1 + exposed);
});
document.querySelector("#r160").textContent = JSON.stringify([...linear, ...reinhard]);
</script>
