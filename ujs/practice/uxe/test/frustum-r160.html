<!doctype html>
<meta charset="utf-8">
<pre id="r160">pending</pre>
<script type="module">
import { Box3, Frustum, Matrix4, Sphere, Vector3, REVISION, WebGLCoordinateSystem as gl,
  WebGPUCoordinateSystem as gpu } from "../../web/game/three.module.js";
if (REVISION !== "160") throw new Error("three.js revision mismatch");
const v=(x,y,z)=>new Vector3(x,y,z);
const a=new Frustum().setFromProjectionMatrix(new Matrix4(),gl);
const b=new Frustum().setFromProjectionMatrix(new Matrix4(),gpu);
const values=[
  new Frustum().set(...a.planes).planes[0].normal.x,new Frustum().copy(a).planes[1].normal.x,
  a.clone().planes[3].normal.y,
  Number(a.containsPoint(v(1,1,1))),Number(a.containsPoint(v(0,2,0))),
  Number(a.containsPoint(v(0,0,-0.5))),Number(b.containsPoint(v(0,0,-0.5))),
  Number(b.containsPoint(v(0,0,0))),
  Number(a.intersectsSphere(new Sphere(v(2,0,0),1))),
  Number(a.intersectsSphere(new Sphere(v(2,0,0),0.5))),
  Number(a.intersectsBox(new Box3(v(1,-1,-1),v(2,1,1)))),
  Number(a.intersectsBox(new Box3(v(2,-1,-1),v(3,1,1)))),
  new Frustum().setFromProjectionMatrix(new Matrix4().makeScale(2,3,4)).planes[0].constant
];
try { new Frustum().setFromProjectionMatrix(new Matrix4(),0); values.push(0); } catch { values.push(-1); }
document.querySelector("#r160").textContent=JSON.stringify(values);
</script>
