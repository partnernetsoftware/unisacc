<!doctype html>
<meta charset="utf-8">
<pre id="r160">pending</pre>
<script type="module">
import { REVISION, SplineCurve, Vector2 } from "../../web/game/three.module.js";
if (REVISION !== "160") throw Error("r160 revision mismatch");
const source = new SplineCurve([0, 1, 5].map(x => new Vector2(x, 0)));
const curve = new SplineCurve().fromJSON(JSON.parse(JSON.stringify(source.toJSON())));
document.querySelector("#r160").textContent = JSON.stringify([curve.getPoint(0.5).x, curve.getLength(), curve.arcLengthDivisions]);
</script>
