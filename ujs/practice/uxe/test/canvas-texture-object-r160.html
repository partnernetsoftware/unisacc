<!doctype html>
<meta charset="utf-8">
<pre id="r160">pending</pre>
<script type="module">
import { CanvasTexture, REVISION } from "../../web/game/three.module.js";
if (REVISION !== "160") throw new Error("three.js revision mismatch");
const canvas = document.createElement("canvas");
canvas.width = canvas.height = 1;
const context = canvas.getContext("2d");
context.fillStyle = "rgb(27,0,0)";
context.fillRect(0,0,1,1);
const source = new CanvasTexture(canvas), copy = source.clone();
const initial = source.version;
context.fillStyle = "rgb(49,0,0)";
context.fillRect(0,0,1,1);
source.needsUpdate = true;
document.querySelector("#r160").textContent = JSON.stringify([
  initial,context.getImageData(0,0,1,1).data[0],source.version-initial,
  Number(copy !== source && copy.source === source.source),1,
]);
</script>
