<!doctype html>
<meta charset="utf-8">
<pre id="r160">pending</pre>
<script type="module">
import { REVISION, InstancedBufferAttribute } from "../../web/game/three.module.js";
if (REVISION !== "160") throw new Error("revision mismatch");
const attribute = new InstancedBufferAttribute(new Float32Array([1, 2, 3, 4]), 2, false, 3);
const hash = [...JSON.stringify(attribute.toJSON())].reduce((value, ch) =>
  (value * 131 + ch.charCodeAt(0)) % 16777213, 0);
document.querySelector("#r160").textContent = JSON.stringify([hash]);
</script>
