<!doctype html>
<meta charset="utf-8">
<pre id="r160">pending</pre>
<script type="module">
import { CompressedArrayTexture, CompressedCubeTexture, CompressedTexture, RGB_S3TC_DXT1_Format, REVISION } from "../../web/game/three.module.js";
if (REVISION !== "160") throw Error("three.js revision mismatch");
const make = (index, side) => {
  const endpoint = [63488, 2016, 31][index % 3];
  return { data: Uint8Array.of(endpoint % 256, endpoint >>> 8, 0, 0, 0, 0, 0, 0), width: side, height: side };
};
const cubeInputs = Array.from({ length: 6 }, (_, face) => ({
  width: 4, height: 4, mipmaps: [make(face * 2, 4), make(face * 2 + 1, 2)]
}));
const rgba = ([lo,hi]) => [0xff0000ff,0xff00ff00,0xffff0000][[63488,2016,31].indexOf(hi * 256 + lo)];
const format = RGB_S3TC_DXT1_Format;
const levels = cubeInputs[0].mipmaps;
const linear = new CompressedTexture(levels, 4, 4, format);
const array = new CompressedArrayTexture([0, 1].map(level => {
  const data = new Uint8Array(16);
  data.set(cubeInputs[0].mipmaps[level].data, 0);
  data.set(cubeInputs[1].mipmaps[level].data, 8);
  return { data, width: 4 >> level, height: 4 >> level };
}), 4, 4, 2, format);
const cube = new CompressedCubeTexture(cubeInputs, format);
if (linear.flipY || linear.generateMipmaps || array.image.depth !== 2 || cube.image.length !== 6) {
  throw Error("compressed descriptor mismatch");
}
document.querySelector("#r160").textContent = JSON.stringify([
  32, rgba(linear.mipmaps[0].data), rgba(linear.mipmaps[1].data), rgba(array.mipmaps[0].data.subarray(8)),
  rgba(cube.image[5].mipmaps[1].data), -1, -1, -3, -1, -1,
]);
[linear, array, cube].forEach(texture => texture.dispose());
</script>
