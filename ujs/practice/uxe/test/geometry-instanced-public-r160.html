<!doctype html>
<meta charset="utf-8">
<pre id="r160">pending</pre>
<script type="module">
import { Float32BufferAttribute, InstancedBufferAttribute, InstancedBufferGeometry, ObjectLoader,
  REVISION } from "../../web/game/three.module.js";

const result = document.querySelector("#r160");
const encoder = new TextEncoder(), decoder = new TextDecoder();
const maxError = (a, b) => a.length === b.length
  ? a.reduce((error, value, i) => Math.max(error, Math.abs(value - b[i])), 0)
  : 1000 + Math.abs(a.length - b.length);

try {
  if (REVISION !== "160") throw new Error("three.js revision mismatch");
  const query = new URLSearchParams(location.search);
  const binary = await (await fetch("file://" + query.get("wasm"))).arrayBuffer();
  const module = await WebAssembly.compile(binary);
  const mutate = BigInt(query.get("mutate"));
  const run = (mode, input) => {
    const api = new WebAssembly.Instance(module).exports;
    const base = Number(api.uxe_inst_geometry(0n, 0n, 0n));
    const memory = new Uint8Array(api.memory.buffer, base, 60000);
    const view = new DataView(api.memory.buffer, base, 60000);
    memory.set(encoder.encode("position"), 880);
    memory.set(encoder.encode("inst-1"), 896);
    memory.set(encoder.encode('inst "A"!'), 904);
    const payload = encoder.encode(JSON.stringify(input));
    memory.set(payload, 18000);
    const status = Number(api.uxe_inst_geometry(BigInt(mode), BigInt(payload.length), mutate));
    if (mode >= 3) return status;
    if (status <= 0) throw new Error("native JSON status " + status + " mode " + mode);
    return [JSON.parse(decoder.decode(memory.subarray(24000, 24000 + status))), view.getUint32(840, true)];
  };

  const source = new InstancedBufferGeometry();
  source.uuid = "inst-1";
  source.name = 'inst "A"!';
  source.instanceCount = 7;
  source.setAttribute("position", new Float32BufferAttribute([1.25,-2,0,3,.5,-4,0,2,1], 3).setUsage(35048));
  source.setIndex([0,1,2]);
  source.addGroup(0, 3, 2);
  source.computeBoundingSphere();
  const finite = source.toJSON();
  source.instanceCount = Infinity;
  const unlimited = source.toJSON();
  const [native, finiteCount] = run(1, finite);
  const [fallback, unlimitedCount] = run(2, unlimited);
  const loader = new ObjectLoader();
  const read = doc => loader.parseGeometries([doc])["inst-1"];
  const original = read(finite), restored = read(native), defaultRestored = read(fallback);
  source.setAttribute("inst", new InstancedBufferAttribute(new Float32Array([1,2,3]), 1));
  const specialized = source.toJSON();
  result.textContent = JSON.stringify([
    native.instanceCount, finiteCount, Number(native.instanceCount === finite.instanceCount),
    Number(fallback.instanceCount === null), unlimitedCount, Number(restored instanceof InstancedBufferGeometry &&
      restored.isInstancedBufferGeometry === true && defaultRestored instanceof InstancedBufferGeometry),
    Number(original.instanceCount === Infinity && restored.instanceCount === Infinity &&
      defaultRestored.instanceCount === Infinity),
    Number(native.type === finite.type && native.isInstancedBufferGeometry === finite.isInstancedBufferGeometry &&
      restored.uuid === source.uuid && restored.name === source.name),
    restored.attributes.position.count, restored.attributes.position.getX(0),
    restored.attributes.position.usage, restored.index.count, restored.groups[0].materialIndex,
    maxError(restored.attributes.position.array, original.attributes.position.array),
    maxError(restored.index.array, original.index.array),
    Math.abs(restored.boundingSphere.radius - original.boundingSphere.radius),
    restored.boundingSphere.center.y,
    run(3, {...finite, instanceCount: 2.5}), run(4, specialized),
    run(5, {...finite, isInstancedBufferGeometry: false}), run(6, finite), run(7, finite),
  ]);
} catch (error) {
  result.textContent = "error:" + error.message;
}
</script>
