<!doctype html>

<pre id="r160">pending</pre>
<script type="module">
import { ImageLoader, REVISION } from "../../web/game/three.module.js";
if (REVISION !== "160") throw new Error("three.js revision mismatch");
const quant = (second) => [255, 216, 255, 219, 0, 67, 0, 8, second, ...Array(62).fill(8)];
const header = (width, dc, first, second) => [
  255, 194, 0, 11, 8, 0, 1, 0, width, 1, 1, 17, 0,
  255, 196, 0, 39, 0, 1, ...Array(15).fill(0), dc, 16, 1, 1, ...Array(14).fill(0), first, second,
];
const ac = Uint8Array.from([
  ...quant(64), ...header(1, 0, 1, 0),
  255, 218, 0, 8, 1, 1, 0, 0, 0, 0, 127,
  255, 218, 0, 8, 1, 1, 0, 1, 63, 1, 111,
  255, 218, 0, 8, 1, 1, 0, 1, 63, 16, 191, 255, 217,
]);

]);
async function pixels(bytes) {
  const url = URL.createObjectURL(new Blob([bytes], { type: "image/jpeg" }));
  const image = await new ImageLoader().loadAsync(url);
  URL.revokeObjectURL(url);

  canvas.width = image.naturalWidth;
  canvas.height = image.naturalHeight;
  const context = canvas.getContext("2d");
  context.drawImage(image, 0, 0);

}
