<!doctype html>
<meta charset="utf-8">
<pre id="r160">pending</pre>
<script type="module">
import { OrthographicCamera, REVISION, WebGPUCoordinateSystem } from "../../web/game/three.module.js";
if (REVISION !== "160") throw new Error("three.js revision mismatch");
const camera = new OrthographicCamera(-4, 4, 2, -2, 1, 11);
camera.zoom = 2;
camera.updateProjectionMatrix();
const m = camera.projectionMatrix.elements;
const values = [m[0], m[5], m[10], m[14]];
camera.setViewOffset(800, 400, 0, 0, 400, 200);
values.push(m[0], m[5], m[12], m[13]);
camera.clearViewOffset();
camera.coordinateSystem = WebGPUCoordinateSystem;
camera.updateProjectionMatrix();
values.push(m[10], m[14], camera.projectionMatrixInverse.elements[10]);
document.querySelector("#r160").textContent = JSON.stringify(values);
</script>
