<!doctype html>
<meta charset="utf-8">
<pre id="r160">pending</pre>
<script type="module">
import { AnimationClip, AnimationMixer, LoopOnce, NumberKeyframeTrack, Object3D, REVISION } from "../../web/game/three.module.js";
const output=document.querySelector("#r160");
const query=new URLSearchParams(location.search);
function reference() {
  const frames=[], extras=[];
  const newCase=()=>{
    const root=new Object3D();
    root.position.y=10;
    const mixer=new AnimationMixer(root);
    const clip=new AnimationClip("timed",8,[new NumberKeyframeTrack(".position[y]",[0,8],[2,18])]);
    const action=mixer.clipAction(clip).setLoop(LoopOnce,0).play();
    function record(dt) {
      mixer.update(dt);
      frames.push(action.time,action.getEffectiveWeight(),Number(action.enabled),root.position.y);
    }
    return [action,record];
  };
  {
    const [action,step]=newCase();
    action.startAt(1.25).fadeIn(2);
    for(const dt of [.5,.75,.5,.75]) step(dt);
    action.fadeOut(1);
    for(const dt of [.5,.5,.25,.25]) step(dt);
  }
  {
    const [action,step]=newCase();
    action.fadeIn(2);
    step(.5);
    action.stopFading();
    extras.push(action.getEffectiveWeight());
    step(.5);
    action.fadeOut(2).setEffectiveWeight(.5);
    extras.push(action.getEffectiveWeight());
    step(.5);
  }
  {
    const [action,step]=newCase();
    action.time=3;
    action.startAt(-.75);
    for(const dt of [-.5,-.5]) step(dt);
  }
  return [...frames,...extras];
}
function product(wasm) {
  const run=(op,a=0,b=0)=>wasm.uxe_animationaction_timed(BigInt(op),a,b);
  const frames=[],extras=[];
  let time=0;
  const init=()=>{time=0;if(run(0)!==0)throw Error("timed init");};
  const step=dt=>{
    time+=dt;
    if(run(4,time,dt)!==344) throw Error("timed step at " + time);
    frames.push(run(5),run(6),run(7),run(8));
  };
  init();
  run(1,query.has("mutate")?1:1.25);
  run(2,0,2);
  for(const dt of [.5,.75,.5,.75]) step(dt);
  run(3,time,1);
  for(const dt of [.5,.5,.25,.25]) step(dt);
  init();
  run(2,0,2);
  step(.5);
  run(9);
  extras.push(run(6));
  step(.5);
  run(3,time,2);
  run(10,.5);
  extras.push(run(6));
  step(.5);
  init();
  run(11,3);
  run(1,-.75);
  for(const dt of [-.5,-.5]) step(dt);
  init();
  run(1,1);
  run(2,0,1);
  const guarded=run(3,0,-1)===-1 && run(1,Infinity)===-1 &&
    run(4,0,NaN)===-1 && run(5)===0 && run(6)===1 && run(12)===3;
  return [...frames,...extras,Number(guarded)];
}
try {
  if(REVISION!=="160") throw Error("three.js revision mismatch");
  const res=await fetch("file://"+query.get("dir")+"/probe.wasm");
  const {instance:{exports:wasm}}=await WebAssembly.instantiate(await res.arrayBuffer());
  if(wasm.uxe_abi_version()!==1) throw Error("Wasm ABI");
  output.textContent=JSON.stringify([...reference(), ...product(wasm)]);
} catch(error) { output.textContent="error:"+error.message; }
</script>
