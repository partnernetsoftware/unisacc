<!doctype html>
<meta charset="utf-8">
<pre id="r160">pending</pre>
<script type="module">
import { BufferGeometry, Float32BufferAttribute, Group, Mesh, MeshBasicMaterial, Raycaster, REVISION, Vector3 }
  from "../../web/game/three.module.js";
if(REVISION!=="160") throw new Error("three.js revision mismatch");
const root=new Group(),hidden=new Group();
root.layers.set(1);
hidden.layers.set(1);
hidden.visible=false;
function geometry(uv){
  const g=new BufferGeometry();
  g.setAttribute("position",new Float32BufferAttribute([-1,-1,0,1,-1,0,0,1,0],3));
  if(uv)g.setAttribute("uv",new Float32BufferAttribute([0,0,1,0,0.5,1],2));
  return g;
}
const far=new Mesh(geometry(true),new MeshBasicMaterial()),near=new Mesh(geometry(false),far.material);
far.position.z=-5;
near.position.z=-3;
root.add(hidden,near);
hidden.add(far);
root.updateMatrixWorld();
const id=new Map([[far,3],[near,4]]);
const ray=new Raycaster(new Vector3(0.25,0,0),new Vector3(0,0,-1));
const hits=ray.intersectObject(root);
ray.far=4;
const clipped=ray.intersectObject(root);
ray.far=Infinity;
near.layers.set(1);
const masked=ray.intersectObject(root);
const shallow=ray.intersectObject(root,false);
document.querySelector("#r160").textContent=JSON.stringify([
  hits.length,id.get(hits[0].object),hits[0].distance,id.get(hits[1].object),hits[1].uv.x,
  Number(Boolean(hits[0].uv)),clipped.length,id.get(masked[0].object),shallow.length,-1,77,
]);
</script>
