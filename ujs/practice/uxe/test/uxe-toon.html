<!doctype html>
<meta charset="utf-8">
<title>UXE 色阶检查</title>
<canvas width="96" height="96"></canvas>
<pre id="pixels"></pre>
<script type="module">
import { createWebGLRenderer } from "../renderer-webgl.js";
import { MESH_BOX } from "../meshes.js";
import { Scene, PerspectiveCamera } from "../scene.js";

const canvas = document.querySelector("canvas");
const renderer = createWebGLRenderer(canvas, {antialias: false});
const gl = canvas.getContext("webgl");
const scene = new Scene();
scene.ambient.intensity = 0;
scene.fog.density = 0;
scene.lights = [{dir: [1, 2, 3], color: [1, 1, 1], intensity: 1}];
const box = scene.instances("cube", 1, [1, 1, 1]);
box.meshId = MESH_BOX;
box.metalness = 0;
box.roughness = 0;
box.set(0, 0, 0, 0, 1);
const steps = location.search === "?mutate" ? 3 : 4;
const pixels = [];
for (const levels of [steps, 2]) {
  box.toonLevels = levels;
  for (const eye of [[4, 0, 0], [0.001, 4, 0], [0, 0, 4]]) {
    const camera = new PerspectiveCamera();
    camera.setEye(...eye);
    camera.setTarget(0, 0, 0);
    renderer.render(scene, camera);
    const pixel = new Uint8Array(4);
    gl.readPixels(48, 48, 1, 1, gl.RGBA, gl.UNSIGNED_BYTE, pixel);
    pixels.push(...pixel.slice(0, 3));
  }
}
document.querySelector("#pixels").textContent = pixels.join(",");
</script>
