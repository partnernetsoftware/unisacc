<!doctype html>
<meta charset="utf-8">
<pre id="r160">pending</pre>
<script type="importmap">{"imports":{"three":"../../web/game/three.module.js"}}</script>
<script type="module">
import { BufferGeometry, Float32BufferAttribute, Mesh, MeshStandardMaterial, REVISION, Scene } from "three";
const status=document.querySelector("#r160");
try {
  if(REVISION!=="160") throw Error("three.js revision mismatch");
  const query=new URLSearchParams(location.search);
  const root=query.get("package");
  const {GLTFExporter}=await import(`file://${root}/examples/jsm/exporters/GLTFExporter.js`);
  const {GLTFLoader}=await import(`file://${root}/examples/jsm/loaders/GLTFLoader.js`);
  const binary=await fetch(`file://${query.get("wasm")}`);
  const wasm=(await WebAssembly.instantiate(await binary.arrayBuffer())).instance.exports;
  const size=Number(wasm.uxe_export_mesh(BigInt(query.get("mode"))));
  if(size<=0) throw Error("Wasm export failed "+size);
  const output=new Uint8Array(wasm.memory.buffer,2097152+12000,size).slice().buffer;
  const geometry=new BufferGeometry();
  geometry.setAttribute("position", new Float32BufferAttribute([-2,0,0,1,0,0,0,3,0],3));
  geometry.setIndex([0,1,2]);
  const material=new MeshStandardMaterial({metalness:0,roughness:1});
  material.color.setRGB(0.25,0.5,0.75);
  const mesh=new Mesh(geometry,material);
  mesh.position.set(2,3,-4);
  const reference=new Scene();
  reference.add(mesh);
  const expected=await new GLTFExporter().parseAsync(reference,{binary:true});
  const loader=new GLTFLoader();
  async function read(bytes) {
    const result=await loader.parseAsync(bytes,"");
    const target=result.scene.children[0];
    return [
      ...target.position.toArray(),...target.geometry.getAttribute("position").array,
      ...target.geometry.index.array,...target.material.color.toArray(),
      target.material.opacity,target.material.metalness,target.material.roughness,
    ];
  }
  status.textContent=JSON.stringify([...(await read(output)),...(await read(expected)),
    Number(wasm.uxe_export_mesh(2n)),Number(wasm.uxe_export_mesh(3n))]);
  geometry.dispose();
  material.dispose();
} catch(error) {
  status.textContent="error:"+error.message;
}
</script>
