<!doctype html>
<meta charset="utf-8">
<pre id="r160">pending</pre>
<script type="module">
import { CubicBezierCurve, Quaternion, REVISION, Vector2 } from "../../web/game/three.module.js";
if (REVISION !== "160") throw new Error("three.js revision mismatch");
// Equivalent Bezier controls for the scalar Hermite segment with dt = 2.
const curve = new CubicBezierCurve(
  new Vector2(2,0), new Vector2(2+4*2/3,0),
  new Vector2(10-(-2)*2/3,0), new Vector2(10,0),
);
const q = Math.fround(Math.SQRT1_2);
const middle = new Quaternion(0,0,Math.fround(q*.5),Math.fround((1+q)*.5)).normalize();
document.querySelector("#r160").textContent = JSON.stringify([
  curve.getPoint(.5).x, curve.getPoint(0).x, curve.getPoint(1).x, -1, -1,
  Math.fround(middle.z), Math.fround(middle.w),
]);
</script>
