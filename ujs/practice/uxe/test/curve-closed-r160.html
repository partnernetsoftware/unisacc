<!doctype html>
<meta charset="utf-8">
<pre id="r160">pending</pre>
<script type="module">
import { Curve, Vector3, REVISION } from "../../web/game/three.module.js";
if (REVISION !== "160") throw new Error("three.js revision mismatch");
class Loop extends Curve {
  getPoint(t, target = new Vector3()) {
    const a = 2 * Math.PI * t;
    const y = Math.sin(a);
    return target.set(Math.cos(a), y, 0.4 * Math.sin(2 * a) + 0.3 * y + 0.25 * Math.cos(3 * a));
  }
}
const loop = new Loop();
loop.arcLengthDivisions = 32;
const closed = loop.computeFrenetFrames(12, true);
document.querySelector("#r160").textContent = JSON.stringify([
  Number(closed.normals[0].dot(closed.normals[12]) > 0.99999),
  closed.normals[0].dot(closed.binormals[0]), closed.binormals[12].lengthSq(), loop.getPointAt(1).x
]);
</script>
