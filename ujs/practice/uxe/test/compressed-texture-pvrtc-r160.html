<!doctype html>
<meta charset="utf-8">
<pre id="r160">pending</pre>
<script type="module">
import * as THREE from "../../web/game/three.module.js";
if (THREE.REVISION !== "160") throw Error("three.js revision mismatch");
const formats = ["RGB_PVRTC_4BPPV1_Format", "RGB_PVRTC_2BPPV1_Format",
  "RGBA_PVRTC_4BPPV1_Format", "RGBA_PVRTC_2BPPV1_Format"];
const dimensions = [[1,1],[16,8],[32,16],[8,32],[3,8],[0,8]];
const results = [];
for (const name of formats) {
  const format = THREE[name];
  const two = name.includes("2BPP");
  const width = two ? 8 : 4;
  for (const [w,h] of dimensions) {
    if (w < 1 || (w & (w-1)) !== 0) { results.push(-2); continue; }
    const n = Math.max(w, two ? 16 : 8)*Math.max(h,8)/(two ? 4 : 2);
    const mip = {width:w,height:h,data:new Uint8Array(n)};
    const tex = new THREE.CompressedTexture([mip],w,h,format);
    if (tex.format !== format || tex.image.width !== w || tex.image.height !== h ||
        tex.mipmaps[0].data.byteLength !== n) throw Error("PVRTC descriptor");
    results.push(tex.format*1000000+n*512+(name.startsWith("RGBA") ? 256 : 0)+64+width);
    tex.dispose();
  }
}
results.push(-1);
document.querySelector("#r160").textContent = JSON.stringify(results);
</script>
