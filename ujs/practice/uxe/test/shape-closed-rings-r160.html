<!doctype html>
<meta charset="utf-8">
<pre id="r160">pending</pre>
<script type="module">
import { ShapeUtils, REVISION, Vector2 } from "../../web/game/three.module.js";
if (REVISION !== "160") throw new Error("three.js revision mismatch");
const make = pairs => [...pairs, pairs[0]].map(([x, y]) => new Vector2(x, y));
const outer = make([[0,0],[10,0],[10,10],[0,10]]);
const holes = [make([[2,2],[2,4],[4,4],[4,2]]), make([[6,6],[8,6],[8,8],[6,8]])];
const faces = ShapeUtils.triangulateShape(outer, holes);
const points = outer.concat(...holes);
let area = 0;
for (const face of faces) {
  const [a,b,c] = face.map(index => points[index]);
  area += ((b.x-a.x)*(c.y-a.y)-(b.y-a.y)*(c.x-a.x))/2;
}
document.querySelector("#r160").textContent = JSON.stringify([faces.length, area, Math.max(...faces.flat()), 777, -1]);
</script>
