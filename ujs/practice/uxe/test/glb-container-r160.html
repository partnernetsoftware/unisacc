<!doctype html>
<meta charset="utf-8">
<pre id="r160">pending</pre>
<script type="module">
import { BufferGeometry, BufferAttribute, LoaderUtils, REVISION } from "../../web/game/three.module.js";
if (REVISION !== "160") throw new Error("three.js revision mismatch");
const json = new TextEncoder().encode('{"asset":{"version":"2.0"},"buffers":[{"byteLength":12}]}');
const model = JSON.parse(LoaderUtils.decodeText(json));
const vertices = new Float32Array([1.25, 2, -3]);
const geometry = new BufferGeometry().setAttribute("position", new BufferAttribute(vertices, 3));
geometry.computeBoundingBox();
document.querySelector("#r160").textContent = JSON.stringify([
  model.buffers[0].byteLength, geometry.boundingBox.min.x, geometry.boundingBox.max.z, json[0], -2, -3, -2, -1, 777,
  model.buffers[0].byteLength, -4, -6,
]);
</script>
