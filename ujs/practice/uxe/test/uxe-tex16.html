<!DOCTYPE html>
<html lang="zh"><head>
<meta charset="utf-8"/><title>uxe-tex16</title>
<script src="tex16-probes.js"></script>
</head><body>
<canvas id="c" width="128" height="128"></canvas>
<pre id="hud"></pre>
<script type="module">
import { createWebGLRenderer } from "../renderer-webgl.js";
import { Scene, PerspectiveCamera } from "../scene.js";
import { MESH_PLANE } from "../meshes.js";
(async()=>{
  try{
    const P=window.TEX16_PROBES;
    if(!P||P.length!==16) throw new Error("no-probes-js");
    const q=location.search||"";
    const tamperFlip=/(?:\?|&)tamper=flipy(?:&|$)/.test(q);
    const tamperTexel=/(?:\?|&)tamper=texel(?:&|$)/.test(q);
    const rgba=new Uint8Array(64), rgba2=new Uint8Array(64);
    for(let i=0;i<16;i++){
      rgba[i*4]=P[i].r; rgba[i*4+1]=P[i].g; rgba[i*4+2]=P[i].b; rgba[i*4+3]=255;
      rgba2[i*4]=P[i].r2; rgba2[i*4+1]=P[i].g2; rgba2[i*4+2]=P[i].b2; rgba2[i*4+3]=255;
    }
    if(tamperTexel) rgba[0]=0;
    const probes=P.map(p=>({px:p.px,py:p.py}));
    if(tamperFlip){
      for(let r=0;r<2;r++) for(let c=0;c<4;c++){
        const a=r*4+c, b=(3-r)*4+c, t=probes[a]; probes[a]=probes[b]; probes[b]=t;
      }
    }
    const canvas=document.getElementById("c");
    const r=createWebGLRenderer(canvas);
    canvas.width=128; canvas.height=128;
    const scene=new Scene();
    scene.clearColor=[0,0,0,1];
    scene.fog={density:0,color:[0,0,0]};
    scene.ambient={color:[0,0,0],intensity:0};
    scene.lights=[];
    scene.wave=0;
    const cloud=scene.instances("p",1,[1,1,1]);
    cloud.meshId=MESH_PLANE;
    cloud.mapId=1;
    cloud.set(0,0,0,0,8,0,-Math.PI/2);
    const cam=new PerspectiveCamera(1.0,0.05,40);
    cam.setEye(0,0,8); cam.setTarget(0,0,0);
    const gl=canvas.getContext("webgl");
    const px=new Uint8Array(4);
    function sample(){
      const out=[];
      for(const p of probes){
        gl.readPixels(p.px,128-1-p.py,1,1,gl.RGBA,gl.UNSIGNED_BYTE,px);
        out.push([px[0],px[1],px[2]]);
      }
      return out;
    }
    function eq(got, key){
      for(let i=0;i<16;i++){
        const e=key==="r2"?[P[i].r2,P[i].g2,P[i].b2]:[P[i].r,P[i].g,P[i].b];
        if(got[i][0]!==e[0]||got[i][1]!==e[1]||got[i][2]!==e[2]) return 0;
      }
      return 1;
    }
    r.render(scene, cam, [{id:1,w:4,h:4,rgba}]);
    const a=sample();
    r.render(scene, cam, []);
    const b=sample();
    r.render(scene, cam, [{id:1,w:4,h:4,rgba:rgba2}]);
    const c=sample();
    window.__TEX16__={a,b,c,probes};
    document.getElementById("hud").textContent=JSON.stringify({a,b,c,probes});
    const ok=eq(a,"r")&&eq(b,"r")&&eq(c,"r2");
    document.title=ok?"TEX16_OK":"TEX16_FAIL";
  }catch(e){
    document.title="TEX16_ERR";
    document.getElementById("hud").textContent=String(e&&e.message||e);
  }
})();
</script>
</body></html>
