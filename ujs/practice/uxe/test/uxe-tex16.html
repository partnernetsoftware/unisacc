<!DOCTYPE html>
<html lang="zh"><head>
<meta charset="utf-8"/><title>uxe-tex16</title>
</head><body>
<canvas id="c" width="128" height="128"></canvas>
<pre id="hud"></pre>
<script type="module">
import { createWebGLRenderer } from "../renderer-webgl.js";
import { Scene, PerspectiveCamera } from "../scene.js";
import { MESH_PLANE } from "../meshes.js";
const rgba=new Uint8Array([
  255,0,0,255, 0,255,0,255, 0,0,255,255, 255,255,0,255,
  255,0,255,255, 0,255,255,255, 128,0,0,255, 0,128,0,255,
  0,0,128,255, 128,128,0,255, 128,0,128,255, 0,128,128,255,
  64,64,64,255, 192,192,192,255, 255,128,0,255, 0,255,128,255
]);
const probes=[
  [20,20],[49,20],[78,20],[107,20],
  [20,49],[49,49],[78,49],[107,49],
  [20,78],[49,78],[78,78],[107,78],
  [20,107],[49,107],[78,107],[107,107]
];
(async()=>{
  try{
    const canvas=document.getElementById("c");
    const r=createWebGLRenderer(canvas);
    canvas.width=128; canvas.height=128;
    const scene=new Scene();
    scene.clearColor=[0,0,0,1];
    scene.fog={density:0,color:[0,0,0]};
    scene.ambient={color:[0,0,0],intensity:0};
    scene.lights=[];
    scene.wave=0;
    const cloud=scene.instances("p",1,[1,1,1]);
    cloud.meshId=MESH_PLANE;
    cloud.mapId=1;
    cloud.set(0,0,0,0,8,0,-Math.PI/2);
    const cam=new PerspectiveCamera(1.0,0.05,40);
    cam.setEye(0,0,8); cam.setTarget(0,0,0);
    r.render(scene, cam, [{id:1,w:4,h:4,rgba}]);
    const gl=canvas.getContext("webgl");
    const px=new Uint8Array(4);
    const out=[];
    for(const p of probes){
      gl.readPixels(p[0],128-1-p[1],1,1,gl.RGBA,gl.UNSIGNED_BYTE,px);
      out.push([px[0],px[1],px[2]]);
    }
    window.__TEX16__=out;
    document.getElementById("hud").textContent=JSON.stringify(out);
    let ok=1;
    const want=[[255,0,0],[0,255,0],[0,0,255],[255,255,0],[255,0,255],[0,255,255],[128,0,0],[0,128,0],[0,0,128],[128,128,0],[128,0,128],[0,128,128],[64,64,64],[192,192,192],[255,128,0],[0,255,128]];
    for(let k=0;k<16;k++) if(out[k][0]!==want[k][0]||out[k][1]!==want[k][1]||out[k][2]!==want[k][2]) ok=0;
    document.title=ok?"TEX16_OK":"TEX16_FAIL";

  }catch(e){
    document.title="TEX16_ERR";
    document.getElementById("hud").textContent=String(e&&e.message||e);
  }
})();
</script>
</body></html>
