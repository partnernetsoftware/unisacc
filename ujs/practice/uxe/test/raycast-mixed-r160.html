<!doctype html>
<meta charset="utf-8">
<pre id="r160">pending</pre>
<script type="module">
import { BufferGeometry, Float32BufferAttribute, Group, Mesh, MeshBasicMaterial, Points,
  PointsMaterial, Raycaster, REVISION, Vector3 } from "../../web/game/three.module.js";
const status=document.querySelector("#r160");
try {
  if(REVISION!=="160") throw new Error("Three.js revision");
  const geometry=vertices=>new BufferGeometry().setAttribute("position",new Float32BufferAttribute(vertices,3));
  const group=new Group();
  const first=new Points(geometry([0.25,0,-3,0,0,-1]),new PointsMaterial());
  const mesh=new Mesh(geometry([-1,-1,-3,1,-1,-3,0,1,-3]),new MeshBasicMaterial());
  const last=new Points(geometry([0.25,0,-3]),new PointsMaterial());
  const ids=new Map([[first,11],[mesh,12],[last,13]]);
  group.add(first,mesh,last);
  group.updateMatrixWorld(true);
  const ray=new Raycaster(new Vector3(),new Vector3(0,0,-1));
  const hits=ray.intersectObject(group,true);
  const id=hit=>ids.get(hit.object);
  const kind=hit=>hit.object.isMesh?1:2;
  group.remove(first,mesh,last);
  group.add(mesh,first,last);
  const reordered=ray.intersectObject(group,true);
  status.textContent=JSON.stringify([
    hits.length,id(hits[0]),id(hits[1]),id(hits[2]),id(hits[3]),kind(hits[1]),kind(hits[2]),
    hits[0].index,hits[1].index,hits[0].distance,hits[2].distance,hits[1].distanceToRay,
    id(reordered[1]),id(reordered[2]),-2,-1,77,-1,
  ]);
} catch(error) {
  status.textContent=`error:${error.message}`;
}
</script>
