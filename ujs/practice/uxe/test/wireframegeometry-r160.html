<!doctype html>
<meta charset="utf-8">
<pre id="r160">pending</pre>
<script type="module">
import { PlaneGeometry, WireframeGeometry, REVISION } from "./three.module.js";
const dump = document.querySelector("#r160");
try {
  if (REVISION !== "160") throw new Error("three.js revision mismatch");
  const request = new XMLHttpRequest();
  request.open("GET", "probe.wasm", false);
  request.overrideMimeType("text/plain; charset=x-user-defined");
  request.send();
  const bytes = Uint8Array.from(request.responseText, char => char.charCodeAt(0) & 255);
  const { exports } = new WebAssembly.Instance(new WebAssembly.Module(bytes), {});
  if (exports.uxe_geometry_probe() !== 0n) throw new Error("wireframe rejected");
  const memory = 2097152;
  const [vertices, , , , count, indexCount] = new Uint32Array(exports.memory.buffer, memory, 6);
  if (count > 12 || indexCount !== 0) throw new Error("wireframe geometry range");
  const actual = [count, indexCount, ...new Float32Array(exports.memory.buffer, memory + vertices, count * 8)];
  const { position } = new WireframeGeometry(new PlaneGeometry(2, 2, 1, 1)).attributes;
  const ref = [position.count, 0];
  for (let i = 0; i < position.count; i++) {
    ref.push(position.getX(i), position.getY(i), position.getZ(i), 0, 0, 0, 0, 0);
  }
  dump.textContent = JSON.stringify([...actual, ...ref]);
} catch (error) {
  dump.textContent = String(error);
}
</script>
