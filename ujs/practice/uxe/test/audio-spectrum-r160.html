<!doctype html>
<meta charset="utf-8">
<pre id="r160">pending</pre>
<script type="module">
import { Audio, AudioAnalyser, AudioContext, AudioListener, REVISION } from "../../web/game/three.module.js";
const output=document.querySelector("#r160");
try {
  if(REVISION!=="160") throw new Error("three.js revision mismatch");
  async function magnitudes(smoothing) {
    const context=new OfflineAudioContext(1,384,48000);
    AudioContext.setContext(context);
    const audio=new Audio(new AudioListener());
    const analyser=new AudioAnalyser(audio,32).analyser;
    const bins=new Float32Array(analyser.frequencyBinCount);
    analyser.smoothingTimeConstant=smoothing;
    const input=context.createBuffer(1,384,48000);
    input.getChannelData(0).fill(0.5);
    audio.setBuffer(input).play();
    const first=context.suspend(128/48000);
    const second=context.suspend(256/48000);
    const rendered=context.startRendering();
    const scaled=()=>Array.from(bins,db=>Math.round(1e6*10**(db/20)));
    await first;
    analyser.getFloatFrequencyData(bins);
    const a=scaled();
    await context.resume();
    await second;
    analyser.getFloatFrequencyData(bins);
    const b=scaled();
    await context.resume();
    await rendered;
    return [a,b];
  }
  const [dry]=await magnitudes(0);
  const [faded,next]=await magnitudes(0.5);
  output.textContent=JSON.stringify([dry.length,dry[0],dry[1],dry[2],faded[1],next[1],-1,1]);
} catch(error) { output.textContent=`error:${error.message}`; }
</script>
