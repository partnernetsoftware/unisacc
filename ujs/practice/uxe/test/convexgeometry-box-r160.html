<!doctype html>
<meta charset="utf-8">
<pre id="r160">pending</pre>
<script type="importmap">{"imports":{"three":"../../web/game/three.module.js"}}</script>
<script type="module">
import { REVISION, Vector3 } from "three";
const root=new URLSearchParams(location.search).get("package");
const { ConvexGeometry }=await import(`file://${root}/examples/jsm/geometries/ConvexGeometry.js`);
if(REVISION!=="160") throw Error("three.js revision mismatch");
const points=Array.from({length:8},(_,i)=>new Vector3(i&1?2:0,i&2?4:0,i&4?6:0));
points.push(new Vector3(1,2,3));
const geometry=new ConvexGeometry(points);
const positions=geometry.getAttribute("position");
const normals=geometry.getAttribute("normal");
const areas=Array(6).fill(0);
const vertex=(i)=>new Vector3().fromBufferAttribute(positions,i);
for(let i=0;i<positions.count;i+=3) {
  const a=vertex(i),b=vertex(i+1),c=vertex(i+2);
  const normal=new Vector3().fromBufferAttribute(normals,i);
  const axis=normal.toArray().findIndex(x=>Math.abs(x)===1);
  if(axis<0) throw Error("a facet normal is not axis aligned");
  const group=axis*2+Number(normal.getComponent(axis)>0);
  areas[group]+=0.5*b.sub(a).cross(c.sub(a)).dot(normal);
}
document.querySelector("#r160").textContent=JSON.stringify([positions.count,...areas,-2,77,-1]);
geometry.dispose();
</script>
