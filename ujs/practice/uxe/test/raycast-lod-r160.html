<!doctype html>
<meta charset="utf-8">
<pre id="r160">pending</pre>
<script type="module">
import { BufferGeometry, Float32BufferAttribute, LOD, Mesh, MeshBasicMaterial, Raycaster, REVISION, Vector3 }
  from "../../web/game/three.module.js";
if(REVISION!=="160") throw new Error("three.js revision mismatch");
const lod=new LOD();
const geometry=new BufferGeometry().setAttribute("position",new Float32BufferAttribute([
  -1,-1,-3,12,-1,-3,5,12,-3,
],3));
const material=new MeshBasicMaterial();
const near=new Mesh(geometry,material);
const far=new Mesh(geometry,material);
lod.addLevel(near,0);
lod.addLevel(far,10);
near.layers.set(1);
near.visible=false;
lod.updateMatrixWorld(true);
const cast=new Raycaster(new Vector3(0,0,0),new Vector3(0,0,-1));
const first=cast.intersectObject(lod,false);
cast.ray.origin.x=11;
const other=cast.intersectObject(lod,false);
lod.layers.set(1);
const blocked=cast.intersectObject(lod,false);
document.querySelector("#r160").textContent=JSON.stringify([
  first.length,Number(first[0]?.object===near),cast.layers.mask,Number(near.visible),
  Number(first[0]?.object.matrixWorld===near.matrixWorld),Number(other[0]?.object===far),Number(blocked.length===0),-1,
]);
</script>
