<!doctype html>

<pre id="r160">pending</pre>
<script type="module">
import { ConeGeometry, CylinderGeometry, REVISION } from "../../web/game/three.module.js";

const output=document.querySelector("#r160");
const query=new URLSearchParams(location.search);
const dir="file://"+query.get("dir")+"/";
const bytes=async url=>(await fetch(url)).arrayBuffer();
const hash=raw=>raw.reduce((sum,byte)=>(sum*131+byte)%16777213,0);
const encoder=new TextEncoder(),decoder=new TextDecoder();
const uuid="mesh-2",name='deck "A"';

function reference(kind) {
  const Class=kind===3?CylinderGeometry:ConeGeometry;
  const make=open=>kind===3?new Class(1.5,2.25,4,4.5,2.5,open,0,1.5):new Class(1.75,3,4.5,1.5,open,0,1.5);
  const source=make(false),target=make(true);
  const primary=kind===3?"radiusTop":"radius";
  const openDoc=target.toJSON(),openRound=Class.fromJSON(openDoc);
  source.name=name;
  source.setDrawRange(1,5);
  const trace=[];
  let valid=true;
  function listener(object,token,remove) {
    return function(event) {
      valid&&=this===object && event.target===object;
      trace.push(token);
      if(remove) object.removeEventListener("dispose",remove);
    };
  }
  const second=listener(source,82);
  source.addEventListener("dispose",listener(source,41,second));
  source.addEventListener("dispose",second);
  target.addEventListener("dispose",listener(target,61));
  const copied=target.copy(source)===target;
  const clone=source.clone();
  const independent=clone instanceof Class && clone!==source && clone.uuid!==source.uuid &&
    clone.parameters!==source.parameters && clone.index.array!==source.index.array &&
    clone.getAttribute("position").array!==source.getAttribute("position").array;
  source.parameters[primary]=12;
  source.parameters.thetaLength=2.5;
  source.parameters.openEnded=true;
  source.getAttribute("position").setZ(0,9);
  source.index.setX(0,2);
  valid&&=typeof source.dispose()==="undefined";
  const first=trace.splice(0); source.dispose();
  const next=trace.splice(0); target.dispose();
  const other=trace.splice(0); clone.dispose();
  clone.uuid=uuid;
  const serialized=clone.toJSON(),round=Class.fromJSON(serialized);
  return [Number(copied && independent),target.parameters[primary],clone.parameters.radialSegments,
    target.getAttribute("position").getZ(0),clone.index.getX(0),clone.getAttribute("position").getY(0),
    clone.getAttribute("position").count,clone.index.count,clone.drawRange.start,clone.drawRange.count,
    clone.groups.length,first[0]*100+first[1],next[0],other[0],trace.length,
    Number(valid && source.getAttribute("position").getZ(0)===9),hash(encoder.encode(JSON.stringify(serialized))),
    round.getAttribute("position").count,round.index.count,round.parameters[primary],round.groups.length,
    Number(round.parameters.openEnded),round.parameters.thetaLength,
    Number(clone.parameters.openEnded),clone.parameters.thetaLength,
    openRound.getAttribute("position").count,openRound.index.count,openRound.groups.length,
    Number(openRound.parameters.openEnded),Number(openDoc.openEnded===true),
    ...clone.groups.flatMap(group=>[group.start,group.count,group.materialIndex])];
}

async function product(kind,baseModule,probeModule) {
  const base=await WebAssembly.instantiate(baseModule);
  const probe=await WebAssembly.instantiate(probeModule,{
    uxe_radial_public_v1:{uxe_radial_dispatch:base.exports.uxe_radial_dispatch},
  });
  if(base.exports.uxe_abi_version()!==1 || probe.exports.uxe_abi_version()!==1 ||
    base.exports.memory===probe.exports.memory) throw new Error("radial geometry ABI");
  const run=(op,which=0,value=0,mutate=0)=>probe.exports.uxe_radial_probe(
    BigInt(op),BigInt(kind),BigInt(which),BigInt(value),BigInt(mutate));
  const memory=new Uint8Array(base.exports.memory.buffer,run(0),40960);
  const view=new DataView(memory.buffer,memory.byteOffset,memory.byteLength);
  memory.set(encoder.encode(uuid),34900);
  memory.set(encoder.encode(name),35000);
  if(run(1)!==1) throw new Error("radial construction "+kind);
  const openLength=run(7,1,1024);
  if(openLength<0) throw new Error("open parameter JSON");
  const openDoc=JSON.parse(decoder.decode(memory.subarray(32768,32768+openLength)));
  if(run(8,3,openLength)!==560) throw new Error("open parameter round trip");
  const copy=run(2,0),clone=run(2,1),capacity=run(2,2),occupied=run(2,3),wrongKind=run(2,4);
  run(4);
  view.setUint32(2176,77,true);
  const narrow=run(5,0,1),unwritten=view.getUint32(2176,true);
  const mutate=Number(query.get("mutate"));
  let rightTarget=true;
  function dispose(which) {
    const count=run(5,which,3,mutate);
    if(count<0 || count!==view.getUint32(2180,true)) throw new Error("radial event snapshot");
    rightTarget&&=view.getUint32(2176,true)===128+144*which;
    const collected=[];
    for(let i=0;i<count;i++) {
      const listener=view.getUint32(2184+4*i,true);
      collected.push(listener);
      if(listener===41) run(6,which,82);
    }
    return collected;
  }
  const first=dispose(0),next=dispose(0),other=dispose(1),empty=dispose(2);
  const shortJson=run(7,2,8),length=run(7,2,1024,mutate);
  if(length<0) throw new Error("radial parameter JSON");
  const raw=memory.subarray(32768,32768+length);
  const parsed=JSON.parse(decoder.decode(raw));
  if(parsed.type!==(kind===3?"CylinderGeometry":"ConeGeometry") || "data" in parsed ||
      (kind===4 && ("radiusTop" in parsed || "radiusBottom" in parsed)) ||
      parsed.uuid!==uuid || parsed.name!==name) throw new Error("radial JSON object");
  const malformed=run(8,4,length-1);
  if(run(8,4,length)!==704) throw new Error("closed parameter round trip");
  const groups=Array.from({length:3*run(3,2,9)},(_,i)=>run(3,2,16+i));
  return [Number(copy===272 && clone===416),run(3,1,0),run(3,2,1),run(3,1,2),run(3,2,3),run(3,2,4),
    run(3,2,5),run(3,2,6),run(3,2,7),run(3,2,8),run(3,2,9),first[0]*100+first[1],next[0],other[0],
    empty.length,Number(rightTarget && run(3,0,2)===9),hash(raw),run(3,4,5),run(3,4,6),run(3,4,0),run(3,4,9),
    run(3,4,10),run(3,4,11),run(3,2,10),run(3,2,11),run(3,3,5),run(3,3,6),run(3,3,9),run(3,3,10),
    Number(openDoc.openEnded===true),...groups,capacity,occupied,wrongKind,narrow,unwritten,shortJson,malformed];
}

try {
  if(REVISION!=="160") throw new Error("three.js revision mismatch");
  const [base,probe]=await Promise.all([
    WebAssembly.compile(await bytes(dir+"base.wasm")),WebAssembly.compile(await bytes(dir+"probe.wasm")),
  ]);
  const imported=WebAssembly.Module.imports(probe);
  if(imported.length!==1 || imported[0].module!=="uxe_radial_public_v1" ||
      imported[0].name!=="uxe_radial_dispatch") throw new Error("radial probe import");
  output.textContent=JSON.stringify([...reference(3),...await product(3,base,probe),
    ...reference(4),...await product(4,base,probe)]);
} catch(error) {
  output.textContent="error:"+error.message;
}
</script>
