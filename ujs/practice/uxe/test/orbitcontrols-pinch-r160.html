<!doctype html>
<meta charset="utf-8">
<div id="viewport" style="width:200px;height:100px"></div>
<pre id="r160">pending</pre>
<script type="importmap">{"imports":{"three":"../../web/game/three.module.js"}}</script>
<script type="module">
import { REVISION, PerspectiveCamera } from "three";
const root=new URLSearchParams(location.search).get("package");
const { OrbitControls }=await import(`file://${root}/examples/jsm/controls/OrbitControls.js`);
if(REVISION!=="160") throw new Error("three.js revision mismatch");
const viewport=document.querySelector("#viewport");
viewport.setPointerCapture=()=>{};
viewport.releasePointerCapture=()=>{};
const send=(type,id,x)=>viewport.dispatchEvent(new PointerEvent(type,{
  pointerId:id,pointerType:"touch",clientX:x,clientY:20,bubbles:true,
}));
function pinch(distances,speed=1,min=0) {
  const camera=new PerspectiveCamera(90,2,0.1,100);
  camera.position.z=10;
  const controls=new OrbitControls(camera,viewport);
  controls.enablePan=false;
  controls.zoomSpeed=speed;
  controls.minDistance=min;
  send("pointerdown",7,20);
  send("pointerdown",8,40);
  for(const d of distances) send("pointermove",8,20+d);
  const radius=controls.getDistance();
  send("pointerup",8,40);
  send("pointerup",7,20);
  controls.dispose();
  return radius;
}
document.querySelector("#r160").textContent=JSON.stringify([
  pinch([40]),pinch([10]),pinch([40],2),pinch([40],1,7),pinch([40,25]),pinch([20]),10,-1,
]);
</script>
