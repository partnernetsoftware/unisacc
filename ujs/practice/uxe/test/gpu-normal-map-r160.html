<!doctype html>
<meta charset="utf-8">
<pre id="r160">pending</pre>
<script type="module">
import { BufferAttribute, DataTexture, Mesh, MeshNormalMaterial, NearestFilter, ObjectSpaceNormalMap,
  OrthographicCamera, PlaneGeometry, REVISION, Scene, TangentSpaceNormalMap, WebGLRenderer,
  WebGLRenderTarget } from "../../web/game/three.module.js";
import { createGpuSubmit } from "../base/gpu-host-abi.js";

const output = document.querySelector("#r160");
const query = new URLSearchParams(location.search);
const rgba = Uint8Array.of(204, 179, 229, 255);
const packed = new DataView(rgba.buffer).getUint32(0, true);
const cases = [[ObjectSpaceNormalMap, 1], [TangentSpaceNormalMap, 1], [TangentSpaceNormalMap, -1]];
const options = { alpha: false, antialias: false, preserveDrawingBuffer: true };

function context() {
  const canvas = document.createElement("canvas");
  canvas.width = canvas.height = 1;
  const gl = canvas.getContext("webgl2", options);
  if (!gl) throw Error("WebGL2 unavailable");
  return { canvas, gl };
}

function reference() {
  const {canvas, gl} = context();
  const renderer = new WebGLRenderer({ ...options, canvas, context: gl });
  const target = new WebGLRenderTarget(1, 1);
  const normalMap = new DataTexture(rgba, 1, 1);
  normalMap.minFilter = normalMap.magFilter = NearestFilter;
  normalMap.needsUpdate = true;
  const geometry = new PlaneGeometry(2, 2);
  const tangent = new BufferAttribute(new Float32Array(16), 4);
  geometry.setAttribute("tangent", tangent);
  const material = new MeshNormalMaterial({ normalMap });
  material.normalScale.set(0.5, 1.5);
  const mesh = new Mesh(geometry, material);
  mesh.scale.set(2, 1, 1);
  const scene = new Scene();
  scene.add(mesh);
  const camera = new OrthographicCamera(-1, 1, 1, -1, 0, 10);
  camera.position.z = 1;
  renderer.setRenderTarget(target);
  try {
    return cases.flatMap(([mode, handedness]) => {
      for (let i = 0; i < tangent.count; i++) tangent.setXYZW(i, 0, 1, 0, handedness);
      tangent.needsUpdate = true;
      material.normalMapType = mode;
      material.needsUpdate = true;
      renderer.render(scene, camera);
      const value = new Uint8Array(4);
      renderer.readRenderTargetPixels(target, 0, 0, 1, 1, value);
      return [...value];
    });
  } finally {
    renderer.setRenderTarget(null);
    geometry.dispose(); material.dispose(); normalMap.dispose(); target.dispose(); renderer.dispose();
  }
}

async function product() {
  const {gl} = context();
  let exports;
  const submit = createGpuSubmit(gl, () => exports.memory, () => 1);
  const response = await fetch("file://" + query.get("dir") + "/probe.wasm");
  ({ instance: { exports } } = await WebAssembly.instantiate(await response.arrayBuffer(), { uxe_gpu_v1: { host_gpu_submit: submit } }));
  if (exports.uxe_abi_version() !== 1) throw Error("Wasm ABI");
  const run = (op, mode = 0, pixel = packed, side = 1) => Number(exports.uxe_normal_map(BigInt(op), BigInt(mode), BigInt(pixel), BigInt(side)));
  const memory = new Uint8Array(exports.memory.buffer, run(0), 8192);
  const view = new DataView(memory.buffer, memory.byteOffset, memory.byteLength);
  const matrix = (offset, values) => values.forEach((value, i) => view.setFloat64(offset + 8 * i, value, true));
  matrix(512, [0.5, 0, 0, 0, 1, 0, 0, 0, 1]);
  const positions = [-1, -1, 0, 3, -1, 0, -1, 3, 0];
  for (let i = 0; i < 3; i++) for (let j = 0; j < 3; j++) view.setFloat32(1024 + i * 28 + j * 4, positions[i * 3 + j], true);
  const shaders = await Promise.all(["gpu-flat.vert", "gpu-flat.frag"].map(name => fetch("../base/" + name).then(r => r.arrayBuffer())));
  shaders.forEach((bytes, i) => {
    const at = 6144 + 512 * i;
    memory.set(new Uint8Array(bytes), at);
    view.setUint32(192 + i * 8, at, true);
    view.setUint32(196 + i * 8, bytes.byteLength, true);
  });
  const pixels = cases.flatMap(([mode, handedness], i) => {
    matrix(640, [0, 1, 0, -handedness, 0, 0, 0, 0, 1]);
    const mapped = i === 0 && query.get("mutate") === "1" ? TangentSpaceNormalMap : mode;
    if (run(1, mapped) < 0) throw Error("GPU draw " + mode);
    const pixel = new Uint8Array(4);
    gl.readPixels(0, 0, 1, 1, gl.RGBA, gl.UNSIGNED_BYTE, pixel);
    return [...pixel];
  });
  const reverse = run(2, ObjectSpaceNormalMap, packed, -1) === 256 && view.getFloat64(256, true) < 0;
  const invalid = run(2, ObjectSpaceNormalMap, packed, 0);
  const unknown = run(2, 17);
  matrix(512, Array(9).fill(0));
  const kept = view.getFloat64(256, true);
  const singular = run(2, ObjectSpaceNormalMap);
  const unchanged = view.getFloat64(256, true) === kept;
  return [...pixels, run(3), run(4), Number(reverse), invalid, unknown, singular, Number(unchanged)];
}

try {
  if (REVISION !== "160") throw Error("three.js revision mismatch");
  output.textContent = JSON.stringify([...reference(), ...await product()]);
} catch (error) { output.textContent = "error:" + error.message; }
</script>
