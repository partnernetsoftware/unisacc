<!doctype html>
<meta charset="utf-8">
<pre id="r160">pending</pre>
<script type="module">
const result = document.querySelector("#r160");
try {
  const params = new URLSearchParams(location.search);
  const wasm = await WebAssembly.compile(await (await fetch("file://" + params.get("wasm"))).arrayBuffer());
  const values = Array.from({length:14}, (_, index) => {
    const test = params.get("mutate") === "1" && index === 2 ? 14 : index;
    return new WebAssembly.Instance(wasm).exports.uxe_evaluate_case(BigInt(test));
  });
  if (!values.every(Number.isFinite)) throw Error("non-finite result: " + values);
  result.textContent = JSON.stringify(values);
} catch (error) {
  result.textContent = "error:" + error.message;
}
</script>
