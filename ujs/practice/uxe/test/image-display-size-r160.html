<!doctype html>
<meta charset="utf-8">
<pre id="r160">pending</pre>
<script type="module">
import { ImageUtils, REVISION } from "../../web/game/three.module.js";
const output=document.querySelector("#r160");
try {
  if(REVISION!=="160") throw new Error("three.js revision mismatch");
  async function resize(source,width) {
    const original=document.createElement("canvas");
    original.width=2;
    original.height=1;
    const pixels=new ImageData(new Uint8ClampedArray(source),2,1);
    original.getContext("2d").putImageData(pixels,0,0);
    const blob=await new Promise(resolve=>original.toBlob(resolve));
    const url=URL.createObjectURL(blob);
    const image=new Image();
    try {
      image.src=url;
      await image.decode();
      if(image.naturalWidth!==2) throw new Error("intrinsic size changed");
      image.width=width;
      image.height=1;
      const out=new Image();
      out.src=ImageUtils.getDataURL(image);
      await out.decode();
      if(out.naturalWidth!==width) throw new Error("display size ignored");
      const canvas=document.createElement("canvas");
      canvas.width=width;
      canvas.height=1;
      const context=canvas.getContext("2d");
      context.drawImage(out,0,0);
      return context.getImageData(0,0,width,1).data;
    } finally { URL.revokeObjectURL(url); }
  }
  const opaque=await resize([0,0,0,255,255,255,255,255],4);
  const alpha=await resize([255,0,0,255,0,0,255,0],4);
  const down=await resize([0,0,0,255,255,255,255,255],1);
  const packed=new DataView(alpha.buffer).getUint32(12,true);
  output.textContent=JSON.stringify([opaque.length,opaque[0],opaque[4],opaque[8],opaque[12],
    alpha[4],alpha[7],alpha[11],packed,down[0],-1,-1]);
} catch(error) { output.textContent=`error:${error.message}`; }
</script>
