<!doctype html>
<meta charset="utf-8">
<pre id="r160">pending</pre>
<script type="module">
import { DataTexture, Source, REVISION } from "../../web/game/three.module.js";
if (REVISION !== "160") throw new Error("three.js revision mismatch");
const image = new Image();
image.src = "data:,x";
const typed = new DataTexture(new Uint8Array([7, 255]), 2, 1);
const hash = source => {
  let value = 0;
  for (const byte of new TextEncoder().encode(JSON.stringify(source))) value = (value * 131 + byte) % 16777213;
  return value;
};
const values = [null, typed.image, image, [image, typed]].map(data => {
  const source = new Source(data);
  source.uuid = "asset";
  return hash(source.toJSON());
});
const meta = {images: {}};
const cached = new Source(typed.image);
cached.uuid = "asset";
cached.toJSON(meta);
cached.data = image;
document.querySelector("#r160").textContent = JSON.stringify([...values, -1, -1, hash(cached.toJSON(meta)), -1]);
</script>
