<!doctype html>
<meta charset="utf-8">
<pre id="r160">pending</pre>
<script type="module">
import { REVISION, TorusGeometry } from "../../web/game/three.module.js";

const result = document.querySelector("#r160");
const encoder = new TextEncoder(), decoder = new TextDecoder();
const uuid = "torus-6", name = 'hoop "A"';
const digest = bytes => bytes.reduce((hash, value) => (hash * 131 + value) % 16777213, 0);

function surface(torus) {
  const p = torus.parameters;
  const { position, normal, uv } = torus.attributes;
  const columns = Math.floor(p.tubularSegments) + 1;
  const last = position.count - 1;
  return [position.count, torus.index.count, p.radius, p.tube, p.radialSegments,
    p.tubularSegments, p.arc, position.getX(0), normal.getX(0), position.getZ(columns),
    position.getX(last), position.getY(last), uv.getX(last), uv.getY(last), torus.index.getX(0)];
}

try {
  if (REVISION !== "160") throw new Error("three.js revision mismatch");
  const params = new URLSearchParams(location.search);
  const wasm = await (await fetch("file://" + params.get("wasm"))).arrayBuffer();
  const { instance } = await WebAssembly.instantiate(wasm);
  const api = instance.exports;
  const base = Number(api.uxe_torus_public(0n, 0n));
  const memory = new Uint8Array(api.memory.buffer, base, 100000);
  memory.set(encoder.encode(uuid), 6000);
  memory.set(encoder.encode(name), 6016);
  memory.set(encoder.encode('{"tube":"bad"}'), 5760);
  memory.set(encoder.encode("{}"), 5800);
  memory.set(encoder.encode('{"radialSegments":0}'), 5824);
  const length = Number(api.uxe_torus_public(1n, BigInt(params.get("mutate"))));
  if (length <= 0) throw new Error("native torus status " + length);
  const raw = memory.subarray(4096, 4096 + length);
  const parsed = JSON.parse(decoder.decode(raw));
  if (parsed.type !== "TorusGeometry" || parsed.name !== name || parsed.uuid !== uuid || "data" in parsed) {
    throw new Error("torus parameter envelope");
  }
  const actual = new Float64Array(api.memory.buffer, base + 6160, 30);

  const reference = new TorusGeometry(3, 1.25, 4.5, 3.5, 1.5);
  reference.uuid = uuid;
  reference.name = name;
  const doc = reference.toJSON();
  const round = TorusGeometry.fromJSON(doc);
  const restored = surface(round);
  const defaults = TorusGeometry.fromJSON({});
  const targetTrace = [], trace = [];
  let correctTarget = true;
  function listenerB() { trace.push(82); }
  reference.addEventListener("dispose", function(event) {
    correctTarget &&= event.target === reference && this === reference;
    trace.push(41);
    reference.removeEventListener("dispose", listenerB);
  });
  reference.addEventListener("dispose", listenerB);
  round.addEventListener("dispose", () => targetTrace.push(61));
  const copied = round.copy(reference);
  const clone = reference.clone();
  const a = reference.attributes.position, b = copied.attributes.position, c = clone.attributes.position;
  const independent = Number(copied === round && a.array !== b.array && a.array !== c.array &&
    b.array !== c.array && copied.parameters !== reference.parameters && clone.parameters !== reference.parameters);
  reference.parameters.arc = 3;
  reference.parameters.tube = 7;
  a.setX(0, 9);
  a.setX(a.count - 1, 8);
  reference.dispose();
  const firstEvents = trace.splice(0);
  reference.dispose();
  const nextEvent = trace.shift();
  copied.dispose();
  clone.dispose();
  result.textContent = JSON.stringify([digest(raw), ...actual,
    digest(encoder.encode(JSON.stringify(doc))), ...restored,
    defaults.attributes.position.count, defaults.index.count, independent,
    clone.parameters.arc, copied.parameters.tube, b.getX(b.count - 1), c.getX(0),
    firstEvents[0] * 100 + firstEvents[1], Number(correctTarget), nextEvent,
    targetTrace.shift(), trace.length]);
} catch (error) {
  result.textContent = "error:" + error.message;
}
</script>
