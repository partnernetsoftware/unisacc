<!doctype html>
<meta charset="utf-8">
<pre id="r160">pending</pre>
<script type="module">
import { AnimationClip, AnimationMixer, AnimationObjectGroup, NumberKeyframeTrack, Object3D, REVISION }
  from "../../web/game/three.module.js";
const status = document.querySelector("#r160");
if (REVISION !== "160") throw new Error("three.js revision mismatch");
const a = new Object3D(), b = new Object3D();
a.position.y = 10;
b.position.y = 2;
a.scale.x = 2;
b.scale.x = 3;
const group = new AnimationObjectGroup(a,b);
const mixer = new AnimationMixer(group);
const clip = new AnimationClip("two paths",1,[
  new NumberKeyframeTrack(".position[y]",[0,1],[0,40]),
  new NumberKeyframeTrack(".scale[x]",[0,1],[2,6])
]);
mixer.clipAction(clip).play();
const read = () => [a.position.y,b.position.y,a.scale.x,b.scale.x];
mixer.update(0.5);
const half = read();
group.remove(b);
mixer.update(0.25);
const inactive = read();
group.add(b);
mixer.update(0.125);
const reactivated = read();
group.remove(a);
mixer.stopAllAction();
status.textContent = JSON.stringify([...half,...inactive,...reactivated,a.position.y,a.scale.x,b.position.y,b.scale.x,mixer.time]);
</script>
