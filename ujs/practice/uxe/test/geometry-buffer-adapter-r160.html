<!doctype html>
<meta charset="utf-8">
<pre id="r160">pending</pre>
<script type="module">
import { PlaneGeometry, REVISION } from "../../web/game/three.module.js";
if (REVISION !== "160") throw new Error("three.js revision mismatch");
const source = new PlaneGeometry(6, 4, 1, 1);
source.addGroup(0, 6, 3);
const copy = source.clone();
copy.computeBoundingSphere();
source.getAttribute("position").setX(0, 9);
document.querySelector("#r160").textContent = JSON.stringify([
  Object.keys(copy.attributes).length, copy.getAttribute("position").getX(0),
  copy.getAttribute("normal").getZ(1), copy.getAttribute("uv").getX(3),
  copy.index.getX(4), copy.index.array instanceof Uint16Array ? 4 : 0,
  copy.groups[0].materialIndex, copy.boundingSphere.radius, copy.getAttribute("position").getX(0),
  -2, -1, -1,
]);
</script>
