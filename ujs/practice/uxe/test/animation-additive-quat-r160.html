<!doctype html>
<meta charset="utf-8">
<pre id="r160">pending</pre>
<script type="module">
import { AnimationClip, AnimationUtils, Quaternion, QuaternionKeyframeTrack, REVISION, Vector3 } from "../../web/game/three.module.js";
if (REVISION !== "160") throw new Error("three.js revision mismatch");
const x = new Quaternion().setFromAxisAngle(new Vector3(1,0,0), Math.PI/2);
const z = new Quaternion().setFromAxisAngle(new Vector3(0,0,1), Math.PI/2);
const clip = new AnimationClip("source",1,[new QuaternionKeyframeTrack(".quaternion",[0,1],[...x.toArray(),...z.toArray()])]);
const values = AnimationUtils.makeClipAdditive(clip.clone(),0,clip,30).tracks[0].values;
document.querySelector("#r160").textContent = JSON.stringify([
  values.byteLength, values[3], values[5], values[4], -2, -1, 777,
]);
</script>
