<!doctype html>
<meta charset="utf-8">
<pre id="r160">pending</pre>
<script type="module">
import { ImageBitmapLoader, REVISION } from "../../web/game/three.module.js";
if (REVISION !== "160") throw new Error("three.js revision mismatch");
const canvas = document.createElement("canvas");
canvas.width = 1;
canvas.height = 2;
const context = canvas.getContext("2d");
context.putImageData(new ImageData(Uint8ClampedArray.of(40, 0, 0, 255, 64, 0, 0, 128), 1, 2), 0, 0);
const original = context.getImageData(0, 0, 1, 2).data;
const loader = new ImageBitmapLoader().setOptions({ imageOrientation: "flipY", premultiplyAlpha: "premultiply" });
const target = document.createElement("canvas");
target.width = 1;
target.height = 2;
const draw = target.getContext("2d");
if (loader.options.imageOrientation === "flipY") draw.setTransform(1, 0, 0, -1, 0, 2);
draw.drawImage(canvas, 0, 0);
const flipped = draw.getImageData(0, 0, 1, 2).data;
const premultiplied = loader.options.premultiplyAlpha === "premultiply" ? Math.round(flipped[0] * flipped[3] / 255) : flipped[0];
document.querySelector("#r160").textContent = JSON.stringify([
  original.length, original[0], flipped[0], premultiplied, flipped[3], -1, -1,
]);
</script>
