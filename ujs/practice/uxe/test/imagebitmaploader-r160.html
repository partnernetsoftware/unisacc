<!doctype html>
<meta charset="utf-8">
<pre id="r160">pending</pre>
<script type="module">
import { ImageBitmapLoader, REVISION } from "../../web/game/three.module.js";
if (REVISION !== "160") throw new Error("three.js revision mismatch");
const canvas = document.createElement("canvas");
canvas.width = 1;
canvas.height = 2;
const context = canvas.getContext("2d");
context.putImageData(new ImageData(Uint8ClampedArray.of(40, 0, 0, 255, 64, 0, 0, 128), 1, 2), 0, 0);
const original = context.getImageData(0, 0, 1, 2).data;
const url = canvas.toDataURL("image/png");
const loader = new ImageBitmapLoader().setOptions({ imageOrientation: "flipY", premultiplyAlpha: "none" });
const bitmap = await loader.loadAsync(url);
const target = document.createElement("canvas");
target.width = 1;
target.height = 2;
const draw = target.getContext("2d");
draw.drawImage(bitmap, 0, 0);
const flipped = draw.getImageData(0, 0, 1, 2).data;
bitmap.close();
const premultLoader = new ImageBitmapLoader().setOptions({ imageOrientation: "flipY", premultiplyAlpha: "premultiply" });
const premultBitmap = await premultLoader.loadAsync(url);
draw.clearRect(0, 0, 1, 2);
draw.drawImage(premultBitmap, 0, 0);
const premultReadback = draw.getImageData(0, 0, 1, 1).data;
const premultiplied = Math.round(premultReadback[0] * premultReadback[3] / 255);
premultBitmap.close();
document.querySelector("#r160").textContent = JSON.stringify([
  original.length, original[0], flipped[0], premultiplied, flipped[3], -1, -1,
]);
</script>
