<!doctype html>
<meta charset="utf-8">
<pre id="r160">pending</pre>
<script type="module">
import { _SRGBAFormat, DataTexture, Mesh, OrthographicCamera, PlaneGeometry, RawShaderMaterial,
  REVISION, Scene, WebGLRenderTarget, WebGLRenderer } from "../../web/game/three.module.js";
if(REVISION!=="160") throw new Error("three.js revision mismatch");
const canvas=document.createElement("canvas");
const gl=canvas.getContext("webgl");
if(!gl?.getExtension("EXT_sRGB")) throw new Error("WebGL1 EXT_sRGB unavailable");
const renderer=new WebGLRenderer({canvas,context:gl});
const target=new WebGLRenderTarget(1,1);
renderer.setRenderTarget(target);
const camera=new OrthographicCamera(-1,1,1,-1,0,10);
camera.position.z=1;
const geometry=new PlaneGeometry(2,2);
const image=new DataTexture(new Uint8Array([128,64,192,102,255,0,0,233]),2,1,_SRGBAFormat);
image.needsUpdate=true;
const material=new RawShaderMaterial({
  uniforms:{image:{value:image},x:{value:0}},
  vertexShader:"attribute vec3 position;void main(){gl_Position=vec4(position,1.0);}",
  fragmentShader:"precision highp float;uniform sampler2D image;uniform float x;void main(){gl_FragColor=texture2D(image,vec2(x,0.0));}",
});
const scene=new Scene();
scene.add(new Mesh(geometry,material));
const pixels=new Uint8Array(4);
const result=[];
for(const x of [0.25,0.75]) {
  material.uniforms.x.value=x;
  renderer.render(scene,camera);
  renderer.readRenderTargetPixels(target,0,0,1,1,pixels);
  result.push(pixels.reduceRight((word,byte)=>word*256+byte,0));
}
document.querySelector("#r160").textContent=JSON.stringify(result);
geometry.dispose();
material.dispose();
image.dispose();
target.dispose();
renderer.dispose();
</script>
