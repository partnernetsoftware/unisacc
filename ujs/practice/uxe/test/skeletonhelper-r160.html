<!doctype html>
<meta charset="utf-8">
<pre id="r160">pending</pre>
<script type="module">
import { Bone, Group, REVISION, SkeletonHelper } from "../../web/game/three.module.js";
if(REVISION!=="160") throw new Error("three.js revision mismatch");
const root=new Group();
root.position.set(10,20,0);
root.rotation.z=Math.PI/2;
const parent=new Bone();
const child=new Bone();
const grand=new Bone();
parent.position.set(1,0,0);
child.position.set(0,3,0);
grand.position.set(4,0,2);
root.add(parent);
parent.add(child);
child.add(grand);
root.updateMatrixWorld();
const helper=new SkeletonHelper(root);
const pos=helper.geometry.attributes.position;
const rgb=helper.geometry.attributes.color;
const values=[pos.count,pos.getY(0),rgb.getZ(0),rgb.getY(1)];
helper.updateMatrixWorld();
values.push(pos.getY(0),pos.getY(1),pos.getX(2),pos.getZ(2),pos.getY(3),pos.version);
child.position.y=6;
root.updateMatrixWorld();
helper.updateMatrixWorld();
const empty=new SkeletonHelper(new Group());
values.push(pos.getY(0),helper.matrix.elements[12],empty.geometry.attributes.position.count);
let released=0;
helper.geometry.addEventListener("dispose",()=>released++);
helper.material.addEventListener("dispose",()=>released++);
helper.dispose();
empty.dispose();
document.querySelector("#r160").textContent=JSON.stringify([...values,released===2?0:1,-1,-1,0]);
</script>
