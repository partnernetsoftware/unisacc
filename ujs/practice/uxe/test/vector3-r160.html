<!doctype html>
<meta charset="utf-8">
<pre id="r160">pending</pre>
<script type="module">
import { BufferAttribute, Color, Cylindrical, Euler, Matrix3, Matrix4, Quaternion, REVISION, Spherical, Vector3 } from "../../web/game/three.module.js";
if (REVISION !== "160") throw new Error("three.js revision mismatch");
const a = new Vector3(2, -3, 6), b = new Vector3(-4, 5, 2);
const axis = new Vector3(1, 0, 0), z = new Vector3(0, 0, 1);
const half = Math.PI / 2;
const m3 = new Matrix3().set(2, 0, 0, 0, 3, 0, 0, 0, 4);
const m4 = new Matrix4().makeScale(2, 3, 4).setPosition(10, -8, 7);
const view = new Matrix4().makeTranslation(3, 2, 1);
const camera = {matrixWorldInverse: view, projectionMatrix: m4, projectionMatrixInverse: m4, matrixWorld: view};
const fractions = new Vector3(1.5, -2.25, 3.75);
const samples = [0.125, 0.625, 0.25, 0.75, 0.25];
const originalRandom = Math.random;
Math.random = () => samples.shift();
const random = new Vector3().random();
const direction = new Vector3().randomDirection();
Math.random = originalRandom;
document.querySelector("#r160").textContent = JSON.stringify([
  a.clone().set(8, 9, 10).z, a.clone().copy(b).z, a.clone().add(b).z,
  a.clone().sub(b).y, a.clone().multiplyScalar(-2).z, a.dot(b),
  new Vector3().crossVectors(a, b).y, a.clone().cross(b).z, a.lengthSq(), a.length(),
  a.clone().normalize().z, a.distanceToSquared(b), a.distanceTo(b),
  a.clone().applyMatrix3(m3).z, a.clone().applyNormalMatrix(m3).z,
  a.clone().applyMatrix4(m4).y, a.clone().transformDirection(m4).z,
  a.clone().project(camera).x, a.clone().unproject(camera).x,
  a.clone().applyQuaternion(new Quaternion().setFromAxisAngle(z, half)).x,
  a.clone().applyAxisAngle(z, half).y,
  a.clone().applyEuler(new Euler(half, 0, half, "XYZ")).y,
  a.clone().applyEuler(new Euler(half, 0, half, "ZYX")).x,
  a.clone().multiply(b).z, a.clone().divide(b).z,
  a.clone().projectOnVector(axis).x, a.clone().projectOnPlane(axis).x,
  a.clone().reflect(axis).x, a.angleTo(new Vector3(3, 2, 0)), a.clone().lerp(b, 0.25).z,
  a.manhattanLength(), a.manhattanDistanceTo(b), a.clone().setLength(14).z,
  new Vector3().setFromSphericalCoords(2, half, 0).z,
  new Vector3().setFromCylindricalCoords(3, half, 4).x, Number(a.equals(a.clone())),
  a.clone().setScalar(-6).z, a.clone().setX(8).x, a.clone().setY(-9).y, a.clone().setZ(11).z,
  a.clone().setComponent(2, 9.5).z, a.getComponent(2),
  a.clone().addScalar(2.5).y, a.clone().subScalar(5).z,
  new Vector3().addVectors(a, b).x, new Vector3().subVectors(a, b).y,
  new Vector3().multiplyVectors(a, b).z, a.clone().addScaledVector(b, 0.5).y,
  a.clone().divideScalar(2).z, a.clone().negate().z,
  new Vector3().lerpVectors(a, b, 0.25).x,
  new Vector3().setFromMatrixPosition(m4).y, new Vector3().setFromMatrixScale(m4).z,
  new Vector3().setFromMatrixColumn(m4, 3).x, new Vector3().setFromMatrix3Column(m3, 1).y,
  new Vector3().setFromEuler(new Euler(0.125, 0.25, 0.5)).z,
  new Vector3().setFromColor(new Color().setRGB(0.125, 0.25, 0.5)).y,
  new Vector3().setFromSpherical(new Spherical(2, half, 0)).z,
  new Vector3().setFromCylindrical(new Cylindrical(3, half, 4)).y,
  new Vector3().fromArray([8, 2, -3, 6], 1).z, a.toArray([8, 9], 1)[3],
  new Vector3().fromBufferAttribute(new BufferAttribute(new Float32Array([5, 6, 7, 0.1, 0.2, 0.3]), 3), 1).z,
  random.z, direction.y, a.clone().min(b).x, a.clone().max(b).y,
  a.clone().clamp(new Vector3(-1, -2, -3), new Vector3(1, 2, 3)).z,
  a.clone().clampScalar(-2, 2).y, a.clone().clampLength(0, 3.5).z,
  fractions.clone().floor().y, fractions.clone().ceil().x, fractions.clone().round().z,
  fractions.clone().roundToZero().z, [...a][2]
]);
</script>
