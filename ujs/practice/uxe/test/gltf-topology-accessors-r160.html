<!doctype html>
<meta charset="utf-8">
<pre id="r160">pending</pre>
<script type="importmap">{"imports":{"three":"../../web/game/three.module.js"}}</script>
<script type="module">
import { BufferAttribute, BufferGeometry, REVISION, TriangleStripDrawMode } from "three";
const root=new URLSearchParams(location.search).get("package");
const { toTrianglesDrawMode }=await import(`file://${root}/examples/jsm/utils/BufferGeometryUtils.js`);
if(REVISION!=="160") throw new Error("three.js revision mismatch");
const geometry=()=>new BufferGeometry().setAttribute("position",new BufferAttribute(new Float32Array(12),3));
const source=new BufferAttribute(new Uint16Array([3,2,1,0]),1);
const dense=toTrianglesDrawMode(geometry().setIndex(source),TriangleStripDrawMode).index.array;
const implicit=toTrianglesDrawMode(geometry(),TriangleStripDrawMode).index.array;
document.querySelector("#r160").textContent=JSON.stringify([
  dense.length,dense[3],dense[5],implicit[5],-1,-1,-1,1,
]);
</script>
