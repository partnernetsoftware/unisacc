<!doctype html>

<pre id="r160">pending</pre>
<script type="module">
import { ImageUtils, REVISION } from "../../web/game/three.module.js";
if(REVISION!=="160") throw new Error("three.js revision mismatch");
const canvas=document.createElement("canvas");
canvas.width=1;
canvas.height=1;
const saved=globalThis.HTMLCanvasElement;
function mode(source,available) {
  globalThis.HTMLCanvasElement=available?saved:undefined;
  const result=ImageUtils.getDataURL(source);
  if(result===undefined) return 2;
  return result===source.src?0:1;
}
try {
  const results=[mode({src:"DATA:"},true),mode({src:"DATA:"},false),mode({src:"test"},false)];
  const source=document.createElement("canvas");
  source.width=1;
  source.height=1;
  source.src="test";
  results.push(mode(source,true),mode(canvas,false),mode(canvas,true),-1,-1);
  document.querySelector("#r160").textContent=JSON.stringify(results);
} finally { globalThis.HTMLCanvasElement=saved; }
</script>
