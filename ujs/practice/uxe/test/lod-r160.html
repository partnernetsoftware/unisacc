<!doctype html>
<meta charset="utf-8">
<pre id="r160">pending</pre>
<script type="module">
import { LOD, Object3D, PerspectiveCamera, Raycaster, REVISION, Vector3 } from "../../web/game/three.module.js";
if (REVISION !== "160") throw new Error("three.js revision mismatch");
const lod = new LOD(), camera = new PerspectiveCamera();
const near = new Object3D(), far = new Object3D();
lod.addLevel(far, -10, 0.2).addLevel(near, 0, 0);
const step = (x, zoom = 1) => {
  camera.position.x = x;
  camera.zoom = zoom;
  camera.updateMatrixWorld();
  lod.update(camera);
  return lod.getCurrentLevel();
};
step(0);
const start = Number(lod.getObjectForDistance(0) === near);
step(11);
const held = step(9);
const farVisible = Number(far.visible), nearVisible = Number(near.visible);
const returned = step(7);
step(11);
const zoomed = step(9, 2);
step(11);
const ray = new Raycaster(new Vector3(9,0,0),new Vector3(0,0,-1));
near.raycast = (query,result) => result.push(near);
far.raycast = (query,result) => result.push(far);
const target = () => {
  const hits = [];
  lod.raycast(ray,hits);
  return hits[0];
};
const rayFar = Number(target() === far);
ray.ray.origin.x = 7;
const rayNear = Number(target() === near);
ray.ray.origin.x = 9;
lod.position.x = 5;
lod.updateMatrixWorld(true);
const shifted = Number(target() === near);
document.querySelector("#r160").textContent = JSON.stringify([
  start,lod.levels[1].distance,held,farVisible,nearVisible,returned,zoomed,-2,rayFar,rayNear,shifted,0,-1,
]);
</script>
