<!DOCTYPE html>
<html><head><meta charset="utf-8"/><title>SST</title></head>
<body>
<canvas id="c" width="256" height="256"></canvas>
<pre id="hud"></pre>
<script type="module">
import { createWebGLRenderer } from "../renderer-webgl.js";
import { Scene, PerspectiveCamera } from "../scene.js";
import { applyTestScene } from "./test-init.js";
import { MESH_POINTS } from "../meshes.js";
const cols=[
  [255,0,0],[0,255,0],[0,0,255],[255,255,0],
  [255,0,255],[0,255,255],[128,0,0],[0,128,0],
  [0,0,128],[128,128,0],[128,0,128],[0,128,128],
  [64,64,64],[192,192,192],[255,128,0],[0,255,128]
];
const al=[255,191,128,64];
(async()=>{
  const canvas=document.getElementById("c");
  const r=createWebGLRenderer(canvas,{antialias:false});
  const scene=new Scene();
  applyTestScene(scene,[80/255,120/255,60/255,1]);
  scene.fog.density=0;
  const rgba=new Uint8ClampedArray(4*4*4);
  for(let j=0;j<4;j++) for(let i=0;i<4;i++){
    const k=j*4+i, o=k*4, c=cols[k];
    rgba[o]=c[0]; rgba[o+1]=c[1]; rgba[o+2]=c[2]; rgba[o+3]=al[i];
  }
  const cloud=scene.instances("q",1,[1,1,1]);
  cloud.meshId=MESH_POINTS; cloud.count=1; cloud.screenSpace=1; cloud.flags=8;
  cloud.mapId=1; cloud.layer=0; cloud.alphaMode=1;



  cloud.xyz=new Float32Array([132,132,0]);


  cloud.scale=new Float32Array([64]);
  cloud.scaleY=new Float32Array([64]);


  const cam=new PerspectiveCamera(1,0.05,40);
  r.render(scene,cam,[{id:1,w:4,h:4,rgba}]);
  const gl=canvas.getContext("webgl");
  const p=new Uint8Array(4);
  const samples=[];
  for(let j=0;j<4;j++) for(let i=0;i<4;i++){
    const x=100+i*16+8, y=100+j*16+8;
    gl.readPixels(x,256-1-y,1,1,gl.RGBA,gl.UNSIGNED_BYTE,p);
    samples.push([p[0],p[1],p[2]]);
  }
  const out=[];
  [[99,100],[164,100],[100,99],[100,164]].forEach(([x,y])=>{
    gl.readPixels(x,256-1-y,1,1,gl.RGBA,gl.UNSIGNED_BYTE,p);
    out.push([p[0],p[1],p[2]]);
  });
  document.getElementById("hud").textContent=JSON.stringify({samples,out});
  document.title="SST_PENDING";
})().catch(e=>{document.title="SST_ERR"; document.getElementById("hud").textContent=String(e);});
</script>
</body></html>
