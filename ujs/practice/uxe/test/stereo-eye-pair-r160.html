<!doctype html>
<meta charset="utf-8">
<pre id="r160">pending</pre>
<script type="module">
import { Matrix4,PerspectiveCamera,REVISION,StereoCamera } from "../../web/game/three.module.js";
if(REVISION!=="160") throw new Error("three.js revision mismatch");
const mono=new PerspectiveCamera(90,2,1,11);
mono.focus=10;
mono.position.set(3,4,5);
mono.updateMatrixWorld();
const stereo=new StereoCamera();
stereo.update(mono);
const left=stereo.cameraL,right=stereo.cameraR;
const base=left.matrixWorld.elements[12];
const initial=[Number(left!==right),left.layers.mask,right.layers.mask,Number(left.matrixAutoUpdate),
  Number(right.matrixAutoUpdate),base];
left.fov=65;
right.fov=80;
mono.position.x=9;
mono.updateMatrixWorld();
stereo.update(mono);
const same=[left.fov,right.fov,Number(left===stereo.cameraL&&right===stereo.cameraR),
  left.matrixWorld.elements[12],right.matrixWorld.elements[12],new Matrix4().copy(left.matrixWorld).invert().elements[12]];
left.layers.enable(4);
mono.focus=20;
stereo.update(mono);
const distinct=new StereoCamera();
const localChecks=[base,left.layers.mask,left.projectionMatrix.elements[8],base,-1,
  1,-1,Number(distinct.cameraL!==left&&distinct.cameraR!==right),1,-1,-1,1,base];
document.querySelector("#r160").textContent=JSON.stringify([...initial,...same,...localChecks]);
</script>
