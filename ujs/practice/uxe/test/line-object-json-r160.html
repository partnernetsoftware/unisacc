<!doctype html>
<meta charset="utf-8">
<pre id="r160">pending</pre>
<script type="module">
import {BufferGeometry, Line, LineBasicMaterial, ObjectLoader, REVISION, Scene}
  from "../../web/game/three.module.js";
if (REVISION !== "160") throw new Error("three.js revision mismatch");
const geometry = new BufferGeometry();
geometry.uuid = "g";
const material = new LineBasicMaterial();
material.uuid = "m";
const source = new Line(geometry,material);
source.uuid = "o";
source.position.x = 2;
source.visible = false;
source.updateMatrixWorld();
const loaded = new ObjectLoader().parse(source.toJSON());
const cloned = source.clone();
const scene = new Scene();
scene.add(source,cloned);
source.removeFromParent();
document.querySelector("#r160").textContent = JSON.stringify([
  loaded.position.x, Number(loaded.visible), loaded.geometry.uuid === "g" ? 7000 : 0,
  loaded.material.uuid === "m" ? 19 : 0, -2,
  Number(source.parent === null && cloned.parent === scene && cloned.geometry === geometry && cloned.material === material),
]);
</script>
