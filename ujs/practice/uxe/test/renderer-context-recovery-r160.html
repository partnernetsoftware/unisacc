<!doctype html>
<meta charset="utf-8">
<pre id="r160">pending</pre>
<script type="module">
import { BufferGeometry, Camera, Color, DataTexture, Float32BufferAttribute, LinearSRGBColorSpace,
  Mesh, MeshBasicMaterial, NearestFilter, REVISION, Scene, WebGLRenderer } from "../../web/game/three.module.js";
import { createGpuContext } from "../base/gpu-context-abi.js";
const output=document.querySelector("#r160");
try {
  if(REVISION!=="160") throw new Error("three.js revision mismatch");
  const query=new URLSearchParams(location.search);
  const canvas=document.createElement("canvas");
  canvas.width=canvas.height=16;
  const gl=canvas.getContext("webgl2",{alpha:false,preserveDrawingBuffer:true});
  if(!gl) throw new Error("WebGL2 unavailable");
  let wasm;
  const gpu=createGpuContext(gl,()=>wasm.memory);
  const uxResources=trackResources(gl);
  const program=await (await fetch("file://"+query.get("wasm"))).arrayBuffer();
  wasm=new WebAssembly.Instance(new WebAssembly.Module(program),{uxe_gpu_v1:{host_gpu_submit:gpu.submit}}).exports;
  const base=Number(wasm.uxe_scene_consume(9n));
  const heap=new DataView(wasm.memory.buffer,base,16384);
  const shaderPaths=["gpu-flat.vert","gpu-flat.frag","gpu-scene-texture.vert","gpu-texture.frag"];
  for(const [index,path] of shaderPaths.entries()) {
    const at=12000+index*1000;
    const code=new Uint8Array(await (await fetch("../base/"+path)).arrayBuffer());
    new Uint8Array(wasm.memory.buffer,base+at,code.length).set(code);
    heap.setUint32(10752+index*8,at,true);
    heap.setUint32(10756+index*8,code.length,true);
  }
  const scene=new Scene();
  scene.background=new Color(0x000000);
  const camera=new Camera();
  const geometry=new BufferGeometry()
    .setAttribute("position",new Float32BufferAttribute([-.35,-.5,0,.35,-.5,0,0,.5,0],3))
    .setAttribute("uv",new Float32BufferAttribute([0,0,0,0,0,0],2));
  const another=geometry.clone();
  const tex=new DataTexture(new Uint8Array([0,0,255,128]),1,1);
  tex.minFilter=tex.magFilter=NearestFilter;
  tex.needsUpdate=true;
  const green=new MeshBasicMaterial({color:0x00ff00});
  const red=new MeshBasicMaterial({color:0xff0000,opacity:.5,transparent:true,depthWrite:false});
  const blue=new MeshBasicMaterial({map:tex,transparent:true,depthWrite:false});
  const order=[], materials=new Set();
  for(const [id,m,g,x,z] of [[103,red,geometry,0,-.25],[101,green,geometry,0,.5],
    [102,blue,geometry,0,.25],[104,blue,another,-.65,.25],[105,red,geometry,0,-.25]]) {
    const mesh=new Mesh(g,m);
    mesh.position.set(x,0,z);
    mesh.frustumCulled=false;
    if(id===105) mesh.layers.set(1);
    mesh.onBeforeRender=()=>{ order.push(id); materials.add(m); };
    scene.add(mesh);
  }
  const renderer=new WebGLRenderer({alpha:false,antialias:false,preserveDrawingBuffer:true});
  renderer.outputColorSpace=LinearSRGBColorSpace;
  renderer.setSize(16,16);

  function pixels(context) {
    const all=[];
    for(const x of [8,2,14]) {
      const rgba=new Uint8Array(4);
      context.readPixels(x,6,1,1,context.RGBA,context.UNSIGNED_BYTE,rgba);
      all.push(...rgba);
    }
    return all;
  }
  function trackResources(ctx) {
    const kinds=["Texture","Buffer","Program"];
    const objects=kinds.map(kind=>{
      const key="create"+kind;
      const original=ctx[key];
      const created=[];
      ctx[key]=function () {
        const resource=original.call(ctx);
        if(resource) created.push(resource);
        return resource;
      };
      return created;
    });
    return {
      fresh(draw) {
        const before=objects.map(list=>list.length);
        const result=draw();
        const fresh=objects.every((list,i)=>list.length>before[i] &&
          list.slice(before[i]).every(item=>!list.slice(0,before[i]).includes(item)));
        if (!fresh) throw Error("texture, buffer or program was not rebuilt");
        return result;
      }
    };
  }
  function eventOnce(element,type) {
    return new Promise((resolve,reject)=>{
      const timer=setTimeout(()=>{
        element.removeEventListener(type,received);
        reject(Error("missing "+type));
      },3500);
      function received(event) { clearTimeout(timer); resolve(event); }
      element.addEventListener(type,received,{once:true});
    });
  }
  async function recover(element,ctx) {
    const extension=ctx.getExtension("WEBGL_lose_context");
    if(!extension) throw Error("missing WEBGL_lose_context");
    const lost=eventOnce(element,"webglcontextlost");
    extension.loseContext();
    const event=await lost;
    if(!event.defaultPrevented || !ctx.isContextLost()) throw Error("context loss event");
    if(ctx===gl && (gpu.ready || wasm.uxe_scene_consume(101n)!==-6n)) throw Error("lost UXE accepted a draw");
    const restored=eventOnce(element,"webglcontextrestored");
    setTimeout(()=>extension.restoreContext(),0);
    await restored;
    if(ctx.isContextLost()) throw Error("context restore event");
    return [Number(event.defaultPrevented),Number(!ctx.isContextLost())];
  }
  const referenceContext=renderer.getContext();
  const refResources=trackResources(referenceContext);
  const renderUXE=()=>{
    const status=wasm.uxe_scene_consume(100n+BigInt(gpu.generation));
    if(status!==0n) throw Error("UXE frame "+status);
    return pixels(gl);
  };
  const renderR160=()=>{renderer.render(scene,camera);return pixels(referenceContext);};
  const beforeUXE=uxResources.fresh(renderUXE);
  const beforeR160=refResources.fresh(renderR160);
  const results=await Promise.all([recover(canvas,gl),recover(renderer.domElement,referenceContext)]);
  if(gpu.generation!==2 || !gpu.ready || wasm.uxe_scene_consume(101n)!==-3n) throw Error("stale GPU generation");
  const afterUXE=query.has("mutate")?pixels(gl):uxResources.fresh(renderUXE);
  const afterR160=refResources.fresh(renderR160);
  for(const [name,before,after] of [["UXE",beforeUXE,afterUXE],["r160",beforeR160,afterR160]]) {
    const mismatch=before.findIndex((value,i)=>value!==after[i]);
    if(mismatch!==-1) throw Error(name+" restored pixel byte "+mismatch+": "+after[mismatch]+" expected "+before[mismatch]);
  }
  if(gl.getError() || referenceContext.getError()) throw Error("WebGL frame error");
  gpu.detach();
  output.textContent=JSON.stringify([...results.flat(),gpu.generation,...beforeUXE,...beforeR160,...afterUXE,...afterR160]);
  for(const r of [tex,geometry,another,green,red,blue,renderer]) r.dispose();
} catch(error) {
  output.textContent="error:"+error.message;
}
</script>
