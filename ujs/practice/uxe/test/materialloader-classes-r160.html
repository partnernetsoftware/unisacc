<!doctype html>
<meta charset="utf-8">
<pre id="r160">pending</pre>
<script type="module">
import * as three from "../../web/game/three.module.js";
if(three.REVISION!=="160") throw new Error("three.js revision mismatch");
const names=["MeshBasicMaterial","MeshStandardMaterial","MeshLambertMaterial","MeshPhongMaterial","MeshToonMaterial",
  "MeshNormalMaterial","MeshDepthMaterial","MeshDistanceMaterial","MeshMatcapMaterial","PointsMaterial","LineBasicMaterial",
  "LineDashedMaterial","SpriteMaterial","ShadowMaterial","ShaderMaterial","RawShaderMaterial","MeshPhysicalMaterial"];
const loader=new three.MaterialLoader();
const values=names.map(type=>names.indexOf(loader.parse({type,opacity:0.5}).type)+1);
try{loader.parse({type:"MeshBasicMaterialX"});values.push(0);}catch{values.push(-3);}
document.querySelector("#r160").textContent=JSON.stringify(values);
</script>
