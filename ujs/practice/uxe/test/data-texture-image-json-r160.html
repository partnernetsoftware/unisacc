<!doctype html>
<meta charset="utf-8">
<pre id="r160">pending</pre>
<script type="module">
import { DataTexture, ObjectLoader, REVISION } from "../../web/game/three.module.js";
if (REVISION !== "160") throw Error("r160 revision mismatch");
const texture = new DataTexture(new Uint8Array([7,2,3,3,11,12,29,255]), 2, 1);
texture.source.uuid = "i";
const image = texture.source.toJSON();
const loaded = new ObjectLoader().parseImages([image])[image.uuid];
let digest = 0;
for (const byte of new TextEncoder().encode(JSON.stringify(image))) digest = (digest * 131 + byte) % 16777213;
document.querySelector("#r160").textContent = JSON.stringify([
  loaded.data.width, loaded.data.height, loaded.data.data[7], Number(image.uuid === "i"), digest
]);
</script>
