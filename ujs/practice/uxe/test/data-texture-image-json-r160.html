<!doctype html>
<meta charset="utf-8">
<pre id="r160">pending</pre>
<script type="module">
import { CanvasTexture, CubeTexture, DataTexture, ObjectLoader, REVISION } from "../../web/game/three.module.js";
if (REVISION !== "160") throw Error("r160 revision mismatch");
const texture = new DataTexture(new Uint8Array([7,2,3,3,11,12,29,255]), 2, 1);
texture.source.uuid = "i";
const image = texture.source.toJSON();
const loaded = new ObjectLoader().parseImages([image])[image.uuid];
let digest = 0;
for (const byte of new TextEncoder().encode(JSON.stringify(image))) digest = (digest * 131 + byte) % 16777213;
Object.assign(texture, {
  wrapS: 1000, wrapT: 1002, magFilter: 1006, minFilter: 1008, format: 1023, type: 1009,
  colorSpace: "srgb", flipY: false, generateMipmaps: true, anisotropy: 4
});
const serialized = texture.toJSON({ textures: {}, images: {} });
const restored = new ObjectLoader().parseTextures([serialized], { i: loaded })[serialized.uuid];
const faces = Array.from("abcdef", label => {
  const image = new Image();
  image.src = "data:," + label;
  return image;
});
const cube = new CubeTexture(faces);
const cubeMeta = { textures: {}, images: {} };
const cubeJSON = cube.toJSON(cubeMeta);
const faceIDs = cubeMeta.images[cubeJSON.image].url.map(url => url.charCodeAt(url.length - 1));
const canvas = document.createElement("canvas");
canvas.width = canvas.height = 1;
const ctx = canvas.getContext("2d");
ctx.fillStyle = "rgb(27,0,0)";
ctx.fillRect(0,0,1,1);
const canvasTexture = new CanvasTexture(canvas);
const previous = canvasTexture.version;
ctx.fillStyle = "rgb(49,0,0)";
ctx.fillRect(0,0,1,1);
canvasTexture.needsUpdate = true;
const canvasMeta = { textures: {}, images: {} };
const canvasJSON = canvasTexture.toJSON(canvasMeta);
const snapshot = canvasMeta.images[canvasJSON.image].url;
document.querySelector("#r160").textContent = JSON.stringify([
  loaded.data.width, loaded.data.height, loaded.data.data[7], Number(image.uuid === "i"), digest,
  restored.wrapS, restored.wrapT, restored.magFilter, restored.minFilter, restored.format, restored.type,
  Number(restored.colorSpace === "srgb"), Number(restored.flipY), Number(restored.generateMipmaps), restored.anisotropy,
  ...faceIDs, Number(snapshot === canvas.toDataURL()), canvasTexture.version - previous + 2, ctx.getImageData(0,0,1,1).data[0]
]);
</script>
