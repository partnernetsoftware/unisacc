<!doctype html>
<meta charset="utf-8">
<pre id="r160">pending</pre>
<script type="module">
import { PerspectiveCamera, Raycaster, REVISION, Sprite, SpriteMaterial, Vector3 } from "../../web/game/three.module.js";
if (REVISION !== "160") throw new Error("three.js revision mismatch");
const sprite = new Sprite(new SpriteMaterial());
sprite.position.set(1,0,-5);
sprite.center.set(0.25,0.5);
sprite.scale.set(2,4,1);
sprite.updateMatrixWorld();
const ray = new Raycaster(new Vector3(1.5,0.5,0),new Vector3(0,0,-1));
ray.camera = new PerspectiveCamera();
ray.camera.updateMatrixWorld();
const [hit] = ray.intersectObject(sprite);
sprite.material.rotation = Math.PI / 2;
const [turned] = ray.intersectObject(sprite);
sprite.material.rotation = 0;
sprite.material.sizeAttenuation = false;
const [depth] = ray.intersectObject(sprite);
sprite.material.sizeAttenuation = true;
ray.ray.origin.x = 4;
const miss = ray.intersectObject(sprite).length;
ray.ray.origin.x = 1.5;
ray.far = 4;
const clipped = ray.intersectObject(sprite).length;
ray.far = Infinity;
sprite.layers.set(1);
const masked = ray.intersectObject(sprite).length;
sprite.layers.set(0);
ray.ray.direction.set(0,1,0);
const parallel = ray.intersectObject(sprite).length;
document.querySelector("#r160").textContent=JSON.stringify([
  Number(Boolean(hit)),hit.distance,hit.uv.x,hit.uv.y,turned.uv.y,depth.uv.x,miss,clipped,masked,parallel,-1,
]);
</script>
