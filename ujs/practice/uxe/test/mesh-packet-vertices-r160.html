<!doctype html>
<meta charset="utf-8">
<pre id="r160">pending</pre>
<script type="module">
import { BufferGeometry, Float32BufferAttribute, Matrix4, Mesh, MeshBasicMaterial, REVISION } from "../../web/game/three.module.js";
if (REVISION !== "160") throw new Error("three.js revision mismatch");
const geometry = new BufferGeometry();
geometry.setAttribute("position", new Float32BufferAttribute([-0.5, -0.25, 0, 0, 0.5, 0, 0.5, -0.25, 0], 3));
const mesh = new Mesh(geometry, new MeshBasicMaterial());
mesh.material.color.setRGB(0.25, 0.5, 0.75);
mesh.position.set(0.25, -0.125, 0.5);
mesh.scale.y = 2;
mesh.updateMatrixWorld();
const points = geometry.getAttribute("position").clone().applyMatrix4(mesh.matrixWorld);
const projection = new Matrix4().makePerspective(-1, 1, 1, -1, 1, 2);
document.querySelector("#r160").textContent = JSON.stringify([
  points.count, points.getX(0), points.getY(0), points.getY(1), points.getZ(2), mesh.material.color.b,
  -1, projection.elements[11] === -1 ? -2 : 0
]);
</script>
