<!doctype html>
<meta charset="utf-8">
<pre id="r160">pending</pre>
<script type="module">
import { BufferGeometry, Float32BufferAttribute, Group, LOD, Mesh, MeshBasicMaterial, Raycaster, REVISION, Vector3 }
  from "../../web/game/three.module.js";
const status=document.querySelector("#r160");
try {
  if(REVISION!=="160") throw new Error("Three.js revision");
  const geometry=new BufferGeometry().setAttribute("position",new Float32BufferAttribute([
    -1,-1,0,16,-1,0,7,9,0,
  ],3));
  const material=new MeshBasicMaterial();
  const group=new Group();
  const lod=new LOD();
  const nodes=new Map();
  function mesh(id,z) {
    const result=new Mesh(geometry,material);
    result.position.z=z;
    nodes.set(result,id);
    return result;
  }
  const before=mesh(2,-3);
  const near=mesh(4,-3);
  const far=mesh(5,-3);
  const after=mesh(6,-2);
  lod.addLevel(near,0);
  lod.addLevel(far,10);
  group.add(before,lod,after);
  group.updateMatrixWorld(true);
  const cast=new Raycaster(new Vector3(0.25,0,0),new Vector3(0,0,-1));
  const id=hit=>nodes.get(hit.object);
  const standard=cast.intersectObject(group,true);
  near.visible=false;
  const hidden=cast.intersectObject(group,true);
  near.visible=true;
  cast.ray.origin.x=11;
  const distant=cast.intersectObject(group,true);
  cast.ray.origin.x=0.25;
  near.layers.set(1);
  const maskedChild=cast.intersectObject(group,true);
  const directChild=cast.intersectObject(lod,false);
  lod.layers.set(1);
  const maskedBoth=cast.intersectObject(group,true);
  near.layers.set(0);
  const maskedLOD=cast.intersectObject(group,true);
  lod.layers.set(0);
  const direct=cast.intersectObject(lod,false);
  const recursive=cast.intersectObject(lod,true);
  cast.far=2.5;
  const clipped=cast.intersectObject(group,true);
  const ref=[
    standard.length,id(standard[0]),standard[0].distance,id(standard[1]),id(hidden[2]),id(hidden[3]),id(standard[4]),
    id(distant[2]),id(distant[3]),id(distant[4]),maskedChild.length,id(maskedChild[2]),maskedLOD.length,maskedBoth.length,
    direct.length,id(directChild[0]),recursive.length,clipped.length,77,-2,-1,
  ];
  const params=new URLSearchParams(location.search);
  function module(name) {
    const request=new XMLHttpRequest();
    request.open("GET",params.get(name),false);
    request.overrideMimeType("text/plain; charset=x-user-defined");
    request.send();
    const bytes=Uint8Array.from(request.responseText,c=>c.charCodeAt(0)&255);
    return new WebAssembly.Module(bytes);
  }
  const dispatchModule=module("dispatch");
  const meshModule=module("mesh");
  function run(test) {
    const { exports: source }=new WebAssembly.Instance(dispatchModule);
    const scenario=BigInt(test);
    const count=source.uxe_lod_dispatch(0n,scenario);
    if(test>=10) return {count:Number(count)};
    const { exports: destination }=new WebAssembly.Instance(meshModule);
    const input=Number(source.uxe_lod_dispatch(1n,0n));
    const output=destination.uxe_scene_pick(1n,0n,0n);
    // Transfer the identical arena matrices and dispatch rows across the
    // stage0 source limit. Both units preserve the same logical addresses.
    new Uint8Array(destination.memory.buffer,output,5504)
      .set(new Uint8Array(source.memory.buffer,input,5504));
    const hits=destination.uxe_scene_pick(0n,count,scenario);
    return {count:hits,node:index=>destination.uxe_scene_pick(2n,BigInt(index),0n),
      distance:index=>destination.uxe_scene_pick(3n,BigInt(index),0n)};
  }
  const wasm=Array.from({length:13},(_,test)=>run(test));
  const [all,invisible,other,child,layer,both,shallow,shallowChild,recursiveLOD,limit,keep,small,overlap]=wasm;
  const actual=[
    all.count,all.node(0),all.distance(0),all.node(1),invisible.node(2),invisible.node(3),all.node(4),
    other.node(2),other.node(3),other.node(4),child.count,child.node(2),layer.count,both.count,
    shallow.count,shallowChild.node(0),recursiveLOD.count,limit.count,keep.count,small.count,overlap.count,
  ];
  status.textContent=JSON.stringify([...ref,...actual]);
} catch(error) {
  status.textContent=`error:${error.message}`;
}
</script>
