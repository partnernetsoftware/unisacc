<!doctype html>
<meta charset="utf-8">
<pre id="wasm-cases">pending</pre>
<script type="module">
const status = document.querySelector("#wasm-cases");
try {
  const load = async path => WebAssembly.compile(await (await fetch(path)).arrayBuffer());
  const [baseModule, probeModule] = await Promise.all([load("base.wasm"), load("probe.wasm")]);
  const options = new URLSearchParams(location.search);
  const actual = [];
  for (let kind = 0; kind <= 11; kind++) {
    const base = await WebAssembly.instantiate(baseModule);
    const probe = await WebAssembly.instantiate(probeModule, {
      uxe_attribute_json_v1: {uxe_attribute_json_dispatch: base.exports.uxe_attribute_json_dispatch}
    });
    if (base.exports.uxe_abi_version() !== 1 || probe.exports.uxe_abi_version() !== 1 ||
        base.exports.memory === probe.exports.memory) throw new Error("Attribute ABI mismatch");
    actual.push(probe.exports.uxe_evaluate_attribute(BigInt(kind + (options.has(kind === 11 ? "mutate-instanced" : "mutate") ? 16 : 0))));
  }
  status.textContent = JSON.stringify(actual);
} catch (error) {
  status.textContent = "error:" + error.message;
}
</script>
