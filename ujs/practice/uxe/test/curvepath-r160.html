<!doctype html>
<meta charset="utf-8">
<pre id="r160">pending</pre>
<script type="module">
import { CurvePath, LineCurve, Vector2, REVISION } from "../../web/game/three.module.js";
if (REVISION !== "160") throw new Error("three.js revision mismatch");
const path = new CurvePath();
path.add(new LineCurve(new Vector2(0, 0), new Vector2(3, 0)));
path.add(new LineCurve(new Vector2(3, 0), new Vector2(3, 4)));
const lengths = path.getCurveLengths();
const middle = path.getPoint(0.5);
document.querySelector("#r160").textContent = JSON.stringify([lengths.length, lengths[0],
  path.getLength(), middle.x, middle.y, path.getPoint(1).y]);
</script>
