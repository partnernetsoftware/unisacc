<!doctype html>
<meta charset="utf-8">
<pre id="r160">pending</pre>
<script type="module">
import { NumberKeyframeTrack, InterpolateDiscrete, InterpolateLinear, InterpolateSmooth, REVISION } from "../../web/game/three.module.js";
if (REVISION !== "160") throw new Error("three.js revision mismatch");
const track = new NumberKeyframeTrack("x", [0, 2, 4], [0, 4, 0]);
const at = (mode, time) => track.setInterpolation(mode).createInterpolant().evaluate(time)[0];
document.querySelector("#r160").textContent = JSON.stringify([
  at(InterpolateLinear, 1), at(InterpolateDiscrete, 1), at(InterpolateSmooth, 1), at(InterpolateLinear, 2), -1, -1
]);
</script>
