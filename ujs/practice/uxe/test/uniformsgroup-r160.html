<!doctype html>
<meta charset="utf-8">
<pre id="r160">pending</pre>
<script type="module">
import { DynamicDrawUsage, Uniform, UniformsGroup, REVISION } from "../../web/game/three.module.js";
if (REVISION !== "160") throw new Error("three.js revision mismatch");
const g=new UniformsGroup(), a=new Uniform(7), b=new Uniform(11);
const values=[g.uniforms.length,g.usage];
g.add(a).add(b).add(a).remove(a);
g.setName("material").setUsage(DynamicDrawUsage);
values.push(g.uniforms.length,g.uniforms[0].value,Number(g.name==="material"),g.usage);
const c=g.clone();
values.push(c.uniforms[0].value,Number(c.uniforms[0]!==g.uniforms[0]));
let dispose=0;
g.addEventListener("dispose",()=>dispose++);
g.dispose();values.push(dispose);
document.querySelector("#r160").textContent=JSON.stringify(values);
</script>
