<!doctype html>
<meta charset="utf-8">
<pre id="r160">pending</pre>
<script type="module">
import { ShapeUtils, REVISION, Vector2 } from "../../web/game/three.module.js";
if (REVISION !== "160") throw new Error("three.js revision mismatch");
const make = pairs => pairs.map(([x, y]) => new Vector2(x, y));
const outer = make([[0,0],[12,0],[12,10],[8,10],[8,4],[4,4],[4,10],[0,10]]);
const holes = [make([[1,5],[1,7],[3,7],[3,5]]), make([[9,5],[11,5],[11,7],[9,7]])];
const faces = ShapeUtils.triangulateShape(outer, holes);
const points = outer.concat(...holes);
let area = 0, empty = 0, bad = 0;
for (const face of faces) {
  const [a,b,c] = face.map(index => points[index]);
  const turn = (b.x-a.x)*(c.y-a.y)-(b.y-a.y)*(c.x-a.x);
  const x = (a.x+b.x+c.x)/3, y = (a.y+b.y+c.y)/3;
  area += turn/2;
  bad += Number(turn <= 0);
  empty += Number((x>4 && x<8 && y>4) || (x>1 && x<3 && y>5 && y<7) || (x>9 && x<11 && y>5 && y<7));
}
document.querySelector("#r160").textContent = JSON.stringify([faces.length, area, empty, bad]);
</script>
