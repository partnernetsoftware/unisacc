<!doctype html>
<meta charset="utf-8">
<pre id="r160">pending</pre>
<script type="module">
import { ShapeUtils, REVISION, Vector2 } from "../../web/game/three.module.js";
if (REVISION !== "160") throw new Error("three.js revision mismatch");
const make = pairs => pairs.map(([x, y]) => new Vector2(x, y));
const outer = make([[0,0],[10,0],[10,10],[0,10]]);
const holes = [make([[2,2],[2,4],[4,4],[4,2]]), make([[6,6],[8,6],[8,8],[6,8]])];
const points = outer.concat(...holes);
const faces = ShapeUtils.triangulateShape(outer, holes);
let area = 0, inside = 0, bad = 0;
for (const face of faces) {
  const [a, b, c] = face.map(index => points[index]);
  const turn = (b.x-a.x)*(c.y-a.y)-(b.y-a.y)*(c.x-a.x);
  const x = (a.x+b.x+c.x)/3, y = (a.y+b.y+c.y)/3;
  area += turn/2;
  bad += Number(turn <= 0);
  inside += Number((x>2 && x<4 && y>2 && y<4) || (x>6 && x<8 && y>6 && y<8));
}
document.querySelector("#r160").textContent = JSON.stringify([faces.length, area, inside, bad, -1, 777, -1, -2, -2, 777]);
</script>
