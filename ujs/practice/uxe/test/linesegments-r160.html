<!doctype html>
<meta charset="utf-8">
<pre id="r160">pending</pre>
<script type="module">
import { BufferGeometry, Float32BufferAttribute, LineSegments, LineDashedMaterial, REVISION } from "../../web/game/three.module.js";
if (REVISION !== "160") throw new Error("three.js revision mismatch");
const geometry = new BufferGeometry();
geometry.setAttribute("position", new Float32BufferAttribute([0,0,0, 3,0,0, 3,4,0, 3,4,12],3));
const line = new LineSegments(geometry,new LineDashedMaterial());
line.computeLineDistances();
const distances = geometry.getAttribute("lineDistance");
geometry.deleteAttribute("lineDistance");
geometry.setIndex([0,1,2,3]);
line.computeLineDistances();
document.querySelector("#r160").textContent = JSON.stringify([
  distances.count,...distances.array,geometry.hasAttribute("lineDistance") ? 0 : -1
]);
</script>
