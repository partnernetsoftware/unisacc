<!doctype html>
<meta charset="utf-8">
<pre id="r160">pending</pre>
<script type="importmap">{"imports":{"three":"../../web/game/three.module.js"}}</script>
<script type="module">
import {DataTexture,LinearFilter,NoBlending,OrthographicCamera,REVISION,Scene,Vector2,WebGLRenderer,WebGLRenderTarget} from "three";

const status = document.querySelector("#r160");
try {
  if (REVISION !== "160") throw new Error("three.js revision mismatch");
  const query = new URLSearchParams(location.search);
  const {OutlinePass} = await import(`file://${query.get("package")}/examples/jsm/postprocessing/OutlinePass.js`);
  const canvas = document.createElement("canvas");
  const context = canvas.getContext("webgl2");
  if (!context) throw new Error("WebGL2 required");
  const renderer = new WebGLRenderer({canvas,context});
  const pass = new OutlinePass(new Vector2(5,3),new Scene(),new OrthographicCamera(),[]);
  const target = new WebGLRenderTarget(5,3);
  const source = Uint8Array.from({length:60},(_,i) => 4 * ((i * 29 + Math.floor(i / 4) * 13) % 61));
  const texture = new DataTexture(source,5,3);
  texture.minFilter = texture.magFilter = LinearFilter;
  texture.needsUpdate = true;
  const blur = pass.separableBlurMaterial1;
  blur.blending = NoBlending;
  blur.uniforms.colorTexture.value = texture;
  blur.uniforms.texSize.value.set(5,3);
  pass.fsQuad.material = blur;
  const result = [];
  for (const [axis,radius] of [[0,4],[1,1]]) {
    blur.uniforms.direction.value.set(1-axis,axis);
    blur.uniforms.kernelRadius.value = radius;
    renderer.setRenderTarget(target);
    pass.fsQuad.render(renderer);
    const bytes = new Uint8Array(60);
    renderer.readRenderTargetPixels(target,0,0,5,3,bytes);
    const view = new DataView(bytes.buffer);
    for (let i=0; i<15; ++i) result.push(view.getUint32(4*i,true));
  }
  status.textContent = JSON.stringify([...result,-1,-1,-1,-1]);
  renderer.setRenderTarget(null);
  texture.dispose();
  target.dispose();
  pass.dispose();
  renderer.dispose();
} catch (error) {
  status.textContent = `error:${error.message}`;
}
</script>
