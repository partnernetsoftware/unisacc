<!doctype html>
<meta charset="utf-8">
<pre id="r160">pending</pre>
<script type="module">
import { REVISION } from "../../web/game/three.module.js";
if (REVISION !== "160") throw new Error("three.js revision mismatch");
const encoder = new TextEncoder();
const string = encoder.encode(JSON.stringify('"\\\né').replace('\\n', '\\u000a'));
const quarter = JSON.stringify(1.25);
const negative = encoder.encode(JSON.stringify(-25.5));
const tenth = (0.1).toPrecision(55);
if (JSON.parse(tenth) !== 0.1) throw new Error("decimal round trip mismatch");
const zero = JSON.stringify(-0);
const inf = JSON.stringify(Infinity);
document.querySelector("#r160").textContent = JSON.stringify([
  string.length, string[1] + string[4] * 256, string[10] + string[11] * 256, 20,
  quarter.length, negative[0] + negative[3] * 256, tenth.length,
  tenth.charCodeAt(2) + tenth.charCodeAt(tenth.length - 1) * 256,
  zero.charCodeAt(0) + zero.length * 256, inf.charCodeAt(0) + inf.length * 256, 20,
]);
</script>
