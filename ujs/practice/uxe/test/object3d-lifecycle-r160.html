<!doctype html>
<meta charset="utf-8">
<pre id="r160">pending</pre>
<script type="module">
import { Color, Group, Object3D, Scene, Vector3, REVISION } from "../../web/game/three.module.js";
if (REVISION !== "160") throw new Error("three.js revision mismatch");
const root = new Scene();
const a = new Group();
const b = new Object3D();
const c = new Object3D();
a.position.x = 3;
b.position.x = 5;
c.position.x = 7;
b.visible = false;
b.layers.set(4);
root.background = new Color(42);
root.add(a, b);
b.add(c);
root.updateMatrixWorld(true);
const clone = root.clone();
const [cloneA, cloneB] = clone.children;
const [cloneC] = cloneB.children;
const copied = new Object3D();
copied.add(new Object3D());
copied.copy(root);
let visit = 0;
copied.traverse(() => visit++);
const values = [
  Number(clone.isScene), Number(cloneA.isGroup), cloneA.position.x + 10 * cloneB.position.x,
  cloneC.position.x, Number(cloneB.visible) + cloneB.layers.mask, clone.background.getHex(),
  root.clone(false).children.length,
];
cloneA.position.x = 9;
const parent = new Object3D();
parent.position.x = 11;
parent.add(clone);
parent.updateMatrixWorld(true);
values.push(a.position.x, 8, -1, visit, cloneC.getWorldPosition(new Vector3()).x);
cloneB.matrix.elements[12] = 19;
cloneB.layers.mask = 32;
values.push(b.matrix.elements[12], b.layers.mask);
document.querySelector("#r160").textContent = JSON.stringify(values);
</script>
