<!doctype html>
<meta charset="utf-8">
<pre id="r160">pending</pre>
<script type="module">
import { BufferGeometryLoader, REVISION } from "../../web/game/three.module.js";
if (REVISION !== "160") throw new Error("three.js revision mismatch");
const json = {data:{
  attributes:{
    position:{isInterleavedBufferAttribute:true,data:"packed",itemSize:3,offset:0},
    normal:{isInterleavedBufferAttribute:true,data:"packed",itemSize:1,offset:3,normalized:true},
    uv:{isInterleavedBufferAttribute:true,data:"alternate",itemSize:2,offset:0},
  },
  interleavedBuffers:{
    packed:{uuid:"packed",buffer:"raw",type:"Float32Array",stride:4},
    alternate:{uuid:"alternate",buffer:"raw",type:"Float32Array",stride:2},
  },
  arrayBuffers:{raw:[...new Uint32Array(new Float32Array([1,2,3,4,5,6,7,8]).buffer)]},
}};
const loader = new BufferGeometryLoader();
const {attributes} = loader.parse(json);
const {position,normal,uv} = attributes;
let missing = 1;
try {
  loader.parse({...json,data:{...json.data,attributes:{position:{...json.data.attributes.position,data:"unknown"}}}});
} catch { missing = 0; }
document.querySelector("#r160").textContent = JSON.stringify([
  Object.keys(attributes).length,position.getY(1),normal.getX(0),Number(normal.normalized),
  Number(position.data === normal.data),Number(position.data !== uv.data && position.data.array.buffer === uv.data.array.buffer),
  uv.count,uv.getY(3),-1,missing,
]);
</script>
