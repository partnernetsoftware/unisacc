<!doctype html>
<meta charset="utf-8">
<pre id="r160">pending</pre>
<script type="module">
import { ImageUtils, REVISION } from "../../web/game/three.module.js";
if (REVISION !== "160") throw new Error("three.js revision mismatch");
const canvas=document.createElement("canvas");
canvas.width=canvas.height=1;
const ctx=canvas.getContext("2d");
ctx.fillStyle="red";
ctx.fillRect(0,0,1,1);
const data=canvas.toDataURL("image/png");
const direct=new Image();
direct.src=data;
await direct.decode();
const encoded=ImageUtils.getDataURL(direct);
const blob=await (await fetch(data)).blob();
const bitmap=await createImageBitmap(blob);
const bitmapUri=ImageUtils.getDataURL(bitmap);
bitmap.close();
const decoded=new Image();
decoded.src=bitmapUri;
await decoded.decode();
ctx.drawImage(decoded,0,0);
document.querySelector("#r160").textContent=JSON.stringify([
  Number(encoded===data),600,decoded.naturalWidth,ctx.getImageData(0,0,1,1).data[0],77,-1,0,
]);
</script>
