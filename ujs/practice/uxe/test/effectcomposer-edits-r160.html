<!doctype html>
<meta charset="utf-8">
<pre id="r160">pending</pre>
<script type="importmap">{"imports":{"three":"../../web/game/three.module.js"}}</script>
<script type="module">
import { REVISION } from "three";
const root=new URLSearchParams(location.search).get("package");
const { EffectComposer }=await import(`file://${root}/examples/jsm/postprocessing/EffectComposer.js`);
if(REVISION!=="160") throw new Error("three.js revision mismatch");
const renderer={getSize:v=>v.set(40,20),getPixelRatio:()=>1,getRenderTarget:()=>null,setRenderTarget(){}};
const composer=new EffectComposer(renderer);
const calls=[];
const pass=(id,swap=false)=>({id,enabled:true,needsSwap:swap,setSize(){},render(){
  calls.push([id,Number(this.renderToScreen)]);
}});
const middle=pass(20);
composer.addPass(pass(10));
composer.addPass(middle);
composer.addPass(pass(30,true));
composer.insertPass(pass(40),-1);
const count=composer.passes.length;
const inserted=composer.passes[2].id;
composer.removePass(middle);
composer.render(1/60);
const before=composer.passes.length;
composer.removePass(pass(99));
document.querySelector("#r160").textContent=JSON.stringify([
  count,inserted,calls[1][0],calls[2][0],calls[2][1],-1,-1,-2,before-composer.passes.length,
]);
composer.dispose();
</script>
