<!doctype html>
<meta charset="utf-8">
<pre id="r160">pending</pre>
<script type="module">
import { Color, LinearSRGBColorSpace, REVISION } from "../../web/game/three.module.js";
if (REVISION !== "160") throw new Error("three.js revision mismatch");
const styles=["#A2c","#123456","rgb(300,52,86)","rgba(100%, 0%, 0%, .2)","hsl(0,100%,50%)",
  "hsla(120.0,100%,50%,0.5)","ReBeccAPurple","lightgoldenrodyellow"];
const colors=styles.map(text=>new Color().setStyle(text).getHex());
const linear=()=>new Color().setRGB(0.25,0.5,0.75);
document.querySelector("#r160").textContent=JSON.stringify([
  ...colors,new Color().setColorName("ReBeccAPurple").getHex(),
  Number(linear().setStyle("rgb(1.5,2,3)").r===0.25),
  Number(new Color(0x123456).getStyle()==="rgb(18,52,86)"),
  Number(linear().getStyle(LinearSRGBColorSpace)==="color(srgb-linear 0.250 0.500 0.750)")
]);
</script>
