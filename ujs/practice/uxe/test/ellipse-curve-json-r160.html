<!doctype html>
<meta charset="utf-8">
<pre id="r160">pending</pre>
<script type="module">
import { EllipseCurve, REVISION } from "../../web/game/three.module.js";
if (REVISION !== "160") throw Error("r160 revision mismatch");
const curve = new EllipseCurve(1, 1, 2, 1, 0, Math.PI);
const loaded = new EllipseCurve().fromJSON(JSON.parse(JSON.stringify(curve.toJSON())));
document.querySelector("#r160").textContent = JSON.stringify([
  loaded.getPoint(0.5).y, loaded.getLength(), loaded.arcLengthDivisions, loaded.yRadius
]);
</script>
