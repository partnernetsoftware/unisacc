<!doctype html>
<meta charset="utf-8">
<pre id="r160">pending</pre>
<script type="module">
import { BufferGeometry, DoubleSide, Float32BufferAttribute, Mesh, MeshBasicMaterial,
  Raycaster, REVISION, Vector3 } from "../../web/game/three.module.js";
if (REVISION !== "160") throw new Error("three.js revision mismatch");
const geometry = new BufferGeometry();
geometry.setAttribute("position",new Float32BufferAttribute([0,0,-4,2,0,-4,0,2,-4],3));
geometry.setAttribute("uv",new Float32BufferAttribute([0,0,1,0,0,1],2));
const mesh = new Mesh(geometry,new MeshBasicMaterial({side:DoubleSide}));
mesh.position.set(1,0.5,0);
mesh.scale.set(2,1,1);
mesh.updateMatrixWorld();
const ray = new Raycaster(new Vector3(2.5,1,0),new Vector3(0,0,-1));
const hits = ray.intersectObject(mesh);
geometry.setIndex([0,2,1]);
const [reverse] = ray.intersectObject(mesh);
document.querySelector("#r160").textContent=JSON.stringify([
  hits.length,hits[0].uv.x,hits[0].uv.y,hits[0].faceIndex,reverse.uv.x,-1,-2,-1,77,
]);
</script>
