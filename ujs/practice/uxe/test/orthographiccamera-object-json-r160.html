<!doctype html>
<meta charset="utf-8">
<pre id="r160">pending</pre>
<script type="module">
import { OrthographicCamera, ObjectLoader, REVISION } from "../../web/game/three.module.js";
if(REVISION!=="160") throw Error("revision");
const source=new OrthographicCamera(-3,3,2,-2,0.5,10);
source.zoom=2;
source.setViewOffset(800,400,200,100,400,200);
const restored=new ObjectLoader().parse(source.toJSON());
restored.updateProjectionMatrix();
document.querySelector("#r160").textContent=JSON.stringify([
  restored.left,restored.zoom,restored.near,restored.view.offsetX,restored.projectionMatrix.elements[0],-2,
]);
</script>
