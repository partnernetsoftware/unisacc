<!doctype html>
<meta charset="utf-8">
<pre id="r160">pending</pre>
<script type="module">
import { ArrowHelper, REVISION, Vector3 } from "../../web/game/three.module.js";

if (REVISION !== "160") throw new Error("three.js revision mismatch");
const source = new ArrowHelper(new Vector3(0, -1, 0), new Vector3(), 5.5, 0xffff00, 1.5, 0.25);
const json = JSON.stringify([
  source.quaternion.toArray(),
  [source.line.scale.y, source.cone.position.y, source.cone.scale.y, source.cone.scale.x],
]);
let hash = 0;
for (const byte of new TextEncoder().encode(json)) hash = (hash * 131 + byte) % 16777213;

const clone = source.clone();
clone.setDirection(new Vector3(0, 1, 0));
clone.setLength(2, 1, 0.125);
const [quaternion, [shaft, position, height, width]] = JSON.parse(json);
clone.quaternion.fromArray(quaternion);
clone.line.scale.y = shaft;
clone.cone.position.y = position;
clone.cone.scale.set(width, height, width);
clone.line.updateMatrix();
clone.cone.updateMatrix();
const shared = Number(clone.line.geometry === source.line.geometry &&
  clone.cone.geometry === source.cone.geometry && clone.line.material === source.line.material &&
  clone.cone.material === source.cone.material);
document.querySelector("#r160").textContent = JSON.stringify([
  hash, clone.quaternion.x, clone.line.scale.y, clone.cone.position.y, clone.cone.scale.y,
  clone.cone.scale.x, shared, clone.cone.position.y
]);
</script>
