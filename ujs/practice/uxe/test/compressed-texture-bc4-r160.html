if(REVISION!=="160" || RED_RGTC1_Format!==36283 || SIGNED_RED_RGTC1_Format!==36284) throw Error("r160 BC4 tokens");
const repeat=(a,b,x,y,z)=>[a,b,x,y,z,x,y,z];

  repeat(210,0,0x88,0xc6,0xfa),repeat(20,220,255,255,255),
