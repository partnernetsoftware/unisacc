<!doctype html>
<meta charset="utf-8">
<pre id="r160">pending</pre>
<script type="module">
import { Curve, REVISION } from "../../web/game/three.module.js";
if (REVISION !== "160") throw new Error("three.js revision mismatch");
const source = new Curve();
const defaults = source.arcLengthDivisions;
source.arcLengthDivisions = 7;
const copy = new Curve().copy(source);
const clone = source.clone();
const json = source.toJSON();
let hash = 0;
for (const byte of new TextEncoder().encode(JSON.stringify(json))) hash = (hash * 131 + byte) % 16777213;
source.arcLengthDivisions = 3;
const restored = new Curve().fromJSON(json);
document.querySelector("#r160").textContent = JSON.stringify([
  defaults, copy.arcLengthDivisions, clone.arcLengthDivisions, hash, restored.arcLengthDivisions, -1, -1
]);
</script>
