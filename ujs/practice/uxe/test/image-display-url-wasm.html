<!doctype html>
<meta charset="utf-8">
<pre id="wasm-cases">pending</pre>
<script type="module">
const result=document.querySelector("#wasm-cases");
try {
  const count=Number(new URLSearchParams(location.search).get("count"));
  const module=await WebAssembly.compile(await (await fetch("probe.wasm")).arrayBuffer());
  const cases=[];
  for(let i=0;i<count;i++){
    const {exports:wasm}=await WebAssembly.instantiate(module);
    const value=wasm.uxe_evaluate_case(BigInt(i));
    if(i!==2 && i!==3){cases.push(value);continue;}
    const uri=new TextDecoder().decode(new Uint8Array(wasm.memory.buffer,2097152+65536,value));
    if(!uri.startsWith("data:image/png;base64,")) throw new Error("PNG URI missing");
    const image=new Image();
    image.src=uri;
    await image.decode();
    if(i===2){cases.push(image.naturalWidth);continue;}
    const canvas=document.createElement("canvas");
    canvas.width=image.naturalWidth; canvas.height=image.naturalHeight;
    const ctx=canvas.getContext("2d");
    ctx.drawImage(image,0,0);
    cases.push(ctx.getImageData(0,0,1,1).data[0]);
  }
  result.textContent=JSON.stringify(cases);
}catch(error){result.textContent=`error:${error.message}`;}
</script>
