<!doctype html>
<meta charset="utf-8">
<pre id="r160">pending</pre>
<script type="module">
import { Audio, AudioAnalyser, AudioContext, AudioListener, REVISION } from "../../web/game/three.module.js";
const output=document.querySelector("#r160");
try {
  if(REVISION!=="160") throw new Error("three.js revision mismatch");
  const context=new OfflineAudioContext(1,256,48000);
  AudioContext.setContext(context);
  const audio=new Audio(new AudioListener());
  const analyser=new AudioAnalyser(audio,32).analyser;
  const samples=new Uint8Array(32);
  analyser.getByteTimeDomainData(samples);
  const initial=samples[0];
  const buffer=context.createBuffer(1,256,48000);
  const source=buffer.getChannelData(0);
  for(let i=0;i<source.length;i++) source[i]=[-1.5,0.25,1.5,-0.25][i%4];
  audio.setBuffer(buffer).play();
  const suspended=context.suspend(128/48000);
  const rendered=context.startRendering();
  await suspended;
  analyser.getByteTimeDomainData(samples);
  await context.resume();
  await rendered;
  output.textContent=JSON.stringify([initial,samples.length,...samples.slice(0,4),0,-1,-1]);
} catch(error) { output.textContent=`error:${error.message}`; }
</script>
