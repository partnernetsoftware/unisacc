<!doctype html>
<meta charset="utf-8">
<pre id="r160">pending</pre>
<script type="module">
import { BufferGeometry, Float32BufferAttribute, Mesh, MeshBasicMaterial, Object3D, Vector3, REVISION } from "../../web/game/three.module.js";
if (REVISION !== "160") throw new Error("three.js revision mismatch");
const root = new Object3D();
root.position.x = 10;
const geometry = new BufferGeometry();
geometry.setAttribute("position", new Float32BufferAttribute([1, 2, 3], 3));
const morph = new Float32BufferAttribute([5, 10, 15], 3);
morph.name = "peak";
geometry.morphAttributes.position = [morph];
const material = new MeshBasicMaterial();
const mesh = new Mesh(geometry, material);
mesh.position.x = 2;
mesh.morphTargetInfluences[0] = 0.25;
root.add(mesh);
root.updateMatrixWorld();
const value = () => mesh.getVertexPosition(0, new Vector3());
const absolute = value();
geometry.morphTargetsRelative = true;
const relative = value();
geometry.morphTargetsRelative = false;
const copy = new Mesh(geometry, material).copy(mesh, false);
mesh.morphTargetInfluences[0] = 0.5;
document.querySelector("#r160").textContent = JSON.stringify([
  mesh.matrixWorld.elements[12], mesh.morphTargetDictionary.peak, absolute.x, absolute.z, relative.y,
  copy.getVertexPosition(0, new Vector3()).x, Number(copy.geometry === mesh.geometry), copy.position.x, -1, -1
]);
</script>
