<!doctype html>
<meta charset="utf-8">
<pre id="r160">pending</pre>
<script type="module">
import { REVISION, InterleavedBuffer, InterleavedBufferAttribute } from "../../web/game/three.module.js";
if (REVISION !== "160") throw new Error("revision mismatch");
const data = new InterleavedBuffer(new Float32Array([1, 2, 3, 4, 5, 6]), 3);
data.uuid = "abc";
const view = new InterleavedBufferAttribute(data, 2, 1);
const hash = [...JSON.stringify(view.toJSON({}))].reduce((value, ch) =>
  (value * 131 + ch.charCodeAt(0)) % 16777213, 0);
document.querySelector("#r160").textContent = JSON.stringify([hash]);
</script>
