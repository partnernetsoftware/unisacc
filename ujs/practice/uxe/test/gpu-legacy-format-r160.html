<!doctype html>
<meta charset="utf-8">
<pre id="r160">pending</pre>
<script type="module">
import { AlphaFormat, DataTexture, LuminanceAlphaFormat, LuminanceFormat, Mesh, OrthographicCamera,
  PlaneGeometry, RawShaderMaterial, REVISION, Scene, WebGLRenderTarget, WebGLRenderer
} from "../../web/game/three.module.js";
if(REVISION!=="160") throw new Error("three.js revision mismatch");
const canvas=document.createElement("canvas");
const context=canvas.getContext("webgl");
if(!context) throw new Error("WebGL1 unavailable");
const renderer=new WebGLRenderer({canvas,context});
const target=new WebGLRenderTarget(1,1);
renderer.setRenderTarget(target);
const camera=new OrthographicCamera(-1,1,1,-1,0,10);
camera.position.z=1;
const geometry=new PlaneGeometry(2,2);
const material=new RawShaderMaterial({
  uniforms:{image:{value:null}},
  vertexShader:"attribute vec3 position;void main(){gl_Position=vec4(position,1.0);}",
  fragmentShader:"precision highp float;uniform sampler2D image;void main(){gl_FragColor=texture2D(image,vec2(0.75,0.0));}",
});
const scene=new Scene();
scene.add(new Mesh(geometry,material));
const pixels=new Uint8Array(4);
const result=[];
for(const [format,channels] of [[AlphaFormat,1],[LuminanceFormat,1],[LuminanceAlphaFormat,2]]) {
  const texture=new DataTexture(new Uint8Array([10,45,180,200].slice(0,2*channels)),2,1,format);
  texture.needsUpdate=true;
  material.uniforms.image.value=texture;
  renderer.render(scene,camera);
  renderer.readRenderTargetPixels(target,0,0,1,1,pixels);
  result.push(pixels.reduceRight((word,byte)=>word*256+byte,0));
  texture.dispose();
}
document.querySelector("#r160").textContent=JSON.stringify(result);
geometry.dispose();
material.dispose();
target.dispose();
renderer.dispose();
</script>
