<!doctype html>
<meta charset="utf-8">
<pre id="r160">pending</pre>
<script type="importmap">{"imports":{"three":"../../web/game/three.module.js"}}</script>
<script type="module">
import { REVISION, SRGBColorSpace } from "three";
const root=new URLSearchParams(location.search).get("package");
const { KTX2Loader }=await import(`file://${root}/examples/jsm/loaders/KTX2Loader.js`);
if(REVISION!=="160") throw Error("three.js revision mismatch");
function make(srgb) {
  const bytes=new Uint8Array(260);
  const view=new DataView(bytes.buffer);
  const put=(offset,value)=>view.setUint32(offset,value,true);
  bytes.set([0xab,0x4b,0x54,0x58,0x20,0x32,0x30,0xbb,0x0d,0x0a,0x1a,0x0a]);
  const header=[srgb?43:37,1,4,2,0,0,1,2,0,128,92];
  header.forEach((value,index)=>put(12+index*4,value));
  put(80,228); put(88,32); put(96,32);
  put(104,220); put(112,8); put(120,8);
  put(128,92); put(136,0x00580002); put(140,srgb?0x020101:0x010101); put(148,4);
  for(let i=0;i<4;i++) {
    put(156+i*16, ((i<3?i:srgb?31:15)<<24)+(7<<16)+8*i);
    put(168+i*16,255);
  }
  bytes.set([71,72,73,255],220);
  bytes.set([19,29,39,255],228);
  return bytes.buffer;
}
const loader=new KTX2Loader();
const linear=await loader._createTexture(make(false));
const srgb=await loader._createTexture(make(true));
const color=texture=>Number(texture.colorSpace===SRGBColorSpace);
document.querySelector("#r160").textContent=JSON.stringify([
  linear.image.width,linear.image.height,linear.mipmaps.length,linear.mipmaps[0].data[0],
  linear.mipmaps[1].data[0],linear.mipmaps[1].data[1],color(linear),color(srgb),-4,-4,-3,-1,77
]);
linear.dispose();
srgb.dispose();
loader.dispose();
</script>
