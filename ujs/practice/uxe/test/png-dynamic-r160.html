<!doctype html>
<meta charset="utf-8">
<pre id="r160">pending</pre>
<script type="module">
import { ImageLoader, REVISION } from "../../web/game/three.module.js";
if (REVISION !== "160") throw new Error("three.js revision mismatch");
const canvas = document.createElement("canvas");
canvas.width = 64;
canvas.height = 1;
const context = canvas.getContext("2d");
context.fillStyle = "rgb(24, 128, 245)";
context.fillRect(0, 0, 64, 1);
const image = await new ImageLoader().loadAsync(canvas.toDataURL("image/png"));
context.clearRect(0, 0, 64, 1);
context.drawImage(image, 0, 0);
const rgba = context.getImageData(0, 0, 64, 1).data;
document.querySelector("#r160").textContent = JSON.stringify([rgba.length, rgba[0], rgba[253], rgba[254], -6, 99, -1]);
</script>
