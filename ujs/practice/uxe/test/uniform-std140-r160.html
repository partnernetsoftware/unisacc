<!doctype html>
<meta charset="utf-8">
<pre id="r160">pending</pre>
<script type="module">
import { Camera, Matrix3, Mesh, PlaneGeometry, RawShaderMaterial, REVISION, Scene, Uniform, UniformsGroup, Vector2, Vector3, WebGLRenderer, GLSL3 } from "../../web/game/three.module.js";
if (REVISION !== "160") throw new Error("three.js revision mismatch");
const canvas = document.createElement("canvas");
const gl = canvas.getContext("webgl2");
const renderer = new WebGLRenderer({ canvas, context: gl });
renderer.setSize(4, 4);
const fields = [new Uniform(new Vector3(3,5,7)), new Uniform(11),
  new Uniform(new Matrix3().fromArray([1,2,3,4,5,6,7,8,9])), new Uniform(new Vector2(13,17))];
const group = new UniformsGroup().setName("Values");
fields.forEach(field => group.add(field));
const material = new RawShaderMaterial({
  glslVersion: GLSL3,
  vertexShader: "in vec3 position; void main(){gl_Position=vec4(position,1.0);}",
  fragmentShader: "precision highp float; layout(std140) uniform Values { vec3 color; float gain; mat3 basis; vec2 shift; }; out vec4 pixel; void main(){pixel=vec4((color+vec3(gain,basis[1].x,shift.x))/32.0,1.0);}",
  uniformsGroups: [group],
});
const scene = new Scene();
scene.add(new Mesh(new PlaneGeometry(2,2), material));
renderer.render(scene, new Camera());
const [color, gain, basis, shift] = fields;
document.querySelector("#r160").textContent = JSON.stringify([
  group.__size, color.__data[0], gain.__data[0], basis.__data[4], basis.__data[3], shift.__data[0], 777, -1, -1,
]);
</script>
