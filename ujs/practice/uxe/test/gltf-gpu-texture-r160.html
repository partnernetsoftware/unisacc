<!doctype html>
<meta charset="utf-8">
<pre id="r160">pending</pre>
<script type="importmap">{"imports":{"three":"../../web/game/three.module.js"}}</script>
<script type="module">
import { ClampToEdgeWrapping, LinearMipmapLinearFilter, MirroredRepeatWrapping, REVISION } from "three";
const root=new URLSearchParams(location.search).get("package");
const { GLTFLoader }=await import("file://"+root+"/examples/jsm/loaders/GLTFLoader.js");
if(REVISION!=="160") throw new Error("three.js revision mismatch");
const canvas=document.createElement("canvas");
canvas.width=1;
canvas.height=2;
const context=canvas.getContext("2d");
context.fillStyle="#ff0000";
context.fillRect(0,0,1,1);
context.fillStyle="#0000ff";
context.fillRect(0,1,1,1);
const asset={asset:{version:"2.0"},images:[{uri:canvas.toDataURL("image/png")}],
  samplers:[{magFilter:9729,minFilter:9987,wrapS:33648,wrapT:33071}],textures:[{source:0,sampler:0}]};
const scene=await new GLTFLoader().parseAsync(JSON.stringify(asset),"");
const texture=await scene.parser.getDependency("texture",0);
context.drawImage(texture.image,0,0);
const data=context.getImageData(0,0,1,2).data;
const pixels=new DataView(data.buffer);
const filter=texture.minFilter===LinearMipmapLinearFilter?2:-1;
const wrapS=texture.wrapS===MirroredRepeatWrapping?2:-1;
const wrapT=texture.wrapT===ClampToEdgeWrapping?0:-1;
document.querySelector("#r160").textContent=JSON.stringify([
  texture.image.width,texture.image.height,filter,wrapS,wrapT,pixels.getUint32(0,true),pixels.getUint32(4,true),1,-1,
]);
</script>
