<!doctype html>
<meta charset="utf-8">
<pre id="r160">pending</pre>
<script type="module">
import { AudioContext, AudioLoader, LoadingManager, MaterialLoader, REVISION } from "../../web/game/three.module.js";

const output=document.querySelector("#r160");
const query=new URLSearchParams(location.search);
const wav=[82,73,70,70,42,0,0,0,87,65,86,69,102,109,116,32,16,0,0,0,1,0,1,0,64,31,0,0,128,62,0,0,2,0,16,0,100,97,116,97,6,0,0,0,0,0,0,128,0,64];
const audioBody=btoa(String.fromCharCode(...wav));
const audioPath="data:audio/wav;base64,";
const materialPath="data:application/json,";
const materialBody=opacity=>encodeURIComponent(JSON.stringify({
  type:"MeshStandardMaterial", opacity, roughness:0.25
}));
const malformed="%7B";
const reject=promise=>promise.then(()=>false,()=>true);

async function reference() {
  AudioContext.setContext(new OfflineAudioContext(1,3,8000));
  const manager=new LoadingManager();
  const material=new MaterialLoader(manager).setPath(materialPath);
  const audio=new AudioLoader(manager).setPath(audioPath);
  const [mat,clip]=await Promise.all([material.loadAsync(materialBody(0.5)),audio.loadAsync(audioBody)]);
  const failed=await reject(material.loadAsync(malformed));
  const next=await material.loadAsync(materialBody(0.75));
  return [mat.opacity,mat.roughness,clip.length,clip.sampleRate,clip.getChannelData(0)[1],Number(failed),next.opacity];
}

async function product() {
  const binary=await (await fetch("file://"+query.get("wasm"))).arrayBuffer();
  const {instance:{exports}}=await WebAssembly.instantiate(binary);
  const run=(op,kind=0,x=0,y=0,z=0,w=0)=>Number(exports.uxe_loader_async(
    BigInt(op),BigInt(kind),BigInt(x),BigInt(y),BigInt(z),BigInt(w)));
  const base=run(0);
  const bytes=new Uint8Array(exports.memory.buffer,base,16384);
  const view=new DataView(bytes.buffer,bytes.byteOffset,bytes.byteLength);
  const encoder=new TextEncoder(), decoder=new TextDecoder();
  const put=(at,value)=>{ const raw=encoder.encode(value); bytes.set(raw,at); return raw.length; };
  if(run(1)!==1 || run(2,0,384,put(384,materialPath))!==128 ||
    run(2,1,448,put(448,audioPath))!==256) throw new Error("family setup");

  function request(kind,body) {
    const id=run(3,kind,512,put(512,body));
    if(id<=0) throw new Error("could not begin");
    const url=decoder.decode(bytes.subarray(view.getUint32(2880,true),
      view.getUint32(2880,true)+view.getUint32(2884,true)));
    return {
      id,
      url,
      async receive(at) {
        const response=await fetch(url);
        const payload=new Uint8Array(await response.arrayBuffer());
        bytes.set(payload,at);
        return run(4,kind,id,response.status,at,payload.length);
      },
    };
  }

  const mat=request(0,materialBody(0.5)), audio=request(1,audioBody);
  const pre=run(5,0,mat.id), pendingDuplicate=run(3,0,512,1);
  const audioEvents=await audio.receive(8192);
  const wrongKind=run(5,1,audio.id);
  if(run(6,1,audio.id)!==3200) throw new Error("WAV decode");
  const audioFrames=view.getUint32(3204,true), audioRate=view.getUint32(3212,true);
  const pcm=view.getFloat32(3268,true);
  const matEvents=await mat.receive(6144);
  if(run(5,0,mat.id)!==3104) throw new Error("material decode");
  const roughness=view.getFloat64(3128,true);
  const opacity=query.get("mutate")==="1"?roughness:view.getFloat64(3120,true);

  const bad=request(0,malformed);
  const stale=run(4,0,mat.id,200,6144,1);
  await bad.receive(6144);
  const badResult=run(5,0,bad.id);
  const unchanged=Number(view.getFloat64(3120,true)===0.5);
  const next=request(0,materialBody(0.75));
  await next.receive(6144);
  if(run(5,0,next.id)!==3104) throw new Error("decode after error");
  return [opacity,roughness,audioFrames,audioRate,pcm,Number(badResult<0),view.getFloat64(3120,true),
    pre,pendingDuplicate,wrongKind,stale,badResult,unchanged,audioEvents,matEvents,next.id,run(7),run(8)];
}

try {
  if(REVISION!=="160") throw new Error("three.js revision mismatch");
  output.textContent=JSON.stringify([...await reference(),...await product()]);
} catch(error) {
  output.textContent="error:"+error.message;
}
</script>
