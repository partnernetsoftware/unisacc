<!doctype html>
<meta charset="utf-8">
<pre id="r160">pending</pre>
<script type="module">
import { CompressedTexture, RGB_S3TC_DXT1_Format, RGBA_S3TC_DXT1_Format, REVISION } from "../../web/game/three.module.js";
if (REVISION !== "160") throw Error("three.js revision mismatch");
const data = Uint8Array.of(0,248,31,0,228,228,228,228,0,0,0,248,255,255,255,255);
const mip = { data, width: 5, height: 3 };
const opaque = new CompressedTexture([mip], 5, 3, RGB_S3TC_DXT1_Format);
const alpha = new CompressedTexture([mip], 5, 3, RGBA_S3TC_DXT1_Format);
if (opaque.mipmaps[0] !== mip || alpha.mipmaps[0] !== mip || opaque.generateMipmaps || alpha.generateMipmaps) {
  throw Error("compressed mip descriptor mismatch");
}
// The r160 objects retain compressed bytes. The swatches are an independent
// specification for this fixture; compressed GPU upload is a separate gate.
const swatches = [[255,0,0,255],[0,0,255,255],[170,0,85,255],[85,0,170,255],[0,0,0,255],[0,0,0,0]];
const pack = rgba => rgba.reduce((sum, byte, i) => sum + byte * 256 ** i, 0);
document.querySelector("#r160").textContent = JSON.stringify([
  opaque.image.width * opaque.image.height * 4,
  ...swatches.map(pack), pack(swatches.at(-1)), -1, -1, -3, -2,
]);
opaque.dispose();
alpha.dispose();
</script>
