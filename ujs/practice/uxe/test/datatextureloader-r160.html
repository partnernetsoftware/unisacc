<!doctype html>
<meta charset="utf-8">
<pre id="r160">pending</pre>
<script type="module">
import { DataTextureLoader, LinearFilter, REVISION } from "../../web/game/three.module.js";
if (REVISION !== "160") throw new Error("three.js revision mismatch");
class FixtureLoader extends DataTextureLoader {
  parse(buffer) { return { data: new Uint8Array(buffer), width: 1, height: 1 }; }
}
const texture = await new FixtureLoader().loadAsync("data:application/octet-stream;base64,AwUH/w==");
document.querySelector("#r160").textContent = JSON.stringify([
  texture.image.width, Number(texture.minFilter === LinearFilter), texture.image.data[1], -1, -1,
]);
texture.dispose();
</script>
