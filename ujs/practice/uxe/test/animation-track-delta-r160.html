<script type="module">
import { AnimationClip, AnimationUtils, InterpolateDiscrete, InterpolateLinear, NumberKeyframeTrack, REVISION } from "../../web/game/three.module.js";
if (REVISION !== "160") throw new Error("three.js revision mismatch");
const target = new AnimationClip("target",1,[new NumberKeyframeTrack("a",[0,1],[5,10])]);
const delta = (frame,mode) => {
  const reference = new AnimationClip("reference",1,[new NumberKeyframeTrack("a",[0,0,1],[0,2,10],mode)]);
  return AnimationUtils.makeClipAdditive(target.clone(),frame,reference,30).tracks[0].values;
};
document.querySelector("#r160").textContent = JSON.stringify([
  ...delta(15,InterpolateLinear), delta(0,InterpolateLinear)[0], delta(60,InterpolateLinear)[0],
  delta(15,InterpolateDiscrete)[0], -1,
]);
</script>
