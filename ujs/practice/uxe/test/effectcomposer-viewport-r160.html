<!doctype html>
<meta charset="utf-8">
<pre id="r160">pending</pre>
<script type="importmap">{"imports":{"three":"../../web/game/three.module.js"}}</script>
<script type="module">
import { Vector2, REVISION } from "three";
const root=new URLSearchParams(location.search).get("package");
const { EffectComposer }=await import(`file://${root}/examples/jsm/postprocessing/EffectComposer.js`);
if(REVISION!=="160") throw Error("three.js revision mismatch");
const renderer={getPixelRatio:()=>1,getSize:target=>target.set(5,7)};
const composer=new EffectComposer(renderer);
let passWidth=0,passHeight=0;
composer.addPass({setSize(w,h){passWidth=w;passHeight=h;}});
composer.setSize(320,180);
composer.setPixelRatio(2);
const large=[composer.readBuffer.width,composer.writeBuffer.height,passWidth,passHeight];
composer.setSize(201,101);
composer.setPixelRatio(1.5);
const fractional=[composer.readBuffer.width,composer.writeBuffer.height].map(Math.floor);
composer.dispose();
document.querySelector("#r160").textContent=JSON.stringify([...large,...fractional,201,101,1.5,-1,5,7,0]);
</script>
