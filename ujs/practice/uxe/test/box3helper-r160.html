<!doctype html>
<meta charset="utf-8">
<pre id="r160">pending</pre>
<script type="module">
import { Box3, Box3Helper, REVISION, Vector3 } from "../../web/game/three.module.js";
if(REVISION!=="160") throw new Error("three.js revision mismatch");
const box=new Box3(new Vector3(-2,2,1),new Vector3(6,8,3));
const helper=new Box3Helper(box);
helper.updateMatrixWorld(true);
const expected=[helper.position.x,helper.position.y,helper.scale.x,helper.scale.y,
  helper.geometry.attributes.position.array[23],helper.geometry.index.array[23]];
box.min.x=10;
helper.updateMatrixWorld(true);
let released=0;
helper.geometry.addEventListener("dispose",()=>released++);
helper.material.addEventListener("dispose",()=>released++);
helper.dispose();
expected.push(helper.position.y,released===2?0:1,-1);
document.querySelector("#r160").textContent=JSON.stringify(expected);
</script>
