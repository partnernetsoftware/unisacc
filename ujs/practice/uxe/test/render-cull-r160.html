<!doctype html>
<meta charset="utf-8">
<pre id="r160">pending</pre>
<script type="module">
import { BufferGeometry, Camera, Float32BufferAttribute, Mesh, MeshBasicMaterial,
  REVISION, Scene, Sphere, Vector3, WebGLRenderer } from "../../web/game/three.module.js";
const output = document.querySelector("#r160");
try {
  if (REVISION !== "160") throw new Error("three.js revision mismatch");
  const renderer = new WebGLRenderer();
  renderer.setSize(8, 8);
  renderer.sortObjects = false;
  const scene = new Scene();
  const camera = new Camera();
  const geometry = new BufferGeometry();
  geometry.setAttribute("position", new Float32BufferAttribute([-0.5,-0.5,0,0.5,-0.5,0,0,0.5,0], 3));
  geometry.boundingSphere = new Sphere(new Vector3(), 0.5);
  const material = new MeshBasicMaterial();
  [0,2,1.5,8,0,2].forEach((x, index) => {
    const mesh = new Mesh(geometry, material);
    mesh.position.x = x;
    if (index === 5) mesh.scale.x = 3;
    mesh.frustumCulled = index !== 3;
    mesh.visible = index !== 4;
    mesh.userData.index = index;
    scene.add(mesh);
  });
  renderer.render(scene, camera);
  const list = renderer.renderLists.get(scene, 0).opaque;
  output.textContent = JSON.stringify([list.length, ...list.map(item => item.object.userData.index), -1, -2]);
  renderer.dispose();
} catch (error) {
  output.textContent = String(error);
}
</script>
