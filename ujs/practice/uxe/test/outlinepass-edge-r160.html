<!doctype html>
<meta charset="utf-8">
<pre id="r160">pending</pre>

<script type="module">
import {
  DataTexture, DataUtils, Mesh, MeshBasicMaterial, OrthographicCamera, PlaneGeometry,
  REVISION, Scene, Vector2, WebGLRenderer, WebGLRenderTarget
} from "three";

const output = document.querySelector("#r160");
try {
  if (REVISION !== "160") throw new Error("three.js revision mismatch");
  const root = new URLSearchParams(location.search).get("package");
  const { OutlinePass } = await import(`file://${root}/examples/jsm/postprocessing/OutlinePass.js`);
  const canvas = document.createElement("canvas");
  const context = canvas.getContext("webgl2");
  if (!context) throw new Error("WebGL2 required");
  const renderer = new WebGLRenderer({ canvas, context });
  const camera = new OrthographicCamera(-4, 4, 3, -3, 1, 10);
  camera.position.z = 5;
  const scene = new Scene();
  const material = new MeshBasicMaterial();
  const selected = new Mesh(new PlaneGeometry(4, 2), material);
  const blocker = new Mesh(new PlaneGeometry(2, 2), material);
  blocker.position.set(-1, 0, 1);
  scene.add(selected, blocker);
  const pass = new OutlinePass(new Vector2(8, 6), scene, camera, [selected]);
  pass.downSampleRatio = 1;
  pass.setSize(8, 6);
  pass.visibleEdgeColor.setRGB(200 / 255, 80 / 255, 0);
  pass.hiddenEdgeColor.setRGB(0, 40 / 255, 180 / 255);
  function words(target) {
    const halves = new Uint16Array(target.width * target.height * 4);
    renderer.readRenderTargetPixels(target, 0, 0, target.width, target.height, halves);
    const rgba = Uint8Array.from(halves, value => Math.round(255 * DataUtils.fromHalfFloat(value)));
    const packed = new DataView(rgba.buffer);
    return Array.from({ length: rgba.length / 4 }, (_, i) => packed.getUint32(i * 4, true));
  }
  const originalRender = renderer.render;
  let sceneEdges;
  renderer.render = function (...args) {
    originalRender.apply(renderer, args);
    if (!sceneEdges && pass.fsQuad.material === pass.edgeDetectionMaterial &&
        renderer.getRenderTarget() === pass.renderTargetEdgeBuffer1) {
      sceneEdges = words(pass.renderTargetEdgeBuffer1);
    }
  };
  const read = new WebGLRenderTarget(8, 6);
  try {
    pass.render(renderer, null, read, 0, false);
    if (!sceneEdges) throw new Error("edge detection did not draw");
    const mask = new Uint8Array(8 * 6 * 4);
    renderer.readRenderTargetPixels(pass.renderTargetMaskBuffer, 0, 0, 8, 6, mask);
    if (mask[72] !== 0 || mask[73] !== 255 || mask[80] !== 0 || mask[81] !== 0) {
      throw new Error("selected object depth classification mismatch");
    }
  } finally {
    renderer.render = originalRender;
    read.dispose();
  }
  function materialEdges(size, rgba) {
    const input = new DataTexture(Uint8Array.from(rgba), size, size);
    input.needsUpdate = true;
    pass.setSize(size, size);
    const edge = pass.edgeDetectionMaterial;
    edge.uniforms.maskTexture.value = input;
    edge.uniforms.texSize.value.set(size, size);
    edge.uniforms.visibleEdgeColor.value = pass.visibleEdgeColor;
    edge.uniforms.hiddenEdgeColor.value = pass.hiddenEdgeColor;
    pass.fsQuad.material = edge;
    renderer.setRenderTarget(pass.renderTargetEdgeBuffer1);
    renderer.clear();
    pass.fsQuad.render(renderer);
    const result = words(pass.renderTargetEdgeBuffer1);
    input.dispose();
    return result;
  }
  function contrast(green) {
    const rgba = [];
    for (let i = 0; i < 9; i++) {
      const red = i === 3 ? 8 : i === 5 ? 200 : 110;
      rgba.push(red, i === 4 ? 0 : i === 5 ? green : 255, 255, 255);
    }
    return materialEdges(3, rgba)[4];
  }
  const hidden = contrast(255);
  const visible = contrast(254);
  const one = materialEdges(1, [90,0,255,255]);
  pass.dispose();
  selected.geometry.dispose();
  blocker.geometry.dispose();
  material.dispose();
  renderer.dispose();
  // The final seven values correspond to local buffer and input refusals.
  output.textContent = JSON.stringify([
    ...[18,19,29,10,12,9].map(i => sceneEdges[i]), hidden, visible, sceneEdges.length,
    one[0] + one.length, -519,-1,-1,-1,-1,-1,-1,
  ]);
} catch (error) {
  output.textContent = `error:${error.message}`;
}
</script>
