<!doctype html>
<meta charset="utf-8">
<pre id="r160">pending</pre>
<script type="module">
import { InstancedInterleavedBuffer, DynamicDrawUsage, REVISION } from "../../web/game/three.module.js";
if (REVISION !== "160") throw new Error("three.js revision mismatch");
const src=new InstancedInterleavedBuffer(new Float32Array([1,0,3,0]),2,2).setUsage(DynamicDrawUsage);
const row=(buffer,instance)=>{
  const index=Math.floor(instance/buffer.meshPerAttribute);
  return index<buffer.count?buffer.array[index*buffer.stride]:-2;
};
const copy=new InstancedInterleavedBuffer().copy(src);
const registry={};
const a=src.clone(registry), b=src.clone(registry);
const json=src.toJSON({});
const initial=[src.meshPerAttribute,row(src,1),row(src,2),row(src,4)];
src.array[2]=99;
a.array[2]=11;
document.querySelector("#r160").textContent=JSON.stringify([
  ...initial,row(copy,2),copy.usage,row(b,3),json.meshPerAttribute,Number(json.isInstancedInterleavedBuffer)
]);
</script>
