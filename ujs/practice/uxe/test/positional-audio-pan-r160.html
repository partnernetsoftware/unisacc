<!doctype html>
<meta charset="utf-8">
<pre id="r160">pending</pre>
<script type="module">
import { AudioContext, AudioListener, PositionalAudio, REVISION } from "../../web/game/three.module.js";
const output=document.querySelector("#r160");
try {
  if(REVISION!=="160") throw new Error("three.js revision mismatch");
  async function sample(x,z,type="inverse",max=100,rolloff=1) {
    const context=new OfflineAudioContext(2,128,48000);
    AudioContext.setContext(context);
    const audio=new PositionalAudio(new AudioListener());
    audio.panner.panningModel="equalpower";
    audio.setDistanceModel(type).setRefDistance(1).setRolloffFactor(rolloff).setMaxDistance(max);
    audio.position.set(x,0,z);
    const input=context.createBuffer(1,128,48000);
    input.getChannelData(0).fill(1);
    audio.setBuffer(input).play();
    audio.updateMatrixWorld(true);
    const rendered=await context.startRendering();
    return [rendered.getChannelData(0)[64],rendered.getChannelData(1)[64]];
  }
  const right=await sample(4,0);
  const left=await sample(-4,0);
  const center=await sample(0,-1);
  const linear=await sample(3,0,"linear",5);
  const exponential=await sample(4,0,"exponential",100,2);
  const far=await sample(8,0,"inverse",4);
  const clamped=await sample(8,0,"linear",5);
  output.textContent=JSON.stringify([
    right[1],right[0],left[0],Math.round(center[1]*1e6),linear[1],exponential[1],far[1],clamped[1],-1,
  ]);
} catch(error) { output.textContent=`error:${error.message}`; }
</script>
