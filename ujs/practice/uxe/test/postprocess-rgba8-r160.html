<!doctype html>
<meta charset="utf-8">
<pre id="r160">pending</pre>
<script type="importmap">{"imports":{"three":"../../web/game/three.module.js"}}</script>
<script type="module">
import {
  DataTexture, NearestFilter, NoBlending, REVISION, WebGLRenderer, WebGLRenderTarget
} from "three";

const output = document.querySelector("#r160");
try {
  if (REVISION !== "160") throw new Error("three.js revision mismatch");
  const root = new URLSearchParams(location.search).get("package");
  const addon = path => import(`file://${root}/examples/jsm/${path}.js`);
  const [{ ShaderPass }, { ColorCorrectionShader }, { FXAAShader }] = await Promise.all([
    addon("postprocessing/ShaderPass"), addon("shaders/ColorCorrectionShader"), addon("shaders/FXAAShader"),
  ]);
  const canvas = document.createElement("canvas");
  const context = canvas.getContext("webgl2", { premultipliedAlpha: false });
  if (!context) throw new Error("WebGL2 required");
  const renderer = new WebGLRenderer({ canvas, context });
  function run(shader, width, height, data, configure) {
    const input = new DataTexture(Uint8Array.from(data), width, height);
    input.needsUpdate = true;
    const target = new WebGLRenderTarget(width, height, {
      minFilter: NearestFilter, magFilter: NearestFilter, depthBuffer: false,
    });
    const pass = new ShaderPass(shader);
    pass.material.blending = NoBlending;
    if (configure) configure(pass.uniforms);
    try {
      pass.render(renderer, target, { texture: input });
      const pixels = new Uint8Array(data.length);
      renderer.readRenderTargetPixels(target, 0, 0, width, height, pixels);
      const words = new DataView(pixels.buffer);
      return Array.from({ length: width * height }, (_, i) => words.getUint32(4 * i, true));
    } finally {
      pass.dispose();
      target.dispose();
      input.dispose();
    }
  }
  const defaults = run(ColorCorrectionShader, 1, 1, [64,128,255,37]);
  const custom = run(ColorCorrectionShader, 2, 1, [64,91,100,123,0,1,16,41], uniforms => {
    uniforms.powRGB.value.set(2, 1, .5);
    uniforms.mulRGB.value.set(1, .5, 2);
    uniforms.addRGB.value.set(.1, .2, 0);
  });
  function fxaa(pixel) {
    const data = [];
    for (let y = 0; y < 5; y++) {
      for (let x = 0; x < 7; x++) data.push(...pixel(x, y));
    }
    return run(FXAAShader, 7, 5, data, uniforms => uniforms.resolution.value.set(1 / 7, 1 / 5));
  }
  const diagonal = fxaa((x, y) => [20,40,60,y >= x ? 240 : 0]);
  const corner = fxaa((x, y) => [x >= 3 && y >= 3 ? 240 : 0,0,0,255]);
  const low = fxaa((x, y) => [y >= x ? 50 : 0,0,0,255]);
  const straight = fxaa((x, y) => [y >= 3 ? 240 : 0,0,0,255]);
  const vertical = fxaa((x, y) => [x >= 3 && y >= 2 ? 240 : 0,0,0,255]);
  renderer.dispose();
  // The final five values are local buffer contracts with no ShaderPass equivalent.
  output.textContent = JSON.stringify([
    ...defaults, ...custom, diagonal[24], diagonal[17], diagonal[6], corner[25], corner[27],
    low[24], straight[24], vertical[24], diagonal.length, custom.length, -1,-287,-1,-1,-1,
  ]);
} catch (error) {
  output.textContent = `error:${error.message}`;
}
</script>
