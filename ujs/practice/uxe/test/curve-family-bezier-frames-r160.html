<!doctype html>
<meta charset="utf-8">
<pre id="r160">pending</pre>
<script type="module">
import { REVISION, Vector2, Vector3, QuadraticBezierCurve, QuadraticBezierCurve3,
  CubicBezierCurve, CubicBezierCurve3 } from "../../web/game/three.module.js";
const result = document.querySelector("#r160");
try {
  if (REVISION !== "160") throw new Error("revision mismatch");
  const quadratic = [[0, 0, 0], [2, 1, 0], [3, 4, 2]];
  const cubic = [[0, 0, 0], [2, 1, 0], [2, 2, 2], [3, 4, 1]];
  const classes = [[QuadraticBezierCurve, Vector2, quadratic], [QuadraticBezierCurve3, Vector3, quadratic],
    [CubicBezierCurve, Vector2, cubic], [CubicBezierCurve3, Vector3, cubic]];
  result.textContent = JSON.stringify(classes.flatMap(([Class, Vector, points]) => {
    const curve = new Class(...points.map(point => new Vector(...point)));
    curve.arcLengthDivisions = 1;
    return [false, true].flatMap(closed => {
      const { tangents, normals, binormals } = curve.computeFrenetFrames(2, closed);
      return tangents.flatMap((tangent, row) =>
        [tangent, normals[row], binormals[row]].flatMap(vector => vector.toArray()).map(value =>
          Number.isNaN(value) ? -999 : value));
    });
  }));
} catch (error) { result.textContent = String(error); }
</script>
