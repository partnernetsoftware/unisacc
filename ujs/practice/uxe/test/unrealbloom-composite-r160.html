<!doctype html>
<meta charset="utf-8">
<pre id="r160">pending</pre>
<script type="importmap">{"imports":{"three":"../../web/game/three.module.js"}}</script>
<script type="module">
import { DataTexture, LinearFilter, NoBlending, REVISION, Vector2, WebGLRenderer, WebGLRenderTarget } from "three";

const output = document.querySelector("#r160");
try {
  if (REVISION !== "160") throw new Error("three.js revision mismatch");
  const query = new URLSearchParams(location.search);
  const { UnrealBloomPass } = await import("file://" + query.get("package") +
    "/examples/jsm/postprocessing/UnrealBloomPass.js");
  const wasm = await (await fetch("file://" + query.get("wasm"))).arrayBuffer();
  const actual = (await WebAssembly.instantiate(wasm)).instance.exports;
  const canvas = document.createElement("canvas");
  const context = canvas.getContext("webgl2");
  if (!context) throw new Error("WebGL2 required");
  const renderer = new WebGLRenderer({ context, canvas });
  renderer.setSize(4, 4, false);
  const bloom = new UnrealBloomPass(new Vector2(8, 8), 1, 0, 0);
  const destination = new WebGLRenderTarget(4, 4);
  const mipInputs = [
    [4,[...Array.from({ length: 16 }, () => [18,30,40,20]).flat()]],
    [2,[30,10,0,30,70,30,40,50,46,34,32,70,86,54,72,90]],
    [1,[25,35,45,60]], [1,[50,60,70,80]], [1,[10,20,30,40]],
  ];
  const mips = mipInputs.map(([size, rgba]) => {
    const texture = new DataTexture(Uint8Array.from(rgba), size, size);
    texture.minFilter = texture.magFilter = LinearFilter;
    texture.needsUpdate = true;
    return texture;
  });
  const tints = [[2,1,0],[0,2,1],[1,0,2],[1,1,1],[1,2,1]];
  const material = bloom.compositeMaterial;
  material.blending = NoBlending;
  const uniforms = material.uniforms;
  for (const [i, texture] of mips.entries()) uniforms["blurTexture" + (i + 1)].value = texture;
  bloom.fsQuad.material = material;
  function reference(mode) {
    uniforms.bloomStrength.value = [1,0.5,0,4][mode];
    uniforms.bloomRadius.value = mode === 1 ? 1 : 0;
    for (const [i, tint] of uniforms.bloomTintColors.value.entries()) {
      tint.set(...(mode === 1 ? tints[i] : [1,1,1]));
    }
    renderer.setRenderTarget(destination);
    bloom.fsQuad.render(renderer);
    const result = new Uint8Array(64);
    renderer.readRenderTargetPixels(destination, 0, 0, 4, 4, result);
    return result;
  }
  function sample(rgba) {
    const words = new DataView(rgba.buffer, rgba.byteOffset, rgba.byteLength);
    return [0,5,10,15].map(i => words.getUint32(i * 4, true));
  }
  const cases = [];
  for (const mode of [0,1,2,3]) {
    const result = actual.uxe_bloom_composite(BigInt(mode), BigInt(query.get("mode")));
    if (result !== 16n) throw new Error("native composite failed " + result);
    const rgba = new Uint8Array(actual.memory.buffer, 2097152 + 1400, 64);
    const expected = reference(mode);
    const differences = rgba.reduce((acc, byte, i) => acc + Number(byte !== expected[i]), 0);
    cases.push(...sample(rgba), ...sample(expected), differences);
  }
  for (const image of mips) image.dispose();
  destination.dispose();
  bloom.materialHighPassFilter.dispose();
  bloom.dispose();
  renderer.dispose();
  output.textContent = JSON.stringify(cases);
} catch (error) {
  output.textContent = "error:" + error.message;
}
</script>
