<!doctype html>
<meta charset="utf-8">
<pre id="r160">pending</pre>
<script type="module">
import * as THREE from "../../web/game/three.module.js";
if (THREE.REVISION !== "160") throw Error("three.js revision mismatch");
const shapes = ["4x4","5x4","5x5","6x5","6x6","8x5","8x6","8x8","10x5","10x6","10x8","10x10","12x10","12x12"];
const cases = shapes.map(shape => {
  const format = THREE["RGBA_ASTC_" + shape + "_Format"];
  const [width,height] = shape.split("x").map(Number);
  const mip = {width:width+1,height:height+1,data:new Uint8Array(64)};
  const texture = new THREE.CompressedTexture([mip],mip.width,mip.height,format);
  if (texture.mipmaps[0] !== mip || texture.image.width !== mip.width ||
      texture.image.height !== mip.height || texture.format !== format) throw Error("ASTC descriptor");
  texture.dispose();
  return format*10000+width*100+height;
});
document.querySelector("#r160").textContent = JSON.stringify([...cases,...shapes.map(() => -3)]);
</script>
