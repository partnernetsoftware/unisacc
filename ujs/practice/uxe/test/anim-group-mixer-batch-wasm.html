<!doctype html>
<meta charset="utf-8">
<pre id="wasm-cases">pending</pre>
<script type="module">
const status = document.querySelector("#wasm-cases");
try {
  const parameters = new URLSearchParams(location.search);
  const count = Number(parameters.get("count"));
  const mutate = parameters.get("mutate") === "1";
  const compile = async path => WebAssembly.compile(await (await fetch(path)).arrayBuffer());
  const [baseModule,probeModule] = await Promise.all([compile("base.wasm"),compile("probe.wasm")]);
  const results = [];
  for (let index=0; index<count; index++) {
    const base = await WebAssembly.instantiate(baseModule);
    const probe = await WebAssembly.instantiate(probeModule,{
      uxe_group_mixer_v1: {uxe_group_mixer_evaluate: base.exports.uxe_group_mixer_evaluate}
    });
    if (base.exports.uxe_abi_version() !== 1 || probe.exports.uxe_abi_version() !== 1 ||
        base.exports.memory === probe.exports.memory) throw new Error("group Mixer ABI mismatch");
    results.push(probe.exports.uxe_evaluate_case(BigInt(mutate && index === 14 ? 64 : index)));
  }
  status.textContent = JSON.stringify(results);
} catch (error) {
  status.textContent = "error:" + error.message;
}
</script>
