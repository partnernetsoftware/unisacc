<!doctype html>
<meta charset="utf-8">
<pre id="r160">pending</pre>
<script type="module">
import { Bone, Matrix4, REVISION, Skeleton } from "../../web/game/three.module.js";
if (REVISION !== "160") throw Error("r160 revision mismatch");
const left = new Bone();
const right = new Bone();
left.uuid = "l";
right.uuid = "r";
const source = new Skeleton([left, right], [new Matrix4().makeTranslation(3.5, 0, 0), new Matrix4().makeScale(1, 1, 2)]);
source.uuid = "s";
const data = source.toJSON();
const loaded = new Skeleton().fromJSON(data, { l: left, r: right });
let hash = 0;
for (const byte of new TextEncoder().encode(JSON.stringify(loaded.toJSON()))) {
  hash = (hash * 131 + byte) % 16777213;
}
// The final gold checks the local reader's transactional rejection contract.
document.querySelector("#r160").textContent = JSON.stringify([
  Number(loaded.bones[0] === left && loaded.bones[1] === right),
  loaded.boneInverses[0].elements[12], loaded.boneInverses[1].elements[10], hash, -92
]);
</script>
