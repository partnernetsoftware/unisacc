<!doctype html>
<meta charset="utf-8">
<pre id="benchmark">pending</pre>
<script>
const request = new XMLHttpRequest();
request.open("GET", "loop.wasm", false);
request.overrideMimeType("text/plain; charset=x-user-defined");
request.send();
const bytes = Uint8Array.from(request.responseText, ch => ch.charCodeAt(0) & 255);
const setup = performance.now();
const { exports: module } = new WebAssembly.Instance(new WebAssembly.Module(bytes));
const setupMs = performance.now() - setup;
const warm = module.f64_of_export(module.main_export());
const samples = [];
let value;
for (let sample = 0; sample < 7; sample++) {
  const start = performance.now();
  value = module.f64_of_export(module.main_export());
  samples.push(performance.now() - start);
  if (value !== warm) throw new Error("unstable Wasm result");
}
samples.sort((a, b) => a - b);
document.querySelector("#benchmark").textContent = JSON.stringify([value, setupMs, ...samples]);
</script>
