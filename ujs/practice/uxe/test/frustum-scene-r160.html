<!doctype html>
<meta charset="utf-8">
<pre id="r160">pending</pre>
<script type="module">
import { BufferGeometry, Frustum, Matrix4, Mesh, Sphere, Sprite, Vector3, REVISION } from "../../web/game/three.module.js";
if (REVISION !== "160") throw new Error("three.js revision mismatch");
const f=new Frustum().setFromProjectionMatrix(new Matrix4());
const geometry=new BufferGeometry();
geometry.boundingSphere=new Sphere(new Vector3(0,0,0),0.5);
const mesh=new Mesh(geometry);
mesh.position.x=2;
mesh.updateMatrixWorld();
const outside=f.intersectsObject(mesh);
mesh.scale.setScalar(2);
mesh.updateMatrixWorld();
const touching=f.intersectsObject(mesh);
const sprite=new Sprite();
sprite.position.x=1.6;
sprite.updateMatrixWorld();
const insideSprite=f.intersectsSprite(sprite);
sprite.position.x=1.8;
sprite.updateMatrixWorld();
document.querySelector("#r160").textContent=JSON.stringify([
  Number(outside),Number(touching),Number(insideSprite),Number(f.intersectsSprite(sprite))
]);
</script>
