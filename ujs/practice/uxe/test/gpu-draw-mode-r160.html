<!doctype html>
<meta charset="utf-8">
<pre id="r160">pending</pre>
<script type="importmap">{"imports":{"three":"../../web/game/three.module.js"}}</script>
<script type="module">
import {BufferGeometry, BufferAttribute, TrianglesDrawMode, TriangleStripDrawMode, TriangleFanDrawMode,
  REVISION} from "three";
if(REVISION!=="160") throw new Error("three.js revision mismatch");
const root=new URLSearchParams(location.search).get("package");
const {toTrianglesDrawMode}=await import(`file://${root}/examples/jsm/utils/BufferGeometryUtils.js`);
const indices=(mode,input)=>{
  const geometry=new BufferGeometry();
  geometry.setAttribute("position",new BufferAttribute(new Float32Array(12),3));
  geometry.setIndex(input);
  return toTrianglesDrawMode(geometry,mode).index.array;
};
const list=indices(TrianglesDrawMode,[3,1,2,0,2,1]);
const strip=indices(TriangleStripDrawMode,[3,1,2,0]);
const fan=indices(TriangleFanDrawMode,[3,1,2,0]);
const last=(data)=>100*data[3]+10*data[4]+data[5];
document.querySelector("#r160").textContent=JSON.stringify([list.length,last(list),last(strip),last(fan),-1]);
</script>
