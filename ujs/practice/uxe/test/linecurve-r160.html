<!doctype html>
<meta charset="utf-8">
<pre id="r160">pending</pre>
<script type="module">
import { LineCurve, Vector2, REVISION } from "../../web/game/three.module.js";
if (REVISION !== "160") throw new Error("three.js revision mismatch");
const curve = new LineCurve(new Vector2(1, 2), new Vector2(4, 6));
const point = curve.getPoint(0.25), end = curve.getPointAt(1), tangent = curve.getTangent(0.5);
document.querySelector("#r160").textContent = JSON.stringify([
  point.x, point.y, end.x, curve.getLength(), tangent.x, tangent.y
]);
</script>
