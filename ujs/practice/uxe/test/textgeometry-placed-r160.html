<!doctype html>
<meta charset="utf-8">
<pre id="r160">pending</pre>
<script type="importmap">{"imports":{"three":"../../web/game/three.module.js"}}</script>
<script type="module">
import {REVISION} from "three";
const output = document.querySelector("#r160");
try {
  if (REVISION !== "160") throw new Error("three.js revision mismatch");
  const root = new URLSearchParams(location.search).get("package");
  const {FontLoader} = await import(`file://${root}/examples/jsm/loaders/FontLoader.js`);
  const {TextGeometry} = await import(`file://${root}/examples/jsm/geometries/TextGeometry.js`);
  const font = new FontLoader().parse({
    familyName:"Placement fixture",resolution:1000,boundingBox:{yMin:-100,yMax:1000},underlineThickness:100,
    glyphs:{A:{ha:700,o:"m 0 0 l 0 100 l 200 0 l 0 0"}},
  });
  const text = new TextGeometry("AA\nA",{font,size:10,height:2,steps:1,bevelEnabled:false});
  text.computeBoundingBox();
  const positions = text.getAttribute("position");
  const normals = text.getAttribute("normal");
  const centers=[];
  for (let base=0; base<positions.count; base+=24) {
    let x=Infinity,y=Infinity,up=0;
    for (let i=base; i<base+24; ++i) {
      x=Math.min(x,positions.getX(i));
      y=Math.min(y,positions.getY(i));
      if (normals.getZ(i) === 1) up++;
    }
    centers.push(x,y,up);
  }
  output.textContent=JSON.stringify([positions.count,...text.boundingBox.min.toArray(),
    ...text.boundingBox.max.toArray(),...centers,-1,-1]);
  text.dispose();
} catch(error) {
  output.textContent=`error:${error.message}`;
}
</script>
