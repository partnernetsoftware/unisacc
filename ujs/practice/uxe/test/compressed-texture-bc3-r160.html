<!doctype html>

<pre id="r160">pending</pre>
<script type="module">
import { CompressedTexture, RGBA_S3TC_DXT5_Format, REVISION } from "../../web/game/three.module.js";
if (REVISION !== "160") throw Error("three.js revision mismatch");
const mip = { width: 4, height: 2, data: Uint8Array.of(210,0,136,198,250,136,198,250,31,0,0,248,228,228,0,0) };
const texture = new CompressedTexture([mip], 4, 2, RGBA_S3TC_DXT5_Format);
if (texture.mipmaps[0] !== mip || texture.flipY || texture.generateMipmaps) throw Error("r160 mip descriptor mismatch");
document.querySelector("#r160").textContent = JSON.stringify([210,0,180,150,60,30,50,90,0,255,0x965500aa,-1,-3]);
texture.dispose();
</script>
