<!doctype html>
<meta charset="utf-8">
<pre id="r160">pending</pre>
<script type="module">
import {Material,MeshBasicMaterial,MeshPhongMaterial,REVISION} from "../../web/game/three.module.js";
if(REVISION!=="160") throw new Error("three.js revision mismatch");
const source=new MeshBasicMaterial(), dest=new MeshPhongMaterial();
const depth=source.depthFunc;
source.needsUpdate=false;
const unchanged=source.version;
source.alphaTest=.4;
source.alphaTest=.9;
source.needsUpdate=true;
const updates=source.version;
source.side=2;
source.alphaTest=.5;
const destId=dest.id;
Material.prototype.copy.call(dest,source);
const copied=1000*Number(dest.type==="MeshPhongMaterial")*3+100*dest.version+10*dest.side+Number(dest.id===destId);
source.opacity=.25;
const clone=source.clone();
source.opacity=.75;
let received=0;
source.addEventListener("dispose",event=>received+=100*Number(event.target===source)*17+11);
source.dispose();
document.querySelector("#r160").textContent=JSON.stringify([
  depth,unchanged,updates,copied,clone.opacity,received,Number(clone.type===source.type)
]);
</script>
