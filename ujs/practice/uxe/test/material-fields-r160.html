<!doctype html>
<meta charset="utf-8">
<pre id="r160">pending</pre>
<script type="module">
import * as Three from "../../web/game/three.module.js";
const {MaterialLoader,MeshBasicMaterial,REVISION}=Three;
if(REVISION!=="160") throw new Error("three.js revision mismatch");
const material=new MeshBasicMaterial();
material.setValues({side:2,opacity:.25,depthTest:false,alphaTest:.5,premultipliedAlpha:true});
const json=material.toJSON();
const selected={side:json.side,opacity:json.opacity,depthTest:json.depthTest,alphaTest:json.alphaTest,premultipliedAlpha:json.premultipliedAlpha};
const tail=","+JSON.stringify(selected).slice(1,-1);
let hash=0;
for(const char of tail) hash=(hash*31+char.charCodeAt(0))%1000003;
// UXE's typed transport rejects an unknown field without applying earlier entries.
const read=new MaterialLoader().parse(JSON.parse(JSON.stringify(json)));
const round=read.side*10+read.opacity*10+(1-read.depthTest)+read.alphaTest*4+read.premultipliedAlpha+read.toneMapped;
const names=["Material","MeshBasicMaterial","MeshLambertMaterial","MeshPhongMaterial","MeshNormalMaterial",
  "MeshDepthMaterial","MeshStandardMaterial","MeshToonMaterial","MeshMatcapMaterial","MeshDistanceMaterial"];
const family=names.filter(name=>{
  const src=new Three[name]();
  src.setValues({side:2,opacity:.25,depthTest:false,alphaTest:.5,premultipliedAlpha:true});
  const json=src.toJSON();
  const clone=src.clone();
  const dst=new Three.Material().copy(clone);
  let events=0;
  clone.addEventListener("dispose",()=>events++);
  clone.dispose();
  return json.side===2 && json.opacity===.25 && clone.type===name && dst.side===2 && events===1;
}).length;
document.querySelector("#r160").textContent=JSON.stringify([material.side,material.version,10,hash,round,family]);
</script>
