<!doctype html>
<meta charset="utf-8">
<pre id="r160">pending</pre>
<script type="module">
import { AudioContext, AudioListener, Object3D, REVISION } from "../../web/game/three.module.js";
const output=document.querySelector("#r160");
try {
  if(REVISION!=="160") throw new Error("three.js revision mismatch");
  const context=new OfflineAudioContext(2,256,48000);
  AudioContext.setContext(context);
  const parent=new Object3D();
  const listener=new AudioListener();
  listener.position.set(3,5,7);
  listener.rotation.y=Math.PI/2;
  listener.scale.set(2,3,4);
  listener.up.set(0,0,1);
  parent.add(listener);
  parent.updateMatrixWorld(true);
  const suspended=context.suspend(128/48000);
  const rendered=context.startRendering();
  await suspended;
  const samples=["positionX","positionY","positionZ","forwardX","forwardY","forwardZ","upY","upZ"]
    .map(key=>context.listener[key].value);
  await context.resume();
  await rendered;
  output.textContent=JSON.stringify([...samples,1,-1]);
} catch(error) { output.textContent=`error:${error.message}`; }
</script>
