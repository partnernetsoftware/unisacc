<!doctype html>
<meta charset="utf-8">
<pre id="r160">pending</pre>
<script type="module">
import { StereoCamera, PerspectiveCamera, REVISION } from "../../web/game/three.module.js";
if (REVISION !== "160") throw new Error("three.js revision mismatch");
const camera = new PerspectiveCamera(90, 2, 1, 11);
camera.focus = 10;
camera.position.set(3, 5, -7);
camera.rotation.y = Math.PI * 0.5;
camera.updateMatrixWorld();
const stereo = new StereoCamera();
stereo.update(camera);
const l = stereo.cameraL, r = stereo.cameraR;
const values = [
  l.projectionMatrix.elements[0], l.projectionMatrix.elements[8], r.projectionMatrix.elements[8],
  r.projectionMatrix.elements[10], l.matrixWorld.elements[12], l.matrixWorld.elements[14],
  r.matrixWorld.elements[14], l.layers.mask, r.layers.mask, Number(l.matrixAutoUpdate), Number(r.matrixAutoUpdate),
];
camera.projectionMatrix.elements[5] = 7;
camera.position.x = 4;
camera.updateMatrixWorld();
stereo.update(camera);
values.push(l.projectionMatrix.elements[5], l.matrixWorld.elements[12]);
camera.focus = 11;
stereo.update(camera);
values.push(l.projectionMatrix.elements[5]);
camera.focus = 10;
stereo.eyeSep = 0.128;
stereo.update(camera);
values.push(l.projectionMatrix.elements[8]);
camera.far = 21;
camera.updateProjectionMatrix();
stereo.update(camera);
values.push(r.projectionMatrix.elements[10]);
document.querySelector("#r160").textContent = JSON.stringify(values);
</script>
