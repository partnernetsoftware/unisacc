<!doctype html>
<meta charset="utf-8">
<title>UXE D2 pilot probe</title>
<canvas></canvas>
<pre id="ux-link-result">pending</pre>
<script type="module">
import { createBrowserHost, linkUxe } from "./host-abi.js";

function readBytes(name) {
  const request = new XMLHttpRequest();
  request.open("GET", name, false);
  request.overrideMimeType("text/plain; charset=x-user-defined");
  request.send();
  return Uint8Array.from(request.responseText, glyph => glyph.charCodeAt(0) & 255);
}

const result = document.querySelector("#ux-link-result");
try {
  const host = createBrowserHost(document.querySelector("canvas"),
    ["KeyW", "KeyA", "KeyS", "KeyD", "ArrowUp", "ArrowLeft", "ArrowDown", "ArrowRight"],
    location.hash.startsWith("#water") ? readBytes("d2-type.rgba") : new Uint8Array());
  const linked = linkUxe(new WebAssembly.Module(readBytes("base.wasm")), new WebAssembly.Module(readBytes("product.wasm")), host);
  host.attachMemory(linked.base.memory);
  const run = linked.product.uxe_frame;
  const read = new DataView(linked.product.memory.buffer, 2097152, 8);
  const key = (type, code) => dispatchEvent(new KeyboardEvent(type, { code, cancelable: true }));
  run(0n);
  if (location.hash.startsWith("#water-glint")) {
    run(33334n);
    const width = 426, height = 118;
    const rgb = document.querySelector("canvas").getContext("2d").getImageData(0, 122, width, height).data;
    let pixels = 0, runs = 0, longest = 0;
    for (let y = 0; y < height; y++) {
      let current = 0;
      for (let x = 0; x < width; x++) {
        const at = 4 * (y * width + x);
        if (rgb[at] === 233 && rgb[at + 1] === 181 && rgb[at + 2] === 112) {
          if (current === 0) runs++;
          pixels++; current++; longest = Math.max(longest, current);
        } else current = 0;
      }
    }
    result.textContent = [pixels, runs, longest].join(" ");
  } else if (location.hash.startsWith("#water-title")) {
    run(33334n);
    const ctx = document.querySelector("canvas").getContext("2d");
    const count = (y, h) => {
      const rgba = ctx.getImageData(172, y, 84, h).data;
      let ink=0;
      for(let i=0;i<rgba.length;i+=4) if(rgba[i]===249 && rgba[i+1]===230 && rgba[i+2]===187) ink++;
      return ink;
    };
    result.textContent = [count(16, 20), count(42, 11)].join(" ");
  } else if (location.hash.startsWith("#water-red")) {
    run(33334n);
    const rgba = document.querySelector("canvas").getContext("2d").getImageData(0, 130, 426, 25).data;
    const columns = new Uint8Array(426);
    let pixels = 0, clusters = 0, last = -50;
    for (let i = 0; i < rgba.length / 4; i++) {
      const [r, g, b] = rgba.subarray(i * 4, i * 4 + 3);
      if ((r === 211 && g === 84 && b === 67) || (r === 255 && g === 117 && b === 82)) {
        pixels++;
        columns[i % 426] = 1;
      }
    }
    for (let x = 0; x < columns.length; x++) {
      if (!columns[x]) continue;
      if (x - last >= 14) clusters++;
      last = x;
    }
    result.textContent = [pixels, clusters].join(" ");
  } else if (location.hash.startsWith("#water-lilies")) {
    run(33334n);
    const rgba = document.querySelector("canvas").getContext("2d").getImageData(0, 135, 426, 105).data;
    const leaves = [0, 0];
    let flowers = 0;
    for (let i = 0; i < rgba.length / 4; i++) {
      const [r, g, b] = rgba.subarray(i * 4, i * 4 + 3);
      if (r === 108 && g === 130 && b === 67) leaves[+(i % 426 >= 213)]++;
      if (r === 188 && g === 105 && b === 87) flowers++;
    }
    result.textContent = [...leaves, flowers].join(" ");
  } else if (location.hash.startsWith("#water-dock")) {
    run(33334n);
    const rgba = document.querySelector("canvas").getContext("2d").getImageData(0, 120, 205, 108).data;
    let wood = 0, posts = 0;
    for (let at = 0; at < rgba.length; at += 4) {
      const [r, g, b] = rgba.subarray(at, at + 3);
      if ((r === 119 && g === 85 && b === 62) || (r === 94 && g === 74 && b === 60) ||
          (r === 140 && g === 99 && b === 63)) wood++;
      if (r === 189 && g === 142 && b === 83) posts++;
    }
    result.textContent = [wood, posts].join(" ");
  } else if (location.hash.startsWith("#water-reeds")) {
    run(33334n);
    const rgba = document.querySelector("canvas").getContext("2d").getImageData(0, 92, 426, 148).data;
    const marks = [0, 0];
    for (let i = 0; i < rgba.length / 4; i++) {
      const [r, g, b] = rgba.subarray(i * 4, i * 4 + 3);
      if ((r === 48 && g === 64 && b === 36) || (r === 143 && g === 133 && b === 69)) marks[+(i % 426 >= 213)]++;
    }
    result.textContent = marks.join(" ");
  } else if (location.hash.startsWith("#water-skyline")) {
    run(33334n);
    const rgba = document.querySelector("canvas").getContext("2d").getImageData(0, 0, 426, 90).data;
    let cloud = 0, ridge = 0;
    for (let at = 0; at < rgba.length; at += 4) {
      const [r, g, b] = rgba.subarray(at, at + 3);
      if ((r === 236 && g === 174 && b === 92) || (r === 203 && g === 150 && b === 88)) cloud++;
      if ((r === 203 && g === 148 && b === 79) || (r === 170 && g === 123 && b === 69) ||
          (r === 137 && g === 98 && b === 59)) ridge++;
    }
    result.textContent = [cloud, ridge].join(" ");
  } else if (location.hash.startsWith("#water-foreground")) {
    run(33334n);
    const rgba = document.querySelector("canvas").getContext("2d").getImageData(0, 92, 426, 148).data;
    let lamp = 0, hull = 0, motes = 0;
    for (let at = 0; at < rgba.length; at += 4) {
      const [r, g, b] = rgba.subarray(at, at + 3);
      if (r === 255 && g === 240 && b === 175) lamp++;
      if (r === 71 && g === 50 && b === 59) hull++;
      if (r === 255 && g === 228 && b === 165) motes++;
    }
    result.textContent = [lamp, hull, motes].join(" ");
  } else if (location.hash.startsWith("#water-mirror")) {
    run(33334n);
    const ctx = document.querySelector("canvas").getContext("2d");
    const rgba = ctx.getImageData(124, 158, 210, 30).data;
    let top = 0, lower = 0;
    const columns = new Set();
    for (let i = 0; i < rgba.length / 4; i++) {
      const at = 4 * i;
      if (rgba[at] < 200 || rgba[at + 1] < 188 || rgba[at + 2] < 125) continue;
      if (i < 210 * 10) {
        top++;
        columns.add(Math.floor((i % 210) / 30));
      } else if (i >= 210 * 20) lower++;
    }
    result.textContent = [top, lower, columns.size].join(" ");
  } else if (location.hash.startsWith("#water-bridge")) {
    run(33334n);
    const ctx = document.querySelector("canvas").getContext("2d");
    const rail = ctx.getImageData(0, 116, 426, 1).data;
    const lights = ctx.getImageData(0, 113, 426, 1).data;
    let span = 0, lamps = 0, lit = false;
    for (let at = 0; at < rail.length; at += 4) {
      if ((rail[at] === 101 && rail[at + 1] === 58) ||
          (rail[at] === 171 && rail[at + 1] === 103)) span++;
      const next = lights[at] === 255 && lights[at + 1] === 233 && lights[at + 2] === 163;
      if (next && !lit) lamps++;
      lit = next;
    }
    result.textContent = [span, lamps].join(" ");
  } else if (location.hash.startsWith("#waterway")) {
    const context = document.querySelector("canvas").getContext("2d");
    const water = () => {
      const rgba = context.getImageData(0, 112, 426, 128).data;
      return Array.from({length: 426 * 128}, (_, i) => rgba[i * 4] >= 95 && rgba[i * 4 + 2] >= 50);
    };
    run(33334n);
    const sky = context.getImageData(250, 28, 64, 50).data;
    let sun = 0;
    for (let at = 0; at < sky.length; at += 4) {
      if (sky[at] >= 254 && sky[at + 1] >= 220 && sky[at + 2] >= 150) sun++;
    }
    const first = water();
    key("keydown", "KeyW");
    key("keydown", "KeyD");
    for (const tick of [2, 8, 14, 20, 26]) run(BigInt(tick) * 33334n);
    const later = water();
    result.textContent = [sun, first.filter(Boolean).length, later.filter(Boolean).length,
      later.filter((wet, i) => wet !== first[i]).length].join(" ");
  } else {
    key("keydown", "KeyW");
    key("keydown", "KeyD");
    const values = [];
    let contacts = 0;
    for (let tick = 1; tick <= 320; tick++) {
      if (tick === 241) {
        key("keyup", "KeyW");
        key("keyup", "KeyD");
        key("keydown", "ArrowLeft");
        key("keydown", "ArrowDown");
      }
      const elapsed = run(BigInt(tick) * 33334n);
      contacts += read.getUint8(7);
      if ([1, 24, 96, 180, 240, 280, 320].includes(tick)) {
        const z = read.getUint16(2, true) + 65536 * read.getUint8(4);
        values.push([elapsed, read.getUint16(0, true) - 32768, z,
          read.getUint16(5, true) - 1024, contacts].join(","));
      }
    }
    result.textContent = values.join(" ");
  }
  host.destroy();
} catch (error) {
  result.textContent = error.name + " " + error.message;
}
</script>
