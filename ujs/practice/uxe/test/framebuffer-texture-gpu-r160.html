<!doctype html>
<meta charset="utf-8">
<pre id="r160">pending</pre>
<script type="module">
import * as THREE from "../../web/game/three.module.js";
import { createGpuSubmit } from "../base/gpu-host-abi.js";
import { createGpuTargets } from "../base/gpu-target-abi.js";

const output=document.querySelector("#r160");
const query=new URLSearchParams(location.search);
function context() {
  const canvas=document.createElement("canvas");
  canvas.width=canvas.height=8;
  const gl=canvas.getContext("webgl2",{antialias:false,preserveDrawingBuffer:true});
  if(!gl) throw new Error("WebGL2 unavailable");
  return {canvas,gl};
}

function reference() {
  const {canvas,gl}=context();
  const renderer=new THREE.WebGLRenderer({canvas,context:gl});
  renderer.setSize(8,8);
  renderer.autoClear=false;
  const source=new THREE.WebGLRenderTarget(4,3,{depthBuffer:false});
  const target=new THREE.WebGLRenderTarget(2,2,{depthBuffer:false});
  const captured=new THREE.FramebufferTexture(2,2);
  const color=new THREE.Color();
  const camera=new THREE.Camera(),scene=new THREE.Scene();
  const geometry=new THREE.PlaneGeometry(2,2);
  const material=new THREE.ShaderMaterial({
    depthTest:false,depthWrite:false,uniforms:{snapshot:{value:captured}},
    vertexShader:"varying vec2 coord;void main(){gl_Position=vec4(position.xy,0.0,1.0);coord=position.xy*0.5+0.5;}",
    fragmentShader:"uniform sampler2D snapshot;varying vec2 coord;void main(){gl_FragColor=texture2D(snapshot,coord);}",
  });
  const plane=new THREE.Mesh(geometry,material);
  plane.frustumCulled=false;
  scene.add(plane);
  function paint(phase) {
    renderer.setRenderTarget(source);
    renderer.setScissorTest(true);
    for(let y=0;y<3;y++) for(let x=0;x<4;x++) {
      renderer.setScissor(x,y,1,1);
      color.setRGB((10*(1+x+4*y)+80*phase)/255,(20+10*y)/255,(30+10*x)/255);
      renderer.setClearColor(color,1);
      renderer.clear(true,false,false);
    }
    renderer.setScissorTest(false);
  }
  function snap() {
    renderer.setRenderTarget(source);
    renderer.copyFramebufferToTexture(new THREE.Vector2(1,1),captured);
  }
  function draw(texture=captured) {
    material.uniforms.snapshot.value=texture;
    renderer.setRenderTarget(target);
    renderer.render(scene,camera);
    const pixels=new Uint8Array(16);
    renderer.readRenderTargetPixels(target,0,0,2,2,pixels);
    const view=new DataView(pixels.buffer);
    return Array.from({length:4},(_,i)=>view.getUint32(4*i,true));
  }
  const config=[captured.image.width,captured.image.height,captured.magFilter,captured.minFilter,
    Number(captured.generateMipmaps),captured.version];
  const clone=captured.clone(),copy=new THREE.FramebufferTexture(1,1).copy(captured);
  const shared=[Number(clone.source===captured.source && copy.source===captured.source &&
    clone.image===captured.image && copy.image===captured.image && clone!==copy),
    clone.version,copy.version];
  const blank=Number(draw(clone).every(pixel=>pixel===0));
  paint(0); snap(); const initial=draw();
  paint(1); const prior=draw();
  snap(); const latest=draw();
  const clonePixels=draw(clone),copyPixels=draw(copy);
  const pixelsShared=Number(clonePixels.every((pixel,i)=>pixel===latest[i]) &&
    copyPixels.every((pixel,i)=>pixel===latest[i]));
  source.dispose();
  const independent=draw();
  renderer.setRenderTarget(null);
  captured.dispose();
  const releasedStill=Number(draw(clone).every((pixel,i)=>pixel===latest[i]));
  clone.dispose();
  copy.dispose();
  renderer.setRenderTarget(null);
  geometry.dispose();
  material.dispose();
  target.dispose();
  renderer.dispose();
  return [...config,...initial,...prior,...latest,...independent,...shared,blank,pixelsShared,releasedStill];
}

async function product() {
  const {gl}=context();
  let instance;
  const submit=createGpuSubmit(gl,()=>instance.exports.memory,()=>1,createGpuTargets(gl));
  const dir="file://"+query.get("dir")+"/";
  const read=async name=>(await fetch(dir+name)).arrayBuffer();
  const [baseModule,probeModule]=await Promise.all([
    WebAssembly.compile(await read("base.wasm")),WebAssembly.compile(await read("probe.wasm")),
  ]);
  instance=await WebAssembly.instantiate(baseModule,{uxe_gpu_v1:{host_gpu_submit:submit}});
  const imports=WebAssembly.Module.imports(probeModule);
  if(imports.length!==1 || imports[0].module!=="uxe_framebuffer_probe_v1" ||
    imports[0].name!=="uxe_framebuffer_dispatch") throw new Error("framebuffer probe import");
  const probe=await WebAssembly.instantiate(probeModule,{
    uxe_framebuffer_probe_v1:{uxe_framebuffer_dispatch:instance.exports.uxe_framebuffer_dispatch},
  });
  if(instance.exports.uxe_abi_version()!==1 || probe.exports.uxe_abi_version()!==1 ||
    instance.exports.memory===probe.exports.memory) throw new Error("framebuffer texture ABI");
  const mutate=BigInt(query.get("mutate"));
  const run=(op,a=0,b=0)=>Number(probe.exports.uxe_framebuffer_test(BigInt(op),BigInt(a),BigInt(b),mutate));
  const memory=new Uint8Array(instance.exports.memory.buffer,run(0),16384);
  const view=new DataView(memory.buffer,memory.byteOffset,memory.byteLength);
  const encoder=new TextEncoder();
  const text=(at,value)=>{const bytes=encoder.encode(value);memory.set(bytes,at);return bytes.length;};
  view.setUint32(1000,1024,true);
  view.setUint32(1004,text(1024,
    "attribute vec3 a_position;varying vec2 coord;void main(){gl_Position=vec4(a_position,1.0);coord=a_position.xy*0.5+0.5;}"),true);
  view.setUint32(1008,1280,true);
  view.setUint32(1012,text(1280,
    "precision highp float;uniform sampler2D u_texture;varying vec2 coord;void main(){gl_FragColor=texture2D(u_texture,coord);}"),true);
  for(const [i,[x,y]] of [[-1,-1],[3,-1],[-1,3]].entries()) {
    const at=2048+28*i;
    view.setFloat32(at,x,true);
    view.setFloat32(at+4,y,true);
    view.setFloat32(at+8,0,true);
    for(let j=3;j<7;j++) view.setFloat32(at+4*j,1,true);
  }
  function draw(which=0) {
    const status=run(4,which);
    if(status!==0) throw new Error("GPU texture draw "+status);
    return Array.from({length:4},(_,i)=>view.getUint32(8320+4*i,true));
  }
  if(run(1)!==384 || run(2)!==0) throw new Error("framebuffer setup");
  const shared=run(12),refs=run(13),oldRefs=run(13,1),cloneVersion=run(13,3),copyVersion=run(13,4);
  const uncaptured=run(14,1);
  const handle=run(3,1);
  if(handle<0) throw new Error("framebuffer capture "+handle);
  const filter=run(9,5);
  const config=[run(9,0),run(9,1),filter===0?1003:1006,filter===0?1003:1006,Number(filter>=2),run(6)];
  const initial=draw();
  const initialLive=run(9,3),full=run(10);
  if(run(2,1)!==0) throw new Error("source repaint");
  view.setUint32(8256,777,true);
  const stale=run(5,0),alias=run(5,1,1),missing=run(5,1,2),bounds=run(5,1,3);
  const undersized=run(5,1,4),aliasesTarget=run(5,1,5);
  const sentinel=view.getUint32(8256,true),sameVersion=run(6);
  const prior=draw();
  const updated=run(5,1),sameHandle=run(9,2);
  const latest=draw();
  function drawAlias(which) {
    if(run(14,which)!==0) throw new Error("GPU shared texture draw");
    return Array.from({length:4},(_,i)=>view.getUint32(8320+4*i,true));
  }
  const clonePixels=drawAlias(1),copyPixels=drawAlias(2);
  const pixelsShared=Number(clonePixels.every((pixel,i)=>pixel===latest[i]) &&
    copyPixels.every((pixel,i)=>pixel===latest[i]));
  const firstRelease=run(15,0);
  const still=Number(drawAlias(1).every((pixel,i)=>pixel===latest[i]));
  const secondRelease=run(15,1),disposed=run(15,2),finalRefs=run(13);
  const oldHandle=run(8,handle),oldVersion=run(6),oldDraw=run(4);
  const twice=run(7),empty=run(9,3);
  const reused=run(10),newVersion=run(6,1),oldAgain=run(8,handle);
  const sourceDisposed=run(11),independent=draw(1),peak=run(9,4);
  const freshDisposed=run(7,1),emptyAgain=run(9,3),targetDisposed=run(11,1);
  return [...config,...initial,...prior,...latest,...independent,
    handle,initialLive,full,stale,alias,missing,bounds,undersized,aliasesTarget,sentinel,sameVersion,
    updated,sameHandle,disposed,oldHandle,oldVersion,oldDraw,twice,empty,reused,newVersion,oldAgain,
    sourceDisposed,peak,freshDisposed,emptyAgain,targetDisposed,
    shared,refs,oldRefs,cloneVersion,copyVersion,uncaptured,pixelsShared,firstRelease,still,secondRelease,finalRefs];
}

try {
  if(THREE.REVISION!=="160") throw new Error("three.js revision mismatch");
  output.textContent=JSON.stringify([...reference(),...await product()]);
} catch(error) {
  output.textContent="error:"+error.message;
}
</script>
