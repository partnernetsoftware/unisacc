<!doctype html>
<html lang="zh">
<meta charset="utf-8">
<title>D3 灌木素材对照</title>
<output></output>
<script type="module">
const study=new URL("./bush-render.js",import.meta.url).href;
const sceneURL=new URL("../test/d3-brush-audit.html",import.meta.url).href;
try {
  const response=await fetch(sceneURL);
  if(!response.ok) throw Error("石桥候选读取失败");
  let scene=await response.text();
  const insert=(before,after)=>{
    if(scene.split(before).length!==2) throw Error("石桥实验锚点变化");
    scene=scene.replace(before,()=>after);
  };
  insert('<meta charset="utf-8">',`<meta charset="utf-8"><base href="${sceneURL}">`);
  insert('import { createWebGLRenderer } from "../renderer-webgl.js";',
    `import { createStudyRenderer, loadBush } from ${JSON.stringify(study)};`);
  insert('const extraMeshes=[];',
    `const bush=await loadBush(); const extraMeshes=[]; colors.leafModel=[255,255,255];`);
  insert('  for(const [x,y,z,r] of trees) {',`  const bushId=addMesh(bush.mesh);
  for(const [x,y,z,r] of trees) {
    if(x===13 || x===14.8) { instance("leafModel",bushId,x,.08,z,r*2.05); continue; }`);
  insert('  items.forEach((fields,i)=>cloud.set(i,...fields));',
    `  if(material==="leafModel") { cloud.mapId=31; cloud.surfaceMap="base-color-mask"; }
  items.forEach((fields,i)=>cloud.set(i,...fields));`);
  insert('const textures = [];','const textures = [bush.texture];');
  insert('const renderer=createWebGLRenderer(canvas,{antialias:false,extraMeshes});',
    'const renderer=await createStudyRenderer(canvas,extraMeshes,bush);');
  scene=scene.replaceAll('import.meta.url',JSON.stringify(sceneURL));
  document.open();
  document.write(scene);
  document.close();
} catch(error) {
  document.title="BUSH_FAIL";
  document.querySelector("output").textContent=String(error);
}
</script>
