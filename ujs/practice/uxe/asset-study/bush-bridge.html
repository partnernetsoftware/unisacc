<!doctype html>
<html lang="zh">
<meta charset="utf-8">
<title>D3 灌木素材对照</title>
<output></output>
<script type="module">
const study=new URL("./bush-render.js",import.meta.url).href;
const sceneURL=new URL("../test/d3-brush-audit.html",import.meta.url).href;
try {
  const response=await fetch(sceneURL);
  if(!response.ok) throw Error("石桥候选读取失败");
  let scene=await response.text();
  const insert=(before,after)=>{
    if(scene.split(before).length!==2) throw Error("石桥实验锚点变化");
    scene=scene.replace(before,()=>after);
  };
  insert('<meta charset="utf-8">',`<meta charset="utf-8"><base href="${sceneURL}">`);
  insert('import { createWebGLRenderer } from "../renderer-webgl.js";',
    `import { createStudyRenderer, loadBush } from ${JSON.stringify(study)};`);
  insert('const extraMeshes=[];',
    `const paletteStudy=params.has("palette-study");
const reference=paletteStudy && params.has("reference-leaves");
const bush=reference?null:await loadBush(); const extraMeshes=[]; colors.leafModel=[255,255,255];
for(const tone of ["Ink","Paint","Sun"]) colors["leafRef"+tone]=colors["leaf"+tone];`);
  insert('  for(const [x,y,z,r] of trees) {',`  const bushId=bush?addMesh(bush.mesh):-1;
  for(const [x,y,z,r] of trees) {
    if(bush && (x===13 || x===14.8)) { instance("leafModel",bushId,x,.08,z,r*2.05); continue; }`);
  insert('params.has("v1-flat-leaves")?"leafPaint":material,ellipsoid+variant,...pose',
    'reference && (x===13 || x===14.8)?material.replace("leaf","leafRef"):params.has("v1-flat-leaves")?"leafPaint":material,ellipsoid+variant,...pose');
  insert('/^(leafInk|leafPaint|leafSun)$/.test(material)', '/^leaf(Ref)?(Ink|Paint|Sun)$/.test(material)');
  insert('  items.forEach((fields,i)=>cloud.set(i,...fields));',
    `  cloud.studyLeaf=material==="leafModel" || material.startsWith("leafRef");
  if(material==="leafModel") {
    cloud.mapId=31; cloud.surfaceMap="base-color-mask";
    if(paletteStudy) { cloud.toonLevels=3; cloud.outlineExcluded=params.has("no-outline"); }
  }
  items.forEach((fields,i)=>cloud.set(i,...fields));`);
  insert('const textures = [];','const textures = bush?[bush.texture]:[];');
  insert('const renderer=createWebGLRenderer(canvas,{antialias:false,extraMeshes});',
    'const renderer=await createStudyRenderer(canvas,extraMeshes,bush);');
  scene=scene.replaceAll('import.meta.url',JSON.stringify(sceneURL));
  document.open();
  document.write(scene);
  document.close();
} catch(error) {
  document.title="BUSH_FAIL";
  document.querySelector("output").textContent=String(error);
}
</script>
