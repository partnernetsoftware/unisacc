<!doctype html>
<html lang="zh">
<meta charset="utf-8">
<title>UXE 本地渲染对照</title>
<style>
  html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#1a2833}
  iframe{display:block;width:1280px;height:720px;border:0}
</style>
<iframe title="本地 Three.js 对照画面"></iframe>
<output hidden></output>
<script type="module">
const params=new URLSearchParams(location.search);
const d4=params.get("scene")==="d4";
const fixture=new URL(d4?"../test/d4-skeleton.html":"../test/d3-bridge.html",location.href);
const adapter=new URL("./renderer.js",location.href);
const palette=d4?"":"style=study";
const reply=await fetch(fixture);
if(!reply.ok) throw new Error("场景夹具读取失败");
const original=await reply.text();
const renderImport='from "../renderer-webgl.js"';
if(!original.includes(renderImport)) throw new Error("场景缺少对照入口");
const source=original
  .replace(/<!doctype html>/i,`<!doctype html><base href="${fixture.href}">`)
  .replace(renderImport,`from "${adapter.href}"`)
  .replaceAll('getContext("webgl")','getContext("webgl2")')
  .replaceAll("new URLSearchParams(location.search)",`new URLSearchParams("${palette}")`)
  .replaceAll("import.meta.url",JSON.stringify(fixture.href));
const frame=document.querySelector("iframe");
addEventListener("message",event=>{
  if(event.source!==frame.contentWindow || event.data?.three!=="160") return;
  document.querySelector("output").textContent=JSON.stringify(event.data);
  document.title="THREE_REFERENCE_READY";
});
frame.srcdoc=source;
</script>
</html>
