// web/engine/ship/monopoly-host-entry.js
async function startMonopolyShip(cfg) {
  const host = await createBrowserHost(cfg.canvas, {
    prefer: cfg.prefer || "auto",
    baseURL: new URL(".", cfg.engineUrl)
  });
  const engineUrl = cfg.engineUrl;
  const orig = host.host_asset_read.bind(host);
  host.host_asset_read = async (path) => {
    if (path === "ujs_full.wasm" || path === "gameEngine.wasm" || path.endsWith("gameEngine.wasm")) {
      const r = await fetch(engineUrl);
      if (!r.ok) throw new Error("fetch gameEngine " + r.status);
      return new Uint8Array(await r.arrayBuffer());
    }
    return orig(path);
  };
  function paint(s) {
    window.__UXE__ = { ...s, backend: host.backend, ship: true, monopoly: true };
    if (!s.ready) return;
    const who = s.turn === 0 ? "\u4F60" : "AI";
    const win = s.phase === 2 ? s.winner === 0 ? "\u4F60\u8D62\u4E86" : s.winner === 1 ? "AI \u8D62\u4E86" : "\u7ED3\u675F" : "";
    cfg.hud.innerHTML = `<b>\u57CE\u5E02\u5927\u5BCC\u7FC1</b> \xB7 ship-js + gameEngine<br>backend <b>${host.backend}</b> \xB7 fps <b>${(s.fps || 0).toFixed(0)}</b><br>\u56DE\u5408 <b>${who}</b> \xB7 ${s.phaseHint || ""}` + (win ? ` \xB7 <span class="warn">${win}</span>` : "") + `<br>\u4F60 \u{1F4B0}<b>${(s.money0 || 0).toFixed(0)}</b> \xB7 \u5730 ${s.owned0 ?? 0} \xB7 AI \u{1F4B0}<b>${(s.money1 || 0).toFixed(0)}</b> \xB7 \u5730 ${s.owned1 ?? 0}<br>` + (s.cellName ? `\u5F53\u524D\u683C <b>${s.cellName}</b>` : "") + (s.houses ? ` \xB7 \u623F ${s.houses}` : "") + (s.dice ? ` \xB7 \u9AB0 <b>${s.dice}</b>` : "") + (s.msg ? `<br><span class="warn">${s.msg}</span>` : "");
  }
  const image = new Uint8Array(monopoly_embed_default.image);
  await runMonopolyCore(host, {
    wasmUrl: "gameEngine.wasm",
    precompiled: { image, blob: monopoly_embed_default.blob },
    onHud: paint
  });
  return { backend: host.backend };
}
export {
  startMonopolyShip
};
