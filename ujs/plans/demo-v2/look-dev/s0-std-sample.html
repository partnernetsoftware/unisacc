<!DOCTYPE html>
<html><head><meta charset="utf-8"/><title>STD</title></head>
<body>
<canvas id="c" width="1280" height="720"></canvas>
<pre id="hud"></pre>
<script type="module">
(async()=>{
  const im=new Image();
  im.src=new URL("water-keeps-s0-concept.png", import.meta.url).href;
  await new Promise((res,rej)=>{ im.onload=res; im.onerror=()=>rej(new Error("img")); });
  const c=document.getElementById("c");
  const g=c.getContext("2d");
  g.drawImage(im,0,0,1280,720);
  const pts=[[200,100],[400,80],[640,90],[800,70],[320,120],[560,140]];

  const rows=[];
  for(const [x,y] of pts){
    const d=g.getImageData(x,y,32,32).data;
    const n=32*32;
    let sr=0,sg=0,sb=0;
    for(let i=0;i<n;i++){ sr+=d[i*4]; sg+=d[i*4+1]; sb+=d[i*4+2]; }
    const mr=sr/n, mg=sg/n, mb=sb/n;
    let v=0;
    for(let i=0;i<n;i++){
      const dr=d[i*4]-mr, dg=d[i*4+1]-mg, db=d[i*4+2]-mb;
      v+=dr*dr+dg*dg+db*db;
    }
    const std=Math.sqrt(v/n);
    rows.push({x,y,std:+std.toFixed(2),min:+(std*0.5).toFixed(2)});
  }
  document.getElementById("hud").textContent=JSON.stringify(rows);

  document.title="STD_OK";
})().catch(e=>{ document.title="STD_ERR"; });
</script>
</body></html>
