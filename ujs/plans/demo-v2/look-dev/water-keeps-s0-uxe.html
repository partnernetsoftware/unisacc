<!DOCTYPE html>
<html><head><meta charset="utf-8"/><title>S0U</title>
<style>html,body{margin:0;overflow:hidden;width:1280px;height:720px}canvas{display:block}</style>
</head>
<canvas id="c" width="1280" height="720"></canvas>
<pre id="hud"></pre>
<script type="module">
import { createWebGLRenderer } from "../../../practice/uxe/renderer-webgl.js";

import { Scene, PerspectiveCamera } from "../../../practice/uxe/scene.js";
import { applyTestScene } from "../../../practice/uxe/test/test-init.js";
import { MESH_POINTS } from "../../../practice/uxe/meshes.js";
import { createBrowserHost } from "../../../practice/uxe/host-browser.js";

function layer(scene,name,x,y,w,h,mapId,layerN,alpha){
  const c=scene.instances(name,1,[1,1,1]);
  c.meshId=MESH_POINTS;
  c.count=1;
  c.screenSpace=1;
  c.flags=8;
  c.layer=layerN;
  c.mapId=mapId;
  c.xyz=new Float32Array([x+w/2,y+h/2,0]);
  c.scale=new Float32Array([w]);
  c.scaleY=new Float32Array([h]);
  if(alpha) c.alphaMode=1;
  return c;
}
async function pngRgba(path){
  const im=new Image();
  im.src=new URL(path, import.meta.url).href;
  await new Promise((res,rej)=>{ im.onload=res; im.onerror=()=>rej(new Error(path)); });
  const c=document.createElement("canvas");
  c.width=im.naturalWidth; c.height=im.naturalHeight;
  const g=c.getContext("2d");
  g.drawImage(im,0,0);
  return {w:im.naturalWidth,h:im.naturalHeight,rgba:g.getImageData(0,0,im.naturalWidth,im.naturalHeight).data};
}

(async()=>{
  const canvas=document.getElementById("c");
  const r=createWebGLRenderer(canvas,{antialias:false});
  const host=await createBrowserHost(canvas,{prefer:"webgl",baseURL:new URL(".", import.meta.url)});
  const scene=new Scene();
  applyTestScene(scene,[0.12,0.08,0.05,1]);
  scene.fog.density=0;
  const skyP=await pngRgba("sky-gold.png");
  const watP=await pngRgba("water-gold.png");
  const shP=await pngRgba("far-shore.png");
  const brP=await pngRgba("far-bridge.png");

  layer(scene,"sky",0,0,1280,288,1,0,0);
  layer(scene,"water",0,288,1280,432,2,1,0);
  layer(scene,"shore",0,250,1280,80,3,2,1);
  layer(scene,"bridge",40,240,768,70,4,3,1);




  const texs=[
    {id:1,w:skyP.w,h:skyP.h,rgba:skyP.rgba},
    {id:2,w:watP.w,h:watP.h,rgba:watP.rgba},
    {id:3,w:shP.w,h:shP.h,rgba:shP.rgba},
    {id:4,w:brP.w,h:brP.h,rgba:brP.rgba}
  ];
  const cam=new PerspectiveCamera(1,0.05,40);
  r.render(scene,cam,texs);

  const gl=canvas.getContext("webgl");
  function mean(x,y,w,h){
    let r=0,gv=0,b=0,n=w*h,p=new Uint8Array(4);
    for(let yy=0;yy<h;yy++) for(let xx=0;xx<w;xx++){
      gl.readPixels(x+xx,720-1-(y+yy),1,1,gl.RGBA,gl.UNSIGNED_BYTE,p);
      r+=p[0]; gv+=p[1]; b+=p[2];
    }
    return [r/n,gv/n,b/n];
  }
  function dist(a,b){ const dr=a[0]-b[0],dg=a[1]-b[1],db=a[2]-b[2]; return Math.sqrt(dr*dr+dg*dg+db*db)|0; }
  const els=[
    ["sky",40,40,32,32,40,320,32,32],
    ["cloud",200,100,32,32,200,20,32,32],
    ["shore",40,255,32,32,40,200,32,32],
    ["bridge",80,260,16,8,80,400,16,8],


    ["water",640,500,32,32,640,40,32,32],
    ["lily",180,400,32,16,180,330,32,16],
    ["reed",1100,280,32,32,800,280,32,32],
    ["bow",900,600,32,32,950,600,32,32],
    ["bowlamp",300,392,16,16,200,392,16,16],
    ["lotus",416,356,16,16,200,356,16,16],
    ["spark",900,500,8,8,940,500,8,8],
    ["title",24,24,80,24,24,120,80,24],
    ["refl",900,680,32,16,950,680,32,16]

  ];
  const out={};
  els.forEach(e=>{ out[e[0]]=dist(mean(e[1],e[2],e[3],e[4]), mean(e[5],e[6],e[7],e[8])); });
  document.getElementById("hud").textContent=JSON.stringify(out);
  document.title="S0U_OK";

})().catch(e=>{document.title="S0U_ERR"; console.error(e);});
</script>
</body></html>
