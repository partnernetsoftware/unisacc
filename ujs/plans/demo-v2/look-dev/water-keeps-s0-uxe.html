<!DOCTYPE html>
<html><head><meta charset="utf-8"/><title>S0U</title>
<style>html,body{margin:0;overflow:hidden;width:1280px;height:720px}canvas{display:block}</style>
</head>
<canvas id="c" width="1280" height="720"></canvas>

<pre id="hud"></pre>
<script type="module">
import { createWebGLRenderer } from "../../../practice/uxe/renderer-webgl.js";

import { Scene, PerspectiveCamera } from "../../../practice/uxe/scene.js";
import { applyTestScene } from "../../../practice/uxe/test/test-init.js";
import { MESH_POINTS } from "../../../practice/uxe/meshes.js";
import { createBrowserHost } from "../../../practice/uxe/host-browser.js";

function layer(scene,name,x,y,w,h,mapId,layerN,alpha){
  const c=scene.instances(name,1,[1,1,1]);
  c.meshId=MESH_POINTS;
  c.count=1;
  c.screenSpace=1;
  c.flags=8;
  c.layer=layerN;
  c.mapId=mapId;
  c.xyz=new Float32Array([x+w/2,y+h/2,0]);
  c.scale=new Float32Array([w]);
  c.scaleY=new Float32Array([h]);
  if(alpha) c.alphaMode=1;
  return c;
}
async function pngRgba(path){
  const im=new Image();
  im.src=new URL(path, import.meta.url).href;
  await new Promise((res,rej)=>{ im.onload=res; im.onerror=()=>rej(new Error(path)); });
  const c=document.createElement("canvas");
  c.width=im.naturalWidth; c.height=im.naturalHeight;
  const g=c.getContext("2d");
  g.drawImage(im,0,0);
  return {w:im.naturalWidth,h:im.naturalHeight,rgba:g.getImageData(0,0,im.naturalWidth,im.naturalHeight).data};
}

(async()=>{
  const canvas=document.getElementById("c");
  if(location.hash.indexOf("h633")>=0){ canvas.height=633; }
  const r=createWebGLRenderer(canvas,{antialias:false});

  const scene=new Scene();
  applyTestScene(scene,[0.12,0.08,0.05,1]);
  scene.fog.density=0;
  const skyP=await pngRgba("sky-gold.png");
  const watP=await pngRgba("water-gold.png");
  const shP=await pngRgba("far-shore.png");
  const brP=await pngRgba("far-bridge.png");
  const clP=await pngRgba("cloud-soft.png");
  const liP=await pngRgba("lily-pad.png");
  const reP=await pngRgba("reed-bank.png");
  const boP=await pngRgba("bow-hull.png");
  const lpP=await pngRgba("bow-lamp.png");
  const loP=await pngRgba("lotus-bloom.png");



  layer(scene,"sky",0,0,1280,288,1,0,0);
  if(location.hash.indexOf("nocloud")<0) layer(scene,"cloud",80,70,1120,90,5,1,1);

  layer(scene,"water",0,288,1280,432,2,2,0);
  layer(scene,"shore",0,250,1280,80,3,3,1);
  layer(scene,"bridge",40,240,768,70,4,4,1);
  if(location.hash.indexOf("nolily")<0) layer(scene,"lily",176,398,40,20,6,5,1);


  if(location.hash.indexOf("noreed")<0) layer(scene,"reed",1084,264,64,48,8,7,1);
  if(location.hash.indexOf("nobow")<0) layer(scene,"bow",90,500,200,120,7,6,1);
  if(location.hash.indexOf("nolamp")<0) layer(scene,"bowlamp",284,376,40,40,9,8,1);
  if(location.hash.indexOf("nolotus")<0) layer(scene,"lotus",400,348,40,24,10,9,1);
  if(location.hash.indexOf("notitle")<0){
    const t=scene.text("WATER",24,20,4,[1,1,0.55]);
    for(let i=0;i<t.count;i++) t.scale[i]=10;
  }











  const texs=[
    {id:1,w:skyP.w,h:skyP.h,rgba:skyP.rgba,filter:1},
    {id:2,w:watP.w,h:watP.h,rgba:watP.rgba,filter:1},
    {id:3,w:shP.w,h:shP.h,rgba:shP.rgba,filter:1},
    {id:4,w:brP.w,h:brP.h,rgba:brP.rgba,filter:1},
    {id:5,w:clP.w,h:clP.h,rgba:clP.rgba,filter:1},
    {id:6,w:liP.w,h:liP.h,rgba:liP.rgba,filter:1},
    {id:7,w:boP.w,h:boP.h,rgba:boP.rgba,filter:1},
    {id:8,w:reP.w,h:reP.h,rgba:reP.rgba,filter:1},
    {id:9,w:lpP.w,h:lpP.h,rgba:lpP.rgba,filter:1},
    {id:10,w:loP.w,h:loP.h,rgba:loP.rgba,filter:1}







  ];
  const cam=new PerspectiveCamera(1,0.05,40);
  r.render(scene,cam,texs);

  const gl=canvas.getContext("webgl");
  function mean(x,y,w,h){
    let r=0,gv=0,b=0,n=w*h,p=new Uint8Array(4);
    for(let yy=0;yy<h;yy++) for(let xx=0;xx<w;xx++){
      gl.readPixels(x+xx,720-1-(y+yy),1,1,gl.RGBA,gl.UNSIGNED_BYTE,p);
      r+=p[0]; gv+=p[1]; b+=p[2];
    }
    return [r/n,gv/n,b/n];
  }
  function dist(a,b){ const dr=a[0]-b[0],dg=a[1]-b[1],db=a[2]-b[2]; return Math.sqrt(dr*dr+dg*dg+db*db)|0; }
  const els=[
    ["sky",40,40,32,32,40,320,32,32],
    ["cloud",200,100,32,32,200,20,32,32],
    ["shore",40,255,32,32,40,200,32,32],
    ["bridge",120,250,32,16,120,200,32,16],
    ["water",640,500,32,32,640,40,32,32],
    ["lily",180,400,32,16,180,330,32,16],
    ["reed",1100,280,32,32,800,280,32,32],
    ["bow",200,560,32,32,800,560,32,32],
    ["bowlamp",300,392,16,16,200,392,16,16],
    ["lotus",416,356,16,16,200,356,16,16],
    ["spark",640,520,8,8,640,40,8,8],
    ["title",24,24,80,24,24,120,80,24],
    ["refl",200,680,32,16,200,400,32,16]
  ];

  const out={};
  els.forEach(e=>{ out[e[0]]=dist(mean(e[1],e[2],e[3],e[4]), mean(e[5],e[6],e[7],e[8])); });
  {
    const p=new Uint8Array(4); let fill=1;
    if(canvas.height!==720) fill=0;
    for(let y=0;y<4 && fill;y++) for(let x=0;x<1280;x+=16){
      gl.readPixels(x,y,1,1,gl.RGBA,gl.UNSIGNED_BYTE,p);
      const s=p[0]+p[1]+p[2];
      if(s===0 || s===765) fill=0;
    }
    out.fill=fill;
    out.h=canvas.height;
  }

  document.getElementById("hud").textContent=JSON.stringify(out);
  document.title="S0U_OK";


})().catch(e=>{document.title="S0U_ERR"; console.error(e);});
</script>
</body></html>
