<!DOCTYPE html>
<html><head><meta charset="utf-8"/><title>S0CMP</title>
<style>html,body{margin:0;background:#111;color:#ddd;font:14px sans-serif}
.row{display:flex} img{width:1280px;height:720px;display:block}
pre{margin:8px;white-space:pre-wrap}</style>
</head>
<body>
<div class="row">
<img src="water-keeps-s0.png" alt="concept"/>
<img src="water-keeps-s0-uxe.png" alt="uxe"/>
</div>
<pre id="hist">hist pending</pre>
<script>
fetch("s0-elements.tsv").then(r=>r.text()).then(t=>{
  const lines=t.trim().split(/\n/).slice(1);
  let s="id\tmin\ter\n";
  lines.forEach(l=>{ const c=l.split("\t"); s+=c[0]+"\t"+c[10]+"\t"+c[11]+"\n"; });
  document.getElementById("hist").textContent=s;
  document.title="S0CMP_OK";
}).catch(e=>{ document.title="S0CMP_ERR"; });
</script>
</body></html>
