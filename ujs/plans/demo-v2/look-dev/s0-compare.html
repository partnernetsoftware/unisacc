<!DOCTYPE html>
<html><head><meta charset="utf-8"/><title>CMP</title></head>
<body style="margin:0">
<canvas id="c" width="2560" height="720"></canvas>
<script>
(async()=>{
  const ours=new Image();
  const ref=new Image();
  ours.src="file:///home/devali/repos/unisacc/.claude/worktrees/ujs/ujs/plans/demo-v2/look-dev/water-keeps-s0.png";
  ref.src="file:///home/devali/repos/unisacc/.claude/worktrees/ujs/ujs/plans/demo-v2/ref/water-keeps/c-vt20000.png";
  await Promise.all([
    new Promise((r,j)=>{ours.onload=r;ours.onerror=()=>j("ours");}),
    new Promise((r,j)=>{ref.onload=r;ref.onerror=()=>j("ref");})
  ]);
  const c=document.getElementById("c");
  const g=c.getContext("2d");
  g.drawImage(ours,0,0,1280,720);
  g.drawImage(ref,1280,0,1280,720);
  document.title="CMP_OK";
})().catch(e=>{document.title="CMP_ERR";});
</script>
</body></html>
