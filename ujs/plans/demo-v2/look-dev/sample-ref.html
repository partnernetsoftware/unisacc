<!DOCTYPE html>
<html><head><meta charset="utf-8"/><title>PAL</title></head>
<body>
<img id="im"/>
<pre id="hud"></pre>
<script>
(async()=>{
  const im=document.getElementById("im");
  im.src="file:///home/devali/repos/unisacc/.claude/worktrees/ujs/ujs/plans/demo-v2/ref/water-keeps/c-vt20000.png";
  await new Promise((res,rej)=>{ im.onload=res; im.onerror=()=>rej(new Error("img")); });
  const c=document.createElement("canvas");
  c.width=im.naturalWidth; c.height=im.naturalHeight;
  const g=c.getContext("2d");
  g.drawImage(im,0,0);
  function avg(x,y){
    const d=g.getImageData(x,y,8,8).data;
    let r=0,gv=0,b=0,n=64;
    for(let i=0;i<n;i++){ r+=d[i*4]; gv+=d[i*4+1]; b+=d[i*4+2]; }
    return [Math.round(r/n),Math.round(gv/n),Math.round(b/n)];
  }
  const W=c.width, H=c.height;
  const skyTop=avg((W/2)|0, 8);
  const skyMid=avg((W/2)|0, (H*0.22)|0);
  const hor=avg((W/2)|0, (H*0.38)|0);
  const waterFar=avg((W/2)|0, (H*0.48)|0);
  const waterNear=avg((W/2)|0, (H*0.78)|0);
  const sil=avg(40, (H*0.55)|0);
  const lamp=avg((W*0.35)|0, (H*0.62)|0);
  document.getElementById("hud").textContent=JSON.stringify({W,H,skyTop,skyMid,hor,waterFar,waterNear,sil,lamp});
  document.title="PAL_OK";
})().catch(e=>{document.title="PAL_ERR"; document.getElementById("hud").textContent=String(e&&e.message||e);});
</script>
</body></html>
