<!DOCTYPE html>
<html><head><meta charset="utf-8"/><title>LOOK</title></head>
<body>
<canvas id="c" width="1280" height="720"></canvas>
<pre id="hud"></pre>
<script type="module">

const q=new URLSearchParams(location.search);
const src=q.get("src")||"water-keeps-s0-concept.png";
(async()=>{
  const im=new Image();
  im.src=new URL(src, import.meta.url).href;
  await new Promise((res,rej)=>{ im.onload=res; im.onerror=()=>rej(new Error(src)); });
  const c=document.getElementById("c");
  const g=c.getContext("2d");
  g.drawImage(im,0,0,1280,720);
  const d=g.getImageData(0,0,1280,720).data;
  if(location.hash==="#sky-strip"){
    const topRGB=[];
    for(let y=24;y<=52;y++){
      const i=y*1280*4;
      topRGB.push(d[i],d[i+1],d[i+2]);
    }
    document.getElementById("hud").textContent=JSON.stringify({topRGB});
    return;
  }
  const BW=80,BH=45,BS=16;
  const rows=[];
  for(let by=0;by<BH;by++){
    for(let bx=0;bx<BW;bx++){
      let sr=0,sg=0,sb=0,n=0,se=0;
      for(let y=0;y<BS;y++) for(let x=0;x<BS;x++){
        const xx=bx*BS+x, yy=by*BS+y;
        const i=(yy*1280+xx)*4;
        sr+=d[i]; sg+=d[i+1]; sb+=d[i+2]; n++;
        if(x+1<BS){ const j=(yy*1280+xx+1)*4; se+=Math.abs(d[i]-d[j])+Math.abs(d[i+1]-d[j+1])+Math.abs(d[i+2]-d[j+2]); }
        if(y+1<BS){ const j=((yy+1)*1280+xx)*4; se+=Math.abs(d[i]-d[j])+Math.abs(d[i+1]-d[j+1])+Math.abs(d[i+2]-d[j+2]); }
      }
      const mr=sr/n, mg=sg/n, mb=sb/n;
      let v=0;
      for(let y=0;y<BS;y++) for(let x=0;x<BS;x++){
        const xx=bx*BS+x, yy=by*BS+y;
        const i=(yy*1280+xx)*4;
        const dr=d[i]-mr, dg=d[i+1]-mg, db=d[i+2]-mb;
        v+=dr*dr+dg*dg+db*db;
      }
      const std=Math.sqrt(v/n)|0;
      const edge=(se/n)|0;
      rows.push((mr|0)+"\t"+(mg|0)+"\t"+(mb|0)+"\t"+std+"\t"+edge);
    }
  }
  document.getElementById("hud").textContent="LOOK_N="+rows.length+"\n"+rows.join("\n");
  document.title="LOOK_OK";
})().catch(e=>{ document.title="LOOK_ERR"; document.getElementById("hud").textContent=String(e); });
</script>
</body></html>
