<!DOCTYPE html>
<html><head><meta charset="utf-8"/><title>S0</title>
<style>
html,body{margin:0;padding:0;overflow:hidden;width:1280px;height:720px;background:#000}
canvas{position:absolute;left:0;top:0;width:1280px;height:720px}
</style>
</head>
<body>
<canvas id="c" width="1280" height="720"></canvas>
<script type="module">
import { FONT, FONT_W, FONT_H } from "../../../practice/uxe/font5x7.js";
const W=1280,H=720;
const c=document.getElementById("c");
const g=c.getContext("2d");
function hash(x,y){ const n=Math.sin(x*127.1+y*311.7)*43758.5453; return n-Math.floor(n); }
function vnoise(x,y){
  const x0=Math.floor(x), y0=Math.floor(y);
  const fx=x-x0, fy=y-y0;
  const a=hash(x0,y0), b=hash(x0+1,y0), c=hash(x0,y0+1), d=hash(x0+1,y0+1);
  const ux=fx*fx*(3-2*fx), uy=fy*fy*(3-2*fy);
  return a+(b-a)*ux+(c-a)*uy+(a-b-c+d)*ux*uy;
}
function fbm(x,y){
  let a=0, amp=0.5, f=1;
  for(let i=0;i<5;i++){ a+=amp*vnoise(x*f,y*f); f*=2; amp*=0.5; }
  return a;
}
function drawCloudBand(){
  const img=g.getImageData(0,80,W,160);
  const d=img.data;
  for(let y=0;y<160;y++) for(let x=0;x<W;x++){
    let n=fbm(x*0.006, y*0.035);
    n=n*n;
    if(n<0.22) continue;
    const a=Math.min(0.55,(n-0.22)*2.2);
    const i=(y*W+x)*4;
    d[i]=d[i]*(1-a)+244*a;
    d[i+1]=d[i+1]*(1-a)+224*a;
    d[i+2]=d[i+2]*(1-a)+168*a;
  }
  g.putImageData(img,0,80);
}
function text5(str,x,y,s,col){
  g.fillStyle=col;
  for(let gi=0;gi<str.length;gi++){
    const cols=FONT[str[gi]]; if(!cols) continue;
    for(let cx=0;cx<FONT_W;cx++){
      const bits=cols[cx]|0;
      for(let cy=0;cy<FONT_H;cy++){
        if(!((bits>>cy)&1)) continue;
        g.fillRect(x+gi*FONT_W*s+cx*s, y+cy*s, s, s);
      }
    }
  }
}
const sky=g.createLinearGradient(0,0,0,288);
sky.addColorStop(0,"#AEA579");
sky.addColorStop(0.45,"#DAAF68");
sky.addColorStop(1,"#EEB54C");
g.fillStyle=sky; g.fillRect(0,0,W,288);
drawCloudBand();

g.fillStyle="#5B3B1C"; g.fillRect(0,250,W,80);
g.fillStyle="#3A2414"; g.fillRect(40,255,768,18);
g.fillRect(80,273,18,50); g.fillRect(300,273,18,50); g.fillRect(520,273,18,50); g.fillRect(740,273,18,50);
const wat=g.createLinearGradient(0,288,0,720);
wat.addColorStop(0,"#A3733F");
wat.addColorStop(1,"#594020");
g.fillStyle=wat; g.fillRect(0,288,W,432);
g.strokeStyle="rgba(238,181,76,0.12)";
for(let y=300;y<710;y+=7){ g.beginPath(); g.moveTo(0,y+(y%14?2:0)); g.lineTo(W,y); g.stroke(); }
/* reflection T5 placeholder */
g.save();
g.beginPath(); g.rect(0,288,W,432); g.clip();
g.translate(0,576);
g.scale(1,-1);
g.globalAlpha=0.22;
g.fillStyle="#3A2414"; g.fillRect(40,255,768,18);
g.fillRect(80,273,18,40); g.fillRect(300,273,18,40); g.fillRect(520,273,18,40); g.fillRect(740,273,18,40);
g.fillStyle="#1A3010";
for(let i=0;i<48;i++){ const x=980+(i*17)%280; g.fillRect(x,210+(i%7)*6,2,200); }
g.fillStyle="#2A1810";
g.beginPath(); g.moveTo(90,680); g.quadraticCurveTo(220,430,430,430); g.quadraticCurveTo(560,500,610,680); g.closePath(); g.fill();
g.globalCompositeOperation="lighter";
g.fillStyle="rgba(255,232,160,0.25)";
g.beginPath(); g.arc(300,392,20,0,6.28); g.fill();
g.restore();

g.fillStyle="#2A4A18";
[[180,400],[320,440],[500,380],[700,460],[860,410]].forEach(([x,y])=>{
  g.beginPath(); g.ellipse(x,y,48,18,0.2,0,6.28); g.fill();
});
g.fillStyle="#1A3010";
for(let i=0;i<48;i++){
  const x=980+(i*17)%280;
  g.fillRect(x,210+(i%7)*6,2+i%2,400);
}
/* boat hull with gunwale */
g.fillStyle="#2A1810";
g.beginPath();
g.moveTo(90,680);
g.quadraticCurveTo(220,430,430,430);
g.quadraticCurveTo(560,500,610,680);
g.closePath(); g.fill();
g.strokeStyle="#4A3020"; g.lineWidth=6;
g.beginPath(); g.moveTo(120,640); g.quadraticCurveTo(300,450,560,640); g.stroke();
for(let i=0;i<6;i++){ g.strokeStyle="rgba(90,60,40,0.4)"; g.beginPath(); g.moveTo(140+i*70,670); g.lineTo(200+i*60,500); g.stroke(); }
/* lamp pole + halo */
g.strokeStyle="#1A1008"; g.lineWidth=4;
g.beginPath(); g.moveTo(300,520); g.lineTo(300,400); g.stroke();
g.globalCompositeOperation="lighter";
g.fillStyle="rgba(255,232,160,0.35)";
g.beginPath(); g.arc(300,392,36,0,6.28); g.fill();
g.fillStyle="rgba(255,232,160,0.9)";
g.beginPath(); g.arc(300,392,8,0,6.28); g.fill();
[[416,356],[480,348],[360,370]].forEach(([x,y])=>{
  g.fillStyle="rgba(255,232,160,0.4)"; g.beginPath(); g.arc(x,y,16,0,6.28); g.fill();
  g.fillStyle="rgba(255,232,160,0.95)"; g.beginPath(); g.arc(x,y,5,0,6.28); g.fill();
});
g.fillStyle="rgba(255,208,128,0.7)";
[[200,500],[640,520],[900,480],[1100,560],[400,600]].forEach(([x,y])=>{
  g.beginPath(); g.arc(x,y,4,0,6.28); g.fill();
});
g.globalCompositeOperation="source-over";
text5("WATER KEEPS",24,24,4,"#1A1008");
document.title="S0_OK";
</script>
</body></html>
