<!DOCTYPE html>
<html><head><meta charset="utf-8"/><title>S0</title>
<style>html,body{margin:0;background:#000}canvas{display:block}</style>
</head>
<body>
<canvas id="c" width="1280" height="720"></canvas>
<script type="module">
import { createWebGLRenderer } from "../../../practice/uxe/renderer-webgl.js";
import { Scene, PerspectiveCamera } from "../../../practice/uxe/scene.js";
import { applyTestScene } from "../../../practice/uxe/test/test-init.js";
import { MESH_PLANE, MESH_POINTS } from "../../../practice/uxe/meshes.js";

function hex(h){
  const n=parseInt(h.slice(1),16);
  return [(n>>16)&255,(n>>8)&255,n&255,255];
}
function grad(w,h,stops){
  const c=document.createElement("canvas");
  c.width=w; c.height=h;
  const g=c.getContext("2d");
  const lg=g.createLinearGradient(0,0,0,h);
  for(const s of stops) lg.addColorStop(s[0], s[1]);
  g.fillStyle=lg; g.fillRect(0,0,w,h);
  return g.getImageData(0,0,w,h).data;
}
function sil(w,h,fn){
  const a=new Uint8ClampedArray(w*h*4);
  for(let y=0;y<h;y++) for(let x=0;x<w;x++){
    const on=fn(x/w,y/h);
    const i=(y*w+x)*4;
    a[i]=10; a[i+1]=6; a[i+2]=8; a[i+3]=on?255:0;
  }
  return a;
}

(async()=>{
  const canvas=document.getElementById("c");
  const r=createWebGLRenderer(canvas,{antialias:false});
  const scene=new Scene();
  applyTestScene(scene,[0.68,0.65,0.47,1]);
  scene.fog.density=0;
  const sky=grad(64,64,[[0,"#AEA579"],[0.45,"#DAAF68"],[1,"#EEB54C"]]);
  const water=grad(64,64,[[0,"#A3733F"],[1,"#594020"]]);
  const textures=[
    {id:1,w:64,h:64,rgba:sky},
    {id:2,w:64,h:64,rgba:water}
  ];
  /* screen quads via ortho POINTS? use planes in world then camera */
  const cam=new PerspectiveCamera(0.9,0.05,80);
  cam.setEye(0,2.2,8); cam.setTarget(0,1.2,-4);
  const skyC=scene.instances("sky",1,[1,1,1]);
  skyC.meshId=MESH_PLANE; skyC.mapId=1; skyC.count=1;
  skyC.xyz.set([0,6,-20]); skyC.scale[0]=40;
  const wC=scene.instances("w",1,[1,1,1]);
  wC.meshId=MESH_PLANE; wC.mapId=2; wC.count=1;
  wC.xyz.set([0,-0.2,-8]); wC.scale[0]=40;
  const bow=scene.instances("bow",1,[0.36,0.23,0.11]);
  bow.meshId=MESH_PLANE; bow.count=1; bow.xyz.set([-1.2,0.1,3]); bow.scale[0]=4;
  const lamp=scene.instances("lamp",1,[1,0.91,0.63]);
  lamp.meshId=MESH_POINTS; lamp.count=1; lamp.alphaMode=1; lamp.billboard=1;
  lamp.xyz.set([-0.4,0.6,3]); lamp.scale[0]=0.4;
  scene.text("WATER KEEPS", 24, 24, 4, [0.12,0.08,0.05]);
  r.render(scene,cam,textures);
  document.title="S0_OK";
})().catch(e=>{document.title="S0_ERR"; console.error(e);});
</script>
</body></html>
