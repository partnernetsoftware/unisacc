<!DOCTYPE html>
<html><head><meta charset="utf-8"/><title>S0</title>
<style>
html,body{margin:0;padding:0;overflow:hidden;width:1280px;height:720px;background:#000}
canvas{display:block;width:1280px;height:720px}
</style>
</head>
<body>
<canvas id="c" width="1280" height="720"></canvas>
<script>
const W=1280,H=720;
const c=document.getElementById("c");
const g=c.getContext("2d");
function box(x,y,w,h,fill){ g.fillStyle=fill; g.fillRect(x,y,w,h); }
function tri(pts,fill){ g.fillStyle=fill; g.beginPath(); g.moveTo(pts[0],pts[1]); for(let i=2;i<pts.length;i+=2) g.lineTo(pts[i],pts[i+1]); g.closePath(); g.fill(); }
/* sky */
const sky=g.createLinearGradient(0,0,0,288);
sky.addColorStop(0,"#AEA579");
sky.addColorStop(0.45,"#DAAF68");
sky.addColorStop(1,"#EEB54C");
g.fillStyle=sky; g.fillRect(0,0,W,288);
/* clouds */
g.globalAlpha=0.35; g.fillStyle="#F4E0A8";
g.beginPath(); g.ellipse(400,90,220,40,0,0,6.28); g.fill();
g.beginPath(); g.ellipse(820,70,260,36,0,0,6.28); g.fill();
g.globalAlpha=1;
/* far shore */
g.fillStyle="#5B3B1C"; g.fillRect(0,250,W,80);
/* bridge */
g.fillStyle="#3A2414"; g.fillRect(40,255,768,18);
g.fillRect(80,273,18,50); g.fillRect(300,273,18,50); g.fillRect(520,273,18,50); g.fillRect(740,273,18,50);
/* water mirror */
const wat=g.createLinearGradient(0,288,0,720);
wat.addColorStop(0,"#A3733F");
wat.addColorStop(1,"#594020");
g.fillStyle=wat; g.fillRect(0,288,W,432);
g.strokeStyle="rgba(238,181,76,0.15)";
for(let y=300;y<700;y+=8){ g.beginPath(); g.moveTo(0,y); g.lineTo(W,y); g.stroke(); }
/* lily */
g.fillStyle="#2A4A18";
[[180,400],[320,440],[500,380],[700,460],[860,410]].forEach(([x,y])=>{
  g.beginPath(); g.ellipse(x,y,48,18,0.2,0,6.28); g.fill();
});
/* reeds */
g.fillStyle="#1A3010";
for(let i=0;i<40;i++){
  const x=980+Math.random()*280;
  g.fillRect(x,220+Math.random()*80,3,380);
}
/* boat bow */
g.fillStyle="#2A1810";
tri([80,648, 600,648, 420,420, 200,430], "#2A1810");
/* bow lamp additive-ish */
g.globalCompositeOperation="lighter";
g.fillStyle="rgba(255,232,160,0.9)";
g.beginPath(); g.arc(304,454,18,0,6.28); g.fill();
/* lotus lamps */
[[416,356],[480,348],[360,370]].forEach(([x,y])=>{
  g.beginPath(); g.arc(x,y,10,0,6.28); g.fill();
});
/* sparks */
g.fillStyle="rgba(255,208,128,0.7)";
[[200,500],[640,520],[900,480],[1100,560],[400,600]].forEach(([x,y])=>{
  g.beginPath(); g.arc(x,y,4,0,6.28); g.fill();
});
g.globalCompositeOperation="source-over";
/* title 5x7 via fillText fallback until scene.text overlay */
g.fillStyle="#1A1008";
g.font="24px monospace";
g.fillText("WATER KEEPS",24,48);
/* reflection placeholder */
g.globalAlpha=0.25; g.fillStyle="#2A1810";
tri([80,648, 600,648, 420,720, 200,720], "#2A1810");
g.globalAlpha=1;
document.title="S0_OK";
</script>
</body></html>
