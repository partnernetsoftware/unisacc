<!DOCTYPE html>
<html><head><meta charset="utf-8"/><title>PROF</title></head>
<body>
<canvas id="c" width="1280" height="720"></canvas>
<pre id="hud"></pre>
<script type="module">
(async()=>{
  const im=new Image();
  im.src=new URL("water-keeps-s0-concept.png", import.meta.url).href;
  await new Promise((res,rej)=>{ im.onload=res; im.onerror=()=>rej(new Error("img")); });
  const c=document.getElementById("c");
  const g=c.getContext("2d");
  g.drawImage(im,0,0,1280,720);
  const d=g.getImageData(0,0,1280,720).data;
  function pix(x,y){ const i=(y*1280+x)*4; return [d[i],d[i+1],d[i+2]]; }
  function skyRow(y){
    let sr=0,sg=0,sb=0,n=0;
    for(let x=0;x<80;x++){ const p=pix(x,y); sr+=p[0]; sg+=p[1]; sb+=p[2]; n++; }
    for(let x=1200;x<1280;x++){ const p=pix(x,y); sr+=p[0]; sg+=p[1]; sb+=p[2]; n++; }
    return (sr/n|0)+"\t"+(sg/n|0)+"\t"+(sb/n|0);
  }
  function watRow(y){
    const rs=[],gs=[],bs=[],lu=[];
    for(let x=0;x<1280;x++){
      if(x>=960) continue;
      if(y>=396 && x>=80 && x<600) continue;
      const p=pix(x,y);
      rs.push(p[0]); gs.push(p[1]); bs.push(p[2]);
      lu.push(p[0]+p[1]+p[2]);
    }
    const n=lu.length, idx=[...lu.keys()].sort((a,b)=>lu[a]-lu[b]);
    const k=idx[(n*25/100)|0];
    return rs[k]+"\t"+gs[k]+"\t"+bs[k];
  }
  const sky=[], wat=[];
  for(let y=0;y<288;y++) sky.push(skyRow(y));
  for(let y=0;y<432;y++) wat.push(watRow(288+y));
  document.getElementById("hud").textContent="SKY_N="+sky.length+"\n"+sky.join("\n")+"\nWATER_N="+wat.length+"\n"+wat.join("\n");
  document.title="PROF_OK";
})().catch(e=>{ document.title="PROF_ERR"; document.getElementById("hud").textContent=String(e); });
</script>
</body></html>
