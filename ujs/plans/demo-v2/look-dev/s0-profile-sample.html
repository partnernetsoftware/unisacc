<!DOCTYPE html>
<html><head><meta charset="utf-8"/><title>PROF</title></head>
<body>
<canvas id="c" width="1280" height="720"></canvas>
<pre id="hud"></pre>
<script type="module">
(async()=>{
  const im=new Image();
  im.src=new URL("water-keeps-s0-concept.png", import.meta.url).href;
  await new Promise((res,rej)=>{ im.onload=res; im.onerror=()=>rej(new Error("img")); });
  const c=document.getElementById("c");
  const g=c.getContext("2d");
  g.drawImage(im,0,0,1280,720);
  const d=g.getImageData(0,0,1280,720).data;
  function occ(x){ return (x>=40 && x<808) || (x>=960 && x<1280); }
  function row(y0,n){
    const o=[];
    for(let y=0;y<n;y++){
      let sr=0,sg=0,sb=0,cnt=0;
      for(let x=0;x<1280;x++){
        if(occ(x)) continue;
        const i=((y0+y)*1280+x)*4;
        sr+=d[i]; sg+=d[i+1]; sb+=d[i+2]; cnt++;
      }
      if(!cnt) cnt=1;
      o.push((sr/cnt|0)+"\t"+(sg/cnt|0)+"\t"+(sb/cnt|0));
    }
    return o;
  }
  const sky=row(0,288), wat=row(288,432);
  document.getElementById("hud").textContent="SKY_N="+sky.length+"\n"+sky.join("\n")+"\nWATER_N="+wat.length+"\n"+wat.join("\n");
  document.title="PROF_OK";
})().catch(e=>{ document.title="PROF_ERR"; document.getElementById("hud").textContent=String(e); });
</script>
</body></html>
