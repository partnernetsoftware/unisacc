<!DOCTYPE html>
<html><head><meta charset="utf-8"/><title>S0D</title></head>
<body>
<img id="im"/>
<pre id="hud"></pre>
<script>
(async()=>{
  const im=document.getElementById("im");
  im.src="file:///home/devali/repos/unisacc/.claude/worktrees/ujs/ujs/plans/demo-v2/look-dev/water-keeps-s0-concept.png";
  await new Promise((r,j)=>{im.onload=r;im.onerror=()=>j(new Error("img"));});
  const c=document.createElement("canvas");
  c.width=im.naturalWidth; c.height=im.naturalHeight;
  const g=c.getContext("2d");
  g.drawImage(im,0,0);
  function avg(x,y,w,h){
    const d=g.getImageData(x,y,w,h).data; let r=0,gv=0,b=0,n=w*h;
    for(let i=0;i<n;i++){ r+=d[i*4]; gv+=d[i*4+1]; b+=d[i*4+2]; }
    return [r/n,gv/n,b/n];
  }
  function dist(a,b){ const dr=a[0]-b[0],dg=a[1]-b[1],db=a[2]-b[2]; return Math.sqrt(dr*dr+dg*dg+db*db); }
  const els=[
    ["sky",40,40,32,32, 40,320,32,32],
    ["cloud",200,100,32,32, 200,20,32,32],
    ["shore",40,255,32,32, 40,200,32,32],
    ["bridge",120,250,32,16, 120,200,32,16],
    ["water",640,500,32,32, 640,40,32,32],
    ["lily",180,400,32,16, 180,330,32,16],
    ["reed",1100,280,32,32, 800,280,32,32],
    ["bow",200,560,32,32, 800,560,32,32],
    ["bowlamp",300,392,16,16, 200,392,16,16],
    ["lotus",416,356,16,16, 200,356,16,16],
    ["spark",640,520,8,8, 640,40,8,8],
    ["title",24,24,80,24, 24,120,80,24],
    ["refl",200,680,32,16, 200,400,32,16]
  ];
  const out={};
  els.forEach(e=>{
    const a=avg(e[1],e[2],e[3],e[4]), b=avg(e[5],e[6],e[7],e[8]);
    out[e[0]]={d:dist(a,b)|0, in:a.map(x=>x|0), out:b.map(x=>x|0)};
  });
  document.getElementById("hud").textContent=JSON.stringify(out);
  document.title="S0D_OK";
})().catch(e=>{document.title="S0D_ERR"; document.getElementById("hud").textContent=String(e&&e.message||e);});
</script>
</body></html>
