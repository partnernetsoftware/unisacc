# Paste into jobs.macos.steps AFTER the suites step (or use if: always()).
# Diagnostic only: does not change suite pass/fail.
      - name: preserve bootstrap diag (env-gated)
        if: always() && runner.os == 'macOS'
        env:
          UNISACC_DIAG_OUT: ${{ runner.temp }}/unisacc-diag
        run: |
          set -eu
          mkdir -p "$UNISACC_DIAG_OUT"
          # Suites already ran; scratch may be gone. Capture whatever remains + job log crumbs.
          echo "diag_out=$UNISACC_DIAG_OUT" > "$UNISACC_DIAG_OUT/meta.txt"
          echo "sha=$GITHUB_SHA" >> "$UNISACC_DIAG_OUT/meta.txt"
          echo "runner=${{ matrix.runner }}" >> "$UNISACC_DIAG_OUT/meta.txt"
          echo "attempt=$GITHUB_RUN_ATTEMPT" >> "$UNISACC_DIAG_OUT/meta.txt"
          # Prefer in-suite copy via UNISACC_DIAG_OUT exported on the suites step.
          ls -la "$UNISACC_DIAG_OUT" || true
      - name: upload macos diag artifact
        if: failure() && runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: darwin-diag-${{ matrix.runner }}-${{ github.run_id }}-a${{ github.run_attempt }}
          path: ${{ runner.temp }}/unisacc-diag
          if-no-files-found: warn
          retention-days: 5
