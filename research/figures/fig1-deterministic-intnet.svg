<?xml version="1.0" encoding="UTF-8"?>
<!--
  Fig. 1 - Deterministic integer feed-forward network (UNISA / unisacc).
  IEEE-oriented line art: black strokes, white fill, sans-serif labels,
  no gradients/shadows. Prefer SVG/PDF for submission; PNG is optional raster.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="672" height="320"
     viewBox="0 0 672 320" role="img"
     aria-label="Deterministic integer network architecture">
  <title>Fig. 1. Deterministic integer network architecture</title>
  <desc>
    Dataflow for one stage: finite key fields are one-hot embedded, then
    integer matrix-vector products with ReLU and a strict argmax yield a class.
    Deploy path replaces dense gemv with bitmask conjunction and integer adds.
  </desc>

  <defs>
    <marker id="arrowHead" markerWidth="8" markerHeight="8" refX="6" refY="3"
            orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L6,3 L0,6 Z" fill="#000000"/>
    </marker>
    <style type="text/css"><![CDATA[
      .box { fill: #ffffff; stroke: #000000; stroke-width: 1.5; }
      .box-emph { fill: #ffffff; stroke: #000000; stroke-width: 2; }
      .arrow { fill: none; stroke: #000000; stroke-width: 1.5; marker-end: url(#arrowHead); }
      .lbl { font-family: Helvetica, Arial, sans-serif; font-size: 11px; fill: #000000; text-anchor: middle; }
      .lbl-sm { font-family: Helvetica, Arial, sans-serif; font-size: 9px; fill: #000000; text-anchor: middle; }
      .lbl-left { font-family: Helvetica, Arial, sans-serif; font-size: 9px; fill: #000000; text-anchor: start; }
      .sub { font-family: Helvetica, Arial, sans-serif; font-size: 9px; fill: #000000; text-anchor: middle; font-style: italic; }
    ]]></style>
  </defs>

  <rect x="0" y="0" width="672" height="320" fill="#ffffff"/>

  <text x="336" y="18" class="lbl">Verification path (enumerable integer arithmetic)</text>

  <rect class="box" x="16" y="36" width="72" height="48"/>
  <text x="52" y="56" class="lbl">Key</text>
  <text x="52" y="70" class="lbl-sm">k = (k1..km)</text>

  <rect class="box" x="112" y="36" width="88" height="48"/>
  <text x="156" y="56" class="lbl">One-hot</text>
  <text x="156" y="70" class="lbl-sm">embed</text>

  <rect class="box" x="224" y="36" width="96" height="48"/>
  <text x="272" y="56" class="lbl">Affine</text>
  <text x="272" y="70" class="lbl-sm">W1 x + b1</text>

  <rect class="box-emph" x="344" y="36" width="72" height="48"/>
  <text x="380" y="56" class="lbl">ReLU</text>
  <text x="380" y="70" class="lbl-sm">max(0, .)</text>

  <rect class="box" x="440" y="36" width="96" height="48"/>
  <text x="488" y="56" class="lbl">Affine</text>
  <text x="488" y="70" class="lbl-sm">W2 h (+heads)</text>

  <rect class="box-emph" x="560" y="36" width="96" height="48"/>
  <text x="608" y="56" class="lbl">Strict</text>
  <text x="608" y="70" class="lbl-sm">argmax -&gt; yhat</text>

  <path class="arrow" d="M88,60 H112"/>
  <path class="arrow" d="M200,60 H224"/>
  <path class="arrow" d="M320,60 H344"/>
  <path class="arrow" d="M416,60 H440"/>
  <path class="arrow" d="M536,60 H560"/>

  <text x="52" y="104" class="sub">k in K = V1 x ... x Vm</text>
  <text x="608" y="104" class="sub">yhat in Y</text>

  <line x1="24" y1="118" x2="648" y2="118" stroke="#000000" stroke-width="0.75"
        stroke-dasharray="4 3"/>

  <text x="336" y="140" class="lbl">Deploy kernel (equivalent; no multiply / float / softmax)</text>

  <rect class="box" x="16" y="156" width="72" height="48"/>
  <text x="52" y="176" class="lbl">Key</text>
  <text x="52" y="190" class="lbl-sm">field values</text>

  <rect class="box" x="112" y="156" width="120" height="48"/>
  <text x="172" y="176" class="lbl">Bitmask match</text>
  <text x="172" y="190" class="lbl-sm">(mask&gt;&gt;v) and ... = h</text>

  <rect class="box" x="256" y="156" width="120" height="48"/>
  <text x="316" y="176" class="lbl">Integer add</text>
  <text x="316" y="190" class="lbl-sm">sum W2[u,:] for hu=1</text>

  <rect class="box-emph" x="400" y="156" width="100" height="48"/>
  <text x="450" y="176" class="lbl">Strict</text>
  <text x="450" y="190" class="lbl-sm">argmax</text>

  <rect class="box" x="524" y="156" width="132" height="48"/>
  <text x="590" y="176" class="lbl">Class name</text>
  <text x="590" y="190" class="lbl-sm">oracle.ask -&gt; Y</text>

  <path class="arrow" d="M88,180 H112"/>
  <path class="arrow" d="M232,180 H256"/>
  <path class="arrow" d="M376,180 H400"/>
  <path class="arrow" d="M500,180 H524"/>

  <text x="16" y="236" class="lbl-left">Notes:</text>
  <text x="16" y="252" class="lbl-left">1) Same topology for every stage; only (W1,b1,W2) change. Softmax is never used at inference.</text>
  <text x="16" y="268" class="lbl-left">2) Constructed weights: W1 in {0,1}, hidden activations in {0,1}, W2 positive integers; ties reject the build.</text>
  <text x="16" y="284" class="lbl-left">3) Claim: forall k in K, argmax(N(k))=G(k), by full key-space enumeration (not a held-out test split).</text>
  <text x="16" y="300" class="lbl-left">4) SGD control arm uses the same graph with floating gemv; shipping path is construction + integer kernel.</text>
</svg>
