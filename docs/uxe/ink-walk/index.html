<!DOCTYPE html>
<html lang="zh"><head>
<meta charset="utf-8"/><title>ink-walk-host1</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#d8c8a8;font:13px sans-serif}
#hud{position:fixed;left:10px;top:10px;z-index:2;background:rgba(255,255,255,.7);padding:6px 8px}
canvas{display:block;width:100%;height:100%}
</style></head>
<body>
<div id="hud">WASD · NPR rim · no three</div>
<canvas id="view"></canvas>
<script src="./host1-runtime.js"></script>
<script src="ink-b64.js"></script>
<script type="module">
import { createWebGLRenderer } from "./renderer-webgl.js";
import { Scene, PerspectiveCamera } from "./scene.js";
import { MESH_OCTA, MESH_BOX, MESH_PLANE } from "./meshes.js";
const AUTO=/(?:\?|&)auto=1(?:&|$)/.test(location.search);
const keys={};
window.addEventListener("keydown",e=>keys[e.code]=1);
window.addEventListener("keyup",e=>keys[e.code]=0);
const renderer=createWebGLRenderer(document.getElementById("view"));
const scene=new Scene();
scene.ink=1.0; scene.wave=0;
scene.clearColor=[0.85,0.78,0.66,1];
scene.fog={density:0.008,color:[0.82,0.76,0.64]};
scene.ambient={color:[0.7,0.65,0.55],intensity:0.7};
const ground=scene.instances("g",1,[0.62,0.55,0.42]);
ground.meshId=MESH_PLANE; ground.set(0,0,0,-40,80);
const trees=scene.instances("t",24,[0.22,0.32,0.18]);
trees.meshId=MESH_OCTA;
const bridge=scene.instances("b",6,[0.45,0.4,0.35]);
bridge.meshId=MESH_BOX;
let i, cam=0, ok=0;
for(i=0;i<24;i++) trees.set(i,(i%8)*6-20, 2.2, -((i/8)|0)*12-8, 2+(i%3));
for(i=0;i<6;i++) bridge.set(i, i*3-8, 0.6, -18, 1.2);
const camera=new PerspectiveCamera();
function tick(){
  if(!AUTO){
    if(keys.KeyD||keys.ArrowRight) cam+=0.25;
    if(keys.KeyA||keys.ArrowLeft) cam-=0.25;
  }
  camera.setEye(cam, 5, 12);
  camera.setTarget(cam, 1, -20);
  renderer.render(scene, camera);
  requestAnimationFrame(tick);
}
(async function(){
  try{
    const rt=await host1Boot(window.INK_WASM);
    const d=rt.readI64List(rt.mainHandle());
    ok=d.length>=12;
  }catch(e){ ok=0; document.title="INK_ERR"; document.getElementById("hud").textContent="INK_ERR "+String(e&&e.message||e); }
  if(document.title!=="INK_ERR") document.title=ok?"INK_OK":"INK_FAIL";
  if(AUTO && document.title!=="INK_ERR") document.getElementById("hud").textContent=(ok?"INK_OK":"INK_FAIL");
  renderer.resize(); tick();
})();
</script></body></html>
