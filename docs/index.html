<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>UXE · 游戏</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #06080e;
      --fg: #d5dbe8;
      --muted: #8b96aa;
      --acc: #7ec8ff;
      --line: rgba(130,150,190,.28);
      --card: rgba(14,18,30,.72);
      --pad: max(16px, env(safe-area-inset-left));
      --pad-r: max(16px, env(safe-area-inset-right));
      --pad-t: max(20px, env(safe-area-inset-top));
      --pad-b: max(20px, env(safe-area-inset-bottom));
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      color: var(--fg);
      font-family: "Segoe UI", ui-sans-serif, system-ui, sans-serif;
      background:
        radial-gradient(900px 480px at 12% -8%, #1a2a48 0%, transparent 55%),
        radial-gradient(700px 420px at 90% 10%, #2a1830 0%, transparent 50%),
        var(--bg);
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      padding:
        calc(var(--pad-t) + 28px)
        var(--pad-r)
        calc(var(--pad-b) + 16px)
        var(--pad);
    }
    main {
      width: 100%;
      max-width: 520px;
      margin: 0 auto;
      flex: 1;
      display: flex;
      flex-direction: column;
    }
    .brand {
      font-size: 12px; letter-spacing: .22em; text-transform: uppercase;
      color: var(--acc); margin: 0 0 8px;
    }
    h1 {
      font-size: clamp(26px, 7vw, 40px);
      margin: 0 0 8px; font-weight: 650; letter-spacing: .01em;
      line-height: 1.15;
    }
    .lead {
      color: var(--muted); line-height: 1.5;
      margin: 0 0 24px; font-size: 14px; max-width: 36rem;
    }
    .games { display: flex; flex-direction: column; gap: 12px; }
    a.game {
      display: flex; flex-direction: column; justify-content: space-between;
      min-height: 132px; text-decoration: none; color: inherit;
      border: 1px solid var(--line); border-radius: 14px;
      padding: 16px 16px 14px;
      background: var(--card);
      -webkit-tap-highlight-color: transparent;
      transition: border-color .15s ease, transform .15s ease;
    }
    a.game:hover { border-color: rgba(126,200,255,.55); transform: translateY(-2px); }
    a.game:active { transform: scale(0.99); }
    a.game .tag {
      font-size: 11px; letter-spacing: .14em; text-transform: uppercase;
      color: var(--muted); margin-bottom: 12px;
    }
    a.game strong {
      font-size: clamp(20px, 5.5vw, 22px);
      color: var(--acc); display: block; margin-bottom: 6px;
    }
    a.game p {
      margin: 0; color: var(--muted);
      font-size: 13px; line-height: 1.45;
    }
    a.game .go {
      margin-top: 14px; font-size: 14px; color: var(--fg);
      min-height: 28px; display: flex; align-items: center;
    }
    footer {
      margin-top: auto;
      padding-top: 36px;
      font-size: 11px;
      letter-spacing: .04em;
      color: var(--muted);
      text-align: center;
      line-height: 1.4;
    }
    @media (min-width: 600px) {
      body { padding: 56px 22px 40px; }
      .lead { margin-bottom: 32px; font-size: 15px; }
      a.game { min-height: 148px; padding: 18px 18px 16px; }
      a.game .go { margin-top: 18px; }
      footer { font-size: 12px; padding-top: 40px; }
    }
  </style>
</head>
<body>
  <main>
    <p class="brand">UXE</p>
    <h1>游戏索引</h1>
    <p class="lead">浏览器里直接玩，无需安装。</p>
    <div class="games">
      <a class="game" href="./uxe/asteroid/">
        <div>
          <div class="tag">Game 01</div>
          <strong>Asteroid</strong>
          <p>三维避障。WASD 或触屏拖动；撞毁后点按/空格重开。</p>
        </div>
        <div class="go">开始 →</div>
      </a>
      <a class="game" href="./uxe/drone/">
        <div>
          <div class="tag">Game 02</div>
          <strong>无人机驾舱</strong>
          <p>第一人称战场。默认纯键盘；可切键盘+鼠标。锁定后 2 发导弹，F 武装自爆。</p>
        </div>
        <div class="go">开始 →</div>
      </a>
    </div>
    <footer>PARTNERNET SOFTWARE (C) Since 2017</footer>
  </main>
</body>
</html>
