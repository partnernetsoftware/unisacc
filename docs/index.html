<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>UXE · 游戏</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #06080e;
      --fg: #d5dbe8;
      --muted: #8b96aa;
      --acc: #7ec8ff;
      --line: rgba(130,150,190,.28);
      --card: rgba(14,18,30,.72);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; color: var(--fg);
      font-family: "Segoe UI", ui-sans-serif, system-ui, sans-serif;
      background:
        radial-gradient(900px 480px at 12% -8%, #1a2a48 0%, transparent 55%),
        radial-gradient(700px 420px at 90% 10%, #2a1830 0%, transparent 50%),
        var(--bg);
      padding: 56px 22px 72px;
    }
    main { max-width: 520px; margin: 0 auto; }
    .brand {
      font-size: 13px; letter-spacing: .22em; text-transform: uppercase;
      color: var(--acc); margin: 0 0 10px;
    }
    h1 { font-size: clamp(28px, 5vw, 40px); margin: 0 0 10px; font-weight: 650; letter-spacing: .01em; }
    .lead { color: var(--muted); line-height: 1.55; margin: 0 0 32px; max-width: 36rem; }
    a.game {
      display: flex; flex-direction: column; justify-content: space-between;
      min-height: 168px; text-decoration: none; color: inherit;
      border: 1px solid var(--line); border-radius: 14px; padding: 18px 18px 16px;
      background: var(--card);
      transition: border-color .15s ease, transform .15s ease;
    }
    a.game:hover { border-color: rgba(126,200,255,.55); transform: translateY(-2px); }
    a.game .tag {
      font-size: 11px; letter-spacing: .14em; text-transform: uppercase;
      color: var(--muted); margin-bottom: 18px;
    }
    a.game strong { font-size: 22px; color: var(--acc); display: block; margin-bottom: 8px; }
    a.game p { margin: 0; color: var(--muted); font-size: 13px; line-height: 1.45; }
    a.game .go { margin-top: 18px; font-size: 13px; color: var(--fg); }
    .soon {
      margin-top: 14px; padding: 14px 16px; border-radius: 12px;
      border: 1px dashed var(--line); color: var(--muted); font-size: 13px; line-height: 1.45;
    }
    footer {
      margin-top: 40px; font-size: 12px; color: var(--muted); line-height: 1.5;
    }
    footer code { color: #b7c4d8; }
  </style>
</head>
<body>
  <main>
    <p class="brand">UXE</p>
    <h1>游戏索引</h1>
    <p class="lead">静态 ship 交付：页面 + wasm。在浏览器里直接玩，无需安装。</p>
    <a class="game" href="./uxe/asteroid/">
      <div>
        <div class="tag">Game 01</div>
        <strong>Asteroid</strong>
        <p>三维避障。WASD 移动，空格重开。</p>
      </div>
      <div class="go">开始 →</div>
    </a>
    <p class="soon">Game 02 重做中 — 大富翁已下架；下一款会用街机手感逼出 Host 缺口。</p>
    <footer>
      源：GitHub Pages · <code>docs/</code><br>
      Host API：仓库内 <code>ujs/web/engine/HOST_ABI.md</code><br>
      本地重建：<code>cd ujs && npm run ship:engine</code>
    </footer>
  </main>
</body>
</html>
