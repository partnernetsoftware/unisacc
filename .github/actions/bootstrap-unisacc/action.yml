name: bootstrap-unisacc
description: Put the pinned published unisacc.com (release/ci/bootstrap-compiler.tsv) at ./unisacc.com, sha256-checked.
runs:
  using: composite
  steps:
    - name: Download the pinned unisacc.com
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        set -eu
        row=$(grep -v '^#' release/ci/bootstrap-compiler.tsv | head -n 1)
        tag=${row%%	*}; want=${row#*	}
        if [ "$tag" = none ]; then
          echo "::error::no published unisacc.com can run this tree yet (release/ci/bootstrap-compiler.tsv is none); publish 0.0.43 and pin it"
          exit 1
        fi
        gh release download "$tag" -R "$GITHUB_REPOSITORY" -p unisacc.com -D . --clobber
        got=$(sha256sum unisacc.com | cut -d' ' -f1)
        if [ "$got" != "$want" ]; then echo "::error::unisacc.com sha256 $got, pinned $want"; exit 1; fi
        chmod +x unisacc.com
