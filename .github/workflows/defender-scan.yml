name: defender-scan
# windows-defender-final-bytes court (0.0.38): download the published unisacc.com unauthenticated,
# check it is the signed hash from the signing receipt, update Defender signatures and scan the
# file with MpCmdRun.  Read-only: never builds, never uploads to the release.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Published release tag, e.g. v0.0.38"
        required: true
        type: string
      sha256:
        description: "Signed unisacc.com sha256 from the signing receipt"
        required: true
        type: string
      release_id:
        description: "R3=A court before publishing: the DRAFT release id (empty = published asset)"
        required: false
        type: string
        default: ''
      asset_id:
        description: "Draft mode: the signed unisacc.com asset id"
        required: false
        type: string
        default: ''
      tag_commit:
        description: "Draft mode: the commit the draft targets (rc/TAG)"
        required: false
        type: string
        default: ''

# Default read. contents:write lives only on the minimal Draft-see job (preflight); matrix jobs
# consume the preflight artifact and never need to see drafts themselves. Workflow never uploads,
# deletes or publishes a release (机房主任 ruling / a44e4702 tighten).
permissions:
  contents: read

jobs:
  preflight:
    # Minimal Draft-see job: only this job elevates to contents:write so the token can SEE a draft
    # (GitHub shows drafts only to identities with push access). Fetches fixed ids + signed sha once,
    # uploads the bytes for the matrix; public mode is a no-op pass-through.
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        if: inputs.asset_id != ''
        with:
          ref: ${{ inputs.tag_commit }}
          persist-credentials: false
      - name: preflight draft fetch
        if: inputs.asset_id != ''
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p preflight
          python3 release/tools/draftfetch.py --repo "${{ github.repository }}" --release-id "${{ inputs.release_id }}" \
            --asset-id "${{ inputs.asset_id }}" --tag "${{ inputs.tag }}" --commit "${{ inputs.tag_commit }}" \
            --sha256 "${{ inputs.sha256 }}" --out preflight/unisacc.com
      - uses: actions/upload-artifact@v4
        if: inputs.asset_id != ''
        with:
          name: draft-unisacc-com
          path: preflight/unisacc.com
          retention-days: 1
  scan:
    needs: preflight
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        runner: [windows-latest, windows-11-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - name: draft inputs are all-or-none (R3=A)
        shell: pwsh
        env:
          RID: ${{ inputs.release_id }}
          AID: ${{ inputs.asset_id }}
          TC: ${{ inputs.tag_commit }}
        run: |
          $n = @($env:RID, $env:AID, $env:TC | Where-Object { $_ }).Count
          if ($n -ne 0 -and $n -ne 3) { throw "release_id, asset_id and tag_commit must be given together" }
          if ($n -eq 3 -and $env:TC -notmatch '^[0-9a-f]{40}$') { throw "tag_commit must be a full 40-hex sha" }
      - uses: actions/checkout@v4
        if: inputs.asset_id != ''
        with:
          ref: ${{ inputs.tag_commit }}
          persist-credentials: false
      - name: take the preflight-fixed DRAFT bytes (R3=A court before publishing)
        if: inputs.asset_id != ''
        uses: actions/download-artifact@v4
        with:
          name: draft-unisacc-com
          path: dl
      - name: download the public asset and check the signed hash
        if: inputs.asset_id == ''
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dl | Out-Null
          Invoke-WebRequest -Uri "https://github.com/${{ github.repository }}/releases/download/${{ inputs.tag }}/unisacc.com" -OutFile dl/unisacc.com
          $got = (Get-FileHash dl/unisacc.com -Algorithm SHA256).Hash.ToLower()
          "public sha256 $got"
          if ($got -ne "${{ inputs.sha256 }}") { throw "PUBLIC BYTES DIFFER from the signed hash" }
      - name: Defender scan of the final bytes
        shell: pwsh
        run: |
          $mp = Get-ChildItem "$env:ProgramData\Microsoft\Windows Defender\Platform" -Directory | Sort-Object Name -Descending | Select-Object -First 1
          $exe = if ($mp) { Join-Path $mp.FullName MpCmdRun.exe } else { "$env:ProgramFiles\Windows Defender\MpCmdRun.exe" }
          & $exe -SignatureUpdate
          "signature update rc $LASTEXITCODE"
          Get-MpComputerStatus | Select-Object AMProductVersion,AntivirusSignatureVersion,AntivirusSignatureLastUpdated,RealTimeProtectionEnabled | Format-List
          $file = (Resolve-Path dl/unisacc.com).Path
          & $exe -Scan -ScanType 3 -File $file -DisableRemediation
          $rc = $LASTEXITCODE
          "scan rc $rc (0 = no threat, 2 = threat found)"
          Get-MpThreatDetection | Format-List
          if ($rc -ne 0) { throw "Defender scan rc $rc" }
      - name: the scan ran on the fixed bytes (draft mode)
        if: inputs.asset_id != ''
        shell: pwsh
        run: |
          python release/tools/draftfetch.py --verify-again --repo x --release-id x --asset-id x --tag x --commit x --sha256 "${{ inputs.sha256 }}" --out dl/unisacc.com
          if ($LASTEXITCODE -ne 0) { throw "bytes changed during the scan" }
