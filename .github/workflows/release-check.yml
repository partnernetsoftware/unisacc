name: release-check

# The fast upstream of the release chain (minicon pattern): every push to main gets a
# bounded source sanity pass plus a run of the exact sealed candidate bytes on two OSes.
# It finishes in minutes; the full suite matrix (ci.yml) is a scheduled/manual safety net
# and is NOT a prerequisite for signing. Local gates remain the authority (AGENTS.md).
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: plan and partition self-checks
        run: |
          python3 tests/bound.py 10 python3 tests/ciplancheck.py
          python3 tests/bound.py 10 python3 tests/ci_shard_plan.py
          python3 tests/bound.py 10 python3 tests/opt_partition_check.py
      - name: construct weights and check every stage
        run: |
          python3 tests/bound.py 55 python3 -m unisa build-weights
          python3 tests/bound.py 55 python3 -m unisa acc
      - name: the emitted ELF actually runs
        run: |
          set -e
          for e in hello fact fib ptr struct 'do' switch indirect6; do
            python3 tests/bound.py 30 python3 -m unisa compile examples/$e.c -o /tmp/$e --target lnx/x86_64 --drive built
            chmod +x /tmp/$e
            got=$(python3 tests/bound.py 8 /tmp/$e); code=$?
            want=$(python3 tests/bound.py 15 python3 -m unisa run examples/$e.c --target lnx/x86_64 --drive built)
            echo "  $e -> '$got' (exit $code)"
            [ "$got" = "$want" ] || { echo "MISMATCH: want '$want'"; exit 1; }
          done
      - name: product source closure digest
        run: |
          python3 - <<'PY'
          import sys; sys.path.insert(0,'exec/c'); import provenance
          print('sources_sha256', provenance.source_digest())
          PY
      - name: expected outputs for the six-runner candidate smoke (Python reference on one machine)
        run: |
          python3 - <<'PY'
          import json,subprocess,re
          want={}
          for e in ('hello','fact','fib','ptr','struct','switch','do','indirect6','host'):
              want[e]=subprocess.run(['python3','tests/bound.py','40','python3','-m','unisa','run','examples/%s.c'%e,'--drive','built'],capture_output=True,text=True,check=True).stdout
          for e in ('calc','life','wordfreq','queens','bf','dijkstra','colorpack'):
              p=subprocess.run(['python3','tests/bound.py','40','python3','-m','unisa','run','examples/apps/%s.c'%e,'--drive','built'],capture_output=True,text=True)
              if p.returncode==0: want[e]=p.stdout
              else: print('no Python reference for',e,p.returncode,p.stderr[-200:])
          want['version']='unisacc '+re.findall(r'"([0-9.]+)"',open('src/version.h').read())[0]
          json.dump(want,open('expected.json','w'))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: expected-outputs
          path: expected.json

  candidate:
    # Runs the sealed candidate named by release/candidate.json on all six product
    # architectures GitHub hosts (the six-runner smoke, R12-0 ⓪a). Skipped when no
    # candidate is sealed. The expected outputs come from the Python reference computed
    # once in the source job, so no runner needs its own Python route.
    needs: source
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-latest,   target: lnx/x86_64 }
          - { runner: ubuntu-24.04-arm, target: lnx/arm64 }
          - { runner: macos-15,        target: osx/arm64 }
          - { runner: macos-15-intel,  target: osx/x86_64 }
          - { runner: windows-latest,  target: win/x86_64 }
          - { runner: windows-11-arm,  target: win/arm64 }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    steps:
      - name: bytes-true checkout (the closure digest hashes file bytes; Windows git would rewrite line endings)
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: read the sealed candidate reference
        id: seal
        run: |
          if [ ! -f release/candidate.json ]; then echo "present=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          ref=$(python -c 'import json;print(json.load(open("release/candidate.json"))["ref"])')
          sha=$(python -c 'import json;print(json.load(open("release/candidate.json"))["unisacc_com_sha256"])')
          src=$(python -c 'import json;print(json.load(open("release/candidate.json"))["sources_sha256"])')
          [[ "$ref" =~ ^ghcr\.io/[a-z0-9_.-]+/[a-z0-9_.-]+@sha256:[0-9a-f]{64}$ ]] || { echo "candidate ref must be an immutable digest reference: $ref" >&2; exit 1; }
          [[ "$sha" =~ ^[0-9a-f]{64}$ ]] && [[ "$src" =~ ^[0-9a-f]{64}$ ]]
          { echo "present=true"; echo "ref=$ref"; echo "sha=$sha"; echo "src=$src"; } >> "$GITHUB_OUTPUT"
      - name: the sealed source closure is this tree's closure
        id: closure
        if: steps.seal.outputs.present == 'true'
        run: |
          have=$(python - <<'PY'
          import sys; sys.path.insert(0,'exec/c'); import provenance
          print(provenance.source_digest())
          PY
          )
          if [ "$have" != "${{ steps.seal.outputs.src }}" ]; then
            echo "release/candidate.json names sources_sha256 $have != sealed ${{ steps.seal.outputs.src }}: reseal the candidate" >&2
            python - <<'PY' > closure-listing.txt
          import sys, pathlib, hashlib; sys.path.insert(0,'exec/pipeline'); import models
          ROOT=pathlib.Path('.').resolve()
          for d in ('exec','unisa','src','kernel','include','weights'):
              for p in sorted((ROOT/d).rglob('*'), key=lambda q: q.relative_to(ROOT).parts):
                  if p.relative_to(ROOT).parts[:2]==('exec','build'): continue
                  if p.is_file() and p.suffix in ('.py','.c','.h','.inc','.tsv','.json','.sh'): print(p.relative_to(ROOT).as_posix(), models.digest(p))
          PY
            # A ref that is a release must have matching bytes, so it stays a
            # hard failure.  An ordinary branch push is development, where the
            # tree running ahead of the sealed candidate is the normal state:
            # the 0.0.11 lesson was "reseal after every install", and failing
            # the six-runner job instead of saying so only teaches people to
            # ignore a red check.  So record the mismatch, skip the candidate
            # work through steps.closure.outputs.closure_mismatch (every
            # downstream step tests it), and let the source job stay the gate.
            #
            # Both spellings are here on purpose.  `github.ref_type` is the
            # documented value, and the refs/tags/ test is the same question
            # asked of the ref itself -- if a future edit adds tag triggering
            # (this workflow is push:branches[main] plus dispatch today, so the
            # tag arm is unreachable until one does), the release path must not
            # silently become a skip.
            case "${{ github.ref_type }} ${{ github.ref }}" in
              tag\ *|*\ refs/tags/*)
                echo "closure_mismatch=true" >> "$GITHUB_OUTPUT"
                echo "release ref: the tagged tree does not match the sealed candidate" >&2
                exit 1;;
            esac
            echo "closure_mismatch=true" >> "$GITHUB_OUTPUT"
            echo "::notice title=candidate skipped::the tree is ahead of the sealed candidate ($have != ${{ steps.seal.outputs.src }}); reseal before the next release (release/RELEASE-PIPELINE.md). The candidate bytes were NOT run."
          fi
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: closure-listing-${{ matrix.target == 'win/x86_64' && 'win-x86_64' || matrix.target == 'win/arm64' && 'win-arm64' || matrix.target == 'lnx/x86_64' && 'lnx-x86_64' || matrix.target == 'lnx/arm64' && 'lnx-arm64' || matrix.target == 'osx/arm64' && 'osx-arm64' || 'osx-x86_64' }}
          path: closure-listing.txt
          if-no-files-found: ignore
      - name: oras (official release binary for this runner; setup-oras has no windows/arm64 build)
        if: steps.seal.outputs.present == 'true' && steps.closure.outputs.closure_mismatch != 'true'
        run: |
          set -euo pipefail
          v=1.3.0
          case "$(uname -s)" in Linux) os=linux;; Darwin) os=darwin;; *) os=windows;; esac
          case "$(uname -m)" in aarch64|arm64|ARM64) arch=arm64;; *) arch=amd64;; esac
          [ "$os" = windows ] && arch=amd64      # the x64 build runs on Windows 11 arm through emulation
          mkdir -p "$HOME/oras-bin"; cd "$HOME/oras-bin"
          if [ "$os" = windows ]; then
            curl -fsSL --retry 4 --retry-all-errors --retry-delay 5 -o oras.zip "https://github.com/oras-project/oras/releases/download/v$v/oras_${v}_windows_${arch}.zip"
            python -c "import zipfile; zipfile.ZipFile('oras.zip').extractall('.')"
            cygpath -w "$HOME/oras-bin" >> "$GITHUB_PATH"
          else
            curl -fsSL --retry 4 --retry-all-errors --retry-delay 5 "https://github.com/oras-project/oras/releases/download/v$v/oras_${v}_${os}_${arch}.tar.gz" | tar xz
            echo "$HOME/oras-bin" >> "$GITHUB_PATH"
          fi
          ls -la
      - name: pull the exact candidate bytes by digest
        if: steps.seal.outputs.present == 'true' && steps.closure.outputs.closure_mismatch != 'true'
        env:
          GHCR_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          printf '%s' "$GHCR_TOKEN" | oras login ghcr.io -u "${{ github.actor }}" --password-stdin
          mkdir candidate && oras pull "${{ steps.seal.outputs.ref }}" --output candidate
          ls -la candidate
          got=$(python -c 'import hashlib,sys;print(hashlib.sha256(open("candidate/unisacc.com","rb").read()).hexdigest())')
          [ "$got" = "${{ steps.seal.outputs.sha }}" ] || { echo "candidate bytes differ: $got" >&2; exit 1; }
          chmod +x candidate/unisacc.com
      - uses: actions/download-artifact@v4
        if: steps.seal.outputs.present == 'true' && steps.closure.outputs.closure_mismatch != 'true'
        with:
          name: expected-outputs
      - name: the multi-architecture demo suite (${{ matrix.target }})
        if: steps.seal.outputs.present == 'true' && steps.closure.outputs.closure_mismatch != 'true'
        run: |
          python tests/comdemo.py --com candidate/unisacc.com --expected expected.json --label "${{ matrix.target }}" --out "demo-$(echo '${{ matrix.target }}' | tr / -).json"
      - uses: actions/upload-artifact@v4
        if: always() && steps.seal.outputs.present == 'true' && steps.closure.outputs.closure_mismatch != 'true'
        with:
          name: demo-${{ matrix.target == 'lnx/x86_64' && 'lnx-x86_64' || matrix.target == 'lnx/arm64' && 'lnx-arm64' || matrix.target == 'osx/arm64' && 'osx-arm64' || matrix.target == 'osx/x86_64' && 'osx-x86_64' || matrix.target == 'win/x86_64' && 'win-x86_64' || 'win-arm64' }}
          path: demo-*.json

  matrix:
    # The six records must agree byte for byte on every deterministic program and each
    # must have passed its own machine's structural checks. The merged matrix is the
    # per-push multi-architecture demo result (R12-3 ③ judges releases on it).
    needs: candidate
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: demo-*
          merge-multiple: true
          path: demos
      - name: merge and judge
        run: |
          ls demos || { echo "no demo records (no sealed candidate?)"; exit 0; }
          python3 tests/comdemo_matrix.py --out matrix.json demos/*.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: demo-matrix
          path: matrix.json

  winsuite-prepare:
    # 0.0.25 X7: the Windows probes that needed the UTM VM (winposix, crossnative examples,
    # forward/win.c) are built here and run on real Windows runners below.  The expected
    # outputs come from this macOS runner's cc, as the local suites took them from the Mac.
    runs-on: macos-14
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: reference compiler from this tree
        run: python3 tests/bound.py 58 ./tests/build_ref.sh "$RUNNER_TEMP/ua.c" "$RUNNER_TEMP/ua"
      - name: build the Windows probes and expected outputs
        run: python3 tests/winsuite.py prepare winsuite "$RUNNER_TEMP/ua"
      - uses: actions/upload-artifact@v4
        with:
          name: winsuite
          path: winsuite

  winsuite:
    needs: winsuite-prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: windows-latest, target: win/x86_64 }
          - { runner: windows-11-arm, target: win/arm64 }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: winsuite
          path: winsuite
      - name: run the probes on this Windows machine (${{ matrix.runner }})
        run: python tests/winsuite.py run winsuite ${{ matrix.target }}
