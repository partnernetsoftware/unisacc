# 0.0.22 P1-B ⑥ (after minicon's release-smoke-test.yml): download the PUBLISHED unisacc.com --
# the bytes a user gets, not the candidate or a rebuild -- check its sha256 against the signed
# hash, and run the demo suite on each of the six native runners.  Read-only; never compiles
# the compiler, never touches signing or candidate state.
name: release-smoke

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Published release tag, e.g. v0.0.22"
        required: true
        type: string
      sha256:
        description: "Signed unisacc.com sha256 from the signing receipt"
        required: true
        type: string
      release_id:
        description: "R3=A court before publishing: the DRAFT release id (empty = published asset, user smoke)"
        required: false
        type: string
        default: ''
      asset_id:
        description: "Draft mode: the signed unisacc.com asset id"
        required: false
        type: string
        default: ''
      tag_commit:
        description: "Draft mode: the commit the draft targets (rc/TAG)"
        required: false
        type: string
        default: ''

permissions:
  contents: read

jobs:
  smoke:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: macos-15,         target: osx/arm64 }
          - { runner: macos-15-intel,   target: osx/x86_64 }
          - { runner: ubuntu-latest,    target: lnx/x86_64 }
          - { runner: ubuntu-24.04-arm, target: lnx/arm64 }
          - { runner: windows-latest,   target: win/x86_64 }
          - { runner: windows-11-arm,   target: win/arm64 }
    name: smoke ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 8
    defaults:
      run:
        shell: bash
    steps:
      - name: draft inputs are all-or-none (R3=A)
        env:
          RID: ${{ inputs.release_id }}
          AID: ${{ inputs.asset_id }}
          TC: ${{ inputs.tag_commit }}
        run: |
          n=0; for v in "$RID" "$AID" "$TC"; do [ -n "$v" ] && n=$((n+1)); done
          [ $n -eq 0 ] || [ $n -eq 3 ] || { echo "release_id, asset_id and tag_commit must be given together"; exit 1; }
          [ $n -eq 0 ] || [[ "$TC" =~ ^[0-9a-f]{40}$ ]] || { echo "tag_commit must be a full 40-hex sha"; exit 1; }
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.asset_id != '' && inputs.tag_commit || inputs.tag }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: fetch the DRAFT asset by fixed ids (R3=A court before publishing)
        if: inputs.asset_id != ''
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p dl
          python release/tools/draftfetch.py --repo "${{ github.repository }}" --release-id "${{ inputs.release_id }}" \
            --asset-id "${{ inputs.asset_id }}" --tag "${{ inputs.tag }}" --commit "${{ inputs.tag_commit }}" \
            --sha256 "${{ inputs.sha256 }}" --out dl/unisacc.com
          chmod +x dl/unisacc.com
      - name: download the public asset (unauthenticated, as a user would)
        if: inputs.asset_id == ''
        run: |
          set -euo pipefail
          mkdir -p dl
          curl -fsSL --retry 4 --retry-all-errors --retry-delay 5 -o dl/unisacc.com \
            "https://github.com/${{ github.repository }}/releases/download/${{ inputs.tag }}/unisacc.com"
          got=$(python -c "import hashlib,sys;print(hashlib.sha256(open('dl/unisacc.com','rb').read()).hexdigest())")
          echo "public sha256 $got"
          [ "$got" = "${{ inputs.sha256 }}" ] || { echo "PUBLIC BYTES DIFFER from the signed hash"; exit 1; }
          chmod +x dl/unisacc.com
      - name: demo suite on the fetched bytes (${{ matrix.target }})
        run: |
          python tests/comdemo.py --com dl/unisacc.com --label "${{ matrix.target }}" --out "smoke-$(echo '${{ matrix.target }}' | tr / -).json"
      - name: the court ran on the fixed bytes (draft mode)
        if: inputs.asset_id != ''
        run: |
          python release/tools/draftfetch.py --verify-again --repo x --release-id x --asset-id x --tag x --commit x \
            --sha256 "${{ inputs.sha256 }}" --out dl/unisacc.com
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-${{ matrix.target == 'lnx/x86_64' && 'lnx-x86_64' || matrix.target == 'lnx/arm64' && 'lnx-arm64' || matrix.target == 'osx/arm64' && 'osx-arm64' || matrix.target == 'osx/x86_64' && 'osx-x86_64' || matrix.target == 'win/x86_64' && 'win-x86_64' || 'win-arm64' }}
          path: smoke-*.json
