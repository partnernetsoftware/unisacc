name: win-pkg-ab
# WIN-PKG-AB: is the win/x86_64 "bad kernel header" a container-discovery fault or a resource-read
# (file-mode / offset) fault?  One windows-2025 job, the published c45-2a candidate, three variants on
# the same host, each compiling AND running a hello:
#
#   A  UNISA_CONTAINER=/nonexistent.bin   (probe: does a setenv'd variable reach getenv at all?)
#   B  nothing set, UNISACC_RR_TIME=1     (the real measurement: the candidate finds its own package)
#   C  UNISA_CONTAINER=<real pkg.bin>     (only meaningful if A shows getenv works)
#
# Why A is a probe: the win slice's getenv reads the POSIX block after argv
# (include/stdlib.h:934-941) and never calls GetEnvironmentStringsA, so an environment variable may
# simply not be visible on windows.  If A's error changes from 'bad kernel header' to a package error
# the variable DID reach the program; if the error stays the same, the environment is unreadable and
# variants A/C prove nothing about the package path.
#
# Reading the table (opus, 2026-11-06):
#   A ok,  B fails  -> the package content is fine; the APE cannot find/unpack its own trailer
#                      (A-class gap in L0 _os self-path and the footer scan)
#   A fails, C ok   -> resources other than the kernel are read wrong too: package read or file mode
#                      (O_BINARY / CRLF / 0x1a truncation)
#   A fails, C fails-> even a plain cx_read of a named file is corrupted: file mode
#   A and B both ok -> not reproducible here; compare the CI environment next
#
# Every variant prints rc, stdout length and stderr, so a wrong verdict is visible as text.
on:
  push:
    branches:
      - 'ci/win-pkg-ab'
  workflow_dispatch:
# A draft release is only visible to GITHUB_TOKEN with contents: write (candidate-native.yml's
# fetch job relies on the same rule); read is not enough and gh says "release not found".
permissions:
  contents: write

env:
  CANDIDATE_TAG: v0.0.45-c45-2b-candidate
  # empty = print the sha and do not gate on it (the 2b APE is built off-tree by the release driver)
  CANDIDATE_SHA: ''
  PKG_SHA16: c63981824e28220e

jobs:
  win-pkg-ab:
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Fetch the candidate and its package
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Continue'
          New-Item -ItemType Directory -Force -Path diag | Out-Null
          $repo = $env:GITHUB_REPOSITORY
          Write-Output ("REPO {0} TAG {1}" -f $repo, $env:CANDIDATE_TAG)
          gh release download $env:CANDIDATE_TAG --repo $repo --pattern 'unisacc.com' --dir diag --clobber
          gh release download $env:CANDIDATE_TAG --repo $repo --pattern 'pkg.bin' --dir diag --clobber
          Get-ChildItem diag | ForEach-Object { Write-Output ("ASSET {0} {1}" -f $_.Name, $_.Length) }
          if (!(Test-Path 'diag/unisacc.com')) { Write-Output 'FATAL: no candidate APE'; exit 1 }
          $sha = (Get-FileHash -LiteralPath 'diag/unisacc.com' -Algorithm SHA256).Hash.ToLowerInvariant()
          Write-Output ("APE sha256={0} expected={1}" -f $sha, $env:CANDIDATE_SHA)
          if ($env:CANDIDATE_SHA -and $sha -ne $env:CANDIDATE_SHA) { Write-Output 'APE IDENTITY MISMATCH'; exit 1 }
          if (Test-Path 'diag/pkg.bin') {
            $psha = (Get-FileHash -LiteralPath 'diag/pkg.bin' -Algorithm SHA256).Hash.ToLowerInvariant()
            Write-Output ("PKG sha256={0} size={1}" -f $psha, (Get-Item 'diag/pkg.bin').Length)
            if ($psha.Substring(0, 16) -ne $env:PKG_SHA16) { Write-Output 'PKG IDENTITY MISMATCH'; exit 1 }
          } else { Write-Output 'PKG MISSING from the release; variant A will be NOT_RUN' }

      - name: Extract the kernel/x86_64 resource from the package
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          # The P3 container is a text header plus payload; the kernel resource starts with UNIKERN1 and
          # carries the x86_64 ISA number (2) in its second 8-byte field.  Search, verify, cut.
          if (!(Test-Path 'diag/pkg.bin')) { Write-Output 'KERNEL NOT_RUN (no pkg.bin)'; exit 0 }
          $b = [IO.File]::ReadAllBytes('diag/pkg.bin')
          $magic = [byte[]](0x55,0x4e,0x49,0x4b,0x45,0x52,0x4e,0x31)   # UNIKERN1
          $found = 0
          for ($i = 0; $i -le $b.Length - 48; $i++) {
            if ($b[$i] -ne $magic[0]) { continue }
            $ok = $true
            for ($k = 0; $k -lt 8; $k++) { if ($b[$i + $k] -ne $magic[$k]) { $ok = $false; break } }
            if (!$ok) { continue }
            $isa = [BitConverter]::ToInt64($b, $i + 8)
            $len = [BitConverter]::ToInt64($b, $i + 32)
            Write-Output ("KERNEL at {0} isa={1} length={2}" -f $i, $isa, $len)
            if ($isa -eq 2 -and $len -gt 0 -and ($i + 40 + $len) -le $b.Length) {
              $slice = New-Object byte[] (40 + $len)
              [Array]::Copy($b, $i, $slice, 0, 40 + [int]$len)
              [IO.File]::WriteAllBytes('diag/kernel-x86_64.bin', $slice)
              $found = 1
              break
            }
          }
          if ($found) {
            $k = 'diag/kernel-x86_64.bin'
            $ksha = (Get-FileHash -LiteralPath $k -Algorithm SHA256).Hash.ToLowerInvariant()
            Write-Output ("KERNEL bytes={0} sha256={1} head={2}" -f (Get-Item $k).Length, $ksha,
              (((Get-Content -LiteralPath $k -AsByteStream -TotalCount 16) | ForEach-Object { $_.ToString('x2') }) -join ''))
          } else { Write-Output 'KERNEL x86_64 slice NOT FOUND (the .data dump above still tells read corruption)' }

      - name: Run the three variants
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $com = Join-Path $PWD 'diag/unisacc.com'
          $log = Join-Path $PWD 'diag/win-pkg-ab.txt'
          # Write-Host, not Write-Output: Write-Output inside a function becomes part of its RETURN value,
          # which turned the exit codes into System.Object[] in the first run.
          function Say([string]$s) { Write-Host $s; [IO.File]::AppendAllText($log, "$s`n") }
          function Run([string]$file, [string[]]$a, [string]$label, [hashtable]$env) {
            $info = [Diagnostics.ProcessStartInfo]::new()
            $info.FileName = $file; $info.UseShellExecute = $false
            $info.RedirectStandardOutput = $true; $info.RedirectStandardError = $true
            if ($env) { foreach ($k in $env.Keys) { $info.Environment[$k] = [string]$env[$k] } }
            foreach ($x in $a) { $info.ArgumentList.Add($x) }
            $p = [Diagnostics.Process]::new(); $p.StartInfo = $info
            try {
              [void]$p.Start()
              $o = $p.StandardOutput.ReadToEndAsync(); $e = $p.StandardError.ReadToEndAsync()
              if (!$p.WaitForExit(180000)) { $p.Kill($true); Say "$label TIMEOUT"; return $null }
              $so = $o.Result; $se = $e.Result
              Say ("{0} exit={1} stdout_len={2}" -f $label, $p.ExitCode, $so.Length)
              if ($so.Length) { Say ("{0} stdout={1}" -f $label, (($so -replace '[\r\n]+', ' ').Substring(0, [Math]::Min(200, $so.Length)))) }
              Say ("{0} stderr={1}" -f $label, (($se -replace '[\r\n]+', ' ').Substring(0, [Math]::Min(300, $se.Length))))
              return $p.ExitCode
            } catch { Say "$label START FAILED: $_"; return $null } finally { $p.Dispose() }
          }
          [IO.File]::WriteAllText((Join-Path $PWD 'diag/hello.c'), "int main(void){return 40;}`n")
          $hello = Join-Path $PWD 'diag/hello.c'
          $pkg = Join-Path $PWD 'diag/pkg.bin'

          Say '== variant table'
          Say ("{0} | {1} | {2} | {3}" -f 'variant', 'env', 'compile', 'run')

          $rows = @()
          $nonexistent = Join-Path $PWD 'diag/nonexistent.bin'
          $variants = @(
            @{ v = 'A'; out = 'diag/a.exe'; envh = @{ UNISA_CONTAINER = $nonexistent }; desc = 'UNISA_CONTAINER=/nonexistent.bin (probe)' },
            @{ v = 'B'; out = 'diag/b.exe'; envh = @{ UNISACC_RR_TIME = '1' }; desc = 'nothing set + UNISACC_RR_TIME=1' },
            @{ v = 'C'; out = 'diag/c.exe'; envh = $(if (Test-Path $pkg) { @{ UNISA_CONTAINER = $pkg } } else { $null }); desc = 'UNISA_CONTAINER=<real pkg.bin>' }
          )
          foreach ($x in $variants) {
            $v = $x.v
            if ($v -eq 'C' -and !(Test-Path $pkg)) { $rows += ("{0} | {1} | NOT_RUN(no pkg) | -" -f $v, $x.desc); continue }
            $out = Join-Path $PWD $x.out
            Say ("-- variant {0}: {1}" -f $v, $x.desc)
            $crc = Run $com @('-b','win/x86_64','-o',$out,$hello) ("{0} compile" -f $v) $x.envh
            $runrc = '-'
            if (Test-Path $out) {
              $img = [IO.File]::ReadAllBytes($out)
              Say ("{0} image bytes={1} head={2}" -f $v, $img.Length, (($img[0..([Math]::Min(15, $img.Length - 1))] | ForEach-Object { $_.ToString('x2') }) -join ''))
              $r = Run $out @() ("{0} run" -f $v) $null
              if ($null -ne $r) { $runrc = $r }
            } else { Say ("{0} image NOT PRODUCED" -f $v) }
            $rows += ("{0} | {1} | rc={2} | rc={3}" -f $v, $x.desc, $crc, $runrc)
          }
          Say '== summary'
          foreach ($r in $rows) { Say $r }
          Say 'A error changes (package, not kernel) -> getenv works; A unchanged -> getenv unreadable on win, C proves nothing'
          Say 'B ok -> package discovery works on win; B "bad kernel header" -> the container read is the fault'
          Say 'keep the kernel resource dump above: its head bytes show whether the read was corrupted'

  # Env channel probes (c45-2b added GetEnvironmentStringsA to the win slice): (a) do we get a TEMP
  # path back at all, (b) does UNISA_CONTAINER now steer the container the program reads.  Both compile
  # and run from the candidate's own win slice, so a crash here is inside the win runtime, not the host.
  win-env:
    runs-on: windows-2025
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Fetch the candidate and its package
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Continue'
          New-Item -ItemType Directory -Force -Path diag | Out-Null
          gh release download $env:CANDIDATE_TAG --repo $env:GITHUB_REPOSITORY --pattern 'unisacc.com' --dir diag --clobber
          gh release download $env:CANDIDATE_TAG --repo $env:GITHUB_REPOSITORY --pattern 'pkg.bin' --dir diag --clobber
          Get-ChildItem diag | ForEach-Object { Write-Output ("ASSET {0} {1}" -f $_.Name, $_.Length) }
      - name: Probe getenv and UNISA_CONTAINER
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $com = Join-Path $PWD 'diag/unisacc.com'
          function Say([string]$s) { Write-Host $s }
          function Run([string]$file, [string[]]$a, [string]$label, [hashtable]$env) {
            $info = [Diagnostics.ProcessStartInfo]::new()
            $info.FileName = $file; $info.UseShellExecute = $false
            $info.RedirectStandardOutput = $true; $info.RedirectStandardError = $true
            if ($env) { foreach ($k in $env.Keys) { $info.Environment[$k] = [string]$env[$k] } }
            foreach ($x in $a) { $info.ArgumentList.Add($x) }
            $p = [Diagnostics.Process]::new(); $p.StartInfo = $info
            try {
              [void]$p.Start()
              $o = $p.StandardOutput.ReadToEndAsync(); $e = $p.StandardError.ReadToEndAsync()
              if (!$p.WaitForExit(180000)) { $p.Kill($true); Say "$label TIMEOUT"; return }
              Say ("{0} exit={1}" -f $label, $p.ExitCode)
              Say ("{0} stdout={1}" -f $label, (($o.Result -replace '[\r\n]+',' ')))
              Say ("{0} stderr={1}" -f $label, (($e.Result -replace '[\r\n]+',' ').Substring(0,[Math]::Min(240,$e.Result.Length))))
            } catch { Say "$label START FAILED: $_" } finally { $p.Dispose() }
          }
          # (a) TEMP through the new environment channel
          [IO.File]::WriteAllText((Join-Path $PWD 'diag/envprobe.c'),
            "#include <stdlib.h>`n#include <stdio.h>`nint main(void){const char *t = getenv(`"TEMP`"); printf(`"%s\n`", t ? t : `"(none)`"); return 0;}`n")
          $ep = Join-Path $PWD 'diag/envprobe.exe'
          Run $com @('-o',$ep,(Join-Path $PWD 'diag/envprobe.c')) 'envprobe compile' $null
          if (Test-Path $ep) { Run $ep @() 'envprobe run' $null } else { Say 'envprobe NOT PRODUCED' }
          # (b) hello with UNISA_CONTAINER pointed at a real package (now that the env channel works)
          [IO.File]::WriteAllText((Join-Path $PWD 'diag/hello.c'), "int main(void){return 40;}`n")
          $pkg = Join-Path $PWD 'diag/pkg.bin'
          $out = Join-Path $PWD 'diag/hello-container.exe'
          if (Test-Path $pkg) {
            Run $com @('-b','win/x86_64','-o',$out,(Join-Path $PWD 'diag/hello.c')) 'B hello+UNISA_CONTAINER' @{ UNISA_CONTAINER = $pkg }
            if (Test-Path $out) { Run $out @() 'B run' $null } else { Say 'B image NOT PRODUCED' }
          } else { Say 'B NOT_RUN (no pkg.bin asset)' }


  # W45-WIN-FFI (diagnostic branch only): compile and run the two FFI probes with the candidate's own
  # win slice, then compare stdout with the .expect file.  The four files travel with this branch
  # because the CI test commit predates them.
  win-ffi:
    runs-on: windows-2025
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Fetch the candidate
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Continue'
          New-Item -ItemType Directory -Force -Path diag | Out-Null
          gh release download $env:CANDIDATE_TAG --repo $env:GITHUB_REPOSITORY --pattern 'unisacc.com' --dir diag --clobber
          if (!(Test-Path 'diag/unisacc.com')) { Write-Output 'FATAL: no candidate'; exit 1 }
      - name: Run the FFI probes
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $com = Join-Path $PWD 'diag/unisacc.com'
          function Say([string]$s) { Write-Host $s }
          function Run([string]$file, [string[]]$a, [string]$label) {
            $info = [Diagnostics.ProcessStartInfo]::new()
            $info.FileName = $file; $info.UseShellExecute = $false
            $info.RedirectStandardOutput = $true; $info.RedirectStandardError = $true
            foreach ($x in $a) { $info.ArgumentList.Add($x) }
            $p = [Diagnostics.Process]::new(); $p.StartInfo = $info
            try {
              [void]$p.Start()
              $o = $p.StandardOutput.ReadToEndAsync(); $e = $p.StandardError.ReadToEndAsync()
              if (!$p.WaitForExit(120000)) { $p.Kill($true); Say "$label TIMEOUT"; return $null }
              Say ("{0} exit={1} stdout={2} stderr={3}" -f $label, $p.ExitCode,
                (($o.Result -replace '[\r\n]+', ' ')), (($e.Result -replace '[\r\n]+', ' ').Substring(0, [Math]::Min(200, $e.Result.Length))))
              return @{ rc = $p.ExitCode; out = $o.Result }
            } catch { Say "$label START FAILED: $_"; return $null } finally { $p.Dispose() }
          }
          foreach ($p in @('strdup','pread')) {
            $src = Join-Path $PWD ("win-ffi/win-ffi-{0}.c" -f $p)
            $out = Join-Path $PWD ("diag/win-ffi-{0}.exe" -f $p)
            if (!(Test-Path $src)) { Say "win-ffi-$p NOT_RUN (source missing)"; continue }
            $c = Run $com @('-o', $out, $src) "win-ffi-$p compile"
            if (!(Test-Path $out)) { Say "win-ffi-$p NOT_RUN (no image)"; continue }
            Push-Location (Join-Path $PWD 'win-ffi')
            $r = Run $out @() "win-ffi-$p run"
            Pop-Location
            $want = [IO.File]::ReadAllText((Join-Path $PWD ("win-ffi/win-ffi-{0}.expect" -f $p))).Replace("`r`n","`n")
            $got = if ($r) { $r.out.Replace("`r`n","`n") } else { '' }
            Say ("win-ffi-{0} match={1} want={2} got={3}" -f $p, ($got -ceq $want), ($want -replace '[\r\n]+',' '), ($got -replace '[\r\n]+',' '))
          }


  # WIN-PKG-LADDER: the crash happens only when a REAL package is opened (A with /nonexistent.bin is a
  # clean rc=1; B and C with the real pkg.bin are 0xC0000005).  Four container inputs on the same host
  # separate the file channel from the decoder:
  #   missing  -> /nonexistent.bin          expect rc=1 with a package error
  #   empty    -> zero-byte file            expect rc=1
  #   short    -> first 1024 bytes of pkg   expect rc=1
  #   full     -> the real pkg.bin          expect rc=1 or a crash; a crash ONLY here means the decoder
  win-pkg-ladder:
    runs-on: windows-2025
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Fetch the candidate and its package
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Continue'
          New-Item -ItemType Directory -Force -Path diag | Out-Null
          gh release download $env:CANDIDATE_TAG --repo $env:GITHUB_REPOSITORY --pattern 'unisacc.com' --dir diag --clobber
          gh release download $env:CANDIDATE_TAG --repo $env:GITHUB_REPOSITORY --pattern 'pkg.bin' --dir diag --clobber
          if (!(Test-Path 'diag/pkg.bin')) { Write-Output 'FATAL: no pkg.bin asset'; exit 1 }
          $b = [IO.File]::ReadAllBytes('diag/pkg.bin')
          Write-Output ("PKG bytes={0} head={1} tail={2}" -f $b.Length,
            (($b[0..15] | ForEach-Object { $_.ToString('x2') }) -join ''),
            (($b[($b.Length-16)..($b.Length-1)] | ForEach-Object { $_.ToString('x2') }) -join ''))
          [IO.File]::WriteAllBytes('diag/pkg-empty.bin', (New-Object byte[] 0))
          $s3 = New-Object byte[] ([Math]::Min(4096, $b.Length)); [Array]::Copy($b, $s3, $s3.Length)
          [IO.File]::WriteAllBytes('diag/pkg-4096.bin', $s3)
          $n4 = $b.Length - 16; $s4 = New-Object byte[] $n4; [Array]::Copy($b, $s4, $n4)
          [IO.File]::WriteAllBytes('diag/pkg-nofooter.bin', $s4)
          foreach ($kb in @(64, 256, 1024)) {
            $n = [Math]::Min($kb * 1024, $b.Length)
            $sz = New-Object byte[] $n; [Array]::Copy($b, $sz, $n)
            [IO.File]::WriteAllBytes(("diag/pkg-{0}k.bin" -f $kb), $sz)
          }
          New-Item -ItemType Directory -Force -Path 'C:\p' | Out-Null
          Copy-Item 'diag/pkg.bin' 'C:\p\pkg.bin' -Force
          Write-Output ("LADDER sizes: empty=0 first4096={0} nofooter={1} full={2}" -f $s3.Length, $n4, $b.Length)
      - name: 'Control: can this runner start a native exe at all'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $info = [Diagnostics.ProcessStartInfo]::new()
          $info.FileName = (Join-Path $env:SystemRoot 'System32/cmd.exe')
          $info.Arguments = '/c exit 0'; $info.UseShellExecute = $false
          $info.RedirectStandardOutput = $true; $info.RedirectStandardError = $true
          $p = [Diagnostics.Process]::new(); $p.StartInfo = $info
          try { [void]$p.Start(); [void]$p.WaitForExit(30000); Write-Host ("CONTROL cmd.exe exit={0}" -f $p.ExitCode) }
          catch { Write-Host "CONTROL START FAILED: $_" } finally { $p.Dispose() }
      - name: Run the nine container inputs
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $com = Join-Path $PWD 'diag/unisacc.com'
          function Say([string]$s) { Write-Host $s }
          function Run([string]$file, [string[]]$a, [string]$label, [hashtable]$env) {
            $info = [Diagnostics.ProcessStartInfo]::new()
            $info.FileName = $file; $info.UseShellExecute = $false
            $info.RedirectStandardOutput = $true; $info.RedirectStandardError = $true
            if ($env) { foreach ($k in $env.Keys) { $info.Environment[$k] = [string]$env[$k] } }
            foreach ($x in $a) { $info.ArgumentList.Add($x) }
            $p = [Diagnostics.Process]::new(); $p.StartInfo = $info
            try {
              [void]$p.Start()
              $o = $p.StandardOutput.ReadToEndAsync(); $e = $p.StandardError.ReadToEndAsync()
              if (!$p.WaitForExit(180000)) { $p.Kill($true); Say "$label TIMEOUT"; return }
              Say ("{0} exit={1} stderr={2}" -f $label, $p.ExitCode, (($e.Result -replace '[\r\n]+',' ').Substring(0,[Math]::Min(200,$e.Result.Length))))
            } catch { Say "$label START FAILED: $_" } finally { $p.Dispose() }
          }
          [IO.File]::WriteAllText((Join-Path $PWD 'diag/hello.c'), "int main(void){return 40;}`n")
          $hello = Join-Path $PWD 'diag/hello.c'
          foreach ($case in @(
            @{ n='1-missing';   p=(Join-Path $PWD 'diag/nonexistent.bin') },
            @{ n='2-empty';     p=(Join-Path $PWD 'diag/pkg-empty.bin') },
            @{ n='3-4096';      p=(Join-Path $PWD 'diag/pkg-4096.bin') },
            @{ n='4-nofooter';  p=(Join-Path $PWD 'diag/pkg-nofooter.bin') },
            @{ n='5-full';      p=(Join-Path $PWD 'diag/pkg.bin') },
            @{ n='6-shortpath'; p='C:\p\pkg.bin' },
            @{ n='7-64k';       p=(Join-Path $PWD 'diag/pkg-64k.bin') },
            @{ n='8-256k';      p=(Join-Path $PWD 'diag/pkg-256k.bin') },
            @{ n='9-1m';        p=(Join-Path $PWD 'diag/pkg-1024k.bin') })) {
            Run $com @('-b','win/x86_64','-o',(Join-Path $PWD ("diag/{0}.exe" -f $case.n)),$hello) ("ladder-{0}" -f $case.n) @{ UNISA_CONTAINER = $case.p }
          }
          Say 'all rc=1 -> decoder survives; crash from 3 on -> header parse; only 5 -> decoding content; only above a size -> growth/offset'

  # G5b: the sixth slice (win/arm64) tested natively for the first time.  The APE's outer PE is x86_64,
  # so this is the only way to run the arm64 slice on an ARM runner without emulation.  A --version
  # alone is a milestone: it proves the slice boots, maps its kernel and prints through its own stdio.
  win-arm64-slice:
    runs-on: windows-11-arm
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Fetch the win/arm64 slice
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Continue'
          New-Item -ItemType Directory -Force -Path diag | Out-Null
          gh release download $env:CANDIDATE_TAG --repo $env:GITHUB_REPOSITORY --pattern 'slice-win-arm64' --dir diag --clobber
          if (!(Test-Path 'diag/slice-win-arm64')) { Write-Output 'FATAL: slice asset missing'; exit 1 }
          $b = [IO.File]::ReadAllBytes('diag/slice-win-arm64')
          Write-Output ("SLICE bytes={0} sha256={1}" -f $b.Length, (Get-FileHash 'diag/slice-win-arm64' -Algorithm SHA256).Hash.ToLowerInvariant())
          $pe = [BitConverter]::ToUInt32($b, 60)
          Write-Output ("SLICE machine=0x{0:x4} (0xAA64 = Aarch64) subsystem={1}" -f [BitConverter]::ToUInt16($b, $pe + 4), [BitConverter]::ToUInt16($b, $pe + 24 + 68))
          Write-Output ("HOST arch={0} PROCESSOR_ARCHITECTURE={1}" -f $env:PROCESSOR_ARCHITECTURE, $env:PROCESSOR_ARCHITEW6432)
      - name: Run the slice natively
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $exe = Join-Path $PWD 'diag/slice-win-arm64.exe'
          Copy-Item 'diag/slice-win-arm64' $exe -Force
          function Run([string]$file, [string[]]$a, [string]$label) {
            $info = [Diagnostics.ProcessStartInfo]::new()
            $info.FileName = $file; $info.UseShellExecute = $false
            $info.RedirectStandardOutput = $true; $info.RedirectStandardError = $true
            foreach ($x in $a) { $info.ArgumentList.Add($x) }
            $p = [Diagnostics.Process]::new(); $p.StartInfo = $info
            try {
              [void]$p.Start()
              $o = $p.StandardOutput.ReadToEndAsync(); $e = $p.StandardError.ReadToEndAsync()
              if (!$p.WaitForExit(120000)) { $p.Kill($true); Write-Host "$label TIMEOUT"; return }
              $so = $o.Result; $se = $e.Result
              Write-Host ("{0} exit={1} stdout_len={2}" -f $label, $p.ExitCode, $so.Length)
              Write-Host ("{0} stdout={1}" -f $label, (($so -replace '[\r\n]+', ' ').Substring(0, [Math]::Min(200, $so.Length))))
              Write-Host ("{0} stderr={1}" -f $label, (($se -replace '[\r\n]+', ' ').Substring(0, [Math]::Min(300, $se.Length))))
            } catch { Write-Host "$label START FAILED: $_" } finally { $p.Dispose() }
          }
          # Before blaming the slice, prove this runner starts a native ARM64 exe at all, and compare the
          # two PE headers field by field against one that is known to start.
          function PeFields([string]$path, [string]$label) {
            $b = [IO.File]::ReadAllBytes($path)
            $pe = [BitConverter]::ToUInt32($b, 60); $o = $pe + 24
            $nsec = [BitConverter]::ToUInt16($b, $pe + 6)
            $chs  = [BitConverter]::ToUInt16($b, $pe + 22)
            $dllc = [BitConverter]::ToUInt16($b, $o + 70)
            $sub  = [BitConverter]::ToUInt16($b, $o + 68)
            $sal  = [BitConverter]::ToUInt32($b, $o + 32)
            $fal  = [BitConverter]::ToUInt32($b, $o + 36)
            $shdr = [BitConverter]::ToUInt32($b, $o + 60)
            $mach = [BitConverter]::ToUInt16($b, $pe + 4)
            $mag  = [BitConverter]::ToUInt16($b, $o)
            $rel  = [BitConverter]::ToUInt32($b, $o + 112 + 8 * 5)
            $imp  = [BitConverter]::ToUInt32($b, $o + 112 + 8 * 1)
            Write-Host ("HDR {0}: machine=0x{1:x4} magic=0x{2:x} chars=0x{3:x4} dllchars=0x{4:x4} subsystem={5} sectalign=0x{6:x} filealign=0x{7:x} sizehdr=0x{8:x} nsec={9} reloc_rva=0x{10:x} import_rva=0x{11:x} bytes={12}" -f `
              $label, $mach, $mag, $chs, $dllc, $sub, $sal, $fal, $shdr, $nsec, $rel, $imp, $b.Length)
          }
          $ctrl = Join-Path $env:SystemRoot 'System32/notepad.exe'
          if (Test-Path $ctrl) { PeFields $ctrl 'control(notepad.exe GUI)' } else { Write-Host 'HDR control: notepad.exe absent' }
          $ctrlc = Join-Path $env:SystemRoot 'System32/where.exe'
          if (Test-Path $ctrlc) { PeFields $ctrlc 'control(where.exe CUI)' } else { Write-Host 'HDR control: where.exe absent' }
          PeFields $exe 'ours(slice-win-arm64)'
          Run $exe @('--version') 'slice-arm64 --version'
          Run $exe @('--help') 'slice-arm64 --help'
          # A second copy with the subsystem version the ARM64 loader is documented to require (6.02):
          # if only this one starts, the fault is the header field we emit, not the slice's code.
          $patched = Join-Path $PWD 'diag/slice-win-arm64-602.exe'
          Copy-Item $exe $patched -Force
          $b = [IO.File]::ReadAllBytes($patched)
          $pe = [BitConverter]::ToUInt32($b, 60)
          $opt = $pe + 24
          Write-Output ("SUBSYS before: OS={0}.{1} subsystem={2}.{3}" -f
            [BitConverter]::ToUInt16($b,$opt+40), [BitConverter]::ToUInt16($b,$opt+42),
            [BitConverter]::ToUInt16($b,$opt+48), [BitConverter]::ToUInt16($b,$opt+50))
          [BitConverter]::GetBytes([UInt16]6).CopyTo($b, $opt + 40)
          [BitConverter]::GetBytes([UInt16]0).CopyTo($b, $opt + 42)
          [BitConverter]::GetBytes([UInt16]6).CopyTo($b, $opt + 48)
          [BitConverter]::GetBytes([UInt16]2).CopyTo($b, $opt + 50)
          [IO.File]::WriteAllBytes($patched, $b)
          Write-Output ("SUBSYS after : OS={0}.{1} subsystem={2}.{3}" -f
            [BitConverter]::ToUInt16($b,$opt+40), [BitConverter]::ToUInt16($b,$opt+42),
            [BitConverter]::ToUInt16($b,$opt+48), [BitConverter]::ToUInt16($b,$opt+50))
          Run $patched @('--version') 'slice-arm64(subsys 6.02) --version'
          Run $patched @('--help') 'slice-arm64(subsys 6.02) --help'
          # DllCharacteristics: ours is 0x8100 (TS_AWARE|NX); a shipping ARM64 exe is 0xc160
          # (TS_AWARE|DYNAMIC_BASE|HIGH_ENTROPY_VA|NX|GUARD_CF).  A first attempt that OR'd 0xE0 also
          # set FORCE_INTEGRITY (0x80) and the loader answered "cannot verify the digital signature"
          # instead -- proof the header IS parsed, and that 0x80 must stay clear.  Now one bit at a time.
          foreach ($bit in @(
            @{ n='dynamic-base'; v=0x0040 },
            @{ n='high-entropy'; v=0x0020 },
            @{ n='both';         v=0x0060 })) {
            $f = Join-Path $PWD ("diag/slice-arm64-{0}.exe" -f $bit.n)
            Copy-Item $exe $f -Force
            $bb = [IO.File]::ReadAllBytes($f)
            $pp = [BitConverter]::ToUInt32($bb, 60); $oo = $pp + 24
            $old = [BitConverter]::ToUInt16($bb, $oo + 70)
            [BitConverter]::GetBytes([UInt16]($old -bor $bit.v)).CopyTo($bb, $oo + 70)
            [IO.File]::WriteAllBytes($f, $bb)
            Write-Output ("DLLCHAR {0}: 0x{1:x4} -> 0x{2:x4}" -f $bit.n, $old, [BitConverter]::ToUInt16($bb, $oo + 70))
            Run $f @('--version') ("slice-arm64(dllchar {0}) --version" -f $bit.n)
          }
          # Section table of the control and of ours, so a missing/unusual section shows up as data.
          function Sections([string]$path, [string]$label) {
            $b = [IO.File]::ReadAllBytes($path)
            $pe = [BitConverter]::ToUInt32($b, 60); $n = [BitConverter]::ToUInt16($b, $pe + 6)
            $sz = [BitConverter]::ToUInt16($b, $pe + 20); $sec = $pe + 24 + $sz
            for ($i = 0; $i -lt $n; $i++) {
              $o = $sec + 40 * $i
              $nm = [Text.Encoding]::ASCII.GetString($b, $o, 8).TrimEnd([char]0)
              $vs = [BitConverter]::ToUInt32($b, $o + 8); $va = [BitConverter]::ToUInt32($b, $o + 12)
              $rs = [BitConverter]::ToUInt32($b, $o + 16); $ch = [BitConverter]::ToUInt32($b, $o + 36)
              Write-Output ("SEC {0} {1,-8} va=0x{2:x} vs=0x{3:x} rawsz=0x{4:x} ch=0x{5:x8}" -f $label, $nm, $va, $vs, $rs, $ch)
            }
          }
          Sections $ctrlc 'control(where)'
          Sections $exe 'ours'

