name: Windows signing qualification
on:
  workflow_dispatch:
    inputs:
      mode:
        description: Qualification is local-format-only and uses no signing quota
        type: choice
        options: [qualification, company]
        default: qualification
        required: true
      source_sha:
        description: Exact source SHA of the owner-built bytes (on main, named by rc/<seal_tag>)
        type: string
        required: true
      seal_tag:
        description: Existing draft Release containing owner-uploaded unsigned assets
        type: string
        required: true
      receipt_sha256:
        description: Owner-reviewed SHA256 of unsigned-receipt.json
        type: string
        required: true
      upstream_run_id:
        description: Successful ci.yml run for source SHA (source test only)
        type: string
        required: true
      upstream_attempt:
        description: Exact completed CI run attempt
        type: string
        required: true
env:
  # The two gate steps are .cx run by ./unisacc.com; their modules resolve through the directory
  # symlinks in release/ci/ (text, sys, mem, runtime), which a Windows checkout keeps only with
  # core.symlinks (.gitattributes already keeps every byte: * -text).
  GIT_CONFIG_COUNT: '1'
  GIT_CONFIG_KEY_0: core.symlinks
  GIT_CONFIG_VALUE_0: 'true'
permissions:
  contents: write  # drafts and their assets are invisible to a read-only token; nothing is published here
  actions: read
concurrency:
  group: unisacc-windows-signing-${{ inputs.source_sha }}
  cancel-in-progress: false
jobs:
  qualify:
    runs-on: windows-2025
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        timeout-minutes: 1
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false
          fetch-depth: 0   # the rc binding checks ancestry (sealed_from_commit -> source -> main); a shallow clone has no history (0.0.22 first run)
      - name: Bind source, CI attempt and existing owner seal
        timeout-minutes: 1
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          SEAL_TAG: ${{ inputs.seal_tag }}
          RECEIPT_SHA256: ${{ inputs.receipt_sha256 }}
          UPSTREAM_RUN_ID: ${{ inputs.upstream_run_id }}
          UPSTREAM_ATTEMPT: ${{ inputs.upstream_attempt }}
        run: |
          # 0.0.22 P1-B 2 (minicon candidate binding): the release is bound to the rc tag on its exact
          # source commit, not to the moving main tip; the source must be on main and rc/<seal tag>
          # must name exactly this commit.  The checks and their messages are in the .cx header.
          ./unisacc.com release/ci/seal-bind.cx
          if ($LASTEXITCODE -ne 0) { throw 'source/seal qualification failed' }
      - name: Validate exact local-build manifest and bounded APE package
        timeout-minutes: 1
        shell: pwsh
        env:
          MODE: ${{ inputs.mode }}
        run: |
          ./unisacc.com release/ci/validate-manifest.cx
          if ($LASTEXITCODE -ne 0) { throw 'local sealed-input validation failed' }
          $policy = Get-Content release/signing-policy.json -Raw | ConvertFrom-Json
          $receipt = Get-Content staged/qualification-receipt.json -Raw | ConvertFrom-Json
          $ready = $true
          foreach ($asset in $policy.windows.assets) {
            $v = (Get-Item -LiteralPath (Join-Path staged $asset.path)).VersionInfo
            if ($v.ProductName -ne 'Unisacc' -or $v.ProductVersion -ne $receipt.product_version) { $ready = $false }
          }
          $receipt | Add-Member -NotePropertyName versioninfo_ready -NotePropertyValue $ready
          $receipt | ConvertTo-Json -Depth 10 | Set-Content staged/qualification-receipt.json -Encoding utf8NoBOM
          if ($env:MODE -eq 'company' -and (-not $ready -or $policy.windows.mode -ne 'required')) {
            throw 'company signing requires policy.required and exact VERSIONINFO'
          }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        timeout-minutes: 1
        with:
          name: unisacc-sealed-signing-input-${{ github.run_attempt }}
          path: staged/
          if-no-files-found: error
          retention-days: 14
  company:
    if: inputs.mode == 'company'
    needs: qualify
    runs-on: windows-2025
    timeout-minutes: 8
    environment: release-signing
    permissions:
      contents: write
      actions: read
      id-token: write
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
        timeout-minutes: 1
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        timeout-minutes: 1
        with:
          name: unisacc-sealed-signing-input-${{ github.run_attempt }}
          path: signed/
      - name: Fail closed on repository identity and provider configuration
        timeout-minutes: 1
        shell: pwsh
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          ARTIFACT_SIGNING_ENDPOINT: ${{ vars.ARTIFACT_SIGNING_ENDPOINT }}
          ARTIFACT_SIGNING_ACCOUNT: ${{ vars.ARTIFACT_SIGNING_ACCOUNT }}
          ARTIFACT_SIGNING_PROFILE: ${{ vars.ARTIFACT_SIGNING_PROFILE }}
          REPO_IDENTITY_VERIFIED: ${{ vars.UNISACC_REPO_IDENTITY_VERIFIED }}
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($name in @('AZURE_CLIENT_ID','AZURE_TENANT_ID','AZURE_SUBSCRIPTION_ID',
              'ARTIFACT_SIGNING_ENDPOINT','ARTIFACT_SIGNING_ACCOUNT','ARTIFACT_SIGNING_PROFILE')) {
            if ([string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($name))) { throw "missing protected setting: $name" }
          }
          if ($env:REPO_IDENTITY_VERIFIED -ne 'true') { throw 'unisacc-specific OIDC subject/profile RBAC not approved' }
          $policy = Get-Content signed/signing-policy.json -Raw | ConvertFrom-Json
          $q = Get-Content signed/qualification-receipt.json -Raw | ConvertFrom-Json
          if ($policy.windows.mode -ne 'required' -or -not $q.versioninfo_ready) { throw 'sealed qualification is not signable' }
          # The signing action takes the catalog's parent directory as the files root
          # (Split-Path); a root-level catalog yields an empty Path (2026-09-29, twice).
          # Same layout as minicon: a signing-input/ directory holding copies + catalog,
          # signed bytes are copied back into signed/ for the trust court below.
          New-Item -ItemType Directory -Path signing-input | Out-Null
          $catalog = @()
          foreach ($asset in $policy.windows.assets) {
            $path = (Resolve-Path (Join-Path signed $asset.path)).Path
            if ((Get-FileHash -LiteralPath $path -Algorithm SHA256).Hash.ToLowerInvariant() -ne $q.before.($asset.path).sha256) { throw 'transferred input changed' }
            Copy-Item -LiteralPath $path -Destination (Join-Path signing-input $asset.path)
            $catalog += $asset.path
          }
          $catalog | Set-Content -LiteralPath signing-input/signing-catalog.txt -Encoding ascii
      - uses: azure/login@0949e32778441b2c442592b7a0e6313466dc8f29 # v3.0.2
        timeout-minutes: 1
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Sign only the declared owner-built bytes
        uses: Azure/artifact-signing-action@208f8af4bf26cf2af8597424e3cb5582801523ba # v2.0.0
        # First run on a fresh runner installs the signing client packages; that alone
        # exceeded one minute (2026-09-29). The service call itself stays bounded below.
        timeout-minutes: 4
        with:
          endpoint: ${{ vars.ARTIFACT_SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.ARTIFACT_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.ARTIFACT_SIGNING_PROFILE }}
          files-catalog: signing-input/signing-catalog.txt
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
          timeout: 200
          cache-dependencies: true
          trace: false
          description: Unisacc
          description-url: https://github.com/partnernetsoftware/unisacc
          exclude-workload-identity-credential: true
          exclude-environment-credential: true
          exclude-managed-identity-credential: true
          exclude-shared-token-cache-credential: true
          exclude-visual-studio-credential: true
          exclude-visual-studio-code-credential: true
          exclude-azure-cli-credential: false
          exclude-azure-powershell-credential: true
          exclude-azure-developer-cli-credential: true
          exclude-interactive-browser-credential: true
          correlation-id: unisacc-${{ inputs.source_sha }}-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Move the signed bytes back beside the sealed input
        timeout-minutes: 1
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $policy = Get-Content signed/signing-policy.json -Raw | ConvertFrom-Json
          foreach ($asset in $policy.windows.assets) {
            $src = Join-Path signing-input $asset.path
            if (-not (Test-Path -LiteralPath $src)) { throw "signed output missing: $($asset.path)" }
            Copy-Item -LiteralPath $src -Destination (Join-Path signed $asset.path) -Force
          }
      - name: Windows authoritative trust and public before-after receipt
        timeout-minutes: 1
        shell: pwsh
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          $ErrorActionPreference = 'Stop'
          $policy = Get-Content signed/signing-policy.json -Raw | ConvertFrom-Json
          $q = Get-Content signed/qualification-receipt.json -Raw | ConvertFrom-Json
          if ($q.source_sha -ne $env:SOURCE_SHA) { throw 'receipt source mismatch' }
          $expectedPaths = @($policy.windows.assets | ForEach-Object { $_.path }) + @('qualification-receipt.json','unsigned-receipt.json','signing-policy.json')
          $actualPaths = @(Get-ChildItem -LiteralPath signed -File -Recurse | ForEach-Object {
            [IO.Path]::GetRelativePath((Resolve-Path signed).Path, $_.FullName).Replace('\','/')
          })
          if (($actualPaths | Sort-Object) -join "`n" -cne (($expectedPaths | Sort-Object) -join "`n")) { throw 'signed output path allowlist mismatch' }
          if ((Get-FileHash signed/unsigned-receipt.json -Algorithm SHA256).Hash.ToLowerInvariant() -ne $q.receipt_sha256) { throw 'sealed upstream receipt changed' }
          $assets = [ordered]@{}
          foreach ($asset in $policy.windows.assets) {
            $path = Join-Path signed $asset.path
            $sig = Get-AuthenticodeSignature -LiteralPath $path
            if ($sig.Status -ne 'Valid' -or -not $sig.SignerCertificate -or -not $sig.TimeStamperCertificate) { throw 'Windows trust/timestamp rejected' }
            $org = [regex]::Escape($policy.windows.publisher_organization)
            if ($sig.SignerCertificate.Subject -notmatch "(?:^|,\s*)O=$org(?:,|$)") { throw 'unexpected publisher organization' }
            $v = (Get-Item -LiteralPath $path).VersionInfo
            if ($v.ProductName -ne 'Unisacc' -or $v.ProductVersion -ne $q.product_version) { throw 'VERSIONINFO changed' }
            $hash = (Get-FileHash -LiteralPath $path -Algorithm SHA256).Hash.ToLowerInvariant()
            $before = $q.before.($asset.path)
            $bytes = (Get-Item -LiteralPath $path).Length
            if ($hash -eq $before.sha256 -or $bytes -gt $asset.max_signed_bytes) { throw 'signature mutation/size invalid' }
            $info = ./unisacc.com release/apeinspect.cx -- $path | ConvertFrom-Json
            if ($LASTEXITCODE -ne 0 -or $info[0].package_sha256 -ne $before.package_sha256 -or $info[0].certificate_length -le 0) { throw 'APE package changed or certificate extent invalid' }
            $c = $sig.SignerCertificate; $t = $sig.TimeStamperCertificate
            $assets[$asset.path] = [ordered]@{
              before_sha256=$before.sha256; before_bytes=$before.bytes; after_sha256=$hash; after_bytes=$bytes
              package_sha256=$before.package_sha256; authenticode_status="$($sig.Status)"
              signer_subject=$c.Subject; signer_issuer=$c.Issuer; signer_thumbprint=$c.Thumbprint
              signer_not_before=$c.NotBefore.ToUniversalTime().ToString('o'); signer_not_after=$c.NotAfter.ToUniversalTime().ToString('o')
              timestamp_subject=$t.Subject; timestamp_issuer=$t.Issuer; timestamp_thumbprint=$t.Thumbprint
              timestamp_not_before=$t.NotBefore.ToUniversalTime().ToString('o'); timestamp_not_after=$t.NotAfter.ToUniversalTime().ToString('o')
              timestamp_rfc3161=$policy.windows.timestamp_rfc3161; timestamp_digest='SHA256'
              file_product_name=$v.ProductName; file_product_version=$v.ProductVersion
            }
          }
          $receipt = [ordered]@{
            schema=1; kind='unisacc-windows-company-signing'; signing_provider='azure-artifact-signing'
            source_sha=$q.source_sha; product_version=$q.product_version; local_build=$q.local_build
            upstream=[ordered]@{run_id=$q.upstream_run_id;run_attempt=$q.upstream_attempt}
            seal=[ordered]@{release_id=$q.seal_release_id;asset_ids=$q.seal_asset_ids;receipt_sha256=$q.receipt_sha256}
            signing_run=[ordered]@{id=$env:GITHUB_RUN_ID;attempt=$env:GITHUB_RUN_ATTEMPT}
            windows_trust_court='Get-AuthenticodeSignature'; release_eligible=$false
            pending_release_courts=$policy.windows.pending_release_courts; assets=$assets
          }
          $receipt | ConvertTo-Json -Depth 12 | Set-Content signed/signing-receipt.json -Encoding utf8NoBOM
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        timeout-minutes: 1
        with:
          name: unisacc-company-signed-${{ github.run_attempt }}
          path: signed/
          if-no-files-found: error
          retention-days: 14
