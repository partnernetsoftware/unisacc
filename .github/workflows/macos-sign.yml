name: macOS signing and notarization
# plans/macos-signing.md: 发布顺序 5/6 and CI secrets.  workflow_dispatch only; no Release publish step.
# Environment release-signing holds
#   secrets  MACOS_CERT_P12_BASE64 MACOS_CERT_P12_PASSWORD ASC_API_KEY_P8_BASE64 ASC_API_KEY_ID (individual key: no issuer)
#   variable MACOS_SIGN_IDENTITY
# The draft carries members.tsv (ROLE<TAB>ASSET_NAME<TAB>SHA256; roles ape osx-arm64 osx-x86_64
# cache-arm64 cache-x86_64); members_sha256 pins that file, and every member is checked against it.
# Every command is bounded to 60 s by `bound` (perl alarm; macOS runners ship no timeout(1)).
on:
  workflow_dispatch:
    inputs:
      draft_tag:
        description: Existing draft Release tag holding the owner-uploaded unsigned members
        type: string
        required: true
      source_commit:
        description: Exact 40-hex source commit of the draft candidate
        type: string
        required: true
      members_sha256:
        description: Owner-reviewed SHA256 of members.tsv in the draft
        type: string
        required: true
      repack_pins_sha256:
        description: SHA256 of the draft asset repack-inputs.sha256 (pins of the five repack auxiliary assets)
        type: string
        required: true
permissions:
  contents: write  # a draft is invisible to a read-only token; nothing is published here
concurrency:
  group: unisacc-macos-sign-${{ inputs.source_commit }}
  cancel-in-progress: false
defaults:
  run:
    shell: bash
env:
  BOUND: perl -e 'alarm 60; exec @ARGV' --
jobs:
  sign-and-submit:
    runs-on: macos-15
    timeout-minutes: 20
    environment: release-signing
    outputs:
      submission_id: ${{ steps.submit.outputs.submission_id }}
      dmg_sha256: ${{ steps.submit.outputs.dmg_sha256 }}
    steps:
      - name: Select newest Xcode (individual ASC key needs notarytool >= 1.1 without --issuer)
        timeout-minutes: 1
        run: |
          x="$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)"; sudo xcode-select -s "$x"; xcrun notarytool --version
      - name: Validate inputs
        timeout-minutes: 1
        env:
          DRAFT_TAG: ${{ inputs.draft_tag }}
          SOURCE_COMMIT: ${{ inputs.source_commit }}
          MEMBERS_SHA256: ${{ inputs.members_sha256 }}
          REPACK_PINS_SHA256: ${{ inputs.repack_pins_sha256 }}
        run: |
          set -euo pipefail
          [[ "$REPACK_PINS_SHA256" =~ ^[0-9a-f]{64}$ ]] || { echo "repack_pins_sha256 is not 64-hex" >&2; exit 1; }
          [[ "$SOURCE_COMMIT" =~ ^[0-9a-f]{40}$ ]] || { echo "source_commit is not 40-hex" >&2; exit 1; }
          [[ "$MEMBERS_SHA256" =~ ^[0-9a-f]{64}$ ]] || { echo "members_sha256 is not 64-hex" >&2; exit 1; }
          [[ "$DRAFT_TAG" =~ ^[A-Za-z0-9._-]+$ ]] || { echo "draft_tag has illegal characters" >&2; exit 1; }
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        timeout-minutes: 1
        with:
          ref: ${{ inputs.source_commit }}
          persist-credentials: false
      - name: Download fixed-hash members from the draft
        timeout-minutes: 3
        env:
          GH_TOKEN: ${{ github.token }}
          DRAFT_TAG: ${{ inputs.draft_tag }}
          MEMBERS_SHA256: ${{ inputs.members_sha256 }}
        run: |
          set -euo pipefail
          bound() { perl -e 'alarm 60; exec @ARGV' -- "$@"; }
          mkdir -p in work out
          bound gh release download "$DRAFT_TAG" --repo "$GITHUB_REPOSITORY" --pattern members.tsv --dir in
          [[ "$(shasum -a 256 in/members.tsv | cut -d' ' -f1)" == "$MEMBERS_SHA256" ]] || { echo "members.tsv hash mismatch" >&2; exit 1; }
          n=0
          while IFS=$'\t' read -r role name sha; do
            [[ "$role" =~ ^(ape|osx-arm64|osx-x86_64|cache-arm64|cache-x86_64)$ ]] || { echo "bad role" >&2; exit 1; }
            [[ "$name" =~ ^[A-Za-z0-9._-]+$ && "$sha" =~ ^[0-9a-f]{64}$ ]] || { echo "bad row for $role" >&2; exit 1; }
            bound gh release download "$DRAFT_TAG" --repo "$GITHUB_REPOSITORY" --pattern "$name" --dir in
            [[ "$(shasum -a 256 "in/$name" | cut -d' ' -f1)" == "$sha" ]] || { echo "member $role hash mismatch" >&2; exit 1; }
            cp "in/$name" "work/$role"
            n=$((n+1))
          done < in/members.tsv
          [[ "$n" == 5 ]] || { echo "members.tsv must list exactly 5 roles, got $n" >&2; exit 1; }
          for r in osx-arm64 osx-x86_64 cache-arm64 cache-x86_64; do
            bound lipo -archs "work/$r" >/dev/null
            [[ "$(file -b "work/$r")" == *Mach-O* ]] || { echo "$r is not Mach-O" >&2; exit 1; }
          done
      - name: Import the Developer ID identity into a throwaway keychain
        timeout-minutes: 2
        env:
          MACOS_CERT_P12_BASE64: ${{ secrets.MACOS_CERT_P12_BASE64 }}
          MACOS_CERT_P12_PASSWORD: ${{ secrets.MACOS_CERT_P12_PASSWORD }}
        run: |
          set -euo pipefail
          bound() { perl -e 'alarm 60; exec @ARGV' -- "$@"; }
          kc="$RUNNER_TEMP/unisacc-signing.keychain-db"
          kcpw="$(openssl rand -hex 20)"
          echo "SIGN_KEYCHAIN=$kc" >>"$GITHUB_ENV"
          echo "$kc" >"$RUNNER_TEMP/keychain-path"   # recorded first so teardown works after any later failure
          orig="$(security list-keychains -d user | sed 's/"//g' | xargs)"
          printf '%s' "$orig" >"$RUNNER_TEMP/keychain-orig"
          p12="$RUNNER_TEMP/devid.p12"
          printf '%s' "$MACOS_CERT_P12_BASE64" | base64 -d >"$p12"
          bound security create-keychain -p "$kcpw" "$kc"
          bound security set-keychain-settings -lut 3600 "$kc"
          bound security unlock-keychain -p "$kcpw" "$kc"
          bound security import "$p12" -k "$kc" -P "$MACOS_CERT_P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          bound security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$kcpw" "$kc" >/dev/null
          # shellcheck disable=SC2086
          bound security list-keychains -d user -s "$kc" $orig
          rm -f "$p12"
          bound security find-identity -v -p codesigning "$kc"
      - name: Sign the two osx slices (hardened runtime, secure timestamp, unsigned-kernel entitlement)
        timeout-minutes: 3
        env:
          MACOS_SIGN_IDENTITY: ${{ vars.MACOS_SIGN_IDENTITY }}
        run: |
          set -euo pipefail
          bound() { perl -e 'alarm 60; exec @ARGV' -- "$@"; }
          [[ -n "$MACOS_SIGN_IDENTITY" ]] || { echo "MACOS_SIGN_IDENTITY is empty" >&2; exit 1; }
          for r in osx-arm64 osx-x86_64; do
            bound codesign --force --options runtime --timestamp --keychain "$SIGN_KEYCHAIN" \
              --entitlements release/entitlements-unsigned-kernel.plist --sign "$MACOS_SIGN_IDENTITY" "work/$r"
          done
      - name: Sign the cache managers (empty entitlements)
        timeout-minutes: 3
        env:
          MACOS_SIGN_IDENTITY: ${{ vars.MACOS_SIGN_IDENTITY }}
        run: |
          set -euo pipefail
          bound() { perl -e 'alarm 60; exec @ARGV' -- "$@"; }
          printf '%s\n' '<?xml version="1.0" encoding="UTF-8"?>' \
            '<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">' \
            '<plist version="1.0"><dict/></plist>' >work/empty.plist
          for r in cache-arm64 cache-x86_64; do
            bound codesign --force --options runtime --timestamp --keychain "$SIGN_KEYCHAIN" \
              --entitlements work/empty.plist --sign "$MACOS_SIGN_IDENTITY" "work/$r"
          done
      - name: Verify signatures
        timeout-minutes: 3
        run: |
          set -euo pipefail
          bound() { perl -e 'alarm 60; exec @ARGV' -- "$@"; }
          for r in osx-arm64 osx-x86_64 cache-arm64 cache-x86_64; do
            bound codesign --verify --strict --verbose=2 "work/$r"
            bound codesign -dv --verbose=2 "work/$r" 2>&1 | grep -q 'flags=.*runtime'
            bound codesign -dv --verbose=2 "work/$r" 2>&1 | grep -q '^Timestamp='
          done
          for r in osx-arm64 osx-x86_64; do
            bound codesign -d --entitlements - --xml "work/$r" 2>/dev/null | grep -q 'allow-unsigned-executable-memory'
            # no other entitlement key may be present
            [[ "$(bound codesign -d --entitlements - --xml "work/$r" 2>/dev/null | grep -c '<key>')" == 1 ]]
          done
      - name: Download and verify the repack auxiliary inputs (pins file hash is a workflow input)
        timeout-minutes: 3
        env:
          GH_TOKEN: ${{ github.token }}
          DRAFT_TAG: ${{ inputs.draft_tag }}
          REPACK_PINS_SHA256: ${{ inputs.repack_pins_sha256 }}
        run: |
          set -euo pipefail
          bound() { perl -e 'alarm 55; exec @ARGV' -- "$@"; }
          mkdir -p in out
          bound gh release download "$DRAFT_TAG" --repo "$GITHUB_REPOSITORY" --pattern repack-inputs.sha256 --dir in
          [[ "$(shasum -a 256 in/repack-inputs.sha256 | cut -d' ' -f1)" == "$REPACK_PINS_SHA256" ]] || { echo "repack-inputs.sha256 hash mismatch" >&2; exit 1; }
          n=0
          while read -r sha path extra; do
            [[ -z "$extra" && "$sha" =~ ^[0-9a-f]{64}$ && "$path" =~ ^in/repack-inputs/[A-Za-z0-9._-]+$ ]] || { echo "bad pins row" >&2; exit 1; }
            n=$((n+1))
          done < in/repack-inputs.sha256
          [[ "$n" == 5 ]] || { echo "pins file must list exactly 5 assets, got $n" >&2; exit 1; }
          rm -rf in/repack-inputs
          mkdir in/repack-inputs   # fresh directory, no --clobber
          pats=()
          while read -r sha path; do pats+=(--pattern "${path#in/repack-inputs/}"); done < in/repack-inputs.sha256
          bound gh release download "$DRAFT_TAG" --repo "$GITHUB_REPOSITORY" "${pats[@]}" --dir in/repack-inputs
          [[ "$(ls in/repack-inputs | wc -l | tr -d ' ')" == 5 ]] || { echo "unexpected files in in/repack-inputs" >&2; exit 1; }
          cp in/repack-inputs.sha256 out/repack-inputs.sha256
          bound shasum -a 256 --check out/repack-inputs.sha256
      - name: Repack the APE with the signed members (release-ape pack, no signing)
        timeout-minutes: 4
        run: |
          set -euo pipefail
          bound() { perl -e 'alarm 55; exec @ARGV' -- "$@"; }
          # Bootstrap pins come from the already-verified members.tsv (in/ keeps the unsigned originals).
          : >out/repack-bootstrap.sha256
          while IFS=$'\t' read -r role name sha; do
            case "$role" in
              ape) printf '%s  %s\n' "$sha" work/ape >>out/repack-bootstrap.sha256 ;;
              osx-x86_64) printf '%s  %s\n' "$sha" "in/$name" >>out/repack-bootstrap.sha256; OSX_X64="in/$name" ;;
              osx-arm64) printf '%s  %s\n' "$sha" "in/$name" >>out/repack-bootstrap.sha256; OSX_ARM="in/$name" ;;
            esac
          done < in/members.tsv
          [[ "$(wc -l <out/repack-bootstrap.sha256 | tr -d ' ')" == 3 && -n "${OSX_X64:-}" && -n "${OSX_ARM:-}" ]] || { echo "bootstrap pins incomplete" >&2; exit 1; }
          bound shasum -a 256 --check out/repack-bootstrap.sha256
          cp work/ape ./unisacc.com
          cmp work/ape ./unisacc.com
          chmod 755 ./unisacc.com
          unset UNISA_CONTAINER UNISA_KERNEL UNISA_KERNEL_SHA
          # Signed originals only get the exec bit; no re-sign, content and entitlements unchanged.
          chmod 755 work/osx-x86_64 work/osx-arm64 work/cache-x86_64 work/cache-arm64
          for r in osx-x86_64 osx-arm64 cache-x86_64 cache-arm64; do
            bound codesign --verify --strict --verbose=2 "work/$r"
          done
          bound shasum -a 256 work/osx-x86_64 work/osx-arm64 work/cache-x86_64 work/cache-arm64 >out/repack-signed-inputs.sha256
          # pack tolerates an existing OUT, so reject stale products and dangling links here.
          test ! -e work/repacked
          test ! -L work/repacked
          bound sh ./unisacc.com tools/release-ape.cx -- pack \
            --osx-slices work/osx-x86_64 work/osx-arm64 \
            --cache-manager-osx work/cache-x86_64 work/cache-arm64 \
            work/repacked \
            in/repack-inputs/pkg.bin \
            in/repack-inputs/slice-win-x86_64 \
            in/repack-inputs/slice-lnx-x86_64 \
            in/repack-inputs/slice-lnx-arm64 \
            "$OSX_X64" "$OSX_ARM" \
            in/repack-inputs/slice-win-arm64 \
            >out/repack.log 2>&1
          bound shasum -a 256 --check out/repack-signed-inputs.sha256
          bound shasum -a 256 --check out/repack-inputs.sha256
          bound shasum -a 256 --check out/repack-bootstrap.sha256
          grep -Fx $'cache-manager-mode\tEXPLICIT_INPUTS' work/repacked/ape-receipt.txt
          ape_sha=$(shasum -a 256 work/repacked/unisacc-next.com | awk '{print $1}')
          receipt_sha=$(awk -F '\t' '$1=="unisacc-next.com" { sub(/^sha=/,"",$3); print $3 }' work/repacked/ape-receipt.txt)
          [[ "$ape_sha" =~ ^[0-9a-f]{64}$ ]]
          [[ "$ape_sha" == "$receipt_sha" ]]
          printf '%s\n' "$ape_sha" >out/repacked-ape-sha256.txt
          cp work/repacked/ape-receipt.txt out/repacked-ape-receipt.txt
          cp work/repacked/unisacc-next.com out/unisacc-signed.com
          cmp work/repacked/unisacc-next.com out/unisacc-signed.com
      - name: Build the UDZO DMG (APE plus the four signed Mach-O members)
        timeout-minutes: 2
        run: |
          set -euo pipefail
          bound() { perl -e 'alarm 60; exec @ARGV' -- "$@"; }
          bound shasum -a 256 --check out/repack-signed-inputs.sha256
          printf '%s  %s\n' "$(cat out/repacked-ape-sha256.txt)" out/unisacc-signed.com | bound shasum -a 256 --check -
          mkdir -p work/dmgroot
          cp out/unisacc-signed.com work/dmgroot/unisacc.com
          for r in osx-arm64 osx-x86_64 cache-arm64 cache-x86_64; do
            cp "work/$r" "work/dmgroot/$r"
            cmp "work/$r" "work/dmgroot/$r"
          done
          cmp out/unisacc-signed.com work/dmgroot/unisacc.com
          chmod 755 work/dmgroot/*
          bound hdiutil create -volname Unisacc -srcfolder work/dmgroot -ov -format UDZO out/unisacc-macos.dmg
      - name: Sign the DMG
        timeout-minutes: 2
        env:
          MACOS_SIGN_IDENTITY: ${{ vars.MACOS_SIGN_IDENTITY }}
        run: |
          set -euo pipefail
          bound() { perl -e 'alarm 60; exec @ARGV' -- "$@"; }
          bound codesign --force --timestamp --keychain "$SIGN_KEYCHAIN" --sign "$MACOS_SIGN_IDENTITY" out/unisacc-macos.dmg
          bound codesign --verify --strict --verbose=2 out/unisacc-macos.dmg
      - name: Submit to notarization (no wait) and persist the submission id
        id: submit
        timeout-minutes: 2
        env:
          ASC_API_KEY_P8_BASE64: ${{ secrets.ASC_API_KEY_P8_BASE64 }}
          ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
        run: |
          set -euo pipefail
          bound() { perl -e 'alarm 60; exec @ARGV' -- "$@"; }
          p8="$RUNNER_TEMP/asc_api_key.p8"
          printf '%s' "$ASC_API_KEY_P8_BASE64" | base64 -d >"$p8"
          trap 'rm -f "$p8"' EXIT
          res="$(bound xcrun notarytool submit out/unisacc-macos.dmg --key "$p8" --key-id "$ASC_API_KEY_ID" --no-wait --output-format json)"
          id="$(jq -r .id <<<"$res")"
          [[ "$id" =~ ^[0-9a-f-]{36}$ ]] || { echo "no submission id in notarytool reply (UNKNOWN_SUBMISSION; do not resubmit blindly)" >&2; exit 1; }
          printf '%s\n' "$id" >out/submission-id.txt
          sha="$(shasum -a 256 out/unisacc-macos.dmg | cut -d' ' -f1)"
          printf '%s\n' "$sha" >out/dmg-sha256.txt
          echo "submission_id=$id" >>"$GITHUB_OUTPUT"
          echo "dmg_sha256=$sha" >>"$GITHUB_OUTPUT"
      - name: Upload signed DMG and submission record
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        timeout-minutes: 2
        with:
          name: macos-signed-dmg
          path: out/
          if-no-files-found: error
          retention-days: 7
      - name: Tear down the signing keychain
        if: always()
        timeout-minutes: 1
        run: |
          kc="$(cat "$RUNNER_TEMP/keychain-path" 2>/dev/null || true)"
          orig="$(cat "$RUNNER_TEMP/keychain-orig" 2>/dev/null || true)"
          # shellcheck disable=SC2086
          [ -n "$orig" ] && perl -e 'alarm 60; exec @ARGV' -- security list-keychains -d user -s $orig 2>/dev/null || true
          [ -n "$kc" ] && perl -e 'alarm 60; exec @ARGV' -- security delete-keychain "$kc" 2>/dev/null || true
          rm -f "$RUNNER_TEMP/devid.p12" "$RUNNER_TEMP/asc_api_key.p8" 2>/dev/null || true

  notary-status:
    needs: sign-and-submit
    runs-on: macos-15
    timeout-minutes: 5
    environment: release-signing
    steps:
      - name: Select newest Xcode
        timeout-minutes: 1
        run: |
          x="$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)"; sudo xcode-select -s "$x"; xcrun notarytool --version
      - name: Read the submission once (info bounded to 55 s) and staple only if Accepted
        timeout-minutes: 3
        env:
          ASC_API_KEY_P8_BASE64: ${{ secrets.ASC_API_KEY_P8_BASE64 }}
          ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          SUBMISSION_ID: ${{ needs.sign-and-submit.outputs.submission_id }}
          DMG_SHA256: ${{ needs.sign-and-submit.outputs.dmg_sha256 }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p dl
          perl -e 'alarm 60; exec @ARGV' -- gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --name macos-signed-dmg --dir dl
          [[ "$(shasum -a 256 dl/unisacc-macos.dmg | cut -d' ' -f1)" == "$DMG_SHA256" ]] || { echo "dmg drift" >&2; exit 1; }
          p8="$RUNNER_TEMP/asc_api_key.p8"
          printf '%s' "$ASC_API_KEY_P8_BASE64" | base64 -d >"$p8"
          trap 'rm -f "$p8"' EXIT
          res="$(perl -e 'alarm 55; exec @ARGV' -- xcrun notarytool info "$SUBMISSION_ID" --key "$p8" --key-id "$ASC_API_KEY_ID" --output-format json)" || { echo "status=UNKNOWN (info did not finish in 55 s)"; exit 1; }
          status="$(jq -r .status <<<"$res")"
          echo "notary status: $status"
          case "$status" in
            Accepted)
              perl -e 'alarm 60; exec @ARGV' -- xcrun stapler staple dl/unisacc-macos.dmg
              perl -e 'alarm 60; exec @ARGV' -- xcrun stapler validate dl/unisacc-macos.dmg
              perl -e 'alarm 60; exec @ARGV' -- spctl -a -t open --context context:primary-signature -vv dl/unisacc-macos.dmg
              shasum -a 256 dl/unisacc-macos.dmg | cut -d' ' -f1 >dl/stapled-dmg-sha256.txt ;;
            "In Progress") echo "PENDING: re-dispatch status later; do not resubmit"; exit 0 ;;
            *) echo "not accepted: $status (fetch 'notarytool log' manually; no blind resubmit)" >&2; exit 1 ;;
          esac
      - name: Upload stapled DMG
        if: ${{ hashFiles('dl/stapled-dmg-sha256.txt') != '' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        timeout-minutes: 2
        with:
          name: macos-stapled-dmg
          path: dl/
          retention-days: 7
