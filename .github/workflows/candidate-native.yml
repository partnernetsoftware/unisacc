# Same-candidate native qualification: one APE (exact sha256) + one commit (exact tests) on every native runner.
# Manual dispatch only; no push/PR/schedule trigger, release, signing or publication.
# The candidate comes from a private draft release asset (release_tag, preferred) or a plain https URL (ape_url);
# either way its identity is ape_sha256. Only the fetch job may read draft releases (contents: write).
# Cell logic and the evidence table are tests/candidate-qualify.cx; the Windows step is only its host adapter,
# 该工具依赖 fork/进程组；COMMIT 必须包含工具、darwin-monotonic.c 和事实表。
# 两个 Mac 格在既有 smoke 行实编实跑 CLOCK_MONOTONIC 与 50ms nanosleep，
# 并检查同源 libc99posix.tsv 的 host-export/clock_gettime 绑定；无原生收据不算 PASS。
# 汇总退出码：0 表示全部 42 格 PASS；3 表示无失败但有 NOT_RUN；1 表示失败或证据无效。
name: candidate-native-qualification
on:
  workflow_dispatch:
    inputs:
      ape_sha256:
        description: 'Expected SHA256 of the raw APE unisacc.com'
        type: string
        required: true
      commit:
        description: 'Exact 40-character commit supplying tests, never a branch name'
        type: string
        required: true
      release_tag:
        description: 'Tag of a draft release whose asset unisacc.com is the candidate (preferred over ape_url)'
        type: string
        required: false
        default: ''
      ape_url:
        description: 'https URL of the APE, used only when release_tag is empty; transport only, identity is ape_sha256'
        type: string
        required: false
        default: ''
permissions:
  contents: read
concurrency:
  group: candidate-native-${{ inputs.ape_sha256 }}
  cancel-in-progress: false
env:
  # Preserve source bytes and real symlinks before checkout; a failed symlink checkout is a failed input.
  GIT_CONFIG_COUNT: '2'
  GIT_CONFIG_KEY_0: core.autocrlf
  GIT_CONFIG_VALUE_0: 'false'
  GIT_CONFIG_KEY_1: core.symlinks
  GIT_CONFIG_VALUE_1: 'true'
  APE_SHA: ${{ inputs.ape_sha256 }}
  COMMIT: ${{ inputs.commit }}
jobs:
  fetch:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    # A draft release is visible to GITHUB_TOKEN only with contents: write; no other job gets it.
    permissions:
      contents: write
    steps:
      - name: Fetch the candidate once and pin its bytes
        env:
          APE_URL: ${{ inputs.ape_url }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -eu
          printf '%s' "$APE_SHA" | grep -Eqx '[0-9a-f]{64}' || { echo "::error::ape_sha256 must be 64 lowercase hex"; exit 1; }
          printf '%s' "$COMMIT" | grep -Eqx '[0-9a-f]{40}' || { echo "::error::commit must be 40 lowercase hex"; exit 1; }
          mkdir candidate
          if [ -n "$RELEASE_TAG" ]; then
            printf '%s' "$RELEASE_TAG" | grep -Eqx '[A-Za-z0-9._-]+' || { echo "::error::release_tag must be a plain tag name"; exit 1; }
            gh release download "$RELEASE_TAG" -p 'unisacc.com' --repo "$GITHUB_REPOSITORY" --dir candidate
          elif [ -n "$APE_URL" ]; then
            printf '%s' "$APE_URL" | grep -Eqx 'https://[A-Za-z0-9./_~%+-]+' || { echo "::error::ape_url must be a plain https URL"; exit 1; }
            curl --fail --location --silent --show-error --max-time 180 --output candidate/unisacc.com "$APE_URL"
          else
            echo "::error::give release_tag or ape_url"; exit 1
          fi
          [ -f candidate/unisacc.com ] || { echo "::error::no unisacc.com fetched"; exit 1; }
          got=$(sha256sum candidate/unisacc.com | cut -d' ' -f1)
          if [ "$got" != "$APE_SHA" ]; then echo "::error::ape sha256 $got, expected $APE_SHA"; exit 1; fi
          # The sixth slice (win/arm64) is a separate release asset of the same draft release; the outer PE of the
          # APE is x86_64, so the windows-11-arm cell runs this file itself. Missing asset => that cell FAILs (not skipped).
          mkdir slice
          if [ -n "$RELEASE_TAG" ]; then
            gh release download "$RELEASE_TAG" -p 'slice-win-arm64' --repo "$GITHUB_REPOSITORY" --dir slice || echo "::warning::release has no slice-win-arm64 asset"
            gh release download "$RELEASE_TAG" -p 'pkg.bin' --repo "$GITHUB_REPOSITORY" --dir slice || echo "::warning::release has no pkg.bin asset"
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: candidate-ape
          path: candidate/unisacc.com
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: slice-win-arm64
          path: |
            slice/slice-win-arm64
            slice/pkg.bin
          if-no-files-found: ignore
          retention-days: 7
  ffi-lnx:
    # Reference output for the win FFI probes: the same sources, same candidate, compiled for and run on lnx/x86_64.
    needs: fetch
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.commit }}
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: candidate-ape
          path: candidate
      - name: Build and run the FFI probes on lnx
        shell: bash
        run: |
          set -eu
          got=$(sha256sum candidate/unisacc.com | cut -d' ' -f1)
          if [ "$got" != "$APE_SHA" ]; then echo "::error::host hash $got, expected $APE_SHA"; exit 1; fi
          cp candidate/unisacc.com ./unisacc.com; chmod +x ./unisacc.com
          mkdir -p ffi-ref
          for p in strdup pread; do
            timeout 120 sh ./unisacc.com -b lnx/x86_64 -o ffi-ref/win-ffi-$p tests/cases/win-ffi-$p.c
            (cd tests/cases && timeout 30 "$OLDPWD/ffi-ref/win-ffi-$p" > "$OLDPWD/ffi-ref/$p.out")
            echo "== $p"; od -c ffi-ref/$p.out | head
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ffi-ref
          path: ffi-ref/*.out
          if-no-files-found: error
          retention-days: 7
  cell-tools:
    # The cell must not itself depend on the default -run, which is the thing under test on osx/win
    # (CI-RUN-1: -run is broken there). The candidate cross-compiles the cell tool for those slices on lnx/x86_64.
    needs: fetch
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.commit }}
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: candidate-ape
          path: candidate
      - name: Cross-compile the cell tool with the candidate
        shell: bash
        run: |
          set -eu
          got=$(sha256sum candidate/unisacc.com | cut -d' ' -f1)
          if [ "$got" != "$APE_SHA" ]; then echo "::error::host hash $got, expected $APE_SHA"; exit 1; fi
          cp candidate/unisacc.com ./unisacc.com; chmod +x ./unisacc.com
          mkdir -p cell-tools
          # win keeps its pwsh adapter: the cell tool needs POSIX fork/fcntl and does not compile for win/x86_64.
          for t in osx/x86_64 osx/arm64; do
            o=cell-tools/candidate-qualify-${t%/*}-${t#*/}
            timeout 120 sh ./unisacc.com -b "$t" -o "$o" tests/candidate-qualify.cx
            ls -l "$o"
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cell-tools
          path: cell-tools/
          if-no-files-found: error
          retention-days: 7
  candidate:
    needs: [fetch, cell-tools, ffi-lnx]
    strategy:
      fail-fast: false
      matrix:
        include:
          - {runner: ubuntu-24.04, os: lnx, arch: x86_64, native_slice: 'yes'}
          - {runner: ubuntu-24.04-arm, os: lnx, arch: arm64, native_slice: 'yes'}
          - {runner: macos-15-intel, os: osx, arch: x86_64, native_slice: 'yes'}
          - {runner: macos-15, os: osx, arch: arm64, native_slice: 'yes'}
          - {runner: windows-2025, os: win, arch: x86_64, native_slice: 'yes'}
          # The APE's outer PE is x86_64 (tools/release-ape.cx packs win/arm64 as the sixth slice), so this host
          # would only emulate it. native_slice 'file' runs the win/arm64 slice file itself, natively.
          - {runner: windows-11-arm, os: win, arch: arm64, native_slice: 'file'}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 12
    env:
      TARGET: ${{ matrix.os }}/${{ matrix.arch }}
      EVIDENCE: evidence/${{ matrix.os }}-${{ matrix.arch }}.tsv
      NATIVE_SLICE: ${{ matrix.native_slice }}
      # Same literal as exec/facts/limits.tsv; POSIX cells read that table directly.
      VERSION_RE: '^unisacc 0\.0\.47\r?\n$'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.commit }}
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: candidate-ape
          path: candidate
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: matrix.os == 'osx'
        with:
          name: cell-tools
          path: cell-tools
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: matrix.native_slice == 'file'
        continue-on-error: true
        with:
          name: slice-win-arm64
          path: slice
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: matrix.os == 'win' && matrix.arch == 'x86_64'
        with:
          name: ffi-ref
          path: ffi-ref
      - name: 运行原生格（POSIX；Mac smoke 含原生 CLOCK_MONOTONIC 和同源事实）
        if: matrix.os != 'win'
        shell: bash
        run: |
          set -eu
          if command -v sha256sum >/dev/null; then got=$(sha256sum candidate/unisacc.com | cut -d' ' -f1); else got=$(shasum -a 256 candidate/unisacc.com | cut -d' ' -f1); fi
          if [ "$got" != "$APE_SHA" ]; then echo "::error::host hash $got, expected $APE_SHA"; exit 1; fi
          cp candidate/unisacc.com ./unisacc.com
          chmod +x ./unisacc.com
          mkdir -p evidence
          if [ "${{ matrix.os }}" = lnx ]; then
            sh ./unisacc.com tests/candidate-qualify.cx -- cell "$TARGET" "$APE_SHA" "$COMMIT" "$EVIDENCE"
          else
            tool=cell-tools/candidate-qualify-${{ matrix.os }}-${{ matrix.arch }}
            chmod +x "$tool"
            "$tool" cell "$TARGET" "$APE_SHA" "$COMMIT" "$EVIDENCE"
          fi
      - name: lnx/arm64 diagnostics (read-only, not part of the verdict)
        if: always() && matrix.os == 'lnx' && matrix.arch == 'arm64'
        continue-on-error: true
        shell: bash
        run: |
          set +e
          {
            echo "uname -m: $(uname -m)"
            printf 'int main(void){return 0;}\n' > diag-h.c
            sh ./unisacc.com diag-h.c -o diag-h; echo "compile rc=$?"; file diag-h
            ./diag-h; echo "run rc=$?"
            UNISACC_RR_TIME=1 sh ./unisacc.com diag-h.c 2>&1 | head -20; echo "-run rc=${PIPESTATUS[0]}"
          } 2>&1 | tee diag-arm64.txt
          cat diag-arm64.txt >> "$GITHUB_STEP_SUMMARY"
      - name: Run the cell (Windows adapter)
        if: matrix.os == 'win'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # Bounded single command; Kill($true) requests owned-tree cleanup. No JobObject tree watchdog exists yet.
          function Invoke-Bounded([string]$file, [string[]]$arguments) {
            $info = [Diagnostics.ProcessStartInfo]::new()
            $info.FileName = $file
            $info.UseShellExecute = $false
            $info.RedirectStandardOutput = $true
            $info.RedirectStandardError = $true
            foreach ($item in $arguments) { $info.ArgumentList.Add($item) }
            $process = [Diagnostics.Process]::new()
            $process.StartInfo = $info
            try {
              [void]$process.Start()
              $stdout = $process.StandardOutput.ReadToEndAsync()
              $stderr = $process.StandardError.ReadToEndAsync()
              if (!$process.WaitForExit(55000)) { $process.Kill($true); return @{ Code = 124; Out = ''; Err = 'timeout after 55s' } }
              if (!$stdout.Wait(500) -or !$stderr.Wait(500)) { $process.Kill($true); return @{ Code = 125; Out = ''; Err = 'inherited stream still open' } }
              return @{ Code = $process.ExitCode; Out = $stdout.Result; Err = $stderr.Result }
            } catch { return @{ Code = -1; Out = ''; Err = "$_" } } finally { $process.Dispose() }
          }
          $script:failed = $false
          New-Item -ItemType Directory -Force -Path evidence, out | Out-Null
          function Add-Row([string]$check, [string]$status, [int]$rc, [string]$detail) {
            if ($status -ceq 'FAIL') { $script:failed = $true }
            $clean = ($detail -replace '[\t\r\n]', ' ')
            if ($clean.Length -gt 300) { $clean = $clean.Substring(0, 300) }
            if (!$clean) { $clean = '-' }
            $row = "$env:TARGET`t$check`t$status`t$rc`tUNMEASURED`t$env:APE_SHA`t$env:COMMIT`t$clean"
            Write-Output $row
            [IO.File]::AppendAllText((Join-Path $PWD $env:EVIDENCE), "$row`n")
          }
          $com = Join-Path $PWD 'unisacc.com'
          Copy-Item candidate/unisacc.com $com
          $hash = (Get-FileHash -LiteralPath $com -Algorithm SHA256).Hash.ToLowerInvariant()
          $head = Invoke-Bounded 'git' @('rev-parse', 'HEAD')
          $status = Invoke-Bounded 'git' @('status', '--porcelain', '--untracked-files=no')
          $bytes = [IO.File]::ReadAllBytes($com)
          $pe = [BitConverter]::ToUInt32($bytes, 60)
          $hostArch = [Runtime.InteropServices.RuntimeInformation]::OSArchitecture.ToString().ToLowerInvariant()
          $hostArch = if ($hostArch -eq 'x64') { 'x86_64' } else { $hostArch }
          $why = ''
          if ($hash -cne $env:APE_SHA) { $why = "ape sha actual=$hash" }
          elseif ($head.Code -ne 0 -or $head.Out.Trim() -cne $env:COMMIT) { $why = 'checkout HEAD differs from commit' }
          elseif ($status.Code -ne 0 -or $status.Out) { $why = 'tracked files changed in the checkout' }
          elseif ("win/$hostArch" -cne $env:TARGET) { $why = "host is win/$hostArch, not $env:TARGET" }
          elseif ($pe -gt $bytes.Length - 6 -or [BitConverter]::ToUInt32($bytes, $pe) -ne 0x4550 -or [BitConverter]::ToUInt16($bytes, $pe + 4) -ne 0x8664) { $why = 'candidate has no PE x86_64 image' }
          $later = @('version', 'hello', 'run', 'stdio-crossunit', 'stream-pipe', 'smoke')
          if ($why) {
            Add-Row 'identity' 'FAIL' 1 $why
            foreach ($check in $later) { Add-Row $check 'NOT_RUN' -1 'identity failed' }
            exit 1
          }
          Add-Row 'identity' 'PASS' 0 'HEAD, tracked bytes, ape sha and host all agree'
          if ($env:NATIVE_SLICE -ceq 'file') {
            # Sixth slice, run natively as a file: --version must print the exact version text. Other checks stay NOT_RUN.
            $slicePath = Join-Path $PWD 'slice/slice-win-arm64'
            if (!(Test-Path -LiteralPath $slicePath)) { Add-Row 'version' 'FAIL' 1 'win/arm64 slice asset missing (release_tag needs a slice-win-arm64 asset)' }
            else {
              $sb = [IO.File]::ReadAllBytes($slicePath)
              $spe = [BitConverter]::ToUInt32($sb, 60)
              $machine = if ($spe -le $sb.Length - 6 -and [BitConverter]::ToUInt32($sb, $spe) -eq 0x4550) { [BitConverter]::ToUInt16($sb, $spe + 4) } else { 0 }
              $sha = (Get-FileHash -LiteralPath $slicePath -Algorithm SHA256).Hash.ToLowerInvariant()
              if ($machine -ne 0xAA64) { Add-Row 'version' 'FAIL' 1 ("slice machine=0x{0:x4}, expected 0xaa64 sha={1}" -f $machine, $sha) }
              else {
                $sexe = Join-Path $PWD 'out/slice-win-arm64.exe'
                Copy-Item -LiteralPath $slicePath $sexe
                $sv = Invoke-Bounded $sexe @('--version')
                Add-Row 'version' $(if ($sv.Code -eq 0 -and !$sv.Err -and $sv.Out -cmatch $env:VERSION_RE) { 'PASS' } else { 'FAIL' }) $sv.Code "slice-win-arm64 sha=$sha $($sv.Out) $($sv.Err)"
                if ($sv.Code -eq 0) {
                  # Same package the x86_64 cells find inside the APE: the slice file has none appended, so point it at pkg.bin.
                  $pkgPath = Join-Path $PWD 'slice/pkg.bin'
                  if (!(Test-Path -LiteralPath $pkgPath)) { foreach ($check in @('hello', 'run', 'smoke', 'stdio-crossunit', 'stream-pipe')) { Add-Row $check 'FAIL' 1 'pkg.bin asset missing (release_tag needs a pkg.bin asset)' } }
                  else {
                    $env:UNISA_CONTAINER = $pkgPath
                    [IO.File]::WriteAllText((Join-Path $PWD 'out/hello.c'), "#include <stdio.h>`nint main(void){puts(`"candidate-hello`");return 0;}`n")
                    $build = Invoke-Bounded $sexe @('-o', 'out/hello.exe', 'out/hello.c')
                    if ($build.Code -ne 0) { Add-Row 'hello' 'FAIL' $build.Code "compile: $($build.Err)" }
                    else {
                      $hello = Invoke-Bounded (Join-Path $PWD 'out/hello.exe') @()
                      Add-Row 'hello' $(if ($hello.Code -eq 0 -and $hello.Out -cmatch '^candidate-hello\r?\n$') { 'PASS' } else { 'FAIL' }) $hello.Code "$($hello.Out) $($hello.Err)"
                    }
                    [IO.File]::WriteAllText((Join-Path $PWD 'out/run.cx'), "int main(void){puts(`"candidate-run`");return 0;}`n")
                    $run = Invoke-Bounded $sexe @('out/run.cx')
                    Add-Row 'run' $(if ($run.Code -eq 0 -and $run.Out -cmatch '^candidate-run\r?\n$') { 'PASS' } else { 'FAIL' }) $run.Code "$($run.Out) $($run.Err)"
                    $smoke = Invoke-Bounded $sexe @('tests/run.cx', '--', '--smoke')
                    Add-Row 'smoke' $(if ($smoke.Code -eq 0 -and $smoke.Out -cmatch "SMOKE`tassertions=16`tfailed=0") { 'PASS' } else { 'FAIL' }) $smoke.Code "$($smoke.Err)"
                    $plines = & (Join-Path $PWD 'tests/win-portable-cell.ps1') -Exe $sexe -Tgt 'win/arm64' -Root $PWD
                    New-Item -ItemType Directory -Force -Path diagnostics | Out-Null
                    $plines | Set-Content -LiteralPath (Join-Path $PWD 'diagnostics/win-arm64-portable.txt')
                    foreach ($ln in $plines) {
                      Write-Host $ln
                      $bits = [string]$ln -split "`t", 4
                      if ($bits.Count -ge 4 -and $bits[0] -ceq 'STDIO') { Add-Row 'stdio-crossunit' $bits[1] ([int]$bits[2]) $bits[3] }
                      if ($bits.Count -ge 4 -and $bits[0] -ceq 'STREAM') { Add-Row 'stream-pipe' $bits[1] ([int]$bits[2]) $bits[3] }
                    }
                  }
                } else { foreach ($check in @('hello', 'run', 'smoke', 'stdio-crossunit', 'stream-pipe')) { Add-Row $check 'NOT_RUN' -1 'win/arm64 slice --version failed' } }
              }
            }
            if (-not (Test-Path -LiteralPath $sexe)) { foreach ($check in @('stdio-crossunit', 'stream-pipe')) { Add-Row $check 'FAIL' 1 'no slice exe' } }
            if ($script:failed) { exit 1 }
            exit 0
          }
          if ($env:NATIVE_SLICE -cne 'yes') {
            foreach ($check in $later) { Add-Row $check 'NOT_RUN' -1 'APE has no win/arm64 slice; x86_64 emulation is not this native target' }
            exit 0
          }
          $version = Invoke-Bounded $com @('--version')
          Add-Row 'version' $(if ($version.Code -eq 0 -and !$version.Err -and $version.Out -cmatch $env:VERSION_RE) { 'PASS' } else { 'FAIL' }) $version.Code "$($version.Out) $($version.Err)"
          [IO.File]::WriteAllText((Join-Path $PWD 'out/hello.c'), "#include <stdio.h>`nint main(void){puts(`"candidate-hello`");return 0;}`n")
          $build = Invoke-Bounded $com @('-o', 'out/hello.exe', 'out/hello.c')
          if ($build.Code -ne 0) { Add-Row 'hello' 'FAIL' $build.Code "compile: $($build.Err)" }
          else {
            $hello = Invoke-Bounded (Join-Path $PWD 'out/hello.exe') @()
            Add-Row 'hello' $(if ($hello.Code -eq 0 -and $hello.Out -cmatch '^candidate-hello\r?\n$') { 'PASS' } else { 'FAIL' }) $hello.Code "$($hello.Out) $($hello.Err)"
          }
          [IO.File]::WriteAllText((Join-Path $PWD 'out/run.cx'), "int main(void){puts(`"candidate-run`");return 0;}`n")
          $run = Invoke-Bounded $com @('out/run.cx')
          Add-Row 'run' $(if ($run.Code -eq 0 -and $run.Out -cmatch '^candidate-run\r?\n$') { 'PASS' } else { 'FAIL' }) $run.Code "$($run.Out) $($run.Err)"
          $plines = & (Join-Path $PWD 'tests/win-portable-cell.ps1') -Exe $com -Tgt 'win/x86_64' -Root $PWD
          New-Item -ItemType Directory -Force -Path diagnostics | Out-Null
          $plines | Set-Content -LiteralPath (Join-Path $PWD 'diagnostics/win-x86_64-portable.txt')
          foreach ($ln in $plines) {
            Write-Host $ln
            $bits = [string]$ln -split "`t", 4
            if ($bits.Count -ge 4 -and $bits[0] -ceq 'STDIO') { Add-Row 'stdio-crossunit' $bits[1] ([int]$bits[2]) $bits[3] }
            if ($bits.Count -ge 4 -and $bits[0] -ceq 'STREAM') { Add-Row 'stream-pipe' $bits[1] ([int]$bits[2]) $bits[3] }
          }
          $smoke = Invoke-Bounded $com @('tests/run.cx', '--', '--smoke')
          Add-Row 'smoke' $(if ($smoke.Code -eq 0 -and $smoke.Out -cmatch "SMOKE`tassertions=16`tfailed=0") { 'PASS' } else { 'FAIL' }) $smoke.Code "$($smoke.Err)"
          if ((Get-FileHash -LiteralPath $com -Algorithm SHA256).Hash.ToLowerInvariant() -cne $env:APE_SHA) { Add-Row 'identity' 'FAIL' 1 'candidate changed during the checks' }
          if ($script:failed) { exit 1 }
      - name: Windows FFI probes vs lnx reference (byte compare)
        if: always() && matrix.os == 'win' && matrix.arch == 'x86_64'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $com = Join-Path $PWD 'candidate/unisacc.com'
          New-Item -ItemType Directory -Force -Path out | Out-Null
          function Run-Cap([string]$file, [string[]]$arguments, [string]$dir) {
            $info = [Diagnostics.ProcessStartInfo]::new(); $info.FileName = $file; $info.UseShellExecute = $false
            $info.RedirectStandardOutput = $true; $info.RedirectStandardError = $true; $info.WorkingDirectory = $dir
            foreach ($a in $arguments) { $info.ArgumentList.Add($a) }
            $p = [Diagnostics.Process]::new(); $p.StartInfo = $info
            [void]$p.Start()
            $ms = [IO.MemoryStream]::new(); $t = $p.StandardOutput.BaseStream.CopyToAsync($ms); $e = $p.StandardError.ReadToEndAsync()
            if (!$p.WaitForExit(55000)) { $p.Kill($true); return @{ Code = 124; Out = [byte[]]@(); Err = 'timeout after 55s' } }
            [void]$t.Wait(2000)
            return @{ Code = $p.ExitCode; Out = $ms.ToArray(); Err = $e.Result }
          }
          function Show([byte[]]$b) { if ($b.Length -eq 0) { '(empty)' } else { ($b | ForEach-Object { $_.ToString('x2') }) -join ' ' } }
          $bad = $false
          $cases = Join-Path $PWD 'tests/cases'
          foreach ($p in @('strdup', 'pread')) {
            $exe = Join-Path $PWD "out/win-ffi-$p.exe"
            & $com -b win/x86_64 -o $exe (Join-Path $cases "win-ffi-$p.c")
            if ($LASTEXITCODE -ne 0 -or !(Test-Path $exe)) { Write-Output "FFI $p compile rc=$LASTEXITCODE"; $bad = $true; continue }
            $ref = [IO.File]::ReadAllBytes((Join-Path $PWD "ffi-ref/$p.out"))
            if ($p -eq 'pread') {
              # Bisect open(): absolute path, backslash path, relative path (cwd = tests/cases). Each prints rc/errno/GetLastError.
              $abs = Join-Path $cases 'win-ffi-pread.c'
              $back = $abs.Replace('/', '\')
              foreach ($v in @(@('absolute', $abs, $cases), @('backslash', $back, $cases), @('relative', 'win-ffi-pread.c', $cases))) {
                $r = Run-Cap $exe @($v[1]) $v[2]
                Write-Output ("FFI pread open[{0}] arg='{1}' exit={2} stdout_hex={3} stderr='{4}'" -f $v[0], $v[1], $r.Code, (Show $r.Out), ($r.Err -replace '[\r\n]+', ' '))
              }
              # Native errno/GetLastError of open() itself, from the same host, for the three spellings.
              Add-Type -Namespace Nat -Name K32 -MemberDefinition '[DllImport("kernel32.dll", SetLastError=true, CharSet=CharSet.Ansi)] public static extern IntPtr CreateFileA(string n, uint acc, uint share, IntPtr sec, uint disp, uint flags, IntPtr tmpl);'
              Add-Type -MemberDefinition '[DllImport("ucrtbase.dll", EntryPoint="_open", CallingConvention=CallingConvention.Cdecl)] public static extern int c_open(string p, int flags);[DllImport("ucrtbase.dll", EntryPoint="_errno", CallingConvention=CallingConvention.Cdecl)] public static extern IntPtr c_errno();' -Name U -Namespace Nat
              foreach ($v in @(@('absolute', $abs), @('backslash', $back), @('relative', 'win-ffi-pread.c'))) {
                Push-Location $cases
                $h = [Nat.K32]::CreateFileA($v[1], [uint32]2147483648, 1, [IntPtr]::Zero, 3, 0x80, [IntPtr]::Zero)
                $gle = [Runtime.InteropServices.Marshal]::GetLastWin32Error()
                $fd = [Nat.U]::c_open($v[1], 0)
                $en = [Runtime.InteropServices.Marshal]::ReadInt32([Nat.U]::c_errno())
                Pop-Location
                Write-Output ("FFI pread host-open[{0}] CreateFileA handle={1} GetLastError={2}; ucrt _open fd={3} errno={4}" -f $v[0], $h, $gle, $fd, $en)
              }
            }
            # Verdict: the reference spelling is the relative one (the lnx run used cwd = tests/cases with the default argument).
            $r = Run-Cap $exe @() $cases
            $same = ($r.Code -eq 0) -and ([Convert]::ToBase64String($r.Out) -ceq [Convert]::ToBase64String($ref))
            Write-Output ("FFI {0}: exit={1} win_hex={2} lnx_hex={3} err='{4}' => {5}" -f $p, $r.Code, (Show $r.Out), (Show $ref), ($r.Err -replace '[\r\n]+', ' '), $(if ($same) { 'IDENTICAL' } else { 'DIFFERENT' }))
            if (!$same) { $bad = $true }
          }
          if ($bad) { exit 1 }
      - name: Windows diagnostics (read-only, not part of the verdict)
        if: always() && matrix.os == 'win'
        continue-on-error: true
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $com = Join-Path $PWD 'candidate/unisacc.com'
          $diag = Join-Path $PWD 'diagnostics'
          New-Item -ItemType Directory -Force -Path $diag | Out-Null
          $logName = 'win-' + $env:TARGET.Replace('/', '-') + '.txt'
          $log = Join-Path $diag $logName
          function Say([string]$s) { Write-Output $s; [IO.File]::AppendAllText($log, "$s`n") }
          function Pe-Exports([string]$dll) {
            $b = [IO.File]::ReadAllBytes($dll)
            $pe = [BitConverter]::ToInt32($b, 60)
            if ([BitConverter]::ToUInt32($b, $pe) -ne 0x4550) { return @() }
            $magic = [BitConverter]::ToUInt16($b, $pe + 24)
            $dd = $pe + 24 + $(if ($magic -eq 0x20b) { 112 } else { 96 })
            $rva = [BitConverter]::ToInt32($b, $dd)
            if ($rva -le 0) { return @() }
            $sec = $pe + 24 + [BitConverter]::ToUInt16($b, $pe + 20)
            $nsec = [BitConverter]::ToUInt16($b, $pe + 6)
            $rva2off = {
              param($r)
              for ($i = 0; $i -lt $nsec; $i++) {
                $o = $sec + $i * 40
                $vs = [BitConverter]::ToInt32($b, $o + 8); $va = [BitConverter]::ToInt32($b, $o + 12); $raw = [BitConverter]::ToInt32($b, $o + 20)
                if ($r -ge $va -and $r -lt $va + [Math]::Max($vs, 1)) { return $raw + ($r - $va) }
              }
              return -1
            }
            $exp = & $rva2off $rva
            if ($exp -lt 0) { return @() }
            $nn = [BitConverter]::ToInt32($b, $exp + 24)
            $nr = [BitConverter]::ToInt32($b, $exp + 32)
            $no = & $rva2off $nr
            $names = @()
            for ($i = 0; $i -lt $nn -and $i -lt 8000; $i++) {
              $nrva = [BitConverter]::ToInt32($b, $no + $i * 4)
              $off = & $rva2off $nrva
              if ($off -lt 0) { continue }
              $end = $off; while ($end -lt $b.Length -and $b[$end] -ne 0) { $end++ }
              $names += [Text.Encoding]::ASCII.GetString($b, $off, $end - $off)
            }
            return $names
          }
          $ucrt = Join-Path $env:WINDIR 'System32\ucrtbase.dll'
          $expFile = Join-Path $diag 'ucrtbase-exports.txt'
          if (Test-Path -LiteralPath $ucrt) {
            $ex = Pe-Exports $ucrt
            $ex | Sort-Object | Set-Content -LiteralPath $expFile -Encoding ascii
            Say ("UCRT_EXPORTS file={0} count={1} _open={2} open={3} _write={4} write={5}" -f $expFile, $ex.Count, [int]($ex -contains '_open'), [int]($ex -contains 'open'), [int]($ex -contains '_write'), [int]($ex -contains 'write'))
          } else { Say 'UCRT_EXPORTS NOT_RUN no ucrtbase.dll' }
          function Hex([byte[]]$b, [int]$max) { if (!$b) { return '-' }; $n = [Math]::Min($b.Length, $max); ($b[0..($n - 1)] | ForEach-Object { $_.ToString('x2') }) -join ' ' }
          function Run-Raw([string]$file, [string[]]$arguments, [string]$label) {
            $info = [Diagnostics.ProcessStartInfo]::new(); $info.FileName = $file; $info.UseShellExecute = $false
            $info.RedirectStandardOutput = $true; $info.RedirectStandardError = $true
            foreach ($a in $arguments) { $info.ArgumentList.Add($a) }
            $p = [Diagnostics.Process]::new(); $p.StartInfo = $info
            try {
              [void]$p.Start(); $ms = [IO.MemoryStream]::new(); $p.StandardOutput.BaseStream.CopyToAsync($ms) | Out-Null
              $err = $p.StandardError.ReadToEndAsync()
              if (!$p.WaitForExit(30000)) { $p.Kill($true); Say "$label timeout"; return }
              Start-Sleep -Milliseconds 200
              $out = $ms.ToArray()
              Say ("{0} exit={1} (0x{2:x8}) stdout_len={3}" -f $label, $p.ExitCode, $p.ExitCode, $out.Length)
              Say "$label stdout_hex(first 200)= $(Hex $out 200)"
              Say "$label stderr= $(($err.Result -replace '[\r\n]', ' ').Substring(0, [Math]::Min(300, $err.Result.Length)))"
            } catch { Say "$label start failed: $_" } finally { $p.Dispose() }
          }
          $bytes = [IO.File]::ReadAllBytes($com)
          Say "file size=$($bytes.Length) sha256=$((Get-FileHash -LiteralPath $com -Algorithm SHA256).Hash.ToLowerInvariant())"
          Say "head_hex(64)= $(Hex $bytes 64)"
          $pe = [BitConverter]::ToUInt32($bytes, 60)
          Say "e_lfanew=$pe"
          if ($pe -lt $bytes.Length - 248) {
            Say ("PE sig=0x{0:x8} machine=0x{1:x4} sections={2} opt_magic=0x{3:x4}" -f [BitConverter]::ToUInt32($bytes, $pe), [BitConverter]::ToUInt16($bytes, $pe + 4), [BitConverter]::ToUInt16($bytes, $pe + 6), [BitConverter]::ToUInt16($bytes, $pe + 24))
            Say ("entry_rva=0x{0:x8} image_base=0x{1:x16} size_of_image=0x{2:x8} subsystem={3} dll_chars=0x{4:x4}" -f [BitConverter]::ToUInt32($bytes, $pe + 40), [BitConverter]::ToUInt64($bytes, $pe + 48), [BitConverter]::ToUInt32($bytes, $pe + 80), [BitConverter]::ToUInt16($bytes, $pe + 92), [BitConverter]::ToUInt16($bytes, $pe + 94))
            $nsec = [BitConverter]::ToUInt16($bytes, $pe + 6); $sec = $pe + 24 + [BitConverter]::ToUInt16($bytes, $pe + 20)
            for ($i = 0; $i -lt [Math]::Min($nsec, 16); $i++) {
              $o = $sec + 40 * $i
              Say ("section {0} vsize=0x{1:x} va=0x{2:x} rawsize=0x{3:x} raw=0x{4:x} chars=0x{5:x8}" -f ([Text.Encoding]::ASCII.GetString($bytes, $o, 8).TrimEnd([char]0)), [BitConverter]::ToUInt32($bytes, $o + 8), [BitConverter]::ToUInt32($bytes, $o + 12), [BitConverter]::ToUInt32($bytes, $o + 16), [BitConverter]::ToUInt32($bytes, $o + 20), [BitConverter]::ToUInt32($bytes, $o + 36))
            }
          }
          $exe = Join-Path $PWD 'diagnostics/unisacc.exe'
          Copy-Item $com $exe
          Run-Raw $com @('--version') 'direct.com --version'
          Run-Raw $exe @('--version') 'direct.exe --version'
          Run-Raw $exe @('--help') 'direct.exe --help'
          Run-Raw 'cmd.exe' @('/c', $exe, '--version') 'cmd --version'
          Run-Raw 'pwsh' @('-NoProfile', '-Command', "& '$exe' --version") 'pwsh --version'
          # 1. console inherited (no redirection) vs pipe vs file: the .NET runs above are pipes.
          $f = Join-Path $diag 'ver-file.txt'
          cmd.exe /c "`"$exe`" --version > `"$f`" 2>&1"; Say "cmd >file --version exit=$LASTEXITCODE"
          if (Test-Path $f) { Say "cmd >file stdout_hex= $(Hex ([IO.File]::ReadAllBytes($f)) 200)" }
          $p = Start-Process -FilePath $exe -ArgumentList '--version' -NoNewWindow -Wait -PassThru; Say "console-inherited --version exit=$($p.ExitCode) (0x$('{0:x8}' -f $p.ExitCode))"
          # 2. argv0 quoting: cmd passes the bare path, .NET quotes it.
          Push-Location $diag; cmd.exe /c "unisacc.exe --version > ver-bare.txt 2>&1"; Say "cmd bare-argv0 --version exit=$LASTEXITCODE"; if (Test-Path ver-bare.txt) { Say "bare stdout_hex= $(Hex ([IO.File]::ReadAllBytes((Join-Path $diag 'ver-bare.txt'))) 200)" }; Pop-Location
          # 3. a PE the candidate cross-compiled on Linux (not from this runner), under a pipe.
          $hi = Join-Path $PWD 'tests/cases/ci-hi-win-x86_64.exe'
          if (Test-Path $hi) { Run-Raw $hi @() 'linux-cross-compiled hi.exe (pipe)' } else { Say "linux-cross-compiled hi.exe: NOT_RUN (tests/cases/ci-hi-win-x86_64.exe not in this commit)" }
          # 6. argv: a unique argument. If ZZQQ shows in the output, argv reached unisacc's option parser
          #    and the bad bytes come after it; if the output is still pool literals, the pointer/pool base is off.
          Run-Raw $exe @('ZZQQ') 'direct.exe ZZQQ'
          Run-Raw $exe @('--version', 'ZZQQ') 'direct.exe --version ZZQQ'
          # 7. a PE cross-compiled on Linux by this candidate that prints argc and argv[1]: does argv arrive intact?
          $av = Join-Path $PWD 'tests/cases/ci-argv-win-x86_64.exe'
          if (Test-Path $av) { Run-Raw $av @('ZZQQ') 'linux-cross-compiled argv.exe ZZQQ (pipe)' } else { Say "argv.exe: NOT_RUN (tests/cases/ci-argv-win-x86_64.exe not in this commit)" }
          # 8. side by side in the same pwsh: the small PE and unisacc --version, stdout/stderr lengths.
          if (Test-Path $hi) { Run-Raw $hi @() 'side-by-side hi.exe' }
          Run-Raw $exe @('--version') 'side-by-side unisacc --version'
          # 9. the argv self-proof probe (tests/cases/ci-argvprobe-win-x86_64.cx, cross-compiled on Linux).
          $ap = Join-Path $PWD 'tests/cases/ci-argvprobe-win-x86_64.exe'
          if (Test-Path $ap) { Run-Raw $ap @('A', 'B') 'argvprobe.exe A B (pipe)' } else { Say "argvprobe.exe: NOT_RUN (not in this commit)" }
          # 10. was the image relocated? Compare the PE header ImageBase with the base Windows actually mapped.
          # 11. fixed-base hypothesis: the same images with DllCharacteristics 0x8160 -> 0x8100 (no DYNAMIC_BASE,
          #     no HIGH_ENTROPY_VA). If argv and --version come out right, the missing relocations are the cause.
          $apf = Join-Path $PWD 'tests/cases/ci-argvprobe-win-x86_64-fixedbase.exe'
          if (Test-Path $apf) { Run-Raw $apf @('A', 'B') 'fixedbase argvprobe.exe A B (pipe)' } else { Say "fixedbase argvprobe: NOT_RUN (not in this commit)" }
          # The candidate APE is itself a valid PE: patch a copy in place, never committed.
          $uf = Join-Path $diag 'unisacc-fixedbase.exe'
          $fb = [IO.File]::ReadAllBytes($com); $pe = [BitConverter]::ToUInt32($fb, 60); $at = $pe + 24 + 70
          $was = [BitConverter]::ToUInt16($fb, $at)
          if ([BitConverter]::ToUInt32($fb, $pe) -ne 0x4550 -or $was -ne 0x8160) {
            Say ("fixedbase unisacc: NOT_RUN (PE sig or DllCharacteristics at 0x{0:x} is 0x{1:x4}, expected 0x8160)" -f $at, $was); $uf = $null
          } else {
            $fb[$at] = 0x00; $fb[$at + 1] = 0x81; [IO.File]::WriteAllBytes($uf, $fb)
            $back = [IO.File]::ReadAllBytes($uf)
            if ($back.Length -ne $fb.Length -or [BitConverter]::ToUInt16($back, $at) -ne 0x8100) { Say 'fixedbase unisacc: NOT_RUN (patch did not read back)'; $uf = $null }
            else { Say ("fixedbase unisacc: DllCharacteristics at 0x{0:x} 0x8160 -> 0x8100, size {1}" -f $at, $back.Length) }
          }
          if ($uf) {
            Run-Raw $uf @('--version') 'fixedbase unisacc --version'
            $hc = Join-Path $diag 'hello-fb.c'; [IO.File]::WriteAllText($hc, "#include <stdio.h>`nint main(void){puts(`"candidate-hello`");return 0;}`n")
            $ho = Join-Path $diag 'hello-fb.exe'
            Run-Raw $uf @('-o', $ho, $hc) 'fixedbase unisacc -o hello'
            if (Test-Path $ho) { Run-Raw $ho @() 'fixedbase hello.exe' } else { Say 'fixedbase hello.exe: not produced' }
            Run-Raw $uf @('tests/run.cx', '--', '--smoke') 'fixedbase unisacc smoke'
          }
          foreach ($img in @($ap, $exe, $apf, $uf)) {
            if (!$img) { continue }
            if (!(Test-Path $img)) { continue }
            try {
              $b = [IO.File]::ReadAllBytes($img); $pe = [BitConverter]::ToUInt32($b, 60)
              $hdr = [BitConverter]::ToUInt64($b, $pe + 48); $dll = [BitConverter]::ToUInt16($b, $pe + 94)
              $rd = [BitConverter]::ToUInt32($b, $pe + 24 + 112 + 40); $rs = [BitConverter]::ToUInt32($b, $pe + 24 + 112 + 44)
              $p = Start-Process -FilePath $img -ArgumentList 'A' -PassThru -WindowStyle Hidden -RedirectStandardOutput (Join-Path $diag 'base.out') -RedirectStandardError (Join-Path $diag 'base.err')
              $mapped = '-'; for ($i = 0; $i -lt 40 -and $mapped -eq '-'; $i++) { try { $m = $p.MainModule; if ($m) { $mapped = ('0x{0:x16}' -f $m.BaseAddress.ToInt64()) } } catch { Start-Sleep -Milliseconds 25 } }
              if (!$p.HasExited) { $p.Kill() }
              Say ("image {0}: header ImageBase=0x{1:x16} mapped={2} DllCharacteristics=0x{3:x4} reloc_dir rva=0x{4:x} size={5}" -f (Split-Path $img -Leaf), $hdr, $mapped, $dll, $rd, $rs)
            } catch { Say "image $(Split-Path $img -Leaf): base probe failed: $_" }
          }
          # 4. the previous release's APE through the same probes: not fetched; nothing is published for it.
          Say "previous-release APE: NOT_RUN (no private source on the runner; publishing it is out of scope)"
          # 5. WER crash records for unisacc (EventID 1000, Application log).
          try {
            $ev = Get-WinEvent -FilterHashtable @{LogName = 'Application'; Id = 1000} -MaxEvents 20 -ErrorAction Stop | Where-Object { $_.Message -match 'unisacc|hello' } | Select-Object -First 5
            if ($ev) { foreach ($e in $ev) { Say "WER: $(($e.Message -replace '[\r\n]+', ' | ').Substring(0, [Math]::Min(600, $e.Message.Length)))" } } else { Say 'WER: no EventID 1000 record names unisacc or hello' }
          } catch { Say "WER: unavailable ($_)" }
          # ---- drive-letter include probes (DRV lines), diagnostic only ----
          Say ("TEMPENV env:TEMP='{0}' GetTempPath='{1}'" -f $env:TEMP, [IO.Path]::GetTempPath())
          if ($env:TARGET -ceq 'win/arm64') {
            $drvExe = Join-Path $PWD 'out/slice-win-arm64.exe'
            $slicePath = Join-Path $PWD 'slice/slice-win-arm64'
            if (!(Test-Path -LiteralPath $drvExe) -and (Test-Path -LiteralPath $slicePath)) { New-Item -ItemType Directory -Force -Path out | Out-Null; Copy-Item -LiteralPath $slicePath $drvExe }
            $env:UNISA_CONTAINER = Join-Path $PWD 'slice/pkg.bin'
          } else { $drvExe = $com }
          function Drv-Run([string]$name, [string[]]$a, [string]$dir) {
            if (!(Test-Path -LiteralPath $drvExe)) { Say "DRV $name rc=NOT_RUN stderr=no executable for this cell"; return $null }
            $info = [Diagnostics.ProcessStartInfo]::new(); $info.FileName = $drvExe; $info.UseShellExecute = $false
            $info.RedirectStandardOutput = $true; $info.RedirectStandardError = $true; $info.WorkingDirectory = $dir
            foreach ($x in $a) { $info.ArgumentList.Add($x) }
            $p = [Diagnostics.Process]::new(); $p.StartInfo = $info
            try {
              [void]$p.Start(); $o = $p.StandardOutput.ReadToEndAsync(); $e = $p.StandardError.ReadToEndAsync()
              if (!$p.WaitForExit(55000)) { $p.Kill($true); Say "DRV $name rc=124 stderr=timeout"; return $null }
              Say ("DRV {0} rc={1} stderr={2}" -f $name, $p.ExitCode, (($e.Result -replace '[\r\n]+', ' ').Trim()))
              return $o.Result
            } catch { Say "DRV $name rc=START_FAILED stderr=$_"; return $null } finally { $p.Dispose() }
          }
          $tmp = $env:TEMP
          $fwd = $tmp.Replace('\', '/')
          $bsl = $tmp.Replace('\', '\\')
          [IO.File]::WriteAllText((Join-Path $tmp 'dh.h'), "#define DH 7`n")
          [IO.File]::WriteAllText((Join-Path $tmp 'dc.c'), "#include `"$fwd/dh.h`"`nint main(void){return DH;}`n")
          [IO.File]::WriteAllText((Join-Path $tmp 'dc2.c'), "#include `"$bsl\\dh.h`"`nint main(void){return DH;}`n")
          [IO.File]::WriteAllText((Join-Path $tmp 'dc3.c'), "#include `"dh.h`"`nint main(void){return DH;}`n")
          foreach ($n in @('dc', 'dc2', 'dc3')) {
            $o = Drv-Run "$n-E" @('-E', "$n.c") $tmp
            if ($o) { Say ("DRV {0}-E stdout_head={1}" -f $n, (($o -replace '[\r\n]+', ' ')).Substring(0, [Math]::Min(120, $o.Length))) }
          }
          # smoke again (read-only) to capture the include path it complains about, then look at the file system.
          $sm = Drv-Run 'smoke-rerun' @('tests/run.cx', '--', '--smoke') $PWD.Path
          Say 'CXIF_LIST begin'
          Get-ChildItem $env:TEMP -Filter 'ua-cxif-*.h' -ErrorAction SilentlyContinue | ForEach-Object { Say ("CXIF_FILE {0} {1}" -f $_.Name, $_.Length) }
          Say 'CXIF_LIST end'
          $m = [regex]::Matches(($sm + ' ' + (Get-Content $log -Raw)), 'no such file for #include "([^"]+)"')
          foreach ($mm in $m) { $pp = $mm.Groups[1].Value; Say ("CXIF_EXISTS {0} {1}" -f $pp, (Test-Path -LiteralPath $pp)) }
          if ($m.Count -eq 0) { Say 'CXIF_EXISTS (no include path found in smoke output) False' }
          Get-Content $log | Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always() && matrix.os == 'win'
        with:
          name: diagnostics-${{ matrix.os }}-${{ matrix.arch }}
          path: diagnostics/*.txt
          if-no-files-found: warn
          retention-days: 30
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: evidence-${{ matrix.os }}-${{ matrix.arch }}
          path: evidence/
          if-no-files-found: warn
          retention-days: 30
  report:
    needs: [fetch, candidate]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.commit }}
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: candidate-ape
          path: candidate
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: evidence-*
          path: evidence
          merge-multiple: true
      - name: Build the evidence table; its exit is the verdict
        shell: bash
        run: |
          set -eu
          got=$(sha256sum candidate/unisacc.com | cut -d' ' -f1)
          if [ "$got" != "$APE_SHA" ]; then echo "::error::host hash $got, expected $APE_SHA"; exit 1; fi
          cp candidate/unisacc.com ./unisacc.com
          chmod +x ./unisacc.com
          set +e
          sh ./unisacc.com tests/candidate-qualify.cx -- aggregate "$APE_SHA" "$COMMIT" evidence evidence/table.md
          rc=$?
          set -e
          if [ -f evidence/table.md ]; then cat evidence/table.md >> "$GITHUB_STEP_SUMMARY"; fi
          exit "$rc"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: candidate-native-evidence
          path: evidence/
          if-no-files-found: warn
          retention-days: 90
