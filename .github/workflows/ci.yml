name: ci

# The point of the Linux job is not "the tests pass" -- it is that the ELF we
# emit is a REAL program on a platform we cannot test from the dev machine.
# Until this ran, five of the six targets were only ever verified structurally.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: construct weights and check every stage
        run: |
          python3 -m unisa build-weights
          python3 -m unisa acc

      - name: the emitted ELF actually runs
        run: |
          set -e
          for e in hello fact fib ptr struct do switch; do
            python3 -m unisa compile examples/$e.c -o /tmp/$e \
              --target lnx/x86_64 --drive built
            chmod +x /tmp/$e
            got=$(/tmp/$e); code=$?
            want=$(python3 -m unisa run examples/$e.c --target lnx/x86_64 --drive built)
            echo "  $e -> '$got' (exit $code)"
            [ "$got" = "$want" ] || { echo "MISMATCH: want '$want'"; exit 1; }
          done

      - name: suites
        run: ./tests/all.sh

      - name: an external corpus we did not write
        run: ./tests/corpus.sh

  macos:
    # macos-13 is Intel, so it is the only place osx/x86_64 is ever executed;
    # macos-14/15 are Darwin 23/24 against the dev machine's Darwin 25, which
    # is how the dyld crash in I-15 was pinned down.
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-13, macos-14, macos-15]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 -m unisa build-weights

      - name: what this host thinks of our Mach-O
        continue-on-error: true
        run: |
          sw_vers; uname -m
          python3 -m unisa compile examples/hello.c -o /tmp/hello \
            --target osx/arm64 --drive built
          chmod +x /tmp/hello
          codesign -f -s - /tmp/hello
          set +e
          /tmp/hello; echo "plain exit=$?"
          echo "--- dyld ---"
          DYLD_PRINT_SEGMENTS=1 DYLD_PRINT_LIBRARIES=1 /tmp/hello 2>&1 | head -40
          echo "--- lldb ---"
          lldb --batch -o 'run' -o 'bt all' -o 'register read pc sp x0' \
               -o 'disassemble --pc --count 8' -o 'quit' /tmp/hello 2>&1 | head -60

      - run: ./tests/all.sh
