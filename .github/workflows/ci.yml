name: ci

# The point of the Linux job is not "the tests pass" -- it is that the ELF we
# emit is a REAL program on a platform we cannot test from the dev machine.
# Until this ran, five of the six targets were only ever verified structurally.

# This repository is PUBLIC, so hosted runners are free -- which is why it is
# public.  It was parked for a while when it was private: a push-triggered
# matrix of one Linux and two macOS jobs, the macOS ones billing at ten times
# the Linux rate, exhausted the organisation's Actions budget in a single
# session.
#
# It is a SAFETY NET, not the test loop.  Test here first -- `tests/all.sh`
# covers macOS natively, `tests/linux.sh` runs the whole suite in the local
# Linux VM, and the Windows targets execute in the local UTM machine via
# `tests/crossnative.sh` -- and let CI be the second opinion on a machine
# nobody has been editing.
# Since v0.0.10 this full matrix is a scheduled/manual safety net only. Pushes run the
# fast release-check.yml; local gates stay the authority. (The owner ruled 2026-09-29
# that a 30-minute full matrix must never sit between a sealed candidate and signing.)
on:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * 1'

jobs:
  linux:
    # Both Linux architectures GitHub hosts run the full suite natively (R12-3 ③);
    # the sealed candidate (TOOLS_UA) is pulled by digest on each.
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # warn/diag require real corpus input, including in a fresh checkout.
      - name: prepare pinned external C corpus
        run: |
          # The child shell expands its own variables.
          # shellcheck disable=SC2016
          python3 tests/bound.py 45 sh -eu -c '
            git init -q corpus/c-testsuite
            git -C corpus/c-testsuite remote add origin https://github.com/c-testsuite/c-testsuite.git
            python3 tests/bound.py 30 git -C corpus/c-testsuite fetch -q --depth 1 origin 5c7275656d751de0e68b2d340a95b5681858ed07
            git -C corpus/c-testsuite checkout -q --detach FETCH_HEAD
            test "$(git -C corpus/c-testsuite rev-parse HEAD)" = 5c7275656d751de0e68b2d340a95b5681858ed07
          '

      - name: prepare pinned external library fixtures
        run: |
          # Each library fetch is independently bounded; tests do not fetch.
          for spec in 'crypto-algorithms|https://github.com/B-Con/crypto-algorithms.git|cfbde48414baacf51fc7c74f275190881f037d32' 'tiny-AES-c|https://github.com/kokke/tiny-AES-c.git|23856752fbd139da0b8ca6e471a13d5bcc99a08d' 'tiny-regex-c|https://github.com/kokke/tiny-regex-c.git|f2632c6d9ed25272987471cdb8b70395c2460bdb'; do
            # shellcheck disable=SC2016
            python3 tests/bound.py 45 sh -eu -c '
              name=${1%%|*}; rest=${1#*|}; url=${rest%%|*}; commit=${rest##*|}
              git init -q "corpus/$name"
              git -C "corpus/$name" remote add origin "$url"
              python3 tests/bound.py 30 git -C "corpus/$name" fetch -q --depth 1 origin "$commit"
              git -C "corpus/$name" checkout -q --detach FETCH_HEAD
              test "$(git -C "corpus/$name" rev-parse HEAD)" = "$commit"
            ' _ "$spec"
          done

      - name: construct weights and check every stage
        run: |
          python3 tests/bound.py 55 python3 -m unisa build-weights
          python3 tests/bound.py 55 python3 -m unisa acc

      - name: the emitted ELF actually runs
        run: |
          set -e
          for e in hello fact fib ptr struct 'do' switch; do
            python3 tests/bound.py 30 python3 -m unisa compile examples/$e.c -o /tmp/$e \
              --target lnx/x86_64 --drive built
            chmod +x /tmp/$e
            got=$(python3 tests/bound.py 8 /tmp/$e); code=$?
            want=$(python3 tests/bound.py 15 python3 -m unisa run examples/$e.c --target lnx/x86_64 --drive built)
            echo "  $e -> '$got' (exit $code)"
            [ "$got" = "$want" ] || { echo "MISMATCH: want '$want'"; exit 1; }
          done

      - name: pull the sealed candidate by digest (tools suites use it as TOOLS_UA)
        continue-on-error: true
        env:
          GHCR_TOKEN: ${{ github.token }}
        run: |
          set -eu
          [ -f release/candidate.json ] || exit 0
          ref=$(python3 -c 'import json;print(json.load(open("release/candidate.json"))["ref"])')
          sha=$(python3 -c 'import json;print(json.load(open("release/candidate.json"))["unisacc_com_sha256"])')
          curl -sSL https://github.com/oras-project/oras/releases/download/v1.2.0/oras_1.2.0_linux_amd64.tar.gz | tar -xz oras && chmod +x oras
          printf '%s' "$GHCR_TOKEN" | ./oras login ghcr.io -u "${{ github.actor }}" --password-stdin
          mkdir -p candidate && ./oras pull "$ref" --output candidate
          [ "$(sha256sum candidate/unisacc.com | cut -d' ' -f1)" = "$sha" ] && chmod +x candidate/unisacc.com
      - name: suites
        run: |
          set -e
          python3 tests/bound.py 10 python3 tests/ciplancheck.py
          python3 tests/bound.py 10 python3 tests/ci_shard_plan.py
          python3 tests/bound.py 10 python3 tests/opt_partition_check.py
          # Acceptance entries remain first and serial: they write weights.
          # Every later entry has the same bounded, explicit input shard.
          python3 tests/bound.py 10 ./tests/all.sh --list > /tmp/unisacc-ci-plan
          logs=$(mktemp -d); pids=(); batch=(); bad=0
          export APE_STATE="$logs/ape" ACCEPT_STATE="$logs/accept" SELFHOST_STATE="$logs/selfhost"
          # tools* compile third-party libraries; with a sealed candidate the product does
          # it in milliseconds (tools11 alone took 41–50 s through the Python front end).
          if [ -f candidate/unisacc.com ]; then export TOOLS_UA="$PWD/candidate/unisacc.com"; fi
          drain() {
            for pid in "${pids[@]}"; do wait "$pid" || true; done
            for name in "${batch[@]}"; do
              cat "$logs/$name.log"
              [ "$(cat "$logs/$name.rc")" = 0 ] || bad=1
            done
            pids=(); batch=()
          }
          while IFS= read -r suite; do
            # Acceptance modifies generated inputs and must stay serial.
            case "$suite" in acceptance*|ape|selfhost-prepare-*) drain;; esac
            (
              # 55s suite ceiling leaves 5s for readiness and reporting.
              set +e
              python3 tests/bound.py 60 env SUITE_LIMIT=55 JOBS=1 FETCH=0 ./tests/all.sh --suite "$suite" >"$logs/$suite.log" 2>&1
              echo "$?" >"$logs/$suite.rc"
            ) &
            pids+=("$!"); batch+=("$suite")
            case "$suite" in acceptance*|ape|selfhost-prepare-*) drain;;
              *) [ "${#pids[@]}" -lt 2 ] || drain;; esac
          done < /tmp/unisacc-ci-plan
          drain
          [ "$bad" -eq 0 ]

      - name: an external corpus we did not write
        run: |
          for shard in 1 2 3 4; do
            python3 tests/bound.py 60 env FETCH=0 SHARD="$shard/4" ./tests/corpus.sh
          done

      - name: real library code by other people
        run: |
          for shard in $(seq 1 11); do
            python3 tests/bound.py 60 env FETCH=0 SHARD="$shard/11" ./tests/tools.sh
          done

  macos:
    # macos-14/15 are Darwin 23/24 against the dev machine's Darwin 25, which
    # is how the dyld crash in I-15 was pinned down.  (macos-13 would cover
    # osx/x86_64 natively, but the Intel queue never drains; Rosetta covers
    # that target from the dev machine instead -- tests/crossnative.sh.)
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-14, macos-15, macos-15-intel]   # macos-15-intel: osx/x86_64 natively, not through Rosetta
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # warn/diag require real corpus input, including in a fresh checkout.
      - name: prepare pinned external C corpus
        run: |
          # The child shell expands its own variables.
          # shellcheck disable=SC2016
          python3 tests/bound.py 45 sh -eu -c '
            git init -q corpus/c-testsuite
            git -C corpus/c-testsuite remote add origin https://github.com/c-testsuite/c-testsuite.git
            python3 tests/bound.py 30 git -C corpus/c-testsuite fetch -q --depth 1 origin 5c7275656d751de0e68b2d340a95b5681858ed07
            git -C corpus/c-testsuite checkout -q --detach FETCH_HEAD
            test "$(git -C corpus/c-testsuite rev-parse HEAD)" = 5c7275656d751de0e68b2d340a95b5681858ed07
          '
      - name: prepare pinned external library fixtures
        run: |
          # Each library fetch is independently bounded; tests do not fetch.
          for spec in 'crypto-algorithms|https://github.com/B-Con/crypto-algorithms.git|cfbde48414baacf51fc7c74f275190881f037d32' 'tiny-AES-c|https://github.com/kokke/tiny-AES-c.git|23856752fbd139da0b8ca6e471a13d5bcc99a08d' 'tiny-regex-c|https://github.com/kokke/tiny-regex-c.git|f2632c6d9ed25272987471cdb8b70395c2460bdb'; do
            # shellcheck disable=SC2016
            python3 tests/bound.py 45 sh -eu -c '
              name=${1%%|*}; rest=${1#*|}; url=${rest%%|*}; commit=${rest##*|}
              git init -q "corpus/$name"
              git -C "corpus/$name" remote add origin "$url"
              python3 tests/bound.py 30 git -C "corpus/$name" fetch -q --depth 1 origin "$commit"
              git -C "corpus/$name" checkout -q --detach FETCH_HEAD
              test "$(git -C "corpus/$name" rev-parse HEAD)" = "$commit"
            ' _ "$spec"
          done

      - run: python3 tests/bound.py 55 python3 -m unisa build-weights

      - name: what this host thinks of our Mach-O
        continue-on-error: true
        run: |
          sw_vers; uname -m
          python3 tests/bound.py 30 python3 -m unisa compile examples/hello.c -o /tmp/hello \
            --target osx/arm64 --drive built
          chmod +x /tmp/hello
          python3 tests/bound.py 8 codesign -f -s - /tmp/hello
          set +e
          python3 tests/bound.py 8 /tmp/hello; echo "plain exit=$?"
          echo "--- dyld ---"
          DYLD_PRINT_SEGMENTS=1 DYLD_PRINT_LIBRARIES=1 python3 tests/bound.py 8 /tmp/hello 2>&1 | head -40
          echo "--- lldb ---"
          python3 tests/bound.py 15 lldb --batch -o 'run' -o 'bt all' -o 'register read pc sp x0' \
               -o 'disassemble --pc --count 8' -o 'quit' /tmp/hello 2>&1 | head -60

      - run: |
          set -e
          python3 tests/bound.py 10 python3 tests/ciplancheck.py
          python3 tests/bound.py 10 python3 tests/ci_shard_plan.py
          python3 tests/bound.py 10 python3 tests/opt_partition_check.py
          # Acceptance entries remain first and serial: they write weights.
          # Every later entry has the same bounded, explicit input shard.
          python3 tests/bound.py 10 ./tests/all.sh --list > /tmp/unisacc-ci-plan
          logs=$(mktemp -d); pids=(); batch=(); bad=0
          export APE_STATE="$logs/ape" ACCEPT_STATE="$logs/accept" SELFHOST_STATE="$logs/selfhost"
          # tools* compile third-party libraries; with a sealed candidate the product does
          # it in milliseconds (tools11 alone took 41–50 s through the Python front end).
          if [ -f candidate/unisacc.com ]; then export TOOLS_UA="$PWD/candidate/unisacc.com"; fi
          drain() {
            for pid in "${pids[@]}"; do wait "$pid" || true; done
            for name in "${batch[@]}"; do
              cat "$logs/$name.log"
              [ "$(cat "$logs/$name.rc")" = 0 ] || bad=1
            done
            pids=(); batch=()
          }
          while IFS= read -r suite; do
            # Acceptance modifies generated inputs and must stay serial.
            case "$suite" in acceptance*|ape|selfhost-prepare-*) drain;; esac
            (
              # 55s suite ceiling leaves 5s for readiness and reporting.
              set +e
              python3 tests/bound.py 60 env SUITE_LIMIT=55 JOBS=1 FETCH=0 ./tests/all.sh --suite "$suite" >"$logs/$suite.log" 2>&1
              echo "$?" >"$logs/$suite.rc"
            ) &
            pids+=("$!"); batch+=("$suite")
            case "$suite" in acceptance*|ape|selfhost-prepare-*) drain;;
              *) [ "${#pids[@]}" -lt 2 ] || drain;; esac
          done < /tmp/unisacc-ci-plan
          drain
          [ "$bad" -eq 0 ]
