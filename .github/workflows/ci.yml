name: ci

# The point of the Linux job is not "the tests pass" -- it is that the ELF we
# emit is a REAL program on a platform we cannot test from the dev machine.
# Until this ran, five of the six targets were only ever verified structurally.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: construct weights and check every stage
        run: |
          python3 -m unisa build-weights
          python3 -m unisa acc

      - name: the emitted ELF actually runs
        run: |
          set -e
          for e in hello fact fib ptr struct do switch; do
            python3 -m unisa compile examples/$e.c -o /tmp/$e \
              --target lnx/x86_64 --drive built
            chmod +x /tmp/$e
            got=$(/tmp/$e); code=$?
            want=$(python3 -m unisa run examples/$e.c --target lnx/x86_64 --drive built)
            echo "  $e -> '$got' (exit $code)"
            [ "$got" = "$want" ] || { echo "MISMATCH: want '$want'"; exit 1; }
          done

      - name: suites
        run: ./tests/all.sh

      - name: an external corpus we did not write
        run: ./tests/corpus.sh

  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 -m unisa build-weights

      # Every emitted Mach-O dies with SIGSEGV on macos-14 while the same bytes
      # run on the dev machine (Darwin 25).  Until that is explained this step
      # prints what the loader was given; it must not fail the job.
      - name: what this host thinks of our Mach-O
        continue-on-error: true
        run: |
          sw_vers; uname -m
          python3 -m unisa compile examples/hello.c -o /tmp/hello \
            --target osx/arm64 --drive built
          chmod +x /tmp/hello
          codesign -f -s - /tmp/hello && codesign -dvvv /tmp/hello 2>&1 | head
          otool -hl /tmp/hello | head -80
          set +e
          /tmp/hello; echo "exit=$?"
          ls -l /Users/runner/Library/Logs/DiagnosticReports 2>/dev/null
          cat /Users/runner/Library/Logs/DiagnosticReports/hello*.ips 2>/dev/null | head -60

      - run: ./tests/all.sh
