name: native-cx-contracts
on:
  workflow_dispatch:
    inputs:
      profile:
        description: 'all refuses success while contract coverage is incomplete'
        required: true
        default: all
        type: choice
        options: [all, smoke]
permissions:
  contents: read
jobs:
  native-cx:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/bootstrap-unisacc   # ./unisacc.com is gitignored: the pinned published one
      - name: Run the product directly
        shell: bash
        run: |
          set -eu
          timeout --kill-after=1s 55s sh ./unisacc.com tests/run.cx -- "--${{ inputs.profile }}"
# Development contracts only. This does not certify six native targets,
# signing, a candidate seal or publication. Those obligations remain NOT_READY.
